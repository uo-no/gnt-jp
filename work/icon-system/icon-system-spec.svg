<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#102344}.muted{fill:#52647b}.rule{stroke:#d8e0e9;stroke-width:2}
      .panel{fill:#fff;stroke:#d8e0e9;stroke-width:2}.h1{font:700 34px sans-serif;fill:#102344}
      .h2{font:700 22px sans-serif;fill:#102344}.body{font:17px sans-serif;fill:#243750}
      .small{font:14px sans-serif;fill:#52647b}.swatchLabel{font:700 18px sans-serif;fill:#102344}
      .book{fill:none;stroke:#111;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
      .whiteBook{fill:none;stroke:#fff;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="book" class="book">
      <path d="M -115,-40 L -94,-126 C -55,-145 -16,-143 0,-105 L 0,-5 C -36,-31 -72,-34 -115,-40 Z"/>
      <path d="M 115,-40 L 94,-126 C 55,-145 16,-143 0,-105 L 0,-5 C 36,-31 72,-34 115,-40 Z"/>
      <path d="M -102,5 C -63,-12 -29,-5 0,17 C 29,-5 63,-12 102,5"/>
      <path d="M -82,34 C -51,21 -24,28 0,48 C 24,28 51,21 82,34"/>
      <path d="M -61,59 C -35,49 -16,56 0,70 C 16,56 35,49 61,59"/>
    </g>
    <g id="whiteBook" class="whiteBook">
      <path d="M -115,-40 L -94,-126 C -55,-145 -16,-143 0,-105 L 0,-5 C -36,-31 -72,-34 -115,-40 Z"/>
      <path d="M 115,-40 L 94,-126 C 55,-145 16,-143 0,-105 L 0,-5 C 36,-31 72,-34 115,-40 Z"/>
      <path d="M -102,5 C -63,-12 -29,-5 0,17 C 29,-5 63,-12 102,5"/>
      <path d="M -82,34 C -51,21 -24,28 0,48 C 24,28 51,21 82,34"/>
      <path d="M -61,59 C -35,49 -16,56 0,70 C 16,56 35,49 61,59"/>
    </g>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <text x="48" y="58" class="h1">Bible App アイコンシステム仕様書</text>
  <text x="50" y="92" class="body">同一形状・同一比率。シリーズごとに背景色のみを変更する。</text>
  <text x="1510" y="58" text-anchor="end" class="small">v1.0</text>
  <line x1="48" y1="116" x2="1552" y2="116" class="rule"/>

  <rect x="48" y="142" width="450" height="390" rx="16" class="panel"/>
  <text x="76" y="180" class="h2">1. マスターアイコン</text>
  <rect x="143" y="215" width="260" height="260" rx="44" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <g transform="translate(273 345) scale(0.91)"><use href="#book"/></g>
  <text x="76" y="506" class="body">背景：白 #FFFFFF　／　線：黒 #000000</text>
  <text x="76" y="526" class="small">中央線あり・下部の曲線3本・装飾なし</text>

  <rect x="520" y="142" width="1032" height="390" rx="16" class="panel"/>
  <text x="550" y="180" class="h2">2. シリーズ展開（3色）</text>
  <g transform="translate(710 315)">
    <rect x="-90" y="-105" width="180" height="180" rx="32" fill="#1E3A6D"/>
    <g transform="translate(0 -10) scale(0.58)"><use href="#whiteBook"/></g>
  </g>
  <g transform="translate(1035 315)">
    <rect x="-90" y="-105" width="180" height="180" rx="32" fill="#7A1F2A"/>
    <g transform="translate(0 -10) scale(0.58)"><use href="#whiteBook"/></g>
  </g>
  <g transform="translate(1360 315)">
    <rect x="-90" y="-105" width="180" height="180" rx="32" fill="#173B2D"/>
    <g transform="translate(0 -10) scale(0.58)"><use href="#whiteBook"/></g>
  </g>
  <text x="710" y="420" text-anchor="middle" class="swatchLabel">青｜教父文書</text>
  <text x="710" y="446" text-anchor="middle" class="body">#1E3A6D</text>
  <text x="1035" y="420" text-anchor="middle" class="swatchLabel">赤｜旧約聖書</text>
  <text x="1035" y="446" text-anchor="middle" class="body">#7A1F2A</text>
  <text x="1360" y="420" text-anchor="middle" class="swatchLabel">緑｜新約聖書</text>
  <text x="1360" y="446" text-anchor="middle" class="body">#173B2D</text>
  <text x="550" y="495" class="small">共通ルール：同じSVG形状を使用し、背景色だけを変更する。</text>

  <line x1="48" y1="562" x2="1552" y2="562" class="rule"/>
  <text x="48" y="604" class="h2">3. 形状・余白の基準</text>
  <rect x="48" y="626" width="480" height="218" rx="14" class="panel"/>
  <g transform="translate(190 731) scale(0.58)"><use href="#book"/></g>
  <rect x="88" y="650" width="204" height="164" rx="18" fill="none" stroke="#b8c7d8" stroke-dasharray="6 6" stroke-width="2"/>
  <text x="320" y="676" class="body">・正方形の視覚的中央に配置</text>
  <text x="320" y="710" class="body">・外周余白は約15–20%を目安</text>
  <text x="320" y="744" class="body">・左右ページの輪郭を維持</text>
  <text x="320" y="778" class="body">・中央線と曲線3本を維持</text>
  <text x="320" y="812" class="body">・線端と接合部は丸く滑らかに</text>

  <rect x="550" y="626" width="480" height="218" rx="14" class="panel"/>
  <text x="580" y="666" class="h2">4. 色・コントラスト</text>
  <rect x="580" y="690" width="56" height="36" rx="7" fill="#1E3A6D"/><text x="652" y="713" class="body">教父文書　#1E3A6D</text>
  <rect x="580" y="735" width="56" height="36" rx="7" fill="#7A1F2A"/><text x="652" y="758" class="body">旧約聖書　#7A1F2A</text>
  <rect x="580" y="780" width="56" height="36" rx="7" fill="#173B2D"/><text x="652" y="803" class="body">新約聖書　#173B2D</text>

  <rect x="1052" y="626" width="500" height="218" rx="14" class="panel"/>
  <text x="1082" y="666" class="h2">5. 使用ルール</text>
  <text x="1082" y="705" class="body">✓ 形状・比率・線幅は全シリーズ共通</text>
  <text x="1082" y="740" class="body">✓ シリーズカラーは背景色に適用</text>
  <text x="1082" y="775" class="body">✓ 十字架・文字・枠線などを追加しない</text>
  <text x="1082" y="810" class="body">✓ 小サイズでも識別できるか確認する</text>

  <line x1="48" y1="872" x2="1552" y2="872" class="rule"/>
  <text x="48" y="914" class="h2">6. 使用先と品質チェック</text>
  <g transform="translate(145 1004)">
    <rect x="-52" y="-60" width="104" height="104" rx="24" fill="#1E3A6D"/>
    <g transform="translate(0 -7) scale(0.31)"><use href="#whiteBook"/></g>
  </g>
  <g transform="translate(300 1004)">
    <rect x="-52" y="-60" width="104" height="104" rx="24" fill="#7A1F2A"/>
    <g transform="translate(0 -7) scale(0.31)"><use href="#whiteBook"/></g>
  </g>
  <g transform="translate(455 1004)">
    <rect x="-52" y="-60" width="104" height="104" rx="24" fill="#173B2D"/>
    <g transform="translate(0 -7) scale(0.31)"><use href="#whiteBook"/></g>
  </g>
  <text x="550" y="960" class="body">主な使用先：アプリアイコン／Webファビコン／ブックマーク／ホーム画面</text>
  <text x="550" y="997" class="body">品質確認：1024px・192px・48px・32pxで中央線と3本の曲線を確認</text>
  <text x="550" y="1034" class="body">OSの角丸マスクを考慮し、元データに角丸を二重適用しない</text>
  <rect x="48" y="1090" width="1504" height="70" rx="12" fill="#f3f6fa"/>
  <text x="76" y="1121" class="h2">コンセプト</text>
  <text x="250" y="1121" class="body">ひとつの形で、3つの原典を。</text>
  <text x="250" y="1147" class="small">共通のシンボルと深いシリーズカラーで、一貫性と識別性を両立する。</text>
</svg>