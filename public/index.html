        secEl.className = 'sd-sentence';
        secEl.setAttribute('data-ref', s.ref || '');
        const refText = (s.ref || '').replace(/^\S+\s+\d+:/, '');
        if (laid && laid.words.length) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity;
            for (const w of laid.words) { minX = Math.min(minX, w.x); maxX = Math.max(maxX, w.x + w.w); minY = Math.min(minY, w.y); }
            /* 節番号は他のモードと同様に、図の先頭行の先頭の語の左に置く
               （従来は番号だけの行が図の上に1行あり、その分空白に見えた）。
               SVG内のテキストとして先頭行のベースラインに揃える。 */
            let anchorX = Infinity;
            for (const w of laid.words) { if (w.y === minY) anchorX = Math.min(anchorX, w.x); }
            const vbLeft = Math.min(minX - 18, anchorX - 52);
            const vbRight = maxX + 18;
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('viewBox', `${vbLeft} ${laid.y0 - 36} ${vbRight - vbLeft} ${laid.h + 66}`);
            svg.setAttribute('class', 'role-svg');
            /* 文字サイズは他のモードに合わせ、全ての文で固定倍率にする
               （倍率は描画前に textScale として算出済み）。 */
            const extentW = vbRight - vbLeft;
            const scale = textScale;
            svg.style.width = Math.round(extentW * scale) + 'px';
            svg.style.height = Math.round((laid.h + 66) * scale) + 'px';
            if (refText) {
                const vn = document.createElementNS(NS, 'text');
                vn.setAttribute('class', 'vnum');
                vn.setAttribute('x', String(anchorX - 16));
                vn.setAttribute('y', String(minY));
                vn.setAttribute('text-anchor', 'end');
                vn.textContent = refText;
                svg.appendChild(vn);
            }
            for (const e of laid.edges) {
                const p = document.createElementNS(NS, 'path');
                p.setAttribute('d', RoleReadingLayout.edgePath(e));
                p.setAttribute('class', 'e ' + e.kind);
                svg.appendChild(p);
            }
            laid.words.forEach((w, wi) => {
                const g = document.createElementNS(NS, 'g');
                g.setAttribute('class', 'wn');
                g.setAttribute('data-i', String(wi));
                const ul = document.createElementNS(NS, 'line');
                ul.setAttribute('x1', String(w.x - RoleReadingLayout.PADX));
                ul.setAttribute('x2', String(w.x + w.w + RoleReadingLayout.PADX + (w.ew || 0)));
                ul.setAttribute('y1', String(w.y + 4));
                ul.setAttribute('y2', String(w.y + 4));
                ul.setAttribute('class', 'ul');
                g.appendChild(ul);
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', String(w.x));
                t.setAttribute('y', String(w.y));
                t.textContent = w.text;
                g.appendChild(t);
                const meta = s.tokenMeta.get(w.id);
                if (meta && meta.ref) {
                    g.style.cursor = 'pointer';
                    g.addEventListener('click', function () {
                        const bd = _rkRefToBd.get(meta.ref);
                        if (bd) {
                            _setInspectDataFromElToken(bd);
                            _setStudyTarget(meta.ref, bd.verseId);
                        }
                        openStudyPanel(meta.text, meta.rawMorph, meta.ref, (bd && bd.lemma) || '');
                    });
                }
                svg.appendChild(g);
            });
            secEl.appendChild(svg);
        } else if (refText) {
            /* 図が無い文は従来どおり番号だけの行で示す */
            const refEl = document.createElement('div');
            refEl.className = 'sd-sentence-ref';
            refEl.textContent = refText;
            secEl.appendChild(refEl);
        }
        wrap.appendChild(secEl);
    };
    /* 巨大な文のSVGを一括構築すると初回描画まで画面が固まるため、
       文単位で少しずつ作り、先頭の文から順に表示する。 */
    let _rsi = 0;
    const _buildNextSections = () => {
        if (!wrap.isConnected) return;
        const _t0 = (window.performance && performance.now) ? performance.now() : 0;
        while (_rsi < chapter.sentences.length) {
            _buildRoleSection(chapter.sentences[_rsi], _rsi);
            _rsi++;
            if (_t0 && _rsi < chapter.sentences.length && performance.now() - _t0 > 24) break;
        }
        if (_rsi < chapter.sentences.length) requestAnimationFrame(_buildNextSections);
    };
    _buildNextSections();
}

/* 表示倍率（レイアウト上の22単位 = 他のモードのギリシャ語 --text-body のpx数）。
   読書モード本体と第3層の局所表示で共用する。 */
function _roleTextScale() {
    /* 注意: キャッシュ名を関数名と別にすること（同名だと window._roleTextScale が
       関数自身を指し、計算が走らず倍率が壊れる）。 */
    if (window._roleTextScaleCache == null) {
        let targetPx = 14.4;
        try {
            const cs = getComputedStyle(document.documentElement);
            const v = parseFloat(cs.getPropertyValue('--text-body'));
            const rootPx = parseFloat(cs.fontSize) || 16;
            if (v > 0 && rootPx > 0) targetPx = v * rootPx;
        } catch (_) { /* フォールバック 14.4px */ }
        window._roleTextScaleCache = targetPx / 22;
    }
    return window._roleTextScaleCache;
}

/* bible_data 章トークンのキャッシュ付きローダ（局所表示の japanese 参照用） */
const _bdChapterCache = {};
async function _loadBdChapter(book, chapter) {
    const key = book + '/' + chapter;
    if (key in _bdChapterCache) return _bdChapterCache[key];
    let data = null;
    try {
        const res = await fetch(`../bible_data/nt/${book}/${chapter}.json`);
        if (res.ok) data = await res.json();
    } catch (_) { data = null; }
    _bdChapterCache[key] = data; // null も cache（再 fetch 抑止・静音）
    return data;
}

/* ─────────────────────────────────────────────
   語の役割の局所表示（StudyPanel 第3層）:
   選択中の語が属する文全体の図を、2つのトグルの上の
   枠（パン可能なビューポート）の中に表示する。レイアウト・
   倍率・折り返し・公開ゲートは読書モード本体と同一で、
   初期表示は選択語が枠の中心に来る位置。表示専用。
   ───────────────────────────────────────────── */
async function _buildLocalRelationFrame(ref) {
    const parsed = _flowTreeParseRef(ref);
    if (!parsed) return null;
    if (!window.RoleReadingAdapter || !window.RoleReadingLayoutL3) return null;
    if (window._rkAvailPromise) { try { await window._rkAvailPromise; } catch (_) { /* ゲート側で判定 */ } }
    /* パネル内の枠は幅に合わせる必要がない（パンして見る）ため、読書モード本体の
       デバイス別ゲートは適用しない。章の役割データが公開済みかだけを見る。 */
    const _avail = window._rkAvail && window._rkAvail[parsed.book] && window._rkAvail[parsed.book][parsed.chapter];
    if (!_avail || (!_avail.pc && !_avail.sp)) return null;
    const sr = await _loadSrChapter(parsed.book, parsed.chapter);
    if (!sr) return null;
    const offsets = await _loadRkOffsets(parsed.book);
    /* 表示は bible_data の japanese（読書モード本体と同じ） */
    const bd = await _loadBdChapter(parsed.book, parsed.chapter);
    const jaByRef = new Map();
    if (Array.isArray(bd)) {
        for (const tok of bd) { if (tok && tok.ref && tok.japanese) jaByRef.set(tok.ref, tok.japanese); }
    }
    const chapter = RoleReadingAdapter.buildChapter(sr, offsets, jaByRef);
    let sentence = null, centerId = null;
    for (const s of chapter.sentences) {
        for (const [id, meta] of s.tokenMeta) {
            if (meta && meta.ref === ref) { sentence = s; centerId = id; break; }
        }
        if (sentence) break;
    }
    if (!sentence) return null;
    const scale = _roleTextScale();
    /* 枠はパンして見るので、幅に合わせて無理に折り返さない。
       折り返しなし（右へ流れていく）レイアウトにする
       （ユーザー方針 2026-10-31: 無理に折り返さなくて良い、
       右に逃していって見やすく）。 */
    const result = RoleReadingLayoutL3.layoutChapter([sentence.root], { spWrapW: null });
    const laid = result && result.sentences && result.sentences[0];
    if (!laid || !laid.words.length) return null;
    const words = laid.words, edges = laid.edges;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, center = null;
    for (const w of words) {
        minX = Math.min(minX, w.x); maxX = Math.max(maxX, w.x + w.w);
        minY = Math.min(minY, w.y); maxY = Math.max(maxY, w.y);
        if (w.id === centerId) center = w;
    }
    if (!center) return null;
    /* 線の経路が語より外へはみ出す場合（左端チャネルの分散など）も
       表示範囲に含め、はみ出した線が枠端で切れないようにする。 */
    for (const e of edges) {
        const toks = RoleReadingLayoutL3.edgePath(e).match(/[MLVH]|-?\d+(?:\.\d+)?/g) || [];
        let pcmd = null;
        for (let ti = 0; ti < toks.length; ti++) {
            const tk = toks[ti];
            if (/^[MLVH]$/.test(tk)) { pcmd = tk; continue; }
            const v = parseFloat(tk);
            if (pcmd === 'H') { minX = Math.min(minX, v); maxX = Math.max(maxX, v); }
            else if (pcmd === 'M' || pcmd === 'L') { minX = Math.min(minX, v); maxX = Math.max(maxX, v); ti++; if (pcmd === 'M') pcmd = 'L'; }
        }
    }
    minX -= 18; maxX += 18;
    const top = minY - 40, widthU = maxX - minX, heightU = (maxY - minY) + 70;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `${minX} ${top} ${widthU} ${heightU}`);
    svg.setAttribute('class', 'role-svg');
    svg.style.width = Math.round(widthU * scale) + 'px';
    svg.style.height = Math.round(heightU * scale) + 'px';
    for (const e of edges) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', RoleReadingLayoutL3.edgePath(e));
        p.setAttribute('class', 'e ' + e.kind);
        svg.appendChild(p);
    }
    for (const w of words) {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'wn' + (w.id === centerId ? ' focus' : ''));
        const ul = document.createElementNS(NS, 'line');
        ul.setAttribute('x1', String(w.x - RoleReadingLayoutL3.PADX));
        ul.setAttribute('x2', String(w.x + w.w + RoleReadingLayoutL3.PADX + (w.ew || 0)));
        ul.setAttribute('y1', String(w.y + 4));
        ul.setAttribute('y2', String(w.y + 4));
        ul.setAttribute('class', 'ul');
        g.appendChild(ul);
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', String(w.x));
        t.setAttribute('y', String(w.y));
        t.textContent = w.text;
        g.appendChild(t);
        svg.appendChild(g);
    }
    const frame = document.createElement('div');
    frame.className = 'local-rel-frame';
    frame.appendChild(svg);
    /* 地図式UIの状態: 倍率・ズーム・中心（レイアウト単位、viewBox原点基準） */
    frame._svgEl = svg;
    frame._baseScale = scale;
    frame._zoom = 1;
    frame._widthU = widthU;
    frame._heightU = heightU;
    frame._centerU = { x: center.x + center.w / 2 - minX, y: center.y - top };
    _attachPanScroll(frame);
    /* コントロール（拡大・縮小・選択語へ戻る）: 枠の右下に固定（地図アプリ式） */
    const controls = document.createElement('div');
    controls.className = 'local-rel-controls';
    controls.innerHTML =
        '<button type="button" class="local-rel-btn" data-act="zin" aria-label="拡大" title="拡大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>' +
        '<button type="button" class="local-rel-btn" data-act="zout" aria-label="縮小" title="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>' +
        '<button type="button" class="local-rel-btn" data-act="recenter" aria-label="選択中の語へ戻る" title="選択中の語へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>';
    controls.addEventListener('click', e => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.getAttribute('data-act');
        if (act === 'zin') _setLocalRelZoom(frame, frame._zoom * 1.3);
        else if (act === 'zout') _setLocalRelZoom(frame, frame._zoom / 1.3);
        else if (act === 'recenter') _centerLocalRelationFrame(frame);
    });
    const wrap = document.createElement('div');
    wrap.className = 'local-rel-wrap';
    wrap.appendChild(frame);
    wrap.appendChild(controls);
    wrap._frameEl = frame;
    return wrap;
}

/* ズーム変更: 図の表示倍率だけを変え、選択語が中央に来る位置へ寄せ直す */
function _setLocalRelZoom(frame, z) {
    if (!frame || !frame._svgEl) return;
    if (z < 0.5) z = 0.5;
    if (z > 3) z = 3;
    frame._zoom = z;
    frame._svgEl.style.width = Math.round(frame._widthU * frame._baseScale * z) + 'px';
    frame._svgEl.style.height = Math.round(frame._heightU * frame._baseScale * z) + 'px';
    _centerLocalRelationFrame(frame);
}

/* 地図アプリ式のドラッグ移動: 枠の余白部分を押さえたまま動かすと
   上下左右に移動する（PC は左ボタンを押したまま、モバイルは指で
   押さえたまま）。語や線の上からは開始しない（余白が対象）。
   タッチでも同じ仕組みで動くよう Pointer Events に統一し、
   .local-rel-frame の touch-action: none でブラウザのスクロール
   奪取を防ぐ。移動自体はスクロール位置の変更として行う。 */
function _attachPanScroll(frame) {
    let down = false, sx = 0, sy = 0, sl = 0, st = 0;
    frame.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        /* 余白部分だけを対象にする: フレーム自身か、SVG の地の部分 */
        if (e.target !== frame && e.target !== frame._svgEl) return;
        e.preventDefault();   /* ドラッグ中の文字選択・画像ドラッグを防ぐ */
        down = true; sx = e.clientX; sy = e.clientY; sl = frame.scrollLeft; st = frame.scrollTop;
        try { frame.setPointerCapture(e.pointerId); } catch (_) { /* 任意 */ }
        frame.classList.add('dragging');
    });
    frame.addEventListener('pointermove', e => {
        if (!down) return;
        frame.scrollLeft = sl - (e.clientX - sx);
        frame.scrollTop = st - (e.clientY - sy);
    });
    const end = () => { down = false; frame.classList.remove('dragging'); };
    frame.addEventListener('pointerup', end);
    frame.addEventListener('pointercancel', end);
}

function _centerLocalRelationFrame(frame) {
    if (!frame || !frame._centerU) return;
    const k = frame._baseScale * (frame._zoom || 1);
    frame.scrollLeft = Math.max(0, Math.round(frame._centerU.x * k - frame.clientWidth / 2));
    frame.scrollTop = Math.max(0, Math.round(frame._centerU.y * k - frame.clientHeight / 2));
}

/* 局所図スロットへの注入は Desktop / Mobile で同一処理のため共通化した。
   世代カウンタはスロットごとに保持し、競合時の打ち切りは従来どおりスロット単位。 */
const _relationSlotGen = { 'rn-relation-slot': 0, 'mvv-relation-slot': 0 };
async function _fillRelationSlot(slotId, ref) {
    const slot0 = document.getElementById(slotId);
    if (!slot0) return;
    const myGen = ++_relationSlotGen[slotId];
    slot0.innerHTML = '';
    let frame = null;
    try { frame = await _buildLocalRelationFrame(ref); } catch (_) { frame = null; }
    if (myGen !== _relationSlotGen[slotId]) return;
    const slot = document.getElementById(slotId);
    if (!slot) return;
    slot.innerHTML = '';
    if (frame) { slot.appendChild(frame); _centerLocalRelationFrame(frame._frameEl); }   /* null は空のまま（静寂） */
}

async function _fillRnRelationSlot(ref) { return _fillRelationSlot('rn-relation-slot', ref); }

async function _fillMvvRelationSlot(ref) { return _fillRelationSlot('mvv-relation-slot', ref); }

/**
 * Representation を HTML 文字列に変換する。Renderer Registry（VR-4-B §E で「今回は
 * 導入しない」と判断済み）は導入せず、現時点では kind による分岐で Renderer を
 * 呼ぶだけの薄いラッパーのまま維持する。
 * @param {Object} representation - buildRepresentation() の戻り値
 * @param {Object} [options] - VR-4-C Step 5: wordOrder の場合のみ WordOrderRenderer.render()
 *        へ素通しする（Representation Contract 自体は変更しない）
 * @returns {string}
 */
function renderColumn(representation, options) {
    try {
        if (!representation) return '';
        if (representation.kind === 'wordOrder') {
            return WordOrderRenderer.render(representation, options);
        }
        if (representation.kind === 'translation') {
            return TranslationRenderer.render(representation);
        }
        return ''; // 未実装 kind（syntaxTree 等）
    } catch (_) {
        return '';
    }
}
/* __VR2_SCAFFOLD_END__ */

/**
 * 日本語グロスを品詞・法に応じて自然化する。
 * グロスの末尾をルールベースで変換する。複雑な形態素分析は行わない。
 * 変換できなければ元の gloss をそのまま返す。
 */
function _naturalize(gloss, kind) {
    /* 動詞語幹の末尾を変換するルールテーブル */
    const RULES = {
        'part-pres': [ /* 現在分詞：〜ながら / 〜つつ → 〜ながら */
            [/する$/, 'しながら'], [/する$/, 'しながら'],
            [/いる$/, 'いながら'], [/える$/, 'えながら'],
            [/くる$/, 'きながら'], [/ある$/, 'ありながら'],
            [/([^ん])る$/, '$1ながら'],
            [/つ$/, 'ちながら'],   [/ぬ$/, 'にながら'],
            [/む$/, 'みながら'],   [/ぶ$/, 'びながら'],
            [/う$/, 'いながら'],   [/く$/, 'きながら'],
            [/す$/, 'しながら'],   [/ぐ$/, 'ぎながら'],
        ],
        'part-aor': [ /* アオリスト分詞：〜した（後で） */
            [/する$/, 'した'],     [/いる$/, 'いた'],
            [/える$/, 'えた'],     [/くる$/, 'きた'],
            [/([^ん])る$/, '$1た'],
            [/つ$/, 'った'],       [/ぬ$/, 'んだ'],
            [/む$/, 'んだ'],       [/ぶ$/, 'んだ'],
            [/う$/, 'った'],       [/く$/, 'いた'],
            [/す$/, 'した'],       [/ぐ$/, 'いだ'],
        ],
        'part-perf': [ /* 完了分詞：〜した（状態） */
            [/する$/, 'してきた'], [/いる$/, 'いてきた'],
            [/([^ん])る$/, '$1てきた'],
            [/つ$/, 'ってきた'],   [/む$/, 'んできた'],
        ],
        'inf': [ /* 不定詞：〜すること */
            [/する$/, 'すること'], [/いる$/, 'いること'],
            [/える$/, 'えること'], [/くる$/, 'くること'],
            [/([^ん])る$/, '$1ること'],
            [/つ$/, 'つこと'],    [/ぬ$/, 'ぬこと'],
            [/む$/, 'むこと'],    [/ぶ$/, 'ぶこと'],
            [/う$/, 'うこと'],    [/く$/, 'くこと'],
            [/す$/, 'すこと'],
        ],
        'imp': [ /* 命令法：そのまま（「〜せよ」は重い）*/
            [/する$/, 'せよ'],    [/([^ん])る$/, '$1よ'],
        ],
        'pass': [ /* 受動：〜される */
            [/する$/, 'される'],  [/いる$/, 'いられる'],
            [/([^ん])る$/, '$1られる'],
            [/つ$/, 'たれる'],    [/む$/, 'まれる'],
            [/ぶ$/, 'ばれる'],    [/く$/, 'かれる'],
            [/す$/, 'される'],
        ],
    };

    const rules = RULES[kind] || [];
    for (const [pattern, replacement] of rules) {
        if (pattern.test(gloss)) {
            return gloss.replace(pattern, replacement);
        }
    }
    return gloss; /* 変換できなければ元のまま */
}

/**
 * rawMorph から読書感覚の補助メモ（1行）を生成する。
 * ドロワーに表示するだけなので学術ラベルは使わない。
 * Study タブでは別途詳細が表示される。
 */
function _buildMorphText(rawMorph, pos, parts) {
    if (pos === 'V' && parts[1]) {
        const off  = /^[0-9]/.test(parts[1]) ? 1 : 0;
        const moodCode  = parts[1][off + 2] || '';
        const tenCode   = parts[1][off]     || '';
        const voiCode   = parts[1][off + 1] || '';

        const ptcNote = tenCode === 'A' ? '先行する副詞的動作（先行状況）'
                      : tenCode === 'P' ? '副詞的・形容詞的に同時の状況を描き添えている'
                      : '副詞的・実体的に状況を補っている';
        const MOOD_NOTE = {
            'M': '行動への呼びかけ',
            'P': ptcNote,
            'N': '目的や内容を補っている',
            'S': '願いや目的を含んでいる',
            'I': '事実として語っている',
            'O': '望みを込めた表現',
        };
        const TEN_NOTE = {
            'X': '過去から今も続く状態',
            'A': 'ある出来事として',
            'F': '確かに起きること',
            'P': '今・継続して',
            'I': '続いていた状態',
        };
        const VOI_NOTE = {
            'P': '受けとめる側に',
            'M': '深く関わりながら',
            'D': '深く関わりながら',
        };

        const notes = [];
        if (MOOD_NOTE[moodCode]) notes.push(MOOD_NOTE[moodCode]);
        if (TEN_NOTE[tenCode] && moodCode !== 'N' && moodCode !== 'P') notes.push(TEN_NOTE[tenCode]);
        if (VOI_NOTE[voiCode]) notes.push(VOI_NOTE[voiCode]);
        return notes.join('・') || '動詞';
    } else if (['N','A'].includes(pos) && parts[1]) {
        const base = ['1','2','3'].includes(parts[1][0]) ? parts[1].slice(1) : parts[1];
        const CASE_NOTE = {
            'N': '文の中心にいる', 'G': '〜の、と結びつく',
            'D': '関わりを受ける', 'A': '動作の向かう先', 'V': '呼びかけ'
        };
        const NUM_NOTE = { 'S': '単数', 'P': '複数' };
        const notes = [];
        if (CASE_NOTE[base[0]]) notes.push(CASE_NOTE[base[0]]);
        if (NUM_NOTE[base[1]] === '複数') notes.push('複数で語られている');
        return notes.join('・') || (pos === 'N' ? '名詞' : '形容詞');
    } else if (pos === 'CONJ') {
        return '前後をつなぐことば';
    } else if (pos === 'PREP') {
        return '関係の方向を示す';
    } else if (pos === 'T') {
        return '指し示すことば（冠詞）';
    } else if (['P','R','D'].includes(pos)) {
        return '誰かを指し示している';
    }
    return '';
}
/* __FLOW_CHIP_END__ */

/* ── chip クリック：詳細ドロワーを展開 ── */
/* VR-2 Phase 2: グローバルに現在選択中 chip の tokenId を保持
   （ドロワーから「詳しく見る」するため。配列位置ではなく Token Identity Contract の
   runtime内 Canonical Identity である tokenId で保持する）。 */
let _wlvActiveTokenId = null;

/* ── 口語訳アニメーション helpers ───────────────────────────────────────
   ドロワー開閉に連動して .mvv-inline-translation の高さと透明度を滑らかに変化させる。
   CSS transition（height / opacity / padding / margin-bottom）はモバイルmedia query内で定義済み。
   prefers-reduced-motion 時は transition: none が適用されるためアニメーション不要。
   padding を含めてアニメーションさせる理由: padding-top+padding-bottom が border と合わさると
   box-sizing:border-box 下でも height:0 が padding 分 (≈35px) 下限に留まるため。 */
let _translationExpandHandler = null;

function _collapseInlineTranslation() {
    const mia = document.getElementById('mobile-inspector-area');
    const t = mia && mia.querySelector('.mvv-inline-translation');
    // height が既に '0px' ならアニメーション完了済み（再起動しない）
    if (!t || t.style.height === '0px') return;
    // 進行中のトランジションを現在の視覚位置で中断してから新たに開始する
    t.style.transition = 'none';
    t.style.height = t.offsetHeight + 'px';
    void t.offsetHeight;
    t.style.transition = '';
    void t.offsetHeight;
    t.style.height = '0';
    t.style.opacity = '0';
    t.style.paddingTop = '0';
    t.style.paddingBottom = '0';
    t.style.borderBottomWidth = '0';
    t.style.marginBottom = '0';
}

function _expandInlineTranslation() {
    const mia = document.getElementById('mobile-inspector-area');
    const t = mia && mia.querySelector('.mvv-inline-translation');
    if (!t || !t.style.height) return;  // インライン height なし = 既に自然な高さ
    if (_translationExpandHandler) {
        t.removeEventListener('transitionend', _translationExpandHandler);
        _translationExpandHandler = null;
    }
    // インラインスタイルをすべて除去して offsetHeight（border込み自然高）を計測する
    // scrollHeight は border を含まないため offsetHeight を使う
    t.style.transition = 'none';
    t.style.height = '';
    t.style.paddingTop = '';
    t.style.paddingBottom = '';
    t.style.borderBottomWidth = '';
    void t.offsetHeight;
    const naturalH = t.offsetHeight;  // CSS padding + border を含む自然高
    // アニメーション開始値（height:0, padding:0, border:0）に設定してからトランジションを再開
    t.style.height = '0';
    t.style.paddingTop = '0';
    t.style.paddingBottom = '0';
    t.style.borderBottomWidth = '0';
    void t.offsetHeight;
    t.style.transition = '';
    void t.offsetHeight;
    t.style.height = naturalH + 'px';
    t.style.opacity = '1';
    t.style.paddingTop = '';
    t.style.paddingBottom = '';
    t.style.borderBottomWidth = '';
    t.style.marginBottom = '';
    _translationExpandHandler = function(ev) {
        if (ev.propertyName !== 'height') return;
        t.style.height = '';
        t.removeEventListener('transitionend', _translationExpandHandler);
        _translationExpandHandler = null;
    };
    t.addEventListener('transitionend', _translationExpandHandler);
}

function _clearTranslationInlineStyles(el) {
    if (!el) return;
    if (_translationExpandHandler) {
        el.removeEventListener('transitionend', _translationExpandHandler);
        _translationExpandHandler = null;
    }
    el.style.height = '';
    el.style.opacity = '';
    el.style.paddingTop = '';
    el.style.paddingBottom = '';
    el.style.borderBottomWidth = '';
    el.style.marginBottom = '';
    el.style.transition = '';
}
/* ── ここまで口語訳アニメーション helpers ────────────────────────────── */

/** ドロワーを閉じて chip の選択状態をリセットする。StudyPanel・MVV には触れない。 */
function _wlvDrawerClose() {
    const drawer = document.getElementById('wlv-detail-drawer');
    if (drawer) drawer.classList.remove('visible');
    _syncStudyVerseNav();
    document.querySelectorAll('.wlv-chip').forEach(c => c.classList.remove('active'));
    _wlvActiveTokenId = null;
    const _mia = document.getElementById('mobile-inspector-area');
    if (_mia) _mia.classList.remove('drawer-open');
    _expandInlineTranslation();
}
let _wlvChipData      = [];   /* _buildFlowTabHTML で生成した chip 配列を保持 */
/* Phase VR-4B-5: 現在選択中 chip の scope words（gfBlock/verseBlock/_wlvWordCache の
   優先順位で解決済み）。_mobileInspectorDetail から _fillMvvReadingSlot/_fillMvvSemanticSlot
   へ、_wlvChipClick が解決した scope と同じ words 配列を橋渡しするためのグローバル。 */
let _wlvActiveScopeWords = null;

/* ══════════════════════════════════════════════════════════════════
   Phase ESM-8: Referent Evidence（MVP）
   設計正典: docs/development/verse-representation-design.md 系列（ESM-1〜7監査）

   bible_data の referent フィールド（代名詞・指示詞の照応先、編集済み事実）を
   read-only で転写するだけの最小機能。日本語生成・推論は一切行わない。
   WordOrder Representation（_wordToFlowChip 等）・Reading Engine には触れない。
   ══════════════════════════════════════════════════════════════════ */

/**
 * bible_data の生トークンから ReferentEvidence を生成する（read-only 転写のみ）。
 * 生成条件: referent が存在し、単一 token を指す場合のみ。
 * 生成しない（null）: referent なし・空文字・汎用センチネル(n00000000000)・複数候補。
 * 複数候補（disjunctive）は「不確実な参照を1つに決めない」原則により、
 * 代表値を選ばずそのまま非表示とする（ESM-7 G2 判断: 案B）。
 * @param {Object} rawToken - _wlvChipClick 内の _rawToken（decoded 生token）
 * @returns {{kind:'referentEvidence', tokenId:string, targetTokenId:string, evidence:'annotated'}|null}
 */
function createReferentEvidence(rawToken) {
    try {
        if (!rawToken) return null;
        const tokenId = rawToken.verseId;
        if (!tokenId) return null;
        const raw = (typeof rawToken.referent === 'string') ? rawToken.referent.trim() : '';
        if (!raw) return null;
        const ids = raw.split(/\s+/).filter(Boolean);
        if (ids.length !== 1) return null;               // 複数候補は生成しない（null＝静寂）
        const targetTokenId = ids[0];
        if (!targetTokenId || targetTokenId === 'n00000000000') return null; // 汎用センチネル除外
        return { kind: 'referentEvidence', tokenId, targetTokenId, evidence: 'annotated' };
    } catch (_) {
        return null;
    }
}

/**
 * Phase 2B-2: _cachedElByVerse（初期章）と _appendedChapterCache（追加章全章）を検索し、
 * 指定 tokenId に対応する bible_data.japanese を返す。未発見は null（静寂）。
 * verseId はトークン固有値のため、章をまたいでも誤マッチしない。
 * @param {string|null} targetTokenId
 * @returns {string|null}
 */
function _resolveTokenJaById(targetTokenId) {
    try {
        if (!targetTokenId) return null;
        for (const vNum in _cachedElByVerse) {
            const words = _cachedElByVerse[vNum];
            if (!Array.isArray(words)) continue;
            for (const w of words) {
                if (w && w.verseId === targetTokenId) {
                    const ja = (w.japanese != null) ? String(w.japanese).trim() : '';
                    return ja || null;
                }
            }
        }
        for (const elByVerse of _appendedChapterCache.values()) {
            for (const vNum in elByVerse) {
                const words = elByVerse[vNum];
                if (!Array.isArray(words)) continue;
                for (const w of words) {
                    if (w && w.verseId === targetTokenId) {
                        const ja = (w.japanese != null) ? String(w.japanese).trim() : '';
                        return ja || null;
                    }
                }
            }
        }
        return null;
    } catch (_) {
        return null;
    }
}

/**
 * ReferentEvidence.targetTokenId から表示用の日本語(bible_data.japanese の転写のみ)を解決する。
 * 初期章・追加章の両キャッシュを検索（_resolveTokenJaById 経由）。見つからない場合は null（静寂）。
 * @param {{targetTokenId:string}|null} referentEvidence
 * @returns {string|null}
 */
function _resolveReferentEvidenceText(referentEvidence) {
    try {
        if (!referentEvidence || !referentEvidence.targetTokenId) return null;
        return _resolveTokenJaById(referentEvidence.targetTokenId);
    } catch (_) {
        return null;
    }
}

/* ══════════════════════════════════════════════════════════════════
   Phase ESM-39: Subjref Evidence
   設計正典: docs/specs/LAYER_ARCHITECTURE.md §4「Subjref」（ESM-38-A/B確定仕様）

   bible_data の subjref フィールド（動詞・分詞の（暗示された）主語トークンへの
   参照、編集済み事実）を read-only で転写するだけの最小機能。
   createReferentEvidence()/_resolveReferentEvidenceText() と同型（Referent Evidence
   と補完関係にあるため、Failure Mode・単一候補限定ルールも完全に踏襲する）。
   日本語生成・推論・主語判定ロジックは一切行わない。Frame（A0/A1等）は使用しない。
   ══════════════════════════════════════════════════════════════════ */

/**
 * bible_data の生トークンから SubjrefEvidence を生成する（read-only 転写のみ）。
 * 生成条件: subjref が存在し、単一 token を指す場合のみ。
 * 生成しない（null）: subjref なし・空文字・複数候補。
 * 複数候補は「不確実な参照を1つに決めない」原則（Referent Evidenceと同じ）により
 * 代表値を選ばずそのまま非表示とする。
 * @param {Object} rawToken - _wlvChipClick 内の _rawToken（decoded 生token）
 * @returns {{kind:'subjrefEvidence', tokenId:string, targetTokenId:string, evidence:'annotated'}|null}
 */
function createSubjrefEvidence(rawToken) {
    try {
        if (!rawToken) return null;
        const tokenId = rawToken.verseId;
        if (!tokenId) return null;
        const raw = (typeof rawToken.subjref === 'string') ? rawToken.subjref.trim() : '';
        if (!raw) return null;
        const ids = raw.split(/\s+/).filter(Boolean);
        if (ids.length !== 1) return null;               // 複数候補は生成しない（null＝静寂）
        const targetTokenId = ids[0];
        if (!targetTokenId) return null;
        return { kind: 'subjrefEvidence', tokenId, targetTokenId, evidence: 'annotated' };
    } catch (_) {
        return null;
    }
}

/**
 * SubjrefEvidence.targetTokenId から表示用の日本語(bible_data.japanese の転写のみ)を解決する。
 * _resolveReferentEvidenceText と同型。初期章・追加章の両キャッシュを検索（_resolveTokenJaById 経由）。
 * @param {{targetTokenId:string}|null} subjrefEvidence
 * @returns {string|null}
 */
function _resolveSubjrefEvidenceText(subjrefEvidence) {
    try {
        if (!subjrefEvidence || !subjrefEvidence.targetTokenId) return null;
        return _resolveTokenJaById(subjrefEvidence.targetTokenId);
    } catch (_) {
        return null;
    }
}

function _wlvChipClick(chipEl, tokenId) {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        const step = window.App.onboarding?.getState()?.onboardingStep;
        console.log('[Onboarding]', step);
    }
    const chips = document.querySelectorAll('.wlv-chip');
    chips.forEach(c => c.classList.remove('active'));
    chipEl.classList.add('active');

    const _prevActiveTokenId = _wlvActiveTokenId;  /* 同一chip再タップ判定用 */
    _wlvActiveTokenId = tokenId;

    /* Phase VR-4B-3: chip 取得の優先順位（Interaction Lifecycle是正）。
       複数節が同時に描画されうる面（Greek Flow View / 本文左列）は DOM ノードに個別保存された
       chips[] を最優先で使う。単一節のみ表示するシングルトン面（StudyPanel/Mobile Inspector）は
       _wlvChipCache を使う。どちらにも属さない、またはキャッシュ未設定の場合のみ、最終手段として
       _wlvGetChipData()（Tier 2 rollback）へフォールバックする。
       ★ .verse-pair-right は 'verse-block verse-pair-right' という複合クラスを持つため、
         .closest('.verse-block') は Greek Flow View の chip でも真になる（.gf-verse-block の
         祖先でもある）。そのため .gf-verse-block を必ず先に判定する（順序を変えないこと）。
       VR-2 Phase 2: 配列位置ではなく tokenId 一致で chip を検索する（Token Identity Contract）。
       複数節同時表示時に配列位置がずれて別節の chip を誤って取得するリスクを構造的に排除する。 */
    const gfBlock    = chipEl.closest('.gf-verse-block');
    const verseBlock = chipEl.closest('.verse-block');
    let chip;
    if (gfBlock && gfBlock._flowChips) {
        chip = gfBlock._flowChips.find(c => c.tokenId === tokenId);
    } else if (verseBlock && verseBlock._flowChips) {
        chip = verseBlock._flowChips.find(c => c.tokenId === tokenId);
    } else if (_wlvChipCache && _wlvChipCache.length) {
        chip = _wlvChipCache.find(c => c.tokenId === tokenId);
    } else {
        chip = _wlvGetChipData(tokenId);
    }
    if (!chip) return;

    if (_hlState.multiSelectActive) {
        _hlMultiSelectTap(chipEl, chip);
        return;
    }

    /* ReadingEngine: 生トークン（decoded フィールドを持つ）から改善済み日本語を取得。
       Phase 2: 節トークン配列から ResolveContext を構築して注入する（同期・軽量）。
       Phase VR-4B-5: Representation lifecycle 是正。
       prefer verse-local words stored on DOM representation（gfBlock/verseBlock）;
       _wlvWordCache remains legacy fallback only（シングルトン面専用・複数節同時表示時は
       別節の残骸を指しうるため最終手段としてのみ使う）。
       chip 取得（上記）と同じ優先順位に揃えることで、chip と Inspector 再解決が
       常に同一節を参照するようにする（節取り違え防止・SSOT維持）。
       VR-2 Phase 2: tokenId から findIndex() で一度だけ配列位置を求め、以降はその idx を
       使い回す（find() と indexOf() の二重探索をしない）。_buildReadingContext 等の下流関数は
       実際の配列位置を必要とするため、idx 自体は引き続き使用する（tokenId は「対象を特定する
       ための鍵」、idx は「その対象の文脈上の位置」という別の役割であり、後者は変更しない）。 */
    const _reWords  =
        gfBlock?._flowWords ||
        verseBlock?._flowWords ||
        _wlvWordCache;
    _wlvActiveScopeWords = _reWords;   /* _mobileInspectorDetail 側の橋渡し用 */
    const _reIdx    = _reWords ? _reWords.findIndex(w => w.tokenId === tokenId) : -1;
    const _rawToken = _reIdx !== -1 ? _reWords[_reIdx] : undefined;
    const _reCtx    = _buildReadingContext(_reWords, _reIdx);
    const _reResolved = window.App?.readingEngine?.resolve(_rawToken, _reCtx);
    const _resolvedJa = _reResolved?.japanese;
    /* Stage C P1: StudyPanel 用の表示整形（内部値 jaWord は生のまま保持） */
    const _resolvedJaDisplay = (_resolvedJa && window.App?.PresentationPolicy)
        ? window.App.PresentationPolicy.formatDisplay(
            _resolvedJa, _reResolved.source, _reWords, _reIdx)
        : _resolvedJa;

    /* AppState の inspect を更新
       ★ SSOT: ref は表示専用として保持。ロジックには bookKey / ch / verse を使う。 */
    AppState.inspect.data = {
        greek:    chip.greek,
        strong:   chip.strong,
        jpMorph:  chip.morphText,
        rawMorph: chip.rawMorph,
        lemma:    chip.lemma,
        jaWord:   _resolvedJa || chip.jaWord,
        /* Stage C P1: 表示用整形値（生の jaWord とは別に保持 — SSOT は不変） */
        jaWordDisplay: _resolvedJaDisplay || _resolvedJa || chip.jaWord,
        desc:     (abbottSmithDict && abbottSmithDict[chip.strong.slice(1)]?.description) || '',
        ref:      chip.ref,      // 表示専用（ラベル・URL クエリ文字列のみ）
        bookKey:  chip.bookKey  || '',
        ch:       chip.ch       != null ? chip.ch    : null,
        verse:    chip.verse    != null ? chip.verse  : null,
        language: chip.language || 'grc',
        corpusId: chip.corpusId || '',
        lemmaId:  chip.lemmaId  != null ? chip.lemmaId : null,
        /* Phase ESM-8: Referent Evidence（存在する場合のみ。read-only転写、推論なし） */
        referentEvidence: createReferentEvidence(_rawToken),
        /* Phase ESM-39: Subjref Evidence（存在する場合のみ。read-only転写、推論なし） */
        subjrefEvidence: createSubjrefEvidence(_rawToken),
    };

    if (window.App.storage && chip.strong) {
        window.App.storage.addRecentWord({
            lemma: chip.lemma,
            strong: chip.strong,
            bookKey: chip.bookKey || '',
            chapter: chip.ch != null ? Number(chip.ch) : null,
            verse: chip.verse != null ? Number(chip.verse) : null,
        });
    }

    if (verseBlock) {
        /* 本文を読んでいる最中の chip タップ：Level3 詳細へ。 */
        if (_isActualMobile()) {
            /* E-1D: Mobile では FLOW 本文 chip も MobileVerseView 経路へ統一（Bottom Sheet を出さない）。
               当該節の MVV を開いて（Level2 器・メモ・タイトル・履歴を準備）から Level3 詳細を表示する。
               AppState.toBrowsing は通常の節タップと同じ既存セッタ（selectedVerse を確定＝メモ ref 用）。 */
            const _mvWords = verseBlock._flowWords || _wlvWordCache || [];
            /* VR-2 Phase 2: _mvWords は _reWords と同一とは限らない（gfBlock/verseBlock が
               両方truthyな場合、_reWords は gfBlock 優先だが _mvWords は verseBlock固定のため）。
               既存の優先順位ロジックを変えないため、ここで独立に findIndex() する。 */
            const _mvIdx   = _mvWords.findIndex(w => w.tokenId === tokenId);
            const _mvVNum  = (chip.verse != null) ? chip.verse
                           : ((_mvWords[_mvIdx] && _mvWords[_mvIdx].verse != null) ? _mvWords[_mvIdx].verse : null);
            /* Phase ESM-9/ESM-25/ESM-39: AppState.toBrowsing() は inspect.data 全体を null に
               リセットする（既存仕様・他の呼び出し元があるため変更しない）。_mobileInspectorDetail は
               greek/lemma/rawMorph は関数引数からのフォールバックを持つため reset の影響を
               受けないが、jaWordDisplay/jaWord（Gloss）・strong・referentEvidence・subjrefEvidence は
               AppState.inspect.data からしか読めず reset で失われる（ESM-24で確認済みの構造と同型）。
               Referent Evidence と同じ要領で、失われるフィールドのみ退避し、reset 直後に復元する
               （greek/lemma/rawMorph は引数経由で渡るため対象外＝最小差分）。 */
            const _jaWordDisplayForMobile    = AppState.inspect.data?.jaWordDisplay || null;
            const _jaWordForMobile           = AppState.inspect.data?.jaWord || null;
            const _strongForMobile           = AppState.inspect.data?.strong || null;
            /* StudyPanel parity: lemmaId は Abbott-Smith / 語源 / 使用傾向 / Display Label の
               生成に必要。toBrowsing() で失われるため、他フィールドと同様に退避・復元する。 */
            const _lemmaIdForMobile          = AppState.inspect.data?.lemmaId ?? null;
            const _referentEvidenceForMobile = AppState.inspect.data?.referentEvidence || null;
            const _subjrefEvidenceForMobile  = AppState.inspect.data?.subjrefEvidence || null;
            /* ch: URL chapter 同期（連続章でchipをタップしても selectedVerse.ch が正しく更新されるよう chip.ch を渡す。desktop pathと同じ整合を取る）。 */
            AppState.toBrowsing(_mvVNum, _mvWords, null, chip.ch != null ? Number(chip.ch) : null);
            AppState.inspect.data = {
                jaWordDisplay:    _jaWordDisplayForMobile,
                jaWord:           _jaWordForMobile,
                strong:           _strongForMobile,
                lemmaId:          _lemmaIdForMobile,
                referentEvidence: _referentEvidenceForMobile,
                subjrefEvidence:  _subjrefEvidenceForMobile,
            };
            /* URL state sync: selectedVerse.ch が確定した後に章情報を URL へ反映する。 */
            notifyAppStateChange();
            openMobileVerseView(_mvVNum, _mvWords, null, chip.ch != null ? Number(chip.ch) : null);
            openInspectorDetail(chip.greek, chip.rawMorph, chip.ref, chip.lemma);
            window.App.onboarding?.onWordClicked(chipEl);
            _syncOnboardingActiveFlag();
            return;
        }
        /* Desktop は従来どおり openStudyPanel（openInspectorDetail 経由・挙動不変）。 */
        /* BUG FIX: panelGoBack() が selectedVerse.elWords を参照するため、
           word detail へ入る前に設定する（Mobile path は toBrowsing() で設定済み）。 */
        /* ch: URL chapter 同期（連続章で chip タップしても selectedVerse.ch が正しく更新されるよう chip.ch を渡す）。 */
        AppState.selectedVerse = { vNum: chip.verse ?? null, elWords: _reWords || [], ch: chip.ch != null ? Number(chip.ch) : null };
        AppState.studyOrigin = { surface: _transA, entryPoint: 'wlv' };
        _setStudyTarget(chip.ref, chip.verseId);
        openInspectorDetail(chip.greek, chip.rawMorph, chip.ref, chip.lemma);
        window.App.onboarding?.onWordClicked(chipEl);
        _syncOnboardingActiveFlag();
        return;
    }

    /* パネル内（流れタブ・MVV Level 2 を含む）の chip タップ：ドロワーで軽く確認する。
       Study panel へ進むかどうかは「詳しく見る」ボタン（_wlvStudyBtnClick）に委ねる。 */
    /* 同一 chip の再タップ：ドロワーが開いていれば閉じて戻る（トグル）。 */
    const drawer = document.getElementById('wlv-detail-drawer');
    if (_prevActiveTokenId === tokenId && drawer && drawer.classList.contains('visible')) {
        _wlvDrawerClose();
        return;
    }
    if (drawer) {
        const ddGreek = document.getElementById('wlv-dd-greek');
        const ddReso  = document.getElementById('wlv-dd-resonance');
        if (ddGreek) ddGreek.textContent = chip.greek || '-';
        /* 語義（readingLexicon.lookup().glosses）：chip 切り替え時に前の語義が残らないよう毎回更新 */
        const ddGlosses = document.getElementById('wlv-dd-glosses');
        if (ddGlosses) {
            const _ddGlossArr = chip.lemmaId
                ? window.App?.readingLexicon?.lookup(chip.lemmaId)?.glosses
                : null;
            ddGlosses.textContent = (Array.isArray(_ddGlossArr) && _ddGlossArr.length)
                ? _ddGlossArr.slice(0, 3).join('・') : '';
        }
        /* Phase ESM-18: ドロワーはLayer 1（Greek/Gloss/詳しく見る導線のみ）に限定する。
           resonance文（Wallace Reading Notesと同一生成経路）はLayer 2（StudyPanel）の
           責務のため、ここでは注入しない（_fillWlvResonance の呼び出しを停止）。 */
        if (ddReso) ddReso.textContent = '';
        drawer.classList.add('visible');
        _syncStudyVerseNav();
        const _miaOpen = document.getElementById('mobile-inspector-area');
        if (_miaOpen) _miaOpen.classList.add('drawer-open');
        _collapseInlineTranslation();
    }

    /* onboarding hook（クリックされたchip要素を渡す） */
    window.App.onboarding?.onWordClicked(chipEl);
    _syncOnboardingActiveFlag();
}

/** tokenId → chip データを _wlvWordCache から取得（VR-2 Phase 2: tokenId ベース） */
function _wlvGetChipData(tokenId) {
    if (!_wlvWordCache) return null;
    const idx = _wlvWordCache.findIndex(w => w.tokenId === tokenId);
    if (idx === -1) return null;
    return _wordToFlowChip(_wlvWordCache[idx], idx);
}

/**
 * 「詳しく見る」ボタン：AppState.inspect.data が設定済みなので openStudyPanel を直接呼ぶ
 */
function _wlvConcordanceClick(event) {
    if (event) event.preventDefault();
    const d = AppState.inspect.data;
    if (!d) return false;
    const morph = parseMorphForSearch(d.rawMorph || d.morph || '');
    const qs = new URLSearchParams();
    if (d.greek) qs.set('word', d.greek);
    if (d.lemma) qs.set('lemma', d.lemma);
    if (d.ref) qs.set('ref', d.ref);
    if (morph.pos) qs.set('pos', morph.pos);
    if (morph.tense) qs.set('tense', morph.tense);
    if (morph.mood) qs.set('mood', morph.mood);
    if (morph.voice) qs.set('voice', morph.voice);
    if (morph.pos !== 'V') {
        if (morph.gender) qs.set('gender', morph.gender);
        if (morph.number) qs.set('number', morph.number);
        if (morph.case) qs.set('case', morph.case);
    }
    qs.set('layers', 'lemma,morph');
    qs.set('tool', 'search');
    window.open('search-tool.html?' + qs.toString(), '_blank', 'noopener');
    return false;
}

function _wlvStudyBtnClick() {
    if (!AppState.inspect.data) return;
    const { greek, rawMorph, ref, lemma, strong } = AppState.inspect.data;

    /* word-flow を depth stack に追加（deep-reading の前に挿入）*/
    const stack = AppState.depth.stack;
    const top = stack[stack.length - 1];
    if (!top || top.type !== 'word-flow') {
        pushDepth({
            type:   'word-flow',
            label:  greek,
            strong: String(strong || ''),
        });
    }

    AppState.studyOrigin = { surface: _transA, entryPoint: 'wlv' };
    _setStudyTarget(AppState.inspect.data?.ref, AppState.inspect.data?.verseId);
    openInspectorDetail(greek, rawMorph, ref, lemma);
}

/**
 * openInspectorDetail — 単語詳細（Level3）表示の単一入口（Adapter Layer / Phase C-2）。
 *
 * chip 経路の Level3 遷移はこの関数を経由し、Desktop / Mobile の振り分けをここに閉じ込める。
 *   Desktop → openStudyPanel()（従来どおり Bottom Sheet）
 *   Mobile → #mobile-inspector-area 内で詳細表示（MobileVerseView 経路に統一）
 *
 * モバイル判定は _isActualMobile()（≤900px + タッチ）を使う。
 * MobileVerseView が開いていないモバイル文脈では、選択中の節コンテキスト
 * （AppState.selectedVerse）があれば先に MobileVerseView を開いてから詳細を表示し、
 * 呼び出し元によらずモバイルの表示経路が1つに揃うようにする。
 * 節コンテキストが無い場合のみ、従来どおり openStudyPanel にフォールバックする
 * （openStudyPanel は削除しない）。
 */
function openInspectorDetail(greek, rawMorph, ref, lemma) {
    const mvv = document.getElementById('mobile-verse-view');
    if (_isActualMobile() && mvv) {
        if (mvv.classList.contains('open')) {
            return _mobileInspectorDetail(greek, rawMorph, ref, lemma);
        }
        const sv = AppState.selectedVerse;
        if (sv && sv.vNum != null && Array.isArray(sv.elWords) && sv.elWords.length) {
            openMobileVerseView(sv.vNum, sv.elWords, null, sv.ch != null ? sv.ch : null);
            return _mobileInspectorDetail(greek, rawMorph, ref, lemma);
        }
    }
    return openStudyPanel(greek, rawMorph, ref, lemma);
}

/**
 * _mobileInspectorDetail — MobileVerseView 下部に単語詳細（Level3）を表示する（Phase C-3）。
 *
 * データは呼び出し直前に既存コード（_wlvChipClick）が設定した AppState.inspect.data を
 * SSOT とし、引数は fallback として使う。表示 HTML の生成は _renderMobileWordDetail に分離。
 * openStudyPanel / Bottom Sheet / AppState には触れない（inspect.data は読むだけ）。
 * 自動生成 Reading Notes（_renderReadingNotes）は移植しない。ユーザー手書きメモ（mvv）のみ末尾に追加。
 */
function _mobileInspectorDetail(greek, rawMorph, ref, lemma) {
    const area = document.getElementById('mobile-inspector-area');
    if (!area) return;
    /* E-1B: Level2（一覧）から詳細へ入る直前に、一覧のスクロール位置を保存（戻る時に復元） */
    if (_mobileVerseInspectorMode === 'list') _mvvInspectorScrollTop = area.scrollTop;
    /* Level3（単語詳細）を描画するので内部状態は detail（戻るボタンが一覧へ戻す判定に使う） */
    _mobileVerseInspectorMode = 'detail';
    /* 語の分析中は節の読書メモを非表示にする。非同期注入されたメモにも CSS で適用する。 */
    const verseArea = document.getElementById('mobile-verse-area');
    if (verseArea) verseArea.classList.add('word-analysis-open');
    const passageNote = document.querySelector('#mobile-verse-area .mvv-passage-note');
    if (passageNote) passageNote.open = false;
    _syncMobileVerseViewBackLabel();
    _syncMobileVerseTitle();
    const d = AppState.inspect.data || {};

    /* Research Panel 導線用 URL（Desktop _renderReadingNotes と同じパラメータ規則）。
       rawMorph の解析は parseMorphForSearch() に委ねる（重複実装しない）。
       AppState.inspect.data から直接読み取り、undefined/null/空文字は省略する。 */
    const _mvvRm = (d.rawMorph || rawMorph) ? parseMorphForSearch(d.rawMorph || rawMorph) : {};
    const _mvvJword = d.jaWordDisplay || d.jaWord || '';

    /* StudyPanel parity: Concordance URL（Desktop _renderReadingNotes と同じパラメータ規則）。 */
    const _mvvConcordQs = new URLSearchParams();
    const _mvvGreek  = d.greek || greek || '';
    const _mvvLemma  = d.lemma || lemma || '';
    const _mvvRef    = d.ref   || ref   || '';
    if (_mvvGreek) _mvvConcordQs.set('word',  _mvvGreek);
    if (_mvvLemma) _mvvConcordQs.set('lemma', _mvvLemma);
    if (_mvvRef)   _mvvConcordQs.set('ref',   _mvvRef);
    if (_mvvRm.pos)    _mvvConcordQs.set('pos',    _mvvRm.pos);
    if (_mvvRm.tense)  _mvvConcordQs.set('tense',  _mvvRm.tense);
    if (_mvvRm.mood)   _mvvConcordQs.set('mood',   _mvvRm.mood);
    if (_mvvRm.voice)  _mvvConcordQs.set('voice',  _mvvRm.voice);
    if (_mvvRm.pos !== 'V') {
        if (_mvvRm.gender) _mvvConcordQs.set('gender', _mvvRm.gender);
        if (_mvvRm.number) _mvvConcordQs.set('number', _mvvRm.number);
        if (_mvvRm.case)   _mvvConcordQs.set('case',   _mvvRm.case);
    }
    _mvvConcordQs.set('layers', 'lemma,morph');
    _mvvConcordQs.set('tool',   'search');
    const _mvvConcordURL = `search-tool.html?${_mvvConcordQs.toString()}`;

    /* StudyPanel parity: Display Label（ReadingLexicon.getDisplayLabel から同期取得）。
       lemmaId は toBrowsing() 退避・復元により保持されている。 */
    const _mvvResolvedId = (d.lemmaId != null) ? d.lemmaId : _resolveLemmaId(d.strong || '');
    const _mvvDisplayLabel = (window.App?.readingLexicon?.getDisplayLabel(_mvvResolvedId)) || _mvvJword || '';

    /* StudyPanel parity: Morphological candidates（Desktop openStudyPanel と同じ経路）。 */
    const _mvvCandidates = getMorphCandidates(d.rawMorph || rawMorph || '', _mvvGreek).alternatives;

    /* StudyPanel parity: Experienced Reader labels（Desktop _renderReadingNotes と同じロジック）。
       AppState.inspect.data からは rawMorph が失われているため、引数の rawMorph を使う。 */
    let _mvvExpLabelHTML = '';
    if (window.App.onboarding?.getState()?.experiencedReader && _mvvRm.pos === 'V') {
        const _labels = [];
        if (typeof classifyMiddleVoice === 'function') {
            const mvc = classifyMiddleVoice(_mvvLemma, _mvvRm.voice);
            if (mvc) _labels.push('中動態として読むこともできます');
        }
        if (typeof detectDivinePassive === 'function' && typeof decodeMorph === 'function') {
            const dp = detectDivinePassive({ word: _mvvGreek, lemma: _mvvLemma, morph: d.rawMorph || rawMorph }, [], decodeMorph);
            if (dp && dp.isDivinePassive) _labels.push('行為者が暗示されています');
        }
        if (_labels.length > 0) {
            _mvvExpLabelHTML = `<div class="rn-exp-labels" data-study-section="explabel">${
                _labels.map(l => `<span class="rn-exp-label">${l}</span>`).join('')
            }</div>`;
        }
    }

    /* 口語訳は Level3 の描画対象外。DOM を退避し、戻る際に再利用する。 */
    const translationNode = area.querySelector('.mvv-inline-translation');
    if (translationNode) {
        _mvvTranslationNode = translationNode;
        translationNode.remove();
    }

    area.innerHTML = _renderMobileWordDetail({
        greek:        _mvvGreek,
        lemma:        _mvvLemma,
        rawMorph:     d.rawMorph || rawMorph || '',
        /* 表示用日本語（Presentation Policy 適用済みを優先） */
        gloss:        _mvvJword,
        displayLabel: _mvvDisplayLabel,
        strong:       d.strong   || '',
        resolvedId:   _mvvResolvedId,
        concordURL:   _mvvConcordURL,
        morphCandidates: _mvvCandidates,
        expLabelHTML: _mvvExpLabelHTML,
    });
    /* Phase D-3B: メモは固定領域 #mobile-verse-note-area にあり、Level3 でも同じ ref を編集する。
       ここでは動的領域に注入しない（Level 遷移で内容・開閉状態を保持するため）。 */

    /* Phase VR-4B-5: Representation lifecycle 是正。
       prefer verse-local words stored on DOM representation（_wlvChipClick が解決した
       _wlvActiveScopeWords）; _wlvWordCache remains legacy fallback only。
       _wlvChipClick と同じ scope の words を使うことで、chip・Inspector詳細・
       このスロットの3者が常に同一節を参照するようにする（節取り違え防止）。 */
    const _scopeWords = _wlvActiveScopeWords || _wlvWordCache;
    /* VR-2 Phase 2: _fillMvvReadingSlot/_fillMvvSemanticSlot は実際の配列位置を必要とする
       （下流関数は変更しない）ため、_wlvActiveTokenId から一度だけ findIndex() して idx を
       求める（find()+indexOf() の二重探索はしない）。 */
    const _scopeIdx = _scopeWords ? _scopeWords.findIndex(w => w.tokenId === _wlvActiveTokenId) : -1;

    /* StudyPanel parity: Reading prose / Phrase / Observation / Evidence を rich HTML で注入。 */
    _fillMvvReadingSlot(_scopeWords, _scopeIdx);
    /* LN 由来の意味グループ表示は一時停止中。データ・関数は保持し、再開条件は docs/DATA_LICENSE.md を参照。 */
    if (LN_RELATED_WORDS_ENABLED) {
        _fillMvvSemanticSlot(_mvvResolvedId, _mvvGreek, d.strong || '');
    }
    /* SF-22: Structure Flow を mobile 語詳細へ非同期注入（fire-and-forget・世代管理）。 */
    _fillMvvFlowSlot(AppState.inspect.data?.ref || ref);
    /* 語の役割の局所表示を非同期注入（fire-and-forget・世代管理）。 */
    _fillMvvRelationSlot(AppState.inspect.data?.ref || ref);
    /* 統語論ラベルを非同期注入（_buildSyntaxLabelHTML を desktop と共用）。 */
    _fillMvvSyntaxSlot(_scopeWords, AppState.inspect.data?.ref || ref);
    /* StudyPanel parity: Usage trends / Etymology / Abbott-Smith を非同期注入。 */
    _fillMvvLevel2Slot(_mvvResolvedId);
}

/* Phase F-3: 語A解析中に語Bへ移動した場合、古い非同期結果の誤注入を防ぐ世代カウンタ。
   Level2 ドロワー用 _wlvResonanceGen とは独立させ、相互キャンセルを避ける。 */
let _mvvReadingGen = 0;

/**
 * _stripHTMLToText — HTML文字列からテキストのみを取り出す変換専用ユーティリティ（Phase ESM-36）。
 * 一時要素はDOMに追加しない（描画・副作用なし、実際の画面には一切現れない）。
 * innerHTMLへの書き込みはこの使い捨て要素に対してのみ行い、実際の表示スロットへは
 * 常に textContent のみを書く（Guard Rule はここでは崩さない）。
 * 入力は既存の生成関数（_escH でエスケープ済み）が返すHTMLのみを想定する。
 */
function _stripHTMLToText(html) {
    try {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return (tmp.textContent || '').trim();
    } catch (_) {
        return '';
    }
}

/**
 * _fillMvvReadingSlot — 常時表示域（#mvv-reading-slot、.mvv-l3-word内）へ
 * 既存 ReadingFormatter 経由の語レベル読書メモを非同期注入する（Phase F-3）。
 * Phase ESM-9: Referent Evidence を統合（デスクトップ _renderReadingNotes と
 * 同じ位置関係＝Wallace文の直後）。ESM-8のモバイルヘッダー表示は廃止済み。
 * Phase ESM-20: Desktop Layer 2（常時表示）と揃えるため、折りたたみ「読みを深める」
 * から常時表示域へ移動。表示条件・生成ロジックは無変更、トグル対象を
 * 「<details>セクション」から「スロット自身」に変えただけ。
 * Phase ESM-36: Phrase Reading（かたまりの読書メモ）を追加。生成は既存
 * _buildPhraseReadingHTML() をそのまま利用し、新しい解析・Projectionは行わない
 * （_getReadingSupportProjection は _buildWordResonanceText と同じキャッシュを再利用するのみ）。
 * 戻り値はHTML（Desktop用）のため、_stripHTMLToText でプレーンテキスト化してから結合する。
 * Phase ESM-39: Subjref Evidence を追加（Referent Evidenceの直後）。生成源は
 * _resolveSubjrefEvidenceText の転写のみで、新しい主語判定ロジックは持たない。
 * Phase ESM-45-B-1: Observation を追加（Phrase Readingの直後・Referent Evidenceの前、
 * Desktop `_renderReadingNotes()` と同じ相対順序）。生成は既存 _buildObservationHTML()
 * をそのまま利用し、新しい解析・Projectionは行わない（Wallace/Phrase Readingと同じ
 * キャッシュを再利用するのみ）。existingTexts には sentence／phraseText を渡し、
 * Desktop側の [wordProseText, phraseReadingHTML] と同じ重複回避目的で使う。
 * 戻り値はHTMLのため、Desktop同様 _naturalizeObservationText() で角括弧引用のみ
 * 表示整形してから、_stripHTMLToText でプレーンテキスト化して結合する。
 *
 * 原則:
 *   - 文章生成は _buildWordResonanceText（＝ReadingFormatter.format/combine）と
 *     _buildPhraseReadingHTML／_buildObservationHTML のみ。ここでは新しい文章を作らない。
 *     Referent Evidence・Subjref Evidence も同様に新しい生成を行わず、
 *     _resolveReferentEvidenceText／_resolveSubjrefEvidenceText の転写のみ。
 *   - Guard Rule は ReadingFormatter 側（assertReadingTextSafe）で保証済み。注入は textContent のみ。
 *   - 該当なし（sentence／phraseText／observationText／referentEvidence／subjrefEvidence
 *     のいずれも無い＝静寂）のときはスロット自身を非表示。いずれか1つでも存在すれば
 *     表示する（ESM-7仕様の考え方を踏襲: 各要素は独立して表示条件を持つ）。
 *   - AppState / storage / URL は触れない。世代カウンタで stale 結果を破棄する。
 */
async function _fillMvvReadingSlot(words, idx) {
    const slot = document.getElementById('mvv-reading-slot');
    if (!slot) return;
    const myGen = ++_mvvReadingGen;
    /* 開始時はいったん空＋非表示（内容が確定するまで見せない） */
    slot.innerHTML = '';
    slot.style.display = 'none';

    /* Desktop _renderReadingNotes と同じ生成経路（ReadingFormatter 統一版）。
       prose/phrase/observation は HTML を生成し、そのまま innerHTML へ注入する
       （既存の _escH + ReadingFormatter の Guard Rule で安全性を保証）。 */
    let wordProseText = null;
    let phraseReadingHTML = '';
    let observationHTML = '';
    try {
        wordProseText = await _buildWordResonanceText(words, idx);
    } catch (_) {
        wordProseText = null;
    }
    try {
        phraseReadingHTML = (await _buildPhraseReadingHTML(words, idx)) || '';
    } catch (_) { phraseReadingHTML = ''; }
    try {
        observationHTML = _naturalizeObservationText(
            (await _buildObservationHTML(words, idx, [wordProseText, phraseReadingHTML])) || ''
        );
    } catch (_) { observationHTML = ''; }
    if (myGen !== _mvvReadingGen) return;   /* 既に別の語へ移動済み → 破棄 */

    /* Desktop と同じ HTML 構造で組み立てる（data-study-section も同じ値）。 */
    const proseHTML = wordProseText
        ? `<div class="rn-prose reading-block" data-study-section="reading"><p class="rn-prose-text reading-prose">${wordProseText}</p></div>`
        : '';

    const _reText = _resolveReferentEvidenceText(AppState.inspect.data?.referentEvidence);
    const referentEvidenceHTML = _reText
        ? `<div class="rn-referent-evidence" data-study-section="referent">この語は「${_escH(_reText)}」を指しています。</div>`
        : '';
    const _subjText = _resolveSubjrefEvidenceText(AppState.inspect.data?.subjrefEvidence);
    const _subjEvidenceText = _subjText
        ? _wallacePipeline?.rf?.formatSubjrefEvidence(_subjText)
        : null;
    const subjrefEvidenceHTML = _subjEvidenceText
        ? `<div class="rn-subjref-evidence" data-study-section="subjref">${_escH(_subjEvidenceText)}</div>`
        : '';

    const richHTML = [
        proseHTML,
        phraseReadingHTML ? `<div data-study-section="phrase">${phraseReadingHTML}</div>` : '',
        observationHTML   ? `<div data-study-section="observation">${observationHTML}</div>` : '',
        referentEvidenceHTML,
        subjrefEvidenceHTML,
    ].filter(Boolean).join('');

    /* HTMLタグだけ・空白だけの結果ではトグルを作らない。表示テキストがある場合のみ表示する。 */
    if (richHTML && _stripHTMLToText(richHTML)) {
        /* 第三層では第一層の節メモとは別に、この語に対応する読書メモを開いた状態で表示する。 */
        slot.innerHTML = `<button type="button" class="rn-word-reading-note-heading" aria-expanded="true">この語の読書メモ</button><div class="rn-word-reading-note-body">${richHTML}</div>`;
        slot.style.display = 'block';
        const memoHeading = slot.querySelector('.rn-word-reading-note-heading');
        const memoBody = slot.querySelector('.rn-word-reading-note-body');
        if (memoHeading && memoBody) {
            memoHeading.addEventListener('click', () => {
                const isOpen = memoHeading.getAttribute('aria-expanded') === 'true';
                memoHeading.setAttribute('aria-expanded', String(!isOpen));
                memoBody.hidden = isOpen;
            });
        }
    } else {
        slot.innerHTML = '';
        slot.style.display = 'none';   /* 静寂：空のトグルを残さずスロット自身を非表示 */
    }
}

/* SF-22: mobile 語詳細 → Structure Flow を非同期注入。desktop の生成器
 * _buildFlowTreeNeighborhoodViewHTML(ref) を無改変で再利用（HTML は生成器内で _escH 済み、
 * desktop reading-notes-area と同一経路）。_fillMvvReadingSlot と同じ世代管理で、
 * 語/verse 切替時の stale 注入と inspector クローズ後の注入を防ぐ。SF-20 の FLOW 構造は不変。 */
let _mvvFlowGen = 0;
async function _fillMvvFlowSlot(ref) {
    const slot0 = document.getElementById('mvv-flow-slot');
    if (!slot0) return;
    const myGen = ++_mvvFlowGen;
    slot0.innerHTML = '';
    let html = '';
    try { html = ref ? await _buildFlowTreeNeighborhoodViewHTML(ref, AppState.studyTarget?.verseId) : ''; } catch (_) { html = ''; }
    if (myGen !== _mvvFlowGen) return;                       /* 別の語/verse へ移動済み → 破棄 */
    const slot = document.getElementById('mvv-flow-slot');   /* inspector を閉じた後は null */
    if (!slot) return;
    slot.innerHTML = html || '';                             /* '' は空のまま（静寂） */
}

/* Phase F-4: 語A検索中に語Bへ移動した場合、古い semantic 結果の誤注入を防ぐ世代カウンタ。
   Reading Notes 用 _mvvReadingGen とは独立。 */
let _mvvSemanticGen = 0;

/**
 * _fillMvvSemanticSlot — Level3「意味を見る」（#mvv-semantic-slot）へ
 * 既存 semantic lookup 経路のドメインラベルを非同期注入する（Phase F-4）。
 *
 * 原則（semantic = 情報提供のみ）:
 *   - 既存経路（_ensureSemanticData → _resolveLemmaId → _lexiconData[id].domains → _getDomainLabel）
 *     のラベルをそのまま列挙するだけ。文脈解釈・意味決定・教理説明・補足文章は行わない。
 *   - 注入は textContent のみ（innerHTML 禁止）。
 *   - 該当なし（ラベルなし＝静寂）のときは「意味を見る」セクションごと非表示。
 *   - AppState / storage / URL は触れない。世代カウンタで stale 結果を破棄する。
 *   - Reading Notes（読みを深める）とは別スロット・別役割（こちらは語義の分類ラベル）。
 */
/* _fillMvvSemanticSlot — Desktop の _injectStudyPanelContent を再利用して
 * cluster chips を Mobile semantic slot へ注入する（StudyPanel parity）。
 * resolvedId / greek / strong は _mobileInspectorDetail が計算した値を引数で受け取る
 * （AppState.inspect.data?.lemmaId が toBrowsing() 退避・復元により保持されていることが前提）。
 * 世代管理は _mvvSemanticGen で stale 注入を防ぐ。
 */
async function _fillMvvSemanticSlot(resolvedId, greek, strong) {
    const slot = document.getElementById('mvv-semantic-slot');
    if (!slot) return;
    const section = slot.closest('.mvv-l3-section');
    const myGen = ++_mvvSemanticGen;
    slot.innerHTML = '';
    if (section) section.style.display = 'none';

    try {
        if (myGen !== _mvvSemanticGen) return;
        /* Desktop と同じ _injectStudyPanelContent を呼ぶ（内部で _ensureSemanticData を呼ぶ）。 */
        await _injectStudyPanelContent(slot, strong, resolvedId, greek);
    } catch (_) {
        /* 静寂：失敗時はセクションを非表示のまま */
    }
    if (myGen !== _mvvSemanticGen) return;

    const slotCheck = document.getElementById('mvv-semantic-slot');
    if (!slotCheck) return;
    if (slotCheck.innerHTML.trim()) {
        if (section) section.style.display = '';
    } else {
        if (section) section.style.display = 'none';   /* 静寂 */
    }
}

/* 統語論ラベルを mobile 語詳細の #mvv-syntax-slot へ非同期注入する。
 * _buildSyntaxLabelHTML（desktop と共通）を再利用し、世代管理で stale を防ぐ。 */
let _mvvSyntaxGen = 0;
async function _fillMvvSyntaxSlot(words, targetRef) {
    const slot = document.getElementById('mvv-syntax-slot');
    if (!slot) return;
    const myGen = ++_mvvSyntaxGen;
    slot.innerHTML = '';
    slot.style.display = 'none';
    let html = '';
    try { html = await _buildSyntaxLabelHTML(words, targetRef); } catch (_) { html = ''; }
    if (myGen !== _mvvSyntaxGen) return;
    if (html) {
        const group = slot.closest('[data-study-group="analysis"]');
        if (group) group.style.display = '';
        if (group && !group.querySelector('.rn-l3-group-label')) {
            const label = document.createElement('div');
            label.className = 'rn-l3-group-label';
            label.textContent = '分析候補・統語情報';
            group.insertBefore(label, group.firstChild);
        }
        slot.innerHTML = html;
        slot.style.display = '';
    }
}

/* StudyPanel parity: _fillMvvLevel2Slot — 「辞書的意味を見る」内の非同期コンテンツ
 * （Usage trends / Etymology / Abbott-Smith）を _lexiconData 経由で注入する。
 * Desktop _renderReadingNotes の同名セクションと同じデータ・HTML 構造を使う。
 * 世代管理は _mvvLevel2Gen で stale 注入を防ぐ。 */
let _mvvLevel2Gen = 0;
async function _fillMvvLevel2Slot(resolvedId) {
    const etmSlot = document.getElementById('mvv-etymology-slot');
    const abbSlot = document.getElementById('mvv-abbott-slot');
    if (!etmSlot && !abbSlot) return;
    const myGen = ++_mvvLevel2Gen;
    if (etmSlot) etmSlot.innerHTML = '';
    if (abbSlot) abbSlot.innerHTML = '';

    try {
        await _ensureSemanticData();
        if (myGen !== _mvvLevel2Gen) return;

        const lexEntry   = resolvedId ? _lexiconData?.[resolvedId] : null;
        const abbottSmithText = lexEntry?.abbottSmith || '';
        const contexts   = lexEntry?.contexts || {};
        const synopticRefs = contexts.synoptic_refs || [];
        const paulineRefs  = contexts.pauline_refs  || [];

        /* 使用傾向は検索ツールで確認するため、第三層では重複表示しない。 */

        /* Etymology（Desktop _renderReadingNotes と同じ経路） */

        const etymologyHTML = compositionParts
            ? `<div class="rn-etymology" data-study-section="etymology">語源&emsp;<span class="rn-etymology-parts">${_buildEtymPartsHTML(compositionParts)}</span></div>`

              ${(d.lemma ? `<div>見出し語: <span class="mvv-l3-lemma">${_escH(d.lemma)}</span></div>` : '')}

${LN_RELATED_WORDS_ENABLED ? `

/* ══════════════════════════════════════════
   パネルリサイズ（縦方向ドラッグ - bottom-depth-panel）
   設計原則：
   - pointerdown / pointermove / pointerup / pointercancel のみ（mouse/touch分岐禁止）
   - setPointerCapture で捕捉 → pointerup/cancel で必ず releasePointerCapture
   - ドラッグ中は window/document 依存なし（capture で完結）
   - 高さは常に clamp で処理（状態依存でイベントを止めない）
   - isDragging / height は StudyPanelState で一元管理（height が SSOT）
   - DOM 反映は requestAnimationFrame で 1 フレーム 1 回にまとめる
   - offsetHeight の read-after-write 禁止（計算済みの値だけを書く）
   - 離した位置で停止する（スナップ・慣性なし）。次回 open も同じ高さ
   ══════════════════════════════════════════ */
(function() {
    const handle = document.getElementById('panel-resize-handle');
    const panel  = document.getElementById('bottom-depth-panel');
    if (!handle || !panel) return;

    let startY = 0, startH = 0;
    let pendingH = null;   /* rAF 反映待ちの高さ（null = なし） */
    let rafId    = 0;

    /* 計算済みの高さ h を DOM へ反映する（読み取りなし・書き込みのみ）。
       本文 padding も同じ h で直接同期し、offsetHeight の強制レイアウトを避ける */
    function _applyHeight(h) {
        if (window.innerWidth <= 768) return;   /* 全画面は CSS top/bottom 管理 */
        if (_isMobile()) {
            /* 769–900px：!important でドラッグ中の高さを反映 */
            panel.style.setProperty('height', h + 'px', 'important');
        } else {
            panel.style.height = h + 'px';
        }
        const area = document.getElementById('main-reading-area');
        if (area) area.style.paddingBottom = h + 'px';
    }

    function _flush() {
        rafId = 0;
        if (pendingH == null) return;
        const h = pendingH;
        pendingH = null;
        _applyHeight(h);
    }

    handle.addEventListener('pointerdown', (e) => {
        /* 768px以下は全画面モードのためリサイズ不要 */
        if (window.innerWidth <= 768) return;
        StudyPanelState.isDragging = true;
        startY = e.clientY;
        startH = panel.offsetHeight;
        handle.classList.add('dragging');
        /* captureにより、指がハンドル外に出ても pointermove を継続受信する */
        handle.setPointerCapture(e.pointerId);
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    handle.addEventListener('pointermove', (e) => {
        if (!StudyPanelState.isDragging) return;
        /* min/max は Geometry SSOT（CSS カスタムプロパティ）から取得。
           従来どおり move 毎に評価する（ドラッグ中のウィンドウリサイズ・
           帯域跨ぎでも旧実装と同じ振る舞いを保つ） */
        const { minH, maxH } = _panelGeomLimits(panel);
        /* clamp：max/min 状態でも反対方向にドラッグすれば必ず動く */
        const nh = Math.min(maxH, Math.max(minH, startH + (startY - e.clientY)));
        StudyPanelState.height = nh;   /* SSOT: 次回 open もこの高さで復元される */
        pendingH = nh;
        if (!rafId) rafId = requestAnimationFrame(_flush);
    });

    function _finishDrag(e) {
        if (!StudyPanelState.isDragging) return;
        StudyPanelState.isDragging = false;
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        /* capture を必ず解放する（pointerup/cancel 両方から呼ばれる） */
        try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
        /* スナップ廃止（UX監査による）: 離した位置でそのまま停止する。
           rAF 待ちの高さがあれば即時反映して確定する */
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        if (pendingH != null) { const h = pendingH; pendingH = null; _applyHeight(h); }
        _syncReadingPanelPadding();   /* 終了時に1回だけ実測で最終同期 */
    }

    function _cancelDrag(e) {
        /* 着信・OSジェスチャーなどでキャンセルされた場合。高さはその場のまま */
        _finishDrag(e);
    }

    handle.addEventListener('pointerup',     _finishDrag);
    handle.addEventListener('pointercancel', _cancelDrag);
})();


/* ══════════════════════════════════════════
   openStudyPanel - 正規実装（唯一の定義）
   責務:
     - word-list-view を消去してiframe/インライン分析に切り替える
     - AppState.saveScroll() で scroll 位置を保存
     - AppState.toStudy() で状態を Study モードへ遷移
     - study.tab を引き継いで前回開いていたタブを復元
   ══════════════════════════════════════════ */
/* ══════════════════════════════════════════
   openStudyPanel - 読書メモ版
   タブを廃止し、単一スクロールの読書メモパネルに表示する。
   ══════════════════════════════════════════ */
function openStudyPanel(greek, rawMorph, ref, lemma, options = {}) {
    closeMobileSidebar();
    /* 高さの一律リセットは廃止 — StudyPanelState.height（SSOT）を
       下の _applyPanelHeightFromState() が適用する */
    const listEl = document.getElementById('word-list-view');
    /* 節Panel（Level 2）から来た場合のみ、破棄する直前のスクロール位置を保存しておく
       （panelGoBack() で Level 2 に戻った時に復元する。スクロール保持のための唯一の保存箇所）。 */
    _versePanelScrollTop = (_panelContentMode === 'verse' && listEl) ? listEl.scrollTop : null;
    if (listEl) listEl.remove();

    const m = parseMorphForSearch(rawMorph);
    const params = {
        ref,
        verseId:   AppState.studyTarget?.verseId || '',
        word:      greek,
        lemma:     lemma || '',
        pos:       m.pos    || '',
        _rawMorph: rawMorph,
        tense:     m.tense  || '',
        mood:      m.mood   || '',
        voice:     m.voice  || '',
        gender:    m.gender || '',
        number:    m.number || '',
        case:      m.case   || '',
    };
    params._morphCandidates = getMorphCandidates(rawMorph, greek).alternatives;

    /* 読書位置の保存: 閉→開の遷移時のみ。節Panel（Level 2）から単語詳細へ
       進む時に保存すると「パネルを開く前の位置」が open 中の位置で
       上書きされ、close 時に開く前へ戻れなくなる。 */
    if (!document.getElementById('bottom-depth-panel').classList.contains('open')) {
        AppState.saveScroll();
    }
    AppState.toStudy(params, 'notes');

    /* depth stack に追加（重複しないよう、top が同じなら追加しない） */
    const stack = AppState.depth.stack;
    const topEntry = stack[stack.length - 1];
    const isAlreadyDeep = topEntry && topEntry.type === 'deep-reading' && topEntry.strong === String(AppState.inspect.data?.strong || '');
    if (!options.skipDepthPush && !isAlreadyDeep) {
        pushDepth({
            type:   'deep-reading',
            label:  '深く読む',
            strong: String(AppState.inspect.data?.strong || ''),
        });
    }

    const sidePanel    = document.getElementById('bottom-depth-panel');
    const wasOpen = sidePanel.classList.contains('open');
    _panelContentMode = 'word';
    /* 高さの SSOT: Level 2⇄3 遷移でもユーザー調整高さを維持する
       （word モードの上限 80vh へは適用時のみ clamp。state は保持） */
    _applyPanelHeightFromState(sidePanel);
    sidePanel.classList.add('open');
    _syncStudyVerseNav();
    _syncReadingPanelPadding();
const activeVEl = document.getElementById('active-v');
    if (activeVEl && greek) activeVEl.textContent = greek;

    document.getElementById('open-panel-btn').style.display = 'none';

    /* 読書メモエリアを表示 */
    const notesWrap = document.getElementById('reading-notes-wrap');
    if (notesWrap) notesWrap.style.display = 'flex';

    _renderReadingNotes(params);

    /* スクロール位置の復元（close直前に StudyPanelState.scrollTop へ保存した位置を再適用）。
       _renderReadingNotes は async で DOM を置換するため、2段 rAF で確実に render 後に適用する。
       1段目：レイアウト計算開始を待つ。2段目：paint サイクル後に scrollTop を確定する。 */
    {
        const _savedScroll = StudyPanelState.scrollTop;
        StudyPanelState.scrollTop = 0;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const nw = document.getElementById('reading-notes-wrap');
                if (nw) nw.scrollTop = _savedScroll;
            });
        });
    }

    /* ── オンボーディング：アンカー語（ἠγάπησεν）初回タップ時に発見テキストを先頭注入 ── */
    (function _injectObDiscovery() {
        const obState = window.App.onboarding?.getState();
        if (!obState || obState.onboardingComplete) return;
        if (obState.wordClicked) return; /* 2語目以降は出さない */
        if (greek !== 'ἠγάπησεν') return;

        const area = document.getElementById('reading-notes-area');
        if (!area) return;

        const disc = document.createElement('div');
        disc.id = 'ob-discovery-banner';
        disc.style.cssText = [
            'margin:0 0 18px 0',
            'padding:13px 16px',
            'background:var(--accent-light)',
            'border-left:3px solid rgba(44,79,52,0.55)',
            'border-radius:0 var(--radius-s) var(--radius-s) 0',
            'font-family:\'Noto Serif JP\',Georgia,serif',
            'font-size:var(--text-caption)',
            'line-height:1.8',
            'color:rgba(29,29,31,0.82)',
            'letter-spacing:0.01em',
        ].join(';');
        disc.textContent = 'この語は文の先頭に置かれています。ギリシャ語では動詞が最初に来るとき、その行為が強調される読み方があります。日本語訳では見えにくい語順の意図が、原語には残っています。';

        area.insertBefore(disc, area.firstChild);
    })();
    /* ─────────────────────────────────────────────────────── */

    _mobileOpenPanel(greek || '語を読む', wasOpen);
    updatePanelBackButton();
    _adjustReadingAreaForPanel(wasOpen);

    /* onboarding hook */
    if (window.App.onboarding) {
        window.App.onboarding.onStudyPanelOpened(window.innerWidth <= 900, AppState.selectedVerse?.vNum);
    }
    _syncOnboardingActiveFlag();

    notifyAppStateChange();
}

function goProximityPage() {
    const p = new URLSearchParams();

    const activeVEl   = document.getElementById('active-v');
    const activeVText = activeVEl ? activeVEl.innerText.replace(/\s*節\s*$/, '').trim() : '';

    const urlParams = Router.parse();
    const book = urlParams.book || '';
    const ch   = urlParams.chapter || '';

    /* AppState.inspect.data から語を取得（後方互換: _inspectData も同じ参照） */
    const inspData = AppState.inspect.data;
    if (inspData && inspData.greek) {
        p.set('word',  inspData.greek);
        if (inspData.lemma) p.set('lemma', inspData.lemma);
        const _gpm = parseMorphForSearch(inspData.rawMorph || '');
        console.info('[goProximityPage→search] 元トークン rawMorph:', inspData.rawMorph);
        console.info('[goProximityPage→search] parseMorphForSearch 入力:', inspData.rawMorph);
        console.info('[goProximityPage→search] parseMorphForSearch 出力:', _gpm);
        if (_gpm.pos)    p.set('pos',    _gpm.pos);
        if (_gpm.tense)  p.set('tense',  _gpm.tense);
        if (_gpm.mood)   p.set('mood',   _gpm.mood);
        if (_gpm.voice)  p.set('voice',  _gpm.voice);
        /* 動詞形（分詞含む）では格・数・性を送らない */
        if (_gpm.pos !== 'V') {
            if (_gpm.case)   p.set('case',   _gpm.case);
            if (_gpm.number) p.set('number', _gpm.number);
            if (_gpm.gender) p.set('gender', _gpm.gender);
        }
        p.set('layers', 'lemma,morph');
        console.info('[goProximityPage→search] URL パラメータ:', Object.fromEntries(p.entries()));
    }

    if (book && ch) {
        const ref = activeVText ? `${book}${ch}:${activeVText}` : `${book}${ch}`;
        p.set('ref', ref);
        if (activeVText) p.set('scope', 'verse');
    }

    const qs = p.toString();
    const url = qs ? `search-tool.html?${qs}` : 'search-tool.html';
    const _stw = window.open(url, '_blank');
    if (_stw) _searchToolWindows.add(_stw);
}

function switchTab(evt, tabName) {
    const tabContents = document.getElementsByClassName("tab-content");
    for (let i = 0; i < tabContents.length; i++) tabContents[i].classList.remove("active");
    const tabBtns = document.getElementsByClassName("tab-btn");
    for (let i = 0; i < tabBtns.length; i++) tabBtns[i].classList.remove("active");
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
    document.getElementById('main-reading-area').scrollTop = 0;
}

let _renderCurrentPageToken = 0;

async function renderCurrentPage() {
    const renderToken = ++_renderCurrentPageToken;
    document.body.classList.add('chapter-navigation-loading');
    document.getElementById('main-reading-area').classList.remove('static-view');
    const urlParams = Router.parse();
    const book = urlParams.book || 'ROM';
    const ch   = urlParams.chapter || '1';

    const isNt = SB_BOOKS.nt.some(b => b.key === book);

    const allBooks = [...SB_BOOKS.nt, ...SB_BOOKS.ot];
    const found = allBooks.find(b => b.key === book);

    /* location 更新 */
    AppState.location.testament = isNt ? 'nt' : 'ot';
    AppState.location.book      = found || null;
    AppState.location.chapter   = parseInt(ch);

    /* ヘッダー/パンくず/サイドバー選択状態は AppState.ui.view から一括同期する */
    AppState.ui.view = 'bible';
    syncUIFromState();

    const hasGreek = GREEK_BOOKS.has(book);

    try {
        /* VR-4-C Step 2: init() と同じ変換（_toColumnMode()、Step 1 参照）。 */
        const _colA = _toColumnMode(_transA);
        const _colB = _toColumnMode(_transB);

        /* ColumnMode が wordOrder / discourse（Greek由来・訳文なし）の場合は翻訳JSONをfetchしない */
        const jpData = _isGreekReadingMode(_colA.kind)
            ? null
            : await _fetchTranslation(_transA, book, ch);

        let jpDataB = null;
        if (_transMode === 'compare' && !_isGreekReadingMode(_colB.kind)) {
            jpDataB = await _fetchTranslation(_transB, book, ch);
        }

        let elData = [];
        if (hasGreek) {
            try {
                const testament = SB_BOOKS.nt.some(b => b.key === book) ? 'nt' : 'lxx';
                const elRes = await fetch(`../bible_data/${testament}/${book}/${ch}.json`);
                if (elRes.ok) elData = await elRes.json();
            } catch(e) {}
        }

        /* DA-1: discourse は passage単位の clause 接続を描くため、flow-tree（clause/sentence
           構造の一次データ）を render() の前に先読みする。既存 _loadFlowTreeChapter() を再利用し、
           結果は render() が読む module 変数へ渡す（既存の翻訳fetchと同じく await 済みで一貫）。 */
        _dcvChapterTreeForRender = (_colA.kind === 'discourse')
            ? await _loadFlowTreeChapter(book, ch) : null;

        /* P2: structural-diagram は SR 章データを先読みして render() へ渡す。E-4-D: relation も同一SR JSONを使用。
           B列が passage-level の場合も同じ SR JSON を使用するため、_colB.kind も対象に含める。
           Phase E: rk-reading も同一 SR JSON を使用する。 */
        _sdChapterDataForRender = (
            _colA.kind === 'structural-diagram' || _colA.kind === 'hierarchical' || _colA.kind === 'relation' || _colA.kind === 'da-reading' || _colA.kind === 'rk-reading' || _colA.kind === 'rk-reading-v' || _colA.kind === 'rk-reading-p' || _colA.kind === 'role-reading' /* C-17 Phase 1 / E-4-D / Phase E / L.2 / M */
            || _colB.kind === 'structural-diagram' || _colB.kind === 'hierarchical' || _colB.kind === 'relation' || _colB.kind === 'da-reading' || _colB.kind === 'rk-reading' || _colB.kind === 'rk-reading-v' || _colB.kind === 'rk-reading-p' || _colB.kind === 'role-reading' /* B列 passage-level */
        ) ? await _loadSrChapter(book, ch) : null;


        /* VR-5-D: resolvedJpData 決定ロジックを _getVerseSource() へ抽出（VR-5-C 参照） */
        const resolvedJpData = _getVerseSource(_colA, jpData, elData);
        if (!resolvedJpData) throw new Error('Not found');

        /* VR-5-E-1: render() 入口を columns[] ベースへ移行（columns[i] = { colMode, jpData }） */
        const columns = [
            { colMode: _colA, jpData: resolvedJpData },
            { colMode: _colB, jpData: jpDataB },
        ];
        /* 連続した章移動では、後から完了した古い fetch が新しい章を上書きしないようにする。 */
        if (renderToken !== _renderCurrentPageToken) return false;
        render(columns, elData, hasGreek && elData.length > 0);
        document.getElementById('active-v').innerText = "";
        syncUrlState();
        _applyHighlights();
        return true;

// 本文レンダリング完了後

        // ── オンボーディング：アンカー語付与 ──────────────────
        // ヨハネ3:16表示中かつオンボーディング未完了の場合のみ実行。
        // word-card の data-greek から対象語を探し、最初の1枚に
        // data-onboarding-anchor="true" を付与する。
        // 対象語優先順: ἠγάπησεν → οὕτως → （先頭カード）
    } catch (err) {
        if (renderToken !== _renderCurrentPageToken) return false;
        document.getElementById('bible-text-area').innerHTML = `<p style="color:red">データが見つかりません。</p>`;
        return false;
    } finally {
        /* 古いリクエストの完了では、新しい章のローディング表示を解除しない */
        if (renderToken === _renderCurrentPageToken) {
            document.body.classList.remove('chapter-navigation-loading');
        }
    }
}
