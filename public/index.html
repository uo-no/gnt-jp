    <style>
    /* :root → tokens.css (aliases: --bg-paper, --bg-panel, --bg-sidebar, --bg-card, --text-main, --highlight, --border-soft) */

.ui-label {
    font-size: var(--text-caption);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-label);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
}
.greek-headword {
    font-family: var(--font-greek);
    line-height: var(--line-height-greek-headword);
    color: var(--text-main);
}
.reading-prose {
    font-family: var(--font-prose);
    color: var(--text-main);
    line-height: var(--line-height-reading-prose);
    letter-spacing: var(--tracking-reading);
}
.reading-block {
    padding-left: var(--space-md);
    border-left: 2px solid var(--accent-mid);
}
/* 節の読書メモと同じ、控えめな開閉 UI を語の分析側にも適用する。 */
.rn-word-reading-note {
    display: block;
    margin: var(--space-sm) 0 var(--space-md);
    padding: 0;
    border: 0;
}
.rn-word-reading-note > summary {
    list-style: none;
    cursor: pointer;
    color: var(--text-sub);
    font-size: var(--text-caption);
    padding: var(--space-xs) 0;
}
.rn-word-reading-note > summary::-webkit-details-marker { display: none; }
.rn-word-reading-note > summary::after {
    content: '+';
    float: right;
    color: var(--text-sub);
}
.rn-word-reading-note[open] > summary::after { content: '−'; }
.rn-word-reading-note[open] > :not(summary) { padding-top: var(--space-sm); }
/* 語の読書メモ内では、共通本文 .rn-prose の上線を表示しない（PC・モバイル共通）。 */
.rn-word-reading-note .rn-prose {
    border-top: 0;
    padding-top: 0;
    margin-top: 0;
}


.ui-section-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: var(--tracking-label);
    color: var(--text-hint, #8e8e93);
}
.ui-caption {
    font-size: var(--text-caption);
    color: var(--text-hint, #8e8e93);
}
[data-xsc-arrow] { display: inline-flex; align-items: center; }
[data-xsc-arrow] svg { width: 11px; height: 11px; display: block; }
.ui-card {
    border: 1px solid var(--border, rgba(0,0,0,.07));
    border-radius: var(--radius-m);
    padding: var(--space-sm) var(--space-md);
    background: var(--bg, #fff);
    margin-bottom: var(--space-sm);
}
.ui-panel {
    margin-top: var(--space-sm);
    border: 1px solid var(--border, rgba(0,0,0,.07));
    border-radius: var(--radius-s);
    overflow: hidden;
    font-size: var(--text-caption);
}
.ui-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-xs) var(--space-sm) var(--space-xs);
    background: var(--bg-panel, #f5f5f7);
    cursor: pointer;
    user-select: none;
}
.ui-panel-body {
    display: none;
    padding: var(--space-sm) var(--space-sm) var(--space-sm);
    border-top: 1px solid var(--border, rgba(0,0,0,.07));
}

html {
overflow: hidden;
width: 100%;
height: 100%;
}
body {
font-family: var(--font-ui);
line-height: 2.0;
background: var(--bg-paper);
color: var(--text-main);
margin: 0; padding: 0;
overflow: hidden;
width: 100%;
height: 100%;
-webkit-font-smoothing: antialiased;
}

/* iOS: prevent accidental double-tap zoom while preserving pan and pinch zoom. */
html, body { touch-action: manipulation; }

.main-layout { display: flex; height: 100%; width: 100%; overflow: hidden; --app-header-h: 60px; background: var(--bg-panel); }

.nav-sidebar {
position: fixed;
top: 0;
left: 0;
height: 100dvh;
width: 280px;
background: var(--bg-panel);
display: flex;
flex-direction: column;
overflow: hidden;
z-index: 5;
opacity: 0;
pointer-events: none;
transition: opacity var(--transition-fast);
}
.nav-sidebar.open {
opacity: 1;
pointer-events: auto;
}
.sidebar-top { padding: var(--space-lg) var(--space-md) var(--space-md); display: flex; align-items: center; gap: var(--space-sm); }
.sidebar-logo { font-weight: 700; font-size: var(--text-body); white-space: nowrap; letter-spacing: -0.01em; color: var(--text-main); }

/* ── Panel Geometry SSOT（デスクトップ既定値） ──
   パネル高さの数値定義は、この規則と ≤900px メディア内の上書きだけ。
   JS は _panelGeomLimits() が getComputedStyle で読む — JS 側に vh/px の
   値を直接書くことは禁止（CSS/JS 二重定義の再発防止）。
   drag-min / expanded / word-max はドラッグと高さ復元の clamp 用
   （デスクトップは拡張なし＝ max と同じ値）。
   ※ この定義はメディアブロックより前に置くこと（カスケード順で
      ≤900px の上書きが勝つため）。 */
#bottom-depth-panel {
    --panel-default-h:  46vh;
    --panel-min-h:      220px;
    --panel-max-h:      70vh;
    --panel-drag-min-h: 220px;
    --panel-expanded-h: 70vh;
    --panel-word-max-h: 70vh;
}

/* StudyPanelの浮動節ナビは全幅で既定非表示。モバイル用ルールで必要時のみ表示する */
#study-verse-nav { display: none; }

@media (max-width: 900px) {
    .app-header { position: relative; }
    #mobile-menu-btn {
        display: flex;
    }

    #app {
        position: relative;
        overflow: hidden;
    }

    /* モバイル Bottom Sheet：見た目・高さを共通ルールから上書き。
       CSS 変数でサイズを差し替えるため !important 不要。
       位置・表示・transform 制御はすべて共通ルール（#bottom-depth-panel）で管理する。 */
    #bottom-depth-panel {
        --panel-default-h:  40vh;
        --panel-min-h:      0px;
        --panel-max-h:      98vh;
        /* Geometry SSOT（769–900px帯）: ドラッグ/復元の clamp 値 */
        --panel-drag-min-h: 40vh;
        --panel-expanded-h: 98vh;
        --panel-word-max-h: 80vh;
        border-top: none;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: var(--bg-paper);
        border-radius: var(--radius-l) var(--radius-l) 0 0;
    }
    #bottom-depth-panel.open {
        box-shadow: 0 -8px 40px rgba(0,0,0,0.10);
    }

    /* StudyPanel 第1層専用：読書の邪魔をしない控えめな節ナビ */
    #study-verse-nav {
        display: none; position: absolute;
        right: max(16px, env(safe-area-inset-right, 0px));
        bottom: max(18px, env(safe-area-inset-bottom, 0px));
        z-index: 260; align-items: center; gap: 0;
        padding: 2px; border: 1px solid var(--accent-mid);
        border-radius: 999px; background: transparent;
        box-shadow: none;
        overflow: hidden; pointer-events: none;
    }
    #study-verse-nav.is-visible { display: flex; }
    #study-verse-nav button {
        display: flex; align-items: center; justify-content: center;
        width: 42px; height: 40px; padding: 0;
        border: 0; border-radius: 0; background: transparent;
        color: var(--accent); box-shadow: none;
        font-size: 18px; font-weight: 300; line-height: 1;
        opacity: 0.72;
        pointer-events: auto; -webkit-tap-highlight-color: transparent;
    }
    #study-verse-nav button:active { opacity: 1; background: transparent; }
    #study-verse-nav button:focus-visible {
        opacity: 1; outline: 2px solid var(--focus-ring); outline-offset: -3px;
    }
    @media (min-width: 769px) { #study-verse-nav { display: none !important; } }

    /* compare-mode を強制シングル表示に（769px〜900px：縦積み未満の中間サイズ） */
    #main-reading-area.compare-mode {
        grid-template-columns: 1fr !important;
        display: flex;
        flex-direction: column;
    }
    #main-reading-area.compare-mode #parallel-text-area,
    #main-reading-area.compare-mode .verse-pair-right,
    #main-reading-area.compare-mode .verse-grid-spacer-right,
    #main-reading-area.compare-mode .verse-grid-footer-right {
        display: none !important;
    }

    #mobile-nav-bar {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 0;
        height: 52px;
        padding: 0 var(--space-sm) 0 var(--space-xs);
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-soft);
        flex-shrink: 0;
        position: relative;
    }

    #mobile-panel-back {
        display: flex !important;
        align-items: center;
        padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-sm);
        font-size: var(--text-body-lg);
        font-weight: 400;
        color: var(--highlight);
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 0.01em;
        flex-shrink: 0;
        min-width: 44px;
        min-height: 44px;
        justify-content: flex-start;
        -webkit-tap-highlight-color: transparent;
        transition: opacity var(--transition-fast);
    }
    #mobile-panel-back:active { opacity: var(--opacity-secondary); }

    #mobile-panel-back-chevron {
        font-size: var(--text-title);
        line-height: 1;
        font-weight: 300;
        opacity: var(--opacity-primary);
    }
    #mobile-nav-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: var(--text-body);
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: -0.01em;
        pointer-events: none;
        white-space: nowrap;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Bottom Sheetの可動性を示すグリップとしてモバイルでも表示する（PC用実装をそのまま流用） */
    #panel-resize-handle {
        display: flex;
    }
    /* 開いた直後（＝必ず40vh）だけグリップを軽く持ち上げ、「引き上げ可能」であることを示す（任意の演出） */
    @keyframes panel-handle-hint-lift {
        0%, 100% { transform: translateY(0); }
        35% { transform: translateY(-6px); }
        60% { transform: translateY(0); }
    }
    #bottom-depth-panel.open #panel-resize-handle::after {
        animation: panel-handle-hint-lift var(--duration-slow) var(--ease-out) 0.45s 1;
    }

    /* パネルヘッダー（既存）はナビバーに置き換えるため非表示 */
    #bottom-depth-panel .panel-header {
        display: none;
    }

    .rcb-container {
        border-top: none;
        padding-top: var(--space-sm);
    }

    #reading-notes-wrap {
        padding-top: 0;
    }

    #main-reading-area.single-mode #bible-text-area {
        padding-top: var(--space-md);
    }
}

/* ── 768px以下：比較モードを縦積み＋1節表示に ── */
@media (max-width: 768px) {
    #main-reading-area.compare-mode {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
        overflow-y: auto;
    }
    #main-reading-area.compare-mode #bible-text-area {
        width: 100%;
        max-width: 100%;
        background: #fff;
        padding-bottom: var(--space-sm);
    }
    #main-reading-area.compare-mode .verse-pair-left {
        padding: var(--space-xs) var(--space-md) var(--space-xs) var(--space-md);
    }
    #main-reading-area.compare-mode #bible-text-area::after {
        content: '';
        display: block;
        height: 1px;
        background: var(--border-soft);
        margin: 0 var(--space-md);
    }
    #main-reading-area.compare-mode #parallel-text-area {
        display: block !important;
        width: 100%;
        max-width: 100%;
        border-left: none;
        border-top: none;
        background: var(--bg-inset);
        padding-bottom: 40px;
    }
    #main-reading-area.compare-mode .verse-pair-right {
        display: block !important;
        padding: var(--space-xs) var(--space-md) var(--space-xs) var(--space-md);
    }
    #main-reading-area.compare-mode .verse-grid-spacer-right,
    #main-reading-area.compare-mode .verse-grid-footer-right {
        display: block !important;
    }

    #mobile-verse-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-sm) var(--space-md);
        background: var(--bg-paper);
        border-bottom: 1px solid var(--border-soft);
        flex-shrink: 0;
        gap: var(--space-sm);
    }
    #mobile-verse-nav .mvn-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-s);
        background: var(--bg-paper);
        color: var(--text-sub);
        font-size: var(--text-body-lg);
        cursor: pointer;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
        transition: background var(--transition-fast);
    }
    #mobile-verse-nav .mvn-btn:disabled { opacity: var(--opacity-tertiary); cursor: default; }
    #mobile-verse-nav .mvn-label {
        font-size: var(--text-caption);
        color: var(--text-sub);
        text-align: center;
        flex: 1;
        letter-spacing: 0.02em;
    }
    #mobile-verse-nav .mvn-label strong {
        color: var(--text-main);
        font-size: var(--text-body-lg);
    }
    #main-reading-area.compare-mode .verse-block[data-hidden-verse] {
        display: none !important;
    }

    .mobile-verse-group {
        padding: var(--space-md) 0 0;
        border-bottom: 2px solid var(--border-soft);
    }
    .mobile-vnum-badge {
        display: none;
    }
    .mobile-trans-block {
        padding: 0;
    }
    .mobile-trans-a { background: #fff; }
    .mobile-trans-b { background: var(--bg-inset); }
    .mobile-trans-label {
        font-size: var(--text-caption);
        font-weight: 700;
        letter-spacing: var(--tracking-subsection);
        color: var(--text-sub);
        padding: var(--space-xs) var(--space-md) var(--space-xs);
        opacity: var(--opacity-secondary);
    }
    .mobile-verse-sep {
        height: 1px;
        background: var(--border-soft);
        margin: 0 var(--space-md);
    }
    #main-reading-area.compare-mode #parallel-text-area {
        display: none !important;
    }

    /* ── StudyPanel 全画面オーバーレイ（768px以下） ── */
    /* top:100%/0 で開閉、top:0+bottom:0+height:auto でビューポート全高を確保
       （dvh/vh/ビューポート単位に依存せず、JS の style.height も不要） */
    #bottom-depth-panel {
        top: 100%;       /* closed: パネル上端 = ビューポート下端 → 画面外 */
        bottom: auto;    /* closed: open 時に bottom:0 で上書きする */
        left: 0;
        right: 0;
        height: auto;    /* base の height:40vh を解除；open 時は top+bottom で確定 */
        max-height: none;
        min-height: 0;
        border-radius: 0;
        border-top: none;
        transform: none;
        transition: top var(--transition-slow);
    }
    #bottom-depth-panel.open {
        top: 0;
        bottom: 0;       /* top:0 + bottom:0 + height:auto = containing block 全高 */
        transform: none;
    }
    /* リサイズバー非表示（ドラッグ不要） */
    #panel-resize-handle {
        display: none !important;
    }
    /* パネル表示中は背面スクロールを無効化 */
    #app.mobile-study-open #main-reading-area {
        overflow-y: hidden;
    }
}

@media (min-width: 901px) {
    #mobile-menu-btn { display: flex; }
    #mobile-nav-bar  { display: none !important; }
    #mobile-panel-back { display: none !important; }
    #bottom-depth-panel {
        border: 1px solid var(--border-soft);
        border-bottom: none;
        border-radius: var(--radius-l) var(--radius-l) 0 0;
    }
    #bottom-depth-panel.open {
        box-shadow: var(--shadow-card);
    }
}

/* ── Mobile Verse View（Phase A-2: 器のみ） ──
   モバイル専用Inspector画面の新規コンテナ。既存 #bottom-depth-panel の
   ルールには一切触れない独立スタイル。
   ・基底は display:none（closed = 非表示）
   ・.open かつ ≤900px のときだけ表示（mobile時のみ表示可能。desktopでは
     クラスが付いても表示されない） */
#mobile-verse-view {
    display: none;
}
@media (max-width: 900px) {
    #mobile-verse-view.open {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 200;
        background: var(--bg-paper);
        /* Phase D-3A: 下端 safe-area（ホームインジケータ）分を確保。ノッチ無し端末では env=0。 */
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
    }
    #mobile-verse-view-bar {
        display: flex;
        align-items: center;
        /* Phase D-3A: 上端 safe-area（ノッチ/ステータスバー）分をバー高さに加算。env=0 で従来の 52px。 */
        height: calc(52px + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0px) var(--space-sm) 0 var(--space-xs);
        box-sizing: border-box;
        border-bottom: 1px solid var(--border-soft);
        flex-shrink: 0;
        /* Phase D-3C: 中央タイトルの絶対配置基準 */
        position: relative;
    }
    #mobile-verse-view-back {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        font-size: var(--text-title);
        line-height: 1;
        color: var(--highlight);
        background: none;
        border: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    /* Phase G-1: ⋮ アクションボタン（バー右端・44px タップ領域） */
    #mobile-verse-view-action {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        margin-left: auto;
        font-size: var(--text-title);
        line-height: 1;
        color: var(--text-sub);
        background: none;
        border: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    /* Phase G-1: アクションメニュー（バー右下にドロップ・初期非表示） */
    #mobile-verse-action-menu {
        position: absolute;
        top: 100%;
        right: var(--space-xs);
        min-width: 200px;
        max-width: calc(100vw - 24px);
        background: var(--bg-paper);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow-card);
        padding: var(--space-xs);
        display: none;
        flex-direction: column;
        z-index: 10;
    }
    #mobile-verse-action-menu.open { display: flex; }
    #mobile-verse-view .mvv-action-item {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        width: 100%;
        min-height: 44px;
        padding: 0 var(--space-md);
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-body);
        color: var(--text-main);
        text-align: left;
        border-radius: var(--radius-s);
        -webkit-tap-highlight-color: transparent;
    }
    #mobile-verse-view .mvv-action-item:active { background: rgba(0,0,0,0.05); }
    #mobile-verse-view .mvv-action-item svg { width: 1.1em; height: 1.1em; flex-shrink: 0; }
    /* Phase D-3C: MVV バー中央の現在地表示（節ref / 語）。左右のボタンに重ならないよう中央固定・省略表示 */
    #mobile-verse-view-title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 60%;
        font-size: var(--text-body);
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
    }
    #mobile-verse-area,
    #mobile-inspector-area {
        min-height: 0;
        padding: var(--space-md);
        color: var(--text-sub);
        font-size: var(--text-caption);
    }
    /* 読書メモは従来の上部領域に残し、口語訳だけを下の共通スクロール領域へ置く。 */
    #mobile-verse-area {
        flex: 0 0 auto;
        max-height: none;
        overflow: visible;
        /* Divider belongs to the passage note when present; avoid a duplicate/empty line. */
        border-bottom: 0;
    }
    #mobile-inspector-area {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        /* 語の読書メモを分析領域の最上部に揃え、親の上余白を重ねない。 */
        padding-top: 0;
    }
    #mobile-inspector-area .mvv-inline-translation {
        /* 「原語の順序」(.wlv-flow-section-compact) と同じ内側余白にそろえる。 */
        box-sizing: border-box;
        margin: 0 0 var(--space-lg);
        padding: var(--rhythm-macro-min) var(--rhythm-macro-min) var(--space-md);
        border-bottom: 1px solid var(--border-soft);
        font-family: var(--font-prose);
        font-size: var(--text-body-lg);
        color: var(--text-main);
        line-height: var(--line-height-reading-ja);
        letter-spacing: var(--tracking-reading);
        overflow: hidden;
        transition: height 210ms ease-out, opacity 210ms ease-out,
                    padding-top 210ms ease-out, padding-bottom 210ms ease-out,
                    border-bottom-width 210ms ease-out,
                    margin-bottom 210ms ease-out;
    }
    #mobile-inspector-area .mvv-inline-translation .mvv-ref {
        font-size: var(--text-caption);
        font-weight: 600;
        letter-spacing: var(--tracking-subsection);
        color: var(--text-hint);
        display: block;
        margin-bottom: var(--rhythm-medium-y);
    }
    #mobile-inspector-area .mvv-inline-translation .mvv-body {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        line-height: inherit;
        letter-spacing: inherit;
        margin: 0;
        overflow-wrap: anywhere;
    }
    /* 使用傾向・辞書全文はPCと同じ文字サイズ階層にする。 */
    #mobile-inspector-area .rn-usage-trends .rn-usage-group-label {
        font-family: var(--font-prose);
        font-size: var(--text-body);
        font-weight: 400;
        color: var(--text-sub);
        line-height: 1.5;
        letter-spacing: 0.01em;
        opacity: 1;
    }
    #mobile-inspector-area .rn-usage-trends .rn-usage-list,
    #mobile-inspector-area .rn-dict-full-section .rn-dict-full-text {
        font-family: var(--font-prose);
        font-size: var(--text-reading);
        font-weight: var(--weight-regular);
        color: var(--text-main);
        line-height: var(--line-height-dictionary);
        letter-spacing: var(--tracking-reading);
    }
    #mobile-inspector-area .rn-usage-trends .rn-usage-list {
        margin: 0;
    }
    #mobile-inspector-area .rn-dict-full-section .rn-dict-full-text {
        overflow-wrap: anywhere;
    }
    #mobile-inspector-area .wlv-chip-ja {
        letter-spacing: var(--tracking-reading);
        line-height: var(--line-height-word-chip);
    }
    #mobile-inspector-area .wlv-flow-label-compact {
        font-family: var(--font-prose);
    }
    #mobile-verse-view .mvv-passage-note {
        margin: 0 0 var(--space-md);
        padding-bottom: 0;
    }
    #mobile-verse-view .mvv-passage-note > summary {
        list-style: none;
        cursor: pointer;
        color: var(--text-sub);
        font-size: var(--text-caption);
        padding: var(--space-xs) 0;
    }
    #mobile-verse-view .mvv-passage-note > summary::-webkit-details-marker { display: none; }
    #mobile-verse-view .mvv-passage-note > summary::after {
        content: '+';
        float: right;
        color: var(--text-sub);
    }
    #mobile-verse-view .mvv-passage-note[open] > summary::after { content: '−'; }
    /* 語の分析中は節の読書メモを節側に残さない。本文の異読（mvv-apparatus-note）は除外する。 */
    #mobile-verse-area.word-analysis-open .mvv-passage-note:not(.mvv-apparatus-note) { display: none; }
    /* 本文の異読セクション（mvv-apparatus-note）のコンテンツ */
    #mobile-verse-view .mvv-apparatus-entries {
        padding: var(--space-sm) 0 0;
    }
    #mobile-verse-view .mvv-app-entry {
        padding: var(--space-xs) 0;
        border-bottom: 1px solid var(--border-soft);
    }
    #mobile-verse-view .mvv-app-entry:last-child {
        border-bottom: 0;
        padding-bottom: 0;
    }
    #mobile-verse-view .mvv-app-lem {
        font-size: var(--text-caption);
        color: var(--text-main);
        margin-bottom: var(--space-xs);
    }
    #mobile-verse-view .mvv-app-lem-gr {
        color: var(--text-sub);
        font-size: calc(var(--text-caption) * 0.9);
    }
    #mobile-verse-view .mvv-app-rdg-gr {
        color: var(--text-sub);
        font-size: calc(var(--text-caption) * 0.9);
    }
    #mobile-verse-view .mvv-app-rdg {
        display: flex;
        justify-content: space-between;
        gap: var(--space-sm);
        margin-bottom: 2px;
    }
    #mobile-verse-view .mvv-app-rdg-num {
        font-size: calc(var(--text-caption) * 0.85);
        color: var(--text-sub);
        flex-shrink: 0;
        width: 1.3em;
    }
    #mobile-verse-view .mvv-app-rdg-text {
        font-size: var(--text-caption);
        color: var(--text-main);
        flex: 1;
    }
    #mobile-verse-view .mvv-app-rdg-wit {
        font-size: calc(var(--text-caption) * 0.9);
        color: var(--text-sub);
        flex-shrink: 0;
    }
    /* 異読件数は見出しから視覚的に分離し、「件」を付けて意味を明確にする。 */
    .mvv-app-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-left: 0.35em;
        padding: 0.05em 0.55em;
        border-radius: 999px;
        background: var(--bg-inset, #f2f2f2);
        color: var(--text-sub);
        font-size: 0.78em;
        font-weight: 600;
        line-height: 1.6;
        vertical-align: middle;
        white-space: nowrap;
    }
    /* 日本語補助注釈（確認済み・自動生成共通） */
    #mobile-verse-view .mvv-app-anno {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: var(--space-xs);
        margin-bottom: var(--space-xs);
    }
    #mobile-verse-view .mvv-app-tag {
        font-size: calc(var(--text-caption) * 0.85);
        color: var(--text-sub);
        background: var(--bg-soft, rgba(0,0,0,0.04));
        padding: 1px 4px;
        border-radius: 2px;
        flex-shrink: 0;
    }
    #mobile-verse-view .mvv-app-ja {
        font-size: var(--text-caption);
        color: var(--text-sub);
    }
    /* 自動生成注釈（人手未確認）— タグチップを斜体にして本文可読性を維持しつつ区別 */
    #mobile-verse-view .mvv-app-anno--auto .mvv-app-tag {
        font-style: italic;
    }
    /* 語の読書メモは節メモと共通の開閉 UI を使う。 */
    #mobile-inspector-area #mvv-reading-slot {
        /* display:contents にして見出しの sticky の基準をメモ単体ではなく語詳細全体にする。 */
        display: contents !important;
    }
    #mobile-inspector-area .rn-word-reading-note-heading {
        display: block;
        position: sticky;
        border-top: 0 !important;
        border-bottom: 0 !important;
        box-shadow: none !important;
        /* モバイルの上部ヘッダーに重ならないよう、sticky の停止位置をヘッダー直下にする。 */
        top: var(--mobile-sticky-header-offset, 0px);
        z-index: 4;
        width: 100%;
        margin: 0;
        padding: var(--space-xs) 0;
        border: 0;
        background: var(--bg-paper);
        color: var(--text-sub);
        font: inherit;
        font-size: var(--text-caption);
        text-align: left;
        cursor: pointer;
    }
    #mobile-inspector-area .rn-word-reading-note-heading::after {
        content: '+';
        float: right;
        color: var(--text-sub);
    }
    #mobile-inspector-area .rn-word-reading-note-heading[aria-expanded="true"]::after {
        content: '−';
    }
    #mobile-inspector-area .rn-word-reading-note-body[hidden] {
        display: none;
    }
    #mobile-inspector-area .rn-word-reading-note-body {
        /* 内側の引用ブロック自身が左線とインデントを持つため、外側では重ねない。 */
        padding: var(--space-sm) 0 0;
        margin: 0 0 var(--space-md);
        border-left: 0;
        border-bottom: 0;
    }
    /* モバイルの語の読書メモでは、本文ブロックの上線とその余白を重ねない。 */
    #mobile-inspector-area .rn-word-reading-note-body .rn-prose {
        border-top: 0;
        padding-top: 0;
        margin-top: 0;
    }
    /* 同じ語に複数の読書メモがある場合、カード化・罫線化せず連続した本文として表示する。 */
    #mobile-inspector-area .rn-word-reading-note-body > [data-study-section] {
        margin: 0;
        padding: 0;
        border: 0;
        font-size: inherit;
        color: inherit;
    }
    #mobile-inspector-area .rn-word-reading-note-body .rn-referent-evidence,
    #mobile-inspector-area .rn-word-reading-note-body .rn-subjref-evidence,
    #mobile-inspector-area .rn-word-reading-note-body .rn-translation-evidence,
    #mobile-inspector-area .rn-word-reading-note-body .rn-repetition-evidence {
        margin: 0;
        padding: 0;
        border: 0;
        font-family: var(--font-prose);
        font-size: var(--text-body);
        font-weight: 400;
        line-height: 1.9;
        letter-spacing: 0.01em;
        color: var(--text-main);
    }
    #mobile-inspector-area .rn-word-reading-note-body > [data-study-section] + [data-study-section] {
        margin-top: var(--space-xs);
    }
    #mobile-inspector-area .rn-word-reading-note[open] > :not(summary) {
        padding-top: var(--space-sm);
    }
    #mobile-verse-view .mvv-passage-note .wlv-reading-passage-note {
        border-bottom: 0;
        padding: var(--space-sm) 0 0;
        margin: 0;
    }
    #mobile-verse-view .mvv-passage-note .wlv-pn-label { display: none; }
    /* Phase F-2: Level3 区画スケルトン（折りたたみセクション）。#mobile-verse-view 配下限定。 */
    #mobile-verse-view .mvv-l3-section {
        margin-top: var(--space-md);
        border-top: 1px solid var(--border-soft);
    }
    /* 形態情報の先頭は見出し語から始め、区画上部の罫線を重ねない。 */
    #mobile-verse-view .mvv-l3-section[data-study-section="morphology"] {
        border-top: 0;
    }
    #mobile-verse-view .mvv-l3-summary,
    #mobile-verse-view .mvv-l3-heading {
        list-style: none;
        padding: var(--space-sm) 0;
        font-size: var(--text-caption);
        font-weight: 600;
        color: var(--text-sub);
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
    }
    #mobile-verse-view .mvv-l3-summary::-webkit-details-marker { display: none; }
    /* 第3層は「形と関係を見る」「辞書的意味を見る」の2つの入口から任意に開く。 */
    /* 開閉インジケータ（▶ / 開いたら▼）。native details の open 状態で回転。 */
    #mobile-verse-view .mvv-l3-summary::before {
        content: '';
        width: 0; height: 0;
        border-left: 5px solid currentColor;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        transition: transform var(--transition-fast);
        flex-shrink: 0;
    }
    #mobile-verse-view .mvv-l3-section[open] .mvv-l3-summary::before {
        transform: rotate(90deg);
    }
    /* SF-43: mobile 語詳細内の Structure Flow disclosure（rn-level-section）を、同画面の mvv-l3
       disclosure と同一 UI family に揃える（CSS のみ・#mobile-verse-view scoped）。desktop の
       rn-level-section は非対象。flex/align-items/cursor/list-style は global 規則を継承（非再宣言）。 */
    #mobile-verse-view .rn-level-section { margin-top: var(--space-md); }
    #mobile-verse-view .rn-level-section > summary {
        font-size: var(--text-caption);
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: var(--space-sm) 0;
        font-family: inherit;
    }
    /* chevron SVG は mobile では隠し、mvv-l3 と同じ CSS 三角に統一 */
    #mobile-verse-view .rn-level-section > summary .rn-level-arrow { display: none; }
    #mobile-verse-view .rn-level-section > summary::before {
        content: '';
        width: 0; height: 0;
        border-left: 5px solid currentColor;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        margin-right: var(--space-xs);
        flex-shrink: 0;
        transition: transform var(--transition-fast);
    }
    #mobile-verse-view .rn-level-section[open] > summary::before { transform: rotate(90deg); }
    #mobile-verse-view .mvv-l3-slot {
        padding: 0 0 var(--space-sm);
        /* Phase F-3: 読書メモ本文の可読スタイル（本文と同等の落ち着いた読み） */
        font-size: var(--text-caption);
        line-height: 1.9;
        color: var(--text-sub);
    }
    /* Level 3 の見出し語はドロワーのギリシャ語と同じタイポグラフィにする。
       .mvv-l3-slot の補助文字サイズを継承しないよう、見出し語側で明示する。 */
    #mobile-verse-view .mvv-l3-lemma {
        font-family: var(--font-greek);
        font-size: var(--text-title);
        line-height: 1.2;
        color: var(--text-main);
    }
    /* Phase B: 節本文の最小表示（書名章節 + 本文） */
    #mobile-verse-view .mvv-ref {
        font-size: var(--text-caption);
        font-weight: 600;
        letter-spacing: var(--tracking-subsection);
        color: var(--text-hint);
        display: block;
        margin-bottom: var(--rhythm-medium-y);
    }
    #mobile-verse-view .mvv-body {
        font-size: var(--text-body);
        color: var(--text-main);
        line-height: 1.9;
    }
}

/* sidebar/menu: 全項目を medium（縦8px/横16px）ベースで統一し、グルーピングのみ macro（24px）を使う。 */
.sidebar-menu { flex: 1; padding: var(--rhythm-medium-y) var(--rhythm-medium-y); overflow-y: auto; }
.sidebar-section { margin-bottom: var(--rhythm-macro-min); }
.section-label { font-size: var(--text-caption); font-weight: 600; color: var(--text-sub); padding-left: var(--rhythm-medium-y); margin-bottom: var(--rhythm-medium-y); letter-spacing: var(--tracking-label); }

.menu-item {
padding: var(--rhythm-medium-y) var(--rhythm-medium-x);
border-radius: var(--radius-s);
display: flex;
align-items: center;
gap: var(--rhythm-medium-y);
cursor: pointer;
transition: background var(--transition-fast);
white-space: nowrap;
font-size: var(--text-body);
/* Layer 4: 非アクティブ項目は --text-sub にして本文との序列を明確にする */
color: var(--text-sub);
}
.menu-item:hover { background: rgba(0,0,0,0.04); }
.menu-item.active { background: var(--accent-light); color: var(--highlight); }

.sb-layer { display: none; }
.sb-layer.active { display: block; }
.sb-layer-header {
display: flex; align-items: center; gap: var(--rhythm-medium-y);
padding: var(--rhythm-medium-y) var(--rhythm-medium-x); cursor: pointer; border-radius: var(--radius-s); margin-bottom: var(--space-xs);
transition: background var(--transition-fast);
}
.sb-layer-header:hover { background: rgba(0,0,0,0.04); }
.sb-back-arrow { font-size: var(--text-caption); color: var(--highlight); font-weight: 700; }
.sb-layer-title { font-size: var(--text-caption); font-weight: 600; color: var(--accent); letter-spacing: var(--tracking-subsection); }
.sb-row {
padding: 6px 12px; font-size: var(--text-body); font-weight: 500; color: var(--text-main);
cursor: pointer; display: flex; align-items: center; justify-content: space-between;
border-radius: var(--radius-s); margin-bottom: var(--space-xs); transition: background var(--transition-fast);
}
.sb-row:hover { background: rgba(0,0,0,0.04); }
.sb-row.active { background: var(--highlight-light); color: var(--highlight); }
/* 読書モードの1行説明（入口導線 Phase 1）: ラベルの下に小さく添える */
.sb-mode-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.sb-mode-desc { font-size: var(--text-caption); font-weight: 400; color: var(--text-sub); line-height: 1.45; }
.sb-row.active .sb-mode-desc { color: var(--highlight); opacity: .85; }
.mmp-mode-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mmp-mode-desc { font-size: var(--text-caption); color: var(--text-sub); line-height: 1.45; }
/* 書一覧末尾の注記（旧約聖書は準備中） */
.sb-ot-note, .mbp-ot-note { font-size: var(--text-caption); color: var(--text-sub); padding: var(--space-sm) 12px; line-height: 1.5; }
.mbp-ot-note { padding: var(--space-sm) var(--space-lg); }
.sb-row-arrow { font-size: var(--text-caption); color: var(--text-sub); }
.sb-row.active .sb-row-arrow { color: var(--highlight); }
@media (max-width: 900px) {
    .sb-row { padding: 10px 12px; margin-bottom: var(--space-sm); }
}

/* ── サイドバー底部 Information ─────────────── */
.sidebar-bottom {
    flex-shrink: 0;
    border-top: 1px solid var(--border-soft);
}
.sb-info-footer {
    padding: var(--space-sm) var(--space-md);
    display: flex;
    align-items: center;
}
#sb-info-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: none;
    border: 1px solid var(--border-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-sub);
    padding: 0;
    transition: background var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
}
#sb-info-btn:hover { background: var(--highlight-light); color: var(--highlight); }
#sb-info-btn:active { transform: scale(0.93); }
#info-overlay-card {
    position: fixed;
    width: 210px;
    background: var(--bg-paper);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.05);
    z-index: 500;
    overflow: hidden;
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    pointer-events: none;
    transition: opacity var(--transition-fast),
                transform var(--transition-fast);
}
#info-overlay-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}
.info-card-items { padding: var(--space-xs) 0; }
.info-lang-row {
    display: flex; align-items: center; gap: var(--space-sm);
    padding: 10px var(--space-md); border-top: 1px solid var(--border-soft);
    font-size: var(--text-body); color: var(--text-main);
}
.info-lang-label { color: var(--text-sub); margin-right: auto; }
.info-lang-btn {
    background: none; border: 1px solid var(--border-soft); border-radius: var(--radius-s);
    padding: 3px 10px; cursor: pointer; font-family: inherit; font-size: var(--text-body);
    color: var(--text-sub); -webkit-tap-highlight-color: transparent;
}
.info-lang-btn.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
/* 言語の入り口（2026-11-05 決定）: PC はヘッダー右端に常時表示、
   モバイルは右下 FAB メニューの一番上。情報カード内の切替も従来どおり残す。 */
#header-lang-toggle { display: flex; gap: 6px; align-items: center; }
.header-lang-btn { font-size: var(--text-caption); padding: 2px 8px; }
.fab-lang-word { color: var(--text-sub); }
.fab-lang-word.active { color: var(--accent); font-weight: 600; }
.info-card-item {
    width: 100%; display: flex; align-items: center; gap: var(--space-sm);
    padding: 10px var(--space-md); background: none; border: none;
    cursor: pointer; font-size: var(--text-body); color: var(--text-main);
    font-family: inherit; text-align: left;
    transition: background var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
}
.info-card-item:hover { background: var(--bg-panel); }
.info-card-item svg { flex-shrink: 0; color: var(--text-sub); }
.info-beta-badge {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: var(--accent-light);
    border-radius: var(--radius-s);
    padding: 1px 5px;
    margin-left: auto;
    line-height: 1.4;
    flex-shrink: 0;
}
.sb-ch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--rhythm-micro); padding: var(--rhythm-medium-y) var(--rhythm-medium-x) var(--rhythm-medium-x); }
.sb-ch-btn {
aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
font-size: var(--text-caption); font-weight: 500; color: var(--text-sub);
background: #fff; border: 1px solid var(--border-soft);
border-radius: var(--radius-s); cursor: pointer; transition: all var(--transition-fast);
}
.sb-ch-btn:hover { background: var(--highlight-light); border-color: var(--highlight); color: var(--highlight); }
.sb-ch-btn.active { background: var(--highlight); color: #fff; border-color: var(--highlight); }

.sb-nav-header {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: var(--space-xs);
    padding: var(--rhythm-medium-y) var(--rhythm-medium-x);
    border-bottom: 1px solid rgba(0,0,0,0.06);
}
.sb-nav-item {
    background: none;
    border: none;
    padding: 0 var(--space-xs);
    font-size: var(--text-caption);
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.03em;
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    cursor: pointer;
    transition: opacity var(--transition-fast);
    line-height: 1.6;
}
.sb-nav-item:hover { opacity: var(--opacity-secondary); }
.sb-nav-item.active {
    color: var(--text-main);
    opacity: var(--opacity-primary);
    cursor: default;
}
.sb-nav-sep {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-disabled);
    user-select: none;
    padding: 0 var(--space-xs);
}
.sb-nav-sep-book {
    opacity: var(--opacity-disabled);
}
.sb-nav-book {
    font-size: var(--text-caption);
    font-weight: 600;
    color: var(--text-main);
    opacity: var(--opacity-primary);
    letter-spacing: 0.01em;
    line-height: 1.6;
}

/* main = 最前面のカード (z-index:10)。sidebar (z-index:5) は常に背面。
   sidebar が開くと main が自発的に退き、背後のレイヤーが見える構造。 */
.container {
    flex: 1; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--bg-paper);
    overflow: hidden;
    height: 100%;
    position: relative;
    z-index: 10;
    transform-origin: center center;
    transition:
        transform      var(--transition-slow),
        border-radius  var(--transition-slow),
        box-shadow     var(--transition-slow);
}
.nav-sidebar.open ~ .container {
    transform: translateX(280px);
    border-radius: 16px;
    box-shadow: -10px 0 30px rgba(0,0,0,0.12);
}
.app-header { padding: 18px 40px; border-bottom: 1px solid var(--border-soft); background: var(--bg-paper); flex-shrink: 0; position: sticky; top: 0; z-index: 20; }
.header-content { display: flex; align-items: center; justify-content: space-between; }
#global-breadcrumb {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
}
.gbc-item {
    font-family: var(--font-ui);
    font-size: var(--text-caption);
    color: var(--text-sub);
    cursor: pointer;
    padding: var(--space-xs) 0;
    letter-spacing: 0.01em;
    border-bottom: 1px solid transparent;
    transition: color var(--transition-fast), border-color var(--transition-fast);
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
}
.gbc-item:not(.current)::after {
    content: '▾';
    font-size: 0.7em;
    margin-left: 2px;
    opacity: 0.45;
    vertical-align: middle;
}
.gbc-item:hover {
    color: var(--text-main);
    border-bottom-color: rgba(0,0,0,0.15);
}
.gbc-item.current {
    color: var(--text-main);
    font-weight: 600;
    cursor: default;
    border-bottom-color: transparent;
}
.gbc-sep {
    color: var(--text-hint);
    font-size: var(--text-caption);
    padding: 0 var(--space-xs);
    user-select: none;
}
.gbc-chapter-nav {
    display: flex;
    align-items: center;
    gap: 2px;
}
.gbc-ch-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.6em;
    line-height: 1;
    color: var(--text-sub);
    border-radius: var(--radius-s);
    transition: background var(--transition-fast), color var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
@media (max-width: 768px) {
    .gbc-ch-arrow { min-width: 36px; min-height: 36px; padding: 4px 6px; }
}
.gbc-ch-arrow:hover:not(:disabled) {
    background: rgba(0,0,0,0.06);
    color: var(--text-main);
}
.gbc-ch-arrow:active:not(:disabled) {
    background: rgba(0,0,0,0.10);
}
.gbc-ch-arrow:disabled {
    opacity: 0.2;
    cursor: default;
}
.gbc-ch-label {
    background: none;
    border: none;
    cursor: default;
    font-family: var(--font-ui);
    font-size: var(--text-caption);
    font-weight: 600;
    line-height: 1;
    color: var(--text-main);
    letter-spacing: 0.01em;
    padding: 0 2px;
}

#panel-back-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 0;
    color: var(--text-sub);
    font-family: inherit;
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: color var(--transition-fast);
    flex-shrink: 0;
    width: auto;
}
#panel-back-btn:hover { color: var(--text-main); }
.panel-back-arrow {
    opacity: var(--opacity-secondary);
    flex-shrink: 0;
}

.breadcrumb { display: flex; align-items: center; gap: var(--space-sm); color: var(--text-sub); font-size: var(--text-body); }
.breadcrumb h1 { font-size: var(--text-body-lg); margin: 0; color: var(--text-main); font-weight: 700; letter-spacing: -0.02em; }
.separator { color: var(--text-sub); opacity: var(--opacity-tertiary); }

#app {
flex: 1;
min-height: 0;
display: flex;
flex-direction: column;
overflow: hidden;
}

/* ══════════════════════════════════════════
Reading / Study レイアウト
Reading: side-panel 非表示 → 本文全幅
Study:   side-panel 表示  → 本文縮小
bottom-word-panel は廃止（Inspectに統合）
══════════════════════════════════════════ */
#main-reading-area {
flex: 1;
display: grid;
grid-template-columns: 1fr 42%;
min-height: 0;
overflow-y: auto;
touch-action: manipulation;
}
#bible-text-area {
overflow: visible;
padding: 0;
min-width: 0;
max-width: 44em;
opacity: 0;
transition: opacity var(--transition-slow);
}
#parallel-text-area {
overflow: visible;
padding: 0;
background: var(--bg-inset);
border-left: 1px solid rgba(0,0,0,0.08);
font-size: var(--text-body);
color: var(--text-sub);
line-height: 2.0;
}
.verse-pair { display: contents; }
.verse-pair-left {
padding: 2px 32px 2px 52px;
background: #fff;
}
.verse-pair-right {
padding: var(--space-xs) var(--space-lg) var(--space-xs) var(--space-xl);
background: var(--bg-inset);
align-self: stretch;
}
.verse-grid-spacer-left  { height: 32px; background: #fff; }
.verse-grid-spacer-right { height: 32px; background: var(--bg-inset); }
.verse-grid-footer-left  { height: 40px; background: #fff; }
.verse-grid-footer-right { height: 40px; background: var(--bg-inset); }
#main-reading-area.panel-open {
    grid-template-columns: 1fr 0;
}
#main-reading-area.panel-open #parallel-text-area,
#main-reading-area.panel-open .verse-pair-right,
#main-reading-area.panel-open .verse-grid-spacer-right,
#main-reading-area.panel-open .verse-grid-footer-right {
    display: none;
}


/* bottom-word-panel: 廃止。高さ0で残骸を隠す */
#bottom-word-panel {
display: none;
}
#panel-content { display: none; }
#word-detail-view { display: none; }

/* Layer 4 クロム: フッターも #fafafa にして本文エリアとクロムを分離する */
.app-footer {
border-top: 1px solid var(--border-soft);
padding: 12px 48px;
display: flex;
align-items: center;
justify-content: space-between;
flex-shrink: 0;
background: var(--bg-inset);
}
.footer-copy {
font-size: var(--text-caption);
color: var(--text-sub);
letter-spacing: 0.01em;
}
.footer-links {
display: flex;
gap: var(--space-md);
}
.footer-links button {
font-size: var(--text-caption);
color: var(--text-sub);
background: none;
border: none;
border-bottom: 1px solid rgba(0,0,0,0.12);
cursor: pointer;
padding-bottom: var(--space-xs);
font-family: inherit;
transition: color var(--transition-fast);
}
.footer-links button:hover { color: var(--text-main); }

#open-panel-btn, #open-source-btn {
background: transparent; border: none; padding: 0 var(--space-sm); cursor: pointer; color: var(--highlight);
font-size: var(--text-title); transition: transform var(--transition-base), opacity var(--transition-base); line-height: 1;
}
#open-panel-btn:hover, #open-source-btn:hover { opacity: var(--opacity-secondary); transform: scale(1.1); }
#open-source-btn { font-size: var(--text-caption); }

/* ★ Apple風カードUI（StudyPanel）。
   高さは既存の46vh/220px/70vh＋ドラッグハンドルによるユーザー操作の
   レンジをそのまま維持する（これは「コンテンツ量による自動伸長」では
   なくユーザーの明示的な操作であり、今回の「固定高さ」要件が禁止する
   対象ではないと判断した — もし完全に固定値・リサイズ不可にしたい
   場合は別途指示が必要）。今回の核心の修正は overflow: visible →
   hidden。中身（#reading-notes-wrap / 動的生成される #word-list-view）は
   どちらも flex:1; min-height:0; overflow-y:auto 済みのため、コンテナ
   側さえ hidden にすればコンテンツ量に関わらずパネル自体は伸びず、
   スクロールは内部のみで完結する。 */
/* 方向軸分離：panel は常に position:fixed で Y 軸専有。
   sidebar（X 軸）と空間を共有しない。display:none による状態制御は禁止。
   モバイルではCSS変数（--panel-default-h 等）で高さを差し替える。 */
#bottom-depth-panel {
/* 高さの数値定義は Panel Geometry SSOT（スタイルシート前方の
   #bottom-depth-panel 定義と ≤900px メディアの上書き）にある。
   ここでは var() で参照するだけ（値の直書き禁止）。 */
position: fixed;
bottom: 0;
left: 0;
right: 0;
width: 100%;
height: var(--panel-default-h);
min-height: var(--panel-min-h);
max-height: var(--panel-max-h);
background: var(--bg-panel);
border-top: 1px solid var(--border-soft);
padding: 0;
display: flex;
flex-direction: column;
flex-shrink: 0;
box-sizing: border-box;
overflow: hidden;
z-index: 150;
transform: translateY(100%);
transition: transform var(--transition-slow);
will-change: transform;
pointer-events: none;
}
#bottom-depth-panel.open {
transform: translateY(0);
pointer-events: auto;
}

/* ★ top を -4px ではなく 0 にする：親 #bottom-depth-panel が
   overflow:hidden になったため、パネル境界の外（負のオフセット）に
   はみ出す部分はクリップされてしまう。掴み領域の高さは変えず、
   パネル内側に完全に収める。 */
#panel-resize-handle {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 8px;
cursor: row-resize;
z-index: 100;
display: flex;
justify-content: center;
align-items: flex-end;
touch-action: none;
}
#panel-resize-handle::after {
content: '';
display: block;
height: 3px;
width: 40px;
border-radius: var(--radius-s);
background: var(--border-soft);
transition: background var(--transition-fast), width var(--transition-fast);
margin-bottom: var(--space-xs);
}
#panel-resize-handle:hover::after,
#panel-resize-handle.dragging::after {
background: var(--highlight);
width: 60px;
}
/* ★ Apple風カードUI: 既存デザイントークンの余白（16/24px）を使用。
   header は flex-shrink:0 で常に固定表示、スクロールするのは
   #reading-notes-wrap / #word-list-view 側のみ。 */
.panel-header {
font-weight: 700;
font-size: var(--text-body-lg);
line-height: 1.4;
letter-spacing: -0.01em;
padding: var(--space-md) var(--space-lg) var(--space-sm);
display: flex;
justify-content: space-between;
align-items: center;
color: var(--accent-dark);
flex-shrink: 0;
}
/* タイトル領域（戻るボタン＋現在地ラベル）とアクション領域（☆🔗📝）を明確に分離する。
   .panel-header の space-between はこの2グループの間にだけ働かせ、
   ボタン同士の間隔はグループ内の gap のみで決める（margin-left:auto の力技は使わない）。 */
.panel-header-title {
display: flex;
align-items: center;
gap: var(--space-sm);
min-width: 0;
overflow: hidden;
}
.panel-header-actions {
display: flex;
align-items: center;
gap: var(--space-sm);
flex-shrink: 0;
}

.share-url-btn {
background: none;
border: none;
cursor: pointer;
font-size: var(--text-body);
padding: var(--space-xs) var(--space-xs);
border-radius: var(--radius-s);
opacity: var(--opacity-secondary);
display: inline-flex;
align-items: center;
justify-content: center;
}
.share-url-btn:hover { opacity: var(--opacity-primary); background: rgba(0,0,0,0.05); }
/* 絵文字（OS依存）の代わりに線画SVGアイコンを使用する。サイズはpx固定ではなく
   .share-url-btn自身のfont-size（var(--text-body)）基準のemにして、周囲のテキストと
   スケールが連動するようにする。 */
.share-url-btn svg { width: 1.1em; height: 1.1em; display: block; }
#mobile-menu-btn svg { width: 19px; height: 19px; display: block; }
#mobile-menu-btn { align-items: center; justify-content: center; }

.share-toast {
position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px);
background: var(--accent-dark, #333); color: #fff; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-s);
font-size: var(--text-caption); opacity: 0; pointer-events: none; transition: opacity var(--transition-base), transform var(--transition-base); z-index: 9999;
}
.share-toast.visible { opacity: var(--opacity-primary); transform: translateX(-50%) translateY(0); }


/* タブなし・単一スクロール・annotation feel */
#reading-notes-wrap {
display: flex;
flex-direction: column;
/* スクロールバー出現による横幅変化（chips再ラップ・カラムずれ）を防ぐ。
   both-edges で左右対称に予約し、中心軸を真中心に保つ */
scrollbar-gutter: stable both-edges;
}
#reading-notes-area {
padding: 0 var(--rhythm-macro-min) 60px;
width: 100%;
max-width: 44em;
box-sizing: border-box;
/* Level 2（#word-list-view）と同じ中央カラムに揃える。
   これが無いと Level 2⇄3 遷移で視線の中心軸が跳ぶ（UX監査 実測287px） */
margin-left: auto;
margin-right: auto;
}

.rn-word-head {
padding: var(--rhythm-macro-min) 0 var(--rhythm-medium-y);
margin-bottom: 0;
}
.rn-greek {
font-size: var(--text-headline);
display: block;
margin-bottom: var(--space-xs);
}
.rn-ja {
font-size: var(--text-body);
color: var(--text-sub);
font-weight: 400;
display: block;
margin-bottom: var(--space-xs);
}
.rn-glosses {
margin-top: var(--space-md);
padding-top: var(--space-sm);
border-top: 1px solid var(--border-soft);
}
.rn-glosses-label {
display: block;
margin-bottom: var(--space-xs);
}
.rn-glosses-text {
font-size: var(--text-body);
color: var(--text-main);
line-height: 1.6;
}
.rn-dict-table {
border-collapse: collapse;
width: 100%;
}
.rn-dict-table td {
padding: var(--space-xs) 0;
vertical-align: baseline;
line-height: 1.6;
}
.rn-dict-key {
font-size: var(--text-caption);
font-weight: 700;
letter-spacing: 0.06em;
color: var(--text-sub);
white-space: nowrap;
padding-right: var(--space-md);
width: 4.5em;
}
.rn-dict-val {
font-size: var(--text-body);
color: var(--text-main);
}
.rn-dict-greek {
font-family: var(--font-greek);
font-size: var(--text-title);
display: inline;
line-height: 1.2;
}
.rn-dict-comp {
font-size: var(--text-body);
color: var(--text-main);
}

.rn-notes {
margin-top: var(--rhythm-medium-y);
}

/* ══════════════════════════════════════════
   Depth reading system
   rn-prose → rn-deep（深く読む）の縦方向連続体
   「別パネル」ではなく「本文が深く続く」感覚

   Layer 1: rn-prose      - 表層の読書メモ
   Layer 2: rn-deep-prose - 橋：表現の深読み
   Layer 3: rn-grammar    - 最下層：grammar（折りたたみ）

   open時: rn-proseが後景へ静かに沈む
   ══════════════════════════════════════════ */

/* Layer 1: surface reading prose */
.rn-prose {
margin-top: var(--space-sm);
border-top: 1px solid rgba(0,0,0,0.05);
padding-top: var(--rhythm-medium-y);
padding-bottom: var(--space-xs);
margin-bottom: 0;
transition: opacity var(--transition-slow), transform var(--transition-slow);
}
.rn-prose-text {
font-size: var(--text-body);
}

/* rn-deep-section/toggle/body: 廃止済み（Layer 1/2 統合）互換のため定義のみ残す */
.reading-deep-active .rn-prose { opacity: var(--opacity-primary); transform: none; }
.rn-deep-section { display: none; }
.rn-deep-toggle  { display: none; }
.rn-deep-body    { display: none; }
@keyframes depthUnfold {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: var(--opacity-primary); transform: translateY(0); }
}

/* Layer 2: deep reading prose - 橋としての自然文 */
/* 直接 grammar ではなく、読書の延長として入る */
.rn-deep-prose {
padding: var(--space-sm) 0 var(--space-md) 0;
border-bottom: 1px solid rgba(0,0,0,0.04);
margin-bottom: var(--space-md);
}
.rn-deep-prose-text {
font-size: var(--text-body);
}

/* Layer 3: grammar section label - 最下層の静かなラベル */
.rn-grammar-label {
display: block;
margin-bottom: var(--space-sm);
}

/* Layer 3 information groups: quiet hierarchy, no cards or panels. */
.rn-l3-group { margin-top: var(--space-md); }
.rn-l3-group:first-child { margin-top: 0; }
/* Layer 3 は一つの disclosure にまとめ、内部の分類は開閉を重ねず見出しで区別する。 */
.rn-l3-entry > .rn-l3-entry-summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--space-xs); color: var(--text-sub); font-size: var(--text-caption); font-weight: 600; letter-spacing: 0.02em; padding: var(--space-sm) 0; }
.rn-l3-entry > .rn-l3-entry-summary::-webkit-details-marker { display: none; }
.rn-l3-entry > .rn-l3-entry-summary::before { content: ''; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; flex-shrink: 0; transition: transform var(--transition-fast); }
.rn-l3-entry[open] > .rn-l3-entry-summary::before { transform: rotate(90deg); }
.rn-l3-entry > .rn-l3-entry-summary + .rn-level-body { padding-top: var(--space-xs); }
.rn-l3-group-label { color: var(--text-sub); font-size: var(--text-label); font-weight: 600; line-height: 1.5; letter-spacing: 0.02em; margin: 0 0 var(--space-xs); }
/* 長い辞書・語彙資料は必要なときだけ開く。カード化せず、静かな disclosure として扱う。 */
.rn-l3-disclosure > summary { display: flex; align-items: center; gap: var(--space-xs); cursor: pointer; list-style: none; }
.rn-l3-disclosure > summary::-webkit-details-marker { display: none; }
.rn-l3-disclosure > summary::before { content: ''; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 3px solid transparent; border-bottom: 3px solid transparent; flex-shrink: 0; transition: transform var(--transition-fast); }
.rn-l3-disclosure[open] > summary::before { transform: rotate(90deg); }
.rn-l3-disclosure > .rn-l3-group-content { padding-top: var(--space-xs); }
#mobile-inspector-area .rn-l3-group { margin-top: var(--space-md); }
#mobile-inspector-area .rn-l3-group:first-child { margin-top: 0; }

/* grammar grid: 同温度・同余白 */
.rn-morph-grid {
display: grid;
grid-template-columns: auto 1fr;
gap: var(--space-xs) var(--space-md);
font-size: var(--text-caption);
margin-bottom: var(--space-sm);
}
.rn-morph-key {
color: var(--text-sub);
font-size: var(--text-caption);
font-weight: 400;
padding: var(--space-xs) 0;
border-bottom: 1px solid rgba(0,0,0,0.03);
white-space: nowrap;
opacity: var(--opacity-secondary);
}
.rn-morph-val {
color: var(--text-main);
font-weight: 400;
font-size: var(--text-caption);
padding: var(--space-xs) 0;
border-bottom: 1px solid rgba(0,0,0,0.03);
}
.rn-morph-val.core { font-weight: 600; }

/* Morphological alternatives: secondary to the attested analysis. */
.rn-mc-details {
margin-bottom: var(--space-sm);
font-size: 14px;
line-height: 1.6;
}
.rn-mc-label {
color: var(--text-sub);
font-family: var(--font-prose);
font-size: var(--text-label);
font-weight: 600;
line-height: 1.5;
letter-spacing: 0.04em;
padding: var(--space-xs) 0;
opacity: 1;
}
.rn-mc-list {
display: flex;
flex-direction: column;
gap: var(--space-xs);
margin: var(--space-xs) 0 0 0;
padding: 0;
list-style: none;
}
.rn-mc-item {
padding: 0;
color: var(--text-sub);
line-height: 1.6;
border: 0;
}
.rn-mc-chips {
display: flex;
flex-wrap: wrap;
gap: var(--space-xs);
}
.rn-mc-chip {
display: inline-flex;
align-items: center;
/* .morph-tag-pill と形状・サイズを共有し、色だけで主候補と区別する */
font-size: var(--text-caption);
font-weight: 400;
line-height: 1.5;
padding: var(--space-xs) var(--space-sm);
border: 1px solid var(--border-soft);
border-radius: var(--radius-l);
background: var(--bg-panel);
color: var(--text-sub);
letter-spacing: 0.01em;
}

.rn-lexicon {
font-size: var(--text-caption);
color: var(--text-sub);
line-height: 1.8;
padding: var(--space-sm) 0 var(--space-xs);
margin-top: var(--space-xs);
border-top: 1px solid rgba(0,0,0,0.04);
}
.rn-lexicon-label {
display: block;
margin-bottom: var(--space-xs);
cursor: help;
border-bottom: 1px dotted rgba(0,0,0,0.15);
}

/* 統語論ラベル — StudyPanel Level 2 */
.rn-syntax-labels {
    margin-bottom: var(--space-sm);
}
.rn-syntax-candidates {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    margin-top: var(--space-xs);
}
.rn-syntax-item {
    min-width: 0;
}
.rn-syntax-item-heading {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: var(--space-xs);
}
.rn-syntax-term {
    /* 候補名は見出しではなく項目名：グループ見出しと同じ小見出しサイズにそろえる */
    font-size: var(--text-label);
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-main);
}
.rn-syntax-item-primary .rn-syntax-term {
    color: var(--text-main);
}
.rn-syntax-best-label {
    font-size: var(--text-caption);
    font-weight: 500;
    color: var(--text-sub);
    white-space: nowrap;
}
.rn-syntax-description {
    margin-top: 2px;
    color: var(--text-sub);
    font-size: var(--text-caption);
    line-height: 1.65;
}
.rn-syntax-context-note {
    margin-top: 2px;
    color: var(--text-sub);
    font-size: var(--text-caption);
    line-height: 1.65;
    opacity: 0.85;
}
.rn-syntax-context-toggle {
    margin-top: 2px;
    padding: 0;
    border: none;
    background: none;
    color: var(--accent, #2f6f4f);
    font-size: var(--text-caption);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
}
.rn-syntax-context-body {
    margin-top: var(--space-xs);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: var(--space-xs) var(--space-sm);
    background: var(--bg);
}
.rn-syntax-context-body[hidden] { display: none; }
.rn-syntax-ctx-verse { margin: 2px 0; line-height: 1.7; }
.rn-syntax-ctx-verse + .rn-syntax-ctx-verse { border-top: 1px dashed var(--border-soft); padding-top: 4px; }
.rn-syntax-ctx-ref {
    color: var(--text-sub);
    font-size: var(--text-caption);
    font-weight: 600;
    margin-right: 6px;
    white-space: nowrap;
}
.rn-syntax-ctx-text { font-family: var(--font-greek, inherit); }
.rn-syntax-ctx-target { font-weight: 700; color: var(--accent, #2f6f4f); }
.rn-syntax-ctx-hint {
    margin-top: var(--space-xs);
    color: var(--text-sub);
    font-size: var(--text-caption);
    line-height: 1.65;
}
.rn-syntax-ctx-hint-label { font-weight: 600; }
.rn-syntax-ctx-jump {
    margin-top: var(--space-xs);
    padding: 2px 10px;
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: var(--bg-panel);
    color: var(--text-main);
    font-size: var(--text-caption);
    cursor: pointer;
}
.rn-ctx-flash { animation: rnCtxFlash 1.8s ease-out; }
@keyframes rnCtxFlash {
    0%, 60% { background-color: rgba(47, 111, 79, 0.18); }
    100% { background-color: transparent; }
}
.rn-syntax-alternatives {
    margin-top: var(--space-sm);
    border-top: 1px solid var(--border-soft);
    padding-top: var(--space-xs);
}
.rn-syntax-alternatives-label {
    color: var(--text-sub);
    font-size: var(--text-caption);
    font-weight: 600;
    padding: var(--space-xs) 0;
}
.rn-syntax-alternatives-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    padding-top: var(--space-xs);
}
.rn-syntax-tied-notice {
    color: var(--text-sub);
    font-size: var(--text-caption);
    line-height: 1.6;
    margin-bottom: var(--space-xs);
}

.rn-syntax-comparison {
    margin-top: var(--space-sm);
    padding-top: var(--space-sm);
    border-top: 1px solid var(--border-soft);
    color: var(--text-sub);
    font-size: var(--text-caption);
    line-height: 1.7;
}
.rn-syntax-comparison-title {
    margin-bottom: var(--space-xs);
    color: var(--text-main);
    font-weight: 600;
}
.rn-syntax-comparison p,
.rn-syntax-evidence-body p {
    margin: 0 0 var(--space-xs);
}
.rn-syntax-evidence {
    margin-top: var(--space-xs);
}
.rn-syntax-evidence-label {
    color: var(--text-main);
    font-weight: 600;
    margin: 0 0 var(--space-xs);
}
.rn-syntax-evidence-body {
    padding-top: var(--space-xs);
}

/* ─── Layer 3: 「単語を調べる」reference layer ─── */
/* 読書から分離された最下層。折りたたみ。annotation feel。 */
.rn-ref-section {
    margin-top: var(--space-md);
}
.rn-ref-toggle {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--border);
    padding: var(--space-sm) 0;
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: 0;
    color: var(--text-sub);
    cursor: pointer;
    font-family: var(--font-prose);
    text-align: left;
    transition: color var(--transition-fast);
    opacity: 1;
}
.rn-ref-toggle:hover {
    color: var(--text-main);
}
.rn-ref-toggle.open {
    opacity: 1;
}
.rn-ref-body {
    display: none;
    margin-top: 0;
    padding-left: 0;              /* 幅統一: 追加インデントなし */
    padding-top: var(--space-sm);
    animation: depthUnfold var(--transition-base) both;
}
.rn-exp-labels {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs);
    margin: var(--space-sm) 0 var(--space-xs) 0;
}
.rn-exp-label {
    font-size: var(--text-caption);
    font-family: var(--font-prose);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    letter-spacing: 0.03em;
    padding: var(--space-xs) var(--space-sm);
    border: 0.5px solid var(--accent-mid);
    border-radius: var(--radius-m);
    background: var(--accent-light);
}
.rn-ref-body.visible { display: block; }

.rn-search-links {
display: flex;
flex-wrap: wrap;
gap: var(--space-xs);
margin-top: var(--space-md);
padding-top: var(--space-sm);
border-top: 1px solid rgba(0,0,0,0.04);
}
.rn-search-link {
font-size: var(--text-caption);
color: var(--text-sub);
background: none;
border: none;
padding: 0;
cursor: pointer;
text-decoration: underline;
text-underline-offset: 2px;
text-decoration-color: rgba(0,0,0,0.18);
font-family: inherit;
letter-spacing: 0.01em;
transition: color var(--transition-fast);
opacity: var(--opacity-secondary);
}
.rn-search-link:hover { color: var(--highlight); opacity: var(--opacity-primary); }

/* ── Semantic Layer Sections ── */
.rn-cluster-section, .rn-concord-section {
    margin-top: 0;
    border-radius: var(--radius-m);
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--bg-panel);
}

/* Wrapper to stack sections with consistent gap */
#rn-semantic-layers {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    margin-top: var(--space-md);
}

/* [A] 削除: "項目をクリックすると展開します" の ::before 擬似要素。
   1セクション時は JS がトグルを除去して自動展開するため、
   「クリックで展開」という案内が実態と矛盾するケースが生じる。
   クリック可能性はボタンの chevron アイコンで伝達する。 */


.rn-layer-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0;
    width: 100%;
    background: transparent;
    border: none;
    padding: var(--space-sm);
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: 0;
    color: var(--text-sub);
    cursor: pointer;
    font-family: var(--font-prose);
    text-align: left;
    transition: background var(--transition-fast), color var(--transition-fast);
    opacity: 1;
    position: relative;
}
.rn-layer-toggle:hover {
    background: var(--accent-light);
    color: var(--text-main);
}
.rn-layer-toggle.open {
    background: transparent;
    opacity: 1;
}

.rn-layer-toggle-icon {
    transition: transform var(--transition-base);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    margin-left: auto;
    opacity: var(--opacity-secondary);
    flex-shrink: 0;
}
.rn-layer-toggle.open .rn-layer-toggle-icon {
    transform: rotate(90deg);
    opacity: var(--opacity-primary);
}

.rn-layer-body {
    display: none;
    padding: var(--space-sm) 0;   /* 水平 padding は #reading-notes-area が担保 */
    border-top: 1px solid var(--border);
    animation: rnLayerOpen var(--transition-base) both;
}
.rn-layer-body.visible { display: block; }
.rn-flat .rn-layer-body { border-top: none; padding-top: 0; }
.rn-layer-intro {
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.6;
    margin-bottom: var(--space-xs);
    padding-bottom: var(--space-xs);
    border-bottom: 1px solid rgba(0,0,0,0.06);
}
.rn-layer-intro-note {
    opacity: var(--opacity-secondary);
    font-size: 0.85em;
}

/* ── Cluster IA: グループ境界・補足情報の整理 ──
   説明文は DOM 順（チップ直前）を維持する。
   チップ表示順は変更しない。現在語は視覚強調のみで識別する。
   ──────────────────────────────────────────── */

/* 1. 出現回数を小さく・目立たなく */
/* 2. 第2グループの前にセパレーターを挿入（グループ境界の明示）
   chips の直後にmoreBtn が入る場合も考慮して両セレクターで指定する */
.rn-sibling-chips + .rn-ln-domain-label,
.rn-chip-more + .rn-ln-domain-label {
    margin-top: var(--space-md);
    padding-top: var(--space-sm);
    border-top: 1px solid var(--border);
}

@keyframes rnLayerOpen {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: var(--opacity-primary); transform: translateY(0); }
}

.rn-ln-domain-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: var(--space-sm);
    border-left: 2px solid var(--accent-mid);
    padding-left: 6px;
}
.rn-ln-domain-category {
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    text-transform: uppercase;
    font-family: var(--font-ui);
    display: none;
}
.rn-ln-domain-title {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.07em;
    color: var(--text-sub);
    opacity: var(--opacity-primary);
}
.rn-ln-domain-title::before {
    content: '意味領域：';
    font-weight: 400;
    letter-spacing: 0;
    opacity: 0.6;
}
.rn-sibling-chips {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: var(--space-xs);
}
.rn-sibling-chip {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: var(--space-sm);
    border-radius: 0;
    border: none;
    border-top: 1px solid var(--accent-light);
    background: transparent;
    cursor: pointer;
    transition: background var(--transition-fast);
    font-size: var(--text-caption);
}
.rn-sibling-chip:first-child {
    border-top: none;
}
.rn-sibling-chip:hover {
    background: var(--accent-light);
}
.rn-sibling-chip.current {
    background: var(--accent-light);
    border-left: 3px solid rgba(44,79,52,0.55);
    font-weight: 700;
    cursor: default;
}
/* ▶ は U+00A0（ノーブレークスペース）で Greek 語との間隔を確保する。
   将来 CSS margin に移行する場合は content を '▶' のみにして
   .rn-sibling-gr::before に margin-right を追加すること。 */
.rn-sibling-chip.current .rn-sibling-gr::before {
    content: '▶\00a0';
    font-size: 0.65em;
    opacity: 0.55;
    font-family: sans-serif;
    vertical-align: 0.1em;
}
.rn-sibling-gr {
    font-family: var(--font-greek);
    font-size: var(--text-body-lg);
    color: var(--text-main);
    line-height: 1.2;
}
.rn-sibling-ja {
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.2;
}
.rn-sibling-badge {
    font-size: var(--text-caption);
    letter-spacing: 0.04em;
    color: var(--text-sub);
    background: var(--accent-mid);
    border-radius: 3px;
    padding: 1px 5px;
    margin-top: 2px;
    font-family: var(--font-ui);
    opacity: var(--opacity-primary);
}
.rn-sibling-action {
    font-size: var(--text-caption);
    color: var(--highlight);
    opacity: 0.55;
    margin-top: 2px;
    font-family: var(--font-ui);
    transition: opacity var(--transition-fast);
}
.rn-sibling-chip:hover .rn-sibling-action {
    opacity: 0.9;
}
.rn-chip-hidden { display: none; }
.rn-chip-more {
    display: block;
    margin-top: 0;
    padding: var(--space-xs) var(--space-sm);
    background: none;
    border: none;
    border-top: 1px solid var(--accent-light);
    text-align: left;
    font-size: var(--text-caption);
    font-family: var(--font-ui);
    color: var(--highlight);
    cursor: pointer;
    opacity: 0.65;
    letter-spacing: 0.03em;
}
.rn-chip-more:hover { opacity: 1; }
.rn-concord-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
    max-height: 260px;
    overflow-y: auto;
}
.rn-concord-row {
    padding: var(--space-sm) var(--space-sm);
    border-radius: var(--radius-s);
    background: var(--accent-light);
    border: 1px solid var(--accent-light);
    cursor: pointer;
    transition: background var(--transition-fast);
}
.rn-concord-row:hover {
    background: var(--accent-light);
}
.rn-concord-ref {
    font-size: var(--text-caption);
    font-weight: 700;
    color: var(--highlight);
    letter-spacing: 0.04em;
    margin-bottom: var(--space-xs);
}
.rn-concord-text {
    font-family: var(--font-greek);
    font-size: var(--text-body);
    line-height: 1.55;
    color: var(--text-main);
}
.rn-concord-text .rn-concord-hl {
    font-weight: 700;
    color: var(--highlight);
}
.rn-concord-more {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    text-align: center;
    padding: var(--space-xs) 0 var(--space-xs);
}

/* 後方互換：分析タブバーは完全非表示 */
.analysis-tabs { display: none !important; }
#analysis-frame-wrap { display: none !important; }

/* 旧 iframe：非表示にして DOM に残す（外部参照の互換のため） */
#analysis-iframe {
display: none;
}
/* 新 インラインコンテンツエリア */
#analysis-content-area {
flex: 1;
overflow-y: auto;
padding: var(--space-md) var(--space-lg) var(--space-xl);
background: var(--bg-paper);
font-size: var(--text-body);
line-height: 1.9;
color: var(--text-main);
}
/* 分析コンテンツ内の共通スタイル */
.ac-section-label {
font-size: var(--text-caption);
font-weight: 600;
letter-spacing: 0.06em;
color: var(--text-sub);
margin-bottom: var(--space-sm);
display: block;
opacity: var(--opacity-secondary);
}
.ac-entry {
background: #fff;
border: 1px solid var(--border-soft);
border-radius: var(--radius-m);
padding: var(--space-md) var(--space-md);
margin-bottom: var(--space-sm);
}
.ac-entry-greek {
font-family: var(--font-greek);
font-size: var(--text-headline);
line-height: 1.2;
color: var(--text-main);
margin-bottom: var(--space-xs);
}
.ac-entry-ja {
font-size: var(--text-caption);
font-weight: 400;
color: var(--text-sub);
margin-bottom: var(--space-xs);
}
.ac-entry-desc {
font-size: var(--text-caption);
color: var(--text-sub);
line-height: 1.75;
border-top: 1px solid var(--border-soft);
padding-top: var(--space-sm);
margin-top: var(--space-xs);
}
.ac-entry-strong {
font-size: var(--text-caption);
color: #9e9ea4;
font-family: monospace;
margin-top: var(--space-xs);
display: block;
}
.ac-table {
width: 100%;
border-collapse: collapse;
font-size: var(--text-caption);
margin-top: var(--space-sm);
}
.ac-table th {
text-align: left;
padding: var(--space-xs) var(--space-sm);
color: var(--text-sub);
font-size: var(--text-caption);
font-weight: 600;
letter-spacing: 0.06em;
border-bottom: 1px solid var(--border-soft);
}
.ac-table td {
padding: var(--space-xs) var(--space-sm);
border-bottom: 1px solid rgba(0,0,0,0.04);
color: var(--text-main);
vertical-align: baseline;
}
.ac-table tr:last-child td { border-bottom: none; }
.ac-table td.ac-td-greek {
font-family: var(--font-greek);
font-size: var(--text-body-lg);
}
.ac-morph-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: var(--space-xs) var(--space-md);
margin-top: var(--space-sm);
font-size: var(--text-caption);
}
.ac-morph-row {
display: contents;
}
.ac-morph-key {
color: var(--text-sub);
font-size: var(--text-caption);
font-weight: 400;
letter-spacing: 0.04em;
padding: var(--space-xs) 0;
border-bottom: 1px solid rgba(0,0,0,0.04);
grid-column: 1;
}
.ac-morph-val {
color: var(--text-main);
font-weight: 500;
font-size: var(--text-caption);
padding: var(--space-xs) 0;
border-bottom: 1px solid rgba(0,0,0,0.04);
grid-column: 2;
}
.ac-morph-val.core {
color: var(--text-main);
font-weight: 700;
}
.ac-cite-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    margin-top: var(--space-xs);
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
}
.ac-cite-ref--block { display: block; margin-top: var(--space-sm); }
.ac-cite-ref svg { width: 0.85em; height: 0.85em; display: block; flex-shrink: 0; }
.ac-no-data {
text-align: center;
color: var(--text-sub);
font-size: var(--text-caption);
padding: var(--space-xl) 0;
}
.ac-morph-search-row {
margin-top: var(--space-md);
display: flex;
gap: var(--space-sm);
flex-wrap: wrap;
}
/* semantics: Abbott-Smith 引用ブロック */
.ac-abbottsmith {
background: var(--accent-light);
border-left: 3px solid var(--highlight);
border-radius: 0 var(--radius-s) var(--radius-s) 0;
padding: var(--space-sm) var(--space-md);
margin-top: var(--space-sm);
font-size: var(--text-caption);
color: var(--text-sub);
line-height: 1.75;
}
/* syntax: 文脈節一覧ローディング */
.ac-loading {
font-size: var(--text-caption);
color: var(--text-sub);
padding: var(--space-md) 0;
text-align: center;
animation: ac-blink 1.2s ease-in-out infinite;
}
@keyframes ac-blink {
0%, 100% { opacity: var(--opacity-secondary); }
50% { opacity: var(--opacity-primary); }
}

.verse-block { transition: background var(--transition-fast); }
.verse-pair-left  { border-radius: var(--radius-s) 0 0 var(--radius-s); }
.verse-pair-right { border-radius: 0 var(--radius-s) var(--radius-s) 0; }
.verse-block.selected { background: var(--accent-light); }
/* Phase 2A: chapter container */
.chapter-block:first-child .chapter-header { display: none; }
.chapter-header {
    padding: var(--space-xl) 0;
    text-align: center;
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    pointer-events: none;
    user-select: none;
}
/* Phase 2A-5: autoload sentinel — 不可視1px、クリック非対象 */
.chapter-load-sentinel { height: 1px; pointer-events: none; }
/* Reading Hint v1（SP-12）: 静かな読書の入口。大きなカードにしない・既存トークンのみ使用 */
/* Reading Hint（SP-12D）— 節番号自体を入口(Verse Anchor)にする。
   DOM追加・本文文字への装飾なし。色/opacity/cursor のみで操作可能を示す。
   font-size / font-weight / min-width は据え置き＝節番号幅・本文開始位置・行送りは不変。 */
.v-num.verse-anchor {
    cursor: pointer;
    color: var(--accent);
    opacity: var(--opacity-primary);
    /* 控えめな点線下線で「クリック可能」を示す。text-decoration は行box内で描画され、
       節番号幅・行高・本文開始位置を変えない。 */
    text-decoration: underline dotted;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
    transition: color var(--transition-fast), opacity var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
}
.v-num.verse-anchor:hover,
.v-num.verse-anchor[aria-expanded="true"] { color: var(--accent-dark); }
.reading-hint-popover {
    position: fixed;
    max-width: 280px;
    background: var(--bg-paper);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    z-index: 500;
    padding: var(--space-sm) var(--space-md);
}
.reading-hint-popover-title {
    font-size: var(--text-caption);
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.04em;
    margin-bottom: var(--space-xs);
}
.reading-hint-popover-range {
    font-size: var(--text-caption);
    color: var(--text-hint);
    margin-bottom: var(--space-xs);
}
.reading-hint-popover-text {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    line-height: 1.9;
    color: var(--text-main);
}
.jp-section { padding: var(--space-xs) var(--space-sm); cursor: pointer; display: flex; align-items: baseline; border-radius: var(--radius-s); }
.jp-section:hover { background: rgba(0,0,0,0.03); }
.v-num { color: var(--text-sub); margin-right: var(--space-md); font-size: var(--text-caption); font-weight: 400; min-width: 20px; text-align: right; letter-spacing: 0.02em; flex-shrink: 0; }
.jp-text { font-size: var(--text-body-lg); line-height: 2.1; color: var(--text-main); font-family: var(--font-prose); }

/* ── 静的ページ共通（まめ知識 / 出典・ポリシー） ── */
.static-page {
    max-width: 44em;
    margin: 0 auto;
    padding: 32px 52px 60px;
    font-size: var(--text-body);
    line-height: 1.8;
    color: var(--text-main);
}
/* ブックマーク/メモ/履歴系の一覧ページ用モディファイア。
   .static-page は #bible-text-area（single-mode時にmax-width:44em + 左右padding:24pxで
   聖書本文と同じ幅に揃えられている）の内側に差し込まれるため、ここで独自にmax-width/左右paddingを
   持たせると親の幅とズレる。横方向は完全に親に委ねることで聖書本文と同一幅にする。 */
.static-page.list-page {
    max-width: none;
    margin: 0;
    padding: 32px 0 60px;
}
/* ブックマーク/メモ/最近読んだ箇所/最近見た単語、4ページ共通のカードUI。
   タイトル(1行目)・補足情報(2行目)・右側メタ情報、という構造を共通クラスとして統一する。
   ページごとの違いは _listItemCard() に渡すデータ（title/sub/meta/href）だけに閉じる。 */
/* 枠線・背景boxではなく、左の細いインジケータのみで区切る（ボックス感を出さない）。
   アクション(削除等)はhoverまたはキーボードフォーカス時のみ表示する。 */
.list-item-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--rhythm-medium-x);
    padding: var(--rhythm-medium-y) var(--rhythm-medium-x);
    margin-bottom: var(--rhythm-medium-y);
    background: none;
    border: none;
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast);
}
.list-item-card:hover, .list-item-card:focus-within { background: var(--highlight-light); border-left-color: var(--highlight); }
.list-item-card[tabindex="0"]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
}
.list-item-main { min-width: 0; flex: 1; }
.list-item-title {
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.list-item-sub {
    margin-top: var(--space-xs);
    font-size: var(--text-caption);
    line-height: 1.5;
    color: var(--text-sub);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.list-item-meta {
    flex-shrink: 0;
    font-size: var(--text-caption);
    color: var(--text-sub);
    white-space: nowrap;
}
.list-item-empty { color: var(--text-sub); font-size: var(--text-body); }
.list-item-actions {
    flex-shrink: 0;
    display: flex;
    gap: var(--rhythm-micro);
    opacity: 0;
    transition: opacity var(--transition-fast);
}
.list-item-card:hover .list-item-actions,
.list-item-card:focus-within .list-item-actions { opacity: var(--opacity-primary); }
.list-item-action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    color: var(--text-sub);
    background: none;
    border: none;
    border-radius: var(--radius-s);
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
}
.list-item-action-btn svg { width: 16px; height: 16px; }
.list-item-action-btn:hover { background: rgba(0,0,0,0.06); color: var(--text-main); }
.list-item-action-btn.danger:hover { color: #c0392b; }
/* タッチ端末では hover がないため、項目操作を常時表示しタップ領域を確保する。 */
@media (pointer: coarse) {
    .list-item-actions { opacity: var(--opacity-primary); }
