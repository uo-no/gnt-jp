}

/*
 * _buildColumnBlock — VR-5-F-B: render() の「1列分の verse block 生成」処理を抽出。
 * VR-5-F-A監査（Migration Boundary Step 1）で「列生成ロジックはcolMode駆動で一般化容易」
 * と判定した範囲のみを対象とする。
 * columns.length は今回も2固定（colIndex は 0=左列 または 1=右列 のみ）。
 *   col      = 対象列（columns[colIndex] 相当、{colMode, jpData}）
 *   otherCol = もう一方の列（右列の翻訳フォールバック・wordOrder相互判定に使用）
 * className・dataset・onclick挙動は colIndex ごとに現行実装のまま保持し、表示結果を変えない。
 * VR-5-H-2: 列間の相互ハイライトは _selectVerseBlocks()（dataset.vnum ベース、列非依存）へ
 * 一般化したため、もう一方の columnBlock を直接受け取るパラメータ（旧 otherBlock）は
 * 不要になり削除した。
 */
/*
 * _selectVerseBlocks — VR-5-H-2: 節単位の選択状態管理を列非依存で行う。
 * VR-5-H-1で全列に付与した dataset.vnum を使い、column index / left-right class に
 * 依存せず「同一vNumを持つ表示中のverse-blockすべて」を selected にする。
 * single-modeでは block と pBlock が別コンテナ（#bible-text-area / #parallel-text-area）に
 * 存在するため、共通の親要素は使わずDOM全体検索（querySelectorAll）で成立させる。
 * document.querySelectorAll('.verse-block') は #main-reading-area 外に verse-block が
 * 存在しないため、旧実装の mainArea 限定版と結果集合は常に同一（挙動差分なし）。
 */
function _selectVerseBlocks(vNum, activeBlock, containerEl) {
    document.querySelectorAll('.verse-block.selected').forEach(b => b.classList.remove('selected'));
    const _svbScope = containerEl || document;
    _svbScope.querySelectorAll(`.verse-block[data-vnum="${vNum}"]`).forEach(b => b.classList.add('selected'));
    if (activeBlock) activeBlock.classList.add('selected');
}

function _buildColumnBlock(colIndex, col, otherCol, vNum, text, elByVerse, hasGreek, useVersePair, mainArea, book, ch) {
    const columnBlock = document.createElement('div');
    /* VR-5-H-1: 列共通で dataset.vnum を付与する（VR-5-G-A監査で確認した「右列にのみ
       dataset.vnum が存在する」非対称の解消）。すべての列を将来同じ VerseBlock として
       扱うための準備であり、既存の className・DOM構造・イベント挙動は変更しない。
       既存のセレクタ（_navigateVerse・_findVisibleVerseBlock・_setFlowInjection 等）は
       いずれも dataset.vnum の有無ではなく className で列を判別しているため、
       本変更はそれらの挙動に影響しない。 */
    columnBlock.dataset.vnum = vNum;
    /* VR-5-H-4: Flow 対象列の論理的根拠（col.colMode.kind）を DOM へ read-only 投影する。
       SSOT はあくまで col.colMode.kind であり、dataset.colMode はその索引投影にすぎない
       （DOM 側で書き換えない／Flow 判定ロジックをここへ移さない）。dataset.vnum と同型。
       _setFlowInjection() の Flow 対象探索が位置クラス（.verse-pair-right）ではなくこの値を
       索引として使う。 */
    columnBlock.dataset.colMode = col.colMode.kind;

    if (colIndex === 0) {
        // 左：聖書本文 or 読解フロー（ColumnMode.kind === 'wordOrder'）
        columnBlock.className = useVersePair ? 'verse-block verse-pair-left' : 'verse-block';

        if (col.colMode.kind === 'wordOrder') {
            const words = elByVerse[vNum] || [];
            if (words.length === 0) {
                columnBlock.innerHTML = `<div class="jp-section"><span class="v-num">${vNum}</span><div class="jp-text" style="color:var(--text-sub);font-size: var(--text-caption);opacity: var(--opacity-secondary);">原語データなし</div></div>`;
            } else {
                /* Phase VR-4A: 本文左列の語順フロー表示を Verse Representation Architecture
                   経由にする。WordOrderRenderer は chips[] のみを入力とするため、
                   出力は旧実装と完全一致（docs/development/verse-representation-design.md）。
                   book / ch は描画時コンテキスト（明示引数）を使用する。 */
                const _vrBookKey  = book ? book.key : '';
                const _vrCh       = ch != null ? ch : null;
                const _vrVerse    = buildVerse(_vrBookKey, _vrCh, vNum, words);
                const _vrAnalysis = getAnalysis(_vrVerse);
                const _vrRep      = buildRepresentation({ kind: 'wordOrder' }, _vrVerse, _vrAnalysis);
                /* 複数節が同時に描画されるため、idx は節内でのみ有効。
                   block 単位でchipデータを保持し、_wlvChipClick から節を跨いだ取り違えなく参照できるようにする。 */
                columnBlock._flowResolved = _vrAnalysis;
                columnBlock._flowChips = _vrRep.chips;
                /* Layer 2 Inspect: ReadingFormatterのclause解析には生トークン配列が
                   必要なため、chipデータと並べて words もそのまま保持しておく。 */
                columnBlock._flowWords = words;
                /* VR-5-H-12-D: JHN3:16 先頭chipへのアンカー付与は「本文左列の policy」として
                   呼び出し元で解決する（renderer 内の verse 固定判定を撤去）。判定源は
                   renderer が旧来参照していた representation.verseRef と同一。 */
                const _bodyVr = _vrRep && _vrRep.verseRef ? _vrRep.verseRef : {};
                const _bodyShowAnchor = _bodyVr.book === 'JHN' && _bodyVr.chapter === 3
                    && String(_bodyVr.verse) === '16';
                columnBlock.innerHTML = WordOrderRenderer.renderBodyColumn(_vrRep, { showOnboardingAnchor: _bodyShowAnchor });
                columnBlock.onclick = () => {
                    _selectVerseBlocks(vNum, columnBlock, mainArea);
                    document.getElementById('active-v').innerText = `${vNum} 節`;
                    AppState.toBrowsing(vNum, words, book, ch);
                    openVerseInspector(vNum, words, book, ch);
                    notifyAppStateChange();
                };
            }
        } else {
            /* Phase TR-1: 左列の翻訳表示を Verse Representation Architecture 経由にする。
               renderColumn() は TranslationRenderer（representation.text のみを入力とする）へ
               委譲するため、出力は旧実装と完全一致（docs/development/verse-representation-design.md）。
               ★ 翻訳は Greek Token を経由しないため tokens は空のまま Verse を構築する（VR-1設計書 A-3）。
               book / ch は描画時コンテキスト（明示引数）を使用する。 */
            const _trBookKey = book ? book.key : '';
            const _trCh      = ch != null ? ch : null;
            const _trVerse   = buildVerse(_trBookKey, _trCh, vNum, []);
            const _trRep     = buildRepresentation(col.colMode, _trVerse, null, text);
            columnBlock.innerHTML = renderColumn(_trRep);
        }
    } else {
        // 右：並列訳 or 読解フロー
        columnBlock.className = 'verse-block verse-pair-right';

        if (col.colMode.kind === 'wordOrder') {
            // _setFlowInjection('flow') が gf-verse-block を差し込むので
            // ここでは空コンテナのみ用意する（二重描画防止）
            columnBlock.innerHTML = '';
        } else if (!useVersePair && otherCol.colMode.kind === 'wordOrder') {
            // single-mode + transA=FLOW: 右列は不要
            columnBlock.innerHTML = '';
        } else {
            const rightText = (col.jpData && col.jpData.verses && col.jpData.verses[vNum]) ? col.jpData.verses[vNum] : (otherCol.jpData.verses[vNum] || '');
            /* Phase TR-2: 右列の翻訳表示を Verse Representation Architecture 経由にする。
               renderColumn() は TranslationRenderer（representation.text のみを入力とする）へ
               委譲するため、出力は旧実装と完全一致（docs/development/verse-representation-design.md）。
               ★ 翻訳は Greek Token を経由しないため tokens は空のまま Verse を構築する（VR-1設計書 A-3）。
               book / ch は描画時コンテキスト（明示引数）を使用する。 */
            const _trBookKeyR = book ? book.key : '';
            const _trChR      = ch != null ? ch : null;
            const _trVerseR   = buildVerse(_trBookKeyR, _trChR, vNum, []);
            const _trRepR     = buildRepresentation(col.colMode, _trVerseR, null, rightText);
            columnBlock.innerHTML = renderColumn(_trRepR);
            if (hasGreek) {
                columnBlock.onclick = () => {
                    _selectVerseBlocks(vNum, columnBlock, mainArea);
                    document.getElementById('active-v').innerText = `${vNum} 節`;
                    AppState.toBrowsing(vNum, elByVerse[vNum] || [], book, ch);
                    openVerseInspector(vNum, elByVerse[vNum] || [], book, ch);
                    notifyAppStateChange();
                };
            }
        }
    }

    return columnBlock;
}

/*
 * render(columns, elData, hasGreek) — VR-5-E-1: render() 入口を2列固定引数（jpData/jpDataB）
 * から columns[] ベースへ移行。columns[i] = { colMode, jpData }。
 * 今回は入口（引数の受け取り方）のみの移行であり、内部は columns[0]/columns[1] を
 * 直接参照して既存の2列表示をそのまま維持する（columns.forEach() 化・N列Grid化は行わない）。
 * colMode は将来フェーズ（columns[].colMode を内部ループが直接消費する段階）向けに
 * columns[] へ含めているが、今回は render() 内部で _colA/_colB を従来どおり
 * _toColumnMode(_transA/_transB) から再計算し、表示結果を変更しない。
 */
function render(columns, elData, hasGreek) {
    const app          = document.getElementById('bible-text-area');
    const parallel     = document.getElementById('parallel-text-area');
    const mainArea     = document.getElementById('main-reading-area');

    // ── Study panel を閉じて Reading 状態に戻す ──
    closeStudyPanel();
    _closeReadingHintPopover(); /* 章移動などの再描画で開いていた Hint Popover を閉じる */
    /* 章が変わった場合は AppState を完全リセット（study.params も破棄） */
    AppState.mode                = 'reading';
    AppState.selectedVerse       = { vNum: null, elWords: [] };
    AppState.inspect.data        = null;
    AppState.study.params        = null;
    AppState.study.tab           = 'flow';
    AppState.scrollTop           = 0;
    AppState.clearDepth();
    _appendedChapterCache.clear(); /* Phase 2B-2: DOMクリアと同時に追加章キャッシュを破棄 */
app.innerHTML = '';
    parallel.innerHTML = '';
    /* compare モードで mainArea に直接追加した verse-pair / compare-chapter-block をクリア */
    mainArea.querySelectorAll('.verse-pair, .compare-chapter-block').forEach(el => el.remove());

    const elByVerse = {};
    if (elData && elData.length > 0) {
        elData.forEach(w => {
            const v = _elTokenVerse(w);
            if (v) { if (!elByVerse[v]) elByVerse[v] = []; elByVerse[v].push(w); }
        });
    }

    const openBtn = document.getElementById('open-panel-btn');
    if (!hasGreek) {
        document.getElementById('bottom-depth-panel').style.display = 'none';
        openBtn.style.display = 'none';
    }

    const useVersePair = mainArea.classList.contains('compare-mode');

    /* VR-5-E-2: render() 内部の A/B 固定参照を columns[] 参照へ整理する。
       columns.length は今回も2固定（columns[0]=左列, columns[1]=右列）。
       ColumnMode（_colA/_colB相当）は columns[].colMode（呼び出し元が _toColumnMode() で
       算出し columns[] 生成時に確定させた値、VR-5-E-1参照）からそのまま取得し、
       render() 内部での _toColumnMode(_transA/_transB) 再計算はしない
       （columns[] 生成と render() 呼び出しの間に await を挟まないため、値は一致する）。 */
    const colA  = columns[0];
    const colB  = columns[1];
    const _colA = colA.colMode;
    const _colB = colB.colMode;

    /* DA_READING: SBL sentence boundaries + leading conjunction rows + existing Word Order chips. */
    if (_colA.kind === 'da-reading') {
        renderDAReadingView(app, _sdChapterDataForRender, elData);
        /* DA-companion: 節タップでStudyPanelを開く。renderDAReadingView はclick handlerを
           付けないため、ここで .da-sentence 要素に追加する。chipタップは _wlvChipClick に委ねる。 */
        const _daBook = AppState.location.book;
        const _daCh   = AppState.location.chapter;
        app.querySelectorAll('.da-sentence').forEach(sentEl => {
            const _daWords = sentEl._flowWords;
            if (!_daWords || !_daWords.length) return;
            const _daVNum  = String(_daWords[0].verse);
            const _daVWords = elByVerse[_daVNum] || _daWords;
            sentEl.onclick = (e) => {
                if (e.target.closest('.wlv-chip')) return;
                _selectVerseBlocks(_daVNum, sentEl, app);
                const activeVEl = document.getElementById('active-v');
                if (activeVEl) activeVEl.innerText = `${_daVNum} 節`;
                AppState.toBrowsing(_daVNum, _daVWords, _daBook, _daCh);
                openVerseInspector(_daVNum, _daVWords, _daBook, _daCh);
                notifyAppStateChange();
            };
        });
        parallel.innerHTML = '';
        _cachedElByVerse = elByVerse;
        _proximityTokens = (elData || []).map(w => ({ text: w.text || '', lemma: w.lemma || w.text || '' }));
        return;
    }

    /* 語の役割で読む — 作業スペースで確定した RK レイアウトを SR JSON から再現する
       passage（章）単位の早期 return。既存 verse-loop には入らない。 */
    if (_colA.kind === 'role-reading') {
        _renderRoleReadingView(app, _sdChapterDataForRender, elData);
        if (useVersePair && _colB.kind === 'role-reading') {
            _renderRoleReadingView(parallel, _sdChapterDataForRender, elData);
        } else if (useVersePair) {
            parallel.innerHTML = '';
        }
        _cachedElByVerse   = elByVerse;
        _proximityTokens   = (elData || []).map(w => ({ text: w.text || '', lemma: w.lemma || w.text || '' }));
        return;
    }

    /* B列が passage-level（da-reading）の場合、verse-by-verse の B ブロックを
       生成しない。A 列は app へ verse-by-verse で描画する（単一列扱い）。 */
    const _bIsPassageLevel = useVersePair && (
        _colB.kind === 'da-reading'
    );

    /* 描画時コンテキスト: AppState.location はここ（render 開始時）で1回だけ読む。
       以降のクリックハンドラ閉包はこの値を使い、イベント発火時に AppState.location を再読しない。 */
    const _renderBook = AppState.location.book    || null;
    const _renderCh   = AppState.location.chapter != null ? AppState.location.chapter : null;

    /* Phase 2A: 単章コンテナ。single-mode（非 compare）でのみ生成する。
       useVersePair が false のとき _bIsPassageLevel は必ず false（verse-loop 経路のみ）。
       verse-block はこのコンテナ内に追加し、ループ後に app へ挿入する。 */
    const _chapterBlock = !useVersePair ? (() => {
        const _cb   = document.createElement('div');
        _cb.className        = 'chapter-block';
        _cb.dataset.book     = _renderBook ? (_renderBook.key || '') : '';
        _cb.dataset.chapter  = _renderCh != null ? String(_renderCh) : '';
        const _cbHdr = document.createElement('div');
        _cbHdr.className    = 'chapter-header';
        _cbHdr.setAttribute('aria-hidden', 'true');
        _cbHdr.textContent  = '· · ·';
        _cb.appendChild(_cbHdr);
        return _cb;
    })() : null;

    /* Phase 3-7-C: compare章コンテナ（desktop >768px のみ）。
       Mobile（≤768px）は mobile-verse-group を #bible-text-area へ積む既存方式を維持する。 */
    const _compareChapterBlock = (useVersePair && window.innerWidth > 768) ? (() => {
        const _ccb = document.createElement('div');
        _ccb.className       = 'compare-chapter-block';
        _ccb.dataset.book    = _renderBook ? (_renderBook.key || '') : '';
        _ccb.dataset.chapter = _renderCh != null ? String(_renderCh) : '';
        const _ccbHdr = document.createElement('div');
        _ccbHdr.className   = 'compare-chapter-header';
        _ccbHdr.setAttribute('aria-hidden', 'true');
        _ccbHdr.textContent = '· · ·';
        _ccb.appendChild(_ccbHdr);
        return _ccb;
    })() : null;

    Object.entries(colA.jpData.verses).forEach(([vNum, text]) => {
        /* VR-5-F-B: 左列・右列の生成処理を _buildColumnBlock() へ抽出（VR-5-F-A監査
           Migration Boundary Step 1）。
           VR-5-H-2: 列間の相互ハイライトは _selectVerseBlocks()（dataset.vnum ベース）へ
           一般化し、block/pBlock の直接参照を解消した（Step 2 の解消）。 */
        const block = _buildColumnBlock(0, colA, colB, vNum, text, elByVerse, hasGreek, useVersePair, _chapterBlock || _compareChapterBlock || mainArea, _renderBook, _renderCh);

        if (hasGreek && _colA.kind !== 'wordOrder') {
            block.onclick = () => {
                _selectVerseBlocks(vNum, block, _chapterBlock || _compareChapterBlock || mainArea);
                document.getElementById('active-v').innerText = `${vNum} 節`;
                AppState.toBrowsing(vNum, elByVerse[vNum] || [], _renderBook, _renderCh);
                openVerseInspector(vNum, elByVerse[vNum] || [], _renderBook, _renderCh);
                notifyAppStateChange();
            };
        }

        if (_bIsPassageLevel) {
            /* B が passage-level: A ブロックのみ app へ追加（verse-pair 方式を使わない） */
            app.appendChild(block);
        } else {
            const pBlock = _buildColumnBlock(1, colB, colA, vNum, text, elByVerse, hasGreek, useVersePair, _chapterBlock || _compareChapterBlock || mainArea, _renderBook, _renderCh);
            if (useVersePair && window.innerWidth <= 768) {
                /* モバイル比較モード：節ごとにA訳→区切り→B訳を縦に積む */
                const verseGroup = document.createElement('div');
                verseGroup.className       = 'mobile-verse-group';
                verseGroup.dataset.vnum    = vNum;
                verseGroup.dataset.book    = _renderBook ? (_renderBook.key || '') : '';  /* Phase 3-7-F */
                verseGroup.dataset.chapter = _renderCh != null ? String(_renderCh) : ''; /* Phase 3-7-F */

                /* 節番号バッジ */
                const vBadge = document.createElement('div');
                vBadge.className = 'mobile-vnum-badge';
                vBadge.textContent = vNum;
                verseGroup.appendChild(vBadge);

                /* A訳ブロック */
                const aWrap = document.createElement('div');
                aWrap.className = 'mobile-trans-block mobile-trans-a';
                const aLabel = document.createElement('div');
                aLabel.className = 'mobile-trans-label';
                aLabel.textContent = (TRANSLATIONS[_transA] || {}).label || _transA;
                aWrap.appendChild(aLabel);
                aWrap.appendChild(block);
                verseGroup.appendChild(aWrap);

                /* 区切り線 */
                const sep = document.createElement('div');
                sep.className = 'mobile-verse-sep';
                verseGroup.appendChild(sep);

                /* B訳ブロック */
                const bWrap = document.createElement('div');
                bWrap.className = 'mobile-trans-block mobile-trans-b';
                const bLabel = document.createElement('div');
                bLabel.className = 'mobile-trans-label';
                bLabel.textContent = (TRANSLATIONS[_transB] || {}).label || _transB;
                bWrap.appendChild(bLabel);
                bWrap.appendChild(pBlock);
                verseGroup.appendChild(bWrap);

                app.appendChild(verseGroup);
            } else if (useVersePair) {
                const pairEl = document.createElement('div');
                pairEl.className = 'verse-pair';
                pairEl.appendChild(block);
                pairEl.appendChild(pBlock);
                /* Phase 3-7-C: desktop は compare-chapter-block へ、mobile は mainArea へ（従来どおり） */
                (_compareChapterBlock || mainArea).appendChild(pairEl);
            } else {
                (_chapterBlock || app).appendChild(block);
                parallel.appendChild(pBlock);
                /* Reading Hint: 主 Reading ビュー（非比較）の該当節 verse-block 右端に info アイコンを加算 */
                _appendReadingHint(block, vNum);
            }
        }
    });

    /* Phase 2A: 単章コンテナを app へ挿入する（compare 時は null なので何もしない）。 */
    if (_chapterBlock) { app.appendChild(_chapterBlock); }
    /* Phase 3-7-C: desktop compare の章コンテナを mainArea へ追加 */
    if (_compareChapterBlock) { mainArea.appendChild(_compareChapterBlock); }

_proximityTokens = (elData || []).map(w => ({ text: w.text || '', lemma: w.lemma || w.text || '' }));

    /* Greek Flow View: キャッシュ保存 */
    _cachedElByVerse = elByVerse;

    /* transB=FLOW（ColumnMode.kind==='wordOrder'）が選ばれているときは常にflowモードを起動する。
       VR-5-H-6: 旧「flow残留のリセット」分岐（_rightMode 依存）は削除。render() は判定前に
       DOM を全消去（app/parallel innerHTML='' ＋ .verse-pair remove）するため、非flow時に
       cleanup すべき gf-mode 残留は存在せず、当該分岐は表示上 no-op だった。 */
    if (_colB.kind === 'wordOrder') {
        _setFlowInjection('flow');
    }

    /* オンボーディング Flow ステップ中：モバイルCSS を上書きして右列を強制表示 */
    if (window.App.onboarding) {
        var _obState = window.App.onboarding.getState();
        if (!_obState.onboardingComplete && !_obState.onboardingSkipped
            && _obState.currentStep === 'gar17_clicked') {
            mainArea.querySelectorAll('.verse-pair-right').forEach(function(el) {
                el.style.display = 'block';
                el.style.visibility = 'visible';
            });
            if (document.getElementById('parallel-text-area')) {
                document.getElementById('parallel-text-area').style.display = 'block';
            }
        }
    }

    /* モバイル比較モード：1節ナビセットアップ */
    if (window.innerWidth <= 768 && mainArea.classList.contains('compare-mode')) {
        _mobileCompareSetup();
    } else {
        _mobileCompareTeardown();
    }

    /* Phase 2A-4/5: Focus Observer + Autoload を初期化。
       compare desktop（_compareChapterBlock）は Observer のみ初期化（Autoload は Phase 3-7-E 以降）。 */
    if (_chapterBlock) { _setupChapterObserver(); _setupAutoload(); }
    else if (_compareChapterBlock) { _setupChapterObserver(); _setupAutoload(); } /* Phase 3-7-D/E */

}

/* Phase 2A: in-flight guard — 同一章への同時リクエストで重複追加しない */
const _lacPending     = new Set();
const _comparePending = new Set(); /* Phase 3-7-E: compare loader in-flight guard */

/**
 * _loadAndAppendChapter — JA1955 単章モード専用。
 *
 * 指定章のデータを非同期取得し、既存の #bible-text-area に章コンテナを追加する。
 * render() によるDOMクリアは行わない（既存章を保持する）。
 *
 * 制約:
 *   - 比較モード（_transMode === 'compare'）では呼ばない（guard あり）。
 *   - autoloadブロック対象モード（discourse / ST / CR / RL）では動作しない（guard あり）。
 *   - WO（wordOrder）は連続章対応: Greekデータから _buildFlowJpData() で jpData を生成する。
 *   - _cachedElByVerse は更新しない。vNum キー衝突を避けるため、追加章データは
 *     _appendedChapterCache（Phase 2B-2）に格納する（キー: "bookKey|chapter"）。
 *     click path は closure-capture で解決済み。evidence 解決は _resolveTokenJaById が両キャッシュを検索。
 *
 * @param {Object} bookObj  SB_BOOKS entry { key, name, ch }
 * @param {number} chNum    chapter number (integer)
 * @returns {Promise<boolean>}  true=追加成功、false=スキップ（重複/失敗/無効モード）
 */
async function _loadAndAppendChapter(bookObj, chNum) {
    if (!bookObj || chNum == null) return false;

    /* 連続章ガード: autoloadブロック対象モード / 比較モードでは動作しない */
    const _lacColAKind = _toColumnMode(_transA).kind;
    if (_isAutoloadBlockedMode(_lacColAKind) || _transMode === 'compare') return false;

    const _lacBookKey = bookObj.key || '';
    const _lacCh      = String(chNum);
    if (!_lacBookKey || !_lacCh) return false;

    const app = document.getElementById('bible-text-area');
    if (!app) return false;

    /* 重複チェック（既に同一章がDOMにある） */
    if (app.querySelector(`.chapter-block[data-book="${_lacBookKey}"][data-chapter="${_lacCh}"]`)) return false;

    /* 同時リクエスト防止 */
    const _lacKey = `${_lacBookKey}|${_lacCh}`;
    if (_lacPending.has(_lacKey)) return false;
    _lacPending.add(_lacKey);

    let _lacCb = null; /* 未挿入コンテナの参照 */
    try {
        /* 翻訳データ取得: WOはGreekデータ由来のため翻訳JSONをfetchしない */
        const _lacJpData = (_lacColAKind === 'wordOrder')
            ? null
            : await _fetchTranslation(_transA, _lacBookKey, _lacCh);
        if (_lacColAKind !== 'wordOrder' && (!_lacJpData || !_lacJpData.verses)) return false;

        /* Greekデータ取得 */
        const _lacHasGreek = GREEK_BOOKS.has(_lacBookKey);
        let _lacElData = [];
        if (_lacHasGreek) {
            try {
                const _lacTestament = SB_BOOKS.nt.some(b => b.key === _lacBookKey) ? 'nt' : 'lxx';
                const _lacElRes = await fetch(`../bible_data/${_lacTestament}/${_lacBookKey}/${_lacCh}.json`);
                if (_lacElRes.ok) _lacElData = await _lacElRes.json();
            } catch (_) { /* Greek取得失敗 → 翻訳のみ表示 */ }
        }

        /* elByVerse 構築（render() と同じロジック） */
        const _lacElByVerse = {};
        _lacElData.forEach(w => {
            const v = _elTokenVerse(w);
            if (v) { if (!_lacElByVerse[v]) _lacElByVerse[v] = []; _lacElByVerse[v].push(w); }
        });
        const _lacHasGreekResolved = _lacHasGreek && _lacElData.length > 0;

        /* WO: Greekデータからjpdata互換オブジェクトを生成する（verse番号一覧として使用） */
        const _lacJpDataResolved = (_lacColAKind === 'wordOrder')
            ? _buildFlowJpData(_lacElData)
            : _lacJpData;
        if (!_lacJpDataResolved || !_lacJpDataResolved.verses) return false;

        /* ColumnMode（ループ外で1回計算） */
        const _lacColAMode = _toColumnMode(_transA);
        const _lacColBMode = _toColumnMode(_transB);
        const _lacColA     = { colMode: _lacColAMode, jpData: _lacJpDataResolved };
        const _lacColB     = { colMode: _lacColBMode, jpData: null };

        /* 章コンテナ生成（Phase 2A-1 の _chapterBlock と同じ構造） */
        _lacCb = document.createElement('div');
        _lacCb.className       = 'chapter-block';
        _lacCb.dataset.book    = _lacBookKey;
        _lacCb.dataset.chapter = _lacCh;
        const _lacHdr = document.createElement('div');
        _lacHdr.className   = 'chapter-header';
        _lacHdr.setAttribute('aria-hidden', 'true');
        _lacHdr.textContent = '· · ·';
        _lacCb.appendChild(_lacHdr);

        /* verse-block 生成（単章モード専用: useVersePair=false） */
        Object.entries(_lacJpDataResolved.verses).forEach(([vNum, text]) => {
            const block = _buildColumnBlock(
                0, _lacColA, _lacColB,
                vNum, text, _lacElByVerse,
                _lacHasGreekResolved, false,
                _lacCb, bookObj, chNum
            );
            /* JA1955訳文列のonclickは_buildColumnBlockでは設定されないため、ここで設定する
               （render()と同じパターン）。 */
            if (_lacHasGreekResolved && _lacColAMode.kind !== 'wordOrder') {
                block.onclick = () => {
                    /* Phase 3-6-I C: _lacCb は DOM挿入後に null にリセットされるため、
                       click時点でのDOM参照を使う（closure値渡し問題の解消）。 */
                    _selectVerseBlocks(vNum, block, block.closest('.chapter-block'));
                    document.getElementById('active-v').innerText = `${vNum} 節`;
                    AppState.toBrowsing(vNum, _lacElByVerse[vNum] || [], bookObj, chNum);
                    openVerseInspector(vNum, _lacElByVerse[vNum] || [], bookObj, chNum);
                    notifyAppStateChange();
                };
            }
            _lacCb.appendChild(block);
            _appendReadingHint(block, vNum, _lacBookKey, chNum);
        });

        /* 挿入直前に再度重複確認（fetch中にDOMが変わった場合） */
        if (app.querySelector(`.chapter-block[data-book="${_lacBookKey}"][data-chapter="${_lacCh}"]`)) {
            _lacCb = null;
            return false;
        }

        app.appendChild(_lacCb);
        _appendedChapterCache.set(`${_lacBookKey}|${_lacCh}`, _lacElByVerse); /* Phase 2B-2: evidenceキャッシュ登録 */
        _observeChapterBlock(_lacCb); /* Phase 2A-4: 追加章をObserverに登録 */
        _lacCb = null; /* DOM挿入完了 */
        return true;

    } catch (_lacErr) {
        return false;
    } finally {
        _lacPending.delete(_lacKey);
    }
}

/* ══════════════════════════════════════════
   Phase 2A-4: Chapter Focus Observer
   ══════════════════════════════════════════ */
let _chapterFocusTimer = null;
let _chapterObserver   = null;
const _chapterObserverVisible = new Map();

/**
 * Focus Chapter判定と AppState 更新。
 * スクロールコンテナ(#main-reading-area)上端を基準に、
 * top<=0 の章の中で最大 top（最も 0 に近い章）を Focus Chapter とする。
 * 全章 top>0 の場合は最小 top（最初に見える章）を選ぶ。
 * intersectionRatio は章高 >> viewport 高で 0 近くなるため使わない。
 */
function _recalcFocusChapter() {
    const container = document.getElementById('main-reading-area');
    if (!container || _chapterObserverVisible.size === 0) return;
    const containerTop = container.getBoundingClientRect().top;
    let focusEl = null, bestAbove = -Infinity, bestBelowEl = null, bestBelow = Infinity;
    for (const [key, el] of _chapterObserverVisible) {
        if (!el.isConnected) { _chapterObserverVisible.delete(key); continue; }
        const top = el.getBoundingClientRect().top - containerTop;
        if (top <= 0) { if (top > bestAbove) { bestAbove = top; focusEl = el; } }
        else          { if (top < bestBelow) { bestBelow = top; bestBelowEl = el; } }
    }
    if (!focusEl) focusEl = bestBelowEl;
    if (!focusEl) return;
    const newBookKey = focusEl.dataset.book || '';
    const newCh      = parseInt(focusEl.dataset.chapter, 10);
    if (!newBookKey || isNaN(newCh)) return;
    /* Focus Chapter が変化していない場合は余計な同期をしない */
    if (AppState.location.book && AppState.location.book.key === newBookKey &&
        AppState.location.chapter === newCh) return;
    const _allBooks = [...(SB_BOOKS.nt || []), ...(SB_BOOKS.ot || [])];
    const bookObj   = _allBooks.find(b => b.key === newBookKey);
    if (!bookObj) return;
    AppState.location.testament = SB_BOOKS.nt.some(b => b.key === newBookKey) ? 'nt' : 'ot';
    AppState.location.book      = bookObj;
    AppState.location.chapter   = newCh;
    syncUrlState();
    renderGlobalBreadcrumb();
    updateHeader('bible');
    _syncMobileLocationLabel();
}

/** 単一章ブロックを Observer に登録する。_loadAndAppendChapter から呼ぶ。 */
function _observeChapterBlock(block) {
    if (!block || !_chapterObserver) return;
    _chapterObserver.observe(block);
}

/**
 * ChapterFocusObserver を初期化する。render() 末尾で呼ぶ（DOM 全消去後のため再初期化が必要）。
 * single mode: #bible-text-area 内の .chapter-block を observe する。
 * compare desktop: #main-reading-area 内の .compare-chapter-block を observe する（Phase 3-7-D）。
 */
function _setupChapterObserver() {
    if (_chapterObserver) { _chapterObserver.disconnect(); _chapterObserver = null; }
    _chapterObserverVisible.clear();
    if (_chapterFocusTimer) { clearTimeout(_chapterFocusTimer); _chapterFocusTimer = null; }
    const container = document.getElementById('main-reading-area');
    const app       = document.getElementById('bible-text-area');
    if (!container || !app || typeof IntersectionObserver === 'undefined') return;
    _chapterObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            const key = (entry.target.dataset.book || '') + '|' + (entry.target.dataset.chapter || '');
            if (entry.isIntersecting) { _chapterObserverVisible.set(key, entry.target); }
            else                      { _chapterObserverVisible.delete(key); }
        });
        if (_chapterFocusTimer) clearTimeout(_chapterFocusTimer);
        _chapterFocusTimer = setTimeout(_recalcFocusChapter, 150);
    }, { root: container, threshold: 0 });
    /* Phase 3-7-D: compare mode は container > .compare-chapter-block、single mode は app > .chapter-block。
       _recalcFocusChapter() は dataset.book / dataset.chapter を読むため両ブロック型で変更なく動作する。 */
    if (_transMode === 'compare') {
        container.querySelectorAll('.compare-chapter-block').forEach(function (block) {
            _chapterObserver.observe(block);
        });
    } else {
        app.querySelectorAll('.chapter-block').forEach(function (block) {
            _chapterObserver.observe(block);
        });
    }
}

/* ══════════════════════════════════════════
   Phase 3-7-E: Desktop Compare Chapter Loader
   ══════════════════════════════════════════ */
/**
 * _loadAndAppendChapterCompare — Desktop compare 専用章ローダー。
 * JA1955 翻訳データと Greek データを並列取得し、1 transaction として
 * .compare-chapter-block を #main-reading-area へ追加する。
 * 片側取得失敗時は partial DOM を残さない。
 * WO 右列は _setFlowInjection() ではなく loader 内で per-chapter データを使い inline 注入する。
 *
 * @param {Object} bookObj  SB_BOOKS entry { key, name, ch }
 * @param {number} chNum    chapter number
 * @returns {Promise<boolean>}  true=追加成功、false=スキップ/失敗
 */
async function _loadAndAppendChapterCompare(bookObj, chNum) {
    if (!bookObj || chNum == null || _transMode !== 'compare') return false;

    const _lccBookKey = bookObj.key || '';
    const _lccCh      = String(chNum);
    if (!_lccBookKey || !_lccCh) return false;

    const mainArea = document.getElementById('main-reading-area');
    if (!mainArea) return false;

    /* DOM 重複チェック */
    if (mainArea.querySelector(`.compare-chapter-block[data-book="${_lccBookKey}"][data-chapter="${_lccCh}"]`)) return false;

    /* 同時リクエスト防止 */
    const _lccKey = `${_lccBookKey}|${_lccCh}`;
    if (_comparePending.has(_lccKey)) return false;
    _comparePending.add(_lccKey);

    let _lccCcb = null;
    try {
        /* JA1955 翻訳データと Greek データを並列取得する */
        const _lccHasGreek  = GREEK_BOOKS.has(_lccBookKey);
        const _lccTestament = SB_BOOKS.nt.some(b => b.key === _lccBookKey) ? 'nt' : 'lxx';

        const [_lccJpDataA, _lccElDataRaw] = await Promise.all([
            _fetchTranslation(_transA, _lccBookKey, _lccCh),
            _lccHasGreek
                ? fetch(`../bible_data/${_lccTestament}/${_lccBookKey}/${_lccCh}.json`)
                    .then(r => r.ok ? r.json() : [])
                    .catch(() => [])
                : Promise.resolve([]),
        ]);

        /* JA1955 データ必須（WO は Greek 由来のため Greek 失敗でも継続可） */
        if (!_lccJpDataA || !_lccJpDataA.verses) return false;

        const _lccElData = Array.isArray(_lccElDataRaw) ? _lccElDataRaw : [];

        /* elByVerse 構築（render() と同じロジック） */
        const _lccElByVerse = {};
        _lccElData.forEach(w => {
            const v = _elTokenVerse(w);
            if (v) { if (!_lccElByVerse[v]) _lccElByVerse[v] = []; _lccElByVerse[v].push(w); }
        });
        const _lccHasGreekResolved = _lccHasGreek && _lccElData.length > 0;

        /* Greek → _buildFlowJpData() → WO jpData（verse 番号一覧として使用） */
        const _lccJpDataB = _buildFlowJpData(_lccElData);
        if (!_lccJpDataB || !_lccJpDataB.verses) return false;

        /* ColumnMode */
        const _lccColAMode = _toColumnMode(_transA);
        const _lccColBMode = _toColumnMode(_transB);
        const _lccColA     = { colMode: _lccColAMode, jpData: _lccJpDataA };
        const _lccColB     = { colMode: _lccColBMode, jpData: _lccJpDataB };

        /* .compare-chapter-block 生成（render() compare path と同一構造） */
        _lccCcb = document.createElement('div');
        _lccCcb.className       = 'compare-chapter-block';
        _lccCcb.dataset.book    = _lccBookKey;
        _lccCcb.dataset.chapter = _lccCh;
        const _lccHdr = document.createElement('div');
        _lccHdr.className   = 'compare-chapter-header';
        _lccHdr.setAttribute('aria-hidden', 'true');
        _lccHdr.textContent = '· · ·';
        _lccCcb.appendChild(_lccHdr);

        /* verse-pair 生成 */
        Object.entries(_lccJpDataA.verses).forEach(([vNum, text]) => {
            const block = _buildColumnBlock(
                0, _lccColA, _lccColB,
                vNum, text, _lccElByVerse,
                _lccHasGreekResolved, true,
                _lccCcb, bookObj, chNum
            );

            if (_lccHasGreekResolved && _lccColAMode.kind !== 'wordOrder') {
                block.onclick = () => {
                    _selectVerseBlocks(vNum, block, block.closest('.compare-chapter-block'));
                    document.getElementById('active-v').innerText = `${vNum} 節`;
                    AppState.toBrowsing(vNum, _lccElByVerse[vNum] || [], bookObj, chNum);
                    openVerseInspector(vNum, _lccElByVerse[vNum] || [], bookObj, chNum);
                    notifyAppStateChange();
                };
            }

            const pBlock = _buildColumnBlock(
                1, _lccColB, _lccColA,
                vNum, text, _lccElByVerse,
                _lccHasGreekResolved, true,
                _lccCcb, bookObj, chNum
            );

            /* Phase 3-7-E: WO 右列に Greek flow を inline 注入する。
               _setFlowInjection() は _cachedElByVerse（初期章のみ）を参照するため、
               autoload 章は loader 内で per-chapter データを使い直接注入する。 */
            if (_lccColBMode.kind === 'wordOrder' && _lccHasGreekResolved) {
                pBlock.classList.add('gf-mode');
                if (!pBlock.querySelector('.gf-verse-block')) {
                    const gfEl = document.createElement('div');
                    gfEl.className = 'gf-verse-block';
                    const _gfResult = _buildGfVerseBlock(vNum, _lccElByVerse[vNum] || [], _lccBookKey, chNum);
                    gfEl.innerHTML     = _gfResult.html;
                    gfEl._flowChips    = _gfResult.chips;
                    gfEl._flowWords    = _gfResult.words;
                    gfEl._flowResolved = _gfResult.analysis;
                    pBlock.appendChild(gfEl);
                }
            }

            const pairEl = document.createElement('div');
            pairEl.className = 'verse-pair';
            pairEl.appendChild(block);
            pairEl.appendChild(pBlock);
            _lccCcb.appendChild(pairEl);
        });

        /* 挿入直前に再度重複確認（fetch 中に DOM が変わった場合） */
        if (mainArea.querySelector(`.compare-chapter-block[data-book="${_lccBookKey}"][data-chapter="${_lccCh}"]`)) {
            _lccCcb = null;
            return false;
        }

        mainArea.appendChild(_lccCcb);
        _appendedChapterCache.set(`${_lccBookKey}|${_lccCh}`, _lccElByVerse); /* Greek evidence キャッシュ */

        /* Phase 3-7-D の ChapterFocusObserver に新規ブロックを登録する */
        if (_chapterObserver) { _chapterObserver.observe(_lccCcb); }

        _lccCcb = null;
        return true;

    } catch (_lccErr) {
        return false;
    } finally {
        _comparePending.delete(_lccKey);
    }
}

/* ══════════════════════════════════════════
   Phase 2A-5: Scroll-triggered Chapter Autoload
   ══════════════════════════════════════════ */
let _alObserver   = null;   /* Autoload 専用 IntersectionObserver */
let _alSentinel   = null;   /* 最終章末に配置する trigger 要素 */
let _alRunning    = false;  /* _doAutoload 実行中フラグ（二重起動防止） */
let _alRetryCount = 0;      /* 同一章の連続失敗カウンタ */
let _alCancelGen  = 0;      /* render() 中断を検知するための世代番号 */

/** Autoload を停止し関連リソースをすべて解放する。render() 経由でも呼ばれる。 */
function _stopAutoload() {
    _alCancelGen++;
    if (_alObserver) { _alObserver.disconnect(); _alObserver = null; }
    if (_alSentinel && _alSentinel.parentNode) { _alSentinel.parentNode.removeChild(_alSentinel); }
    _alSentinel = null;
    _alRunning  = false;
}

/**
 * sentinel を現在の最終章ブロック末尾に配置し Observer に登録する。
 * 最終章（bookObj.ch）に到達したら _stopAutoload() で停止する。
 * Phase 3-7-E: compare mode は #main-reading-area の .compare-chapter-block を対象にする。
 */
function _placeSentinel() {
    /* Phase 3-7-E: compare mode は mainArea > .compare-chapter-block、single mode は app > .chapter-block */
    const _psRoot     = _transMode === 'compare'
        ? document.getElementById('main-reading-area')
        : document.getElementById('bible-text-area');
    const _psSelector = _transMode === 'compare' ? '.compare-chapter-block' : '.chapter-block';
    if (!_psRoot || !_alObserver) return;
    const blocks = _psRoot.querySelectorAll(_psSelector);
    if (!blocks.length) return;
    const last    = blocks[blocks.length - 1];
    const bookKey = last.dataset.book || '';
    const chNum   = parseInt(last.dataset.chapter, 10);
    const bookObj = [...(SB_BOOKS.nt || []), ...(SB_BOOKS.ot || [])].find(b => b.key === bookKey);
    /* 最終章 or 書物不明 → これ以上ロード不要 */
    if (!bookObj || isNaN(chNum) || chNum >= bookObj.ch) { _stopAutoload(); return; }
    if (!_alSentinel) {
        _alSentinel = document.createElement('div');
        _alSentinel.className = 'chapter-load-sentinel';
    }
    /* sentinel を最終章末に移動（appendChild は既存の親から自動的に外す） */
    if (_alSentinel.parentNode !== last) { last.appendChild(_alSentinel); }
    /* Observer を最初の sentinel のみに絞り込む */
    _alObserver.disconnect();
    _alObserver.observe(_alSentinel);
}

/**
 * 次章を非同期ロードする。
 * _alRunning フラグ と _alCancelGen で二重起動・render() 中断を防ぐ。
 * 失敗 3 回連続で自動停止する。
 */
async function _doAutoload(bookObj, nextCh) {
    if (_alRunning) return;
    const _alColKind = _toColumnMode(_transA).kind;
    /* Phase 3-7-E: compare mode は専用 loader へ委譲。single mode は blocked mode チェック後に既存 loader を呼ぶ */
    if (_transMode !== 'compare' && _isAutoloadBlockedMode(_alColKind)) { _stopAutoload(); return; }
    _alRunning = true;
    const _myGen = _alCancelGen;
    try {
        const ok = _transMode === 'compare'
            ? await _loadAndAppendChapterCompare(bookObj, nextCh)
            : await _loadAndAppendChapter(bookObj, nextCh);

        /* render() が割り込んだ場合: stale DOM を除去して終了 */
        if (_alCancelGen !== _myGen) {
            if (ok) {
                if (_transMode === 'compare') {
                    const _ma = document.getElementById('main-reading-area');
                    if (_ma) {
                        const _stale = _ma.querySelector(`.compare-chapter-block[data-book="${bookObj.key}"][data-chapter="${String(nextCh)}"]`);
                        if (_stale) _stale.parentNode.removeChild(_stale);
                    }
                } else {
                    const _app = document.getElementById('bible-text-area');
                    if (_app) {
                        const _stale = _app.querySelector(`.chapter-block[data-book="${bookObj.key}"][data-chapter="${String(nextCh)}"]`);
                        if (_stale) _stale.parentNode.removeChild(_stale);
                    }
                }
            }
            return;
        }

        /* 成功 or 既にDOMにある → sentinel を次章末へ移動 */
        const _checkLoaded = () => {
            if (_transMode === 'compare') {
                const _ma = document.getElementById('main-reading-area');
                return !!(_ma && _ma.querySelector(`.compare-chapter-block[data-book="${bookObj.key}"][data-chapter="${String(nextCh)}"]`));
            }
            const _a = document.getElementById('bible-text-area');
            return !!(_a && _a.querySelector(`.chapter-block[data-book="${bookObj.key}"][data-chapter="${String(nextCh)}"]`));
        };
        const _loaded = ok || _checkLoaded();
        if (_loaded) {
            _alRetryCount = 0;
            _placeSentinel();
        } else {
            _alRetryCount++;
            if (_alRetryCount >= 3) { _stopAutoload(); } /* 3連続失敗で停止 */
        }
    } finally {
        _alRunning = false;
    }
}

/**
 * Autoload Observer を初期化する。
 * render() 末尾で _setupChapterObserver() と共に呼ぶ（single-mode のみ）。
 * rootMargin '0px 0px 300px 0px': 章末が viewport 下端から 300px 以内に入ったら fire。
 */
function _setupAutoload() {
    _stopAutoload();
    const _alColKind = _toColumnMode(_transA).kind;
    /* Phase 3-7-E: compare mode は _loadAndAppendChapterCompare を使う。blocked mode（discourse 等）は single/compare とも無効 */
    if (_isAutoloadBlockedMode(_alColKind)) return;
    const container = document.getElementById('main-reading-area');
    if (!container || typeof IntersectionObserver === 'undefined') return;
    _alObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (!entry.isIntersecting || !entry.target.parentElement) return;
            const parent  = entry.target.parentElement;
            const bookKey = parent.dataset.book || '';
            const chNum   = parseInt(parent.dataset.chapter, 10);
            const bookObj = [...(SB_BOOKS.nt || []), ...(SB_BOOKS.ot || [])].find(b => b.key === bookKey);
            if (!bookObj || isNaN(chNum)) return;
            const nextCh = chNum + 1;
            if (nextCh > bookObj.ch) { _stopAutoload(); return; }
            _doAutoload(bookObj, nextCh);
        });
    }, { root: container, rootMargin: '0px 0px 300px 0px', threshold: 0 });
    _placeSentinel();
}

/**
 * openVerseInspector — 節タップの単一入口（Adapter Layer）。
 *
 * 責務: 「節タップ後に適切な表示方式へ振り分ける」こと。
 * 節タップは必ずこの関数を経由し、以降の分岐（Desktop / Mobile）はここに閉じ込める。
 *
 * 振り分け:
 *   Desktop → openWordListInStudyPanel()（従来どおり）
 *   Mobile  → openMobileVerseView()（Phase A-2 で追加した器。中身は placeholder）
 *
 * モバイル判定は既存の _isMobile()（innerWidth <= 900）をそのまま使う。
 * 新しい判定方式は作らない。
 */
function openVerseInspector(vNum, words, book, ch) {
    if (_isActualMobile()) {
        return openMobileVerseView(vNum, words, book, ch);
    }
    return openWordListInStudyPanel(vNum, words, book, ch);
}

/**
 * openMobileVerseView — モバイル専用 Verse Inspector の器（Phase A-2 / B）。
 *
 * Phase B: 上半分 #mobile-verse-area にタップした節の本文を表示する。
 * 下半分 #mobile-inspector-area は placeholder のまま（次 Phase）。
 * 既存 StudyPanel / Bottom Sheet には一切触れない。
 */
/* ── MobileVerseView 内部の階層状態（Phase C-4） ──
   AppState / depth stack / panelGoBack とは独立した、MobileVerseView 専用の UI 状態。
   'list'   = Level2（語順フロー・単語一覧）
   'detail' = Level3（単語詳細）
   戻るボタンはこの値だけを見て「詳細→一覧」か「一覧→クローズ」かを決める。 */
let _mobileVerseInspectorMode = 'list';
/* 一覧へ戻す際の再描画に必要な現在節のコンテキスト（AppState には持たせない）。 */
let _mvvVNum    = null;
let _mvvWords   = [];
/* 描画時コンテキスト: タップされた節が属する book オブジェクト・chapter（AppState.location に持たせない）。 */
let _mvvBook    = null;
let _mvvChapter = null;
/* E-1B: Level2→Level3→戻る で復元する #mobile-inspector-area のスクロール位置。 */
let _mvvInspectorScrollTop = 0;
/* Level3 の innerHTML 再描画で失われないよう、口語訳 DOM を階層間で保持する。 */
let _mvvTranslationNode = null;
/* E-1C: MVV が積んだ history エントリの管理フラグ（AppState / URL は変更しない）。 */
let _mvvHistoryActive = false;
let _mvvIgnoreNextPop = false;

function openMobileVerseView(vNum, words, book, ch) {
    closeMobileSidebar();
    const view = document.getElementById('mobile-verse-view');
    if (!view) return;
    view.classList.add('open');
    _syncStudyVerseNav();
    /* MN: MobileVerseView 全画面中は Bottom Nav を隠す */
    document.getElementById('app')?.classList.add('mobile-mvv-open');
    /* E-1C: Android/ブラウザの戻るで MVV を閉じられるよう履歴エントリを1つ積む（URL は不変）。 */
    _mvvPushHistory();
    /* 内部状態を初期化: 節を開いた直後は必ず Level2（一覧）。戻り再描画用に節情報も保持。
       book / ch は描画時コンテキスト（明示引数）を優先し、省略時は AppState.location にフォールバック。 */
    _mvvVNum    = vNum;
    _mvvWords   = words || [];
    _mvvBook    = book    != null ? book    : (AppState.location.book    || null);
    _mvvChapter = ch      != null ? ch      : (AppState.location.chapter != null ? AppState.location.chapter : null);
    _mvvInspectorScrollTop = 0;   /* E-1B: 新しい節を開いたら復元位置はリセット */
    _mobileVerseInspectorMode = 'list';
    /* 上半分に節本文を描画（DOM取得は同期・FLOW時のfetchは非同期のため fire-and-forget）。
       下半分の Inspector（Level2）描画も _renderMobileVerseArea 内から続けて呼ぶ。 */
    _renderMobileVerseArea(vNum, words);
    return view;
}

/**
 * _mobileVerseViewBack — MobileVerseView の戻るボタン（#mobile-verse-view-back）専用ハンドラ。
 *
 * detail（Level3・単語詳細）→ list（Level2・語形一覧）へ戻す。
 * list（Level2）→ MobileVerseView 自体を閉じる。
 * AppState の depth stack / panelGoBack は使わない（MobileVerseView 内部で完結）。
 */
function _mobileVerseViewBack() {
    if (_mobileVerseInspectorMode === 'detail') {
        /* Level3 → Level2: 保持しておいた節コンテキストで一覧を再描画 */
        _mobileInspectorRender(_mvvVNum, _mvvWords);
        _mobileVerseInspectorMode = 'list';
        /* E-1B: Level3 へ入る前の Level2 スクロール位置を復元（描画後の 1 フレームで適用） */
        const area = document.getElementById('mobile-inspector-area');
        if (area) {
            const y = _mvvInspectorScrollTop;
            requestAnimationFrame(function () { area.scrollTop = y; });
        }
        return;
    }
    /* Level2 → クローズ */
    closeMobileVerseView();
}

/* ── E-1C: MobileVerseView の履歴連携（Android/ブラウザ戻る対応。URL・AppState は不変） ── */
function _mvvPushHistory() {
    if (_mvvHistoryActive) return;
    _mvvHistoryActive = true;
    /* URL は変えず（第3引数省略）、state マーカーのみのエントリを積む。失敗しても致命でない。 */
    try { history.pushState({ __mvv: true }, ''); } catch (_) {}
}

/* DOM を閉じるだけの内部処理（履歴操作を伴わない）。popstate と UI 戻るの共通処理。 */
function _doCloseMobileVerseView() {
    const view = document.getElementById('mobile-verse-view');
    if (view) view.classList.remove('open');
    /* MN: Bottom Nav を復元 */
    document.getElementById('app')?.classList.remove('mobile-mvv-open');
    _closeMvvActionMenu();   /* Phase G-1: MVV クローズ時はアクションメニューも閉じる */
    /* 次回 open 時は openMobileVerseView が 'list' を再設定するが、閉じた時点でも
       内部状態を list に戻しておく（状態リセットの明示・防御的ハイジーン）。 */
    _mobileVerseInspectorMode = 'list';
    /* MVV 閉じ時に StudyPanel が裏で開いていた場合も閉じて Layer 1 に確実に戻す。
       通常フローでは StudyPanel と MVV は共存しないが、URL 共有・ページ遷移・
       リサイズなど想定外の経路で StudyPanel が open になっている可能性がある。
       これ以外に closeStudyPanel() を呼ぶ必要はない（意図しない閉鎖禁止）。 */
    const _sp = document.getElementById('bottom-depth-panel');
    if (_sp && _sp.classList.contains('open')) closeStudyPanel();
}

/* ── Phase G-1: MobileVerseView アクションメニュー（ハイライト / 共有） ──
   バーを静かに保つため、アクションは ⋮ メニューへ集約。既存関数を呼ぶだけで、
   _hlVerseHighlight / copyShareUrl / storage / AppState / URL は一切変更しない。 */
function _mvvOutsideCloseActionMenu(e) {
    const menu = document.getElementById('mobile-verse-action-menu');
    const btn  = document.getElementById('mobile-verse-view-action');
    if (menu && (menu.contains(e.target) || (btn && btn.contains(e.target)))) return;
    _closeMvvActionMenu();
}

function _closeMvvActionMenu() {
    const menu = document.getElementById('mobile-verse-action-menu');
    if (menu) menu.classList.remove('open');
    const btn = document.getElementById('mobile-verse-view-action');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', _mvvOutsideCloseActionMenu);
}

function _toggleMvvActionMenu(e) {
    if (e) e.stopPropagation();   /* 開くクリックが直後の outside-close に拾われないように */
    const menu = document.getElementById('mobile-verse-action-menu');
    if (!menu) return;
    if (menu.classList.contains('open')) { _closeMvvActionMenu(); return; }

    menu.classList.add('open');
    const btn = document.getElementById('mobile-verse-view-action');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    /* 外側タップで閉じる（開いた後に登録） */
    document.addEventListener('click', _mvvOutsideCloseActionMenu);
}

/* メニュー項目 → 既存機能へ委譲（メニューは先に閉じる）。 */
function _mvvMenuAction(kind) {
    _closeMvvActionMenu();
    if (kind === 'highlight') _hlVerseHighlight();
    else if (kind === 'share') copyShareUrl();
}

/* Android/ブラウザの戻る操作。MVV → Book picker → Mode picker の順で閉じる。 */
window.addEventListener('popstate', function (e) {
    /* ① 既存: MVV IgnorePop（UI 戻るが誘発した pop は無視） */
    if (_mvvIgnoreNextPop) { _mvvIgnoreNextPop = false; return; }
    /* ② 既存: MVV close（MVV 由来を最優先） */
    if (_mvvHistoryActive) { _mvvHistoryActive = false; _doCloseMobileVerseView(); return; }
    /* ③ MN: Book picker close */
    if (_mbpIgnoreNextPop) { _mbpIgnoreNextPop = false; return; }
    if (_mbpHistoryActive) { _mbpHistoryActive = false; _closeMobileBookPickerDOM(); return; }
    /* ④ MN: Mode picker close */
    if (_mmpIgnoreNextPop) { _mmpIgnoreNextPop = false; return; }
    if (_mmpHistoryActive) { _mmpHistoryActive = false; _closeMobileModePicker(); return; }

    /* 通常の章移動でブラウザの戻る／進むが発生した場合、URL と本文を同期する。 */
    const route = Router.parse();
    const routeBook = route.book || 'ROM';
    const routeChapter = parseInt(route.chapter || '1', 10);
    if (AppState.location.book?.key !== routeBook || AppState.location.chapter !== routeChapter) {
        renderCurrentPage();
    }
});

/* ── E-1A: MobileVerseView 限定のキーボード回避（visualViewport）。desktop / StudyPanel 非影響。 ── */
(function _setupMvvKeyboard() {
    const vv = window.visualViewport;
    if (!vv) return;
    let active = false;
    function apply() {
        const view = document.getElementById('mobile-verse-view');
        if (!view) return;
        if (!active) { view.style.paddingBottom = ''; return; }
        /* キーボード高さ ≒ レイアウトビューポート − ビジュアルビューポート（下端）。 */
        const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        view.style.paddingBottom = kb > 0 ? (kb + 'px') : '';
    }
    document.addEventListener('focusin', function (e) {
        const t = e.target;
        if (!t || t.tagName !== 'TEXTAREA' || !t.closest || !t.closest('#mobile-verse-view')) return;
        active = true;
        vv.addEventListener('resize', apply);
        vv.addEventListener('scroll', apply);
        apply();
        setTimeout(function () { try { t.scrollIntoView({ block: 'center' }); } catch (_) {} }, 100);
    });
    document.addEventListener('focusout', function (e) {
        const t = e.target;
        if (!t || t.tagName !== 'TEXTAREA' || !t.closest || !t.closest('#mobile-verse-view')) return;
        active = false;
        vv.removeEventListener('resize', apply);
        vv.removeEventListener('scroll', apply);
        apply();   /* paddingBottom を '' に戻し、CSS の env(safe-area) を復帰 */
    });
})();

 * それ以外の翻訳が来た場合も _transA をそのまま返す（将来の翻訳追加に追随）。
 */
function _mvvDisplayTrans() {

/**
 * _mvvGetVerseText — 表示すべき節本文（プレーンテキスト）を取得する。
 *
 * 優先順位:
 *   1) FLOW 以外（_transA が実際の訳文）: 現在表示中の DOM（左節ブロックの
 *      .jp-text）からそのまま読む。追加 fetch を避ける。
 *   2) FLOW（DOM に訳文が無い）または DOM 取得不可: 既存の翻訳データ取得経路
 *      _fetchTranslation() で _mvvDisplayTrans()（=JA1955）を読む。
 */
async function _mvvGetVerseText(vNum) {
    if (!_isGreekReadingMode(_toColumnMode(_transA).kind)) {   /* DA-1: discourse も FLOW と同様 DOM に訳文が無い */
        /* Phase 3-6-I A': _mvvChapter が確定している場合は対象章スコープで探す。
           章スコープで見つからない場合は fallback しない（別章の同番号verse取得を防ぐ）。 */
        const _mvgBookObj = _mvvBook || AppState.location.book;
        const _mvgBookKey = _mvgBookObj ? _mvgBookObj.key : '';
        const _mvgChStr   = _mvvChapter != null ? String(_mvvChapter) : null;
        const block = (_mvgBookKey && _mvgChStr)
            ? _findVerseInChapter(_mvgBookKey, _mvgChStr, String(vNum))
            : _findVisibleVerseBlock(vNum);
        if (block) {
            const jt = block.querySelector('.jp-text');
            if (jt) {
                const t = jt.textContent.trim();
                if (t) return t;
            }
        }
    }
    /* FLOW もしくは DOM から取れない場合のみ、既存 fetch 経路を使う */
    const bookKey = AppState.location.book ? AppState.location.book.key : '';
    /* Phase 3-6-I A': fetch も対象章で取得する。 */
    const ch = _mvvChapter != null ? _mvvChapter : AppState.location.chapter;
    if (!bookKey || ch == null) return '';
    const data = await _fetchTranslation(_mvvDisplayTrans(), bookKey, String(ch));
    if (data && data.verses && data.verses[vNum] != null) return String(data.verses[vNum]);
    return '';
}

/**
 * _mobileInspectorRender — #mobile-inspector-area に Level2 内容を描画する。
 *
 * 既存の Level2 描画ロジックをそのまま再利用する:
 *   - _buildFlowTabHTML(words) … 語順フロー + 単語一覧（chip 列 + 詳細ドロワー等）
 *   - _fillWallacePassageNote(words, area) … 節読書メモスロットの非同期充填
 * StudyPanel（#bottom-depth-panel）や _openWordListInternal のコードは複製せず、
 * 同じ生成関数を別コンテナへ出力するだけ。
 *
 * 注:
 *   - chip クリックは既存 _wlvChipClick が使う _wlvWordCache を SSOT とするため、
 *     ここで従来どおり words をセットする（_openWordListInternal と同じ振る舞い）。
 */
function _mobileInspectorRender(vNum, words) {
    const area = document.getElementById('mobile-inspector-area');
    if (!area) return;

    area.classList.remove('drawer-open');

    /* Level3 から戻る際も、一覧領域の口語訳 DOM を保持して再配置する。
       再配置前にアニメーション用インラインスタイルをクリアし、自然な高さに戻す。 */
    const translation = area.querySelector('.mvv-inline-translation') || _mvvTranslationNode;
    if (translation) { translation.remove(); _clearTranslationInlineStyles(translation); }

    /* 節の一覧へ戻ったら、節の読書メモを再表示する。 */
    const verseArea = document.getElementById('mobile-verse-area');
    if (verseArea) verseArea.classList.remove('word-analysis-open');
    /* Level2（一覧）を描画するので内部状態は list */
    _mobileVerseInspectorMode = 'list';
    _syncMobileVerseViewBackLabel();
    _syncMobileVerseTitle();

    /* chip クリック（_wlvChipClick）が参照するグローバルキャッシュ。
       モバイルでは desktop の #word-list-view を描画しないため衝突しない。 */
    _wlvWordCache = words || [];

    if (!words || !words.length) {
        area.innerHTML =
            `<p style="color:var(--text-sub);font-size:var(--text-caption);text-align:center;padding:var(--space-xl) var(--space-md);">この節では語形表示はまだ利用できません</p>`;
        if (translation) area.prepend(translation);
        /* メモは固定領域 #mobile-verse-note-area（open 時に初期化）にあり、
           ここでは触れない（Level 遷移で内容・開閉状態を保持するため）。 */
        return;
    }

    /* Phase VR-3A/VR-3B: Flowタブの描画経路を Verse Representation Architecture 経由にする。
       renderColumn() は WordOrderRenderer（chips[] のみを入力とする）へ委譲するため、
       出力は _buildFlowTabHTML() 時代と完全一致（docs/development/verse-representation-design.md）。 */
    {
        const _vrBookKey = AppState.location.book ? AppState.location.book.key : '';
        /* Phase 3-6-I A: MVV内では_mvvChapterを使い、buildVerseのchapter keyを対象節と一致させる。 */
        const _vrCh      = _mvvChapter != null ? _mvvChapter : (AppState.location.chapter != null ? AppState.location.chapter : null);
        const _vrVerse   = buildVerse(_vrBookKey, _vrCh, vNum, words);
        const _spMode    = _studyPanelCompanionMode(_transA);
        if (_spMode === 'DA_READING' && _sdChapterDataForRender) {
            /* RK_READING → DA_READING: 既存 renderDAReadingView を節単位で再利用 */
            renderDAReadingView(area, _sdChapterDataForRender, words);
            _wlvChipCache = [];
        } else {
            const _vrRep = buildRepresentation({ kind: 'wordOrder' }, _vrVerse, getAnalysis(_vrVerse));
            /* VR-4-C Step 5: 「本文がFLOW表示中か」の判定はここ（呼び出し元）で解決し、
               WordOrderRenderer へは解決済みの真偽値のみを渡す（旧実装の "修正B" 判定を移設）。 */
            const _showOnboardingAnchor = _toColumnMode(_transA).kind !== 'wordOrder'
                && !!(window.App.onboarding && !window.App.onboarding.getState().onboardingComplete);
            /* VR-5-H-12: legend 表示可否も呼び出し元で解決し、Renderer へは真偽値のみ渡す
               （render() 内の window.App.onboarding 直参照を撤去。旧: onboardingComplete で凡例表示）。 */
            const _showOnboardingLegend = !!(window.App.onboarding?.getState()?.onboardingComplete);
            area.innerHTML = renderColumn(_vrRep, { showOnboardingAnchor: _showOnboardingAnchor, showOnboardingLegend: _showOnboardingLegend });
            /* Phase VR-4B-3: 表示に使った chips[] をクリック時まで保持する（Interaction Lifecycle是正）。
               Mobile Inspector も StudyPanel と同じくシングルトン表示のため同じキャッシュを共有する。 */
            _wlvChipCache = (_vrRep && _vrRep.chips) ? _vrRep.chips : [];
            /* モバイルの口語訳は専用 DOM として保持する。
               コンテナ全体を置換する非同期注入はここでは行わない。 */
        }
    }
    if (translation) area.prepend(translation);
    /* 節読書メモは訳文の上（#mobile-verse-area）に表示する。ここでは注入しない。 */
}

 *     Adapter（openVerseInspector）と panelGoBack 経由の内部再描画のみ。
 */
function openWordListInStudyPanel(vNum, words, book, ch) {
    /* words をキャッシュ（chip クリック時の詳細参照用） */
    _wlvWordCache = words || [];

    /* depth stack に verse-flow を追加（reading が先頭になければ追加） */
    const stack = AppState.depth.stack;
    if (stack.length === 0 || stack[0].type !== 'reading') {
        /* reading を先頭に置いてからverse-flowを追加 */
        AppState.clearDepth();
        pushDepth({ type: 'reading', label: '読書' });
    }
    /* verse-flow を追加（重複しないよう top を確認） */
    const top = stack[stack.length - 1];
    if (!top || top.type !== 'verse-flow' || String(top.verse) !== String(vNum)) {
        pushDepth({
            type:  'verse-flow',
            label: 'ことばの流れ',
            verse: vNum,
        });
    }

    _openWordListInternal(vNum, words, book, ch);

    /* onboarding hook: 節タップ時にも通知 */
    if (window.App.onboarding) {
        window.App.onboarding.onStudyPanelOpened(window.innerWidth <= 900, String(vNum));
    }
    _syncOnboardingActiveFlag();

    notifyAppStateChange();
}

/* ═════════════════════════════════════════════════════════════════
 * 節全体の読書メモ — ReadingFormatter 駆動版
 *
 * 旧 _buildPassageNote（CONJ_FEEL辞書 / imperatives・perfects・
 * passives・participles ヒューリスティック / METAPHOR辞書 / 呼格判定 /
 * 「原語の語順と品詞の流れは、上の原語の順序から確認できます。」を
 * 含む独自フォールバック文）は完全に削除した。
 *
 * UI生成の唯一ソースは clause-analyzer.js の ReadingFormatter.format()。
 * 本ブロックの役割は「SyntaxAnalyzer→PhraseAnalyzer→ClauseAnalyzer の
 * パイプラインを実行し、検出された節ごとに ReadingFormatter へ渡す」
 * という配線のみで、文章そのものは一切生成しない。
 *
 * フォールバックルール:
 *   - words が空 → null（節を組まない）
 *   - パイプライン未初期化 / 初期化失敗 → null（代替文で埋めない）
 *   - 節が1つも検出されない → null（多くの平叙文がこれに該当する。
 *     旧実装はここで汎用フォールバック文を出していたが、今回はそれを
 *     廃止し、読書メモという「言うことがある時だけ話す」静寂優先の
 *     設計にする）
 *   - 検出された節がいずれも discourse.type を持たない → null
 *
 * discourse.type / clause.type / marker / confidence は、
 * ReadingFormatter.format() の戻り値（{title, summary, hint,
 * confidenceText}）にしか触れないため、本ブロックのコードには
 * そもそも一切登場しない（Guard Rule は ReadingFormatter 側で
 * assertReadingTextSafe() により多重に保証済み）。
 * ═════════════════════════════════════════════════════════════════ */

let _wallacePipeline       = null;  // { sa, pa, ca, rf } キャッシュ（初回のみ registry を fetch）
let _wallacePipelineFailed = false; // 初期化に失敗した場合は再試行せず静かに諦める
// 読書メモの非同期世代はコンテナごとに保持し、PC/Mobile の描画が互いを無効化しない。
let _apparatusData         = null;  // apparatus.json キャッシュ（初回のみ fetch）
let _apparatusLoadP        = null;  // 進行中 fetch Promise
// 本文批評欄の非同期世代はコンテナごとに保持し、PC/Mobile 間の競合を防ぐ。
let _apparatusJaData       = null;  // apparatus-ja.json キャッシュ（失敗時は null のまま）
let _apparatusJaLoadP      = null;  // 進行中 fetch Promise
let _apparatusJaAllData    = null;  // 4データセット統合キャッシュ（失敗時は null のまま）
let _apparatusJaAllLoadP   = null;  // 進行中 fetch Promise
let _apparatusLemJaData    = null;  // apparatus-lem-ja.json キャッシュ（失敗時は null のまま）
let _apparatusLemJaLoadP   = null;  // 進行中 fetch Promise
let _apparatusRdgJaData    = null;  // apparatus-rdg-ja.json キャッシュ（失敗時は null のまま）
let _apparatusRdgJaLoadP   = null;  // 進行中 fetch Promise

async function _ensureWallacePipeline() {
    if (_wallacePipeline || _wallacePipelineFailed) return _wallacePipeline;
    try {
        const [syntaxRegistry, phraseRegistry, clauseRegistry, readingPolicy] = await Promise.all([
            fetch('../assets/data/syntax-registry.json').then(r => r.json()),
            fetch('../assets/data/phrase-registry.json').then(r => r.json()),
            fetch('../assets/data/clause-registry.json').then(r => r.json()),
            fetch('../assets/data/reading-policy.json').then(r => r.json()),
        ]);
        const SyntaxAnalyzerCls = window.SyntaxAnalyzer || window.App?.syntax?.Analyzer;
        const PhraseAnalyzerCls = window.PhraseAnalyzer || window.App?.syntax?.PhraseAnalyzer;
        const ClauseAnalyzerCls = window.App?.syntax?.ClauseAnalyzer;
        const ReadingFormatterCls = window.App?.syntax?.ReadingFormatter;
        if (!SyntaxAnalyzerCls || !PhraseAnalyzerCls || !ClauseAnalyzerCls || !ReadingFormatterCls) {
            throw new Error('required analyzer classes not loaded');
        }
        /* Reading Policy（唯一の機械可読定義源）: 現象単位の scope / priority /
           verse_source を id 引きの索引にする。scope・priority をコードに書くことは
           禁止 — 変更は必ず assets/data/reading-policy.json で行う。 */
        const policyById = {};
        for (const ph of (readingPolicy.phenomena || [])) {
            for (const id of (ph.ids || [])) policyById[id] = ph;
        }
        _wallacePipeline = {
            sa: new SyntaxAnalyzerCls(syntaxRegistry),
            pa: new PhraseAnalyzerCls(phraseRegistry),
            ca: new ClauseAnalyzerCls(clauseRegistry),
            rf: new ReadingFormatterCls(),
            policy: { rules: readingPolicy.display_rules || {}, byId: policyById },
        };
    } catch (e) {
        console.warn('[Wallace] pipeline init failed:', e);
        _wallacePipelineFailed = true;
        _wallacePipeline = null;
    }
    return _wallacePipeline;
}

/* clauseResults キャッシュ（直近に解析した verse の words 参照をキーにする）。
   節レイヤー（passage note）と単語レイヤー（resonance）が同じ解析結果を
   共有するための唯一の場所 — 「レイヤーごとの別ロジック」を作らない。 */
let _wallaceClauseCache = null; // { words, clauseResults }

/**
 * words（節の生トークン配列）に対する ClauseAnalyzer の解析結果を返す。
 * 同じ words 参照に対しては再解析せずキャッシュを返す（節レイヤー・
 * 単語レイヤーの両方から呼ばれるため）。
 * @returns {Promise<Array|null>}
 */
async function _getWallaceClauseAnalysis(words) {
    if (!words || words.length === 0) return null;
    if (_wallaceClauseCache && _wallaceClauseCache.words === words) {
        return _wallaceClauseCache.clauseResults;
    }
    const pipeline = await _ensureWallacePipeline();
    if (!pipeline) return null;
    const { sa, pa, ca } = pipeline;
    try {
        const all = sa.analyzeAll(words);
        const syntaxResults = all.results.map(r => r.output);
        const phraseResults = pa.analyze({ tokens: words, syntaxResults });
        const clauseResults = ca.analyze({ tokens: words, syntaxResults, phraseResults });

        /* Phase 24: Reading Support Projection を並列生成（additive・読み取り専用）。
           失敗しても projection = null になるだけで、既存の表示・戻り値は一切変わらない。 */
        let projection = null;
        try {
            const RSP = window.App?.syntax?.ReadingSupportProjection;
            const CB  = window.App?.syntax?.ContextBuilder;
            if (RSP) {
                projection = RSP.build({
                    tokens: words, syntaxResults, clauseResults,
                    contextBuilder: CB, registry: sa.registry,
                });
            }
        } catch (_) { projection = null; }

        _wallaceClauseCache = { words, clauseResults, projection };
        return clauseResults;
    } catch (e) {
        console.warn('[Wallace] analysis failed:', e);
        return null;
    }
}

/* __PHRASE_READING_BEGIN__
   Phase 25B-2: Phrase Reading（かたまりの読書メモ）— 二層構成
   構造層: Q3「どこまでが一まとまりか」への回答（Mapping §3.2）。
   意味層 (v1.1): そのまとまりをどう読むか（docs/phrase-reading.md が設計正典。
   現象 → Reading Intent → 文章。解釈・文法用語・翻訳は出さない）。
   ReadingSupportProjection の phrases / genitivePhrases / words だけを読む。
   内部構造（種別・位置）は言い回しの選択にのみ使い、
   画面には本文の引用と日本語の一文しか出さない。
   静寂条件: Projection null / 語がどの まとまり にも属さない / 1 語のみ /
   長すぎる まとまり（引用が読書を止める）→ null（既存表示のみ）。 */

/* 言い回し選択の内部キー（画面には出さない）と引用長の上限 */
const _PHRASE_READING_PRIORITY = { NP: 0, PP: 1, PtcP: 2 };
const _PHRASE_READING_MAX_SPAN = 7;

/* ── Stage A: Phrase Renderer 用の語解決（docs/phrase-rendering.md §4）──
   引用の日本語ソースは Reading Engine の resolve 出力（唯一のソース）。
   失敗・改善なしは null を返し、Renderer 側が w.japanese へ fallback する。 */
function _phraseResolveWord(words, idx) {
    try {
        const ctx = _buildReadingContext(words, idx);
        const r = window.App?.readingEngine?.resolve(words[idx], ctx);
        return r ? r.japanese : null;
    } catch (_) {
        return null;
    }
}

/* Stage A: 引用生成の新経路。PhraseRenderer 未ロード時は旧 renderPhraseJP へ
   fallback（旧実装は比較・切戻し用に残置 — 削除しない）。戻り値は HTML エスケープ済み。 */
function _renderQuoteViaEngine(p, endIdx, words) {
    const PR = window.App?.PhraseRenderer;
    if (!PR) return renderPhraseJP(p, endIdx, words);
    const q = PR.renderQuote(p, endIdx, words, i => _phraseResolveWord(words, i));
    return q ? _escH(q) : '';
}

/* ── PhraseRenderer v0.1: 前置詞句（PP）の日本語化 ──────────────────
   PP のみ語順を組み替え「modifier + head + 前置詞訳」で自然な日本語を生成。
   その他の句種はトークンの w.japanese → w.text を連結する（フォールバック）。 */
const _PP_TRANS_JP = {
    'ἐν':  ()  => 'の中で',
    'εἰς': ()  => 'へ',
    'ἐκ':  ()  => 'から',
    'ἀπό': ()  => 'から',
    'διά': (c) => c === 'genitive' ? 'によって' : 'を通して',
    'μετά':(c) => c === 'genitive' ? 'とともに' : 'の後で',
    'κατά':()  => 'に従って',
};

function _buildPhraseContext(p, end, words) {
    const jaOf   = w => _escH((w && (w.japanese || w.text)) || '');
    const tokens = words.slice(p.start, end + 1);

    let prep      = null;
    let head      = null;
    const modifiers = [];

    if (p.type === 'PP') {
        const prepWord  = words[p.start];
        const prepLemma = (prepWord && prepWord.lemma) || (prepWord && prepWord.text) || '';
        if (prepWord) prep = { lemma: prepLemma, ja: jaOf(prepWord) };

        const headIdx  = (p.head != null && p.head <= end) ? p.head : end;
        const headWord = words[headIdx];
        if (headWord) head = { ja: jaOf(headWord) };

        for (let k = p.start + 1; k < headIdx; k++) {
            const t = jaOf(words[k]);
            if (t) modifiers.push({ ja: t });
        }
    } else if (p.type === 'NP' || p.type === 'PtcP') {
        // NP : head = 最後の N（p.head）、modifiers = 先行する T/A
        // PtcP: head = 分詞（p.end）、  modifiers = 先行冠詞（あれば）
        const headIdx  = (p.head != null && p.head <= end) ? p.head : end;
        const headWord = words[headIdx];
        if (headWord) head = { ja: jaOf(headWord) };

        for (let k = p.start; k < headIdx; k++) {
            const t = jaOf(words[k]);
            if (t) modifiers.push({ ja: t });
        }
    }

    return { type: p.type, tokens, prep, head, modifiers,
             start: p.start, end, case: p.case || '' };
}

function _renderDefault(ctx) {
    return ctx.tokens
        .map(w => _escH((w && (w.japanese || w.text)) || ''))
        .filter(Boolean).join('');
}

function _renderPP(ctx) {
    const modJa    = ctx.modifiers.map(m => m.ja).join('');
    const headJa   = ctx.head ? ctx.head.ja : '';
    const suffixFn = ctx.prep ? _PP_TRANS_JP[ctx.prep.lemma] : null;
    const suffix   = suffixFn ? suffixFn(ctx.case) : (ctx.prep ? ctx.prep.ja : '');
    return modJa + headJa + suffix;
}

function _renderNP(ctx) {
    const modJa  = ctx.modifiers.map(m => m.ja).filter(Boolean).join('');
    const headJa = ctx.head ? ctx.head.ja : '';
    return modJa + headJa;
}

function _renderParticipial(ctx) {
    const modJa  = ctx.modifiers.map(m => m.ja).filter(Boolean).join('');
    const headJa = ctx.head ? ctx.head.ja : '';
    return modJa + headJa;
}

const _PHRASE_RENDERERS = {
    PP:   _renderPP,
    NP:   _renderNP,
    PtcP: _renderParticipial,
};

function renderPhraseJP(p, end, words) {
    const ctx    = _buildPhraseContext(p, end, words);
    const render = _PHRASE_RENDERERS[ctx.type] || _renderDefault;
    return render(ctx);
}

function _phraseReadingSentence(kind, quoted) {
    switch (kind) {
        case 'PP':   return `「${quoted}」は、ひとつづきのまとまりです。`;
        case 'PtcP': return `「${quoted}」は、ここまでをまとめて読むと意味がつながります。`;
        default:     return `「${quoted}」は、ここまでで一つの内容です。`;
    }
}

/* 意味層の選択（1句1現象の原則・docs/phrase-reading.md Phase E）:
   対象語の categories から「phrase scope × phrase_reading の priority ×
   confidence ≥ min_confidence × intent 定義済み」の現象を探し、
   priority（phrase_reading.priorities の並び順）→ confidence で
   ただ1つの Intent を選ぶ。該当なしは空配列（静寂）。 */
function _phraseIntentLines(proj, idx) {
    const w = proj && proj.words ? proj.words[idx] : null;
    if (!w || !w.categories) return [];
    const policy = _wallacePipeline?.policy;
    const rule   = policy?.rules?.phrase_reading;
    if (!policy || !rule) return [];
    const minConf = policy.rules?.min_confidence ?? 0.40;
    const prios   = rule.priorities || [];
    let best = null;
    for (const c of Object.values(w.categories)) {
        if (!c || c.confidence < minConf) continue;
        const ph = policy.byId[c.id];
        if (!ph || !ph.intent || !_PHRASE_INTENT_TEXT[ph.intent]) continue;
        if (!_policyScopes(ph).includes('phrase')) continue;
        const rank = prios.indexOf(ph.priority);
        if (rank < 0) continue;
        if (!best || rank < best.rank ||
            (rank === best.rank && c.confidence > best.confidence)) {
            best = { rank, confidence: c.confidence, intent: ph.intent };
        }
    }
    return best ? _PHRASE_INTENT_TEXT[best.intent].slice(0, 2) : [];
}

/* ── v1.2 対象語引用型（docs/phrase-reading.md Phase H → v1.2）──────────
   構造層（NP/PP/PtcP）の引用が成立しない語でも、意味層候補があれば
   対象語を引用して案内する。構造層が検出しない不定詞句・無冠詞の
   副詞的分詞句（属格絶対・迂言法・目的/結果不定詞・理由/条件/譲歩分詞）が
   これで表示に入る。文言は文テーブル（正典）から変えず、1文目の
   「このまとまりは、」を「「◯◯」のまとまりは、」に置き換えるだけ。 */
const _PHRASE_INTENT_LEAD = 'このまとまりは、';
function _phraseIntentStandaloneHTML(words, idx, proj) {
    try {
        const intentLines = _phraseIntentLines(proj, idx);
        if (intentLines.length === 0) return null;
        /* Stage A: 対象語引用も Engine 出力ベース（単語の擬似句として整形） */
        const quoted = _renderQuoteViaEngine({ type: '', start: idx, end: idx }, idx, words);
        if (!quoted) return null;
        const first = intentLines[0].startsWith(_PHRASE_INTENT_LEAD)
            ? `「${quoted}」のまとまりは、` + intentLines[0].slice(_PHRASE_INTENT_LEAD.length)
            : intentLines[0];
        const shown = [first, ...intentLines.slice(1)];
        return `<div class="rn-prose reading-block">${
            shown.map(l => `<p class="rn-prose-text reading-prose">${l}</p>`).join('')
        }</div>`;
    } catch (_) {
        return null;   // Failure Mode: 静寂
    }
}

/* 引用品質ガード（Phase 26 編集）: 句検出は句読点・格の変わり目を跨ぐことが
   あるため、引用時にのみ範囲を安全側へ縮める（判定・Projection は不変）。
   1) 途中に句読点（. · ; ,）があればそこまで
   2) 途中で格が変わったら（『〜の』のかたちは透過）その手前まで
   3) 中心語のあとに、冠詞を伴わない普通名詞が続いたらその手前まで
      （Σίμων Πέτρος のような呼び名の並びは残す） */
function _trimPhraseEnd(words, p) {
    let end = p.end;
    for (let k = p.start; k < end; k++) {
        if (/[.\u00b7;,\u037e]/.test(String(words[k]?.after ?? ''))) { end = k; break; }
    }
    if (p.type === 'NP') {
        let baseCase = null, baseNum = null, nounSeen = false;
        for (let k = p.start; k <= end; k++) {
            const w = words[k] || {};
            const c = w.case || '';
            if (!c) continue;
            if (c === 'genitive' && baseCase && baseCase !== 'genitive') continue;
            if (baseCase === null) { baseCase = c; baseNum = w.number || ''; }
            else if (c !== baseCase || (w.number || '') !== baseNum) { end = k - 1; break; }
            if (w.class === 'noun') {
                if (nounSeen) {
                    const prevIsArt = (words[k - 1] || {}).class === 'det';
                    const isProper = /^[\u0391-\u03a9\u1f08-\u1fbc]/.test(String(w.lemma ?? w.text ?? ''));
                    if (!prevIsArt && !isProper) { end = k - 1; break; }
                }
                nounSeen = true;
            }
        }
    }
    return end;
}

        // frame: 上段述語 → 下段項の「短い縦エルボ」。同段(例: 述語↔主語)は配置で表すため線を引かない。
        // 述語ごとに trunk＋bus＋drop でまとめる（矢頭 ▾ は項側の列上端）。
        const groups = {};
        frameEdges.forEach(e => {
            const pr = rects[e.a], ar = rects[e.b];
            if (!pr || !ar || pr.row === ar.row) return;   // 同段はスキップ（主語は配置で表現）
            (groups[e.a] = groups[e.a] || []).push(e.b);

        Object.keys(groups).forEach(pi => {
            const pr = rects[pi]; const args = groups[pi].map(i => rects[i]).filter(Boolean);
            if (!pr || !args.length) return;

            out += `<path d="M ${pr.cx} ${pr.bottom} L ${pr.cx} ${busY}" class="sf-arc-frame-path"/>`;   // trunk
            args.forEach(a => {
                out += `<path d="M ${pr.cx} ${busY} L ${a.cx} ${busY} L ${a.cx} ${a.colTop}" class="sf-arc-frame-path"/>`;  // bus + drop
                out += `<path d="M ${a.cx} ${a.colTop} l -4 -6 l 8 0 z" class="sf-arw"/>`;                 // ▾ target
            });

        refEdges.forEach((e, li) => {
            const sr = rects[e.a], tr = rects[e.b]; if (!sr || !tr) return;
            const y0 = Math.min(sr.colTop, tr.colTop) - 3;
            const depth = 8 + li * 6;
            const midx = (sr.cx + tr.cx) / 2;
            out += `<path d="M ${sr.cx} ${y0} Q ${midx} ${y0 - depth} ${tr.cx} ${y0}" class="sf-arc-ref-path"/>`;

async function _buildPhraseReadingHTML(words, idx) {
    const proj = await _getReadingSupportProjection(words);
    if (!proj) return null;

    /* 対象語を含む 2 語以上・上限以内の まとまり（NP / PP / PtcP のみ。
       『〜の』の連なりは単独では出さず、下の関係文にのみ使う） */
    const containing = (proj.phrases ?? []).filter(p =>
        p && (p.end - p.start) >= 1 && (p.end - p.start) < _PHRASE_READING_MAX_SPAN &&
        idx >= p.start && idx <= p.end &&
        (p.type in _PHRASE_READING_PRIORITY));
    if (containing.length === 0) return _phraseIntentStandaloneHTML(words, idx, proj);
    containing.sort((a, b) =>
        (_PHRASE_READING_PRIORITY[a.type] ?? 9) - (_PHRASE_READING_PRIORITY[b.type] ?? 9) ||
        (a.end - a.start) - (b.end - b.start));

    /* Stage A: 『〜の』関係文の引用も Engine 出力ベース（GenP は並べ替えなし・
       句末の「の」は保持 — docs/phrase-rendering.md §2-5） */
    const quoteOf = (s, e) => _renderQuoteViaEngine({ type: 'GenP', start: s, end: e }, e, words);

    const seen = new Set();
    const lines = [];
    for (const p of containing) {
        const key = `${p.start}-${p.end}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const trimmedEnd = _trimPhraseEnd(words, p);
        if (trimmedEnd - p.start < 1 || idx > trimmedEnd) continue;   // 縮めて成立しなければ沈黙
        /* Stage A: Engine 出力ベースの引用（旧 renderPhraseJP は残置・fallback） */
        const quoted = _renderQuoteViaEngine(p, trimmedEnd, words);
        if (!quoted) continue;
        lines.push(_phraseReadingSentence(p.type, quoted));

        /* 『〜の』の関係文: まとまり の中心となる語の後に『〜の』の連なりが
           続く場合のみ、「どれがどれを説明しているか」を一文で示す */
        if (p.type === 'NP') {
            let headIdx = -1;
            for (let k = p.start; k <= trimmedEnd; k++) {
                if (words[k]?.class === 'noun' && words[k]?.case !== 'genitive') {
                    headIdx = k; break;

            const inner = (proj.genitivePhrases ?? []).find(g =>
                headIdx >= 0 && g.start > headIdx && g.end <= trimmedEnd);
            if (inner && headIdx >= 0) {
                const genQ = quoteOf(inner.start, inner.end);
                const headW = _escH(words[headIdx]?.japanese || words[headIdx]?.text || '');
                if (genQ && headW) lines.push(`「${genQ}」が「${headW}」を説明しています。`);
            }
        }
        if (lines.length >= 2) break;
    }
    if (lines.length === 0) return _phraseIntentStandaloneHTML(words, idx, proj);

    /* 意味層（v1.1・docs/phrase-reading.md Phase E）: 最大2文（役割＋読むコツ）。
       構造層が成立した語では構造層第1文＋意味層2文（最大3文）。
       構造層が沈黙した語は上の対象語引用型（v1.2）が担当する。
       意味層該当なしは従来表示のまま。 */
    let shown = lines.slice(0, 2);

        const intentLines = _phraseIntentLines(proj, idx);
        if (intentLines.length > 0) shown = [lines[0], ...intentLines];
    } catch (_) { /* 意味層の失敗は静寂（構造層はそのまま） */ }

    return `<div class="rn-prose reading-block">${
        shown.map(l => `<p class="rn-prose-text reading-prose">${l}</p>`).join('')
    }</div>`;
}

/* multiple スコープ現象の単語役割文（Phase 1: negative_emphasis のみ）。

async function _buildObservationHTML(words, idx, existingTexts) {
    const proj = await _getReadingSupportProjection(words);
    const w = proj && proj.words ? proj.words[idx] : null;
    if (!w || !w.categories) return null;

    /* 指させる語か: 節 → 打ち消し・対 → 接続 → 動詞 → 談話 → 主格の順で判定を探す。
       （discourse は挿入句、nominative は懸垂主格の役割文のためにのみ走査 —
       これらのカテゴリで文を持つのは _WORD_ROLE_TEXT の現象だけ）
       表示可否は Reading Policy（正規化スコープに word を含む × priority ≥ normal ×
       confidence ≥ min_confidence）が決める。verse 専用スコープの現象は
       Passage Note が担当するためここでは出さない（二重表示の禁止）。
       multiple（verse+word）の現象は _WORD_ROLE_TEXT の役割文を優先する。 */
    const _obPolicy  = _wallacePipeline?.policy;
    const _obRule    = _obPolicy?.rules?.observation || {};
    const _obMinConf = _obPolicy?.rules?.min_confidence ?? 0.40;
    const _obAllowed = (id) => {
        const ph = _obPolicy?.byId?.[id];
        if (!ph) return true;   // ポリシー未定義IDは従来どおり（保守的に許可）
        const scopes = _policyScopes(ph);
        return (_obRule.scopes || []).some(s => scopes.includes(s)) &&
               (_obRule.priorities || []).includes(ph.priority);
    };
    let make = null;
    let evidenceLine = null;
    for (const cat of ['clause', 'particle', 'conjunction', 'verb', 'infinitive', 'discourse', 'nominative']) {
        const c = w.categories[cat];
        if (!c || c.confidence < _obMinConf || !_obAllowed(c.id)) continue;

        /* matched signals は ReadingFormatter に渡し、実際の根拠と判断基準を
           一文に変換する。ID・信頼度・生シグナルは画面へ出さない。 */
        const evidence = _wallacePipeline?.rf?.formatEvidence({
            id: c.id,
            signals: c.signals || [],
        });
        if (evidence) {
            evidenceLine = evidence;
            break;
        }

        const ph = _obPolicy?.byId?.[c.id];
        if (ph && _WORD_ROLE_TEXT[ph.phenomenon]) {
            make = () => _WORD_ROLE_TEXT[ph.phenomenon](words[idx]);
            break;
        }
        if (_OBSERVATION_SENTENCES[c.id]) {
            make = _OBSERVATION_SENTENCES[c.id];
            break;
        }
    }
    if (!make && !evidenceLine) return null;

    let line = evidenceLine;
    if (!line) {
        /* Stage A: Observation の対象語引用も Engine 出力ベース */
        const quoted = _renderQuoteViaEngine({ type: '', start: idx, end: idx }, idx, words);
        if (!quoted) return null;
        line = make(quoted);
    }

    /* 重複禁止: 既に出ている文（この節の読書メモ・かたまり）と同内容なら沈黙 */
    if ((existingTexts || []).some(t => t && String(t).includes(line))) return null;
    /* 言い換え禁止（Phase 26 編集）: 節の読書メモが同じことを別の言い方で
       述べている場合も沈黙する（役割の重複を避ける） */
    const rnText = String((existingTexts || [])[0] ?? '');
    const OVERLAP = [
        [/なぜ成立|理由/, /理由/],
        [/対比|転換/, /向きが変わ|次へ進み/],
        [/内容が具体的/, /中身/],
        [/目的として何が/, /目的が始まり/],
    ];
    if (rnText && OVERLAP.some(([rn, ob]) => rn.test(rnText) && ob.test(line))) return null;

    return `<div class="rn-prose reading-block"><p class="rn-prose-text reading-prose">${line}</p></div>`;
}
