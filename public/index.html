/* タップの応答（hover / active / :active）は箱型チップと同じ色で残す。
   詳細度で基本ルール（.wlv-chip の各状態）に勝たせる。保存ハイライト
   （#app .wlv-chip.hl-word-*）とは同詳細度で、後置のハイライト側が勝つ。 */
#app .wlv-chip.gk-word:hover { background: var(--accent-light); }
#app .wlv-chip.gk-word.active { background: var(--accent-light); }
#app .wlv-chip.gk-word:active { background: var(--accent-mid); }

/* ── 静的ページ共通（まめ知識 / 出典・ポリシー） ── */
.static-page {
    max-width: 44em;
    margin: 0 auto;
    padding: 32px 52px 60px;
    font-size: var(--text-body);
    line-height: 1.8;
    color: var(--text-main);
}
/* ブックマーク/メモ/履歴系の一覧ページ用モディファイア。
   .static-page は #bible-text-area（single-mode時にmax-width:44em + 左右padding:24pxで
   聖書本文と同じ幅に揃えられている）の内側に差し込まれるため、ここで独自にmax-width/左右paddingを
   持たせると親の幅とズレる。横方向は完全に親に委ねることで聖書本文と同一幅にする。 */
.static-page.list-page {
    max-width: none;
    margin: 0;
    padding: 32px 0 60px;
}
/* ブックマーク/メモ/最近読んだ箇所/最近見た単語、4ページ共通のカードUI。
   タイトル(1行目)・補足情報(2行目)・右側メタ情報、という構造を共通クラスとして統一する。
   ページごとの違いは _listItemCard() に渡すデータ（title/sub/meta/href）だけに閉じる。 */
/* 枠線・背景boxではなく、左の細いインジケータのみで区切る（ボックス感を出さない）。
   アクション(削除等)はhoverまたはキーボードフォーカス時のみ表示する。 */
.list-item-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--rhythm-medium-x);
    padding: var(--rhythm-medium-y) var(--rhythm-medium-x);
    margin-bottom: var(--rhythm-medium-y);
    background: none;
    border: none;
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast);
}
.list-item-card:hover, .list-item-card:focus-within { background: var(--highlight-light); border-left-color: var(--highlight); }
.list-item-card[tabindex="0"]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
}
.list-item-main { min-width: 0; flex: 1; }
.list-item-title {
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.list-item-sub {
    margin-top: var(--space-xs);
    font-size: var(--text-caption);
    line-height: 1.5;
    color: var(--text-sub);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.list-item-meta {
    flex-shrink: 0;
    font-size: var(--text-caption);
    color: var(--text-sub);
    white-space: nowrap;
}
.list-item-empty { color: var(--text-sub); font-size: var(--text-body); }
.list-item-actions {
    flex-shrink: 0;
    display: flex;
    gap: var(--rhythm-micro);
    opacity: 0;
    transition: opacity var(--transition-fast);
}
.list-item-card:hover .list-item-actions,
.list-item-card:focus-within .list-item-actions { opacity: var(--opacity-primary); }
.list-item-action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    color: var(--text-sub);
    background: none;
    border: none;
    border-radius: var(--radius-s);
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
}
.list-item-action-btn svg { width: 16px; height: 16px; }
.list-item-action-btn:hover { background: rgba(0,0,0,0.06); color: var(--text-main); }
.list-item-action-btn.danger:hover { color: #c0392b; }
/* タッチ端末では hover がないため、項目操作を常時表示しタップ領域を確保する。 */
@media (pointer: coarse) {
    .list-item-actions { opacity: var(--opacity-primary); }
    .list-item-action-btn { width: 44px; height: 44px; }
}

/* ── Highlight V1 ──────────────────────────────────────────── */
/* Verse-level highlight: left border on verse-block */
.verse-block.hl-verse-yellow { border-left: 3px solid rgba(252,204,0,0.65); }
.verse-block.hl-verse-blue   { border-left: 3px solid rgba(0,76,151,0.65); }
.verse-block.hl-verse-green  { border-left: 3px solid rgba(21,114,44,0.65); }
.verse-block.hl-verse-red    { border-left: 3px solid rgba(235,97,0,0.65); }

/* Word/phrase chip highlight */
.wlv-chip.wlv-chip-cont { padding-left: 0; padding-right: 0; }
/* RF-3: !important を外し、詳細度で勝たせる。競合相手は .wlv-chip:hover /
   .active / :active（各 0,2,0 で本ルールより後方に定義）と、比較ポリッシュ側
   @media の #mobile-verse-area 等 .wlv-chip.active（1,2,0）。全チップが #app
   配下にあることを確認のうえ (1,3,0) とした（クラス名の繰り返しは詳細度調整
   のための記法で、マッチ対象は変わらない）。 */
#app .wlv-chip.hl-word-yellow.hl-word-yellow { background: rgba(252,204,0,0.28); border-radius: 3px; }
/* 口語訳アラインメント: 対応づいた訳文区間（タップ可能な語句） */
.ja-seg { cursor: pointer; border-radius: 3px; }
.ja-seg:active { background: var(--accent-mid); }
.ja-seg.hl-word-yellow { background: rgba(252,204,0,0.28); }
.ja-seg.hl-word-blue   { background: rgba(0,76,151,0.25); }
.ja-seg.hl-word-green  { background: rgba(21,114,44,0.25); }
.ja-seg.hl-word-red    { background: rgba(235,97,0,0.25); }
.ja-seg.hl-multi-selected, .ja-seg.hl-touch-selected { outline: 2px solid var(--accent); outline-offset: 2px; background: rgba(21,114,44,.13); }
/* RF-3: 詳細度調整の理由は hl-word-yellow 側のコメント参照 */
#app .wlv-chip.hl-word-blue.hl-word-blue     { background: rgba(0,76,151,0.25); border-radius: 3px; }
#app .wlv-chip.hl-word-green.hl-word-green   { background: rgba(21,114,44,0.25); border-radius: 3px; }
#app .wlv-chip.hl-word-red.hl-word-red       { background: rgba(235,97,0,0.25); border-radius: 3px; }

/* Range selection mode: start chip indicator */
/* 長押しでハイライトする際、iOS標準の選択メニュー（コピー／選択部分を検索／
   調べる／翻訳）はアプリ側のカラーピッカーと重なって煩いだけなので、本文エリア
   では出さない。テキスト選択と青いハンドル（範囲調整）はそのまま使える。 */
#bible-text-area, #parallel-text-area { -webkit-touch-callout: none; }
/* ── 下部カードの共通様式（ピーク／色ピッカー／操作バー／選択バー） ──
   画面下部に出る面は、ピークを基準に同じ様式へそろえる：背景 --bg-paper、
   枠 1px --border-soft、角丸 --radius-m、影 --shadow-card（Design System の
   shadow-panel と同値のアプリトークン）。モバイル（≤900px）では左右
   --space-md インセットの全幅、下端 calc(safe-area + --space-md)。
   出現は Design System の Motion 規範（Popover／Sheet はフェード
   200–260ms ease-out、装飾モーションなし）に従い、共通のフェードで統一する。 */
@keyframes bottomCardIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
    /* RF-5: !important を除去し、クラスを重ねて詳細度を上げる。競合する
       animation 定義（.word-peek 本体と各 .hl-open / .hl-show の
       bottomCardIn）が同詳細度で後方定義のため。 */
    .word-peek.word-peek, #hl-color-picker.hl-open.hl-open, #hl-touch-pill.hl-show.hl-show, #hl-selection-bar.hl-open.hl-open { animation: none; }
}
/* Color picker popup */
#hl-color-picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8990;
}
#hl-color-picker-overlay.hl-open { display: block; }
#hl-picker-word {
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 10px;
}
.hl-picker-meaning {
    font-size: 16px; font-weight: 700; color: var(--text-main);
    line-height: 1.45;
    padding-right: 26px; /* 右上の×ボタンと重ならない */
}
.hl-picker-nametag {
    margin-top: 2px;
    display: flex; gap: var(--space-sm); flex-wrap: wrap;
    font-size: var(--text-caption); color: var(--text-sub);
}
#hl-picker-greek {
    font-family: "GFS Didot", "Palatino Linotype", Georgia, serif;
    font-size: 14px; font-weight: 600;
}
#hl-color-picker {
    display: none;
    position: fixed;
    z-index: 8991;
    background: var(--bg-paper);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    padding: var(--space-md);
    flex-direction: column;
    gap: 10px;
    min-width: 200px;
}
#hl-color-picker.hl-open { display: flex; animation: bottomCardIn .22s ease-out; }
/* 色と「範囲指定」は上下に積まず、1行に横並びにする（色＝主役を左、
   範囲指定＝モード切替を右端）。範囲指定が隠れる状態では色だけが左に残る。 */
.hl-picker-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hl-picker-row { display: flex; gap: 8px; align-items: center; }
.hl-picker-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
}
.hl-picker-swatch:hover,
.hl-picker-swatch.hl-selected { transform: scale(1.18); border-color: var(--text-sub); }
.hl-picker-swatch[data-color="yellow"] { background: #fccc00; }
.hl-picker-swatch[data-color="blue"]   { background: #004c97; }
.hl-picker-swatch[data-color="green"]  { background: #15722c; }
.hl-picker-swatch[data-color="red"]    { background: #eb6100; }
/* 削除は色見本の並びに置く「色なし＋バツ」の丸ボタン（文言ボタンは廃止）。
   表示/非表示は従来どおり _hlOpenPicker が style.display で切り替える。 */
.hl-picker-delete {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--text-hint);
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
}
.hl-picker-delete svg { width: 13px; height: 13px; display: block; }
.hl-picker-delete:hover { transform: scale(1.18); border-color: var(--text-sub); }
/* タッチ選択中に画面下部へ出す操作バー（ハイライト／範囲指定）。
   以前は黒いピル型だったが、下部カードの共通様式（ピーク基準）に統一し、
   ボタンもピークの2ボタン（主＝--highlight-light 塗り、副＝枠線、角 --radius-s）
   と同系統にした（Design System は pill 半径を Segmented Control に限定）。
   ピッカーのオーバーレイ（z-index 8990）より下に置き、開いたら隠れる。 */
#hl-touch-pill {
    display: none;
    position: fixed;
    left: 50%;
    bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 8989;
    align-items: stretch;
    gap: var(--space-sm);
    padding: var(--space-sm);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    background: var(--bg-paper);
    box-shadow: var(--shadow-card);
    -webkit-tap-highlight-color: transparent;
}
#hl-touch-pill.hl-show { display: flex; animation: bottomCardIn .22s ease-out; }
.hl-pill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: var(--space-sm) var(--space-md);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-s);
    background: transparent;
    color: var(--text-main);
    font: inherit;
    font-size: var(--text-body);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}
/* 主ボタン（ハイライト）はピークの「詳しく見る」と同じ塗り様式 */
#hl-pill-btn-color { background: var(--highlight-light); color: var(--highlight); border-color: transparent; }
.hl-pill-btn svg { width: 1.05em; height: 1.05em; display: block; }
@media (max-width: 900px) {
    /* モバイルではピークと同じ全幅インセット（FAB は幾何学的に背後へ隠れる） */
    #hl-touch-pill { left: var(--space-md); right: var(--space-md); transform: none; }
    .hl-pill-btn { flex: 1; }
}
.hl-picker-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hl-picker-action { border: 1px solid var(--border-soft); border-radius: var(--radius-s); background: transparent; color: var(--text-main); padding: var(--space-sm) var(--space-md); font: inherit; font-size: var(--text-caption); cursor: pointer; white-space: nowrap; }
.hl-picker-action:hover { border-color: var(--accent-mid); }
/* 選択バーも下部カードの共通様式（背景・角丸・影・余白）にそろえる。 */
#hl-selection-bar { display: none; position: fixed; z-index: 8992; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); align-items: center; gap: 10px; max-width: calc(100vw - 24px); padding: var(--space-sm); border: 1px solid var(--border-soft); border-radius: var(--radius-m); background: var(--bg-paper); box-shadow: var(--shadow-card); color: var(--text-main); font-size: var(--text-caption); }
#hl-selection-bar.hl-open { display: flex; animation: bottomCardIn .22s ease-out; }
#hl-selection-count { white-space: nowrap; }
.hl-selection-bar-btn { border: 1px solid var(--border-soft); border-radius: var(--radius-s); background: transparent; color: var(--text-main); padding: var(--space-sm) var(--space-md); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.hl-selection-bar-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
@media (max-width: 900px) {
    /* モバイルではピークと同じ全幅インセット＋下端にそろえる */
    #hl-selection-bar { left: var(--space-md); right: var(--space-md); bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px)); transform: none; max-width: none; }
    #hl-selection-count { flex: 1; }
}
.wlv-chip.hl-multi-selected { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; background: rgba(21,114,44,.13); }

/* Highlight list page: color filter tabs */
.hl-filter-tabs {
    display: flex;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
    flex-wrap: wrap;
}
.hl-filter-tab {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-soft);
    background: none;
    font-size: var(--text-caption);
    color: var(--text-sub);
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--transition-fast), border-color var(--transition-fast);
}
.hl-filter-tab:hover { background: var(--accent-light); }
@media (pointer: coarse) {
    .hl-filter-tab { min-height: 44px; padding: var(--space-sm) var(--space-md); }
}
.hl-filter-tab.hl-tab-active {
    background: var(--accent-light);
    border-color: var(--highlight);
    color: var(--text-main);
}
.hl-tab-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}

/* Highlight list item: color swatch dot */
.hl-list-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
    flex-shrink: 0;
}
.hl-list-dot[data-color="yellow"] { background: #fccc00; }
.hl-list-dot[data-color="blue"]   { background: #004c97; }
.hl-list-dot[data-color="green"]  { background: #15722c; }
.hl-list-dot[data-color="red"]    { background: #eb6100; }

/* ── Highlight & Recent list: verse text preview ────────────── */
.list-item-preview {
    margin-top: var(--space-sm);
    font-size: var(--text-body-lg);
    line-height: 1.75;
    color: var(--text-main);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.list-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
}
.list-page-header-link {
    font-size: var(--text-caption);
    color: var(--highlight);
    cursor: pointer;
    opacity: var(--opacity-secondary);
    transition: opacity var(--transition-fast);
}
.list-page-header-link:hover { opacity: var(--opacity-primary); }
.static-page h3 {
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--text-main);
    margin: var(--space-lg) 0 var(--space-sm);
    padding-bottom: var(--space-xs);
    border-bottom: 1px solid var(--border-soft);
    letter-spacing: 0.02em;
}
.static-page section { margin-bottom: 40px; }
/* 一覧ページは各セクション固有の余白（続きを読む・履歴グループ）を優先する。 */
.static-page.list-page section { margin-bottom: 0; }
.static-page p { color: var(--text-sub); margin: var(--space-sm) 0; }
/* Changelog: 各リリースの「なぜ変えたか」を表す1行。区切り線は使わず余白のみで区切る。 */
.static-page p.changelog-story { font-size: var(--text-caption); }
/* Roadmap: イントロ文 */
.static-page p.roadmap-intro { color: var(--text-sub); margin-bottom: var(--space-lg); }
/* Roadmap: 各項目カード */
.static-page .roadmap-item {
    padding: var(--space-sm) 0;
    border-bottom: 1px solid var(--border-light, rgba(0,0,0,.06));
}
.static-page .roadmap-item:last-child { border-bottom: none; }
.static-page .roadmap-item-title { color: var(--text-main); font-size: var(--text-body); margin-bottom: 2px; }
.static-page .roadmap-item-detail { color: var(--text-sub); font-size: var(--text-caption); line-height: 1.6; }
.static-page ul { padding-left: var(--space-md); color: var(--text-sub); }
.static-page li { margin-bottom: var(--space-sm); }
.static-page strong { color: var(--text-main); }
.static-page aside {
    background: var(--highlight-light);
    border-left: 3px solid var(--highlight);
    border-radius: 0 var(--radius-s) var(--radius-s) 0;
    padding: var(--space-md) var(--space-md);
    margin-bottom: var(--space-md);
    color: var(--text-sub);
}
.static-page table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-body);
}
.static-page table th {
    text-align: left;
    padding: var(--space-sm) var(--space-sm);
    width: 30%;
    color: var(--text-sub);
    font-weight: 600;
    border-bottom: 1px solid var(--border-soft);
}
.static-page table td {
    padding: var(--space-sm) var(--space-sm);
    border-bottom: 1px solid var(--border-soft);
}
.static-page table tr:last-child th,
.static-page table tr:last-child td { border-bottom: none; }
.static-page .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    padding: var(--space-md) var(--space-md);
    margin-top: var(--space-sm);
}
.static-page .aspect-row {
    display: flex;
    align-items: baseline;
    gap: var(--space-md);
    padding: var(--space-sm) 0;
    border-bottom: 1px solid var(--border-soft);
}
.static-page .aspect-row:last-child { border-bottom: none; }
.static-page .aspect-label {
    flex-shrink: 0;
    min-width: 130px;
    font-weight: 700;
}
.static-page .aspect-desc { color: var(--text-sub); }
.static-page .aspect-read {
    display: block;
    margin-top: var(--space-xs);
    color: var(--highlight);
    font-size: var(--text-body);
}
.static-page .back-wrap {
    text-align: center;
    margin-top: 40px;
    padding-bottom: var(--space-md);
}
.static-page .back-btn {
    background: var(--highlight);
    color: white;
    border: none;
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-s);
    cursor: pointer;
    font-weight: bold;
    font-size: var(--text-body);
    font-family: inherit;
    transition: opacity var(--transition-base);
}
.static-page .back-btn:hover { opacity: var(--opacity-primary); }
/* list-page（ハイライト・最近読んだ）の back-btn は本文プレビューを主役にするため
   緑の塗りつぶしを外し、薄い枠線＋控えめな文字色に止める。
   他の静的ページ（まめ知識・ロードマップ等）は変更しない。 */
.static-page.list-page .back-btn {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border);
    font-weight: normal;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
}
.static-page.list-page .back-btn:hover {
    background: var(--hover-veil);
    color: var(--text);
    opacity: 1;
    border-color: var(--border-strong);
}
.static-page.list-page .back-btn:active {
    background: var(--accent-light);
    opacity: 1;
}
/* タブ（まめ知識） */
.static-page .tabs {
    display: flex;
    gap: var(--space-xs);
    margin-bottom: var(--space-md);
    border-bottom: 2px solid var(--border-soft);
    position: sticky;
    top: 0;
    background: var(--bg-paper);
    z-index: 100;
    padding-top: var(--space-sm);
    overflow-x: auto;
}
.static-page .tab-btn {
    padding: var(--space-sm) var(--space-md);
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-sub);
    font-weight: 500;
    font-family: inherit;
    font-size: var(--text-body);
    border-bottom: 2px solid transparent;
    transition: color var(--transition-base), border-color var(--transition-base);
    white-space: nowrap;
}
.static-page .tab-btn.active {
    color: var(--highlight);
    border-bottom-color: var(--highlight);
}
.static-page .tab-content { display: none; }
.static-page .tab-content.active { display: block; animation: spFadeIn var(--transition-base); }
@keyframes spFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: var(--opacity-primary); transform: translateY(0); } }
/* ── モバイル（768px以下）静的ページ余白最適化 ── */
@media (max-width: 768px) {
    /* 親コンテナの横 padding をゼロにして静的ページ側で制御 */
    #main-reading-area.static-view #bible-text-area {
        padding-left: 0;
        padding-right: 0;
    }
    /* 静的ページ本体：max-width を解除し、左右 14px 余白のみ */
    .static-page {
        max-width: none;
        padding-left: 14px;
        padding-right: 14px;
    }
    /* タブバーを画面幅いっぱいに広げる（sticky 背景も端まで届かせる） */
    .static-page .tabs {
        margin-left: -14px;
        margin-right: -14px;
        padding-left: 14px;
        padding-right: 14px;
    }
    /* Card の余分な左右余白を除去 */
    .static-page .card {
        margin-left: 0;
        margin-right: 0;
    }
}

/* - 語形リスト行（Study panel内の一覧用：既存互換のため残す） -
   箱型カードではなく、下線区切りのみのフラットな行にする（card乱立を避ける）。
   .list-item-card と同じ medium（8px/16px）の行リズムに揃える。 */
.word-card {
background: none;
padding: var(--rhythm-medium-y) var(--rhythm-medium-x);
display: flex;
justify-content: space-between;
align-items: baseline;
margin-bottom: 0;
border: none;
border-bottom: 1px solid var(--border-soft);
cursor: pointer;
transition: background var(--transition-fast);
}
.word-card:last-child { border-bottom: none; }
.word-card:hover { background: var(--highlight-light); }
.greek-word { font-family: var(--font-greek); font-size: var(--text-headline); line-height: 1.3; }

.present-text { border-bottom: 2px solid var(--highlight); }
.aorist-text  { border-bottom: 2px dotted var(--highlight); }
.perfect-text { text-decoration: underline wavy var(--highlight); text-underline-offset: 4px; }
.future-text { border-bottom: 2px double var(--highlight); }
.indicative-text { background: var(--highlight-light); border-radius: var(--radius-s); padding: 0 var(--space-xs); }
.imperative-text { background: var(--highlight-light); border-radius: var(--radius-s); padding: 0 var(--space-xs); }

.grammar-legend { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-sm); font-size: var(--text-caption); color: var(--text-sub); border-top: 1px solid var(--border-soft); padding-top: var(--space-xs); }
.tag-jp { color: var(--text-sub); font-size: var(--text-caption); margin-left: var(--space-xs); opacity: var(--opacity-secondary); }
.strong-num { font-size: var(--text-caption); color: #9e9ea4; font-family: monospace; }

.rn-save-btn {
display: flex; align-items: center; width: 100%;
padding: var(--space-sm) var(--space-md);
font-size: var(--text-caption); font-family: inherit; font-weight: 700;
color: #fff; background: var(--highlight);
border: none; border-radius: var(--radius-s);
cursor: pointer; letter-spacing: 0.02em;
transition: opacity var(--transition-fast);
}
.rn-save-btn:hover { opacity: var(--opacity-primary); }


/* -- morph-search-btn（近くの語を見るなど、Study panel内で継続使用） -- */
.morph-search-btn {
display: inline-flex;
align-items: center;
justify-content: center;
padding: var(--space-xs) var(--space-md);
font-size: var(--text-caption);
font-family: inherit;
font-weight: 600;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--text-sub);
background: transparent;
border: 1px solid rgba(0,0,0,0.13);
border-radius: var(--radius-s);
cursor: pointer;
transition: color var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
text-decoration: none;
white-space: nowrap;
}
.morph-search-btn:hover {
color: var(--highlight);
border-color: var(--highlight);
background: var(--highlight-light);
}
.morph-search-btn:active { opacity: var(--opacity-secondary); }
.morph-search-btn .btn-icon { display: none; }

.morph-tag-row {
display: flex;
flex-wrap: wrap;
gap: var(--space-xs);
margin: 0 0 var(--space-xs);
}
.morph-tag-pill {
font-size: var(--text-caption);
padding: var(--space-xs) var(--space-sm);
border-radius: var(--radius-l);
background: var(--bg-panel);
color: var(--text-sub);
border: 1px solid var(--border-soft);
letter-spacing: 0.01em;
}
.morph-tag-pill.core {
background: var(--accent-light);
color: var(--highlight);
border-color: var(--accent-mid);
font-weight: 600;
}

.rcb-container {
display: none;
align-items: baseline;
gap: var(--space-sm);
flex-wrap: wrap;
padding: var(--space-sm) var(--space-lg) var(--space-sm);
background: var(--bg-panel);
border-bottom: 1px solid var(--border-soft);
font-size: var(--text-caption);
flex-shrink: 0;
}
.rcb-container.visible { display: flex; }
.rcb-chip-sm {
font-family: var(--font-greek);
font-size: var(--text-body-lg);
color: var(--text-main);
font-weight: 400;
}
.rcb-label-sm {
font-size: var(--text-caption);
color: var(--text-sub);
font-weight: 400;
}
.rcb-sep-sm { color: var(--border-soft); font-size: var(--text-caption); }

.no-greek-badge {
display: inline-block;
font-size: var(--text-caption);
color: var(--text-sub);
background: var(--bg-panel);
border: 1px solid var(--border-soft);
border-radius: var(--radius-s);
padding: var(--space-xs) var(--space-sm);
margin-left: var(--space-sm);
vertical-align: middle;
letter-spacing: 0.04em;
}

@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: var(--opacity-primary); transform: translateY(0); } }

/* Study panel 閉じるボタン（廃止 → depth-history に置き換え済み） */
#study-close-btn {
display: none;
}

/* ══════════════════════════════════════════
   Flow / Meaning / Study タブ 共通スタイル
   ══════════════════════════════════════════ */

.flow-word-head {
    display: flex;
    align-items: baseline;
    gap: 0;
    margin-bottom: var(--space-xs);
    flex-wrap: wrap;
}
.flow-greek {
    font-size: var(--text-headline);
}
.flow-ja {
    font-size: var(--text-caption);
    color: var(--text-sub);
    font-weight: 400;
}
.flow-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-bottom: var(--space-md);
    letter-spacing: 0.02em;
}

/* ── Flow タブ ── */
.flow-ai-area {
    margin-top: var(--space-sm);
    margin-bottom: var(--space-xs);
}
.flow-ai-content {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) var(--space-md);
    background: var(--accent-light);
    border-left: 2px solid var(--accent-mid);
    border-radius: 0 var(--radius-s) var(--radius-s) 0;
    margin-bottom: var(--space-xs);
}
.flow-ai-label {
    display: inline-block;
    font-size: var(--text-caption);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-right: var(--space-xs);
    vertical-align: middle;
}

/* ── Meaning タブ：「どう響くか」層 ── */
/* Abbott-Smith は不在。AIの contextual nuance が主役。静かなプロース。 */
.meaning-strong {
    font-size: var(--text-caption);
    color: #9e9ea4;
    font-family: monospace;
    margin-bottom: var(--space-sm);
}
/* Meaning AI 出力エリア：flow-ai-prose と共通の静かなスタイル */
.meaning-prose {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 0 var(--space-sm);
    border-left: 2px solid var(--accent-light);
    margin-top: var(--space-xs);
}
.meaning-prose-label {
    display: inline-block;
    font-size: var(--text-caption);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-right: var(--space-xs);
    vertical-align: middle;
}

/* ── Semantics セクション（Study内）：quiet scholarly notes ── */
/* dense tables・giant lexicon UI 禁止。折りたたみで必要な時だけ確認する層。 */
.semantics-abbott {
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.8;
    padding: var(--space-sm) 0 var(--space-xs);
}
.semantics-note {
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.75;
    padding: var(--space-xs) 0 var(--space-xs);
    border-top: 1px solid rgba(0,0,0,0.04);
    margin-top: var(--space-xs);
}
.semantics-note-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    display: block;
    margin-bottom: var(--space-xs);
}

/* 種別ごとの細いボーダーは維持しつつ、カード感・行列感を除去 */
.flow-signal {
    padding: 0;
    border-bottom: none;
    border-left: none;
    line-height: 1.85;
}
.flow-signal:last-child { border-bottom: none; }

/* signal種別ボーダー：flow-hints全体の左ボーダーで統合。個別signal行には付けない */
.flow-signal.sig-logic     { }
.flow-signal.sig-emphasis  { }
.flow-signal.sig-turn      { }
.flow-signal.sig-exhort    { }
.flow-signal.sig-promise   { }
.flow-signal.sig-declare   { }
.flow-signal.sig-metaphor  { }
.flow-signal.sig-word      { }
.flow-signal.sig-caution   { }
.flow-signal.sig-culture   { }
.flow-signal.sig-default   { }

/* ══ P2: Structural Diagram (sd-*) ══════════════════════════════════════════════ */
.sd-view {
    padding: var(--space-sm) var(--space-md) var(--space-xl);
    min-width: 0;
    overflow-x: auto;
}
.sd-attribution {
    font-size: 10px;
    color: var(--text-sub);
    margin-bottom: var(--space-xs);
    opacity: 0.7;
}
.sd-hint {
    display: flex;
    align-items: baseline;
    gap: var(--space-sm);
    padding: var(--space-xs) 0 var(--space-md);
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: var(--space-md);
}
.sd-hint-title { font-size: var(--text-body); color: var(--text-main); font-weight: 600; }
.sd-hint-sub   { font-size: var(--text-caption); color: var(--text-sub); }
.sd-empty      { padding: var(--space-lg); color: var(--text-sub); font-size: var(--text-caption); }

.sd-sentence {
    margin-bottom: var(--space-xl);
    padding-left: var(--space-sm);
}
/* 「語の役割で読む」は巨大なSVGが並ぶため、画面外の文の描画を遅らせて
   スクロール時の描画遅れ（空白）を抑える */
.role-reading-view .sd-sentence {
    content-visibility: auto;
    contain-intrinsic-size: auto 800px;
}
.sd-sentence-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    font-weight: 400;
    margin-bottom: var(--space-xs);
    letter-spacing: 0.02em;
}
/* C-9: DG context — verse ref styled like .v-num: unobtrusive, visually separated from DG structure */
.sd-sentence-ref--dg {
    font-weight: 400;
    color: var(--text-hint);
    letter-spacing: 0.02em;
    margin-bottom: var(--space-sm);
    padding-bottom: var(--space-xs);
    border-bottom: 1px solid var(--border);
}

/* Internal nodes */
.sd-node {
    display: block;
    margin: 2px 0;
    padding-left: var(--space-md);
    border-left: 1px solid var(--border-soft);
}
.sd-node[data-depth="0"] { padding-left: 0; border-left: none; }
.sd-node-hd {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 24px;
    padding: 2px 0;
}
.sd-node-body { margin-top: 2px; }

/* Foldable nodes — <details> already inherits margin/border from .sd-node,
   so summary must not re-add padding-left (avoids double-indent). */
.sd-foldable { display: block; margin: 2px 0; }
.sd-foldable > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    cursor: pointer;
    list-style: none;
    padding: 2px 0;
}
.sd-foldable > summary::-webkit-details-marker { display: none; }
.sd-foldable > .sd-node-body { /* children already have .sd-node padding */ }
.sd-fold-arrow {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-right: 2px solid var(--text-sub);
    border-bottom: 2px solid var(--text-sub);
    transform: rotate(45deg);
    flex-shrink: 0;
    margin-right: 2px;
}
details[open] > summary .sd-fold-arrow { transform: rotate(-135deg); }

/* Token rows */
.sd-token-row {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 3px var(--space-xs);
    margin: 2px 0;
    background: var(--bg-card);
    border-radius: 4px;
    border: 1px solid var(--border-soft);
    max-width: 100%;
}

/* FUNCTION labels on nodes and tokens */
.sd-fn-label {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--accent-bg, #e8f0fe);
    color: var(--accent-main, #1a56a0);
    letter-spacing: 0.04em;
    white-space: nowrap;
}
.sd-fn-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    background: var(--accent-bg, #e8f0fe);
    color: var(--accent-main, #1a56a0);
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
}
/* CONSTRUCTION label */
.sd-cn-label {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg-tag, #f0f0f0);
    color: var(--text-sub);
    letter-spacing: 0.03em;
    white-space: nowrap;
}
/* MORPHOLOGY badges */
.sd-morph-badge {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    background: var(--bg-morph, #f5f0e8);
    color: var(--text-sub);
    white-space: nowrap;
    flex-shrink: 0;
}

/* Greek text in tokens */
.sd-greek {
    font-family: var(--font-greek);
    font-size: var(--text-body);
    color: var(--text-main);
    font-weight: 600;
    letter-spacing: 0.01em;
}
/* Japanese gloss in tokens */
.sd-gloss {
    font-size: var(--text-caption);
    color: var(--text-sub);
}

/* Mobile */
@media (max-width: 390px) {
    .sd-view { padding: var(--space-xs) var(--space-sm) var(--space-xl); }
    .sd-hint { flex-direction: column; gap: 2px; }
    .sd-node { padding-left: var(--space-sm); }
    .sd-token-row { gap: 3px; padding: 2px var(--space-xs); }
    .sd-greek { font-size: var(--text-caption); }
}

/* ══════════════════════════════════════════════════════════════════════════════ */

.flow-signal-text {
    font-size: var(--text-body);
}

.flow-hints {
    padding-top: var(--space-md);
    padding-bottom: var(--space-xs);
    margin-bottom: var(--space-sm);
}

.flow-signal-kind {
    display: none;
}

.flow-ai-prose {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 0 var(--space-sm);
    border-left: 2px solid var(--accent-light);
    margin-top: var(--space-sm);
}
.flow-ai-prose-label {
    display: inline-block;
    margin-right: var(--space-xs);
    vertical-align: middle;
}

/* ══════════════════════════════════════════
   Syntax セクション（Study内）
   「論理の骨組み」を静かな読解補助として表示。
   linguistics software感・academic parser感禁止。
   ══════════════════════════════════════════ */

.syntax-reading {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 var(--space-sm) 0;
    margin-bottom: var(--space-xs);
}
.syntax-reading-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    display: block;
    margin-bottom: var(--space-xs);
}


/* Syntax AI補助エリア */
.syntax-ai-prose {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 0 var(--space-sm);
    border-left: 2px solid var(--accent-light);
    margin-top: var(--space-xs);
    margin-bottom: var(--space-xs);
}
.syntax-ai-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-right: var(--space-xs);
    vertical-align: middle;
}
/* セクション間は線ではなくspacingで区切る。
   study-details-body の下端padding(medium) + 本要素のmargin(medium) + 次のstudy-summaryの
   上端padding(medium) を合算して macro（24px）の section間隔になるよう設計する。 */
.study-details {
    border-bottom: none;
    margin-bottom: var(--rhythm-medium-y);
}
.study-details:last-of-type { margin-bottom: 0; }
.study-summary {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-sub);
    padding: var(--rhythm-medium-y) 0;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: flex-start;
    gap: var(--space-xs);
    user-select: none;
    outline: none;
}
.study-summary-inner {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
}
.study-summary-sub {
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    text-transform: uppercase;
}
.morph-grid-expand {
    margin-top: var(--rhythm-medium-y);
    padding-top: var(--rhythm-micro);
    border-top: 1px solid rgba(0,0,0,0.04);
}
.morph-grid-expand-btn {
    background: none;
    border: none;
    font-size: var(--text-caption);
    font-family: inherit;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.02em;
    transition: opacity var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
}
.morph-grid-expand-btn svg { width: 12px; height: 12px; display: block; }
.morph-grid-expand-btn:hover { opacity: var(--opacity-primary); }
.morph-grid-extra {
    display: none;
    margin-top: var(--rhythm-micro);
}
.morph-grid-extra.visible { display: block; }
.study-summary::-webkit-details-marker { display: none; }
.study-summary::before {
    content: '›';
    font-size: var(--text-body);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    transition: transform var(--transition-fast);
    display: inline-block;
    width: 10px;
    margin-top: var(--space-xs);
}
details[open] .study-summary::before {
    transform: rotate(90deg);
}
.study-details-body {
    padding: 0 0 var(--rhythm-medium-y) 0; /* 幅統一: 左インデントなし */
}

/* ══════════════════════════════════════════
   Research Tools - Study タブ内の静かな探索補助
   ══════════════════════════════════════════

   設計思想：
   - Reading Evidence（語形・論理構造・意味論的根拠）の下に配置
   - 初期状態は折りたたみ。「研究ツールを開く」で展開
   - card乱立禁止・dense search UI禁止・analytics感禁止
   - filter controls は compact・expandable
   - 読書空間を壊さない quiet な外観を維持
   ══════════════════════════════════════════ */

/* Research Tools 全体ラッパー。Reading Evidenceからの「思考の切り替え」なので macro 間隔を置く。 */
.rt-section {
    margin-top: var(--rhythm-macro-min);
    border-top: 1px solid rgba(0,0,0,0.06);
    padding-top: var(--rhythm-medium-y);
}
.rt-open-btn {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    width: 100%;
    background: none;
    border: none;
    padding: var(--space-sm) 0;
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-sub);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: color var(--transition-fast);
}
.rt-open-btn:hover { color: var(--highlight); }
.rt-open-btn-icon {
    opacity: var(--opacity-secondary);
    transition: transform var(--transition-fast);
    display: inline-flex;
    align-items: center;
    width: 10px;
    height: 10px;
    flex-shrink: 0;
}
.rt-open-btn-icon svg { width: 100%; height: 100%; display: block; }
.rt-open-btn.expanded .rt-open-btn-icon { transform: rotate(90deg); }

/* Research Tools 本体 */
.rt-body {
    display: none;
}
.rt-body.visible { display: block; }

/* 各 Research Tool（Morph / Syntax / Semantic）の切り替えタブ */
.rt-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: var(--rhythm-medium-x);
}
.rt-tab {
    padding: var(--space-xs) var(--space-sm) var(--space-xs);
    font-size: var(--text-caption);
    font-weight: 600;
    font-family: inherit;
    color: var(--text-sub);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color var(--transition-fast), border-color var(--transition-fast);
    letter-spacing: 0.02em;
    position: relative;
    bottom: -1px;
}
.rt-tab:hover { color: var(--highlight); }
.rt-tab.active {
    color: var(--highlight);
    border-bottom-color: var(--highlight);
}

/* 各 Research Tool のコンテンツエリア */
.rt-content { display: none; }
.rt-content.visible { display: block; }

/* フィルター行：label + control をコンパクトに並べる */
.rt-filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs) var(--space-sm);
    margin-bottom: var(--space-sm);
    align-items: baseline;
}
.rt-filter-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    min-width: 24px;
    flex-shrink: 0;
}
/* select コントロール：quiet & compact */
.rt-select {
    font-size: var(--text-caption);
    font-family: inherit;
    color: var(--text-main);
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-s);
    padding: var(--space-xs) var(--space-xs);
    cursor: pointer;
    outline: none;
    transition: border-color var(--transition-fast);
    max-width: 110px;
}
.rt-select:focus { border-color: rgba(44,79,52,0.4); }

/* 実行ボタン */
.rt-run-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-md);
    font-size: var(--text-caption);
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.03em;
    color: var(--highlight);
    background: transparent;
    border: 1px solid var(--accent-mid);
    border-radius: var(--radius-s);
    cursor: pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast);
    margin-top: var(--space-xs);
}
.rt-run-btn:hover {
    background: var(--highlight-light);
    border-color: rgba(44,79,52,0.4);
}
.rt-run-btn:active { opacity: var(--opacity-secondary); }

/* 検索結果エリア */
.rt-results {
    margin-top: var(--space-sm);
    min-height: 0;
}
/* ローディング（ac-loading と同じアニメーションを流用） */
.rt-loading {
    font-size: var(--text-caption);
    color: var(--text-sub);
    padding: var(--space-sm) 0;
    text-align: center;
    animation: ac-blink 1.2s ease-in-out infinite;
    display: none;
}
.rt-loading.visible { display: block; }

/* 結果ブロック：静かな paper-like カード。乱立禁止・1項目ずつ縦積み */
.rt-result-block {
    border-left: 2px solid var(--accent-mid);
    padding: var(--space-xs) 0 var(--space-xs) var(--space-sm);
    margin-bottom: var(--space-sm);
    font-size: var(--text-caption);
    color: var(--text-main);
    line-height: 1.75;
}
.rt-result-block:last-child { margin-bottom: 0; }
.rt-result-kind {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    display: block;
    margin-bottom: var(--space-xs);
}
.rt-result-text {
    font-size: var(--text-caption);
    color: var(--text-main);
    line-height: 1.75;
}
.rt-result-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-top: var(--space-xs);
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
}
.rt-result-ref svg { width: 0.85em; height: 0.85em; display: block; flex-shrink: 0; }
/* 空結果メッセージ */
.rt-no-result {
    font-size: var(--text-caption);
    color: var(--text-sub);
    text-align: center;
    padding: var(--space-md) 0;
    opacity: var(--opacity-secondary);
}
/* Semantic Search：concept チップ選択 */
.rt-concept-grid {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs);
    margin-bottom: var(--space-sm);
}
.rt-concept-chip {
    font-size: var(--text-caption);
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-l);
    background: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    letter-spacing: 0.01em;
    user-select: none;
}
.rt-concept-chip.selected {
    background: var(--highlight-light);
    color: var(--highlight);
    border-color: rgba(44,79,52,0.3);
    font-weight: 600;
}

/* ══════════════════════════════════════════
   Word List View - 節語形リスト
   Progressive Disclosure 段階展開型。
   タブバー廃止。「流れ」を唯一の基盤UIとし、
   chipクリックでインライン展開する。
   ══════════════════════════════════════════ */

/* 外枠（flex列で flow-stream + drawer を縦積み） */
#word-list-view {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    /* スクロールバー出現による横幅変化（chips再ラップ・カラムずれ）を防ぐ。
       both-edges で左右対称に予約し、中心軸を真中心に保つ */
    scrollbar-gutter: stable both-edges;
}

/* ── 流れUI：ギリシャ語順日本語chip列 ── */
/* 常時表示。タブで隠さない。読書の延長として機能する。 */
.wlv-flow-section {
    padding: var(--space-md) var(--space-md) 0;
    flex-shrink: 0;
}
.wlv-flow-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    display: block;
    margin-bottom: var(--space-sm);
}

.wlv-flow-stream {
    display: flex;
    flex-wrap: wrap;
    gap: var(--rhythm-micro);
    align-items: baseline;
    line-height: 2.6;
}

/* 各語のchip：軽量・ボーダー使わない */
.wlv-chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm) var(--space-xs);
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: background var(--transition-fast);
    position: relative;
    border: 1px solid transparent;
}
.wlv-chip:hover {
    background: var(--accent-light);
}
.wlv-chip.active {
    background: var(--accent-light);
    border-color: var(--accent-mid);
}
/* 入口導線 v2 施策B: 押した瞬間の応答（「触れるもの」だと体に教える）。
   hover の無いタッチ環境では、これが唯一の即時フィードバックになる。 */
.wlv-chip:active {
    background: var(--accent-mid);
}
.verse-pair-left, .verse-pair-right, .gf-verse-block {
    transition: background var(--transition-fast);
}
.verse-pair-left:active, .verse-pair-right:active, .gf-verse-block:active {
    background: var(--highlight-light);
}

/* 入口導線 v2 施策A: ピーク層（本文の語タップで、その場に出る軽いカード）。
   画面遷移の前に「原形・この箇所での意味・語義・出現回数」だけを見せ、
   深くは「詳しく見る」から従来の第3層へ進む。 */
.word-peek {
    position: fixed;
    z-index: 1100;
    width: min(320px, calc(100vw - 24px));
    background: var(--bg, #fff);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    padding: var(--space-md);
    animation: bottomCardIn .22s ease-out;
}
@keyframes wordPeekIn {
    from { opacity: 0; transform: scale(.96) translateY(4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
.word-peek-close {
    position: absolute;
    top: 6px; right: 6px;
    width: 30px; height: 30px;
    border: 0; background: transparent;
    color: var(--text-sub); font-size: 16px; line-height: 1;
    cursor: pointer; opacity: .7;
}
.word-peek-close:hover { opacity: 1; }
/* 階層（2026-11-04 見直し）：主役は「この箇所での意味」。ギリシャ語の
   形＋原形は、読めない人には情報ではなく「どの語のカードか」を示す
   名札なので、小さく意味の下に置く。 */
.word-peek-meaning { font-size: 18px; font-weight: 700; color: var(--text-main); padding-right: 26px; line-height: 1.4; }
.word-peek-head { display: flex; align-items: baseline; gap: var(--space-sm); flex-wrap: wrap; margin-top: 2px; }
/* 複数語セグメントの名札行はタップで対象の語を選べる（「詳しく見る」・
   「ハイライト」・出現回数が選択中の語に連動する）。文字の大きさは名札の
   まま変えず、押しやすさはパディングで確保する。
   選択の示し方（実機確認後の調整）：面は「詳しく見る」ボタン
   （--highlight-light = accent 10%）より一段淡い 5% にし、ボタンと同格に
   見えないようにする。左バーは行の余白分まで伸ばさず、::before の上下を
   パディングと同量だけ内側に寄せて、文字の行と同じ高さにする。
   見出し直下の最初の行だけ間隔を --space-sm にし、見出し→行→行→回数 の
   リズムをそろえる。 */
.word-peek-head--sel { position: relative; cursor: pointer; margin: 2px calc(var(--space-xs) * -1) 0; padding: 6px var(--space-xs); border-radius: var(--radius-s); }
.word-peek-meaning + .word-peek-head--sel { margin-top: var(--space-sm); }
.word-peek-head--sel:hover { background: rgba(44, 79, 52, 0.05); }
.word-peek-head--sel.is-selected { background: rgba(44, 79, 52, 0.05); }
.word-peek-head--sel.is-selected::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--highlight); }
.word-peek-head--sel.is-selected .word-peek-greek { color: var(--text-main); }
.word-peek-greek { font-family: "GFS Didot", "Palatino Linotype", Georgia, serif; font-size: 14px; font-weight: 600; color: var(--text-sub); }
.word-peek-lemma { font-size: var(--text-caption); color: var(--text-sub); }
.word-peek-glosses { margin-top: 2px; font-size: var(--text-caption); color: var(--text-sub); line-height: 1.5; }
.word-peek-count { margin-top: var(--space-xs); font-size: var(--text-caption); color: var(--text-sub); }
.word-peek-actions {
    margin-top: var(--space-sm);
    display: flex; gap: var(--space-sm);
}
.word-peek-more {
    display: flex; align-items: center; justify-content: center; gap: var(--space-xs);
    flex: 1;
    padding: var(--space-sm) var(--space-md);
    border: 0; border-radius: var(--radius-s);
    background: var(--highlight-light);
    color: var(--highlight);
    font-size: var(--text-body); font-weight: 600;
    cursor: pointer;
}
.word-peek-hl {
    display: flex; align-items: center; justify-content: center;
    flex: 1;
    padding: var(--space-sm) var(--space-md);
    border: 1px solid var(--border-soft); border-radius: var(--radius-s);
    background: transparent;
    color: var(--text-main);
    font-size: var(--text-body); font-weight: 600;
    cursor: pointer;
}
.word-peek-hl::before {
    content: '';
    width: 0.72em; height: 0.72em; border-radius: 50%;
    /* 既存ハイライトがある語ではその色を出す（--peek-hl-dot をピーク側で設定）。
       無い場合はデフォルト色（黄）の予告として従来どおり。 */
    background: var(--peek-hl-dot, #fccc00);
    border: 1px solid rgba(0, 0, 0, 0.18);
    margin-right: var(--space-xs);
    flex: none;
}
.word-peek-more:active { background: var(--accent-light); }
/* 入口導線 v2 施策C: 初回ガイド（軽量版）。最初の語チップがそっと鼓動し、
   一言だけ添える。説明文で教えるのではなく、押してもらうことで教える。 */
.wlv-chip.fg-guide-pulse {
    animation: fgGuidePulse 1.5s ease-in-out 5;
}
@keyframes fgGuidePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
    50% { box-shadow: 0 0 0 5px var(--accent-mid); background: var(--accent-light); }
}
.fg-guide-hint {
    position: fixed;
    z-index: 1050;
    background: var(--highlight);
    color: #fff;
    font-size: var(--text-caption);
    font-weight: 600;
    padding: var(--space-xs) var(--space-md);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(26, 30, 26, .25);
    white-space: nowrap;
    pointer-events: none;
    animation: wordPeekIn .2s ease-out;
}

@media (max-width: 900px) {
    /* モバイルは画面下部のカード（本文の読み位置を奪わない） */
    /* left / top に !important は付けない。ピーク要素は開くたびに
       peek-guide.js が生成し、閉じると要素ごと除去される。インライン
       left/top が設定されるのは >900px で開いた場合だけで、その幅では
       このブロック自体が適用されない。≤900px では競合するインライン
       値も他の left/top 規則もないため、通常の宣言で足りる
       （RF-5 フォローアップ。当初の残置理由は実コードと食い違っていた）。 */
    .word-peek {
        left: var(--space-md);
        right: var(--space-md);
        top: auto;
        bottom: calc(env(safe-area-inset-bottom, 0px) + var(--space-md));
        width: auto;
    }
}

.wlv-chip-ja {
    font-size: var(--text-body-lg);
    font-family: var(--font-prose);
    color: var(--text-main);
    line-height: 1.3;
    letter-spacing: -0.01em;
}

.wlv-phrase-sep {
    display: inline-block;
    width: 1px;
    height: 16px;
    background: rgba(0,0,0,0.07);
    margin: 0 var(--space-xs);
    vertical-align: middle;
    flex-shrink: 0;
    align-self: center;
}

/* ── chip詳細ドロワー - "深く潜る" continuity design ── */
/* 別パネルではなく、chip streamの下に自然に続く深層として展開する */
.wlv-detail-drawer {
    margin: var(--space-sm) 0 0;
    padding: var(--space-md) var(--space-md) var(--space-md) var(--space-xl);
    display: none;
    border-left: 2px solid var(--accent-mid);
    background: transparent;
    position: relative;
}
/* 左線の上部に小さな点を打って「ここから潜る」感を出す */
.wlv-detail-drawer::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 16px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-mid);
}
.wlv-detail-drawer.visible {
    display: block;
    animation: depthUnfold var(--transition-slow) both;
}
.wlv-dd-close-btn {
    position: absolute;
    top: var(--space-xs);
    right: var(--space-xs);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: var(--text-body);
    opacity: var(--opacity-secondary);
    cursor: pointer;
    border-radius: var(--radius-s);
    -webkit-tap-highlight-color: transparent;
    transition: opacity var(--transition-fast);
}
.wlv-dd-close-btn:hover { opacity: var(--opacity-primary); }
@keyframes wlvDrawerIn {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: var(--opacity-primary); transform: translateY(0); }
}

/* 階層（ピーク層と統一）：主役は「この箇所での意味」。ギリシャ語の
   形＋原形は名札として小さく下に置く（ドロワーには原形が無かったので追加）。 */
.wlv-detail-meaning {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.4;
    margin-bottom: 2px;
    padding-right: 26px;
}
.wlv-detail-meaning:empty { display: none; }
.wlv-detail-nametag {
    display: flex;
    align-items: baseline;
    gap: var(--space-sm);
    flex-wrap: wrap;
    margin-bottom: var(--space-xs);
}
.wlv-detail-greek {
    font-family: var(--font-greek);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sub);
    line-height: 1.2;
}
.wlv-detail-lemma {
    font-size: var(--text-caption);
    color: var(--text-sub);
}
.wlv-detail-glosses {
    font-size: var(--text-caption);
    color: var(--text-sub);
    margin-bottom: var(--space-sm);
    display: none;
}
.wlv-detail-glosses:not(:empty) { display: block; }
/* ドロワー内：文法メモ（廃止：resonanceに統合） */
.wlv-detail-morph {
    display: none;
}
/* ドロワー内：signalタグ（廃止） */
.wlv-detail-signals {
    display: none;
}
.wlv-signal-tag {
    display: none;
}
/* ドロワー内：アクションリンク（縦並び統一行） */
.wlv-detail-actions {
    display: flex;
    flex-direction: column;
    margin-top: var(--space-sm);
}
/* アクション行：共通ベース */
.wlv-detail-study-btn {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    min-height: 44px;
    padding: var(--space-xs) 0;
    font-family: var(--font-prose);
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-decoration: none;
    background: transparent;
    border: none;
    border-top: 1px solid var(--divider);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--transition-fast), opacity var(--transition-fast);
}
.wlv-detail-study-btn:hover  { background: var(--hover-veil); }
.wlv-detail-study-btn:active { opacity: 0.65; }
.wlv-detail-study-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-s); }
/* アイコン枠 */
.wlv-action-icon {
    width: var(--space-lg);
    height: var(--space-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-s);
    font-size: var(--text-body-lg);
    flex-shrink: 0;
    user-select: none;
}
/* テキストラベル */
.wlv-action-label {
    flex: 1;
    text-align: left;
    line-height: 1.4;
}
/* 右シェブロン */
.wlv-action-chev {
    font-size: var(--text-body-lg);
    flex-shrink: 0;
    opacity: var(--opacity-tertiary);
    user-select: none;
}
/* 主操作：緑系 */
button.wlv-detail-study-btn { color: var(--accent); }
button.wlv-detail-study-btn .wlv-action-icon { background: var(--accent-light); color: var(--accent); }
/* 副操作：グレー系 */
a.wlv-detail-study-btn { color: var(--text-sub); }
a.wlv-detail-study-btn .wlv-action-icon { background: var(--hover-veil); color: var(--text-sub); }

.wlv-flow-hint {
    padding: var(--space-sm) var(--space-md) var(--space-md);
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    letter-spacing: 0.02em;
    flex-shrink: 0;
}

/* ── 旧タブ関連：完全廃止。CSS定義を残すが使われない ── */
/* wlv-tabs / wlv-tab / wlv-content は削除（JS側で生成しなくなる） */
.wlv-normal-hint {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    text-align: center;
    margin-top: var(--space-md);
    padding-top: var(--space-sm);
    border-top: 1px solid var(--border-soft);
}

/* ══════════════════════════════════════════
   節全体の読書メモ - passage note
   word-list-view の上に配置する（ヘッダー直下）。
   「読書の余白に書かれたメモ」として機能する。
   commentary・exegesis・sermon noteではない。
   軽い読書補助。静かな prose。
   ══════════════════════════════════════════ */
.wlv-reading-passage-note {
    padding: var(--rhythm-macro-min) var(--rhythm-macro-min) var(--rhythm-macro-min);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    margin-bottom: var(--space-xs);
    flex-shrink: 0;
}

.wlv-pn-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    display: block;
    margin-bottom: var(--rhythm-medium-y);
}

.wlv-pn-prose {
    padding-left: var(--rhythm-medium-x);
    border-left: 2px solid var(--accent-mid);
}

.wlv-pn-prose p {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 2.1;
    letter-spacing: 0.01em;
    margin: 0 0 var(--space-sm) 0;
}
.wlv-pn-prose p:last-child {
    margin-bottom: 0;
}

/* PC StudyPanel: 本文批評欄。モバイル専用の視覚指定を流用せず、PC側に独立して適用する。 */
/* 入口導線 Phase 1: 本文の異読は語リストの後ろに置き、既定は折りたたみ（summary が見出し）。 */
#word-list-view .study-panel-apparatus-note {
    margin-bottom: var(--space-xs);
}
#word-list-view .study-panel-apparatus-note > summary {
    cursor: pointer;
    list-style: none;
}
#word-list-view .study-panel-apparatus-note > summary::-webkit-details-marker {
    display: none;
}
#word-list-view .study-panel-apparatus-note .wlv-pn-label {
    margin-bottom: var(--rhythm-medium-y);
}
#word-list-view .study-panel-apparatus-note .mvv-apparatus-entries {
    padding-left: var(--rhythm-medium-x);
    border-left: 2px solid var(--accent-mid);
}
/* 本文批評欄の本文は読書メモ本文と同じ書体・サイズ・行間に統一する。 */
#word-list-view .study-panel-apparatus-note .mvv-apparatus-entries {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    line-height: 2.1;
    letter-spacing: 0.01em;
    color: var(--text-main);
}
#word-list-view .study-panel-apparatus-note .mvv-app-entry {
    padding: var(--space-xs) 0;
    border-bottom: 1px solid var(--border-soft);
}
#word-list-view .study-panel-apparatus-note .mvv-app-entry:last-child { border-bottom: 0; }
#word-list-view .study-panel-apparatus-note .mvv-app-lem {
    margin-bottom: var(--space-xs);
    color: var(--text-main);
    font: inherit;
}
#word-list-view .study-panel-apparatus-note .mvv-app-lem-gr,
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-gr,
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-wit {
    color: var(--text-sub);
    font-family: inherit;
    font-size: var(--text-caption);
    line-height: 1.6;
}
#word-list-view .study-panel-apparatus-note .mvv-app-rdg {
    display: flex;
    align-items: baseline;
    gap: var(--space-sm);
    margin-bottom: 2px;
}
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-num {
    flex-shrink: 0;
    width: 1.3em;
    color: var(--text-sub);
    font-size: var(--text-caption);
}
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-text { flex: 1; font: inherit; }
#word-list-view .study-panel-apparatus-note .mvv-app-anno {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: var(--space-xs);
    margin-bottom: var(--space-xs);
}
#word-list-view .study-panel-apparatus-note .mvv-app-tag {
    padding: 1px 4px;
    border-radius: 2px;
    background: var(--bg-soft, rgba(0,0,0,0.04));
    color: var(--text-sub);
    font-family: inherit;
    font-size: var(--text-caption);
}
#word-list-view .study-panel-apparatus-note .mvv-app-anno--auto .mvv-app-tag { font-style: italic; }
#word-list-view .study-panel-apparatus-note .mvv-app-ja { color: var(--text-main); font: inherit; }

.wlv-flow-section-compact {
    padding: var(--rhythm-macro-min) var(--rhythm-macro-min) 0;
    flex-shrink: 0;
}

.wlv-flow-label-compact {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: var(--tracking-label);
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    display: block;
    margin-bottom: var(--rhythm-medium-y);
}

/* 入口導線 Phase 1: 「原語の順序」の添え書き（次の操作をその場で伝える） */
.wlv-flow-caption {
    display: block;
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.5;
    margin: calc(-1 * var(--space-xs)) 0 var(--space-sm);
}

/* chip stream: 補助モードではグロスを少し小さく */
.wlv-flow-section-compact .wlv-chip-ja {
    font-size: var(--text-body);
}

/* ドロワー内：「この節での響き」prose - 同読書温度で */
.wlv-detail-resonance {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.95;
    padding: 0 0 var(--space-sm) 0;
    margin-bottom: 0;
    letter-spacing: 0.01em;
    opacity: var(--opacity-primary);
}

/* ══════════════════════════════════════════
   翻訳モード
   ══════════════════════════════════════════ */
#main-reading-area.single-mode {
    grid-template-columns: 1fr 0;
}
#main-reading-area.single-mode #bible-text-area {
    /* grid item は width:auto だとコンテンツ量に応じてshrink-to-fitされてしまうため、
       width:100%で明示的にグリッド列いっぱいに広げる（その上でmax-width:44emが上限を決める）。
       本文は元々文章量が多くshrink-to-fitでも44emに達していたため見た目は変わらないが、
       ブックマーク等のコンテンツが少ない一覧ページでは本文より狭くなっていた。 */
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    padding-left: var(--space-lg);
    padding-right: var(--space-lg);
    box-sizing: border-box;
}
#main-reading-area.static-view { align-content: start; }
/* single-mode（通常の聖書章表示）でも同様に stretch を抑制する。
   flex:1 により #main-reading-area がビューポート全高を占有するが、
   align-content: normal（初期値=stretch）だと grid 行が余剰高さを吸収して
   #bible-text-area が節本文より大きく引き伸ばされ、本文直下に巨大な白領域が生じる。
   compare-mode は single-mode と排他（_applyTransMode で single-mode を remove）のため
   このルールは compare-mode には適用されない。 */
#main-reading-area.single-mode { align-content: start; }

#main-reading-area.single-mode #parallel-text-area,
#main-reading-area.single-mode .verse-pair-right {
    display: none;
}
#main-reading-area.compare-mode {
    grid-template-columns: 1fr 1fr;
}
#main-reading-area.compare-mode #bible-text-area {
    max-width: none;
}
#main-reading-area.compare-mode #parallel-text-area {
    display: block;
    min-width: 0;
    overflow-x: auto;
}
#main-reading-area.compare-mode.panel-open {
    grid-template-columns: 1fr 0;
}
/* Phase 3-7-C: compare chapter container — outer grid をスパンし内部に同一比率の2列グリッドを持つ */
.compare-chapter-block {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
}
.compare-chapter-header {
    grid-column: 1 / -1;
    padding: var(--space-xl) 0;
    text-align: center;
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    pointer-events: none;
    user-select: none;
}
.compare-chapter-block:first-child .compare-chapter-header {
    display: none;
}
/* border-left 境界線: #parallel-text-area の border-left は row-1 のみのため
   compare-chapter-block 内の verse-pair-right に付与する */
#main-reading-area.compare-mode .compare-chapter-block .verse-pair-right {
    border-left: 1px solid rgba(0,0,0,0.08);
}
#bible-text-area {
    grid-column: 1;
    grid-row: 1;
}
#parallel-text-area {
    grid-column: 2;
    grid-row: 1;
}
.verse-pair-right .jp-text {
    font-size: var(--text-body-lg);
    line-height: 30px;
    color: var(--text-main);
    font-family: var(--font-prose);
}
.gf-verse-block {
    padding: var(--space-md) var(--space-lg) var(--space-sm);
}
/* flowモード時は jp-text の代わりにchipを表示するため jp-text を隠す
   VR-5-H-4: Flow 表示の可視制御を位置クラス（.verse-pair-right）非依存へ一般化。
   不変条件: 左列の通常 wordOrder 描画（renderBodyColumn）には .gf-mode を付与しないため、
   この一般化後も左列 Flow の jp-text 非表示等の副作用は発生しない。
   ★ .gf-verse-block は gf-mode をトグルする列ブロックの「直接の子」として append される
     （_setFlowInjection の block.appendChild(gfEl)）。子結合子 '>' を用いることで、可視判定を
     直接の親（＝当該列ブロック）が gf-mode か否かに限定し、元の
     .verse-pair-right.gf-mode / :not(.gf-mode) が持っていた相互排他性を保つ。
     子孫結合子（' '）にすると body 等の非 gf-mode 祖先経由で :not 規則も同時マッチし、
     同一詳細度のソース順で display:none が勝って Flow が消える（回帰）。 */
.gf-mode .jp-text {
    display: none;
}
.gf-mode > .gf-verse-block {
    display: block;
}
:not(.gf-mode) > .gf-verse-block {
    display: none;
}
/* flowモードのchip streamはStudy Panel版より余白を抑える */
.gf-verse-block .wlv-flow-section-compact {
    padding: 0 0 var(--space-sm);
}

.sb-bible-back {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-sm) var(--space-md) var(--space-xs);
    background: none;
    border: none;
    font-family: inherit;
    font-size: var(--text-caption);
    font-weight: 600;
    color: var(--highlight);
    cursor: pointer;
    letter-spacing: 0.02em;
    opacity: var(--opacity-secondary);
    transition: opacity var(--transition-fast);
    text-align: left;
    width: 100%;
}
.sb-bible-back:hover { opacity: var(--opacity-primary); }
.sb-bible-back-chevron {
    font-size: var(--text-caption);
    font-weight: 400;
    opacity: var(--opacity-primary);
    line-height: 1;
}

/* ══════════════════════════════════════════
   Depth Panel 文法装飾 namespace
   適用先：#bottom-depth-panel（StudyPanel）＋ .wlv-chip（フローチップ）。
   ★ Phase: Reading/Inspect/StudyPanel 3層分離。
   装飾クラス（dp-*）の判定は buildDepthGrammarClasses() が唯一の SSOT で、
   _wordToFlowChip() が生成する dpGrammarClasses を通じて StudyPanel・
   読解フロー双方のチップに同一クラスが付与される（HTML・クラスは共通）。
   dp-* span は必ず .wlv-chip（フローチップ）配下に生成されるため、
   .wlv-chip をスコープにすることで読解フロー本体（_transA==='FLOW'）・
   右カラム Greek Flow View・StudyPanel 内 flow tab のすべてに同一の
   装飾ルールが適用され、同一の語が両モードで完全に一致する。
   #bottom-depth-panel は StudyPanel 側の従来スコープを不変のまま保持する。
   .wlv-chip を伴わない通常訳の本文（jp-text 直書き）には付かない。
   ★ 試作（初見10秒対策・案4）: 口語訳（JA1955）の .ja-seg 内側 span にも
   同一ルールを適用する（セレクタに .ja-seg スコープを追加しただけ。
   装飾の見た目・判定は一切変更しない）。buildRepresentation が動詞
   セグメントにだけ dpClasses を付け、TranslationRenderer が内側 span を
   生成する。素のテキスト区間（対応なし）には付かない。
   ══════════════════════════════════════════ */
#bottom-depth-panel .dp-word,
.wlv-chip .dp-word,
.ja-seg .dp-word {
    display: inline;
}
#bottom-depth-panel .dp-mood-imperative,
.wlv-chip .dp-mood-imperative,
.ja-seg .dp-mood-imperative {
    background: var(--accent-light);
    border-radius: var(--radius-s);
    padding: 0 var(--space-xs);
}
#bottom-depth-panel .dp-mood-indicative,
.wlv-chip .dp-mood-indicative,
.ja-seg .dp-mood-indicative {
    background: rgba(0,0,0,0.05);
    border-radius: var(--radius-s);
    padding: 0 var(--space-xs);
}
#bottom-depth-panel .dp-tense-present,
.wlv-chip .dp-tense-present,
.ja-seg .dp-tense-present {
    text-decoration: underline;
    text-decoration-style: solid;
    text-underline-offset: 3px;
}
#bottom-depth-panel .dp-tense-aorist,
.wlv-chip .dp-tense-aorist,
.ja-seg .dp-tense-aorist {
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
}
#bottom-depth-panel .dp-tense-perfect,
.wlv-chip .dp-tense-perfect,
.ja-seg .dp-tense-perfect {
    text-decoration-line: underline;
    text-decoration-style: wavy;
    text-underline-offset: 3px;
}
#bottom-depth-panel .dp-voice-middle::after,
#bottom-depth-panel .dp-voice-passive::after,
.wlv-chip .dp-voice-middle::after,
.wlv-chip .dp-voice-passive::after,
.ja-seg .dp-voice-middle::after,
.ja-seg .dp-voice-passive::after {
    content: '*';
    font-size: var(--text-caption);
    color: var(--highlight);
    opacity: var(--opacity-secondary);
    margin-left: var(--space-xs);
    vertical-align: super;
}

.dp-legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs) var(--space-sm);
    padding: var(--space-sm) var(--space-md) var(--space-xs);
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    border-top: 1px solid rgba(0,0,0,0.05);
