    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: var(--space-sm) var(--space-lg);
}
.mbp-ch-btn {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-s);
    font-size: var(--text-body);
    font-family: var(--font-prose);
    color: var(--text-main);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--transition-fast), border-color var(--transition-fast);
    min-height: 44px;
}
.mbp-ch-btn:active { background: rgba(0,0,0,0.07); }
.mbp-ch-btn.current {
    background: var(--highlight);
    border-color: var(--highlight);
    color: #fff;
    font-weight: 600;
}

/* Mobile Mode Picker（bottom sheet） */
#mobile-mode-picker {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 170;
    pointer-events: none;
}
#mobile-mode-picker.mmp-open {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    pointer-events: auto;
}
#mobile-mode-picker-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    cursor: pointer;
}
#mobile-mode-picker-sheet {
    position: relative;
    background: var(--bg-paper);
    border-radius: var(--radius-l) var(--radius-l) 0 0;
    max-height: 75vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
    transform: translateY(100%);
    transition: transform var(--transition-slow);
}
#mobile-mode-picker.mmp-open #mobile-mode-picker-sheet {
    transform: translateY(0);
}
#mobile-mode-picker-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border-soft);
    margin: 10px auto 0;
    flex-shrink: 0;
}
#mobile-mode-picker-bar {
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 var(--space-sm);
    flex-shrink: 0;
    position: relative;
    border-bottom: 1px solid var(--border-soft);
}
#mobile-mode-picker-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: -0.01em;
}
#mobile-mode-picker-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text-sub);
    min-width: 44px;
    min-height: 44px;
    margin-left: auto;
    padding: 0 var(--space-xs);
    -webkit-tap-highlight-color: transparent;
}
#mobile-mode-picker-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.mmp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px var(--space-lg);
    font-size: var(--text-body);
    font-family: var(--font-prose);
    color: var(--text-main);
    cursor: pointer;
    border-bottom: 1px solid var(--border-soft);
    -webkit-tap-highlight-color: transparent;
    transition: background var(--transition-fast);
}
.mmp-row:active  { background: rgba(0,0,0,0.05); }
.mmp-row.current { font-weight: 700; }
.mmp-checkmark {
    color: var(--highlight);
    font-size: 1rem;
    font-weight: 600;
    opacity: 0;
}
.mmp-row.current .mmp-checkmark { opacity: 1; }

/* ── MN: ≤900px アクティブ ── */
@media (max-width: 900px) {
    /* Desktop breadcrumb / hamburger を隠す */
    #mobile-menu-btn     { display: none !important; }
    #global-breadcrumb   { display: none !important; }
    #research-open-btn   { display: none !important; }
    #open-panel-btn      { display: none !important; }

    /* Mobile header compact（base rule padding: 18px 40px を上書き） */
    .app-header { padding: 4px 16px; }

    /* Mobile header 要素を有効化 */
    #mobile-location-btn {
        display: flex;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    #mobile-more-btn { display: flex; }

    /* FAB を有効化 */
    #mobile-fab { display: flex; }

    /* 読書エリア下部パディング（FAB が本文最終行に重ならないため） */
    #main-reading-area {
        padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    }

    /* Study Panel open → FAB 非表示（R-7 対策） */
    #app.mobile-study-open #mobile-fab { display: none !important; }

    /* ≤768px: full-screen Study Panel でも同様 */
}

@media (max-width: 768px) {
    #app.mobile-study-open #mobile-reading-area-pad,
    #app.mobile-study-open #main-reading-area { padding-bottom: 0; }
}

/* MobileVerseView open → FAB 非表示 */
#app.mobile-mvv-open #mobile-fab         { display: none !important; }
#app.mobile-mvv-open #mobile-fab-overlay { display: none !important; }

/* Picker open → FAB 非表示（picker sheet が FAB と重ならない保証） */
#app.mobile-picker-open #mobile-fab         { display: none !important; }
#app.mobile-picker-open #mobile-fab-overlay { display: none !important; }

/* Study Panel open → overlay も非表示 */
#app.mobile-study-open #mobile-fab-overlay { display: none !important; }

/* ── MN: ≥901px: 新規要素を完全非表示 ── */
@media (min-width: 901px) {
    #mobile-location-btn  { display: none !important; }
    #mobile-fab           { display: none !important; }
    #mobile-fab-overlay   { display: none !important; }
    #mobile-book-picker   { display: none !important; }
    #mobile-mode-picker   { display: none !important; }
    #mobile-more-btn      { display: none !important; }
    #mobile-more-overlay  { display: none !important; }
    #mobile-more-menu     { display: none !important; }
}

/* ── Phase J: RK Reading Mode ── */
/* 語の役割で読む（role-reading）: エディタと同じ線・文字で描く */
.role-reading-view .role-svg { display: block; }
.role-reading-view .role-svg text { font: 22px "GFS Didot","Palatino Linotype",Georgia,serif; fill: var(--text-main); }
/* 節番号: 先頭行の先頭の語の左に、他のモードの .v-num と同じ見た目で置く */
.role-reading-view .role-svg text.vnum { font-size: 17px; fill: var(--text-sub); font-weight: 400; letter-spacing: 0.02em; }
.role-reading-view .role-svg .ul { stroke: var(--text-main); stroke-width: 1.8; }
.role-reading-view .role-svg .e { stroke: var(--text-sub); stroke-width: 1.8; fill: none; }
/* 第3層の局所表示: 中心語の強調と、内容があるときだけの余白 */
.role-reading-view .wn.focus text { fill: var(--accent); font-weight: 700; }
.role-reading-view .wn.focus .ul { stroke: var(--accent); stroke-width: 2.6; }
#rn-relation-slot:not(:empty), #mvv-relation-slot:not(:empty) { margin: var(--space-md) 0 var(--space-xs); }
/* 局所表示の枠: 文全体の図を上下左右に動かして見る（地図アプリ式） */
.local-rel-wrap { position: relative; }
.local-rel-frame { touch-action: none; height: 240px; overflow: auto; border: 1px solid var(--line, #d8d8d8); border-radius: 8px; cursor: grab; overscroll-behavior: contain; user-select: none; -webkit-user-select: none; background: var(--bg); scrollbar-width: none; }
.local-rel-frame::-webkit-scrollbar { display: none; }
.local-rel-frame.dragging { cursor: grabbing; }
.local-rel-frame svg.role-svg { max-width: none; }
/* 地図アプリ式コントロール（拡大・縮小・選択語へ戻る）: 枠の右下に固定 */
.local-rel-controls { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.local-rel-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line, #d8d8d8); background: var(--bg, #fff); color: var(--text-main); box-shadow: 0 1px 4px rgba(0, 0, 0, .18); cursor: pointer; display: grid; place-items: center; padding: 0; }
.local-rel-btn svg { width: 18px; height: 18px; }

.da-sentence {
    width: 100%;

<script>
let abbottSmithDict = null;
let abbottSmithDictPromise = null;
let _proximityTokens = [];

/* decodeMorph / cleanText — bible_data tokens have direct case/mood/tense/voice fields */
function decodeMorph(e) {
    if (!e || typeof e !== 'object') return {};
    return {
        pos:    e.pos || (e.class ? String(e.class).slice(0, 1).toUpperCase() : ''),
        tense:  e.tense  || '',
        voice:  e.voice  || '',
        mood:   e.mood   || '',
        case:   e.case   || '',
        number: e.number || '',
        gender: e.gender || '',
        person: e.person || '',
    };
}
function cleanText(e) {
    const s = (e && typeof e === 'object') ? (e.text || e.normalized || '') : String(e || '');
    return s.replace(/[.,;:!?·—'··]+$/g, '').trim();
}

/* ══════════════════════════════════════════
   Semantic layer data — LN / Cluster / Lexicon / Domain Labels
   ══════════════════════════════════════════ */
let _lexiconData           = null;
let _lnIndexData           = null;
let _clusterIndexData      = null;
let _compositionData       = null;
let _semanticDomainLabels  = null;
let _lexiconLoading        = false;

async function _ensureSemanticData() {
    if (_lexiconData && _lnIndexData && _clusterIndexData && _compositionData && _semanticDomainLabels) return;
    if (_lexiconLoading) {
        await new Promise(res => {
            const t = setInterval(() => {
                if (_lexiconData && _lnIndexData && _clusterIndexData && _compositionData && _semanticDomainLabels) { clearInterval(t); res(); }
            }, 60);
        });
        return;
    }
    _lexiconLoading = true;
    try {
        const [lexRes, lnRes, clRes, compRes, sdlRes] = await Promise.all([
            fetch('../assets/data/lexicon/lexicon-lite.json'),
            fetch('../assets/data/index/domains-ln-index.json'),
            fetch('../assets/data/index/domains-cluster-index.json'),
            fetch('../assets/data/lexicon/lexicon-composition.json'),
            fetch('../assets/data/index/semantic-domain-labels.json'),
        ]);
        _lexiconData          = lexRes.ok   ? await lexRes.json()   : {};
        /* Phase 4-C: ReadingLexicon を lexicon-lite で補強する
           （glossJa / abbottSmith / semanticDomains — Phase 5 Semantic の語彙情報源）。
           失敗しても ReadingEngine の挙動には影響しない（deponent は基本層にある）。 */
        try { window.App?.readingLexicon?.enrich(_lexiconData); } catch (_) {}
        _lnIndexData          = lnRes.ok    ? await lnRes.json()    : {};
        _clusterIndexData     = clRes.ok    ? await clRes.json()    : {};
        _compositionData      = compRes.ok  ? await compRes.json()  : {};
        _semanticDomainLabels = sdlRes.ok   ? await sdlRes.json()   : {};
    } catch(e) {
        console.warn('[SemanticData] load failed:', e);
        _lexiconData = _lnIndexData = _clusterIndexData = _compositionData = {};
        _semanticDomainLabels = {};
    }
}

/* lexicon エントリの表示文字列を解決する唯一の関数。
   優先順位: gloss_ja（日本語）→ headword（正規表記）→ lexemeId（最終保証）
   UI はこの関数のみを経由し、直接の条件分岐・フォールバック記述は禁止。 */
function resolveDisplay(entry, lexemeId) {
    return (entry && entry.gloss_ja) || (entry && entry.headword) || lexemeId;
}

/* lemmaId に対応する語構成要素配列を返す。
   @returns {Array<{lexemeId:string}>|null}
   各要素は lexemeId（lexicon の主キー）のみを持つ。文字列一致は使用しない。 */
function getWordComposition(lemmaId) {
    if (!_compositionData || !lemmaId) return null;
    const entry = _compositionData[lemmaId];
    if (entry === null) return null;          // 明示的な単純語マーカー
    if (!entry) return null;                  // エントリなし（未整備）
    return Array.isArray(entry.components) && entry.components.length > 0
        ? entry.components
        : null;
}

/* 語源パーツ HTML を生成（日本語表示・クリック可能）
   parts: Array<{lexemeId:string}>
   UI の責務: lexicon 参照 → resolveDisplay 呼び出し → 描画。ロジックは持たない。 */
function _buildEtymPartsHTML(parts) {
    return parts.map(({ lexemeId }) => {
        const entry   = _lexiconData?.[lexemeId];
        const display = resolveDisplay(entry, lexemeId);
        return `<span class="rn-etym-part" data-lexeme-id="${_escH(lexemeId)}">${_escH(display)}</span>`;
    }).join('<span class="rn-etym-sep"> ＋ </span>');
}

/* Abbott-Smith ポップアップを開く。
   lexemeId で _lexiconData を直接引く。headword 文字列検索は行わない。 */
async function _openEtymPopup(lexemeId) {
    const entry = _lexiconData?.[lexemeId];
    const form  = entry?.headword || '';
    const gloss = entry?.gloss_ja || '';
    let   desc  = entry?.abbottSmith || '';
    if (!desc && lexemeId) {
        const digits = lexemeId.replace(/^grc:G/i, '');
        if (!abbottSmithDict) await loadDict();
        desc = abbottSmithDict?.[digits]?.description || '';
    }
    const bd = document.getElementById('rn-etym-backdrop');
    if (!bd) return;
    document.getElementById('rn-etym-modal-gr').textContent = form;
    document.getElementById('rn-etym-modal-ja').textContent = gloss;
    const bodyEl = document.getElementById('rn-etym-modal-body');
    bodyEl.innerHTML = desc
        ? `<div class="rn-etym-as-label">Abbott-Smith</div>${_escH(desc).replace(/\n/g, '<br>')}`
        : '<span class="rn-etym-empty">Abbott-Smithデータなし</span>';
    bd.classList.add('open');
}

function _resolveLemmaId(strong) {
    const normStrong = normalizeStrong(strong);
    const candidate = 'grc:' + normStrong;
    return (_lexiconData && _lexiconData[candidate]) ? candidate : null;
}

/**
 * Strong番号を正規化して "G\d+" 形式に統一する。
 *   "3972"  → "G3972"
 *   "g3972" → "G3972"
 *   "G3972" → "G3972"
 * 数字部分が取れない場合は空文字を返す。
 */
function normalizeStrong(value) {
    const digits = String(value || '').replace(/[^0-9]/g, '');
    return digits ? 'G' + digits : '';
}

/* ══════════════════════════════════════════
   翻訳マスター定義（TDZ対策：先頭で宣言）
   ══════════════════════════════════════════ */
const TRANSLATIONS = {
    'JA1955': { label: '口語訳（1955）',     code: 'JA1955' },
    'BUN':    { label: '文語訳',             code: 'BUN'    },
/*  'KAI17':  { label: '新改訳2017',         code: 'KAI17'  },
    'KYO':    { label: '聖書協会共同訳',     code: 'KYO'    },*/
    'WORD_ORDER': { label: '語順で読む',       code: 'WORD_ORDER' },
    'DA_READING': { label: '文の構造で読む',     code: 'DA_READING' },
    /* 語の役割で読む: 作業スペースで確定した RK 座標レイアウトを読むモード。
       章×デバイスの公開可否は rk-availability.json で管理する。 */
    'ROLE_READING': { label: '語の役割で読む',   code: 'ROLE_READING' },
    /* 旧モード（DISCOURSE / STRUCTURAL / STRUCTURE / CLAUSE_ROLE / RELATION /
       RK_READING / RK_READING_V）は 2026-10-28 のモード整理で登録を削除した。
       旧URLは _toColumnMode のフォールバックで「語順で読む」に着地する。
       実装（core スクリプト群）は参照閉包を確認してから別途撤去する。 */
};
const TRANS_LIST   = Object.entries(TRANSLATIONS).map(([id, t]) => ({ id, name: t.label, code: t.code }));
const TRANS_LABELS = Object.fromEntries(Object.entries(TRANSLATIONS).map(([id, t]) => [id, t.label]));

/**
 * VR-4-E: Translation Registry — 実際の人手翻訳のみ（'FLOW' を含まない）。
 * TRANSLATIONS（URL互換のため維持。'FLOW' を含む）から機械的に導出する。
 * Bible Picker の「翻訳を選択」グループはここを正とする。
 */
const TRANSLATION_REGISTRY = Object.entries(TRANSLATIONS)
    .filter(([id]) => id !== 'WORD_ORDER' && id !== 'DISCOURSE' && id !== 'STRUCTURAL' && id !== 'STRUCTURE' && id !== 'CLAUSE_ROLE' && id !== 'BUN' && id !== 'RELATION' && id !== 'RK_READING' && id !== 'RK_READING_V' && id !== 'DA_READING' && id !== 'ROLE_READING')
    .map(([id, t]) => ({ id, label: t.label, code: t.code }));

/**
 * VR-4-E: DisplayMode Registry（docs/development/verse-representation-design.md §C-1）。
 * 翻訳と表示方式（wordOrder 等）を型として区別する。今回は Bible Picker の
 * 「読み方を選択」グループ生成にのみ使用し、buildRepresentation() 等の既存
 * ColumnMode 変換経路（_toColumnMode()）は変更しない。
 * @typedef {{kind:'translation', translationId:string, label:string}
 *         | {kind:'wordOrder', label:string}} DisplayModeEntry
 */
const DISPLAY_MODE_REGISTRY = [
    ...TRANSLATION_REGISTRY.map(t => ({ kind: 'translation', translationId: t.id, label: t.label })),
    { kind: 'wordOrder', label: TRANSLATIONS.WORD_ORDER.label },
    { kind: 'da-reading', label: TRANSLATIONS.DA_READING.label },
    /* 語の役割で読む。旧モード（discourse / hierarchical / structural-diagram /
       rk-reading）のエントリは 2026-10-28 のモード整理で削除した。 */
    { kind: 'role-reading', label: TRANSLATIONS.ROLE_READING.label },
];

/* アクティブ翻訳（A = メイン / B = 比較列）。_transA / _transB が唯一のSSOT（Phase TR-5）。 */
let _transMode   = 'single';
let _transA      = 'JA1955';
let _transB      = 'BUN';

/* Legacy Mode ID → 新 Mode ID の正規化マップ（URL deep link 互換）。
   ?transA=FLOW 等の旧 URL が引き続き動作するよう init() で適用する。 */
const LEGACY_MODE_IDS = { FLOW: 'WORD_ORDER', HIERARCHICAL: 'STRUCTURE', REED_KELLOGG: 'CLAUSE_ROLE' };
function normalizeModeId(id) { return LEGACY_MODE_IDS[id] || id; }
let _cachedElByVerse = {};
/* Phase 2B-2: 追加章の elByVerse キャッシュ。キー: "bookKey|chapter"（文字列）、値: elByVerse オブジェクト。
   render() 呼び出し時に clear() する（DOMクリアとライフサイクルを一致させる）。 */
let _appendedChapterCache = new Map();

/* ══════════════════════════════════════════
   AppState - UI状態の一元管理
   ══════════════════════════════════════════
   設計方針:
     - グローバル状態はすべてここに集約する
     - DOM操作（display切替など）はこのオブジェクトに触れない
       → 実際のDOM操作は各関数が行う
     - 状態を「読む」ことで現在モードを判定できる
     - scroll位置は「Reading に戻る」ときに復元する

   状態遷移:
     reading  → 節クリック  → browsing
     browsing → 語カードクリック → popover表示（modeは browsing のまま）
     browsing → 「詳しく見る」 → study
     study    → 「テキストに戻る」 → reading（scroll復元）
     study    → 「分析に戻る」 → study（params保持・tab記憶）
   ══════════════════════════════════════════ */
const AppState = {
    /* 現在のモード: 'reading' | 'browsing' | 'study' */
    mode: 'reading',

    /* 選択中の節 */
    selectedVerse: {
        vNum:     null,   /* string: 節番号 e.g. "3" */
        elWords:  [],     /* Array: 節内の語形データ */
    },

    /* Inspect スナップショット（選択中の語） */
    inspect: {
        data: null,       /* { greek, strong, jpMorph, rawMorph, lemma, jaWord, desc, ref } */
    },

    /* Study 情報（タブ・params）*/
    study: {
        params: null,     /* _currentAnalysisParams と同内容 */
        tab:    'flow',   /* 最後に表示していたタブ。Study閉じても保持。 */
    },

    /* SP-1: StudyPanel起点（どの読書面からLevel3を開いたか）
       surface    = 読書面ID: 'JA1955' | 'FLOW' | 'HIERARCHICAL' | 'REED_KELLOGG' | 'CLAUSE_FLOW' | null
       entryPoint = 入口種別: 'wlv' | 'token' | 'head' | 'pp' | null
       closeStudyPanel() でクリア。reopenStudyPanel() はクリア後のnull状態を維持（Level2なし）。 */
    studyOrigin: {
        surface:    null,
        entryPoint: null,
    },

    /* SP-3: StudyTarget v0（何を調べているか）
       TOKEN target: { type: 'TOKEN', ref: 'JHN 3:1!1' }
       closeStudyPanel() / toReading() でクリア。reopenStudyPanel() で study.params.ref から再構築。
       studyOrigin（どこから来たか）・inspect.data（表示データ）とは別責務。 */
    studyTarget: null,

    /* 空間階層（聖書全体の"場所"） */
    location: {
        testament: null,  /* 'nt' | 'ot' */
        book:      null,  /* e.g. { key:'1CO', name:'コリント人への手紙 第一', ch:16 } */
        chapter:   null,  /* number */
    },

    /* 読書深度スタック */
    depth: {
        stack: [],        /* [ { type, label, verse?, strong? }, ... ] */
    },

    /* 本文スクロール位置（Study閉じたとき復元する） */
    scrollTop: 0,

    /* UI状態（ヘッダー/パンくず/サイドバーの選択表示の唯一のソース）。
       'bible' | 'bookmarks' | 'notes' | 'recentVerses' | 'recentWords' | 'sourcePolicy' | 'knowledge' | 'roadmap' | 'changelog' */
    ui: {
        view: 'bible',
    },

    /* ── ヘルパー ── */

    /* Reading 状態にリセット（scroll保持・study.tab保持） */
    toReading() {
        this.mode = 'reading';
        this.selectedVerse = { vNum: null, elWords: [] };
        this.inspect.data  = null;
        this.studyOrigin   = { surface: null, entryPoint: null };
        this.studyTarget   = null;
        /* study.params / study.tab はあえて保持する（再開ボタンのため） */
    },

    /* Browsing 状態に移行（節選択後） */
    toBrowsing(vNum, elWords, book, ch) {
        this.mode = 'browsing';
        /* ch: 選択節の属する章（URL divergence 防止のため selectedVerse に保持する。
           ch なし呼び出し元では null → getShareState() が location.chapter へフォールバック）。 */
        this.selectedVerse = { vNum, elWords: elWords || [], ch: ch != null ? ch : null };
        this.inspect.data  = null;

        /* 読書位置（節）の永続化：selectedVerse が確定する唯一の地点（SSOT）。
           ref・構造化フィールドはすべて book / ch / vNum から組み立てる（ref パース禁止のSSOT原則）。
           book / ch は描画時コンテキスト（明示引数）を優先し、省略時は this.location にフォールバック。 */
        if (window.App.storage) {
            const _bk = book || this.location.book;
            const bookKey = _bk ? _bk.key : '';
            const chapter = ch != null ? ch : (this.location.chapter != null ? this.location.chapter : '');
            if (bookKey && chapter !== '' && vNum != null) {
                window.App.storage.addRecentVerse({
                    ref: `${bookKey} ${chapter}:${vNum}`,
                    bookKey: bookKey,
                    chapter: chapter,
                    verse: Number(vNum),
                });
            }
        }
    },

    /* Study 状態に移行 */
    toStudy(params, tab) {
        this.mode = 'study';
        this.study.params = params;
        if (tab) this.study.tab = tab;
    },

    /* スクロール位置を保存 */
    saveScroll() {
        const el = document.getElementById('main-reading-area');
        if (el) this.scrollTop = el.scrollTop;
    },

/* スクロール位置を復元 */
    restoreScroll() {
        const el = document.getElementById('main-reading-area');
        if (el) el.scrollTop = this.scrollTop;
    },

    /* Study が再開できる状態か */
    canReopen() {
        return !!(this.study.params);
    },

    /* depth stack に追加 */
    pushDepth(entry) {
        this.depth.stack.push(entry);
    },

    /* depth stack をクリア */
    clearDepth() {
        this.depth.stack = [];
    },
};

/* ══════════════════════════════════════════
   URL共有機能: ShareURLService / Router / getShareState / applyShareState
   責務分離:
     ShareURLService.generate … state → URL（唯一の生成箇所）
     Router.parse             … URL → state（唯一の解析箇所、副作用なし）
     getShareState            … 現在のAppState → state（URL生成時は必ずここを経由）
     applyShareState          … state → UI反映（URL/Routerを参照しない）
   ══════════════════════════════════════════ */
const ShareURLService = {
    /* 内部ID → パスコード（Router._DISPLAY_CODE の逆マッピング）。
       JA1955 はデフォルトのため省略する（エントリなし = コードなし）。 */
    _PATH_CODE: {
        'WORD_ORDER':  'WO',
        'STRUCTURE':   'ST',
        'CLAUSE_ROLE': 'CR',
        'RELATION':    'RL',
        'DISCOURSE':   'DC',
        'BUN':         'BUN',
        'RK_READING':  'RK',
        'RK_READING_V': 'RKV',  /* Phase L.2 */
        'DA_READING': 'DA',
        'RK_READING_P': 'RKP',  /* Phase M */
        'ROLE_READING': 'WR',
    },

    /* state → canonical path-format URL。
       panel / word / tokenIndex はこのフェーズでシリアライズしない（Phase D/F で対応）。
       生成結果は Router.parse() で再解析したとき同一の state を返すことを保証する。 */
    generate(state) {
        const book    = state.book    || 'ROM';
        const chapter = state.chapter != null ? String(state.chapter) : '1';
        const verse   = state.verse   ? String(state.verse) : '';
        const isCompare = state.mode === 'compare' && state.transB;

        const codeA = this._PATH_CODE[state.transA] || null;
        const codeB = isCompare ? (this._PATH_CODE[state.transB] || null) : null;

        /* JA1955 (codeA===null) の場合 display='' → パスセグメント省略 = /BOOK/CHAPTER */
        let display = '';
        if (codeA && codeB) {
            display = codeA + '+' + codeB;
        } else if (codeA) {
            display = codeA;
        }

        const segs = [encodeURIComponent(book), encodeURIComponent(chapter)];
        if (verse)   segs.push(encodeURIComponent(verse));
        if (display) segs.push(display.split('+').map(encodeURIComponent).join('+'));

        const url = new URL(window.location.origin);
        url.pathname = '/' + segs.join('/');
        return url;
    }
};

const Router = {
    /* パス表示コード → 内部ID（旧URLエイリアスは normalizeModeId が担う） */
    _DISPLAY_CODE: {
        'WO': 'WORD_ORDER', 'ST': 'STRUCTURE',  'CR': 'CLAUSE_ROLE',
        'RL': 'RELATION',   'DC': 'DISCOURSE',  'BUN': 'BUN', 'JA1955': 'JA1955',
        'RK': 'RK_READING', 'RKV': 'RK_READING_V', 'RKP': 'RK_READING_P',  /* Phase L.2 / M */
        'DA': 'DA_READING',
        'WR': 'ROLE_READING',
    },

    /* /{BOOK}/{CH}[/{VERSE}[/{TOKEN_INDEX}]][/{DISPLAY}] を解析して state を返す。
       BOOK が既知の書物キーでない・CH が数字でない場合は null を返す。 */
    _parsePath(pathname) {
        const segs = pathname.split('/').filter(Boolean);
        if (segs.length < 2) return null;
        const bookKey = segs[0].toUpperCase();
        const allKeys = new Set([...SB_BOOKS.nt, ...SB_BOOKS.ot].map(b => b.key));
        if (!allKeys.has(bookKey)) return null;
        if (!/^\d+$/.test(segs[1])) return null;
        const out = {
            book: bookKey, chapter: segs[1],
            verse: null, tokenIndex: null,
            transA: null, transB: null, mode: null,
        };
        let i = 2;
        if (i < segs.length && /^\d+$/.test(segs[i])) {
            out.verse = segs[i++];
            if (i < segs.length && /^\d+$/.test(segs[i])) out.tokenIndex = segs[i++];
        }
        if (i < segs.length) {
            const parts = decodeURIComponent(segs[i]).toUpperCase().split('+');
            out.transA = this._DISPLAY_CODE[parts[0]] || null;
            if (parts.length > 1) {
                out.transB = this._DISPLAY_CODE[parts[1]] || null;
                out.mode = 'compare';
            }
        }
        return out;
    },

    /* パス形式（?book= なし）を優先し、なければ旧クエリ形式にフォールバックする。
       verse/panel/word は常にクエリパラメータから読む（書き込み側は Phase C で対応）。
       tokenIndex はパースのみ。init() は現在消費しない（将来フェーズで対応）。 */
    parse(location = window.location) {
        const p = new URLSearchParams(location.search);
        if (!p.get('book')) {
            const path = this._parsePath(location.pathname);
            if (path) {
                return {
                    book:       path.book,
                    chapter:    path.chapter,
                    verse:      path.verse   || p.get('verse'),
                    panel:      p.get('panel'),
                    word:       p.get('word'),
                    transA:     path.transA,
                    transB:     path.transB  || p.get('transB'),
                    mode:       path.mode    || p.get('mode'),
                    tokenIndex: path.tokenIndex,
                };
            }
        }
        return {
            book:    p.get('book'),
            chapter: p.get('ch'),
            verse:   p.get('verse'),
            panel:   p.get('panel'),
            word:    p.get('word'),
            transA:  p.get('transA'),
            transB:  p.get('transB'),
            mode:    p.get('mode'),
        };
    }
};

/* ══════════════════════════════════════════
   URL Import: 外部の聖書Webサービス（ブックマークレット等）から渡された
   ?import=<URLエンコード済URL> を、通常の共有URL形式（?book/?ch/?verse）へ
   変換する。解析ロジックは core/url-import-engine.js に集約し、ここでは
   結果をURLへ書き戻す配線のみを行う（既存のRouter/init経路をそのまま使う）。
   init() の最初、Router.parse() より前に1回だけ呼ぶ。 ══════════════════════════════════════════ */
function _applyUrlImportIfPresent() {
    const params = new URLSearchParams(location.search);
    const imported = params.get('import');
    if (!imported) return;

    const engine = window.App && window.App.urlImport;
    const result = engine ? engine.parseBibleUrl(imported) : null;

    const url = new URL(window.location.href);
    url.searchParams.delete('import');

    if (result && result.book) {
        url.searchParams.set('book', result.book);
        url.searchParams.set('ch', String(result.chapter));
        if (result.verse != null) {
            url.searchParams.set('verse', String(result.verse));
        } else {
            url.searchParams.delete('verse');
        }
        /* URL Import経由の初期表示は「読解フロー」をデフォルトにする（transA未指定時のみ）。
           _transAを直接書き換えず、既存のRouter/init()経路（urlParams.transA読み取り→
           _applyTransMode）にそのまま委譲する。呼び出し元が明示的にtransAを指定していれば
           それを優先し、上書きしない。 */
        if (!params.has('transA')) {
            url.searchParams.set('transA', 'WORD_ORDER');
        }

        /* 「外部サイト＋聖書アプリ並列利用」の基盤として、import元の外部URLを
           このタブのセッション限りで保持する（sessionStorage。localStorageは使わない
           ＝ app-storage.js が扱う永続ユーザーデータとは責務が異なる一時情報のため）。
           保存に失敗しても（private mode等）本文表示には影響させない。
           読み出し・表示は _syncUrlImportSourceButton() / _openUrlImportSource() が担う。 */
        try {
            sessionStorage.setItem('app_url_import_source', imported);
        } catch (_) { /* 保存できなくてもアプリ動作は継続する */ }
    } else {
        _showToast('この聖書サービスには現在対応していません。', 3200);
    }
    history.replaceState(null, '', url);
}

/* #open-source-btn の表示可否を同期する。app_url_import_source が今回の
   タブセッションに存在する限り表示し続ける（#open-panel-btnと同じ「値の有無だけで
   判定する条件付き表示」方式）。URL Import Engineの再解析・Router操作は行わない。
   init() から1回呼べば、以降のチャプター送り等はフルリロードのため再度init()が
   走り、この関数も再実行される（値はsessionStorageに残り続けるので表示も保持される）。 */
function _syncUrlImportSourceButton() {
    const btn = document.getElementById('open-source-btn');
    if (!btn) return;
    let sourceUrl = null;
    try {
        sourceUrl = sessionStorage.getItem('app_url_import_source');
    } catch (_) { /* 読み取り不可時は非表示のまま安全側に倒す */ }
    btn.style.display = sourceUrl ? 'block' : 'none';
}

/* app_url_import_source を http/https URL として検証済みの形で返す。
   改ざん・想定外の値混入時は null（_openUrlImportSource が利用）。 */
function _getValidUrlImportSource() {
    let sourceUrl = null;
    try {
        sourceUrl = sessionStorage.getItem('app_url_import_source');
    } catch (_) { return null; }
    if (!sourceUrl) return null;

    let parsed;
    try {
        parsed = new URL(sourceUrl);
    } catch (_) { return null; }
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;

    return sourceUrl;
}

/* #open-source-btn クリック時。値が不正な場合（改ざん・想定外の値混入等）は
   window.open を呼ばず安全に無視する。新規タブで開くのみで、このアプリ自身の
   Router/表示状態には一切触れない。 */
function _openUrlImportSource() {
    const sourceUrl = _getValidUrlImportSource();
    if (!sourceUrl) return;
    window.open(sourceUrl, '_blank', 'noopener,noreferrer');
}

/* ══════════════════════════════════════════
   URL Import の逆方向: アプリ → 外部サイト（「外部の翻訳で比較」）
   現在地（getShareState()の読み取りのみ）を url-import-engine.js の
   generateExternalUrl(targetId, state) へそのまま渡してURLを生成する。
   UI（このファイル）は targetId という不透明な識別子しか扱わず、
   どのサイトか・どの訳か・version ID・URL構造は一切知らない
   （それらは url-import-engine.js 内に閉じている）。
   AppState/Router/transA・transBへの書き込みは一切行わない。
   読み方を選ぶメニュー内に表示する。

   比較対象を増やす場合:
     1) url-import-engine.js の COMPARE_TARGET_GENERATORS に生成関数を1つ追加
     2) 下の COMPARE_TARGETS に {id, label} を1行追加
   の2箇所のみでよく、このファイルのswitch/if分岐を増やす必要はない。
   ══════════════════════════════════════════ */

/* 比較対象一覧（データ駆動）。ここに無い項目は表示されない。
   id は url-import-engine.js の COMPARE_TARGET_GENERATORS のキーと対応させる。 */
const COMPARE_TARGETS = [
    { id: 'prs-shinkai2017', label: '新改訳2017（PRS）' },
    { id: 'biblecom-kyodo',  label: '新共同訳（Bible.com）' },
];

/* 「読み方を選ぶ」メニュー内に外部翻訳へのリンクを描画する。
   リンクは外部本文を新規タブで開き、アプリ側を同じ箇所の語順フローへ切り替える。 */
function _renderExternalCompareMenu(containerId) {
    const list = document.getElementById(containerId);
    if (!list) return;
    const engine = window.App && window.App.urlImport;
    const state = getShareState();
    list.replaceChildren();

    COMPARE_TARGETS.forEach(target => {
        const available = !!engine && !!engine.generateExternalUrl(target.id, state);
        const opt = document.createElement('button');
        opt.type = 'button';
        opt.className = 'sb-row sb-external-compare-item' + (available ? '' : ' disabled');
        opt.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);box-sizing:border-box;width:100%;text-align:left;border:0;background:transparent;padding:var(--space-xs) var(--space-sm);font-family:inherit;font-size:var(--text-caption);font-weight:400;line-height:1.5;color:var(--text-sub);cursor:pointer;';
        opt.disabled = !available;
        const label = document.createElement('span');
        label.textContent = target.label;
        const external = document.createElement('span');
        external.textContent = '↗';
        external.setAttribute('aria-hidden', 'true');
        external.style.cssText = 'flex:none;font-size:var(--text-caption);color:var(--text-sub);';
        opt.append(label, external);
        if (available) opt.addEventListener('click', () => _openCompareTarget(target.id));
        list.appendChild(opt);
    });
}

/* 比較対象クリック時（案B）。クリック時点の最新状態から都度URLを生成する
   （事前計算したhrefを保持しない。節選択はリロード無しで変わりうるため）。
   生成できない場合は何もしない。
   外部サイトを新規タブで開いた後、自分側は既存の正規経路（window.App.bridge.
   openFlowTab()）でFLOW表示へ切り替える。openFlowTab()はrenderCurrentPage()
   経由でAppState.selectedVerseをリセットする（render()の既存仕様）ため、
   節が選択されていた場合は既存のapplyShareState()（URL Import時の節復元と
   同一経路）で同じverseへ復元する。url-import-engine.js・COMPARE_TARGETS・
   generateExternalUrl()・Router/AppState/transA・transB/MobileVerseViewは
   一切変更しない（既存の公開APIを呼ぶだけ）。 */
async function _openCompareTarget(targetId) {
    const engine = window.App && window.App.urlImport;
    const state = getShareState();
    const url = engine ? engine.generateExternalUrl(targetId, state) : null;
    if (!url) return;

    window.open(url, '_blank', 'noopener,noreferrer');

    if (window.App.bridge && typeof window.App.bridge.openFlowTab === 'function') {
        await window.App.bridge.openFlowTab();
        if (state.verse) applyShareState({ verse: state.verse });
    }
}

function getShareState() {
    const panelOpen = AppState.depth?.stack?.length > 0;

    return {
        book: AppState.location?.book?.key || '',
        chapter: AppState.selectedVerse?.ch ?? AppState.location?.chapter ?? '',
        verse: AppState.selectedVerse?.vNum || '',
        panel: panelOpen ? 'study' : '',
        word: (panelOpen && AppState.inspect?.data?.strong)
            ? String(AppState.inspect.data.strong).replace(/^G/, '')
            : '',
        transA: typeof _transA !== 'undefined' ? _transA : '',
        transB: typeof _transB !== 'undefined' ? _transB : '',
        mode: typeof _transMode !== 'undefined' ? _transMode : ''
    };
}

/* onboarding（初回デモ）実行中はURL同期を止めるためのフラグ。
   onboarding.js 自体は変更しないため、index.html 側の既存onboardingフック
   呼び出し箇所（_syncOnboardingActiveFlag 参照）から getState().onboardingComplete
   の「状態遷移（false→true）」を検知して更新する。 */
window.__onboardingActive = false;
window.__onboardingPrevState = null;

/* 前回値との比較による遷移検知。false→trueのエッジを検知した瞬間にのみ
   onboardingActiveをfalseへ戻し、最終状態を1回だけURLに反映する。
   ※ 変更: 判定基準を「!onboardingComplete」から「onboarding.isActive()」へ。
     旧実装はオンボーディングを起動しない新規ユーザー（onboardingComplete=false）で
     URL同期が永久凍結され URL共有が壊れるため。isActive()=実際に動作中かを見る。 */
function _syncOnboardingActiveFlag() {
    if (!window.App.onboarding) return;
    const active = !!(window.App.onboarding.isActive && window.App.onboarding.isActive());

    // オンボーディング終了エッジ（true→false）で最終状態を1回だけURLへ反映する。
    if (window.__onboardingActive && !active) {
        window.__onboardingActive = false;
        syncUrlState();
        return;
    }
    window.__onboardingActive = active;
}

function syncUrlState() {
    if (window.__onboardingActive) return;

    const url = ShareURLService.generate(getShareState());
    history.replaceState(null, '', url);
}

function notifyAppStateChange() {
    syncUrlState();
}

/* 現在表示中のURLをそのままクリップボードへコピーする（URL生成ロジックは呼ばない）。 */
async function copyShareUrl() {
    const url = location.href;
    try {
        await navigator.clipboard.writeText(url);
        _showShareToast();
    } catch (e) {
        try {
            const ta = document.createElement('textarea');
            ta.value = url;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            _showShareToast();
        } catch (e2) {
            console.warn('copyShareUrl: コピーに失敗しました', e2);
        }
    }
}
/* 画面下部の簡易トースト表示。#share-toast を共有部品として複数機能から利用する。 */
function _showToast(message, duration = 2000) {
    const t = document.getElementById('share-toast');
    if (!t) return;
    t.textContent = message;
    t.classList.add('visible');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(() => t.classList.remove('visible'), duration);
}
function _showShareToast() { _showToast('URLをコピーしました'); }

/* 現在開いている節の ref を構造フィールド（bookKey/ch/verse）から組み立てる（ref パース禁止のSSOT原則に従う） */
function _currentVerseRef() {
    const bookKey = AppState.location.book ? AppState.location.book.key : '';
    /* Phase 3-6-J: 選択した節のchapterを使う（連続章でスクロール位置が前章でも正しい参照を生成する）。
       selectedVerse.ch は toBrowsing() で確定している。null の場合のみ location.chapter にフォールバック。 */
    const ch = AppState.selectedVerse?.ch ?? (AppState.location.chapter != null ? AppState.location.chapter : '');
    const vNum = AppState.selectedVerse.vNum;
    if (!bookKey || ch === '' || ch == null || vNum == null) return null;
    return `${bookKey} ${ch}:${vNum}`;
}

function applyShareState(state) {
    if (!state.verse) return;   /* verse なし → 従来どおり章の先頭表示 */

    /* 1. verse復元 = 「本文をタップした場合と同じコードパス」に委譲する。
       可視の節ブロック（左カラム。旧実装の [data-vnum] は非表示の右カラム
       しか拾えなかった）を _findVisibleVerseBlock で特定し、その onclick を
       そのまま実行する。selected クラス・active-v 表示・AppState.toBrowsing・
       StudyPanel オープン・notifyAppStateChange（URL書き戻し）のすべてが
       通常の節タップ処理側で行われる — 検索専用の状態・分岐は持たない。
       スクロールは節を中央へ置き、パネル表示後の重なりは既存の
       _adjustReadingAreaForPanel（openStudyPanel 系の通常処理）が最小調整する。 */
    const words = _cachedElByVerse[state.verse] || [];
    /* book+chapter が指定されている場合は章スコープ検索で正確な節を取得する。
       book/chapter のない呼び出し（_openCompareTarget 経由）は従来の全域検索へフォールバック。 */
    const target = (state.book && state.chapter != null)
        ? (_findVerseInChapter(state.book, state.chapter, state.verse) || _findVisibleVerseBlock(state.verse))
        : _findVisibleVerseBlock(state.verse);

    if (!target) {
        console.warn('applyShareState: verse not found:', state.verse);
        return;
    }

    target.scrollIntoView({ block: 'center' });

    if (typeof target.onclick === 'function') {
        target.click();   /* ← ユーザーの節タップと同一経路 */

        /* 位置の微調整: パネルが開いた後、節を「パネル上端より上の可視領域」の
           中央へ置き、節と StudyPanel を同時に読める位置にする。調整後の位置を
           既存の AppState.saveScroll() で保存し直すことで、パネルを閉じた時も
           この読書位置へ戻る（既存のスクロール復元機構をそのまま利用）。 */
        requestAnimationFrame(() => {
            const area  = document.getElementById('main-reading-area');
            const panel = document.getElementById('bottom-depth-panel');
            if (!area || !panel) return;
            const aRect = area.getBoundingClientRect();
            const vRect = target.getBoundingClientRect();
            /* パネルはスライドイン中（transform 遷移）で getBoundingClientRect が
               まだ画面外を指すため、transform の影響を受けない offsetHeight から
               最終位置（ビューポート下端 − パネル高さ）を計算する */
            const visibleBottom = panel.classList.contains('open')
                ? Math.max(aRect.top + 40, window.innerHeight - panel.offsetHeight)
                : aRect.bottom;
            const desiredCenter = (aRect.top + visibleBottom) / 2;
            const delta = (vRect.top + vRect.height / 2) - desiredCenter;
            if (Math.abs(delta) > 1) area.scrollTop += delta;
            AppState.saveScroll();
        });
    } else {
        /* ギリシャ語データの無い本文などタップ不可の節: 従来どおり選択状態のみ
           復元する（タップしても何も起きない節でパネルを無理に開かない） */
        AppState.toBrowsing(state.verse, words);
        notifyAppStateChange();
        return;
    }

    /* 2. word復元（StudyPanel描画後に1フレーム遅延・従来どおり panel=study 時のみ）
       注: StudyPanelの語一覧は .word-card ではなく .wlv-chip（data-token-id属性、
       VR-2 Phase 2）で構成されている（実機検証で確認済み）。既存の
       _wlvChipClick / _wlvStudyBtnClick 経路（「詳しく見る」ボタンと同じ処理）を再利用する。 */
    if (state.panel !== 'study' || !state.word) return;
    const idx = words.findIndex(w => normalizeStrong(w.strong) === 'G' + state.word);
    if (idx === -1) {
        console.warn('applyShareState: word not found:', state.word);
        return;
    }
    const tokenId = words[idx].tokenId;
    /* chip の探索先は Desktop の #word-list-view と Mobile の #mobile-inspector-area の両方。
       MobileVerseView の一覧は非同期描画のため、見つかるまで一定フレーム再試行する
       （Desktop では従来どおり最初のフレームで見つかる）。 */
    let _shareWordTries = 0;
    const _tryShareWord = () => {
        const chipEl = document.querySelector(
            '#word-list-view .wlv-chip[data-token-id="' + tokenId + '"], ' +
            '#mobile-inspector-area .wlv-chip[data-token-id="' + tokenId + '"]');
        if (!chipEl) {
            if (++_shareWordTries < 90) { requestAnimationFrame(_tryShareWord); return; }
            console.warn('applyShareState: word chip not found:', state.word);
            return;
        }
        _wlvChipClick(chipEl, tokenId);
        _wlvStudyBtnClick();
    };
    requestAnimationFrame(_tryShareWord);
}

/* ══════════════════════════════════════════
   グローバル breadcrumb（空間ナビゲーション）
   ══════════════════════════════════════════ */
function renderGlobalBreadcrumb() {
    const el = document.getElementById('global-breadcrumb');
    if (!el) return;

    const loc = AppState.location;
    if (!loc.testament) {
        el.innerHTML = '<span class="gbc-item current">聖書</span>';
        return;
    }

    const testamentLabel = loc.testament === 'nt' ? '新約聖書' : '旧約聖書';
    const items = [];

    /* 聖書全体（testament）- クリックで書物一覧へ */
    items.push(`<button class="gbc-item" onclick="_gbcGoTestament()">${testamentLabel}</button>`);

    if (loc.book) {
        items.push(`<span class="gbc-sep">›</span>`);
        /* 書物 - クリックで章一覧へ（BOOK_SHORT 経由の略称を使用） */
        items.push(`<button class="gbc-item" onclick="_gbcGoBook()">${_bookShortTitle(loc.book)}</button>`);
    }

    if (loc.chapter !== null) {
        const _maxCh = loc.book ? loc.book.ch : 1;
        const _ch    = loc.chapter;
        items.push(`<span class="gbc-sep">›</span>`);
        /* 章 - 左右矢印で前後章へ、中央クリックで現在章を再表示 */
        items.push(
            `<span class="gbc-item current gbc-chapter-nav">` +
            `<button class="gbc-ch-arrow" onclick="event.stopPropagation();_gbcPrevChapter()" aria-label="前の章"${_ch <= 1 ? ' disabled' : ''}>◀</button>` +
            `<button class="gbc-ch-label" onclick="_gbcGoChapter()">${_ch}章</button>` +
            `<button class="gbc-ch-arrow" onclick="event.stopPropagation();_gbcNextChapter()" aria-label="次の章"${_ch >= _maxCh ? ' disabled' : ''}>▶</button>` +
            `</span>`
        );

        /* 読み方：5項目のみ。BUN / DISCOURSE / 翻訳IDは表示しない */
        const _GBC_MODE_LABELS = {
            'JA1955':      '口語訳',
            'WORD_ORDER':  '語順で読む',
            'DA_READING': '文の構造で読む',
            'ROLE_READING': '語の役割で読む',
        };
        const _modeLabel = _GBC_MODE_LABELS[_transA];
        if (_modeLabel) {
            items.push(`<span class="gbc-sep">›</span>`);
            items.push(`<button class="gbc-item" onclick="_gbcGoMode()">${_modeLabel}</button>`);
        }
    }

    el.innerHTML = items.join('');
}

/* 書物の短縮名（ウィンドウタブ表示用）。
   優先順位: book.shortTitle（将来 books.json に個別指定が追加された場合の
   フック。現状は全書物未設定で常にフォールバックする）
   → BOOK_SHORT[key]（既存。パンくず・最近見た節/単語・ブックマーク・
   メモ一覧など7箇所以上で既に使われている短縮表記。「出エジプト記」→
   「出エジプト」のように「記」「上/下」等を落とした形。books.json の
   book.name（フルタイトル）自体は変更しない）
   → book.name（既存のBOOK_SHORTに無い場合のみ、フルタイトルそのまま）。 */
function _bookShortTitle(book) {
    if (!book) return '';
    return book.shortTitle || BOOK_SHORT[book.key] || book.name;
}

/* タブ表示用の安全な最終フォールバック（rule③のtruncate相当）。
   現行データでは実際には発動しない長さだが、将来の書物追加・
   表示名変更に備えた保険として残す。 */
function _truncateTabLabel(s, max = 20) {
    if (!s) return s;
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

function _bibleHeaderLabel() {
    const loc = AppState.location;
    if (!loc.testament) return '聖書';
    if (!loc.book) return loc.testament === 'nt' ? '新約聖書' : '旧約聖書';
    const shortName = _bookShortTitle(loc.book);
    return loc.chapter != null ? `${shortName} ${loc.chapter}章` : shortName;
}

function updateHeader(view) {
    const label = view === 'bible' ? _bibleHeaderLabel() : (VIEW_LABELS[view] || '');
    const tabLabel = _truncateTabLabel(label, 20);
    document.title = tabLabel ? `${tabLabel}｜聖書アプリ` : '聖書アプリ';
    /* view-title は互換のため維持（該当要素が無い環境でも安全な no-op）。
       将来復活した場合に備え、こちらは短縮前のフルlabelを使う
       （フルタイトルは変更しない、という原則のため）。 */
    const titleEl = document.getElementById('view-title');
    if (titleEl) titleEl.innerText = label;
}

function updateBreadcrumb(view) {
    if (view === 'bible') {
        renderGlobalBreadcrumb();
        return;
    }
    const el = document.getElementById('global-breadcrumb');
    if (!el) return;
    /* 聖書の testament/book/chapter 固定表示を残さない：非bibleビューでは
       現在のビュー名のみを表示する単純なパンくずに切り替える。
       VIEW_LABELS の値はすべて本ファイル内の定数（ユーザー入力やentry.*データではない）。 */
    const label = VIEW_LABELS[view] || '';
    el.innerHTML = `<span class="gbc-item current">${label}</span>`;
}

function updateSidebarActive(view) {
    Object.values(SIDEBAR_VIEW_NAV_IDS).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
    });
    const activeId = SIDEBAR_VIEW_NAV_IDS[view];
    if (activeId) {
        const el = document.getElementById(activeId);
        if (el) el.classList.add('active');
    }
}

function syncUIFromState() {

/* ══════════════════════════════════════════
   ナビゲーションヘルパー
   翻訳選択（transA/transB/mode）を保持したまま遷移する
   ══════════════════════════════════════════ */
function _navTo(book, ch) {
    const url = ShareURLService.generate({
        book,
        chapter: ch,
        verse: '',
        transA: _transA,
        transB: _transB,
        mode: _transMode,
    });

    /* ピッカー／節詳細表示からの遷移は、開閉履歴と内部状態を安全に初期化するため従来どおり再読み込みする。 */
    const mobileVerseView = document.getElementById('mobile-verse-view');
    const mobileBookPicker = document.getElementById('mobile-book-picker');
    const mobileModePicker = document.getElementById('mobile-mode-picker');
    const hasTransientOverlay =
        mobileVerseView?.classList.contains('open') ||
        mobileBookPicker?.classList.contains('mbp-open') ||
        mobileModePicker?.classList.contains('mmp-open');

    const area = document.getElementById('bible-text-area');
    if (hasTransientOverlay) {
        if (area) area.style.opacity = '0';
        setTimeout(() => { window.location.href = url.href; }, 150);
        return;
    }

    /* 通常の章移動はページ全体を再読み込みせず、既存の本文再描画経路を使う。
       非表示にしてから再描画すると失敗／キャンセル時に本文が透明のまま残るため、
       通常経路では opacity を変更しない。 */
    if (document.getElementById('bottom-depth-panel')?.classList.contains('open')) {
        closeStudyPanel();
    }
    closeMobileSidebar();
    history.pushState({ chapterNavigation: true }, '', url.href);

    renderCurrentPage().then(rendered => {
        if (rendered === false) return;
        const mainArea = document.getElementById('main-reading-area');
        if (mainArea) mainArea.scrollTop = 0;
        requestAnimationFrame(() => {
            if (area) area.style.opacity = '1';
        });
    }).catch(() => {
        if (area) area.style.opacity = '1';
    });
}

function _gbcGoChapter() {
    /* 現在の章を再表示 */
    if (AppState.location.book && AppState.location.chapter !== null) {
        _navTo(AppState.location.book.key, AppState.location.chapter);
    }
}

function _gbcPrevChapter() {
    const loc = AppState.location;
    if (!loc.book || loc.chapter === null) return;
    const prev = loc.chapter - 1;
    if (prev >= 1) _navTo(loc.book.key, prev);
}

function _gbcNextChapter() {
    const loc = AppState.location;
    if (!loc.book || loc.chapter === null) return;
    const next = loc.chapter + 1;
    if (next <= loc.book.ch) _navTo(loc.book.key, next);
}

/**
 * depth stack にエントリを追加し、履歴を再描画する。
 * @param {Object} entry - { type, label, verse?, strong? }
 */
function pushDepth(entry) {
    AppState.depth.stack.push(entry);
    renderDepthHistory();
}

/**
 * 戻るボタンの表示内容（アイコン＋ラベル）。「履歴のどこへ戻るか」ではなく
 * 「今閉じようとしているレイヤーは何か」を表す。HIGに寄せて、階層を1段
 * 戻る場合はchevron「‹」、Panelそのものを閉じる場合は close「×」を使い分ける。
 * 現在の _panelContentMode（'word' = 単語詳細 / それ以外 = 節Panel）だけを見て、
 * 履歴（depth stack の中身）は一切参照しない。
 * renderDepthHistory() と _mobileOpenPanel() の両方から呼ばれる唯一の定義。
 */
function _panelBackState() {
    return (_panelContentMode === 'word') ? '‹' : '×';
}

/**
 * 戻るボタンのアイコン・ラベルをデスクトップ・モバイル両方に反映する。
 * 表示/非表示の制御は renderDepthHistory() が担う。
 * _panelContentMode だけを参照し、depth stack は一切見ない。
 */
function updatePanelBackButton() {
    const icon = _panelBackState();

    const btnIcon = document.getElementById('panel-back-icon');
    const btn     = document.getElementById('panel-back-btn');
    if (btnIcon) btnIcon.textContent = icon;
    if (btn)     btn.style.display   = 'flex';

    const mobileIcon = document.getElementById('mobile-panel-back-chevron');
    if (mobileIcon) mobileIcon.textContent = icon;
}

/**
 * 戻るボタンの表示/非表示とアイコン・ラベルを再描画する。
 * Panel が閉じている場合、または depth stack が空の場合は非表示。
 * Panel が開いており stack に戻り先がある場合（直接 Level 3 への遷移を含む）は表示する。
 */
function renderDepthHistory() {
    const btn = document.getElementById('panel-back-btn');
    if (!btn) return;

    const panelOpen = !!document.getElementById('bottom-depth-panel')?.classList.contains('open');
    const stack = AppState.depth.stack;
    if (!panelOpen || stack.length === 0) {
        btn.style.display = 'none';
        return;
    }

    updatePanelBackButton();
}

/**
 * StudyPanel の戻るボタン（デスクトップ #panel-back-btn / モバイル #mobile-panel-back /
 * モバイルスワイプ _mobileSwipeBack 共通）。
 *
 * 履歴（depth stack）は復元しない。Panelは常に3階層として扱い、現在開いている
 * レイヤーだけを判定して閉じる：
 *   Level 3（単語詳細 / _panelContentMode === 'word'）:
 *     - verse-flow がスタックにある（節タップ → 第二層 → 第三層）: Level 2（節Panel）へ戻る
 *     - verse-flow がない（本文から直接 Level 3）: Panel自体を閉じて本文へ戻る
 *   Level 2（節Panel  / _panelContentMode === 'verse'） → Panel自体を閉じる（本文は変更しない）
 * Level 1（Panel非表示）ではボタン自体が表示されないため、本関数は呼ばれない。
 */
function panelGoBack() {
    if (_panelContentMode === 'word') {
        if (AppState.studyOrigin?.entryPoint === 'wlv') {
            /* WLV-origin: verse-flow がスタックにある場合のみ Level 2（節word-list）へ戻る。
               ない場合（本文チップを直接タップして Level 3 へ進んだ）は Panel を閉じる。 */
            const hasVerseFlow = AppState.depth.stack.some(e => e.type === 'verse-flow');
            if (hasVerseFlow) {
                _openWordListInternal(AppState.selectedVerse.vNum, AppState.selectedVerse.elWords);
                /* #word-list-view は _openWordListInternal() 内で再生成されるため、
                   Level 3 へ進む直前に保存しておいたスクロール位置をここで読み戻す。 */
                if (_versePanelScrollTop != null) {
                    const listEl = document.getElementById('word-list-view');
                    if (listEl) listEl.scrollTop = _versePanelScrollTop;
                    _versePanelScrollTop = null;
                }
                renderDepthHistory();
            } else {
                /* 本文から直接 Level 3 へ進んだ: Panel を閉じて本文に戻る */
                closeStudyPanel();
            }
        } else {
            /* 非WLV-origin (HIERARCHICAL / RK / CF / 不明): Reading Surfaceが見えるようにPanelを閉じる */
            closeStudyPanel();
        }
    } else {
        /* Level 2 → Panelを閉じる。本文表示（章/節）は変更しない */
        closeStudyPanel();
    }
}

/* 内部: パネルを閉じてReadingへ（depth stackは変えない） */
function _syncReadingPanelPadding() {
    /* 全画面モードではパネルが背面を覆うため padding 補正は不要 */
    if (window.innerWidth <= 768) return;
    const area  = document.getElementById('main-reading-area');
    const panel = document.getElementById('bottom-depth-panel');
    if (!area || !panel) return;
    area.style.paddingBottom = panel.classList.contains('open') ? panel.offsetHeight + 'px' : '';
}

function _closeStudyPanelInternal() {
    const sidePanel    = document.getElementById('bottom-depth-panel');
    sidePanel.classList.remove('open');
    _syncReadingPanelPadding();

    const notesWrap = document.getElementById('reading-notes-wrap');
    /* close直前にスクロール位置を StudyPanelState へ保存（open後の2段rAFで復元する） */
    if (notesWrap) StudyPanelState.scrollTop = notesWrap.scrollTop;
    /* display:none で隠す。innerHTML破棄は禁止（DOMを維持して次のopenで位置を復元する） */
    if (notesWrap) { notesWrap.style.display = 'none'; }
    const notesArea = document.getElementById('reading-notes-area');
    /* クラスのみリセット。innerHTML = '' は禁止（_renderReadingNotes が全量置換するため不要） */
    if (notesArea) { notesArea.classList.remove('reading-deep-active'); }

    StudyPanelState.isOpen = false;

    document.getElementById('open-panel-btn').style.display =
        AppState.canReopen() ? 'block' : 'none';

    const rcb = document.getElementById('rcb-container');
    if (rcb) rcb.classList.remove('visible');

    const listEl = document.getElementById('word-list-view');
    if (listEl) listEl.remove();

    document.querySelectorAll('.verse-block').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.verse-pair-right').forEach(b => b.classList.remove('selected'));
    document.getElementById('active-v').innerText = '';

    document.getElementById('app').classList.remove('mobile-study-open');

    const panelEl = document.getElementById('bottom-depth-panel');
    if (panelEl) {
        panelEl.style.transform = '';
        panelEl.style.transition = '';
        /* inline height は消すが、ユーザー調整高さは StudyPanelState.height（SSOT）に
           保持されており、次回 open 時に _applyPanelHeightFromState() が復元する */
        panelEl.style.height = '';
    }

    if (window.App.onboarding) window.App.onboarding.onStudyPanelClosed();
    AppState.toReading();
    AppState.restoreScroll();
}

/* ── モバイル専用：フルスクリーン切り替えヘルパー ── */
function _isMobile() {
    return window.innerWidth <= 900;
}

/* コンテンツルーティング専用判定。幅だけでなくタッチ端末かどうかも見る。
   デスクトップをウィンドウ幅で縮小した場合に StudyPanel 経路を維持するため、
   openVerseInspector / openInspectorDetail / 本文FLOW chip の3か所でのみ使う。
   _isMobile() 自体は他用途（パネル高さ・スワイプ・CSS変数取得等）でそのまま使い続ける。 */
function _isActualMobile() {
    return window.innerWidth <= 900 && navigator.maxTouchPoints >= 1;
}

/* Study Panel（Bottom Sheet）の現在のコンテンツ種別。ドラッグ時の拡張上限を決めるためだけに使う。
   'verse' = 節全体の研究モード（_openWordListInternal）→ 拡張上限 --panel-expanded-h
   'word'  = 単語詳細（openStudyPanel）                  → 拡張上限 --panel-word-max-h */
let _panelContentMode = 'verse';

/* ── Panel Geometry SSOT ──
   高さの数値定義は CSS（#bottom-depth-panel のカスタムプロパティ）が唯一の真実。
   JS は本関数で getComputedStyle から読むだけで、vh/px の値を直接書かない。
   ドラッグ・高さ復元の clamp（min/max）はすべてここを通す。 */
function _panelGeomLimits(panel) {
    const cs = getComputedStyle(panel);
    const px = (v) => {
        v = String(v).trim();
        if (v.endsWith('vh')) return window.innerHeight * parseFloat(v) / 100;
        return parseFloat(v) || 0;
    };
    const maxProp = _panelContentMode === 'word'
        ? '--panel-word-max-h' : '--panel-expanded-h';
    return {
        minH: px(cs.getPropertyValue('--panel-drag-min-h')),
        maxH: px(cs.getPropertyValue(maxProp)),
    };
}

/* Level 2（節Panel）→ Level 3（単語詳細）へ進む直前の #word-list-view のスクロール位置。
   #word-list-view は Level 3 に入ると破棄されるため、panelGoBack() で Level 2 に
   戻った際にここへ保存しておいた値を読み戻すことでスクロール位置を復元する。
   null は「復元すべき位置が無い」を意味する（新しい節を開いた場合等）。 */
let _versePanelScrollTop = null;

/* StudyPanel UI状態の一元管理オブジェクト。
   UIロジック（open/close/drag）はこのオブジェクトを通じて状態を読み書きし、
   DOM状態・AppState・スクロール位置と混在させない。
   scrollTop: close直前に保存し、次のopen後に2段rAFで復元する。
   isDragging: pointer capture 中のみ true。pointerup/cancel で必ず false に戻す。 */
const StudyPanelState = {
    isOpen:    false,
    height:    0,   /* ユーザーが調整したパネル高さ（px）。0 = 未調整（CSS既定）。SSOT */
    scrollTop: 0,
    isDragging: false,
};

/* StudyPanelState.height（SSOT）を open 時にパネルへ適用する。
   - 0（未調整）なら inline height を消して CSS 既定に任せる
   - ≤768px は全画面モード（CSS top/bottom 管理）のため height を書かない
   - 適用時のみ現在の帯域の min/max へ clamp する（state の値は上書きしない —
     Level 3 の上限 80vh で縮んでも、Level 2 へ戻れば元の高さに復元される） */
function _applyPanelHeightFromState(panel) {
    if (!panel) return;
    if (window.innerWidth <= 768) { panel.style.height = ''; return; }
    const h = StudyPanelState.height;
    if (!h) { panel.style.height = ''; return; }
    const isMobile = _isMobile();
    const { minH, maxH } = _panelGeomLimits(panel);   /* Geometry SSOT（CSS）から取得 */
    const nh = Math.min(maxH, Math.max(minH, h));
    if (isMobile) panel.style.setProperty('height', nh + 'px', 'important');
    else panel.style.height = nh + 'px';
}

/* 本文（左カラム）の節要素を節番号から特定する。
   注意：左カラムの .verse-block には data-vnum 属性が付与されない（data-vnumがあるのは
   並列訳の右カラム .verse-pair-right のみで、しかも単一表示モードでは display:none）。
   そのため節番号は描画済みの .v-num のテキストで照合する（ref文字列の解析は行わない）。 */
function _findVisibleVerseBlock(vNum) {
    if (vNum == null) return null;
    const target = String(vNum);
    const blocks = document.querySelectorAll('#bible-text-area .verse-block:not(.verse-pair-right)');
    for (const b of blocks) {
        const numEl = b.querySelector('.v-num');
        if (numEl && numEl.textContent.trim() === target) return b;
    }
    return null;
}

/* applyShareState 用: 章スコープ内で節ブロックを検索する。
   複数章がDOMにある場合でも bookKey/chapterStr で一致する chapter-block 内のみを対象とする。
   chapter-block が存在しない場合は null（呼び出し元で _findVisibleVerseBlock にフォールバック）。 */
function _findVerseInChapter(bookKey, chapterStr, vNumStr) {
    if (!bookKey || chapterStr == null) return null;
    const cb = document.querySelector(
        `.chapter-block[data-book="${bookKey}"][data-chapter="${chapterStr}"]`
    );
    if (!cb) return null;
    const target = String(vNumStr);
    for (const b of cb.querySelectorAll('.verse-block:not(.verse-pair-right)')) {
        const numEl = b.querySelector('.v-num');
        if (numEl && numEl.textContent.trim() === target) return b;
    }
    return null;
}

/**
 * StudyPanel を開いた直後に呼ぶ。
 * 選択節の底辺が読書エリアの底辺より下にある場合のみ、差分だけ scrollBy する（最小限）。
 * scrollIntoView 禁止 / 固定px禁止 / wasOpen=true（Level間遷移）では何もしない。
 * ※ モバイルでの読書エリア収縮（padding でなく flex-basis の高さ計算）は CSS 側が担う。
 */
function _adjustReadingAreaForPanel(wasOpen) {
    if (wasOpen) return;
    /* 全画面モードではパネルが画面全体を覆うため位置調整不要 */
    if (window.innerWidth <= 768) return;

    const mainArea = document.getElementById('main-reading-area');
    if (!mainArea) return;

    /* 選択節が読書エリアの可視底辺を超えている場合のみ最小限スクロール。
       モバイル・デスクトップ共に containerRect.bottom = 読書エリアの実効下端（パネル補正不要）。 */
    const vNum    = AppState.selectedVerse?.vNum ?? AppState.inspect.data?.verse;
    const verseEl = _findVisibleVerseBlock(vNum);
    if (!verseEl) return;

    const containerRect   = mainArea.getBoundingClientRect();
    const verseBottom     = verseEl.getBoundingClientRect().bottom;

    if (verseBottom > containerRect.bottom) {
        const MARGIN = 16;
        mainArea.scrollBy({ top: verseBottom - containerRect.bottom + MARGIN, behavior: 'smooth' });
    }
}

/* Study Panel を開くとき、モバイルではBottom Sheetのスライドイン遷移を起動 */

    if (window.innerWidth <= 768) {

/* WORD_ORDER → JA1955: 同期描画後に口語訳テキストを非同期注入する。
   _openWordListInternal / _mobileInspectorRender の描画完了後に fire-and-forget で呼ぶ。 */
async function _fillStudyPanelTranslation(transId, vNum, bookKey, ch, container, words) {
    const data = await _fetchTranslation(transId, bookKey, String(ch));
    if (!data || !data.verses) return;
    const text = data.verses[String(vNum)];
    if (text == null) return;
    if (!container.isConnected) return;   // パネルが閉じられていたら中止
    if (_mobileVerseInspectorMode === 'detail') return;  // Level3（単語詳細）表示中は注入しない
    const rep = buildRepresentation(
        { kind: 'translation', translationId: transId },
        { verseRef: { book: bookKey, chapter: ch, verse: vNum }, tokens: [] },
        null,
        text
    );
    container.innerHTML = renderColumn(rep);
    _wlvChipCache = [];
    /* 口語訳で描画を置き換えても、PC版の読書メモ・本文批評欄を再配置する。 */
    _ensureStudyPanelReadingSections(container, words, bookKey, ch, vNum);
}

/* PC版 StudyPanel の節読書メモ・本文批評欄を、描画後に必ず確保する。
   mobile inspector の表示経路には介入しない。 */
function _ensureStudyPanelReadingSections(container, words, bookKey, ch, vNum) {
    if (!container) return;
    let passageSlot = container.querySelector('#wlv-passage-note-slot');
    if (!passageSlot) {
        container.insertAdjacentHTML('afterbegin', '<div id="wlv-passage-note-slot"></div>');
        passageSlot = container.querySelector('#wlv-passage-note-slot');

    if (passageSlot && !container.querySelector('#wlv-apparatus-slot')) {
        passageSlot.insertAdjacentHTML('afterend', '<div id="wlv-apparatus-slot"></div>');
    }
    _fillWallacePassageNote(words || [], container);
    if (bookKey && ch != null && vNum != null) {

    }
}

/* 内部: 語形一覧を開く（depth stackは変えない） */
function _openWordListInternal(vNum, words, book, ch) {
    closeMobileSidebar();
    _wlvWordCache = words || [];
    const sidePanel    = document.getElementById('bottom-depth-panel');
    const wasOpen = sidePanel.classList.contains('open');
    /* 読書位置の保存: 閉→開の遷移時のみ。close 時の AppState.restoreScroll() は
       ここで保存した位置へ戻す。保存しないと初期値 0（＝最上部）や古い位置が
       復元されてしまう。Level間遷移（wasOpen=true）では保存しない —
       「パネルを開く前の位置」を上書きしないため。 */
    if (!wasOpen) AppState.saveScroll();
    _panelContentMode = 'verse';
    /* 高さの SSOT: ユーザーが調整した高さ（StudyPanelState.height）を尊重する。
       未調整なら CSS 既定。従来の style.height='' 一律リセットは廃止 */
    _applyPanelHeightFromState(sidePanel);
    sidePanel.classList.add('open');
    _syncStudyVerseNav();
    _syncReadingPanelPadding();
    document.getElementById('open-panel-btn').style.display = 'none';

    const notesWrap = document.getElementById('reading-notes-wrap');
    if (notesWrap) notesWrap.style.display = 'none';
    /* notesArea は display:none で隠すのみ。innerHTML = '' 禁止（DOMを維持する） */

    const rcb = document.getElementById('rcb-container');
    if (rcb) rcb.classList.remove('visible');
    const activeVEl = document.getElementById('active-v');
    if (activeVEl) activeVEl.textContent = vNum ? `${vNum}節` : '';
    _currentAnalysisParams = null;

    const existing = document.getElementById('word-list-view');
    if (existing) existing.remove();

    const listEl = document.createElement('div');
    listEl.id = 'word-list-view';
    listEl.style.cssText = 'flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;';

    if (!words.length) {
        listEl.innerHTML = `<p style="color:var(--text-sub);font-size: var(--text-caption);text-align:center;padding: var(--space-xl) var(--space-md);">この節では語形表示はまだ利用できません</p>`;
        sidePanel.appendChild(listEl);
        /* モバイルナビバー・戻るボタン・スクロール調整 */
        _mobileOpenPanel('語形一覧', wasOpen);
        updatePanelBackButton();
        _adjustReadingAreaForPanel(wasOpen);
        return;
    }

    /* Phase VR-3A/VR-3B: Flowタブの描画経路を Verse Representation Architecture 経由にする。
       renderColumn() は WordOrderRenderer（chips[] のみを入力とする）へ委譲するため、
       出力は _buildFlowTabHTML() 時代と完全一致（docs/development/verse-representation-design.md）。
       book / ch は描画時コンテキスト（明示引数）を優先し、省略時は AppState.location にフォールバック。 */
    {
        const _bk        = book || AppState.location.book;
        const _vrBookKey = _bk ? _bk.key : '';
        const _vrCh      = ch != null ? ch : (AppState.location.chapter != null ? AppState.location.chapter : null);
        const _vrVerse   = buildVerse(_vrBookKey, _vrCh, vNum, words);
        const _spMode    = _studyPanelCompanionMode(_transA);
        if (_spMode === 'DA_READING' && _sdChapterDataForRender) {
            /* RK_READING → DA_READING: 既存 renderDAReadingView を節単位で再利用 */
            renderDAReadingView(listEl, _sdChapterDataForRender, words);
            _wlvChipCache = [];
        } else {
            const _vrRep = buildRepresentation({ kind: 'wordOrder' }, _vrVerse, getAnalysis(_vrVerse));
            /* VR-4-C Step 5: 「本文がFLOW表示中か」の判定はここ（呼び出し元）で解決し、
               WordOrderRenderer へは解決済みの真偽値のみを渡す（旧実装の "修正B" 判定を移設）。 */
            const _showOnboardingAnchor = _toColumnMode(_transA).kind !== 'wordOrder'
                && !!(window.App.onboarding && !window.App.onboarding.getState().onboardingComplete);
            /* VR-5-H-12: legend 表示可否も呼び出し元で解決し、Renderer へは真偽値のみ渡す
               （render() 内の window.App.onboarding 直参照を撤去。旧: onboardingComplete で凡例表示）。 */
            const _showOnboardingLegend = !!(window.App.onboarding?.getState()?.onboardingComplete);
            listEl.innerHTML = renderColumn(_vrRep, { showOnboardingAnchor: _showOnboardingAnchor, showOnboardingLegend: _showOnboardingLegend });
            /* Phase VR-4B-3: 表示に使った chips[] をクリック時まで保持する（Interaction Lifecycle是正）。
               StudyPanel は常に1節分のみ表示するシングルトンのため、_wlvWordCache と対のグローバル
               キャッシュで足りる（複数節同時表示する Greek Flow View / 本文左列とは異なる方式）。 */
            _wlvChipCache = (_vrRep && _vrRep.chips) ? _vrRep.chips : [];
            if (_spMode === 'JA1955') {
                /* WORD_ORDER → JA1955: 語順を即時表示後、口語訳テキストで非同期上書き */
                _fillStudyPanelTranslation('JA1955', vNum, _vrBookKey, _vrCh, listEl, words);
            }
        }
    }
    sidePanel.appendChild(listEl);
    /* PC版の節読書メモと本文批評欄を、通常表示・口語訳表示の両方で維持する。 */
    const _noteBook = book || AppState.location.book;
    const _noteBookKey = _noteBook ? _noteBook.key : '';
    const _noteChapter = ch != null ? ch : (AppState.location.chapter != null ? AppState.location.chapter : null);
    _ensureStudyPanelReadingSections(listEl, words, _noteBookKey, _noteChapter, vNum);

    /* モバイルナビバー・戻るボタン・スクロール調整 */
    const chapterLabel = vNum ? vNum + '節' : '';
    _mobileOpenPanel(chapterLabel || '語形一覧', wasOpen);
    updatePanelBackButton();
    _adjustReadingAreaForPanel(wasOpen);
}

function loadDict() {
    if (abbottSmithDict) return Promise.resolve(abbottSmithDict);
    if (abbottSmithDictPromise) return abbottSmithDictPromise;

    abbottSmithDictPromise = (async () => {
        try {
            const resAbbott = await fetch('../assets/data/abbott-smith.tsv');
            if (!resAbbott.ok) throw new Error(`Abbott-Smith fetch failed: ${resAbbott.status}`);
            const textAbbott = await resAbbott.text();
            const parsed = {};
            textAbbott.split(/\r?\n/).forEach(row => {
                const cols = row.split('\t');
                const strong = String(cols[0]).trim();
                if (strong) parsed[strong] = { description: cols[4]?.trim() || "" };
            });
            abbottSmithDict = parsed;
            return abbottSmithDict;
        } catch (e) {
            /* 失敗時は未読込状態を維持し、次回の要求で再試行できるようにする。 */
            console.error("Dict Error:", e);
            return null;
        } finally {
            abbottSmithDictPromise = null;
        }
    })();

    return abbottSmithDictPromise;
}
