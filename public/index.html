/* ══════════════════════════════════════════
   モバイル比較モード：1節ナビゲーション
   ══════════════════════════════════════════ */
let _mobileVerseList = [];   // { book, chapter, vnum } の配列（Phase 3-7-F: 章識別追加）
let _mobileVerseIdx  = 0;    // 現在表示中のインデックス

function _mobileCompareSetup() {
    if (window.innerWidth > 768) return;
    const area = document.getElementById('main-reading-area');
    if (!area || !area.classList.contains('compare-mode')) return;

    // 節リストを mobile-verse-group から収集（Phase 3-7-F: book/chapter/vnum で章識別）
    const groups = area.querySelectorAll('#bible-text-area .mobile-verse-group[data-vnum]');
    _mobileVerseList = Array.from(groups).map(g => ({
        book:    g.dataset.book    || '',
        chapter: g.dataset.chapter || '',
        vnum:    g.dataset.vnum    || '',
    }));
    if (_mobileVerseList.length === 0) return;

    _mobileVerseIdx = 0;
    _mobileVerseApply();

    const nav = document.getElementById('mobile-verse-nav');
    if (nav) nav.style.display = 'flex';
}

function _mobileVerseApply() {
    const area = document.getElementById('main-reading-area');
    if (!area) return;
    const cur = _mobileVerseList[_mobileVerseIdx];

    /* Phase 3-7-F: book + chapter + vnum の三つ組で対象を特定する。
       同じ節番号が異なる章に存在しても別章の節を誤選択しない。 */
    area.querySelectorAll('#bible-text-area .mobile-verse-group[data-vnum]').forEach(g => {
        const match = cur &&
            g.dataset.book    === cur.book &&
            g.dataset.chapter === cur.chapter &&
            g.dataset.vnum    === cur.vnum;
        g.style.display = match ? '' : 'none';
    });

    // ナビ表示を更新
    const numEl = document.getElementById('mvn-verse-num');
    if (numEl) numEl.textContent = cur ? cur.vnum : '';
    const prev = document.getElementById('mvn-prev');
    const next = document.getElementById('mvn-next');
    if (prev) prev.disabled = _mobileVerseIdx === 0;
    if (next) next.disabled = _mobileVerseIdx === _mobileVerseList.length - 1;

    // 先頭にスクロール
    const mainArea = document.getElementById('main-reading-area');
    if (mainArea) mainArea.scrollTop = 0;
}

function _mobileVerseNav(delta) {
    const next = _mobileVerseIdx + delta;
    if (next < 0 || next >= _mobileVerseList.length) return;
    _mobileVerseIdx = next;
    _mobileVerseApply();
}

function _mobileCompareTeardown() {
    const nav = document.getElementById('mobile-verse-nav');
    if (nav) nav.style.display = 'none';
    const area = document.getElementById('main-reading-area');
    if (area) area.querySelectorAll('#bible-text-area .mobile-verse-group').forEach(g => {
        g.style.display = '';
    });
    _mobileVerseList = [];
}

function _syncStudyVerseNav() {
    const nav = document.getElementById('study-verse-nav');
    const panel = document.getElementById('bottom-depth-panel');
    if (!nav || !panel) return;
    /* アプリのモバイルレイアウト基準（900px）に統一。word詳細だけを除外する。 */
    const mobileVerseView = document.getElementById('mobile-verse-view');
    /* MVV は z-index:200 で DepthPanel(z-index:150) 全体を覆う。
       節ナビも MVV 内に置き、実際に前面に出ている画面の open 状態で判定する。 */
    const wordDrawer = document.getElementById('wlv-detail-drawer');
    const isWordDrawerOpen = !!wordDrawer && wordDrawer.classList.contains('visible');
    const visible = window.innerWidth <= 768
        && !!mobileVerseView
        && mobileVerseView.classList.contains('open')
        && _panelContentMode !== 'word'
        && !isWordDrawerOpen;
    nav.classList.toggle('is-visible', visible);
    nav.style.setProperty('display', visible ? 'flex' : 'none', 'important');
    nav.style.setProperty('visibility', visible ? 'visible' : 'hidden', 'important');
    nav.style.setProperty('opacity', visible ? '1' : '0', 'important');
    nav.style.setProperty('pointer-events', visible ? 'auto' : 'none', 'important');
    /* nav は前面に出ている Mobile Verse View 内で画面右下に固定する。 */
    nav.style.setProperty('position', 'absolute', 'important');
    nav.style.setProperty('right', 'max(16px, env(safe-area-inset-right, 0px))', 'important');
    nav.style.setProperty('bottom', 'max(18px, env(safe-area-inset-bottom, 0px))', 'important');
    nav.style.setProperty('z-index', '1000', 'important');
}

function _navigateVerse(delta) {
    /* 現在の章の次の節ブロックを探してスクロール */
    const selectedBlocks = document.querySelectorAll('.verse-block.selected');
    let currentVNum = null;
    if (selectedBlocks.length > 0) {
        const vNumEl = selectedBlocks[0].querySelector('.v-num');
        if (vNumEl) currentVNum = parseInt(vNumEl.textContent.trim());
    }

    /* Phase 2A-4: 複数章が DOM にある場合に異なる章の同 vNum を誤選択しないよう、
       querySelectorAll を選択節の親 .chapter-block にスコープする。
       fallback: AppState.location の Focus Chapter → document（compare モード等）。 */
    let _navChBlock = null;
    if (selectedBlocks.length > 0) {
        _navChBlock = selectedBlocks[0].closest('.chapter-block') || null;
    }
    if (!_navChBlock) {
        const _nbk = AppState.location.book ? (AppState.location.book.key || '') : '';
        const _nch = AppState.location.chapter != null ? String(AppState.location.chapter) : '';
        if (_nbk && _nch) {
            _navChBlock = document.querySelector(`.chapter-block[data-book="${_nbk}"][data-chapter="${_nch}"]`);
        }
    }

    const allBlocks = (_navChBlock || document).querySelectorAll('.verse-pair-left, .verse-block:not(.verse-pair-left):not(.verse-pair-right)');
    const blockArr = Array.from(allBlocks);

    if (currentVNum !== null) {
        /* 現在の節の次を探す */
        let found = false;
        for (let i = 0; i < blockArr.length; i++) {
            const vEl = blockArr[i].querySelector('.v-num');
            if (!vEl) continue;
            const v = parseInt(vEl.textContent.trim());
            if (v === currentVNum + delta) {
                /* 節ブロックの既存クリック処理を通し、選択状態だけでなくStudyPanelの分析内容も更新する */
                blockArr[i].click();
                blockArr[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                found = true;
                break;
            }
        }
        if (!found) {
            /* 章末 → 次章へ遷移。章番号は scope block から直接読む（AppState.location より確実）。 */
            const _scopedCh = _navChBlock ? parseInt(_navChBlock.dataset.chapter, 10) : null;
            const _scopedBk = _navChBlock ? (_navChBlock.dataset.book || '') : '';
            const currentCh = (_scopedCh && !isNaN(_scopedCh)) ? _scopedCh : (AppState.location.chapter || 1);
            const nextCh    = currentCh + delta;
            const maxCh     = AppState.location.book ? AppState.location.book.ch : 999;
            if (nextCh >= 1 && nextCh <= maxCh) {
                /* Phase 2C-2: 隣章が DOM に存在する場合は scrollIntoView() で移動（フルリロード回避）。
                   AppState.location / URL / breadcrumb / title は Focus Chapter Observer が更新する。
                   隣章が DOM にない場合は従来の _navTo() にフォールバック。 */
                const _adjBk    = _scopedBk || (AppState.location.book ? AppState.location.book.key : '');
                const _adjBlock = _adjBk ? document.querySelector(
                    `.chapter-block[data-book="${_adjBk}"][data-chapter="${nextCh}"]`
                ) : null;
                if (_adjBlock) {
                    const _adjSel    = '.verse-pair-left, .verse-block:not(.verse-pair-left):not(.verse-pair-right)';
                    const _adjVerses = Array.from(_adjBlock.querySelectorAll(_adjSel));
                    const _adjTarget = delta > 0 ? _adjVerses[0] : _adjVerses[_adjVerses.length - 1];
                    if (_adjTarget) {
                        /* 隣章でも既存の節クリック処理を通して、選択節と分析内容を同期する */
                        _adjTarget.click();
                        _adjTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        _navTo(AppState.location.book.key, nextCh); /* 対象節なし → fallback */
                    }
                } else {
                    _navTo(AppState.location.book.key, nextCh);
                }
            }
        }
    } else {
        /* 節未選択 → 3:17へスクロール */
        for (let i = 0; i < blockArr.length; i++) {
            const vEl = blockArr[i].querySelector('.v-num');
            if (vEl && parseInt(vEl.textContent.trim()) === 17) {
                blockArr[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                break;
            }
        }
    }
}


/* ══════════════════════════════════════════
   翻訳モード管理
   ══════════════════════════════════════════ */

/* 翻訳マスター定義・変数はスクリプト先頭で宣言済み（TDZ対策） */

/*
 * transDataPath — 翻訳IDとbook/chからJSONパスを返す
 *   translations/{transId}/{book}/{ch}.json
 */
function transDataPath(transId, book, ch) {
    return `../translations/${transId}/${book}/${ch}.json`;
}

/*
 * _elTokenVerse — Greekトークン w から verse 番号文字列を返す。
 * NTトークン（bible_data/nt）は w.verse フィールドを持つ。
 * LXXトークン（bible_data/lxx）は w.verse を持たないため、
 * w.ref（"BOOK CH:VERSE!TOKEN" 形式）からコロン〜感嘆符間を切り出す。
 * どちらでも verse が取れない場合は null を返す。
 */
function _elTokenVerse(w) {
    if (w.verse != null) return String(w.verse);
    if (w.ref) {
        const c = w.ref.indexOf(':');
        if (c !== -1) {
            const b = w.ref.indexOf('!', c);
            return b !== -1 ? w.ref.slice(c + 1, b) : w.ref.slice(c + 1);
        }
    }
    return null;
}

/*
 * _buildFlowJpData — ColumnMode.kind==='wordOrder'（_transA==='FLOW'）のとき elData から
 * jpData 互換オブジェクト { verses: { "1": "", ... } } を生成する。
 * text は空文字（FLOW チップが左列を担うため）。
 * VR-4-C Step 3: 既存 translation データロードパイプライン（jpData を消費する render()
 * 等）を wordOrder でもそのまま再利用するための互換シム。ColumnMode 導入後も、
 * render() 自体を columns[] ループ設計へ全面的に作り直すまでは必要であり続けるため、
 * 削除しない（VR-4-B §C「Temporary」判定）。表示差分を発生させないことを最優先し、
 * 今回のVR-4-Cでは維持する。
 */
function _buildFlowJpData(elData) {
    if (!elData || elData.length === 0) return null;
    const verses = {};
    elData.forEach(w => {
        const v = _elTokenVerse(w);
        if (v && !(v in verses)) verses[v] = '';
    });
    if (Object.keys(verses).length === 0) return null;
    return { verses };
}

/*
 * _getVerseSource — render() が節一覧（verse一覧）として用いる resolvedJpData を、
 * ColumnMode（colA）に応じて決定する。
 * VR-5-C（VerseSource Extraction Audit）で確認した「resolvedJpData 決定ロジック」を
 * init() / renderCurrentPage() の重複箇所から抽出したもの（VR-5-D）。
 * colA.kind==='wordOrder' の場合は elData（Greekデータ）由来の _buildFlowJpData()、
 * それ以外は jpData（翻訳データ）をそのまま返す。判定ロジックのみを担い、
 * fetch・エラーハンドリングは呼び出し元に残す（挙動差異を保持するため）。
 */
function _getVerseSource(colA, jpData, elData) {
    /* DA-1: discourse も wordOrder と同じく elData（Greek）由来の VerseSource を用いる
       （訳文JSONを持たない）。判定を _isGreekReadingMode() に集約。 */
    return _isGreekReadingMode(colA.kind) ? _buildFlowJpData(elData) : jpData;
}

/*
 *   loadBook(book, translation) のエイリアスとして機能する。
 *
 *   translations/{transId}/{book}/{ch}.json を fetch する。
 *   失敗した場合は null を返す。
 */
async function _fetchTranslation(transId, book, ch) {
    try {
        const res = await fetch(transDataPath(transId, book, ch));
        if (res.ok) return await res.json();
    } catch(e) {}

    return null;
}

/*
 * loadBook — 汎用ブック読み込み関数
 *   loadBook('JHN')                  … 既定値（'JA1955'）で読み込み
 *   loadBook('JHN', 'NKJ2017')       … 指定翻訳で読み込み
 *   loadBook('JHN', 'NKJ')           … 口語訳等を明示指定
 */
async function loadBook(book, translation = 'JA1955') {
    const ch = AppState.location.chapter || 1;
    return await _fetchTranslation(translation, book, String(ch));
}

function _applyTransMode(mode) {
    _transMode = mode;
    const area = document.getElementById('main-reading-area');
    if (mode === 'compare') {
        area.classList.remove('single-mode');
        area.classList.add('compare-mode');
    } else {
        area.classList.remove('compare-mode');
        area.classList.add('single-mode');
        /* VR-5-H-6: 旧「単一表示復帰時に flow を解除」する cleanup（_rightMode 依存）は削除。
           _applyTransMode() の呼び出しは直後に必ず renderCurrentPage() を伴い、render() が
           DOM を全消去して作り直すため、この cleanup は表示上 no-op だった。 */
    }
    _updateColHeaders();
}

function _updateColHeaders() {
    _updateBibleLabel();
}

/* ── Greek Flow View: 右列表示モード切り替え ── */
function _setFlowInjection(mode) {
    /* flow タブ初回開封を onboarding へ通知 */
    if (mode === 'flow') {
        window.App.onboarding?.onFlowTabOpened();
        _syncOnboardingActiveFlag();
    }

    /* VR-5-H-4: Flow 対象列を位置クラス（.verse-pair-right）ではなく、_buildColumnBlock()
       が投影した data-col-mode="wordOrder"（= col.colMode.kind の projection）で探索する。
       これにより Flow Injection Layer が「右列」という位置に依存しなくなる。
       ※ 対象列の一般化（任意 wordOrder 列の Flow 化）は今回のスコープ外。現行 render では
         _setFlowInjection('flow') は _colB.kind==='wordOrder' の文脈で呼ばれ、通常は右列 wordOrder が
         ヒットする（挙動は従来と同一）。 */
    /* 描画時コンテキスト: AppState.location はここ（_setFlowInjection 呼び出し時）で1回だけ読む。 */
    const _fiBookKey = AppState.location.book ? AppState.location.book.key : '';
    const _fiCh      = AppState.location.chapter != null ? AppState.location.chapter : null;

    document.querySelectorAll('[data-col-mode="wordOrder"]').forEach(block => {
        const vNum = block.dataset.vnum;
        block.classList.toggle('gf-mode', mode === 'flow');

        if (mode === 'flow') {
            /* gf-verse-block がまだなければ生成 */
            if (!block.querySelector('.gf-verse-block')) {
                const words = (_cachedElByVerse && vNum) ? (_cachedElByVerse[vNum] || []) : [];
                const gfEl = document.createElement('div');
                gfEl.className = 'gf-verse-block';
                const _gfResult = _buildGfVerseBlock(vNum, words, _fiBookKey, _fiCh);
                gfEl.innerHTML = _gfResult.html;
                /* Phase VR-4B-3: chips[] をクリック時まで保持する（本文左列 block._flowChips と
                   同型）。複数節が同時に存在しうるため、単一グローバルcacheではなく
                   DOMノード単位で保存する（節取り違え防止）。 */
                gfEl._flowChips    = _gfResult.chips;
                gfEl._flowWords    = _gfResult.words;
                gfEl._flowResolved = _gfResult.analysis;
                block.appendChild(gfEl);
            }
        }
    });
}

/* ── Greek Flow View: 1節分の右列HTML生成 ── */
/**
 * Phase VR-4B-3: 戻り値を HTML 文字列単体から { html, chips, words, analysis } へ変更。
 * Greek Flow View は複数節が同時に画面上へ存在しうるため、chips[] は単一のグローバル
 * キャッシュ（_wlvChipCache）ではなく DOM ノード（gfEl._flowChips 等）へ節ごとに個別保存
 * する必要がある。呼び出し元（_setFlowInjection）がその保存を行うため、ここでは
 * 生成した chips/words/analysis をそのまま返すだけに留める（WordOrderRenderer は無変更）。
 * 唯一の呼び出し元は _setFlowInjection のみ（他に参照なし）。
 */
function _buildGfVerseBlock(vNum, words, bookKey, ch) {
    if (!words || words.length === 0) {
        return {
            html: `<p style="font-size: var(--text-caption);color:var(--text-sub);opacity: var(--opacity-secondary);padding: var(--space-sm) 0;">この節の原語データがありません</p>`,
            chips: null, words: null, analysis: null,
        };
    }
    /* Phase VR-4A: Greek Flow View を Verse Representation Architecture 経由にする。
       WordOrderRenderer は chips[] のみを入力とするため、出力は旧実装と完全一致
       （docs/development/verse-representation-design.md）。
       bookKey / ch は呼び出し元（_setFlowInjection）が描画時に確定した値を渡す。省略時は AppState.location にフォールバック。 */
    const _gfBkKey    = bookKey != null ? bookKey : (AppState.location.book ? AppState.location.book.key : '');
    const _gfBkCh     = ch      != null ? ch      : (AppState.location.chapter != null ? AppState.location.chapter : null);
    const _vrVerse    = buildVerse(_gfBkKey, _gfBkCh, vNum, words);
    const _vrAnalysis = getAnalysis(_vrVerse);
    const _vrRep      = buildRepresentation({ kind: 'wordOrder' }, _vrVerse, _vrAnalysis);
    return {
        html: WordOrderRenderer.renderGreekFlowView(_vrRep),
        chips: _vrRep.chips, words, analysis: _vrAnalysis,
    };
}

function _updateBibleLabel() {
    const el = document.getElementById('sb-bible-label-text');
    if (!el) return;
    const labelA = (TRANSLATIONS[_transA] || {}).label || _transA;
    if (_transMode === 'compare') {
        const labelB = (TRANSLATIONS[_transB] || {}).label || _transB;
        el.textContent = labelA + ' / ' + labelB;
    } else {
        el.textContent = labelA;
    }
}

/* ══════════════════════════════════════════
   モバイル：スワイプジェスチャー（右スワイプで戻る）
   Study Panel 上の端からスワイプすると本文に戻れる
   ══════════════════════════════════════════ */
function _mobileSwipeBack() {
    panelGoBack();
}
    
(function _initSwipeBack() {
    let touchStartX = 0;
    let touchStartY = 0;
    let isDragging  = false;
    const EDGE_THRESHOLD = 32;  /* 画面左端から何pxのスワイプを検知するか */
    const SWIPE_THRESHOLD = 80; /* 何px右にスワイプしたら戻るとみなすか */

    const panel = document.getElementById('bottom-depth-panel');
    if (!panel) return;

    panel.addEventListener('touchstart', (e) => {
        if (window.innerWidth > 900) return;
        if (!panel.classList.contains('open')) return;

        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        /* isDragging はまだ確定しない。touchmove で方向確認後に決める */
        isDragging  = touchStartX < EDGE_THRESHOLD ? null : false;
    }, { passive: true });

    panel.addEventListener('touchmove', (e) => {
        if (window.innerWidth > 900) return;
        if (isDragging === false) return;

        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;

        /* isDragging が未確定（null）の場合：最初の8px移動で方向を判定 */
        if (isDragging === null) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; /* まだ判定しない */
            /* 縦スクロールが主体 or 左スワイプ → 無効化 */
            if (Math.abs(dy) > Math.abs(dx) * 1.2 || dx < 0) {
                isDragging = false;
                return;
            }
            /* 右スワイプ確定 */
            isDragging = true;
        }

        /* 縦スクロールが主体なら無視 */
        if (Math.abs(dy) > Math.abs(dx) * 1.5) {
            isDragging = false;
            panel.style.transform = '';
            const mainArea = document.getElementById('main-reading-area');
            if (mainArea) { mainArea.style.transform = ''; mainArea.style.opacity = ''; }
            return;
        }

        if (dx > 0) {
            /* パネルを指の動きに追従（rubber band感） */
            panel.style.transition = 'none';
            panel.style.transform  = `translateX(${Math.min(dx, window.innerWidth)}px)`;
            /* 本文を逆方向に少し動かして奥行き感を出す */
            const mainArea = document.getElementById('main-reading-area');
            if (mainArea) {
                const ratio = dx / window.innerWidth;
                const offsetX = -24 + (24 * ratio);
                const opacityVal = 0.6 + (0.4 * ratio);
                mainArea.style.transition = 'none';
                mainArea.style.transform  = `translateX(${offsetX}px)`;
                mainArea.style.opacity    = opacityVal;
            }
        }
    }, { passive: true });

    panel.addEventListener('touchend', (e) => {
        if (window.innerWidth > 900) return;
        const wasTracking = isDragging === true || isDragging === null;
        isDragging = false;

        /* transform が動いていない場合は何もしない */
        if (!wasTracking) return;

        const dx = e.changedTouches[0].clientX - touchStartX;

        /* トランジションを戻す */
        panel.style.transition = '';
        const mainArea = document.getElementById('main-reading-area');
        if (mainArea) mainArea.style.transition = '';

        if (dx > SWIPE_THRESHOLD && panel.classList.contains('open')) {
            /* 閾値を超えた → 戻る */
            _mobileSwipeBack();
        } else {
            /* 閾値未満 or パネル未open → 元に戻す */
            panel.style.transform = '';
            if (mainArea) {
                mainArea.style.transform = '';
                mainArea.style.opacity   = '';
            }
        }
    }, { passive: true });
})();

    /* ── オンボーディング初期化 ── */
    /* ── オンボーディング用ブリッジ ──────────────────────────
       onboarding.js は 'use strict' IIFE のため index.html の
       let 変数に直接アクセスできない。window 経由で公開する。
    ─────────────────────────────────────────────────── */
    /* ── STEP8: App Namespace 初期化 ── */
    window.App = window.App || {};

    window.App.bridge = {
    activateFlowCompare: async function() {
        _transB = 'WORD_ORDER';
        _applyTransMode('compare');
        await renderCurrentPage();
        _setFlowInjection('flow');
    },
    activateCompare: async function(transBId) {
        _transB = transBId || 'BUN';
        _applyTransMode('compare');
        await renderCurrentPage();
    },
    openFlowTab: async function() {

/* ══════════════════════════════════════════
   Phase 5-2-C: RK Horizontal Scroll UX
   ══════════════════════════════════════════
   Display-layer only. Reads DOM measurements (scrollWidth, clientWidth, scrollLeft).
   Does NOT calculate or modify GL width, SVG width, viewBox, or any geometry.
   Boundary: Geometry → SVG → DOM → [this code starts here].
   ══════════════════════════════════════════ */
(function () {
    var _rafs = typeof WeakMap !== 'undefined' ? new WeakMap() : null;
    var STEP  = 80; /* px per keyboard arrow press */

    /* ── State updater ─────────────────────────────────────────────────────
       Reads live scrollWidth / clientWidth / scrollLeft from DOM.
       Sets data-role-scroll="right|left|both" when overflow exists.
       Adds tabindex="0" + aria-label on first overflow detection.
       Removes all attributes when no overflow. */
    function _update(el) {
        var sw = el.scrollWidth;
        var cw = el.clientWidth;
        if (sw <= cw + 1) {
            /* No overflow: remove all scroll-UX attributes. */
            el.removeAttribute('data-role-scroll');
            el.removeAttribute('tabindex');
            el.removeAttribute('aria-label');
            return;
        }
        /* Overflow present: classify scroll position. */
        var sl     = Math.round(el.scrollLeft);
        var atLeft = sl <= 1;
        var atRight = sl + cw >= sw - 2;
        el.setAttribute('data-role-scroll',
            atLeft && !atRight ? 'right'
            : !atLeft && atRight ? 'left'
            : 'both');
        /* tabindex / aria-label: set once, not on every scroll event. */
        if (!el.getAttribute('tabindex')) {
            el.setAttribute('tabindex', '0');
            var svg  = el.querySelector('svg[aria-label]');
            var base = svg ? svg.getAttribute('aria-label')
                           : '文の役割 構造ダイアグラム';
            el.setAttribute('aria-label', base + '（横スクロール可）');
        }
    }

    /* ── rAF-throttled scroll handler ─────────────────────────────────── */
    function _onScroll(el) {
        if (!_rafs) { _update(el); return; }
        var id = _rafs.get(el);
        if (id) cancelAnimationFrame(id);
        _rafs.set(el, requestAnimationFrame(function () {
            _rafs.delete(el);
            _update(el);
        }));
    }

    /* ── ResizeObserver: handles panel open/close and window resize ────── */
    var _ro = typeof ResizeObserver !== 'undefined'
        ? new ResizeObserver(function (entries) {
            entries.forEach(function (e) { _update(e.target); });
          })
        : null;

    /* ── Attach scroll UX to one .role-view element ────────────────────── */
    function attach(el) {
        /* Defer to next paint: scrollWidth may not be settled on insertion. */
        requestAnimationFrame(function () {
            _update(el);
            el.addEventListener('scroll', function () { _onScroll(el); },
                                { passive: true });
            if (_ro) _ro.observe(el);
        });
    }

    /* ── Keyboard handler (global delegated) ───────────────────────────── */
    document.addEventListener('keydown', function (e) {
        var el = document.activeElement;
        /* Only act when a scrollable .role-view has keyboard focus. */
        if (!el || !el.classList || !el.classList.contains('role-view')) return;
        if (!el.getAttribute('data-role-scroll')) return;
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            el.scrollBy({ left:  STEP, behavior: 'smooth' });
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            el.scrollBy({ left: -STEP, behavior: 'smooth' });
        } else if (e.key === 'Home') {
            e.preventDefault();
            el.scrollTo({ left: 0,            behavior: 'smooth' });
        } else if (e.key === 'End') {
            e.preventDefault();
            el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });
        }
    });

    /* ── window resize fallback (for browsers without ResizeObserver) ──── */
    window.addEventListener('resize', function () {
        /* Re-evaluate ALL .role-view elements: a resize may introduce or
           remove overflow on any diagram regardless of current state. */
        document.querySelectorAll('.role-view').forEach(_update);
    }, { passive: true });

    /* ── Public API ────────────────────────────────────────────────────── */
    window._roleScrollUX = { attach: attach };
})();
/* ── Phase 5-2-C end ─────────────────────────────────────────────────────── */

let _mbpLayer          = 1;    /* 1:Testament / 2:Book / 3:Chapter */
let _mbpSection        = 'nt'; /* 'nt' | 'ot' */
let _mbpBookKey        = '';
let _mbpBookName       = '';
let _mbpBookMaxCh      = 0;
let _mbpHistoryActive  = false;
let _mbpIgnoreNextPop  = false;

function _openMobileBookPicker() {
    if (window.innerWidth > 900) return; /* Desktop では無効 */

    /* 競合する UI を閉じる */
    _fabClose();
    if (StudyPanelState.isOpen) closeStudyPanel();
    closeSidebar();
    _closeMobileModePicker();

    const picker = document.getElementById('mobile-book-picker');
    if (!picker) return;

    /* picker open */
    document.getElementById('app')?.classList.add('mobile-picker-open');
    picker.classList.add('mbp-open');
    picker.setAttribute('aria-hidden', 'false');

    /* 現在地を反映した初期 layer から表示 */
    const loc = AppState.location;
    if (loc && loc.book) {
        _mbpSection   = loc.testament || 'nt';
        _mbpBookKey   = loc.book.key;
        _mbpBookName  = loc.book.name || loc.book.key;
        _mbpBookMaxCh = loc.book.ch || 0;
        _mbpLayer = 3; /* 現在 chapter 選択画面から開始 */
    } else {
        _mbpLayer = 1;
    }
    _mbpRenderLayer(_mbpLayer);

    /* Android back でこの picker を閉じるための履歴エントリ */
    _mbpPushHistory();
}

function _mbpPushHistory() {
    if (_mbpHistoryActive) return;
    _mbpHistoryActive = true;
    try { history.pushState({ __mbp: true }, ''); } catch (_) {}
}

/* DOM だけ閉じる（履歴操作なし）。popstate からも呼ばれる。 */
function _closeMobileBookPickerDOM() {
    const picker = document.getElementById('mobile-book-picker');
    if (!picker) return;
    picker.classList.remove('mbp-open');
    picker.setAttribute('aria-hidden', 'true');
    document.getElementById('app')?.classList.remove('mobile-picker-open');
    _mbpLayer = 1;
}

/* UI ボタン（×・overlay）からの close。履歴エントリも戻す（MVV パターンと同様）。 */
function _closeMobileBookPicker() {
    _closeMobileBookPickerDOM();
    if (_mbpHistoryActive) {
        _mbpHistoryActive = false;
        _mbpIgnoreNextPop = true;
        try { history.back(); } catch (_) {}
    }
}

/* ‹ 戻るボタン: layer を 1 段戻る */
function _mbpBack() {
    if (_mbpLayer <= 1) { _closeMobileBookPicker(); return; }
    _mbpLayer--;
    _mbpRenderLayer(_mbpLayer);
}

/* Layer 描画 */
function _mbpRenderLayer(layer) {
    _mbpLayer = layer;
    const content = document.getElementById('mobile-book-picker-content');
    const titleEl  = document.getElementById('mobile-book-picker-title');
    const backBtn  = document.getElementById('mobile-book-picker-back');
    if (!content || !titleEl || !backBtn) return;

    backBtn.style.display = (layer > 1) ? '' : 'none';

    if (layer === 1) {
        /* Layer 1: NT / OT 選択 */
        titleEl.textContent = '書物を選ぶ';
        content.innerHTML =
            '<div class="mbp-section-label">Testament</div>' +
            '<div class="mbp-row" onclick="_mbpSelectTestament(\'nt\')">' +
                '<span>新約聖書</span><span class="mbp-row-chevron">›</span></div>';
    } else if (layer === 2) {
        /* Layer 2: Book 一覧 */
        const testLabel = _mbpSection === 'nt' ? '新約聖書' : '旧約聖書（LXX）';
        titleEl.textContent = testLabel;
        const books = (SB_BOOKS[_mbpSection] || []);
        const curKey = AppState.location.book ? AppState.location.book.key : '';
        let html = '<div class="mbp-section-label">' + testLabel + '</div>';
        for (const b of books) {
            const isCur = (b.key === curKey) ? ' style="font-weight:700;"' : '';
            html +=
                '<div class="mbp-row" onclick="_mbpSelectBook(\'' + b.key + '\',\'' +
                _escMbp(b.name) + '\',' + b.ch + ')"' + isCur + '>' +
                '<span>' + _escMbp(b.name) + '</span>' +
                '<span class="mbp-row-chevron">›</span></div>';
        }
        content.innerHTML = html;
    } else if (layer === 3) {
        /* Layer 3: Chapter グリッド */
        titleEl.textContent = _mbpBookName || _mbpBookKey;
        const curCh = (AppState.location.book && AppState.location.book.key === _mbpBookKey)
            ? AppState.location.chapter : null;
        let html = '<div class="mbp-ch-grid">';
        for (let c = 1; c <= _mbpBookMaxCh; c++) {
            const cur = (c === curCh) ? ' current' : '';
            html += '<button class="mbp-ch-btn' + cur + '" onclick="_mbpSelectChapter(' + c + ')">' + c + '</button>';
        }
        html += '</div>';
        content.innerHTML = html;
    }
}

/* 文字列を innerHTML に安全に埋める（書名に < > が無い前提だが念のため） */
function _escMbp(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function _mbpSelectTestament(section) {
    _mbpSection = section;
    _mbpRenderLayer(2);
}

function _mbpSelectBook(key, name, maxCh) {
    _mbpBookKey   = key;
    _mbpBookName  = name;
    _mbpBookMaxCh = maxCh;
    _mbpRenderLayer(3);
}

function _mbpSelectChapter(ch) {
    _closeMobileBookPickerDOM();
    /* フラグだけクリア。_navTo() はフルリロードを行うため、
       積んだ history エントリはページ遷移で自然に消える。
       history.back() を呼ぶと非同期競合が起きるため呼ばない。 */
    _mbpHistoryActive = false;
    /* 現在 mode を継承して章移動（既存 _navTo が _transA/_transB/_transMode を使う） */
    _navTo(_mbpBookKey, ch);
}

/* ── 定数 ── */
const HL_COLORS = ['yellow', 'blue', 'green', 'red'];
const HL_COLOR_NAMES = { yellow: '黄', blue: '青', green: '緑', red: '赤' };

/* ── 操作状態（色選択・複数語選択）── */
const _hlState = {
    lastUsedColor: null,       /* null = 初回のため色選択UIを出す */
    pickerPending: null,       /* 保存待ちのハイライトエントリ */
    multiSelectActive: false,
    multiSelectEntries: [],
};

/* ── ユーティリティ ── */

/* ref 文字列 "BOOK CH:V!N" から tokenIndex (N) を整数で返す。失敗時 null */
function _hlTokenIdxFromRef(ref) {
    if (!ref) return null;
    const idx = ref.indexOf('!');
    if (idx === -1) return null;
    const n = parseInt(ref.slice(idx + 1), 10);
    return isFinite(n) && n >= 1 ? n : null;
}

/* AppState から現在の書物・章を返す。{book, chapter} または null */
function _hlCurrentContext() {
    const loc = AppState.location;
    if (!loc || !loc.book || loc.chapter == null) return null;
    return { book: loc.book.key, chapter: Number(loc.chapter) };
}

/* _currentVerseRef() に相当するが {book, chapter, verse} を構造で返す */
function _hlCurrentVersePos() {
    const book = AppState.location?.book?.key;
    if (!book) return null;
    const chapter = AppState.selectedVerse?.ch ?? AppState.location?.chapter;
    const verse = AppState.selectedVerse?.vNum;
    if (chapter == null || !verse) return null;
    return { book, chapter: Number(chapter), verse: Number(verse) };
}

/* AppState.inspect.data から語の位置を構造で返す。
   inspect.data.ref は "BOOK CH:VERSE!TOKEN_INDEX" 形式（表示用）。
   ここでは表示用 ref を分解して canonical 位置フィールドを抽出する。
   ref は canonical key としてではなく、座標の導出元として使用する。 */
function _hlCurrentWordPos() {
    const d = AppState.inspect.data;
    if (!d) return null;

    /* 位置の正本は inspect の構造化フィールド。ref は token index の抽出にだけ使う。 */
    const ref = typeof d.ref === 'string' ? d.ref : '';
    const sp = ref.split(' ');
    const cvt = sp.length > 1 ? sp[1].split(':') : [];
    const vt = cvt.length > 1 ? cvt[1].split('!') : [];
    const book = d.bookKey || d.book || sp[0] || '';
    const chapter = Number(d.ch != null ? d.ch : (cvt[0] || NaN));
    const verse = Number(d.verse != null ? d.verse : (vt[0] || NaN));
    const tokenStart = parseInt(vt[1], 10);

    if (!book || !Number.isFinite(chapter) || !Number.isFinite(verse) ||
        !Number.isFinite(tokenStart) || tokenStart < 1) return null;
    return { book: String(book), chapter, verse, tokenStart, tokenEnd: tokenStart };
}

/* ── 色ピッカー ── */

function _hlPickerClose() {
    const overlay = document.getElementById('hl-color-picker-overlay');
    const picker  = document.getElementById('hl-color-picker');
    if (overlay) overlay.classList.remove('hl-open');
    if (picker)  picker.classList.remove('hl-open');
    _hlState.pickerPending = null;
}

/* ドラッグで作ったブラウザのテキスト選択を解除する。
   選択が残ったまま同じ語を再ドラッグすると、ブラウザがテキストの
   ドラッグ操作として扱い mouseup でピッカーが開かなくなる
   （作成直後の再ドラッグで色変更・削除ができない不具合の原因）。
   ハイライトの確定・取消のタイミングで毎回片付ける。 */
function _hlClearNativeSelection() {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed) sel.removeAllRanges();
}

/* オーバーレイで閉じたときは、確定前の複数語選択の見た目も片付ける。 */
function _hlPickerDismiss() {
    const pending = _hlState.pickerPending;
    const fromTouch = _hlPickerFromTouch;
    _hlPickerFromTouch = false;
    _hlPickerClose();
    /* タッチ用ピルから開いた場合は、ハンドルで範囲調整を続けられるよう
       ネイティブ選択を残す（マウス経由は従来どおり選択を解除する）。 */
    if (!fromTouch) _hlClearNativeSelection();
    if (pending && pending._isBatch) {
        document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected'));
    }
    if (fromTouch) _hlScheduleTouchTextSelection(60);
}

function _hlPositionPicker(picker, anchorEl) {
    const selection = window.getSelection();
    let anchorRect = null;
    if (_hlState.pickerPending && _hlState.pickerPending._isBatch && selection && selection.rangeCount && !selection.isCollapsed && selection.toString().trim()) {
        try { anchorRect = selection.getRangeAt(0).getBoundingClientRect(); } catch (_) {}
    }
    if (!anchorRect || (!anchorRect.width && !anchorRect.height)) {
        const anchor = anchorEl || document.querySelector('.wlv-chip.active') || document.querySelector('#bible-text-area .verse-block');
        if (anchor) anchorRect = anchor.getBoundingClientRect();
    }

    // Portal both elements to body so they cannot remain inside a StudyPanel
    // subtree or inherit a transformed ancestor's fixed-position coordinate space.
    if (picker.parentElement !== document.body) document.body.appendChild(picker);
    const overlay = document.getElementById('hl-color-picker-overlay');
    if (overlay && overlay.parentElement !== document.body) document.body.appendChild(overlay);

    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const pw = picker.offsetWidth || 240, ph = picker.offsetHeight || 150, gap = 10, pad = 12;
    const panel = document.getElementById('bottom-depth-panel');
    const panelRect = panel && getComputedStyle(panel).display !== 'none' ? panel.getBoundingClientRect() : null;
    const overlapsPanel = (x, y) => !!panelRect && x < panelRect.right && x + pw > panelRect.left && y < panelRect.bottom && y + ph > panelRect.top;
    const clamp = (v, min, max) => Math.max(min, Math.min(v, Math.max(min, max)));
    let chosen = null;
    if (vw <= 900) {
        /* スマホ幅（アプリのモバイル表示ブレークポイント）では、ピッカーの位置を
           選択範囲に追従させず、画面の下部・中央に固定する（ボトムシート形式）。
           選択位置によって表示場所が変わらないため、操作の予測がしやすい。
           StudyPanel が開いている場合もピッカーはモーダルとして前面に出るので、
           パネルとの重なり回避は行わない。 */
        chosen = { x: clamp((vw - pw) / 2, pad, vw - pw - pad), y: clamp(vh - ph - pad, pad, vh - ph - pad) };
    } else {
        const candidates = [];
        if (anchorRect) {
            candidates.push({x: anchorRect.left, y: anchorRect.bottom + gap});
            candidates.push({x: anchorRect.right + gap, y: anchorRect.top});
            candidates.push({x: anchorRect.left - pw - gap, y: anchorRect.top});
            candidates.push({x: anchorRect.left, y: anchorRect.top - ph - gap});
        }
        if (panelRect) {
            candidates.push({x: pad, y: panelRect.top - ph - gap});
            candidates.push({x: pad, y: panelRect.bottom + gap});
            candidates.push({x: panelRect.left - pw - gap, y: pad});
            candidates.push({x: panelRect.right + gap, y: pad});
        }
        candidates.push({x: vw - pw - pad, y: pad});
        candidates.push({x: pad, y: pad});
        candidates.push({x: vw - pw - pad, y: vh - ph - pad});
        for (const c of candidates) {
            const x = clamp(c.x, pad, vw - pw - pad), y = clamp(c.y, pad, vh - ph - pad);
            if (!overlapsPanel(x, y)) { chosen = {x, y}; break; }
        }
        if (!chosen) {
            // If the panel fills almost the whole viewport, use the topmost available strip.
            const top = panelRect ? Math.min(vh - ph - pad, panelRect.top - ph - gap) : pad;
            chosen = {x: clamp((vw - pw) / 2, pad, vw - pw - pad), y: clamp(top, pad, vh - ph - pad)};
        }
    }
    picker.style.position = 'fixed';
    picker.style.left = chosen.x + 'px';
    picker.style.top = chosen.y + 'px';
    picker.style.right = 'auto';
    picker.style.bottom = 'auto';
    picker.style.transform = 'none';
}
function _hlOpenPicker(entry, anchorEl) {
    const picker = document.getElementById('hl-color-picker');
    const overlay = document.getElementById('hl-color-picker-overlay');
    /* UI要素がない場合は、以前の選択待ち状態も残さず終了する。 */
    if (!picker || !overlay) {
        _hlState.pickerPending = null;
        /* バッチ選択のピッカーを開けない場合だけ、一時選択表示を解除する。 */
        if (entry && entry._isBatch) {
            document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected'));
        }
        return;
    }
    _hlState.pickerPending = entry;
    const pickerEntries = entry._isBatch ? entry.entries : [entry];
    const sharedColor = pickerEntries.length && pickerEntries.every(item => item.color === pickerEntries[0].color) ? pickerEntries[0].color : null;
    picker.querySelectorAll('.hl-picker-swatch').forEach(s => s.classList.toggle('hl-selected', !!sharedColor && s.dataset.color === sharedColor));
    const del = picker.querySelector('.hl-picker-delete');
    if (del) del.style.display = pickerEntries.some(item => item._isExisting) ? '' : 'none';
    const actions = picker.querySelector('.hl-picker-actions');
    if (actions) actions.style.display = !entry._isBatch && entry.tokenStart != null ? 'flex' : 'none';
    overlay.classList.add('hl-open');
    picker.classList.add('hl-open');
    _hlPositionPicker(picker, anchorEl);
}

function _hlColorSelected(color) {
    const entry = _hlState.pickerPending;
    _hlPickerClose();
    _hlPickerFromTouch = false;
    _hlTouchEntries = [];
    _hlHideTouchPill();
    /* 色の確定（削除含む）でドラッグ選択は消費済み。残すと次の再ドラッグが
       テキストのドラッグ操作になり、ピッカーが開かなくなるため解除する。 */
    _hlClearNativeSelection();
    /* 保存処理に進めない場合も、確定前の選択表示だけは残さない。 */
    if (!entry || !window.App || !window.App.storage) {
        document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected'));
        return;
    }
    const entries = entry._isBatch ? entry.entries : [entry];
    entries.forEach(item => {
        if (color === null) {
            if (item._isExisting) window.App.storage.removeHighlight(item);
        } else {
            _hlState.lastUsedColor = color;
            if (item._isExisting) window.App.storage.updateHighlightColor(item, color);
            else {
                const toSave = Object.assign({}, item);
                delete toSave._isExisting;
                delete toSave.tokenId;
                toSave.color = color;
                window.App.storage.addHighlight(toSave);
            }
        }
    });
    document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected'));
    _applyHighlights();
}

/* ── 節全体ハイライト（Phase B） ── */

function _hlVerseHighlight() {
    /* 語順・文構造モードで語が選択されている場合、ヘッダーのハイライト操作はその語を対象にする。
       口語訳など、語を選択していない通常モードでは従来どおり節全体を対象にする。 */
    const wordPos = _hlCurrentWordPos();
    /* 読み方は A 列が主表示の場合もある。DA_READING の実DOMには .da-view が
       付かないため、DOMクラスだけでなく列モードの kind を正として判定する。
       列モードは現在の _transA/_transB から導出する（_colA/_colB は render 系の
       ローカル変数で、この関数のスコープには存在しない）。 */
    const isWordReadingMode = [_toColumnMode(_transA), _toColumnMode(_transB)].some(col =>
        col && (col.kind === 'wordOrder' || col.kind === 'da-reading')
    ) || !!document.querySelector('.rk-reading-view');
    if (isWordReadingMode && wordPos) {
        _hlWordHighlight();
        return;
    }

    const pos = _hlCurrentVersePos();
    if (!pos) return;

    /* 既存ハイライト確認 */
    const existing = _hlFindExisting(pos.book, pos.chapter, pos.verse, null, null);
    if (existing) {
        const entry = Object.assign({}, existing, { _isExisting: true });
        _hlOpenPicker(entry);
        return;
    }

    const entry = {
        book: pos.book, chapter: pos.chapter, verse: pos.verse,
        tokenStart: null, tokenEnd: null,
        color: 'yellow', createdAt: Date.now(),
        _isExisting: false,
    };
    _hlOpenPicker(entry);
}

/* ── 語ハイライト（Phase C/D）── */

function _hlWordHighlight() {
    const pos = _hlCurrentWordPos();
    if (!pos) return;

    const existing = _hlFindExisting(pos.book, pos.chapter, pos.verse, pos.tokenStart, pos.tokenEnd);
    if (existing) {
        const entry = Object.assign({}, existing, { _isExisting: true });
        _hlOpenPicker(entry);
        return;
    }

    const entry = Object.assign({}, pos, { color: 'yellow', createdAt: Date.now(), _isExisting: false });
    _hlOpenPicker(entry);
}

/* ── 複数語選択 ── */

function _hlShowSelectionBar(mode, count) {
    const bar = document.getElementById('hl-selection-bar'), label = document.getElementById('hl-selection-count');
    const finish = document.getElementById('hl-selection-finish');
    if (!bar) return;
    if (label) label.textContent = count + ' 語を選択中';
    if (finish) finish.style.display = mode === 'multi' ? '' : 'none';
    bar.dataset.mode = mode; bar.classList.add('hl-open');
}
function _hlHideSelectionBar() { document.getElementById('hl-selection-bar')?.classList.remove('hl-open'); }
function _hlEnterMultiSelectMode(entry) {
    const seed = entry || _hlState.pickerPending;
    if (!seed || seed.tokenStart == null) return;
    _hlPickerClose();

    _hlState.multiSelectActive = true;
    _hlState.multiSelectEntries = [Object.assign({}, seed)];
    document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected'));
    document.querySelectorAll('.wlv-chip.active').forEach(c => c.classList.add('hl-multi-selected'));
    _hlShowSelectionBar('multi', _hlState.multiSelectEntries.length);
}
function _hlMultiSelectTap(chipEl, chip) {
    const tokenStart = _hlTokenIdxFromRef(chip.ref), book = chip.bookKey || chip.book;
    const chapter = Number(chip.ch), verse = Number(chip.verse);
    if (!book || !Number.isFinite(chapter) || !Number.isFinite(verse) || !tokenStart) return;
    const key = [String(book), chapter, verse, tokenStart].join(':');
    const idx = _hlState.multiSelectEntries.findIndex(item => [String(item.book), Number(item.chapter), Number(item.verse), Number(item.tokenStart)].join(':') === key);
    if (idx >= 0) { _hlState.multiSelectEntries.splice(idx, 1); chipEl.classList.remove('hl-multi-selected'); }
    else {
        const existing = _hlFindExisting(book, chapter, verse, tokenStart, tokenStart);
        _hlState.multiSelectEntries.push(Object.assign({}, existing || { book: String(book), chapter, verse, tokenStart, tokenEnd: tokenStart, color: 'yellow', createdAt: Date.now() }, { _isExisting: !!existing }));
        chipEl.classList.add('hl-multi-selected');
    }
    _hlShowSelectionBar('multi', _hlState.multiSelectEntries.length);
}
function _hlFinishMultiSelection() {
    if (!_hlState.multiSelectActive) return;
    const entries = _hlState.multiSelectEntries.slice();
    _hlState.multiSelectActive = false; _hlState.multiSelectEntries = []; _hlHideSelectionBar();
    if (!entries.length) { document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected')); return; }
    _hlOpenPicker({ _isBatch: true, entries });
}
function _hlCancelSelection() {
    _hlState.multiSelectActive = false;
    _hlState.multiSelectEntries = [];
    _hlHideSelectionBar();
    document.querySelectorAll('.wlv-chip.hl-multi-selected, .dg-token.hl-multi-selected').forEach(c => c.classList.remove('hl-multi-selected'));
}

/* ── ハイライト検索ヘルパー ── */

function _hlFindExisting(book, chapter, verse, tokenStart, tokenEnd) {
    if (!window.App || !window.App.storage) return null;
    const list = window.App.storage.getHighlights();
    const sameVerse = h =>
        h.book === String(book) &&
        Number(h.chapter) === Number(chapter) &&
        Number(h.verse) === Number(verse);
    const sameRange = h =>
        (h.tokenStart == null ? null : Number(h.tokenStart)) === (tokenStart == null ? null : Number(tokenStart)) &&
        (h.tokenEnd   == null ? null : Number(h.tokenEnd))   === (tokenEnd == null ? null : Number(tokenEnd));

    /* まず保存範囲の完全一致を優先する。 */
    const exact = list.find(h => sameVerse(h) && sameRange(h));
    if (exact) return exact;

    /* 範囲ハイライトの途中の語を選んだ場合も、その保存済み範囲を編集・削除できるようにする。
       節全体ハイライト（tokenStart=null）は語ハイライトの候補に含めない。 */
    if (tokenStart != null && tokenEnd != null) {
        const start = Number(tokenStart);
        const end = Number(tokenEnd);
        if (!Number.isFinite(start) || !Number.isFinite(end)) return null;
        return list.find(h =>
            sameVerse(h) &&
            h.tokenStart != null && h.tokenEnd != null &&
            Number(h.tokenStart) <= start &&
            Number(h.tokenEnd) >= end
        ) || null;
    }
    return null;
}

/* ── DOM 適用（Phase G）── */

function _applyHighlights() {
    if (!window.App || !window.App.storage) return;
    const highlights = window.App.storage.getHighlights();

    /* Clear stale classes before reapplying the saved state, including when empty. */
    document.querySelectorAll('.verse-block').forEach(block => {
        HL_COLORS.forEach(c => block.classList.remove('hl-verse-' + c));
    });
    document.querySelectorAll('.wlv-chip, .dg-token').forEach(token => {
        HL_COLORS.forEach(c => token.classList.remove('hl-word-' + c));
    });
    /* 保存済みハイライトが0件でも、構造モードの古い表示クラスを消す必要があるため早期returnしない。 */

    /* ── A. 節全体ハイライト（全モード共通） ── */
    const verseHighlights = highlights.filter(h => h.tokenStart == null);

    verseHighlights.forEach(h => {
        const chStr = String(h.chapter);
        /* chapter-block が存在する場合はそのスコープで検索 */
        const cb = document.querySelector(
            `.chapter-block[data-book="${h.book}"][data-chapter="${chStr}"], .compare-chapter-block[data-book="${h.book}"][data-chapter="${chStr}"]`
        );
        /* chapter-block がない場合は AppState で現在の書/章を確認して誤適用を防ぐ */
        if (!cb) {
            const curBook = AppState.location?.book?.key;
            const curCh   = AppState.location?.chapter;
            if (String(h.book) !== String(curBook) || Number(h.chapter) !== Number(curCh)) return;
        }
        const mainArea = document.getElementById('main-reading-area');
        const scope = cb || (mainArea && mainArea.classList.contains('compare-mode')
            ? mainArea
            : document.getElementById('bible-text-area'));
        if (!scope) return;

        scope.querySelectorAll(`.verse-block[data-vnum="${h.verse}"]:not(.verse-pair-right)`).forEach(block => {
            HL_COLORS.forEach(c => block.classList.remove(`hl-verse-${c}`));
            block.classList.add(`hl-verse-${h.color}`);
        });
    });

    /* ── B. 語・句ハイライト：WORD_ORDER（data-token-id） ── */
    const wordHighlights = highlights.filter(h => h.tokenStart != null);

    wordHighlights.forEach(h => {
        const chStr = String(h.chapter);
        const cb = document.querySelector(
            `.chapter-block[data-book="${h.book}"][data-chapter="${chStr}"], .compare-chapter-block[data-book="${h.book}"][data-chapter="${chStr}"]`
        );
        if (!cb) {
            const curBook = AppState.location?.book?.key;
            const curCh   = AppState.location?.chapter;
            if (String(h.book) !== String(curBook) || Number(h.chapter) !== Number(curCh)) return;
        }
        const mainArea = document.getElementById('main-reading-area');
        const scope = cb || (mainArea && mainArea.classList.contains('compare-mode')
            ? mainArea
            : document.getElementById('bible-text-area'));
        if (!scope) return;

        /* wordOrder の語データは表示状態により verse-block または内側の gf-verse-block に保持される。
           実際に _flowWords を持つ要素から tokenIndex → tokenId を解決する。 */
        scope.querySelectorAll(`.verse-block[data-vnum="${h.verse}"]`).forEach(block => {
            const flowBlock = block._flowWords ? block : block.querySelector('.gf-verse-block');
            const words = flowBlock && Array.isArray(flowBlock._flowWords) ? flowBlock._flowWords : [];
            if (!words.length) return;
            words.forEach(w => {
                /* 生トークンには tokenIndex がない場合がある。表示用 ref の !N をフォールバックに使う。 */
                const tidx = w.tokenIndex != null && w.tokenIndex !== ''
                    ? parseInt(w.tokenIndex, 10)
                    : _hlTokenIdxFromRef(w.ref);
                if (tidx != null && tidx >= h.tokenStart && tidx <= h.tokenEnd) {
                    const chip = flowBlock.querySelector(`.wlv-chip[data-token-id="${w.tokenId}"]`) ||
                                 block.querySelector(`.wlv-chip[data-token-id="${w.tokenId}"]`);
                    if (chip) {
                        HL_COLORS.forEach(c => chip.classList.remove(`hl-word-${c}`));
                        chip.classList.add(`hl-word-${h.color}`);
                    }
                }
            });
        });

        /* ── C. 語・句ハイライト：CLAUSE_ROLE（data-dg-ref） ── */
        scope.querySelectorAll('.dg-token[data-dg-ref]').forEach(span => {
            const ref = span.dataset.dgRef;
            if (!ref) return;
            const parts = ref.split(' ');
            if (parts.length < 2) return;
            const book  = parts[0];
            if (book !== h.book) return;
            const cvParts = parts[1].split(':');
            if (cvParts.length < 2) return;
            const ch = parseInt(cvParts[0], 10);
            const vTok = cvParts[1].split('!');
            const v    = parseInt(vTok[0], 10);
            const tidx = parseInt(vTok[1], 10);
            if (ch !== h.chapter || v !== h.verse) return;
            if (tidx >= h.tokenStart && tidx <= h.tokenEnd) {
                HL_COLORS.forEach(c => span.classList.remove(`hl-word-${c}`));
                span.classList.add(`hl-word-${h.color}`);
            }
        });
    });

    /* 文の構造で読む：保存済み token 範囲を sentence._flowWords と表示チップへ同期。 */
    _applyDaReadingHighlights(highlights);
}

function _applyDaReadingHighlights(highlights) {
    const daSentences = Array.from(document.querySelectorAll(".da-sentence"));
    daSentences.forEach(function (sentence) {
        sentence.querySelectorAll(".wlv-chip").forEach(function (chip) {
            HL_COLORS.forEach(function (color) {
                chip.classList.remove("hl-word-" + color);
            });
        });
    });

    const currentBook = window.AppState && window.AppState.location && window.AppState.location.book
        ? window.AppState.location.book.key : null;
    const currentChapter = window.AppState && window.AppState.location
        ? window.AppState.location.chapter : null;

    /* 節ハイライト: その節を含む文ブロックの左帯にも反映する。
       DA の文ブロック（.da-sentence.verse-block）には data-vnum が無いため、
       _applyHighlights 本体の節ハイライト適用（data-vnum セレクタ）では拾えない。
       ここで sentence._flowWords の書・章・節と照合して hl-verse-<color> を付け替える
       （古い色クラスは _applyHighlights 冒頭の全 .verse-block クリアで除去済み）。 */
    const verseHighlights = highlights.filter(function (h) {
        return h && h.tokenStart == null;
    });
    if (verseHighlights.length && daSentences.length) {
        daSentences.forEach(function (sentence) {
            const words = Array.isArray(sentence._flowWords) ? sentence._flowWords : [];
            if (!words.length) return;
            verseHighlights.forEach(function (h) {
                if (HL_COLORS.indexOf(h.color) === -1) return;
                const hit = words.some(function (word) {
                    if (!word) return false;
                    const book = word.book != null ? String(word.book) : (currentBook != null ? String(currentBook) : "");
                    const chapter = word.chapter != null ? Number(word.chapter) : Number(currentChapter);
                    return book === String(h.book) && chapter === Number(h.chapter) && Number(word.verse) === Number(h.verse);
                });
                if (hit) {
                    HL_COLORS.forEach(function (color) {
                        sentence.classList.remove("hl-verse-" + color);
                    });
                    sentence.classList.add("hl-verse-" + h.color);
                }
            });
        });
    }

    const wordHighlights = highlights.filter(function (h) {
        return h && h.tokenStart != null;
    });
    if (!wordHighlights.length || !daSentences.length) return;

    daSentences.forEach(function (sentence) {
        const words = Array.isArray(sentence._flowWords) ? sentence._flowWords : [];
        if (!words.length) return;
        const chips = Array.from(sentence.querySelectorAll(".wlv-chip[data-token-id]"));
        if (!chips.length) return;

        wordHighlights.forEach(function (h) {
            words.forEach(function (word) {
                if (!word) return;
                const book = word.book != null ? String(word.book) : (currentBook != null ? String(currentBook) : "");
                const chapter = word.chapter != null ? Number(word.chapter) : Number(currentChapter);
                const verse = Number(word.verse);
                /* 生トークンでは tokenIndex が省略される場合があるため canonical ref の !N を使う。 */
                const ref = typeof word.ref === "string" ? word.ref : "";
                const refMatch = ref.match(/!(\d+)\s*$/);
                const tokenIndex = word.tokenIndex != null && word.tokenIndex !== ""
                    ? Number(word.tokenIndex)
                    : (refMatch ? Number(refMatch[1]) : NaN);
                if (book !== String(h.book) || chapter !== Number(h.chapter) || verse !== Number(h.verse) ||
                    !Number.isFinite(tokenIndex) || tokenIndex < Number(h.tokenStart) || tokenIndex > Number(h.tokenEnd)) return;

                const chip = chips.find(function (candidate) {
                    return String(candidate.dataset.tokenId) === String(word.tokenId);
                });
                if (chip) {
                    /* 同じ語に複数の保存範囲が重なる場合も、色クラスは1色に統一する。
                       通常モードの _applyHighlights と同じく、後から処理する保存項目を優先。 */
                    HL_COLORS.forEach(function (color) {
                        chip.classList.remove("hl-word-" + color);
                    });
                    if (HL_COLORS.indexOf(h.color) !== -1) {
                        chip.classList.add("hl-word-" + h.color);
                    }
                }
            });
        });
    });
}

/* ── ハイライト一覧（Phase F）── */

let _hlListFilter = 'all';
let _hlRenderToken = 0;

function showHighlights() {
    closeMobileSidebar();
    const app = document.getElementById('bible-text-area');
    document.getElementById('main-reading-area').classList.add('single-mode');
    document.getElementById('main-reading-area').classList.add('static-view');
    document.getElementById('main-reading-area').scrollTop = 0;
    AppState.ui.view = 'highlights';
    syncUIFromState();
    _hlListFilter = 'all';
    _hlRenderHighlightList(app);
}

/* 本文プレビューを非同期で取得し、章単位でfetchを共有する。
   フィルター連打時に古いrenderが上書きしないようtokenで管理する。 */
async function _hlRenderHighlightList(app) {
    if (!app) return;
    const token = ++_hlRenderToken;

    const highlights = window.App?.storage?.getHighlights() || [];
    const bookmarks  = window.App?.storage?.getBookmarks()  || [];

    /* フィルタ適用 */
    const filtered = _hlListFilter === 'all'
        ? highlights
        : highlights.filter(h => h.color === _hlListFilter);

    /* フィルタタブ（件数表示なし） */
    const counts = {};
    HL_COLORS.forEach(c => { counts[c] = highlights.filter(h => h.color === c).length; });
    const totalHL = highlights.length;
    const dotColors = { yellow: '#fccc00', blue: '#004c97', green: '#15722c', red: '#eb6100' };
    let tabsHtml = `<div class="hl-filter-tabs">`;
    tabsHtml += `<button class="hl-filter-tab${_hlListFilter === 'all' ? ' hl-tab-active' : ''}" onclick="_hlSetFilter('all')">すべて</button>`;
    HL_COLORS.forEach(c => {
        if (counts[c] > 0) {
            const active = _hlListFilter === c ? ' hl-tab-active' : '';
            tabsHtml += `<button class="hl-filter-tab${active}" onclick="_hlSetFilter('${c}')"><span class="hl-tab-dot" style="background:${dotColors[c]}"></span>${HL_COLOR_NAMES[c]}</button>`;
        }
    });
    tabsHtml += `</div>`;

    /* 章ごとに本文をfetch（同じ章は1回のみ） */
    const chFetches = {};
    filtered.forEach(h => {
        const key = `${h.book}:${h.chapter}`;
        if (!chFetches[key]) chFetches[key] = _fetchTranslation('JA1955', h.book, String(h.chapter));
    });
    const chData = {};
    await Promise.all(Object.entries(chFetches).map(async ([key, p]) => {
        try { chData[key] = await p; } catch(e) {}
    }));
    if (token !== _hlRenderToken) return;

    /* ハイライト一覧 */
    let rowsHtml = '';
    if (filtered.length) {
        rowsHtml = filtered.map(h => {
            const bookName = BOOK_NAME[h.book] || BOOK_SHORT[h.book] || h.book;
            const titleText = `${bookName} ${h.chapter}:${h.verse}`;
            const rangeLabel = h.tokenStart == null ? '節全体' :
                               (h.tokenStart === h.tokenEnd ? `語${h.tokenStart}` : `語${h.tokenStart}–${h.tokenEnd}`);
            const href = `index.html?book=${encodeURIComponent(h.book)}&ch=${encodeURIComponent(h.chapter)}&verse=${encodeURIComponent(h.verse)}${h.tokenStart != null ? '&hltoken=' + h.tokenStart : ''}`;
            const verseText = chData[`${h.book}:${h.chapter}`]?.verses?.[String(h.verse)] || '';
            const previewHtml = verseText ? `<div class="list-item-preview">${_escH(verseText)}</div>` : '';
            const titleHtml = `<span class="hl-list-dot" data-color="${_escH(h.color)}"></span><span>${_escH(titleText)}</span>`;
            const subHtml   = `<div class="list-item-sub">${_escH(rangeLabel + ' · ' + _listMetaDate(h.createdAt))}</div>`;
            return `<div class="list-item-card" role="link" tabindex="0" onclick="location.href='${href}'" onkeydown="if(event.target===this&&event.key==='Enter'){event.preventDefault();location.href='${href}'}"><div class="list-item-main"><div class="list-item-title">${titleHtml}</div>${previewHtml}${subHtml}</div></div>`;
        }).join('');
    } else if (_hlListFilter === 'all' && !totalHL) {
        rowsHtml = `<p class="list-item-empty">ハイライトはまだありません。読んでいて残しておきたい箇所を選んで色をつけることができます。</p>`;
    } else {
        rowsHtml = `<p class="list-item-empty">この色のハイライトはありません。</p>`;
    }

    /* ブックマーク（旧データ）を別セクションで表示 */
    let bkSection = '';
    if (bookmarks.length && _hlListFilter === 'all') {
        const bkRows = bookmarks.map(b => {
            const bk = BOOK_SHORT[b.bookKey] || b.bookKey;
            const title = (b.bookKey && b.chapter != null && b.verse != null)
                ? `${bk}${b.chapter}章${b.verse}節`
                : (b.ref || '');
            const href = (b.bookKey && b.chapter != null && b.verse != null)
                ? `index.html?book=${encodeURIComponent(b.bookKey)}&ch=${encodeURIComponent(b.chapter)}&verse=${encodeURIComponent(b.verse)}&panel=study`
                : '';
            return _listItemCard({ title: '★ ' + title, meta: _listMetaDate(b.createdAt), href });
        }).join('');
        bkSection = `<section><h3 style="font-size:var(--text-caption);color:var(--text-hint);font-weight:500;margin:var(--space-lg) 0 var(--space-sm);">移行前のブックマーク</h3>${bkRows}</section>`;
    }

    app.innerHTML = `
        <div class="static-page list-page">
            <section>
                ${tabsHtml}
                ${rowsHtml}
            </section>
            ${bkSection}
            <div class="back-wrap">
                <button class="back-btn" onclick="renderCurrentPage()">本文に戻る</button>
            </div>
        </div>`;
}

function _hlSetFilter(color) {
    _hlListFilter = color;
    _hlRenderHighlightList(document.getElementById('bible-text-area'));
}

</script>

<!-- 語源要素 Abbott-Smith ポップアップ（search-tool #as-modal と同構造） -->
<div id="rn-etym-backdrop" onclick="this.classList.remove('open')">
    <div id="rn-etym-modal" onclick="event.stopPropagation()">

<!-- Highlight V1: color picker popup -->
<div id="hl-color-picker-overlay" onclick="_hlPickerDismiss()"></div>
<div id="hl-color-picker" role="dialog" aria-label="ハイライトの色">
    <div class="hl-picker-actions">
        <button class="hl-picker-action" onclick="_hlEnterMultiSelectMode()">範囲指定</button>
    </div>
    <div class="hl-picker-row">
        <button class="hl-picker-swatch" data-color="yellow" onclick="_hlColorSelected('yellow')" title="黄"></button>
        <button class="hl-picker-swatch" data-color="blue"   onclick="_hlColorSelected('blue')"   title="青"></button>
        <button class="hl-picker-swatch" data-color="green"  onclick="_hlColorSelected('green')"  title="緑"></button>
        <button class="hl-picker-swatch" data-color="red"    onclick="_hlColorSelected('red')"    title="赤"></button>
        <button class="hl-picker-delete" onclick="_hlColorSelected(null)" title="ハイライトを削除" aria-label="ハイライトを削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
</div>
<div id="hl-touch-pill" role="group" aria-label="ハイライト操作">
    <button type="button" class="hl-pill-btn" id="hl-pill-btn-color" onclick="_hlTouchPillTap()"><span data-icon="highlighter"></span>ハイライト</button>
    <button type="button" class="hl-pill-btn" id="hl-pill-btn-range" onclick="_hlEnterTouchRangeMode()">範囲指定</button>
</div>
<div id="hl-selection-bar" role="status" aria-live="polite">
    <span id="hl-selection-count"></span>
    <button id="hl-selection-finish" class="hl-selection-bar-btn primary" onclick="_hlFinishMultiSelection()">色を選ぶ</button>
    <button class="hl-selection-bar-btn" onclick="_hlCancelSelection()">キャンセル</button>
</div>

<script>
/* ── ブラウザ上で選択した複数語をハイライト ── */
/* チップ/トークン要素から {book, chapter, verse, tokenStart} を返す。解決できなければ null。
   Word-order chips and structure-reading tokens use different DOM shapes.
   Read the structured ref from either shape; never infer a verse from display text. */
function _hlRefFromEl(el) {
    let book, chapter, verse, tokenStart;
    if (el.matches('.dg-token[data-dg-ref]')) {
        const ref = el.dataset.dgRef || '';
        const parts = ref.split(' ');
        const cvt = parts.length > 1 ? parts[1].match(/^(\d+):(\d+)!(\d+)$/) : null;
        if (!cvt) return null;
        book = parts[0]; chapter = Number(cvt[1]); verse = Number(cvt[2]); tokenStart = Number(cvt[3]);
    } else {
        const tokenId = el.dataset.tokenId, block = el.closest('.gf-verse-block, .verse-block');
        const list = block && (block._flowChips || block._flowWords);
        let chip = list && list.find(item => String(item.tokenId) === String(tokenId));
        if (!chip && typeof _wlvGetChipData === 'function') chip = _wlvGetChipData(tokenId);
        if (!chip) return null;
        tokenStart = _hlTokenIdxFromRef(chip.ref);
        book = chip.bookKey || chip.book;
        chapter = Number(chip.ch); verse = Number(chip.verse);
    }
    if (!book || !Number.isFinite(chapter) || !Number.isFinite(verse) || !Number.isFinite(tokenStart) || tokenStart < 1) return null;
    return { book: String(book), chapter, verse, tokenStart };
}

/* 現在のネイティブ選択が本文のどの語に対応するかを解決する（ピッカーは開かない）。 */
function _hlResolveTextSelection() {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !selection.rangeCount || !selection.toString().trim()) return [];
    const range = selection.getRangeAt(0);
    const root = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
    if (!root || !root.closest || !root.closest('#bible-text-area, #parallel-text-area')) return [];

    const selected = Array.from(document.querySelectorAll(
        '#bible-text-area .wlv-chip, #parallel-text-area .wlv-chip, ' +
        '#bible-text-area .dg-token[data-dg-ref], #parallel-text-area .dg-token[data-dg-ref]'
    )).filter(el => {
        try { return range.intersectsNode(el); } catch (_) { return false; }
    });
    const entries = [], seen = new Set();
    selected.forEach(el => {
        const r = _hlRefFromEl(el);
        if (!r) return;
        const { book, chapter, verse, tokenStart } = r;
        const key = [book, chapter, verse, tokenStart].join(':');
        if (seen.has(key)) return;
        seen.add(key);
        const existing = _hlFindExisting(book, chapter, verse, tokenStart, tokenStart);
        entries.push(Object.assign({}, existing || {
            book, chapter, verse, tokenStart, tokenEnd: tokenStart,
            color: 'yellow', createdAt: Date.now()
        }, {_isExisting: !!existing}));
    });
    return entries;
}

/* ピッカーがタッチ用ピルから開かれたかどうか（閉じるときの選択保持の判定に使う）。 */
let _hlPickerFromTouch = false;

function _hlOpenPickerForTextSelection(event) {
    if (!event || !event.target || !event.target.closest || !event.target.closest('#bible-text-area, #parallel-text-area')) return;
    if (_hlState.multiSelectActive || _hlState.pickerPending) return;
    _hlPickerFromTouch = !!event._fromTouchPill;
    const entries = _hlResolveTextSelection();
    if (entries.length === 1) {
        /* StudyPanel 内の専用ボタンを廃止したため、本文で単語を選択した場合も
           同じポップアップを開き、色変更・削除の入口を本文側に集約する。 */
        _hlOpenPicker(entries[0]);
        return;
    }
    if (entries.length < 2) return;
    _hlOpenPicker({_isBatch: true, entries});
}
document.addEventListener('mouseup', _hlOpenPickerForTextSelection);
document.addEventListener('keyup', function(event) {
    if (['Shift','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) {
        _hlOpenPickerForTextSelection({target:window.getSelection()?.anchorNode?.parentElement});
    }
});

/* スマホ/タブレット向け: 長押しで本文の語句を選択したら、画面下部中央に
   「ハイライト」ピルを出す。以前は選択が安定した時点でピッカーを自動で
   開いていたが、全面オーバーレイが青ハンドルでの範囲調整を妨げ、
   複数語の選択ができなかった。そのためピッカーはピルのタップで
   明示的に開く形にし、選択が有効な間はピルを出し続ける
   （ハンドル調整・スクロールは妨げない）。
   タッチでは選択の確定後に mouseup が来ないため、touchend と
   selectionchange の安定を起点に、ピルの表示可否だけを判定する。 */
let _hlLastTouchAt = 0;
let _hlTouchSelTimer = null;
/* ピル表示時点の解決済みエントリ。ピルのアクションはタップ時点の
   ライブ選択を読み直さない（iOS ではタップ処理より先にネイティブ
   選択やメニューが解除され、読み直すと空になって無反応に見える）。 */
let _hlTouchEntries = [];
let _hlLastTouchInPill = false;
function _hlTouchPillEl() { return document.getElementById('hl-touch-pill'); }
function _hlHideTouchPill() { const p = _hlTouchPillEl(); if (p) p.classList.remove('hl-show'); }
function _hlTryTouchTextSelection() {
    const pill = _hlTouchPillEl();
    if (!pill) return;
    if (_hlState.pickerPending || _hlState.multiSelectActive) { _hlTouchEntries = []; _hlHideTouchPill(); return; }
    const selection = window.getSelection();
    if (!selection || !selection.rangeCount || selection.isCollapsed) {
        /* ピルへのタップで選択が解除されただけなら、ピルと種データを残す。 */
        if (_hlTouchEntries.length && _hlLastTouchInPill) { pill.classList.add('hl-show'); return; }
        _hlTouchEntries = []; _hlHideTouchPill(); return;
    }
    const anchorEl = selection.anchorNode && selection.anchorNode.parentElement;
    if (!anchorEl || !anchorEl.closest || !anchorEl.closest('#bible-text-area, #parallel-text-area')) { _hlTouchEntries = []; _hlHideTouchPill(); return; }
    const entries = _hlResolveTextSelection();
    if (!entries.length) { _hlTouchEntries = []; _hlHideTouchPill(); return; }
    _hlTouchEntries = entries;
    pill.classList.add('hl-show');
}
function _hlScheduleTouchTextSelection(delay) {
    if (_hlTouchSelTimer) clearTimeout(_hlTouchSelTimer);
    _hlTouchSelTimer = setTimeout(_hlTryTouchTextSelection, delay);
}
function _hlTouchPillTap() {
    _hlHideTouchPill();
    const entries = _hlTouchEntries;
    _hlTouchEntries = [];
    if (entries.length) {
        _hlPickerFromTouch = true;
        if (entries.length === 1) { _hlOpenPicker(entries[0]); return; }
        _hlOpenPicker({ _isBatch: true, entries });
        return;
    }
    /* 種データがない場合の保険: ライブ選択から開く。 */
    const selection = window.getSelection();
    const anchorEl = selection && selection.anchorNode && selection.anchorNode.parentElement;
    _hlOpenPickerForTextSelection({ target: anchorEl, _fromTouchPill: true });
}
/* 「範囲指定」: iOS では青ハンドルのドラッグがチップ単位で効かず
   （inline-flex / inline-block の塊ごとに選択が飛ぶ）複数語の調整が
   安定しないため、長押しで選んだ語を種にして、以降は語のタップで
   選択を増減するモードへ移る。状態管理は既存の複数選択と共用する。 */
function _hlEnterTouchRangeMode() {
    const entries = _hlTouchEntries.length ? _hlTouchEntries : _hlResolveTextSelection();
    if (!entries.length) return;
    _hlTouchEntries = [];
    _hlHideTouchPill();
    _hlClearNativeSelection();
    _hlState.multiSelectActive = true;
    _hlState.multiSelectEntries = entries.slice();
    const keys = new Set(entries.map(e => [String(e.book), Number(e.chapter), Number(e.verse), Number(e.tokenStart)].join(':')));
    document.querySelectorAll(
        '#bible-text-area .wlv-chip, #parallel-text-area .wlv-chip, ' +
        '#bible-text-area .dg-token[data-dg-ref], #parallel-text-area .dg-token[data-dg-ref]'
    ).forEach(el => {
        const r = _hlRefFromEl(el);
        if (r && keys.has([r.book, r.chapter, r.verse, r.tokenStart].join(':'))) el.classList.add('hl-multi-selected');
    });
    _hlShowSelectionBar('multi', _hlState.multiSelectEntries.length);
}
/* 複数選択モード中は、構造モードのトークンのタップも選択の増減にする
   （トークン自体のクリックは StudyPanel を開くため、捕捉フェーズで先取りする）。
   語順チップ側は既存のチップタップ処理が同じ役割を担う。 */
document.addEventListener('click', function (event) {
    if (!_hlState.multiSelectActive) return;
    const token = event.target && event.target.closest && event.target.closest('.dg-token[data-dg-ref]');
    if (!token || !token.closest('#bible-text-area, #parallel-text-area')) return;
    const m = (token.dataset.dgRef || '').match(/^(\S+) (\d+):(\d+)!(\d+)$/);
    if (!m) return;
    event.stopPropagation();
    event.preventDefault();
    _hlMultiSelectTap(token, { ref: token.dataset.dgRef, bookKey: m[1], ch: Number(m[2]), verse: Number(m[3]) });
}, true);
document.addEventListener('touchend', function (event) {
    _hlLastTouchAt = Date.now();
    _hlLastTouchInPill = !!(event.target && event.target.closest && event.target.closest('#hl-touch-pill'));
    _hlScheduleTouchTextSelection(350);
}, { passive: true });
/* ピルのボタンは click だけでなく touchend でも発火させる。
   iOS の選択メニュー表示中は click が届かないことがあるため。
   どちらが先に発火しても、種データの消費により二重実行にはならない。 */
[['hl-pill-btn-color', _hlTouchPillTap], ['hl-pill-btn-range', _hlEnterTouchRangeMode]].forEach(([id, fn]) => {
    const btn = document.getElementById(id);
    if (btn) btn.addEventListener('touchend', function (event) { event.preventDefault(); fn(); }, { passive: false });
});
document.addEventListener('selectionchange', function () {
    /* タッチ操作由来の選択だけを対象にする（マウスは mouseup 側で処理）。 */
    if (Date.now() - _hlLastTouchAt > 3000) return;
    _hlScheduleTouchTextSelection(300);
});
</script>
