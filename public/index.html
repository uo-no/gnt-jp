/* ══════════════════════════════════════════════════════════════════
   Phase ESM-44-B: Observation 表示整形（案C・表示層のみ）
   設計正典: docs/specs/LAYER_ARCHITECTURE.md §4「Observation」

   _buildObservationHTML() / _OBSERVATION_SENTENCES / _WORD_ROLE_TEXT は
   一切変更しない。ここでは、その戻り値（既に生成済みのHTML文字列）に対し、
   bible_data.japanese 由来の既知の角括弧引用（「［○○語句］」の7パターンのみ）を
   汎用自己参照「語」へ機械的に置換するだけの後処理を行う。
   新しい意味生成・翻訳・推論は行わない（対象語自体は既にヘッダー表示済みのため
   情報欠落は生じない。_WORD_ROLE_TEXT の nominative_pendens が同種の
   汎用自己参照「この語」を既に用いている前例を踏襲する）。
   対象7パターン以外の文字列には一切触れない（単純な完全一致の置換のみ）。
   Desktop/Mobile共通で同じ結果になるよう、呼び出し元（_buildObservationHTML()の
   戻り値を受け取る側）で一律に適用する設計とする。
   ══════════════════════════════════════════════════════════════════ */
const _OBSERVATION_BRACKET_QUOTES = [
    '「［転換語句］」', '「［内容語句］」', '「［理由語句］」',
    '「［目的語句］」', '「［対比語句］」', '「［結論語句］」', '「［条件語句］」',
];
function _naturalizeObservationText(html) {
    if (!html) return html;
    let out = html;
    for (const q of _OBSERVATION_BRACKET_QUOTES) {
        out = out.split(q).join('語');
    }
    return out;
}

/**
 * Phase 24: words に対する Reading Support Projection を返す（読み取り専用）。
 * StudyPanel 側は必要な時だけこれを読む（Phase 25 以降の消費者向け API）。
 * Projection が無い場合は null — 呼び出し側は現状表示のままでよい。
 * @returns {Promise<Object|null>}
 */
async function _getReadingSupportProjection(words) {
    if (!words || words.length === 0) return null;
    await _getWallaceClauseAnalysis(words);
    return (_wallaceClauseCache && _wallaceClauseCache.words === words)
        ? (_wallaceClauseCache.projection ?? null)
        : null;
}

/* __VERSE_NOTE_BEGIN__
   節レベル読書メモ（Passage Note の Projection 走査）— Reading Policy 駆動

   どの id をどこに表示するか（scope / priority / 現象グループ / verse_source）は
   assets/data/reading-policy.json（唯一の機械可読定義源）が決める。
   本テーブルは「現象 → 一文」の文言のみを持つ（IDは一切書かない）。
   検出は従来どおり SyntaxAnalyzer / ReadingSupportProjection（変更しない）。

   現象を追加する手順:
     1. reading-policy.json に phenomenon（scope/priority/ids）を1件追加
     2. verse スコープなら本テーブルに「現象名 → 一文」を1行追加
   コード側のロジック変更は不要。 */
const _VERSE_NOTE_TEXT = {
    /* 原語表記の原則（reading-policy.md §12）: 節文は語が未選択の場面なので、
       本文から探させたい語にだけ 日本語（ギリシャ語）の指さしを添える。 */
    negative_emphasis:
        'ここでは打ち消しのことば（οὐ μή）を二つ重ねて、『決して〜ない』と強く断言しています。',
    conditional_counterfactual:
        'ここでは、実際にはそうならなかった『もし〜だったなら』という仮定で語られています。',
    conditional_assumed_true:
        'ここでは、『もし〜なら』の条件が、事実として受け止められて話が進みます。',
    men_de_contrast:
        'ここでは、二つのことが対（μέν…δέ）に置かれて語られています。',
    emphasis_word_order:
        'ここでは、ことばの順序によって、あることばが際立たされています。',
    parenthesis:
        'ここでは、話の途中に説明の一言がはさまれています。',
    nominative_pendens:
        'ここでは、まず主題が示され、あとからそれを受け直して話が続きます。',
};

/* 現象の scope を原子スコープの配列に正規化する。
   文字列（'verse'等）・配列（['verse','word']）の両形式を受け、
   'multiple' は ['verse','word'] の別名として展開する（reading-policy.json
   の scope_note と対応）。 */
function _policyScopes(ph) {
    const s = ph?.scope;
    if (Array.isArray(s)) return s;
    if (s === 'multiple') return ['verse', 'word'];
    return s ? [s] : [];
}

/* Projection の全語 × 全カテゴリを走査し、Reading Policy の passage_note 規則
   （正規化スコープが verse を含む × priority ∈ {critical, high} × verse_source =
   'projection' × confidence ≥ min_confidence）を満たす現象の文を
   出現順・重複なしで返す。規則の値はすべて policy から読む。 */
function _collectVerseNoteSentences(proj, policy) {
    if (!proj || !Array.isArray(proj.words) || !policy) return [];
    const rule    = policy.rules?.passage_note || {};
    const minConf = policy.rules?.min_confidence ?? 0.40;
    const lines = [];
    for (const w of proj.words) {
        if (!w || !w.categories) continue;
        for (const c of Object.values(w.categories)) {
            if (!c || c.confidence < minConf) continue;
            const ph = policy.byId[c.id];
            if (!ph) continue;
            if (ph.verse_source !== 'projection') continue;
            const scopes = _policyScopes(ph);
            if (!(rule.scopes || []).some(s => scopes.includes(s))) continue;
            if (!(rule.priorities || []).includes(ph.priority)) continue;
            const line = _VERSE_NOTE_TEXT[ph.phenomenon];
            if (line && !lines.includes(line)) lines.push(line);
        }
    }
    return lines;
}
/* __VERSE_NOTE_END__ */

/**
 * words（節の生トークン配列）から ReadingFormatter による読書メモHTMLを
 * 組み立てる。文章は一切自前で生成しない — ReadingFormatter.format()の
 * title/summary と _VERSE_NOTE_TEXT の固定文のみを使う。
 *
 * 情報源は2系統（検出と表示の分離）:
 *   1) ClauseAnalyzer の discourse 分類 → ReadingFormatter.format/combine
 *   2) ReadingSupportProjection の節全体走査 → _collectVerseNoteSentences
 * 節が1つも検出されなくても、節レベル現象（οὐ μή 等）があれば表示する。
 * @returns {Promise<string|null>} 表示すべき内容が無ければ null
 */
async function _buildWallacePassageNoteHTML(words) {
    if (!words || words.length === 0) return null;

    const clauseResults = await _getWallaceClauseAnalysis(words);

    const pipeline = await _ensureWallacePipeline();
    if (!pipeline) return null;
    const { ca, rf } = pipeline;

    const seen = new Set();
    const sentences = [];
    for (const clause of (clauseResults || [])) {
        const discourse = ca.classifyDiscourseRelation(words, clause);
        /* UNCLASSIFIED は discourse 関係が判定されなかった節（= 言うべきことがない）
           を意味するため、汎用フォールバック文を出さずスキップする。 */
        if (!discourse?.type || discourse.type === 'UNCLASSIFIED') continue;
        const formatted  = rf.format({ discourse, type: clause.type });
        const sentence   = formatted && formatted.summary;
        if (sentence && !seen.has(sentence)) {
            seen.add(sentence);
            sentences.push(sentence);
        }
    }

    /* 複数節が検出された場合、節ごとに「ここでは、」を繰り返さず
       ReadingFormatter.combine() で1つの自然文に統合する
       （単一節の場合は combine() がそのまま元の文を返す）。 */
    const combined = sentences.length > 0 ? rf.combine(sentences) : null;

    /* 節レベル現象は combine() の「ここでは、」統合形式に合わないため、
       別段落として discourse 文の後に併記する。対象の選別は Reading Policy。 */
    const proj = await _getReadingSupportProjection(words);
    const verseLines = _collectVerseNoteSentences(proj, pipeline.policy);

    const paras = [];
    if (combined) paras.push(combined);
    for (const line of verseLines) {
        if (!paras.includes(line)) paras.push(line);
    }
    if (paras.length === 0) return null;

    return `
        <section class="wlv-reading-passage-note">
            <span class="wlv-pn-label">この節の読書メモ</span>
            <div class="wlv-pn-prose">
                ${paras.map(t => `<p>${t}</p>`).join('')}
            </div>
        </section>`;
}

/**
 * #wlv-passage-note-slot を ReadingFormatter の結果で非同期に埋める。
 * 表示すべき内容が無ければ何も注入しない（説明文で埋めない＝静寂優先）。
 * ユーザーが別の節へ素早く移動した場合に古い結果を誤注入しないよう、
 * 世代カウンタで自分が最新の呼び出しかを確認してから反映する。
 */
async function _fillWallacePassageNote(words, container) {
    if (!container) return;
    const myGen = (container._wallacePassageNoteGen || 0) + 1;
    container._wallacePassageNoteGen = myGen;
    const html = await _buildWallacePassageNoteHTML(words);
    if (myGen !== container._wallacePassageNoteGen) return; // 同じコンテナで既に別の節へ移動済み
    if (!html) return;                                   // 静寂優先：空スロットのまま
    const slot = container && container.querySelector('#wlv-passage-note-slot');
    if (slot) {
        if (container.id === 'mobile-verse-area') {
            /* 第一層の節読書メモは、本文描画の非同期完了が遅れても開いた状態で表示する。
               第三層の語レベル読書メモは別スロット（#mvv-reading-slot）で表示する。 */
            slot.outerHTML = `<details class="mvv-passage-note" open><summary>この節の読書メモ</summary>${html}</details>`;
        } else {
            slot.outerHTML = html;
        }
    }
    /* 語ドロワーと同一文なら非表示。モバイルの節メモは別領域なので対象外。 */
    if (!container || container.id !== 'mobile-verse-area') {
        const ddReso = document.getElementById('wlv-dd-resonance');
        _syncWlvPassageNoteVisibility((ddReso?.textContent || '').trim());
    }
}

/** apparatus.json を一度だけ fetch してキャッシュする。失敗時は null を返す（静寂優先）。 */
async function _loadApparatusData() {

        .then(d => { _apparatusData = d; return d; })

}

/** apparatus-ja の4データセット（manual + Phase 1〜3）を並列 fetch してマージする。
 *  優先順位: manual > Phase 1 > Phase 2 > Phase 3。
 *  個別 fetch が失敗したデータセットは空として扱い、残りを統合して返す。
 *  全て失敗した場合は { entries: {} } を返す（静寂優先、ギリシャ語 apparatus 表示には影響しない）。 */
async function _loadApparatusJaAllData() {
    if (_apparatusJaAllData) return _apparatusJaAllData;
    if (_apparatusJaAllLoadP) return _apparatusJaAllLoadP;
    const fetchJson = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
    _apparatusJaAllLoadP = Promise.all([
        fetchJson('../assets/data/apparatus-ja.json'),
        fetchJson('../assets/data/apparatus-ja-auto.json'),
        fetchJson('../assets/data/apparatus-ja-phase2.json'),
        fetchJson('../assets/data/apparatus-ja-phase3.json'),
    ]).then(([manual, p1, p2, p3]) => {
        const merged = {};
        // Phase 3 → Phase 2 → Phase 1 の順で先書きし、manual で上書き（manual 最優先）
        for (const src of [p3, p2, p1, manual]) {
            if (src && src.entries) Object.assign(merged, src.entries);
        }
        _apparatusJaAllData = { entries: merged };
        return _apparatusJaAllData;
    }).catch(() => null);
    return _apparatusJaAllLoadP;
}

/** apparatus-ja の tag 値 → 日本語話者向け表示ラベルのマッピング。
 *  データ側の tag 値は変更しない。表示層でのみ変換する。 */
const _APPARATUS_TAG_LABELS = {
    '語順差':   '語句の並び順が異なります',
    '添加':     '一方の本文には語句が加わっています',
    '省略':     '一方の本文では語句が省かれています',
    '読み差':   '使用されている語句が異なります',
    '形態差':   '語形が異なります',
    '表記差':   'つづり・表記が異なります',
    '節構造差': '文の組み立て方が異なります',
    '語彙差':   '異なる語が使われています',
};

/** apparatus entries を <div class="mvv-apparatus-entries"> に変換する。
 *  jaEntries は _loadApparatusJaAllData() の entries オブジェクト（省略可）。
 *  lemJaEntries は _loadApparatusLemJaData() の entries オブジェクト（省略可）。
 *  rdgJaEntries は _loadApparatusRdgJaData() の entries オブジェクト（省略可）。
 *  status='確認済み' → mvv-app-anno、status='自動生成' → mvv-app-anno mvv-app-anno--auto で表示。
 *  status='保留' および未知のステータスは表示しない（静寂優先）。 */
function _buildApparatusHTML(entries, jaEntries, lemJaEntries, rdgJaEntries) {
    if (!entries || !entries.length) return '';
    const parts = entries.map(e => {
        const lemJa = lemJaEntries && lemJaEntries[e.id];
        const lemHtml = lemJa
            ? `<div class="mvv-app-lem">${_escH(lemJa)}<span class="mvv-app-lem-gr">（${_escH(e.lemText)}）</span></div>`
            : `<div class="mvv-app-lem">${_escH(e.lemText)}</div>`;
        const ja = jaEntries && jaEntries[e.id];
        const isConfirmed = ja && ja.status === '確認済み' && ja.tag && ja.ja;
        const isAuto      = ja && ja.status === '自動生成' && ja.tag && ja.ja;
        const tagLabel = (tag) => _escH(_APPARATUS_TAG_LABELS[tag] || tag);
        const showJaText = (isConfirmed || isAuto) && ja.ja !== 'περὶ（WH Treg NIV）・ὑπὲρ（RP）' && !(e.readings.length >= 2 && ja.ja.startsWith('語順: '));
        const jaSpan = showJaText ? `<span class="mvv-app-ja">${_escH(ja.ja)}</span>` : '';
        const annoHtml = isConfirmed
            ? `<div class="mvv-app-anno"><span class="mvv-app-tag">${tagLabel(ja.tag)}</span>${jaSpan}</div>`
            : isAuto
            ? `<div class="mvv-app-anno mvv-app-anno--auto"><span class="mvv-app-tag">${tagLabel(ja.tag)}</span>${jaSpan}</div>`
            : '';
        const _rdgNums = ['①', '②', '③', '④'];
        const entryRdgJa = rdgJaEntries && rdgJaEntries[e.id];
        const rdgHtml = e.readings.map((r, idx) => {
            const numHtml = e.readings.length >= 2
                ? `<span class="mvv-app-rdg-num">${_rdgNums[idx] || (idx + 1)}</span>`
                : '';
            const rdgJa = !r.isOmission && entryRdgJa && entryRdgJa[String(idx)];
            const textInner = r.isOmission
                ? '（省略）'
                : rdgJa
                ? `${_escH(rdgJa)}<span class="mvv-app-rdg-gr">（${_escH(r.text || '')}）</span>`
                : _escH(r.text || '');
            const wit  = _escH((r.witnesses || []).join(' · '));
            return `<div class="mvv-app-rdg">${numHtml}<span class="mvv-app-rdg-text">${textInner}</span><span class="mvv-app-rdg-wit">${wit}</span></div>`;
        }).join('');
        return `<div class="mvv-app-entry">${lemHtml}${annoHtml}${rdgHtml}</div>`;
    });
    return `<div class="mvv-apparatus-entries">${parts.join('')}</div>`;
}

/**
 * #wlv-apparatus-slot を apparatus.json の結果で非同期に埋める。
 * 対象節に異読がなければ何も注入しない（静寂優先）。
 * 世代カウンタで fast verse-switching による古い結果の誤注入を防ぐ。
 */
async function _fillApparatusSection(bookKey, ch, vNum, area) {
    if (!area) return;
    const myGen = (area._apparatusNoteGen || 0) + 1;
    area._apparatusNoteGen = myGen;
    const [data, jaData, lemJaData, rdgJaData] = await Promise.all([_loadApparatusData(), _loadApparatusJaAllData(), _loadApparatusLemJaData(), _loadApparatusRdgJaData()]);
    if (myGen !== area._apparatusNoteGen) return;
    if (!data) return;
    const verseKey = `${bookKey} ${ch}:${vNum}`;
    const idxs = data.byVerse[verseKey];
    if (!idxs || !idxs.length) return;
    const entries = idxs.map(i => data.entries[i]);
    const jaEntries = jaData && jaData.entries;
    const lemJaEntries = lemJaData && lemJaData.entries;
    const rdgJaEntries = rdgJaData && rdgJaData.entries;
    const html = _buildApparatusHTML(entries, jaEntries, lemJaEntries, rdgJaEntries);
    if (!html) return;
    const slot = area && area.querySelector('#wlv-apparatus-slot');
    if (!slot) return;
    if (area.id === 'word-list-view') {
        /* PC版は「この節の読書メモ」と同じく常時表示。開閉 UI は付けない。 */
        slot.outerHTML = `<section class="wlv-reading-passage-note study-panel-apparatus-note"><span class="wlv-pn-label">本文の異読 <span class="mvv-app-count">${entries.length}件</span></span>${html}</section>`;
    } else {
        /* モバイル版の既存 UI はそのまま維持する。 */
        slot.outerHTML = `<details class="mvv-passage-note mvv-apparatus-note"><summary>本文の異読 <span class="mvv-app-count">${entries.length}件</span></summary>${html}</details>`;
    }
}

/**
 * 語ドロワーの resonance テキストと「この節の読書メモ」を比較し、
 * 同一文の場合は読書メモを非表示にする。
 * @param {string} resoText - #wlv-dd-resonance の現在のテキスト（trim済み）
 */
function _syncWlvPassageNoteVisibility(resoText) {
    const pnEl = document.querySelector('.wlv-reading-passage-note');
    if (!pnEl) return;
    /* 全段落を結合して比較する。節レベル現象の段落を含む場合は語ドロワーと
       全体一致しない（= 読書メモにしかない情報がある）ため隠さない。 */
    const pnText = Array.from(pnEl.querySelectorAll('.wlv-pn-prose p'))
        .map(p => (p.textContent || '').trim()).filter(Boolean).join('');
    pnEl.style.display = (resoText && pnText && resoText === pnText) ? 'none' : '';
}

/* ═════════════════════════════════════════════════════════════════
 * 単語クリック時の表示（Wordレイヤー）— ReadingFormatter 統一版
 *
 * 旧 _buildResonanceText（pos/tense/voice/mood ごとの独自ヒューリス
 * ティック文と、resonance専用の CONJ_FEEL辞書）は完全に削除した。
 *
 * Word レイヤーは新規の文章を一切生成しない。クリックされた語が
 * 属する節（あれば、最も範囲の狭い節）を ClauseAnalyzer の結果から
 * 特定し、その節の discourse 判定結果を wordContext.clauseContext と
 * して ReadingFormatter.format(wordContext) に渡すだけ — 「節の意味の
 * 一部として単語を見る」という Wallace 思想のとおり、単語自体の
 * 文法（reason/purpose 等の分析語、grammarタグ、confidence）は
 * 一切表示しない。
 *
 * 意味のある clauseContext が見つからない場合（語がどの節にも
 * 属さない、または解析自体が行えない）は null を返し、呼び出し側で
 * 完全に非表示にする（説明文で埋めない＝静寂優先）。
 * ═════════════════════════════════════════════════════════════════ */

/**
 * words 配列中の idx 番目の語が属する節（あれば最も範囲の狭い節）を返す。
 */
function _findEnclosingClause(clauseResults, idx) {
    let best = null;
    for (const c of clauseResults) {
        if (c.start <= idx && idx <= c.end) {
            if (!best || (c.end - c.start) < (best.end - best.start)) best = c;
        }
    }
    return best;
}

/**
 * 1語（words[idx]）について、その語が属する節の ReadingFormatter 文を
 * 返す。単語レベルの独立解釈は一切行わない。
 * @returns {Promise<string|null>} 意味のある clauseContext が無ければ null
 */
async function _buildWordResonanceText(words, idx) {
    if (!words || words.length === 0 || idx == null || !words[idx]) return null;

    const clauseResults = await _getWallaceClauseAnalysis(words);
    if (!clauseResults || clauseResults.length === 0) return null;

    const clause = _findEnclosingClause(clauseResults, idx);
    if (!clause) return null; // ⑤ 意味のある clauseContext が無い → 完全非表示

    const pipeline = await _ensureWallacePipeline();
    if (!pipeline) return null;
    const { ca, rf } = pipeline;

    const w = words[idx];
    const discourse = ca.classifyDiscourseRelation(words, clause);
    const wordContext = {
        type:          w.lemma || w.morph || '',
        text:          w.text  || '',
        verseContext:  w.verse != null ? String(w.verse) : '',
        clauseContext: { discourse, type: clause.type },
    };
    const formatted = rf.format(wordContext);
    const clauseSentence = (formatted && formatted.summary) || null;

    /* Phase 25B-1: Reading Support Projection の top.id をテンプレート選択キー
       としてのみ利用し、語粒度の 1 文を節の文に「加える」（Mapping §3.1）。
       - 帯C（confidence < 0.40）・候補なし・テンプレ未整備・既存文と重複・
         Projection null では従来どおり節の文のみ（静寂条件 = Phase 25A §5）。
       - 文の生成は従来どおり ReadingFormatter.format/combine のみが行う。 */
    let wordSentence = null;
    try {
        const proj = await _getReadingSupportProjection(words);   // キャッシュ再利用のみ
        const pw = proj && proj.words ? proj.words[idx] : null;
        if (pw && pw.top && pw.top.confidence >= 0.40) {
            const unclassified = rf.format({}).summary;           // 未整備判定の基準文
            const f2 = rf.format({ type: pw.top.id });
            const s2 = (f2 && f2.summary) || null;
            if (s2 && s2 !== unclassified && s2 !== clauseSentence) wordSentence = s2;
        }
    } catch (_) { wordSentence = null; }

    if (clauseSentence && wordSentence) {
        const combined = rf.combine([clauseSentence, wordSentence]);
        return combined || clauseSentence;
    }
    return clauseSentence || null;
}

let _wlvResonanceGen = 0; // 古い非同期結果の誤注入を防ぐ世代カウンタ

/**
 * #wlv-dd-resonance を ReadingFormatter の結果で非同期に埋める。
 * 表示すべき内容が無ければ空のまま（静寂優先）。
 */
async function _fillWlvResonance(ddReso, words, idx) {
    if (!ddReso) return;
    const myGen = ++_wlvResonanceGen;
    ddReso.textContent = '';
    const sentence = await _buildWordResonanceText(words, idx);
    if (myGen !== _wlvResonanceGen) return; // 既に別の語に移動済み
    if (sentence) ddReso.textContent = sentence;
    /* 節全体の読書メモと同一文なら非表示 */
    _syncWlvPassageNoteVisibility((sentence || '').trim());
}

 */
/* __FLOW_CHIP_BEGIN__
   Stage B: Flow Renderer（docs/flow-rendering.md）[FROZEN 2026-07-17]
   基準値: NT 137,741 トークン / チップ変更 39,485 / 破損形（新）0 /

   変更時は scripts/re-stageB-regression.cjs へ回帰ケース追加 →

   チップ・ドロワー・原語タブはすべてこれを再利用する（再実行禁止）。 */
let _verseResolveCache = null;   // { words, resolved }
function _getVerseResolved(words) {
    try {
        if (!window.App?.readingEngine || !Array.isArray(words) || words.length === 0) return null;
        if (_verseResolveCache && _verseResolveCache.words === words) {
            return _verseResolveCache.resolved;
        }
        const resolved = new Array(words.length).fill(null);
        for (let k = 0; k < words.length; k++) {
            const ctx = _buildReadingContext(words, k);
            if (!ctx) continue;
            resolved[k] = window.App.readingEngine.resolve(words[k], ctx) || null;
        }
        _verseResolveCache = { words, resolved };
        return resolved;
    } catch (_) {

    }
}

/**
 * @param {Object} w       - 語トークン（生JSON）
 * @param {number} i       - 節内インデックス
 * @param {string} [_bookKey] - 書物キー（呼び出し元が持つ構造フィールド）
 * @param {number} [_ch]      - 章番号（呼び出し元が持つ構造フィールド）
 * @param {Object|null} [_resolved] - Engine resolve 結果（Stage B）。
 *        指定時: Tier 0/1（Engine が日本語の SSOT）。
 *        未指定（undefined）: Tier 2 = 従来動作（既存呼び出し互換）。
 * @param {Object[]} [_words] - 節トークン配列（Stage C P1: 表示整形用。
 *        省略時は整形なし = 従来表示）。
 */
function _wordToFlowChip(w, i, _bookKey, _ch, _resolved, _words) {
    const greek    = w.text   || '-';
    const rawMorph = w.morph  || '';
    const lemma    = w.lemma  || '';
    // ★ ref は表示専用。ナビゲーション/ロジックには bookKey / ch / verse を使う。
    const ref      = w.ref    || '';
    // ★ SSOT: 書物キー・章番号は構造フィールドから取得（ref パース禁止）
    // 生データのフィールド名は book / chapter（bookKey / ch ではない）なのでフォールバック追加
    const bookKey  = w.bookKey  || w.book    || _bookKey || '';
    const ch       = w.ch      != null ? w.ch
                   : w.chapter != null ? w.chapter
                   : _ch       != null ? _ch
                   : null;
    const verse    = w.verse    != null ? w.verse    : null;
    const strong   = normalizeStrong(w.strong);
    // Stage B: 日本語の決定は Reading Engine（docs/flow-rendering.md §0）。
    //   Tier 0: _resolved.japanese / Tier 1: 素の w.japanese /
    //   Tier 2（_resolved === undefined = 旧呼び出し）: 従来経路
    const _engineJa = (_resolved !== undefined)
        ? ((_resolved && typeof _resolved.japanese === 'string') ? _resolved.japanese : null)
        : undefined;
    const jaWord = (_engineJa !== undefined && _engineJa !== null)
        ? _engineJa
        : (w.japanese || '—');

    const parts    = rawMorph.split('-');
    const pos      = parts[0] || '';

    /* ── グロス自然化（Tier 2 = 旧経路のみ。Tier 0/1 では適用しない） ── */
    let gloss = jaWord;

    /* Stage C P1: 表示整形（Presentation Policy — 表示のみ。jaWord は生のまま。
       docs/presentation-policy.md。_words 省略時・Policy 未ロード時は整形なし） */
    if (_engineJa !== undefined && _engineJa !== null &&
        _words && window.App?.PresentationPolicy) {
        gloss = window.App.PresentationPolicy.formatDisplay(
            gloss, _resolved.source, _words, i);
    }

    /* 動詞の法・時制に応じた接尾調整 */
    if (_engineJa === undefined && pos === 'V' && parts[1]) {
        const off       = /^[0-9]/.test(parts[1]) ? 1 : 0;
        const tenseCode = parts[1][off]     || '';
        const voiceCode = parts[1][off + 1] || '';
        const moodCode  = parts[1][off + 2] || '';

        /* 分詞：「〜ながら」「〜した（上で）」など */
        if (moodCode === 'P') {
            if (tenseCode === 'P') gloss = _naturalize(jaWord, 'part-pres');
            else if (tenseCode === 'A') gloss = _naturalize(jaWord, 'part-aor');
            else if (tenseCode === 'X') gloss = _naturalize(jaWord, 'part-perf');
        }
        /* 不定詞 */
        else if (moodCode === 'N') {
            gloss = _naturalize(jaWord, 'inf');
        }
        /* 命令法 */
        else if (moodCode === 'M') {
            gloss = _naturalize(jaWord, 'imp');
        }
        /* 受動態 */
        if (voiceCode === 'P') {
            gloss = _naturalize(gloss, 'pass');
        }
    }

    /* 冠詞：gloss/lemma をそのまま使う（他の品詞と統一） */

    /* roleClass：chip dot の色付けと signal 生成 */
    const dpGrammarClasses = buildDepthGrammarClasses(rawMorph).join(' ');
    
    let roleClass = 'role-other';
    const signals = [];

    if (pos === 'V') {
        roleClass = 'role-verb';
        const off      = /^[0-9]/.test(parts[1] || '') ? 1 : 0;
        const moodCode = (parts[1] || '')[off + 2] || '';
        const tenCode  = (parts[1] || '')[off]     || '';
        const voiCode  = (parts[1] || '')[off + 1] || '';

        /* 法（Mood）シグナル - 読書感覚の言葉で */
        if (moodCode === 'M') signals.push({ label: '強く勧めている', cls: 'sig-exhort' });
        else if (moodCode === 'P') signals.push({ label: '背景を描いている', cls: 'sig-logic' });
        else if (moodCode === 'N') signals.push({ label: '目的を示している', cls: 'sig-logic' });
        else if (moodCode === 'S') signals.push({ label: '願いを込めている', cls: 'sig-logic' });

        /* 時制シグナル - 読書感覚の言葉で */
        if (tenCode === 'X') signals.push({ label: '今も続いている', cls: 'sig-promise' });
        else if (tenCode === 'A' && moodCode === 'I') signals.push({ label: '一つの出来事として語っている', cls: 'sig-declare' });
        else if (tenCode === 'F' && moodCode === 'I') signals.push({ label: '確かに起きると語っている', cls: 'sig-promise' });

        /* 態シグナル */
        if (voiCode === 'P') signals.push({ label: '受けとめる側に立っている', cls: 'sig-word' });
        else if (voiCode === 'M' || voiCode === 'D') signals.push({ label: '深く関わりながら動いている', cls: 'sig-word' });
    }
    else if (pos === 'N')    {
        roleClass = 'role-noun';
        const caseParts = parts[1] || '';
        const base = ['1','2','3'].includes(caseParts[0]) ? caseParts.slice(1) : caseParts;
        const CASE_SIG = {
            N: { label: '中心にいる', cls: 'sig-logic' },
            G: { label: '結びついている', cls: 'sig-logic' },
            D: { label: '関わりを受けている', cls: 'sig-logic' },
            A: { label: '動作の向かう先', cls: 'sig-logic' },
            V: { label: '呼びかけられている', cls: 'sig-logic' }
        };
        const cs = CASE_SIG[base[0]];
        if (cs) signals.push(cs);
        const NUM_SIG = { P: { label: '複数で語られている', cls: 'sig-logic' } };
        const ns = NUM_SIG[base[1]];
        if (ns) signals.push(ns);
    }
    else if (pos === 'A')    {
        roleClass = 'role-adj';
        const caseParts = parts[1] || '';
        const base = ['1','2','3'].includes(caseParts[0]) ? caseParts.slice(1) : caseParts;
        const CASE_SIG = {
            N: { label: '特徴を示している', cls: 'sig-logic' },
            G: { label: '性質を結びつけている', cls: 'sig-logic' },
            D: { label: '関わる対象を彩っている', cls: 'sig-logic' },
            A: { label: '対象の様子を語っている', cls: 'sig-logic' }
        };
        const cs = CASE_SIG[base[0]];
        if (cs) signals.push(cs);
    }
    else if (pos === 'CONJ') {
        roleClass = 'role-conj';
        const CONJ_SIG = {
            'γάρ':  { label: 'なぜなら、と理由へ進む', cls: 'sig-logic' },
            'ἀλλά': { label: 'しかし、と流れが変わる', cls: 'sig-turn' },
            'οὖν':  { label: 'だから、と結論へ向かう', cls: 'sig-logic' },
            'δέ':   { label: '話が次の段階へ進む', cls: 'sig-turn' },
            'καί':  { label: 'さらに、と積み重なる', cls: 'sig-emphasis' },
            'ἵνα':  { label: '〜のために、と目的が示される', cls: 'sig-logic' },
            'ὅτι':  { label: '〜ということ、と内容が続く', cls: 'sig-logic' },
            'εἰ':   { label: 'もし〜なら、と仮定の話に入る', cls: 'sig-logic' },
            'ὥστε': { label: 'その結果として、と帰結が来る', cls: 'sig-logic' },
        };
        const cs = CONJ_SIG[w.text];
        if (cs) signals.push(cs);
        else signals.push({ label: '前後をつないでいる', cls: 'sig-logic' });
    }
    else if (pos === 'PREP') { roleClass = 'role-prep'; signals.push({ label: '関係の方向を示している', cls: 'sig-logic' }); }
    else if (pos === 'T')    { roleClass = 'role-art'; /* 冠詞はsignalなし。静かに */ }
    else if (['P','R','D'].includes(pos)) {
        roleClass = 'role-pron';
        const caseParts = parts[1] || '';
        const base = ['1','2','3'].includes(caseParts[0]) ? caseParts.slice(1) : caseParts;
        const CASE_SIG = {
            N: { label: '誰の話かを示している', cls: 'sig-logic' },
            G: { label: '誰に関わるかを示している', cls: 'sig-logic' },
            D: { label: '関わりを受けている人を指す', cls: 'sig-logic' },
            A: { label: '動作の向かう人を指す', cls: 'sig-logic' }
        };
        const cs = CASE_SIG[base[0]];
        if (cs) signals.push(cs);
    }

    /* 句区切りの判定：接続詞・前置詞の前で区切る */
    const phraseBreakBefore = (pos === 'CONJ' && i > 0) || (pos === 'PREP' && i > 0);

    /* morphText：ドロワーに表示する人が読める文法メモ */
    const morphText = _buildMorphText(rawMorph, pos, parts);

    // ★ SSOT: bookKey / ch / verse を chip に持たせる。
    //          openStudyPanel 等のロジックはこれらを使い、ref 文字列に依存しない。
    const language = w.language  || 'grc';
    const corpusId = w.corpusId  || '';
    const lemmaId  = w.lemmaId   != null ? w.lemmaId : null;
    // VR-2 Phase 1: Token Identity Contract（docs/development/verse-representation-design.md）。
    //   tokenId = runtime内 Canonical Identity（bible_data 由来、NT全体で一意）。
    //   verseId = persistent identity（Lowfat xml:id 由来、cross-build 安定）。
    //   本フェーズでは Representation への保持のみを行う。Consumer側（Renderer/
    //   Interaction）はまだこれらを参照しない（Phase 2 以降）。
    const tokenId  = w.tokenId  != null ? w.tokenId  : null;
    const verseId  = w.verseId  != null ? w.verseId  : null;
    return { greek, gloss, roleClass, phraseBreakBefore, signals, morphText, jaWord, rawMorph, lemma, ref, strong, dpGrammarClasses, bookKey, ch, verse, language, corpusId, lemmaId, tokenId, verseId };
}

function _buildReadingContext(words, idx) {
    try {
        /* Stage D: ReadingContext が唯一の Context Source */
        const RC = window.App?.readingContext;
        if (RC) {
            const c = RC.getContext(words, idx);
            if (c) return c;
        }
        /* fallback（観測可能）: Context Layer 未ロード or getContext null のときのみ

        if (window.App?._readingCtxStats) window.App._readingCtxStats.rcFallback++;
        const CB = window.App?.syntax?.ContextBuilder;
        if (!CB || !Array.isArray(words) || !words[idx]) return null;
        const ctx = CB.build(words[idx], words, idx);
        return {
            tokens:    words,
            targetIdx: idx,
            phrases:   Array.isArray(ctx?.phrases) ? ctx.phrases : [],
            hasPassiveVerb: words.some(w =>
                (w.class || '') === 'verb' && (w.voice || '') === 'passive'),
            /* Phase 3-A: 主格の は/が 判定用（純粋データのみ） */
            mainVerb: ctx?.mainVerb ? {

                person: ctx.mainVerb.person || '',
                number: ctx.mainVerb.number || '',
                mood:   ctx.mainVerb.mood   || '',

            clause: ctx?.clause ? {
                start: ctx.clause.start,
                end:   ctx.clause.end,
                subordinate: ctx.clause.subordinate === true,

        return null;
    }
}

function _toColumnMode(transId) {

    if (transId === 'DISCOURSE' || transId === 'STRUCTURAL' || transId === 'STRUCTURE'

 * @param {string|number} vNum
 * @param {Object[]} words - 既存の elByVerse[vNum] 等（無加工でそのまま保持）
 * @returns {Verse}
 */
function buildVerse(bookKey, ch, vNum, words) {
    return {
        verseRef: { book: bookKey || '', chapter: (ch != null ? ch : null), verse: vNum },
        tokens: Array.isArray(words) ? words : [],
    };
}

/**
 * Verse から AnalysisResult[] を取得する。中身は既存 _getVerseResolved() の呼び出しのみ
 * （Reading Engine・resolve() 自体には一切手を加えない。唯一の SSOT を維持）。
 * @param {Verse} verse
 * @returns {(Object|null)[]|null}
 */
function getAnalysis(verse) {
    try {
        if (!verse || !Array.isArray(verse.tokens)) return null;
        return _getVerseResolved(verse.tokens);
    } catch (_) {
        return null;
    }
}

/**
 * WordOrder Representation の1チップ分の形。中身は既存 _wordToFlowChip() の戻り値と
 * 同一（greek / gloss / roleClass / morphText / phraseBreakBefore / signals を含む）。
 * @typedef {{ greek: string, gloss: string, roleClass: string, morphText: string,
 *             phraseBreakBefore: boolean, signals: Object[] }} FlowChip
 */

/**
 * Representation — Analysis / 翻訳テキストを displayMode 別の構造化データに整える
 * （docs/.../verse-representation-design.md C章）。
 * Phase VR-3B: WordOrder Representation を正式化。{ kind, verseRef, chips[] } の
 * 最小契約とし、Renderer が Reading Engine / _getVerseResolved / words を直接扱わずに
 * 済む形にする（Renderer に渡すのは chips のみ）。
 * ★ WordOrderBuilder（本関数の wordOrder 分岐）は既存 _wordToFlowChip() を呼んで
 *   Analysis 結果を chip 形式へ転写するだけであり、新しい日本語生成は行わない。
 * @param {ColumnMode} columnMode
 * @param {Verse} verse
 * @param {(Object|null)[]|null} analysis - getAnalysis(verse) の結果（wordOrder系のみ使用）
 * @param {string} [translationText] - 対象節の翻訳文字列（translation系のみ使用）
 * @returns {Object|null}
 */
function buildRepresentation(columnMode, verse, analysis, translationText) {
    try {
        if (!columnMode) return null;
        if (columnMode.kind === 'translation') {
            return {
                kind: 'translation',
                verseRef: verse ? verse.verseRef : null,
                translationId: columnMode.translationId,
                text: (translationText != null ? translationText : ''),
            };
        }
        if (columnMode.kind === 'wordOrder') {
            const tokens  = verse ? verse.tokens : [];
            const bookKey = (verse && verse.verseRef) ? verse.verseRef.book : '';
            const ch      = (verse && verse.verseRef) ? verse.verseRef.chapter : null;
            /* WordOrderBuilder: 既存 _wordToFlowChip() で Analysis 結果を chip へ
               転写するだけ（_buildFlowTabHTML() が内部で行っていたのと同じ呼び出し。
               resolve() の再計算はしない — analysis は呼び出し元の getAnalysis(verse) の
               結果をそのまま使う）。 */
            const chips = tokens.map((w, i) => _wordToFlowChip(w, i, bookKey, ch,
                analysis ? analysis[i] : undefined, tokens));
            return {
                kind: 'wordOrder',
                verseRef: verse ? verse.verseRef : null,
                chips,
            };
        }
        return null; // 'syntaxTree' 等、未実装の kind は Unresolved by Design
    } catch (_) {
        return null;
    }
}

/* 語の役割で読む レンダー関数。
   SR JSON → RoleReadingAdapter（シム木）→ RoleReadingLayout（作業スペースの
   エディタ配置コアの移植）→ 文ごとの SVG。座標は作業スペース側が正で、

async function _renderRoleReadingView(app, srData, elData) {

        const errEl = document.createElement('div');
