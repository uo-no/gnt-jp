    .list-item-action-btn { width: 44px; height: 44px; }
}

/* ── Highlight V1 ──────────────────────────────────────────── */
/* Verse-level highlight: left border on verse-block */
.verse-block.hl-verse-yellow { border-left: 3px solid rgba(252,204,0,0.65); }
.verse-block.hl-verse-blue   { border-left: 3px solid rgba(0,76,151,0.65); }
.verse-block.hl-verse-green  { border-left: 3px solid rgba(21,114,44,0.65); }
.verse-block.hl-verse-red    { border-left: 3px solid rgba(235,97,0,0.65); }

/* Word/phrase chip highlight */
.wlv-chip.wlv-chip-cont { padding-left: 0; padding-right: 0; }
.wlv-chip.hl-word-yellow { background: rgba(252,204,0,0.28) !important; border-radius: 3px; }
/* 口語訳アラインメント: 対応づいた訳文区間（タップ可能な語句） */
.ja-seg { cursor: pointer; border-radius: 3px; }
.ja-seg:active { background: var(--accent-mid); }
.ja-seg.hl-word-yellow { background: rgba(252,204,0,0.28); }
.ja-seg.hl-word-blue   { background: rgba(0,76,151,0.25); }
.ja-seg.hl-word-green  { background: rgba(21,114,44,0.25); }
.ja-seg.hl-word-red    { background: rgba(235,97,0,0.25); }
.ja-seg.hl-multi-selected, .ja-seg.hl-touch-selected { outline: 2px solid var(--accent); outline-offset: 2px; background: rgba(21,114,44,.13); }
.wlv-chip.hl-word-blue   { background: rgba(0,76,151,0.25) !important; border-radius: 3px; }
.wlv-chip.hl-word-green  { background: rgba(21,114,44,0.25) !important; border-radius: 3px; }
.wlv-chip.hl-word-red    { background: rgba(235,97,0,0.25) !important; border-radius: 3px; }

/* Range selection mode: start chip indicator */
/* 長押しでハイライトする際、iOS標準の選択メニュー（コピー／選択部分を検索／
   調べる／翻訳）はアプリ側のカラーピッカーと重なって煩いだけなので、本文エリア
   では出さない。テキスト選択と青いハンドル（範囲調整）はそのまま使える。 */
#bible-text-area, #parallel-text-area { -webkit-touch-callout: none; }
/* ── 下部カードの共通様式（ピーク／色ピッカー／操作バー／選択バー） ──
   画面下部に出る面は、ピークを基準に同じ様式へそろえる：背景 --bg-paper、
   枠 1px --border-soft、角丸 --radius-m、影 --shadow-card（Design System の
   shadow-panel と同値のアプリトークン）。モバイル（≤900px）では左右
   --space-md インセットの全幅、下端 calc(safe-area + --space-md)。
   出現は Design System の Motion 規範（Popover／Sheet はフェード
   200–260ms ease-out、装飾モーションなし）に従い、共通のフェードで統一する。 */
@keyframes bottomCardIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
    .word-peek, #hl-color-picker.hl-open, #hl-touch-pill.hl-show, #hl-selection-bar.hl-open { animation: none !important; }
}
/* Color picker popup */
#hl-color-picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8990;
}
#hl-color-picker-overlay.hl-open { display: block; }
#hl-picker-word {
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 10px;
}
.hl-picker-meaning {
    font-size: 16px; font-weight: 700; color: var(--text-main);
    line-height: 1.45;
    padding-right: 26px; /* 右上の×ボタンと重ならない */
}
.hl-picker-nametag {
    margin-top: 2px;
    display: flex; gap: var(--space-sm); flex-wrap: wrap;
    font-size: var(--text-caption); color: var(--text-sub);
}
#hl-picker-greek {
    font-family: "GFS Didot", "Palatino Linotype", Georgia, serif;
    font-size: 14px; font-weight: 600;
}
#hl-color-picker {
    display: none;
    position: fixed;
    z-index: 8991;
    background: var(--bg-paper);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    padding: var(--space-md);
    flex-direction: column;
    gap: 10px;
    min-width: 200px;
}
#hl-color-picker.hl-open { display: flex; animation: bottomCardIn .22s ease-out; }
/* 色と「範囲指定」は上下に積まず、1行に横並びにする（色＝主役を左、
   範囲指定＝モード切替を右端）。範囲指定が隠れる状態では色だけが左に残る。 */
.hl-picker-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hl-picker-row { display: flex; gap: 8px; align-items: center; }
.hl-picker-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
}
.hl-picker-swatch:hover,
.hl-picker-swatch.hl-selected { transform: scale(1.18); border-color: var(--text-sub); }
.hl-picker-swatch[data-color="yellow"] { background: #fccc00; }
.hl-picker-swatch[data-color="blue"]   { background: #004c97; }
.hl-picker-swatch[data-color="green"]  { background: #15722c; }
.hl-picker-swatch[data-color="red"]    { background: #eb6100; }
/* 削除は色見本の並びに置く「色なし＋バツ」の丸ボタン（文言ボタンは廃止）。
   表示/非表示は従来どおり _hlOpenPicker が style.display で切り替える。 */
.hl-picker-delete {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--text-hint);
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
}
.hl-picker-delete svg { width: 13px; height: 13px; display: block; }
.hl-picker-delete:hover { transform: scale(1.18); border-color: var(--text-sub); }
/* タッチ選択中に画面下部へ出す操作バー（ハイライト／範囲指定）。
   以前は黒いピル型だったが、下部カードの共通様式（ピーク基準）に統一し、
   ボタンもピークの2ボタン（主＝--highlight-light 塗り、副＝枠線、角 --radius-s）
   と同系統にした（Design System は pill 半径を Segmented Control に限定）。
   ピッカーのオーバーレイ（z-index 8990）より下に置き、開いたら隠れる。 */
#hl-touch-pill {
    display: none;
    position: fixed;
    left: 50%;
    bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 8989;
    align-items: stretch;
    gap: var(--space-sm);
    padding: var(--space-sm);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    background: var(--bg-paper);
    box-shadow: var(--shadow-card);
    -webkit-tap-highlight-color: transparent;
}
#hl-touch-pill.hl-show { display: flex; animation: bottomCardIn .22s ease-out; }
.hl-pill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: var(--space-sm) var(--space-md);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-s);
    background: transparent;
    color: var(--text-main);
    font: inherit;
    font-size: var(--text-body);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}
/* 主ボタン（ハイライト）はピークの「詳しく見る」と同じ塗り様式 */
#hl-pill-btn-color { background: var(--highlight-light); color: var(--highlight); border-color: transparent; }
.hl-pill-btn svg { width: 1.05em; height: 1.05em; display: block; }
@media (max-width: 900px) {
    /* モバイルではピークと同じ全幅インセット（FAB は幾何学的に背後へ隠れる） */
    #hl-touch-pill { left: var(--space-md); right: var(--space-md); transform: none; }
    .hl-pill-btn { flex: 1; }
}
.hl-picker-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hl-picker-action { border: 1px solid var(--border-soft); border-radius: var(--radius-s); background: transparent; color: var(--text-main); padding: var(--space-sm) var(--space-md); font: inherit; font-size: var(--text-caption); cursor: pointer; white-space: nowrap; }
.hl-picker-action:hover { border-color: var(--accent-mid); }
/* 選択バーも下部カードの共通様式（背景・角丸・影・余白）にそろえる。 */
#hl-selection-bar { display: none; position: fixed; z-index: 8992; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); align-items: center; gap: 10px; max-width: calc(100vw - 24px); padding: var(--space-sm); border: 1px solid var(--border-soft); border-radius: var(--radius-m); background: var(--bg-paper); box-shadow: var(--shadow-card); color: var(--text-main); font-size: var(--text-caption); }
#hl-selection-bar.hl-open { display: flex; animation: bottomCardIn .22s ease-out; }
#hl-selection-count { white-space: nowrap; }
.hl-selection-bar-btn { border: 1px solid var(--border-soft); border-radius: var(--radius-s); background: transparent; color: var(--text-main); padding: var(--space-sm) var(--space-md); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.hl-selection-bar-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
@media (max-width: 900px) {
    /* モバイルではピークと同じ全幅インセット＋下端にそろえる */
    #hl-selection-bar { left: var(--space-md); right: var(--space-md); bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px)); transform: none; max-width: none; }
    #hl-selection-count { flex: 1; }
}
.wlv-chip.hl-multi-selected { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; background: rgba(21,114,44,.13); }

/* Highlight list page: color filter tabs */
.hl-filter-tabs {
    display: flex;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
    flex-wrap: wrap;
}
.hl-filter-tab {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-soft);
    background: none;
    font-size: var(--text-caption);
    color: var(--text-sub);
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--transition-fast), border-color var(--transition-fast);
}
.hl-filter-tab:hover { background: var(--accent-light); }
@media (pointer: coarse) {
    .hl-filter-tab { min-height: 44px; padding: var(--space-sm) var(--space-md); }
}
.hl-filter-tab.hl-tab-active {
    background: var(--accent-light);
    border-color: var(--highlight);
    color: var(--text-main);
}
.hl-tab-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}

/* Highlight list item: color swatch dot */
.hl-list-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
    flex-shrink: 0;
}
.hl-list-dot[data-color="yellow"] { background: #fccc00; }
.hl-list-dot[data-color="blue"]   { background: #004c97; }
.hl-list-dot[data-color="green"]  { background: #15722c; }
.hl-list-dot[data-color="red"]    { background: #eb6100; }

/* ── Highlight & Recent list: verse text preview ────────────── */
.list-item-preview {
    margin-top: var(--space-sm);
    font-size: var(--text-body-lg);
    line-height: 1.75;
    color: var(--text-main);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.list-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
}
.list-page-header-link {
    font-size: var(--text-caption);
    color: var(--highlight);
    cursor: pointer;
    opacity: var(--opacity-secondary);
    transition: opacity var(--transition-fast);
}
.list-page-header-link:hover { opacity: var(--opacity-primary); }
.static-page h3 {
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--text-main);
    margin: var(--space-lg) 0 var(--space-sm);
    padding-bottom: var(--space-xs);
    border-bottom: 1px solid var(--border-soft);
    letter-spacing: 0.02em;
}
.static-page section { margin-bottom: 40px; }
/* 一覧ページは各セクション固有の余白（続きを読む・履歴グループ）を優先する。 */
.static-page.list-page section { margin-bottom: 0; }
.static-page p { color: var(--text-sub); margin: var(--space-sm) 0; }
/* Changelog: 各リリースの「なぜ変えたか」を表す1行。区切り線は使わず余白のみで区切る。 */
.static-page p.changelog-story { font-size: var(--text-caption); }
/* Roadmap: イントロ文 */
.static-page p.roadmap-intro { color: var(--text-sub); margin-bottom: var(--space-lg); }
/* Roadmap: 各項目カード */
.static-page .roadmap-item {
    padding: var(--space-sm) 0;
    border-bottom: 1px solid var(--border-light, rgba(0,0,0,.06));
}
.static-page .roadmap-item:last-child { border-bottom: none; }
.static-page .roadmap-item-title { color: var(--text-main); font-size: var(--text-body); margin-bottom: 2px; }
.static-page .roadmap-item-detail { color: var(--text-sub); font-size: var(--text-caption); line-height: 1.6; }
.static-page ul { padding-left: var(--space-md); color: var(--text-sub); }
.static-page li { margin-bottom: var(--space-sm); }
.static-page strong { color: var(--text-main); }
.static-page aside {
    background: var(--highlight-light);
    border-left: 3px solid var(--highlight);
    border-radius: 0 var(--radius-s) var(--radius-s) 0;
    padding: var(--space-md) var(--space-md);
    margin-bottom: var(--space-md);
    color: var(--text-sub);
}
.static-page table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-body);
}
.static-page table th {
    text-align: left;
    padding: var(--space-sm) var(--space-sm);
    width: 30%;
    color: var(--text-sub);
    font-weight: 600;
    border-bottom: 1px solid var(--border-soft);
}
.static-page table td {
    padding: var(--space-sm) var(--space-sm);
    border-bottom: 1px solid var(--border-soft);
}
.static-page table tr:last-child th,
.static-page table tr:last-child td { border-bottom: none; }
.static-page .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    padding: var(--space-md) var(--space-md);
    margin-top: var(--space-sm);
}
.static-page .aspect-row {
    display: flex;
    align-items: baseline;
    gap: var(--space-md);
    padding: var(--space-sm) 0;
    border-bottom: 1px solid var(--border-soft);
}
.static-page .aspect-row:last-child { border-bottom: none; }
.static-page .aspect-label {
    flex-shrink: 0;
    min-width: 130px;
    font-weight: 700;
}
.static-page .aspect-desc { color: var(--text-sub); }
.static-page .aspect-read {
    display: block;
    margin-top: var(--space-xs);
    color: var(--highlight);
    font-size: var(--text-body);
}
.static-page .back-wrap {
    text-align: center;
    margin-top: 40px;
    padding-bottom: var(--space-md);
}
.static-page .back-btn {
    background: var(--highlight);
    color: white;
    border: none;
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-s);
    cursor: pointer;
    font-weight: bold;
    font-size: var(--text-body);
    font-family: inherit;
    transition: opacity var(--transition-base);
}
.static-page .back-btn:hover { opacity: var(--opacity-primary); }
/* list-page（ハイライト・最近読んだ）の back-btn は本文プレビューを主役にするため
   緑の塗りつぶしを外し、薄い枠線＋控えめな文字色に止める。
   他の静的ページ（まめ知識・ロードマップ等）は変更しない。 */
.static-page.list-page .back-btn {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border);
    font-weight: normal;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
}
.static-page.list-page .back-btn:hover {
    background: var(--hover-veil);
    color: var(--text);
    opacity: 1;
    border-color: var(--border-strong);
}
.static-page.list-page .back-btn:active {
    background: var(--accent-light);
    opacity: 1;
}
/* タブ（まめ知識） */
.static-page .tabs {
    display: flex;
    gap: var(--space-xs);
    margin-bottom: var(--space-md);
    border-bottom: 2px solid var(--border-soft);
    position: sticky;
    top: 0;
    background: var(--bg-paper);
    z-index: 100;
    padding-top: var(--space-sm);
    overflow-x: auto;
}
.static-page .tab-btn {
    padding: var(--space-sm) var(--space-md);
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-sub);
    font-weight: 500;
    font-family: inherit;
    font-size: var(--text-body);
    border-bottom: 2px solid transparent;
    transition: color var(--transition-base), border-color var(--transition-base);
    white-space: nowrap;
}
.static-page .tab-btn.active {
    color: var(--highlight);
    border-bottom-color: var(--highlight);
}
.static-page .tab-content { display: none; }
.static-page .tab-content.active { display: block; animation: spFadeIn var(--transition-base); }
@keyframes spFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: var(--opacity-primary); transform: translateY(0); } }
/* ── モバイル（768px以下）静的ページ余白最適化 ── */
@media (max-width: 768px) {
    /* 親コンテナの横 padding をゼロにして静的ページ側で制御 */
    #main-reading-area.static-view #bible-text-area {
        padding-left: 0;
        padding-right: 0;
    }
    /* 静的ページ本体：max-width を解除し、左右 14px 余白のみ */
    .static-page {
        max-width: none;
        padding-left: 14px;
        padding-right: 14px;
    }
    /* タブバーを画面幅いっぱいに広げる（sticky 背景も端まで届かせる） */
    .static-page .tabs {
        margin-left: -14px;
        margin-right: -14px;
        padding-left: 14px;
        padding-right: 14px;
    }
    /* Card の余分な左右余白を除去 */
    .static-page .card {
        margin-left: 0;
        margin-right: 0;
    }
}

/* - 語形リスト行（Study panel内の一覧用：既存互換のため残す） -
   箱型カードではなく、下線区切りのみのフラットな行にする（card乱立を避ける）。
   .list-item-card と同じ medium（8px/16px）の行リズムに揃える。 */
.word-card {
background: none;
padding: var(--rhythm-medium-y) var(--rhythm-medium-x);
display: flex;
justify-content: space-between;
align-items: baseline;
margin-bottom: 0;
border: none;
border-bottom: 1px solid var(--border-soft);
cursor: pointer;
transition: background var(--transition-fast);
}
.word-card:last-child { border-bottom: none; }
.word-card:hover { background: var(--highlight-light); }
.greek-word { font-family: var(--font-greek); font-size: var(--text-headline); line-height: 1.3; }

.present-text { border-bottom: 2px solid var(--highlight); }
.aorist-text  { border-bottom: 2px dotted var(--highlight); }
.perfect-text { text-decoration: underline wavy var(--highlight); text-underline-offset: 4px; }
.future-text { border-bottom: 2px double var(--highlight); }
.indicative-text { background: var(--highlight-light); border-radius: var(--radius-s); padding: 0 var(--space-xs); }
.imperative-text { background: var(--highlight-light); border-radius: var(--radius-s); padding: 0 var(--space-xs); }

.grammar-legend { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-sm); font-size: var(--text-caption); color: var(--text-sub); border-top: 1px solid var(--border-soft); padding-top: var(--space-xs); }
.tag-jp { color: var(--text-sub); font-size: var(--text-caption); margin-left: var(--space-xs); opacity: var(--opacity-secondary); }
.strong-num { font-size: var(--text-caption); color: #9e9ea4; font-family: monospace; }

.rn-save-btn {
display: flex; align-items: center; width: 100%;
padding: var(--space-sm) var(--space-md);
font-size: var(--text-caption); font-family: inherit; font-weight: 700;
color: #fff; background: var(--highlight);
border: none; border-radius: var(--radius-s);
cursor: pointer; letter-spacing: 0.02em;
transition: opacity var(--transition-fast);
}
.rn-save-btn:hover { opacity: var(--opacity-primary); }


/* -- morph-search-btn（近くの語を見るなど、Study panel内で継続使用） -- */
.morph-search-btn {
display: inline-flex;
align-items: center;
justify-content: center;
padding: var(--space-xs) var(--space-md);
font-size: var(--text-caption);
font-family: inherit;
font-weight: 600;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--text-sub);
background: transparent;
border: 1px solid rgba(0,0,0,0.13);
border-radius: var(--radius-s);
cursor: pointer;
transition: color var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
text-decoration: none;
white-space: nowrap;
}
.morph-search-btn:hover {
color: var(--highlight);
border-color: var(--highlight);
background: var(--highlight-light);
}
.morph-search-btn:active { opacity: var(--opacity-secondary); }
.morph-search-btn .btn-icon { display: none; }

.morph-tag-row {
display: flex;
flex-wrap: wrap;
gap: var(--space-xs);
margin: 0 0 var(--space-xs);
}
.morph-tag-pill {
font-size: var(--text-caption);
padding: var(--space-xs) var(--space-sm);
border-radius: var(--radius-l);
background: var(--bg-panel);
color: var(--text-sub);
border: 1px solid var(--border-soft);
letter-spacing: 0.01em;
}
.morph-tag-pill.core {
background: var(--accent-light);
color: var(--highlight);
border-color: var(--accent-mid);
font-weight: 600;
}

.rcb-container {
display: none;
align-items: baseline;
gap: var(--space-sm);
flex-wrap: wrap;
padding: var(--space-sm) var(--space-lg) var(--space-sm);
background: var(--bg-panel);
border-bottom: 1px solid var(--border-soft);
font-size: var(--text-caption);
flex-shrink: 0;
}
.rcb-container.visible { display: flex; }
.rcb-chip-sm {
font-family: var(--font-greek);
font-size: var(--text-body-lg);
color: var(--text-main);
font-weight: 400;
}
.rcb-label-sm {
font-size: var(--text-caption);
color: var(--text-sub);
font-weight: 400;
}
.rcb-sep-sm { color: var(--border-soft); font-size: var(--text-caption); }

.no-greek-badge {
display: inline-block;
font-size: var(--text-caption);
color: var(--text-sub);
background: var(--bg-panel);
border: 1px solid var(--border-soft);
border-radius: var(--radius-s);
padding: var(--space-xs) var(--space-sm);
margin-left: var(--space-sm);
vertical-align: middle;
letter-spacing: 0.04em;
}

@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: var(--opacity-primary); transform: translateY(0); } }

/* Study panel 閉じるボタン（廃止 → depth-history に置き換え済み） */
#study-close-btn {
display: none;
}

/* ══════════════════════════════════════════
   Flow / Meaning / Study タブ 共通スタイル
   ══════════════════════════════════════════ */

.flow-word-head {
    display: flex;
    align-items: baseline;
    gap: 0;
    margin-bottom: var(--space-xs);
    flex-wrap: wrap;
}
.flow-greek {
    font-size: var(--text-headline);
}
.flow-ja {
    font-size: var(--text-caption);
    color: var(--text-sub);
    font-weight: 400;
}
.flow-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-bottom: var(--space-md);
    letter-spacing: 0.02em;
}

/* ── Flow タブ ── */
.flow-ai-area {
    margin-top: var(--space-sm);
    margin-bottom: var(--space-xs);
}
.flow-ai-content {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) var(--space-md);
    background: var(--accent-light);
    border-left: 2px solid var(--accent-mid);
    border-radius: 0 var(--radius-s) var(--radius-s) 0;
    margin-bottom: var(--space-xs);
}
.flow-ai-label {
    display: inline-block;
    font-size: var(--text-caption);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-right: var(--space-xs);
    vertical-align: middle;
}

/* ── Meaning タブ：「どう響くか」層 ── */
/* Abbott-Smith は不在。AIの contextual nuance が主役。静かなプロース。 */
.meaning-strong {
    font-size: var(--text-caption);
    color: #9e9ea4;
    font-family: monospace;
    margin-bottom: var(--space-sm);
}
/* Meaning AI 出力エリア：flow-ai-prose と共通の静かなスタイル */
.meaning-prose {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 0 var(--space-sm);
    border-left: 2px solid var(--accent-light);
    margin-top: var(--space-xs);
}
.meaning-prose-label {
    display: inline-block;
    font-size: var(--text-caption);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-right: var(--space-xs);
    vertical-align: middle;
}

/* ── Semantics セクション（Study内）：quiet scholarly notes ── */
/* dense tables・giant lexicon UI 禁止。折りたたみで必要な時だけ確認する層。 */
.semantics-abbott {
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.8;
    padding: var(--space-sm) 0 var(--space-xs);
}
.semantics-note {
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.75;
    padding: var(--space-xs) 0 var(--space-xs);
    border-top: 1px solid rgba(0,0,0,0.04);
    margin-top: var(--space-xs);
}
.semantics-note-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    display: block;
    margin-bottom: var(--space-xs);
}

/* 種別ごとの細いボーダーは維持しつつ、カード感・行列感を除去 */
.flow-signal {
    padding: 0;
    border-bottom: none;
    border-left: none;
    line-height: 1.85;
}
.flow-signal:last-child { border-bottom: none; }

/* signal種別ボーダー：flow-hints全体の左ボーダーで統合。個別signal行には付けない */
.flow-signal.sig-logic     { }
.flow-signal.sig-emphasis  { }
.flow-signal.sig-turn      { }
.flow-signal.sig-exhort    { }
.flow-signal.sig-promise   { }
.flow-signal.sig-declare   { }
.flow-signal.sig-metaphor  { }
.flow-signal.sig-word      { }
.flow-signal.sig-caution   { }
.flow-signal.sig-culture   { }
.flow-signal.sig-default   { }

/* ══ P2: Structural Diagram (sd-*) ══════════════════════════════════════════════ */
.sd-view {
    padding: var(--space-sm) var(--space-md) var(--space-xl);
    min-width: 0;
    overflow-x: auto;
}
.sd-attribution {
    font-size: 10px;
    color: var(--text-sub);
    margin-bottom: var(--space-xs);
    opacity: 0.7;
}
.sd-hint {
    display: flex;
    align-items: baseline;
    gap: var(--space-sm);
    padding: var(--space-xs) 0 var(--space-md);
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: var(--space-md);
}
.sd-hint-title { font-size: var(--text-body); color: var(--text-main); font-weight: 600; }
.sd-hint-sub   { font-size: var(--text-caption); color: var(--text-sub); }
.sd-empty      { padding: var(--space-lg); color: var(--text-sub); font-size: var(--text-caption); }

.sd-sentence {
    margin-bottom: var(--space-xl);
    padding-left: var(--space-sm);
}
/* 「語の役割で読む」は巨大なSVGが並ぶため、画面外の文の描画を遅らせて
   スクロール時の描画遅れ（空白）を抑える */
.role-reading-view .sd-sentence {
    content-visibility: auto;
    contain-intrinsic-size: auto 800px;
}
.sd-sentence-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    font-weight: 400;
    margin-bottom: var(--space-xs);
    letter-spacing: 0.02em;
}
/* C-9: DG context — verse ref styled like .v-num: unobtrusive, visually separated from DG structure */
.sd-sentence-ref--dg {
    font-weight: 400;
    color: var(--text-hint);
    letter-spacing: 0.02em;
    margin-bottom: var(--space-sm);
    padding-bottom: var(--space-xs);
    border-bottom: 1px solid var(--border);
}

/* Internal nodes */
.sd-node {
    display: block;
    margin: 2px 0;
    padding-left: var(--space-md);
    border-left: 1px solid var(--border-soft);
}
.sd-node[data-depth="0"] { padding-left: 0; border-left: none; }
.sd-node-hd {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 24px;
    padding: 2px 0;
}
.sd-node-body { margin-top: 2px; }

/* Foldable nodes — <details> already inherits margin/border from .sd-node,
   so summary must not re-add padding-left (avoids double-indent). */
.sd-foldable { display: block; margin: 2px 0; }
.sd-foldable > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    cursor: pointer;
    list-style: none;
    padding: 2px 0;
}
.sd-foldable > summary::-webkit-details-marker { display: none; }
.sd-foldable > .sd-node-body { /* children already have .sd-node padding */ }
.sd-fold-arrow {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-right: 2px solid var(--text-sub);
    border-bottom: 2px solid var(--text-sub);
    transform: rotate(45deg);
    flex-shrink: 0;
    margin-right: 2px;
}
details[open] > summary .sd-fold-arrow { transform: rotate(-135deg); }

/* Token rows */
.sd-token-row {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 3px var(--space-xs);
    margin: 2px 0;
    background: var(--bg-card);
    border-radius: 4px;
    border: 1px solid var(--border-soft);
    max-width: 100%;
}

/* FUNCTION labels on nodes and tokens */
.sd-fn-label {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--accent-bg, #e8f0fe);
    color: var(--accent-main, #1a56a0);
    letter-spacing: 0.04em;
    white-space: nowrap;
}
.sd-fn-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    background: var(--accent-bg, #e8f0fe);
    color: var(--accent-main, #1a56a0);
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
}
/* CONSTRUCTION label */
.sd-cn-label {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg-tag, #f0f0f0);
    color: var(--text-sub);
    letter-spacing: 0.03em;
    white-space: nowrap;
}
/* MORPHOLOGY badges */
.sd-morph-badge {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    background: var(--bg-morph, #f5f0e8);
    color: var(--text-sub);
    white-space: nowrap;
    flex-shrink: 0;
}

/* Greek text in tokens */
.sd-greek {
    font-family: var(--font-greek);
    font-size: var(--text-body);
    color: var(--text-main);
    font-weight: 600;
    letter-spacing: 0.01em;
}
/* Japanese gloss in tokens */
.sd-gloss {
    font-size: var(--text-caption);
    color: var(--text-sub);
}

/* Mobile */
@media (max-width: 390px) {
    .sd-view { padding: var(--space-xs) var(--space-sm) var(--space-xl); }
    .sd-hint { flex-direction: column; gap: 2px; }
    .sd-node { padding-left: var(--space-sm); }
    .sd-token-row { gap: 3px; padding: 2px var(--space-xs); }
    .sd-greek { font-size: var(--text-caption); }
}

/* ══════════════════════════════════════════════════════════════════════════════ */

.flow-signal-text {
    font-size: var(--text-body);
}

.flow-hints {
    padding-top: var(--space-md);
    padding-bottom: var(--space-xs);
    margin-bottom: var(--space-sm);
}

.flow-signal-kind {
    display: none;
}

.flow-ai-prose {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 0 var(--space-sm);
    border-left: 2px solid var(--accent-light);
    margin-top: var(--space-sm);
}
.flow-ai-prose-label {
    display: inline-block;
    margin-right: var(--space-xs);
    vertical-align: middle;
}

/* ══════════════════════════════════════════
   Syntax セクション（Study内）
   「論理の骨組み」を静かな読解補助として表示。
   linguistics software感・academic parser感禁止。
   ══════════════════════════════════════════ */

.syntax-reading {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 var(--space-sm) 0;
    margin-bottom: var(--space-xs);
}
.syntax-reading-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    display: block;
    margin-bottom: var(--space-xs);
}


/* Syntax AI補助エリア */
.syntax-ai-prose {
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.8;
    padding: var(--space-sm) 0 0 var(--space-sm);
    border-left: 2px solid var(--accent-light);
    margin-top: var(--space-xs);
    margin-bottom: var(--space-xs);
}
.syntax-ai-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-right: var(--space-xs);
    vertical-align: middle;
}
/* セクション間は線ではなくspacingで区切る。
   study-details-body の下端padding(medium) + 本要素のmargin(medium) + 次のstudy-summaryの
   上端padding(medium) を合算して macro（24px）の section間隔になるよう設計する。 */
.study-details {
    border-bottom: none;
    margin-bottom: var(--rhythm-medium-y);
}
.study-details:last-of-type { margin-bottom: 0; }
.study-summary {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-sub);
    padding: var(--rhythm-medium-y) 0;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: flex-start;
    gap: var(--space-xs);
    user-select: none;
    outline: none;
}
.study-summary-inner {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
}
.study-summary-sub {
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    text-transform: uppercase;
}
.morph-grid-expand {
    margin-top: var(--rhythm-medium-y);
    padding-top: var(--rhythm-micro);
    border-top: 1px solid rgba(0,0,0,0.04);
}
.morph-grid-expand-btn {
    background: none;
    border: none;
    font-size: var(--text-caption);
    font-family: inherit;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.02em;
    transition: opacity var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
}
.morph-grid-expand-btn svg { width: 12px; height: 12px; display: block; }
.morph-grid-expand-btn:hover { opacity: var(--opacity-primary); }
.morph-grid-extra {
    display: none;
    margin-top: var(--rhythm-micro);
}
.morph-grid-extra.visible { display: block; }
.study-summary::-webkit-details-marker { display: none; }
.study-summary::before {
    content: '›';
    font-size: var(--text-body);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    transition: transform var(--transition-fast);
    display: inline-block;
    width: 10px;
    margin-top: var(--space-xs);
}
details[open] .study-summary::before {
    transform: rotate(90deg);
}
.study-details-body {
    padding: 0 0 var(--rhythm-medium-y) 0; /* 幅統一: 左インデントなし */
}

/* ══════════════════════════════════════════
   Research Tools - Study タブ内の静かな探索補助
   ══════════════════════════════════════════

   設計思想：
   - Reading Evidence（語形・論理構造・意味論的根拠）の下に配置
   - 初期状態は折りたたみ。「研究ツールを開く」で展開
   - card乱立禁止・dense search UI禁止・analytics感禁止
   - filter controls は compact・expandable
   - 読書空間を壊さない quiet な外観を維持
   ══════════════════════════════════════════ */

/* Research Tools 全体ラッパー。Reading Evidenceからの「思考の切り替え」なので macro 間隔を置く。 */
.rt-section {
    margin-top: var(--rhythm-macro-min);
    border-top: 1px solid rgba(0,0,0,0.06);
    padding-top: var(--rhythm-medium-y);
}
.rt-open-btn {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    width: 100%;
    background: none;
    border: none;
    padding: var(--space-sm) 0;
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-sub);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: color var(--transition-fast);
}
.rt-open-btn:hover { color: var(--highlight); }
.rt-open-btn-icon {
    opacity: var(--opacity-secondary);
    transition: transform var(--transition-fast);
    display: inline-flex;
    align-items: center;
    width: 10px;
    height: 10px;
    flex-shrink: 0;
}
.rt-open-btn-icon svg { width: 100%; height: 100%; display: block; }
.rt-open-btn.expanded .rt-open-btn-icon { transform: rotate(90deg); }

/* Research Tools 本体 */
.rt-body {
    display: none;
}
.rt-body.visible { display: block; }

/* 各 Research Tool（Morph / Syntax / Semantic）の切り替えタブ */
.rt-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: var(--rhythm-medium-x);
}
.rt-tab {
    padding: var(--space-xs) var(--space-sm) var(--space-xs);
    font-size: var(--text-caption);
    font-weight: 600;
    font-family: inherit;
    color: var(--text-sub);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color var(--transition-fast), border-color var(--transition-fast);
    letter-spacing: 0.02em;
    position: relative;
    bottom: -1px;
}
.rt-tab:hover { color: var(--highlight); }
.rt-tab.active {
    color: var(--highlight);
    border-bottom-color: var(--highlight);
}

/* 各 Research Tool のコンテンツエリア */
.rt-content { display: none; }
.rt-content.visible { display: block; }

/* フィルター行：label + control をコンパクトに並べる */
.rt-filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs) var(--space-sm);
    margin-bottom: var(--space-sm);
    align-items: baseline;
}
.rt-filter-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    min-width: 24px;
    flex-shrink: 0;
}
/* select コントロール：quiet & compact */
.rt-select {
    font-size: var(--text-caption);
    font-family: inherit;
    color: var(--text-main);
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-s);
    padding: var(--space-xs) var(--space-xs);
    cursor: pointer;
    outline: none;
    transition: border-color var(--transition-fast);
    max-width: 110px;
}
.rt-select:focus { border-color: rgba(44,79,52,0.4); }

/* 実行ボタン */
.rt-run-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-md);
    font-size: var(--text-caption);
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.03em;
    color: var(--highlight);
    background: transparent;
    border: 1px solid var(--accent-mid);
    border-radius: var(--radius-s);
    cursor: pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast);
    margin-top: var(--space-xs);
}
.rt-run-btn:hover {
    background: var(--highlight-light);
    border-color: rgba(44,79,52,0.4);
}
.rt-run-btn:active { opacity: var(--opacity-secondary); }

/* 検索結果エリア */
.rt-results {
    margin-top: var(--space-sm);
    min-height: 0;
}
/* ローディング（ac-loading と同じアニメーションを流用） */
.rt-loading {
    font-size: var(--text-caption);
    color: var(--text-sub);
    padding: var(--space-sm) 0;
    text-align: center;
    animation: ac-blink 1.2s ease-in-out infinite;
    display: none;
}
.rt-loading.visible { display: block; }

/* 結果ブロック：静かな paper-like カード。乱立禁止・1項目ずつ縦積み */
.rt-result-block {
    border-left: 2px solid var(--accent-mid);
    padding: var(--space-xs) 0 var(--space-xs) var(--space-sm);
    margin-bottom: var(--space-sm);
    font-size: var(--text-caption);
    color: var(--text-main);
    line-height: 1.75;
}
.rt-result-block:last-child { margin-bottom: 0; }
.rt-result-kind {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    display: block;
    margin-bottom: var(--space-xs);
}
.rt-result-text {
    font-size: var(--text-caption);
    color: var(--text-main);
    line-height: 1.75;
}
.rt-result-ref {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-top: var(--space-xs);
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
}
.rt-result-ref svg { width: 0.85em; height: 0.85em; display: block; flex-shrink: 0; }
/* 空結果メッセージ */
.rt-no-result {
    font-size: var(--text-caption);
    color: var(--text-sub);
    text-align: center;
    padding: var(--space-md) 0;
    opacity: var(--opacity-secondary);
}
/* Semantic Search：concept チップ選択 */
.rt-concept-grid {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs);
    margin-bottom: var(--space-sm);
}
.rt-concept-chip {
    font-size: var(--text-caption);
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-l);
    background: var(--bg-panel);
    color: var(--text-sub);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    letter-spacing: 0.01em;
    user-select: none;
}
.rt-concept-chip.selected {
    background: var(--highlight-light);
    color: var(--highlight);
    border-color: rgba(44,79,52,0.3);
    font-weight: 600;
}

/* ══════════════════════════════════════════
   Word List View - 節語形リスト
   Progressive Disclosure 段階展開型。
   タブバー廃止。「流れ」を唯一の基盤UIとし、
   chipクリックでインライン展開する。
   ══════════════════════════════════════════ */

/* 外枠（flex列で flow-stream + drawer を縦積み） */
#word-list-view {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    /* スクロールバー出現による横幅変化（chips再ラップ・カラムずれ）を防ぐ。
       both-edges で左右対称に予約し、中心軸を真中心に保つ */
    scrollbar-gutter: stable both-edges;
}

/* ── 流れUI：ギリシャ語順日本語chip列 ── */
/* 常時表示。タブで隠さない。読書の延長として機能する。 */
.wlv-flow-section {
    padding: var(--space-md) var(--space-md) 0;
    flex-shrink: 0;
}
.wlv-flow-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    display: block;
    margin-bottom: var(--space-sm);
}

.wlv-flow-stream {
    display: flex;
    flex-wrap: wrap;
    gap: var(--rhythm-micro);
    align-items: baseline;
    line-height: 2.6;
}

/* 各語のchip：軽量・ボーダー使わない */
.wlv-chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm) var(--space-xs);
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: background var(--transition-fast);
    position: relative;
    border: 1px solid transparent;
}
.wlv-chip:hover {
    background: var(--accent-light);
}
.wlv-chip.active {
    background: var(--accent-light);
    border-color: var(--accent-mid);
}
/* 入口導線 v2 施策B: 押した瞬間の応答（「触れるもの」だと体に教える）。
   hover の無いタッチ環境では、これが唯一の即時フィードバックになる。 */
.wlv-chip:active {
    background: var(--accent-mid);
}
.verse-pair-left, .verse-pair-right, .gf-verse-block {
    transition: background var(--transition-fast);
}
.verse-pair-left:active, .verse-pair-right:active, .gf-verse-block:active {
    background: var(--highlight-light);
}

/* 入口導線 v2 施策A: ピーク層（本文の語タップで、その場に出る軽いカード）。
   画面遷移の前に「原形・この箇所での意味・語義・出現回数」だけを見せ、
   深くは「詳しく見る」から従来の第3層へ進む。 */
.word-peek {
    position: fixed;
    z-index: 1100;
    width: min(320px, calc(100vw - 24px));
    background: var(--bg, #fff);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    padding: var(--space-md);
    animation: bottomCardIn .22s ease-out;
}
@keyframes wordPeekIn {
    from { opacity: 0; transform: scale(.96) translateY(4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
.word-peek-close {
    position: absolute;
    top: 6px; right: 6px;
    width: 30px; height: 30px;
    border: 0; background: transparent;
    color: var(--text-sub); font-size: 16px; line-height: 1;
    cursor: pointer; opacity: .7;
}
.word-peek-close:hover { opacity: 1; }
/* 階層（2026-11-04 見直し）：主役は「この箇所での意味」。ギリシャ語の
   形＋原形は、読めない人には情報ではなく「どの語のカードか」を示す
   名札なので、小さく意味の下に置く。 */
.word-peek-meaning { font-size: 18px; font-weight: 700; color: var(--text-main); padding-right: 26px; line-height: 1.4; }
.word-peek-head { display: flex; align-items: baseline; gap: var(--space-sm); flex-wrap: wrap; margin-top: 2px; }
.word-peek-greek { font-family: "GFS Didot", "Palatino Linotype", Georgia, serif; font-size: 14px; font-weight: 600; color: var(--text-sub); }
.word-peek-lemma { font-size: var(--text-caption); color: var(--text-sub); }
.word-peek-glosses { margin-top: 2px; font-size: var(--text-caption); color: var(--text-sub); line-height: 1.5; }
.word-peek-count { margin-top: var(--space-xs); font-size: var(--text-caption); color: var(--text-sub); }
.word-peek-actions {
    margin-top: var(--space-sm);
    display: flex; gap: var(--space-sm);
}
.word-peek-more {
    display: flex; align-items: center; justify-content: center; gap: var(--space-xs);
    flex: 1;
    padding: var(--space-sm) var(--space-md);
    border: 0; border-radius: var(--radius-s);
    background: var(--highlight-light);
    color: var(--highlight);
    font-size: var(--text-body); font-weight: 600;
    cursor: pointer;
}
.word-peek-hl {
    display: flex; align-items: center; justify-content: center;
    flex: 1;
    padding: var(--space-sm) var(--space-md);
    border: 1px solid var(--border-soft); border-radius: var(--radius-s);
    background: transparent;
    color: var(--text-main);
    font-size: var(--text-body); font-weight: 600;
    cursor: pointer;
}
.word-peek-hl::before {
    content: '';
    width: 0.72em; height: 0.72em; border-radius: 50%;
    /* 既存ハイライトがある語ではその色を出す（--peek-hl-dot をピーク側で設定）。
       無い場合はデフォルト色（黄）の予告として従来どおり。 */
    background: var(--peek-hl-dot, #fccc00);
    border: 1px solid rgba(0, 0, 0, 0.18);
    margin-right: var(--space-xs);
    flex: none;
}
.word-peek-more:active { background: var(--accent-light); }
/* 入口導線 v2 施策C: 初回ガイド（軽量版）。最初の語チップがそっと鼓動し、
   一言だけ添える。説明文で教えるのではなく、押してもらうことで教える。 */
.wlv-chip.fg-guide-pulse {
    animation: fgGuidePulse 1.5s ease-in-out 5;
}
@keyframes fgGuidePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
    50% { box-shadow: 0 0 0 5px var(--accent-mid); background: var(--accent-light); }
}
.fg-guide-hint {
    position: fixed;
    z-index: 1050;
    background: var(--highlight);
    color: #fff;
    font-size: var(--text-caption);
    font-weight: 600;
    padding: var(--space-xs) var(--space-md);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(26, 30, 26, .25);
    white-space: nowrap;
    pointer-events: none;
    animation: wordPeekIn .2s ease-out;
}

@media (max-width: 900px) {
    /* モバイルは画面下部のカード（本文の読み位置を奪わない） */
    .word-peek {
        left: var(--space-md) !important;
        right: var(--space-md);
        top: auto !important;
        bottom: calc(env(safe-area-inset-bottom, 0px) + var(--space-md));
        width: auto;
    }
}

.wlv-chip-ja {
    font-size: var(--text-body-lg);
    font-family: var(--font-prose);
    color: var(--text-main);
    line-height: 1.3;
    letter-spacing: -0.01em;
}

.wlv-phrase-sep {
    display: inline-block;
    width: 1px;
    height: 16px;
    background: rgba(0,0,0,0.07);
    margin: 0 var(--space-xs);
    vertical-align: middle;
    flex-shrink: 0;
    align-self: center;
}

/* ── chip詳細ドロワー - "深く潜る" continuity design ── */
/* 別パネルではなく、chip streamの下に自然に続く深層として展開する */
.wlv-detail-drawer {
    margin: var(--space-sm) 0 0;
    padding: var(--space-md) var(--space-md) var(--space-md) var(--space-xl);
    display: none;
    border-left: 2px solid var(--accent-mid);
    background: transparent;
    position: relative;
}
/* 左線の上部に小さな点を打って「ここから潜る」感を出す */
.wlv-detail-drawer::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 16px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-mid);
}
.wlv-detail-drawer.visible {
    display: block;
    animation: depthUnfold var(--transition-slow) both;
}
.wlv-dd-close-btn {
    position: absolute;
    top: var(--space-xs);
    right: var(--space-xs);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: var(--text-body);
    opacity: var(--opacity-secondary);
    cursor: pointer;
    border-radius: var(--radius-s);
    -webkit-tap-highlight-color: transparent;
    transition: opacity var(--transition-fast);
}
.wlv-dd-close-btn:hover { opacity: var(--opacity-primary); }
@keyframes wlvDrawerIn {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: var(--opacity-primary); transform: translateY(0); }
}

/* 階層（ピーク層と統一）：主役は「この箇所での意味」。ギリシャ語の
   形＋原形は名札として小さく下に置く（ドロワーには原形が無かったので追加）。 */
.wlv-detail-meaning {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.4;
    margin-bottom: 2px;
    padding-right: 26px;
}
.wlv-detail-meaning:empty { display: none; }
.wlv-detail-nametag {
    display: flex;
    align-items: baseline;
    gap: var(--space-sm);
    flex-wrap: wrap;
    margin-bottom: var(--space-xs);
}
.wlv-detail-greek {
    font-family: var(--font-greek);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sub);
    line-height: 1.2;
}
.wlv-detail-lemma {
    font-size: var(--text-caption);
    color: var(--text-sub);
}
.wlv-detail-glosses {
    font-size: var(--text-caption);
    color: var(--text-sub);
    margin-bottom: var(--space-sm);
    display: none;
}
.wlv-detail-glosses:not(:empty) { display: block; }
/* ドロワー内：文法メモ（廃止：resonanceに統合） */
.wlv-detail-morph {
    display: none;
}
/* ドロワー内：signalタグ（廃止） */
.wlv-detail-signals {
    display: none;
}
.wlv-signal-tag {
    display: none;
}
/* ドロワー内：アクションリンク（縦並び統一行） */
.wlv-detail-actions {
    display: flex;
    flex-direction: column;
    margin-top: var(--space-sm);
}
/* アクション行：共通ベース */
.wlv-detail-study-btn {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    min-height: 44px;
    padding: var(--space-xs) 0;
    font-family: var(--font-prose);
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-decoration: none;
    background: transparent;
    border: none;
    border-top: 1px solid var(--divider);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--transition-fast), opacity var(--transition-fast);
}
.wlv-detail-study-btn:hover  { background: var(--hover-veil); }
.wlv-detail-study-btn:active { opacity: 0.65; }
.wlv-detail-study-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-s); }
/* アイコン枠 */
.wlv-action-icon {
    width: var(--space-lg);
    height: var(--space-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-s);
    font-size: var(--text-body-lg);
    flex-shrink: 0;
    user-select: none;
}
/* テキストラベル */
.wlv-action-label {
    flex: 1;
    text-align: left;
    line-height: 1.4;
}
/* 右シェブロン */
.wlv-action-chev {
    font-size: var(--text-body-lg);
    flex-shrink: 0;
    opacity: var(--opacity-tertiary);
    user-select: none;
}
/* 主操作：緑系 */
button.wlv-detail-study-btn { color: var(--accent); }
button.wlv-detail-study-btn .wlv-action-icon { background: var(--accent-light); color: var(--accent); }
/* 副操作：グレー系 */
a.wlv-detail-study-btn { color: var(--text-sub); }
a.wlv-detail-study-btn .wlv-action-icon { background: var(--hover-veil); color: var(--text-sub); }

.wlv-flow-hint {
    padding: var(--space-sm) var(--space-md) var(--space-md);
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    letter-spacing: 0.02em;
    flex-shrink: 0;
}

/* ── 旧タブ関連：完全廃止。CSS定義を残すが使われない ── */
/* wlv-tabs / wlv-tab / wlv-content は削除（JS側で生成しなくなる） */
.wlv-normal-hint {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    text-align: center;
    margin-top: var(--space-md);
    padding-top: var(--space-sm);
    border-top: 1px solid var(--border-soft);
}

/* ══════════════════════════════════════════
   節全体の読書メモ - passage note
   word-list-view の上に配置する（ヘッダー直下）。
   「読書の余白に書かれたメモ」として機能する。
   commentary・exegesis・sermon noteではない。
   軽い読書補助。静かな prose。
   ══════════════════════════════════════════ */
.wlv-reading-passage-note {
    padding: var(--rhythm-macro-min) var(--rhythm-macro-min) var(--rhythm-macro-min);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    margin-bottom: var(--space-xs);
    flex-shrink: 0;
}

.wlv-pn-label {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    display: block;
    margin-bottom: var(--rhythm-medium-y);
}

.wlv-pn-prose {
    padding-left: var(--rhythm-medium-x);
    border-left: 2px solid var(--accent-mid);
}

.wlv-pn-prose p {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 2.1;
    letter-spacing: 0.01em;
    margin: 0 0 var(--space-sm) 0;
}
.wlv-pn-prose p:last-child {
    margin-bottom: 0;
}

/* PC StudyPanel: 本文批評欄。モバイル専用の視覚指定を流用せず、PC側に独立して適用する。 */
/* 入口導線 Phase 1: 本文の異読は語リストの後ろに置き、既定は折りたたみ（summary が見出し）。 */
#word-list-view .study-panel-apparatus-note {
    margin-bottom: var(--space-xs);
}
#word-list-view .study-panel-apparatus-note > summary {
    cursor: pointer;
    list-style: none;
}
#word-list-view .study-panel-apparatus-note > summary::-webkit-details-marker {
    display: none;
}
#word-list-view .study-panel-apparatus-note .wlv-pn-label {
    margin-bottom: var(--rhythm-medium-y);
}
#word-list-view .study-panel-apparatus-note .mvv-apparatus-entries {
    padding-left: var(--rhythm-medium-x);
    border-left: 2px solid var(--accent-mid);
}
/* 本文批評欄の本文は読書メモ本文と同じ書体・サイズ・行間に統一する。 */
#word-list-view .study-panel-apparatus-note .mvv-apparatus-entries {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    line-height: 2.1;
    letter-spacing: 0.01em;
    color: var(--text-main);
}
#word-list-view .study-panel-apparatus-note .mvv-app-entry {
    padding: var(--space-xs) 0;
    border-bottom: 1px solid var(--border-soft);
}
#word-list-view .study-panel-apparatus-note .mvv-app-entry:last-child { border-bottom: 0; }
#word-list-view .study-panel-apparatus-note .mvv-app-lem {
    margin-bottom: var(--space-xs);
    color: var(--text-main);
    font: inherit;
}
#word-list-view .study-panel-apparatus-note .mvv-app-lem-gr,
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-gr,
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-wit {
    color: var(--text-sub);
    font-family: inherit;
    font-size: var(--text-caption);
    line-height: 1.6;
}
#word-list-view .study-panel-apparatus-note .mvv-app-rdg {
    display: flex;
    align-items: baseline;
    gap: var(--space-sm);
    margin-bottom: 2px;
}
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-num {
    flex-shrink: 0;
    width: 1.3em;
    color: var(--text-sub);
    font-size: var(--text-caption);
}
#word-list-view .study-panel-apparatus-note .mvv-app-rdg-text { flex: 1; font: inherit; }
#word-list-view .study-panel-apparatus-note .mvv-app-anno {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: var(--space-xs);
    margin-bottom: var(--space-xs);
}
#word-list-view .study-panel-apparatus-note .mvv-app-tag {
    padding: 1px 4px;
    border-radius: 2px;
    background: var(--bg-soft, rgba(0,0,0,0.04));
    color: var(--text-sub);
    font-family: inherit;
    font-size: var(--text-caption);
}
#word-list-view .study-panel-apparatus-note .mvv-app-anno--auto .mvv-app-tag { font-style: italic; }
#word-list-view .study-panel-apparatus-note .mvv-app-ja { color: var(--text-main); font: inherit; }

.wlv-flow-section-compact {
    padding: var(--rhythm-macro-min) var(--rhythm-macro-min) 0;
    flex-shrink: 0;
}

.wlv-flow-label-compact {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: var(--tracking-label);
    color: var(--text-sub);
    opacity: var(--opacity-tertiary);
    display: block;
    margin-bottom: var(--rhythm-medium-y);
}

/* 入口導線 Phase 1: 「原語の順序」の添え書き（次の操作をその場で伝える） */
.wlv-flow-caption {
    display: block;
    font-size: var(--text-caption);
    color: var(--text-sub);
    line-height: 1.5;
    margin: calc(-1 * var(--space-xs)) 0 var(--space-sm);
}

/* chip stream: 補助モードではグロスを少し小さく */
.wlv-flow-section-compact .wlv-chip-ja {
    font-size: var(--text-body);
}

/* ドロワー内：「この節での響き」prose - 同読書温度で */
.wlv-detail-resonance {
    font-family: var(--font-prose);
    font-size: var(--text-body);
    color: var(--text-main);
    line-height: 1.95;
    padding: 0 0 var(--space-sm) 0;
    margin-bottom: 0;
    letter-spacing: 0.01em;
    opacity: var(--opacity-primary);
}

/* ══════════════════════════════════════════
   翻訳モード
   ══════════════════════════════════════════ */
#main-reading-area.single-mode {
    grid-template-columns: 1fr 0;
}
#main-reading-area.single-mode #bible-text-area {
    /* grid item は width:auto だとコンテンツ量に応じてshrink-to-fitされてしまうため、
       width:100%で明示的にグリッド列いっぱいに広げる（その上でmax-width:44emが上限を決める）。
       本文は元々文章量が多くshrink-to-fitでも44emに達していたため見た目は変わらないが、
       ブックマーク等のコンテンツが少ない一覧ページでは本文より狭くなっていた。 */
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    padding-left: var(--space-lg);
    padding-right: var(--space-lg);
    box-sizing: border-box;
}
#main-reading-area.static-view { align-content: start; }
/* single-mode（通常の聖書章表示）でも同様に stretch を抑制する。
   flex:1 により #main-reading-area がビューポート全高を占有するが、
   align-content: normal（初期値=stretch）だと grid 行が余剰高さを吸収して
   #bible-text-area が節本文より大きく引き伸ばされ、本文直下に巨大な白領域が生じる。
   compare-mode は single-mode と排他（_applyTransMode で single-mode を remove）のため
   このルールは compare-mode には適用されない。 */
#main-reading-area.single-mode { align-content: start; }

#main-reading-area.single-mode #parallel-text-area,
#main-reading-area.single-mode .verse-pair-right {
    display: none;
}
#main-reading-area.compare-mode {
    grid-template-columns: 1fr 1fr;
}
#main-reading-area.compare-mode #bible-text-area {
    max-width: none;
}
#main-reading-area.compare-mode #parallel-text-area {
    display: block;
    min-width: 0;
    overflow-x: auto;
}
#main-reading-area.compare-mode.panel-open {
    grid-template-columns: 1fr 0;
}
/* Phase 3-7-C: compare chapter container — outer grid をスパンし内部に同一比率の2列グリッドを持つ */
.compare-chapter-block {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
}
.compare-chapter-header {
    grid-column: 1 / -1;
    padding: var(--space-xl) 0;
    text-align: center;
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    pointer-events: none;
    user-select: none;
}
.compare-chapter-block:first-child .compare-chapter-header {
    display: none;
}
/* border-left 境界線: #parallel-text-area の border-left は row-1 のみのため
   compare-chapter-block 内の verse-pair-right に付与する */
#main-reading-area.compare-mode .compare-chapter-block .verse-pair-right {
    border-left: 1px solid rgba(0,0,0,0.08);
}
#bible-text-area {
    grid-column: 1;
    grid-row: 1;
}
#parallel-text-area {
    grid-column: 2;
    grid-row: 1;
}
.verse-pair-right .jp-text {
    font-size: var(--text-body-lg);
    line-height: 30px;
    color: var(--text-main);
    font-family: var(--font-prose);
}
.gf-verse-block {
    padding: var(--space-md) var(--space-lg) var(--space-sm);
}
/* flowモード時は jp-text の代わりにchipを表示するため jp-text を隠す
   VR-5-H-4: Flow 表示の可視制御を位置クラス（.verse-pair-right）非依存へ一般化。
   不変条件: 左列の通常 wordOrder 描画（renderBodyColumn）には .gf-mode を付与しないため、
   この一般化後も左列 Flow の jp-text 非表示等の副作用は発生しない。
   ★ .gf-verse-block は gf-mode をトグルする列ブロックの「直接の子」として append される
     （_setFlowInjection の block.appendChild(gfEl)）。子結合子 '>' を用いることで、可視判定を
     直接の親（＝当該列ブロック）が gf-mode か否かに限定し、元の
     .verse-pair-right.gf-mode / :not(.gf-mode) が持っていた相互排他性を保つ。
     子孫結合子（' '）にすると body 等の非 gf-mode 祖先経由で :not 規則も同時マッチし、
     同一詳細度のソース順で display:none が勝って Flow が消える（回帰）。 */
.gf-mode .jp-text {
    display: none;
}
.gf-mode > .gf-verse-block {
    display: block;
}
:not(.gf-mode) > .gf-verse-block {
    display: none;
}
/* flowモードのchip streamはStudy Panel版より余白を抑える */
.gf-verse-block .wlv-flow-section-compact {
    padding: 0 0 var(--space-sm);
}

.sb-bible-label {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    cursor: pointer;
    transition: opacity var(--transition-fast);
    user-select: none;
}
.sb-bible-label:hover { opacity: var(--opacity-secondary); }
.sb-bible-label-arrow {
    font-size: var(--text-caption);
    opacity: var(--opacity-tertiary);
}

.sb-bible-back {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-sm) var(--space-md) var(--space-xs);
    background: none;
    border: none;
    font-family: inherit;
    font-size: var(--text-caption);
    font-weight: 600;
    color: var(--highlight);
    cursor: pointer;
    letter-spacing: 0.02em;
    opacity: var(--opacity-secondary);
    transition: opacity var(--transition-fast);
    text-align: left;
    width: 100%;
}
.sb-bible-back:hover { opacity: var(--opacity-primary); }
.sb-bible-back-chevron {
    font-size: var(--text-caption);
    font-weight: 400;
    opacity: var(--opacity-primary);
    line-height: 1;
}

/* ══════════════════════════════════════════
   Depth Panel 文法装飾 namespace
   適用先：#bottom-depth-panel（StudyPanel）＋ .wlv-chip（フローチップ）。
   ★ Phase: Reading/Inspect/StudyPanel 3層分離。
   装飾クラス（dp-*）の判定は buildDepthGrammarClasses() が唯一の SSOT で、
   _wordToFlowChip() が生成する dpGrammarClasses を通じて StudyPanel・
   読解フロー双方のチップに同一クラスが付与される（HTML・クラスは共通）。
   dp-* span は必ず .wlv-chip（フローチップ）配下に生成されるため、
   .wlv-chip をスコープにすることで読解フロー本体（_transA==='FLOW'）・
   右カラム Greek Flow View・StudyPanel 内 flow tab のすべてに同一の
   装飾ルールが適用され、同一の語が両モードで完全に一致する。
   #bottom-depth-panel は StudyPanel 側の従来スコープを不変のまま保持する。
   .wlv-chip を伴わない通常訳の本文（jp-text 直書き）には付かない。
   ══════════════════════════════════════════ */
#bottom-depth-panel .dp-word,
.wlv-chip .dp-word {
    display: inline;
}
#bottom-depth-panel .dp-mood-imperative,
.wlv-chip .dp-mood-imperative {
    background: var(--accent-light);
    border-radius: var(--radius-s);
    padding: 0 var(--space-xs);
}
#bottom-depth-panel .dp-mood-indicative,
.wlv-chip .dp-mood-indicative {
    background: rgba(0,0,0,0.05);
    border-radius: var(--radius-s);
    padding: 0 var(--space-xs);
}
#bottom-depth-panel .dp-tense-present,
.wlv-chip .dp-tense-present {
    text-decoration: underline;
    text-decoration-style: solid;
    text-underline-offset: 3px;
}
#bottom-depth-panel .dp-tense-aorist,
.wlv-chip .dp-tense-aorist {
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
}
#bottom-depth-panel .dp-tense-perfect,
.wlv-chip .dp-tense-perfect {
    text-decoration-line: underline;
    text-decoration-style: wavy;
    text-underline-offset: 3px;
}
#bottom-depth-panel .dp-voice-middle::after,
#bottom-depth-panel .dp-voice-passive::after,
.wlv-chip .dp-voice-middle::after,
.wlv-chip .dp-voice-passive::after {
    content: '*';
    font-size: var(--text-caption);
    color: var(--highlight);
    opacity: var(--opacity-secondary);
    margin-left: var(--space-xs);
    vertical-align: super;
}

.dp-legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs) var(--space-sm);
    padding: var(--space-sm) var(--space-md) var(--space-xs);
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    border-top: 1px solid rgba(0,0,0,0.05);
    margin-top: var(--space-sm);
    flex-shrink: 0;
}
.dp-legend-item {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    white-space: nowrap;
}
.dp-legend-label {
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    letter-spacing: 0.02em;
}
.dp-sample {
    font-family: var(--font-greek);
    font-size: var(--text-caption);
    color: var(--text-main);
    display: inline-block;
}

/* ═══════════════════════════════════════════════════════
   StudyPanel 4-level structure
   ═══════════════════════════════════════════════════════ */
.rn-level-section {
    margin-top: var(--space-sm);
    border-top: 1px solid var(--border);
}
.rn-level-heading {
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: 0;
    color: var(--text-sub);
    padding: 10px 0;
    font-family: var(--font-prose);
    opacity: 1;
}
.rn-level-section > summary {
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: 0;
    color: var(--text-sub);
    cursor: pointer;
    padding: 10px 0;
    list-style: none;
    font-family: var(--font-prose);
    opacity: 1;
    user-select: none;
    transition: color var(--transition-fast);
    display: flex;
    align-items: center;
}
.rn-level-section > summary:hover { color: var(--text-main); }
.rn-level-section[open] > summary { opacity: 1; }
.rn-level-section > summary::-webkit-details-marker { display: none; }
.rn-level-arrow {
    display: inline-flex;
    margin-right: var(--space-xs);
    transition: transform var(--transition-base);
    flex-shrink: 0;
}
.rn-level-arrow svg { width: 0.65em; height: 0.65em; display: block; }
.rn-level-section[open] > summary .rn-level-arrow {
    transform: rotate(90deg);
}
.rn-level-body {
    padding-top: var(--space-xs);
    padding-left: var(--space-xs);
    padding-bottom: var(--space-md);
}
.rn-level-body #rn-semantic-layers { margin-top: 0; }

/* ── Structure Flow（「この語の構造上の位置づけ」）─────────────────
   focus 語を中心に、既存データ（flow-tree の親/兄弟/最寄clause）だけで
   関係を配置する Relation Flow（SF-8）。
   - 水平 ──→ : structural order（＝この文脈では reading order）の進行。前→focus→後。
   - 垂直の細線 : 包含（part-of）。所属まとまり ⊃ … ⊂ 上位のまとまり。
   矢印は順序のみを意味し、意味関係を主張しない。type ラベルは出さない
   （neighborhood-view-design.md §6 準拠）。静かな構造マップ。 */
.sf-flow { font-family: var(--font-prose); }
.sf-rel { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; max-width: 100%; }
.sf-cap { font: var(--text-caption)/1.6 'Hiragino Sans', sans-serif; color: var(--text-sub); flex-shrink: 0; }
/* 所属まとまり = focus の兄弟を1段に並べた帯（淡い面で「ひとまとまり」を示す） */
.sf-rel-focusband {
    position: relative;
    padding: 6px 8px;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    max-width: 100%;
}
/* SF-14: 弧を描く縦スペースを確保（frame=下・referent=上）。 */
.sf-rel-focusband.sf-has-frame { padding-bottom: 8px; }
.sf-rel-focusband.sf-has-ref { padding-top: 28px; }
/* SF-18: 2段レイアウト。上段=核(主語/動詞/繋ぎ)・下段=項。段間に frame エルボ用の縦スペース。 */
.sf-rel-focusband.sf-two-row .sf-row-bottom { margin-top: 28px; }
/* frame(実線・縦エルボ・矢頭=項・accent) / referent(点線・矢頭なし・text-sub)。4チャネル分離。 */
.sf-arc-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.sf-arc-frame-path { stroke: var(--accent); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sf-arw { fill: var(--accent); }
.sf-arc-ref-path { stroke: var(--text-sub); fill: none; stroke-width: 1.25; stroke-dasharray: 3 3; }
/* 縮退用テキスト注記: 既定 hidden。弧が引けない時(enhancer が .sf-degraded 付与)に表示。 */
.sf-frame-note, .sf-ref-note {
    display: none;
    margin-top: 6px;
    font: var(--text-caption)/1.7 'Hiragino Sans', sans-serif;
    color: var(--text-sub);
}
.sf-rel-focusband.sf-degraded { padding-bottom: 6px; padding-top: 6px; }
.sf-rel-focusband.sf-degraded .sf-frame-note { display: block; }
.sf-rel .sf-ref-note.sf-show { display: block; }
.sf-rel-focusband .sf-cap { display: block; margin-bottom: 4px; }
.sf-rel-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 16px; }
.sf-rel-arrow { color: var(--text-sub); font-size: 0.85em; flex-shrink: 0; }
/* SF-12: 構成語を「列」にし、role を語の真上へ整列（並べ替えず位置合わせ）。 */
.sf-col { display: inline-flex; flex-direction: column; align-items: center; }
.sf-role-cap {
    min-height: 1.35em;
    line-height: 1.35;
    font: var(--text-caption) 'Hiragino Sans', sans-serif;
    color: var(--text-sub);
    text-align: center;
    white-space: nowrap;
    margin-bottom: 2px;
}
.sf-role-cap.is-focus { color: var(--accent); font-weight: 600; }
/* 包含の縦線（矢頭なし＝順序ではなく part-of） */
.sf-rel-link { width: 1px; height: 10px; margin-left: 18px; background: var(--border-strong); }
.sf-rel-band { display: flex; align-items: baseline; gap: 6px; max-width: 100%; }
.sf-chip {
    display: inline-block;
    padding: 2px 8px;
    font-size: var(--text-body);
    line-height: 1.7;
    color: var(--text-main);
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    white-space: normal;
    word-break: break-word;
}
/* 文脈チップ（前/後/上位）は控えめに。focus を際立たせる */
.sf-chip.sf-ctx { color: var(--text-sub); background: transparent; }
.sf-chip.is-focus {
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    border-color: var(--accent-mid);
    box-shadow: inset 0 -1px 0 0 var(--accent);
}
/* 所属まとまり自身の役割（例: 主語のまとまり）は帯見出しに付す（帰属を偽らない）。 */
.sf-caprole { color: var(--accent); }
/* referent（E）: 線を引かずテキスト注記。控えめ・自然文。 */
.sf-note {
    margin-top: 6px;
    font: var(--text-caption)/1.7 'Hiragino Sans', sans-serif;
    color: var(--text-sub);
}
.sf-note-h {
    color: var(--text-main);
    margin-right: 6px;
}
.sf-note-h::after { content: '：'; }
/* SF-19 縦型: 第1層＝主語＋主動詞（横並び）／その下に「動詞→各項」を縦に1つずつ。
   frame は accent の横枝、containment(項の内部)は控えめの indent で別チャネル。 */
/* SF-29: 第1層(主語+動詞)を枝幅から独立させ、長い枝でも折り返さない。
   nowrap で主語と動詞を常に同一行に固定し、動詞+枝を包む .sf-verb-wrap を残り幅へ
   （flex:1 1 0）押し込む。枝は verb-wrap 幅内で折返す（横 overflow なし）。 */
.sf-l1 { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 6px 18px; }
.sf-l1 > .sf-col { flex: 0 1 auto; min-width: 0; max-width: 60%; }
.sf-l1 > .sf-verb-wrap { flex: 1 1 0; }
.sf-verb-wrap { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
/* 動詞から下がる trunk（縦・accent）。動詞 chip の下あたりに置く。枝は verb-wrap 幅に追従して折返す。 */
.sf-branches { margin-top: 4px; margin-left: 9px; border-left: 1.5px solid var(--accent); align-self: stretch; min-width: 0; }
.sf-branch {
    position: relative;
    padding: 3px 0 3px 16px;
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px;
    min-width: 0;
}
.sf-branch::before {            /* trunk→項 の横枝 */
    content: ''; position: absolute; left: 0; top: 0.85em; width: 13px;
    border-top: 1.5px solid var(--border-strong);
}
.sf-branch.sf-frame::before { border-top-color: var(--accent); }   /* frame は accent */
.sf-branch-role { font: var(--text-caption) 'Hiragino Sans', sans-serif; color: var(--text-sub); flex-shrink: 0; }
.sf-branch.sf-frame > .sf-branch-role { color: var(--accent); }
/* nested containment（項の内部・別チャネル）: さらに indent・控えめ・非 accent。 */
.sf-nested { flex-basis: 100%; margin: 2px 0 0 12px; border-left: 1px solid var(--border); padding-left: 8px; }
/* SF-31: 長主語（子孫に clause を持つ主語）の構造保持型段組み。既存 clause 境界で最上位 clause
   単位に段分けし、各 token は排他的に1回だけ表示（surface 順・既存 japanese 値のみ）。従来 chip の
   枠内に軽い区切り線で積むだけ（新しい syntax tree UI は作らない）。 */
.sf-chip.sf-subj-struct { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; }
.sf-subj-seg { display: block; }
.sf-subj-seg + .sf-subj-seg { padding-top: 3px; border-top: 1px dashed var(--border); }
/* SF-32: relation 内部を per-token の視覚 chip に分解し「単語が境目なく連結」を解消。単語間に
   微小 gap を入れるだけ（罫線・背景・拡大フォントなし）。FLOW の「1 token=1 視覚単位」という
   視覚語彙のみ共有し、interaction（onclick/hover/文法色）と .wlv-chip-ja の拡大サイズは持ち込まず
   SF の compact スケール（.sf-chip 継承 0.9rem）を維持＝解析ツール化しない/Reading first。 */
.sf-token-chip { display: inline-block; }
.sf-token-chip + .sf-token-chip { margin-left: 7px; }
/* SF-34: nested の Role↔Content 境界を明確化。content を SF 全体と一貫の text-main にし、role
   （.sf-branch-role＝text-sub の静かなラベル）とコントラストを付ける。色のみ＝高さ/折返し不変
   （C7 geometry byte-identical）。pill/背景/罫線/chip/segment/gap は追加しない（Reading first）。 */
.sf-nested-item { font: var(--text-caption)/1.6 'Hiragino Sans', sans-serif; color: var(--text-main); }
@media (max-width: 768px) {
    .sf-rel-row { gap: 4px 10px; }
    .sf-chip { font-size: var(--text-caption); padding: 2px 6px; }
    .sf-rel-link { margin-left: 12px; }
    .sf-l1 { gap: 6px 12px; }
    .sf-branch { padding-left: 14px; }
}

/* 使用傾向・辞書全文のラベルを1層目の参照ラベルと同じタイポグラフィに統一。 */
.rn-usage-label.ui-label,
.rn-dict-label.ui-label {
    display: block;
    font-family: var(--font-prose);
    font-size: var(--text-label);
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1.5;
    color: var(--text-sub);
}
.rn-dict-label {
    margin-bottom: var(--space-xs);
}
/* 辞書本文のリンクは読み進める流れを妨げない控えめな下線にする。 */
.rn-dict-full-text .rn-inline-bible-ref,
.rn-dict-full-text .rn-inline-word-search {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--border-strong, rgba(44,79,52,.38));
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
    cursor: pointer;
}
.rn-dict-full-text .rn-inline-bible-ref:hover,
.rn-dict-full-text .rn-inline-word-search:hover {
    color: var(--accent);
    text-decoration-color: currentColor;
}
/* 辞書本文のギリシャ語は多調記号に強い書体で、字間を広げず表示する。 */
.rn-dict-full-text .rn-inline-word-search {
    font-family: var(--font-greek);
    font-size: 1.06em;
    letter-spacing: 0;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
}
/* 辞書全文の項目表。モバイル・デスクトップ共通。 */
.rn-dict-full-section .rn-dict-full-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font: inherit;
    color: inherit;
    line-height: inherit;
}
.rn-dict-full-section .rn-dict-full-table th,
.rn-dict-full-section .rn-dict-full-table td {
    padding: var(--space-xs) 0;
    border: 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    vertical-align: top;
    text-align: left;
    font: inherit;
    overflow-wrap: anywhere;
}
.rn-dict-full-section .rn-dict-full-table th {
    width: 6.5em;
    padding-right: var(--space-sm);
    font-weight: 500;
}
.rn-dict-full-section .rn-dict-full-table .rn-dict-full-unlabeled {
    width: 0;
    padding: 0;
}
.rn-dict-full-section .rn-dict-full-table tr:last-child th,
.rn-dict-full-section .rn-dict-full-table tr:last-child td {
    border-bottom: 0;
}
/* 丸数字の項目は1項目ずつ区切り、折り返しは番号の次にそろえる（ぶら下げ字下げ）。 */
.rn-dict-full-section .rn-dict-intro {
    display: block;
}
.rn-dict-full-section .rn-dict-item {
    display: block;
    margin-top: 0.5em;
    padding-left: 1.2em;
    text-indent: -1.2em;
}
.rn-dict-full-section .rn-dict-item-first {
    margin-top: 0;
}

/* Narrow screens: prioritize dictionary text over the item-label column. */
@media (max-width: 600px) {
    .rn-dict-full-section .rn-dict-full-table,
    .rn-dict-full-section .rn-dict-full-table tbody,
    .rn-dict-full-section .rn-dict-full-table tr {
        display: block;
        width: 100%;
    }
    .rn-dict-full-section .rn-dict-full-table th:not(.rn-dict-full-unlabeled),
    .rn-dict-full-section .rn-dict-full-table td {
        display: block;
        width: auto;
    }
    .rn-dict-full-section .rn-dict-full-table th:not(.rn-dict-full-unlabeled) {
        padding: var(--space-xs) 0 0;
        border-bottom: 0;
        color: var(--text-sub);
        font-size: var(--text-label);
        font-weight: 600;
        line-height: 1.5;
    }
    .rn-dict-full-section .rn-dict-full-table td {
        padding: 0 0 var(--space-sm);
    }
    .rn-dict-full-section .rn-dict-full-table .rn-dict-full-unlabeled {
        display: none;
    }
    .rn-dict-full-section .rn-dict-full-table tr:last-child td {
        padding-bottom: 0;
    }
    .rn-usage-trends .rn-usage-group-label {
        line-height: 1.5;
    }
    .rn-usage-trends .rn-usage-list {
        line-height: 1.8;
    }
}

}

    margin-bottom: var(--space-xs);
}

}
.rn-usage-group:last-child {
    margin-bottom: 0;
}
.rn-usage-group-label {
    font-size: var(--text-body);
    font-family: var(--font-prose);
    color: var(--text-sub);
    opacity: 1;
    line-height: 1.5;
    margin-bottom: 2px;
}
.rn-usage-list {
    margin: 0;
    padding: 0;
    list-style: none;
    font-family: var(--font-prose);

    color: var(--text-main);

    margin: var(--space-sm) 0 var(--space-xs);
    opacity: var(--opacity-primary);
}
.rn-etymology-parts {
    font-family: var(--font-ui);
    color: var(--text-main);
}
/* result-query と同じ interaction パターンを踏襲（dotted underline + hover color） */
.rn-etym-part {

    border-bottom: 2px dotted var(--border-soft);
    transition: border-color var(--transition-fast), color var(--transition-fast);
}
.rn-etym-part:hover {
    border-bottom-color: var(--highlight);
    color: var(--highlight);
}
.rn-etym-sep {
    opacity: var(--opacity-secondary);
    font-family: var(--font-ui);
}
/* 語源ポップアップモーダル（search-tool の #as-modal と同構造） */
#rn-etym-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.38);
    z-index: 900; display: none; align-items: center; justify-content: center;
    padding: 20px;
}
#rn-etym-backdrop.open { display: flex; }
#rn-etym-modal {
    background: var(--bg-panel); border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    max-width: 480px; width: 100%; max-height: 70vh;
    display: flex; flex-direction: column; overflow: hidden;
}
#rn-etym-modal-head {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
}
#rn-etym-modal-label { flex: 1; display: flex; flex-direction: column; gap: 3px; }
#rn-etym-modal-gr {
    font-family: var(--font-greek); font-size: var(--text-title);
    font-weight: 700; color: var(--text-main);
}
#rn-etym-modal-ja {
    font-size: var(--text-caption); color: var(--text-sub);
}
#rn-etym-modal-close {
    width: 28px; height: 28px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--bg-sub); cursor: pointer; font-size: 1rem;
    color: var(--text-sub); display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
}
#rn-etym-modal-close:hover { background: var(--border-soft); }
#rn-etym-modal-body {
    padding: 16px 20px; overflow-y: auto; flex: 1;
    font-size: 0.82rem; line-height: 1.75; color: var(--text-main);
    white-space: pre-wrap; font-family: var(--font-prose);
}
.rn-etym-as-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-sub);
    opacity: var(--opacity-secondary); margin-bottom: 6px;
    font-family: var(--font-ui);
}
.rn-etym-empty { color: var(--text-sub); font-style: italic; }

/* 辞書本文の聖書参照ポップアップ（語源ポップアップと同構造・同作法） */
#rn-ref-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.38);
    z-index: 900; display: none; align-items: center; justify-content: center;
    padding: 20px;
}
#rn-ref-backdrop.open { display: flex; }
#rn-ref-modal {
    background: var(--bg-panel); border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    max-width: 480px; width: 100%; max-height: 70vh;
    display: flex; flex-direction: column; overflow: hidden;
}
#rn-ref-modal-head {
    display: flex; align-items: flex-start; gap: 10px;

}
#rn-ref-modal-label { flex: 1; display: flex; flex-direction: column; gap: 3px; }
#rn-ref-modal-title {

}

}
#rn-ref-modal-close {
    width: 28px; height: 28px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--bg-sub); cursor: pointer; font-size: 1rem;

    transition: background 0.12s;
}
#rn-ref-modal-close:hover { background: var(--border-soft); }
#rn-ref-modal-body {

}
.rn-ref-verse {
    font-family: var(--font-greek); font-size: var(--text-body);

}
.rn-ref-hl {
    font-weight: 700; color: var(--highlight);

    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;

}
.rn-ref-word-rows { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--space-md); }
.rn-ref-word-row { display: flex; gap: 10px; }
.rn-ref-word-row dt {
    flex-shrink: 0; width: 5em; color: var(--text-sub);

}
.rn-ref-gr { font-family: var(--font-greek); }
.rn-ref-word-row dd { margin: 0; }

}

.mvv-l3-strong {
    font-size: var(--text-caption);
    color: var(--text-hint);
}

/* Level 2: Full dictionary */
.rn-dict-full-section {
    margin-top: var(--space-sm);

    border-top: 1px solid var(--border-soft);
}
.rn-dict-full-text {
    font-family: var(--font-prose);
    font-size: var(--text-reading);
    font-weight: 400;
    color: var(--text-main);
    line-height: 1.8;
    letter-spacing: 0.01em;
    margin-top: 0;
}

/* Level 4: Research item header */
.rn-research-item-label {
    font-size: var(--text-caption);
    font-family: var(--font-prose);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-bottom: var(--space-xs);
}

/* Level 4: External search links */
.rn-research-links {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
    margin-top: var(--space-sm);

}

    font-size: var(--text-caption);
    color: var(--accent);

}

    font-size: var(--text-caption);
    font-weight: 400;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-top: var(--space-xs);
    font-family: var(--font-ui);
