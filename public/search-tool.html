<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検索ツール</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- OGP / Twitter Card -->
<meta property="og:type"         content="website">
<meta property="og:url"          content="https://bible-text.pages.dev/search">
<meta property="og:title"        content="聖句・概念検索 | 聖書原語リーダー（β）">
<meta property="og:description"  content="聖句・神学概念をキーワードで横断検索。ギリシャ語原典から日本語訳まで一気通貫で探せる聖書研究ツール。牧師・神学生向けβ版。">
<meta property="og:image"        content="https://bible-text.pages.dev/assets/ogp.png">
<meta property="og:site_name"    content="聖書原語リーダー | bible-text">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="聖句・概念検索 | 聖書原語リーダー（β）">
<meta name="twitter:description" content="聖句・神学概念をキーワードで横断検索。ギリシャ語原典から日本語訳まで一気通貫で探せる聖書研究ツール。牧師・神学生向けβ版。">
<meta name="twitter:image"       content="https://bible-text.pages.dev/assets/ogp.png">
<script>
/* 検索ツール固有の静的メタ・プレースホルダの言語対応（英語化 第1段階-1）。
   i18n.js の applyMeta は本体（アプリ全体）の meta.title / meta.description で
   title・og・twitter を上書きするため、ready 後と DOMContentLoaded 後（i18n.js の
   リスナーより後）に、検索ツール用キー search.meta.* で戻す。
   JA は T() が fallback（現行の静的値）をそのまま返すため現行と完全同一。 */
(function(){
    var orig={
        title:document.title,
        ogTitle:(document.querySelector('meta[property="og:title"]')||{getAttribute:function(){return null;}}).getAttribute('content'),
        twTitle:(document.querySelector('meta[name="twitter:title"]')||{getAttribute:function(){return null;}}).getAttribute('content'),
        ogDesc:(document.querySelector('meta[property="og:description"]')||{getAttribute:function(){return null;}}).getAttribute('content'),
        twDesc:(document.querySelector('meta[name="twitter:description"]')||{getAttribute:function(){return null;}}).getAttribute('content')
    };
    function setMeta(sel,v){var el=document.querySelector(sel);if(el&&v!=null)el.setAttribute('content',v);}
    function applySearchMeta(){
        if(!window.T)return;
        var title=T('search.meta.title',orig.title);
        document.title=title;
        setMeta('meta[property="og:title"]',T('search.meta.title',orig.ogTitle));
        setMeta('meta[name="twitter:title"]',T('search.meta.title',orig.twTitle));
        var desc=T('search.meta.description',null); // 辞書にある言語だけ。JA（と未対応言語）は現行の静的メタのまま。
        if(T('search.meta.title',null)==null){
            /* 検索ツールがまだ対応していない言語（ES）: 表示は日本語のままなので lang も ja とし、
               本体文言で上書きされた og/twitter の説明を現行の静的値へ戻す。 */
            document.documentElement.lang='ja';
            setMeta('meta[property="og:description"]',orig.ogDesc);
            setMeta('meta[name="twitter:description"]',orig.twDesc);
        }
        if(desc){
            var md=document.querySelector('meta[name="description"]');
            if(!md){md=document.createElement('meta');md.setAttribute('name','description');document.head.appendChild(md);}
            md.setAttribute('content',desc);
            setMeta('meta[property="og:description"]',desc);
            setMeta('meta[name="twitter:description"]',desc);
        }
        var inp=document.getElementById('unified-search-input');
        if(inp){
            if(inp.dataset.jaPlaceholder==null)inp.dataset.jaPlaceholder=inp.getAttribute('placeholder')||'';
            inp.setAttribute('placeholder',T('search.input.placeholder',inp.dataset.jaPlaceholder));
        }
    }
    /* i18n.js（body 末尾側で読み込み）の DOMContentLoaded／ready 後の applyAll が title・og を本体文言で上書きするため、
       それらより後（次のタスク／ready 後）に検索ツール用の値へ戻す。 */
    document.addEventListener('DOMContentLoaded',function(){
        setTimeout(applySearchMeta,0);
        if(window.I18N&&I18N.ready)I18N.ready.then(applySearchMeta);
    });
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<style>
/* tokens.css provides --bg-paper, --bg-panel, --bg-sidebar, --text-main, --highlight, --border-soft aliases */
:root {
    /* Layer colors (search-specific) */
    /* 語句マーカーもアプリのテーマ色に連動。検索結果内では淡い背景で区別する。 */
    --lemma:        var(--s-accent);
    --lemma-bg:     var(--s-accent-soft);
    --lemma-border: var(--s-accent-mid);
    --phrase:       var(--s-accent);
    --phrase-bg:    var(--s-accent-soft);
    --phrase-border:var(--s-accent-mid);
    /* 選択状態は index.html と共通の緑アクセントに統一 */
    --prox:         var(--highlight);
    --prox-bg:      var(--highlight-light);
    --prox-border:  var(--accent-mid);
    --morph:        var(--highlight);
    --morph-bg:     var(--highlight-light);
    --morph-border: var(--accent-mid);

    /* ── Search redesign variables (--s-* namespace, independent of tokens.css) ── */
    --s-bg:           #f5f3ee;
    --s-surface:      #ffffff;
    --s-surface-2:    #f0ede6;
    --s-text:         #1c1a16;
    --s-text-sub:     #5a5347;
    --s-text-hint:    #8a8275;
    /* 検索画面の主要アクセントは読書画面と共通化し、アプリのテーマ変更に追従させる。 */
    --s-accent:       var(--accent);
    --s-accent-soft:  var(--accent-light);
    --s-accent-mid:   var(--accent-mid);
    /* ギリシャ語本文は色付きの装飾ではなく、通常の本文色で表示する。 */
    --s-greek:        var(--text);
    --s-border:       #ddd9cf;
    --s-divider:      #e8e4db;
    --s-divider-strong: #ccc8be;
    --s-shadow-modal: 0 4px 24px rgba(28, 26, 22, 0.16), 0 1px 4px rgba(28, 26, 22, 0.08);
    --s-ff-ui:        'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    --s-ff-greek:     'Gentium Plus', Georgia, 'Times New Roman', serif;
    --s-ff-prose:     'Noto Serif JP', Georgia, serif;
    --s-ts-xs:     0.72rem;
    --s-ts-sm:     0.82rem;
    --s-ts-base:   0.92rem;
    --s-ts-md:     1.0rem;
    --s-ts-greek:  1.08rem;
    --s-ts-lg:     1.2rem;
    --s-ts-xl:     1.6rem;
    --s-lh-tight:  1.35;
    --s-lh-base:   1.6;
    --s-lh-prose:  1.85;
    --s-ls-caps:   0.10em;
    --s-ls-ref:    0.04em;
    --s-sp-1:  var(--space-xs);
    --s-sp-2:  var(--space-sm);
    --s-sp-3:  var(--space-3);
    --s-sp-4:  var(--space-md);
    --s-sp-5:  var(--space-lg);
    --s-sp-6:  var(--space-xl);
    --s-sp-7:  var(--space-7);
    --s-sp-8:  var(--space-8);
    --s-content-max:  720px;
    --s-header-h:      56px;
    --s-header-h-mob:  48px;
    --s-radius-input:  6px;
    --s-radius-chip:   var(--radius-s);
    --s-radius-btn:    6px;
    --s-radius-modal:  10px;
    --s-radius-panel:  var(--radius-m);
    --s-ease:          cubic-bezier(0.2, 0.8, 0.2, 1);
    --s-dur-fast:      0.14s;
    --s-dur-base:      0.22s;
    --s-dur-panel:     0.28s;
    --s-dur-result:    0.18s;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
/* iOS: prevent accidental double-tap zoom while preserving pan and pinch zoom. */
html, body { touch-action: manipulation; }

body {
    font-family: var(--s-ff-ui);
    background: var(--s-bg);
    color: var(--s-text);
    -webkit-font-smoothing: antialiased;
}

/* ============================================================
   New single-column layout
   ============================================================ */

/* ── Sticky header ── */
.s-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: var(--s-header-h);
    background: var(--s-bg);
    border-bottom: 1px solid var(--s-divider);
    display: flex;
    align-items: center;
    gap: var(--s-sp-2);
    padding: 0 var(--s-sp-5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.s-btn-back {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: var(--s-ts-sm);
    color: var(--s-text-sub); padding: 4px 0;
    white-space: nowrap; flex-shrink: 0;
    transition: color var(--s-dur-fast) var(--s-ease);
    -webkit-tap-highlight-color: transparent;
}
.s-btn-back:hover { color: var(--s-text); }
.s-header-spacer { flex: 1; }
.s-mini-search {
    display: none;
    flex: 1;
    font-size: var(--s-ts-sm);
    color: var(--s-text-sub);
    background: var(--s-surface);
    border: 1px solid var(--s-border);
    border-radius: var(--s-radius-input);
    padding: 4px 10px;
    cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 240px;
}
.s-header.scrolled .s-mini-search { display: block; }
.s-header .share-url-btn {
    flex-shrink: 0;
}

/* ── Search block ── */
.s-search-block {
    max-width: var(--s-content-max);
    margin: 0 auto;
    padding: var(--s-sp-7) var(--s-sp-5) var(--s-sp-4);
    width: 100%;
}
.s-search-title {
    font-size: var(--s-ts-xl);
    font-weight: 700;
    color: var(--s-text-sub);
    text-align: center;
    margin-bottom: var(--s-sp-3);
    cursor: pointer;
    user-select: none;
    transition: opacity var(--s-dur-fast) var(--s-ease);
}
.s-search-title:hover { opacity: 0.7; }

/* ── Mode bar (lemma toggle + advanced toggle + SQS pills) ── */
.s-mode-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--s-sp-2) var(--s-sp-3);
    margin-top: var(--s-sp-2);
    font-size: var(--s-ts-sm);
}
.s-lemma-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
    padding: 0; background: none; border: none;
    font-family: inherit; font-size: var(--s-ts-sm);
    color: var(--s-text-sub);
    -webkit-tap-highlight-color: transparent;
}
.s-lemma-toggle .layer-check {
    width: 16px; height: 16px;
}
.s-lemma-toggle:hover { color: var(--s-text); }
.s-lemma-toggle.active { color: var(--s-text); }
.s-advanced-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: var(--s-ts-sm);
    color: var(--s-text-hint); padding: 0;
    transition: color var(--s-dur-fast) var(--s-ease);
    -webkit-tap-highlight-color: transparent;
}
.s-advanced-toggle:hover { color: var(--s-text-sub); }
/* 開閉状態は矢印で示し、リンクのような下線は付けない */
.s-advanced-toggle.open {
    color: var(--s-text-sub);
    border-bottom: none;
}
.s-advanced-toggle .s-adv-arrow { transition: transform var(--s-dur-fast) var(--s-ease); }
.s-advanced-toggle.open .s-adv-arrow { transform: rotate(180deg); }

/* ── Advanced panel (grid-template-rows animation) ── */
.s-advanced-panel {
    max-width: var(--s-content-max);
    margin: 0 auto;
    padding: 0 var(--s-sp-5);
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--s-dur-panel) var(--s-ease);
}
.s-advanced-panel.open {
    grid-template-rows: 1fr;
}
.s-advanced-panel-inner {
    overflow: hidden;
}
.s-advanced-panel-body {
    background: #f2f0ea;
    border: 1px solid rgba(90,83,71,0.08);
    border-radius: var(--s-radius-panel);
    padding: var(--s-sp-4);
    margin-top: var(--s-sp-2);
    margin-bottom: var(--s-sp-2);
}

/* ── Search/results divider ── */
.s-search-divider {
    max-width: var(--s-content-max);
    margin: 0 auto;
    border: none;
    border-top: 1px solid var(--s-divider-strong);
    padding: 0 var(--s-sp-5);
}

/* ── Results area ── */
.s-results {
    max-width: var(--s-content-max);
    margin: 0 auto;
    padding: var(--s-sp-5) var(--s-sp-5) calc(var(--s-sp-8) + env(safe-area-inset-bottom, 0px));
    width: 100%;
}

/* ── idx-status in new layout ── */
.s-search-block .idx-status {
    text-align: center;
    justify-content: center;
}


/* Index readiness is internal state, not reader-facing UI.
   Keep the DOM nodes so _watchIndexProgress can finish its existing
   idempotent index setup, but never show status text on desktop or mobile. */
.idx-status {
    display: none;
    align-items: flex-start;
    gap: 4px;
    padding-top: 6px;
    max-height: 2.5rem;  /* height → max-height: done 時にスムーズに折りたたむ */
    overflow: hidden;
    font-size: var(--s-ts-xs);
    color: var(--text-sub);
    opacity: 0.52;
    line-height: 1.5;
    letter-spacing: 0.01em;
    transition: opacity 1.2s ease, max-height 0.8s ease 0.4s;
}
.idx-status.done { opacity: 0; max-height: 0; pointer-events: none; }

/* container: 旧サイドバー構造（廃止 — 新レイアウトは .s-header/.s-search-block/.s-results）。
   .search-panel は要素自体が現存しないため、RF-2 でルールごと削除した。 */
.container { display: contents; }
.main-layout { display: contents; }

/* FAB / overlay: 廃止（#mn-back-bar は要素自体が現存しないため、RF-2 でルールごと削除） */
.mobile-search-toggle { display: none; }
.mobile-overlay { display: none; }

/* ── Mobile (≤700px) ── */
@media (max-width: 700px) {
    .s-header { height: var(--s-header-h-mob); padding: 0 var(--s-sp-4); }
    .s-search-block { padding: var(--s-sp-4) var(--s-sp-4) var(--s-sp-3); }
    .s-search-title { font-size: var(--s-ts-lg); text-align: left; }
    .s-advanced-panel { padding: 0 var(--s-sp-4); }
    .s-results { padding: var(--s-sp-4) var(--s-sp-4) calc(var(--s-sp-7) + env(safe-area-inset-bottom, 0px)); }
    .s-search-divider { margin: 0 var(--s-sp-4); }
}

/* ── Section label ── */
.s-label {
    font-size: var(--text-caption); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-label); text-transform: uppercase;
    color: var(--text-sub);
    padding-left: var(--space-sm);
    margin-bottom: var(--space-sm);
}

/* ============================================================
   Search input block
   ============================================================ */
.search-input-wrap {
    position: relative;
    width: 100%;
    min-width: 0;
    margin-bottom: 14px;
}
.unified-input {
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 14px 44px 14px 16px;
    font-family: var(--s-ff-greek);
    font-size: 1.15rem;
    line-height: 1.4;
    border: 1px solid rgba(0,0,0,0.14);
    border-radius: 10px;
    background: var(--bg-paper);
    color: var(--text-main);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
    -webkit-appearance: none;
}
.unified-input::placeholder {
    color: var(--text-sub);
    font-size: 0.88rem;
    font-family: var(--s-ff-greek);
}
.unified-input:focus {
    border-color: var(--highlight);
    box-shadow: 0 0 0 3px var(--highlight-light);
}
.search-icon-btn {
    position: absolute;
    right: 12px;
    /* Anchor to the fixed-height input, not the wrapper that grows
       when suggestion/filter panels appear below the input. */
    top: 30px;
    transform: translateY(-50%);
    z-index: 2;
    background: none; border: none; cursor: pointer;
    color: var(--text-sub); padding: 4px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    transition: color var(--transition-fast);
}
.search-icon-btn:hover { color: var(--text-main); }
.search-icon-btn svg { width: 16px; height: 16px; display: block; }
/* Suggest dropdown */
.suggest-dropdown {
    position: static;
    margin-top: 4px;
    background: var(--bg-paper);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    z-index: 50; display: none; overflow: hidden;
}
.suggest-dropdown.open { display: block; }
.suggest-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: pointer; font-size: 0.8rem;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    transition: background 0.1s;
    gap: 8px;
}
.suggest-item:last-child { border-bottom: none; }
/* タッチ端末では検索候補・検索履歴を押しやすい高さにする。 */
@media (pointer: coarse) {
    .suggest-item { min-height: 44px; padding: 12px 14px; }
}
.suggest-item:hover { background: var(--bg-panel); }
.suggest-jp { font-size: 0.78rem; color: var(--text-sub); margin-right: 4px; }
.suggest-gr { font-family: var(--s-ff-greek); font-size: 1rem; color: var(--text-main); }
.suggest-pos { font-size: 0.65rem; color: var(--text-sub); margin-left: 5px; opacity: 0.7; }
.suggest-count { font-size: 0.65rem; color: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
/* 履歴アイテム（空欄フォーカス時） */
.suggest-item.suggest-history { gap: 0; justify-content: space-between; }
.s-h-query {
    font-family: var(--s-ff-greek); font-size: var(--s-ts-base);
    color: var(--text-main); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.s-h-layers {
    font-size: 0.6rem; color: var(--text-sub);
    opacity: 0.65; white-space: nowrap; flex-shrink: 0; margin-left: 8px;
}


/* ============================================================
   Interpretation layers
   ============================================================ */
.layers-block {
    margin-bottom: 22px;
}
.layers-grid {
    display: flex; flex-direction: column; gap: 6px;
}
.layer-row {
    display: flex; align-items: center;
    padding: 9px 12px;
    background: var(--bg-paper);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
}
.layer-row:hover { background: var(--bg-panel); }
.layer-row.active-lemma,
.layer-row.active-phrase,
.layer-row.active-prox,
.layer-row.active-morph { border-color: var(--s-accent-mid); }

.layer-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--text-sub);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
    font-size: 0.6rem; color: transparent;
}
.layer-check svg { width: 10px; height: 10px; display: block; }
.layer-row.active-lemma  .layer-check,
.layer-row.active-phrase .layer-check,
.layer-row.active-prox   .layer-check,
.layer-row.active-morph  .layer-check {
    background: var(--s-accent);
    border-color: var(--s-accent);
    color: #fff;
}

.layer-info { flex: 1; min-width: 0; }
.layer-name {
    font-size: 0.78rem; font-weight: 700;
    color: var(--text-main); letter-spacing: 0.04em;
}

.layer-desc {
    font-size: 0.65rem; color: var(--text-sub);
    margin-top: 1px; line-height: 1.4;
}
.layer-row:focus-visible {
    outline: 2px solid var(--focus-ring, var(--text));
    outline-offset: 1px;
}

/* ── Search simplification: phrase search is automatic for multiword queries ── */
#layer-phrase, #phrase-sub { display: none; }

/* ── Proximity distance sub-control ── */
.search-filters {
    display: none;
    width: 100%;
    margin: 12px 0 0;
    padding: 0;
}
.search-filters.has-query { display: block; }
.search-filters .filter-suggestion-title {
    margin: 0 0 4px; color: var(--text-sub); font-size: 0.68rem;
    font-weight: 700; letter-spacing: 0.02em;
}
.search-filters.single-word .filter-suggestion-title { display: none; }
.search-filters .morph-panel-toggle {
    display: none; width: 100%; align-items: center; gap: 9px;
    margin: 10px 0 0; padding: 11px 1px;
    border: 0; border-top: 1px solid rgba(90,83,71,0.12);
    border-bottom: 1px solid rgba(90,83,71,0.12);
    background: transparent; color: var(--text-main); text-align: left;
    font: inherit; font-size: var(--s-ts-sm); font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.search-filters.single-word .morph-panel-toggle { display: flex; }
.morph-panel-toggle .morph-panel-count { margin-left: auto; color: #6e8c75; font-size: 0.7rem; font-weight: 500; }
.morph-panel-toggle .morph-panel-chevron { color: var(--text-sub); font-size: 0.75rem; transition: transform 0.18s ease; }
.morph-panel-toggle[aria-expanded="true"] .morph-panel-chevron { transform: rotate(180deg); }
.search-filters .morph-sub { display: none; margin-top: 3px; padding: 2px 1px 0; background: transparent; border: 0; border-radius: 0; }
.search-filters .morph-sub.is-open { display: block; }
.search-filters.multi-word .morph-sub { display: none; }
.search-filters .morph-section-label { color: var(--text-main); opacity: 0.88; letter-spacing: 0; text-transform: none; font-size: 0.77rem; }
.morph-section { margin: 0; border-bottom: 1px solid rgba(90,83,71,0.085); }
.morph-section:last-of-type { border-bottom: 0; }
.morph-section-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 7px 1px;
    border: 0; background: transparent; text-align: left; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.morph-section-toggle .morph-section-label { margin: 0; display: inline; font-weight: 550; }
.morph-section-toggle .morph-selected-summary { margin-left: auto; color: #6e8c75; font-size: 0.71rem; font-weight: 500; text-align: right; }
.morph-section-toggle .morph-chevron { flex: 0 0 auto; color: var(--text-sub); font-size: var(--s-ts-xs); transition: transform 0.18s ease; }
.morph-section.is-open .morph-chevron { transform: rotate(180deg); }
.morph-section .morph-chips { padding: 3px 0 13px; gap: 6px; }
.morph-section:not(.is-open) .morph-chips { display: none; }
/* Keep accordion sections collapsed even when later chip-layout rules set display:flex/grid.
   RF-2: !important を外し、@media (max-width: 700px) のチップグループ grid ルール
   （.search-filters .morph-section .morph-chips.morph-chip-group、詳細度 0,4,0）より
   詳細度が高くなるよう、チップグループについてはスコープ付きセレクタで上書きする。 */
.search-filters .morph-section:not(.is-open) .morph-chips.morph-chip-group { display: none; }
.morph-section.is-open .morph-chips { display: flex; }
.search-filters .morph-chip {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    border-radius: var(--radius-pill);
    border: 1px solid var(--morph-border);
    background: var(--bg-paper);
    font-family: var(--s-ff-ui);
    font-size: 0.69rem;
    text-align: left;
    padding: 9px 11px;
    cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
.search-filters .morph-chip-label { flex: 0 0 auto; white-space: nowrap; }
.search-filters .morph-chip-help {
    min-width: 0;
    color: var(--text-sub);
    font-size: 0.62rem;
    font-weight: 400;
    line-height: 1.4;
    text-align: right;
}
.search-filters .morph-chip.selected {
    background: rgba(112,145,119,0.12);
    border-color: rgba(94,130,102,0.58);
    color: #45694d;
}
.search-filters .morph-chip.selected .morph-chip-help { color: #66816b; }
.search-filters .morph-hint {
    color: var(--text-sub);
    opacity: 0.72;
}
@media (max-width: 700px) {
    .search-filters { padding: 0; }
    .search-filters .morph-section .morph-chips.morph-chip-group {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 7px;
        width: 100%;
        box-sizing: border-box;
        padding: 3px 0 13px;
    }
    .search-filters .morph-chip-group .morph-chip {
        width: 100%;
        min-height: 46px;
        box-sizing: border-box;
        padding: 8px 9px;
    }
    .search-filters .morph-chip-group .morph-chip-label { font-size: 0.68rem; }
    .search-filters .morph-chip-group .morph-chip-help { font-size: 0.58rem; }
    /* モバイルでは文法フィルターを右下のフローティングボタンから開く。
       RF-2: !important を外すため、単独表示ルール（.single-word の display:flex）と
       同じ詳細度にして定義順で勝たせる（対象は .single-word 時のみ。それ以外は
       ベースルール側が display:none）。 */
    .search-filters.single-word .morph-panel-toggle { display: none; }
    #morph-filter-fab {
        display: none;
        position: fixed;
        right: 20px;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        z-index: 160;
        width: 54px;
        height: 54px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.72);
        border-radius: 50%;
        background: #54775b;
        color: #fff;
        box-shadow: 0 3px 12px rgba(28,26,22,0.20);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    #morph-filter-fab svg { width: 22px; height: 22px; }
    #morph-filter-fab .morph-fab-count {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 19px;
        height: 19px;
        padding: 0 4px;
        display: none;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--s-bg);
        border-radius: 12px;
        background: #fff;
        color: #45694d;
        font: 700 10px/1 var(--s-ff-ui);
    }
    #morph-filter-fab.has-selection .morph-fab-count { display: flex; }
    #morph-filter-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 170;
        background: rgba(28,26,22,0.28);
        -webkit-tap-highlight-color: transparent;
    }
    body.morph-filter-open #morph-filter-backdrop { display: block; }
    .search-filters #morph-sub {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 180;
        max-height: min(78dvh, 680px);
        overflow-y: auto;
        overscroll-behavior: contain;
        margin: 0;
        padding: 8px 20px calc(18px + env(safe-area-inset-bottom, 0px));
        border: 0;
        border-radius: 18px 18px 0 0;
        background: var(--s-bg);
        box-shadow: var(--s-shadow-modal);
    }
    body.morph-filter-open .search-filters #morph-sub { display: block; }
    .morph-sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: sticky;
        top: -8px;
        z-index: 1;
        padding: 8px 0 12px;
        margin-bottom: 4px;
        background: var(--s-bg);
        border-bottom: 1px solid var(--s-divider);
    }
    .morph-sheet-title { font-size: 0.98rem; font-weight: 700; color: var(--s-text-sub); }
    .morph-sheet-close {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; flex: 0 0 auto;
        border: 1px solid var(--s-border); border-radius: 50%;
        background: transparent; color: var(--s-text-sub); font-size: 1.2rem;
        cursor: pointer;
    }
    body.morph-filter-open { overflow: hidden; }
}

.prox-sub {
    margin-top: 6px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(90,83,71,0.12);
    border-radius: 8px;
    display: none;
}
 .prox-sub.visible { display: block; }
.prox-sub-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
}
.prox-sub-label {
    font-size: 0.62rem; font-weight: 700; color: var(--prox);
    letter-spacing: 0.1em; text-transform: uppercase;
}
.prox-sub-val {
    font-family: monospace;
    font-size: 0.78rem; font-weight: 700; color: var(--prox);
    margin-left: auto;
}
.prox-slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px;
    background: linear-gradient(to right, var(--prox) var(--pct, 28%), rgba(0,0,0,0.12) var(--pct, 28%));
    border-radius: 2px; outline: none; cursor: pointer;
    margin-bottom: 8px;
}
.prox-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--prox);
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    cursor: pointer;
}
.prox-presets { display: flex; gap: 4px; }
.prox-preset {
    flex: 1; padding: 4px 0; font-size: 0.68rem; font-weight: 700;
    border: 1px solid var(--prox-border); border-radius: 6px;
    background: transparent; color: var(--prox); cursor: pointer;
    transition: all 0.12s; text-align: center; font-family: inherit;
}
.prox-preset:hover { background: var(--prox); color: #fff; }
.prox-preset.active { background: var(--prox); border-color: var(--prox); color: #fff; }

/* ── Morph filter checkboxes ── */
.morph-sub {
    margin-top: 6px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(90,83,71,0.12);
    border-radius: 8px;
    display: block;
}
.morph-section {
    margin-bottom: 8px;
}
.morph-section-label {
    font-size: 0.58rem; font-weight: 700;
    color: var(--morph); letter-spacing: 0.10em;
    text-transform: uppercase; opacity: 0.8;
    margin-bottom: 4px; display: block;
}
.morph-chips {
    display: flex; flex-wrap: wrap; gap: 3px;
}
.morph-chip {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 7px;
    border: 1px solid var(--morph-border);
    border-radius: var(--radius-pill);
    background: var(--bg-paper);
    font-size: 0.62rem; font-weight: 700;
    color: var(--morph); cursor: pointer;
    transition: all 0.12s; user-select: none;
    font-family: monospace; letter-spacing: 0.02em;
}
.morph-chip:hover { background: var(--morph-bg); }
.morph-chip.selected {
    background: var(--morph); color: #fff;
    border-color: var(--morph);
}
.morph-chip .chip-jp {
    font-family: var(--s-ff-ui);
    font-size: 0.58rem; opacity: 0.85;
    font-weight: 400; letter-spacing: 0;
}
.morph-sheet-head { display: none; }
.morph-hint {
    margin-top: 6px;
    font-size: 0.60rem; color: var(--morph);
    opacity: 0.60; line-height: 1.5;
}
.morph-clear-btn {
    margin-top: 6px;
    padding: 3px 8px;
    border: 1px dashed var(--morph-border);
    border-radius: 6px; background: none;
    font-size: 0.60rem; color: var(--morph);
    cursor: pointer; font-family: inherit;
    transition: border-color 0.12s;
    display: none;
}
.morph-clear-btn.visible { display: block; width: max-content; margin-left: auto; }
.morph-clear-btn:hover { border-color: var(--morph); }

/* ── Phrase note ── */
.phrase-sub {
    margin-top: 6px;
    padding: 8px 12px;
    background: var(--phrase-bg);
    border: 1px solid var(--phrase-border);
    border-radius: 6px;
    font-size: 0.62rem; color: var(--phrase);
    line-height: 1.55;
    display: none;
}
.phrase-sub.visible { display: block; }

/* ── Search history ── */
/* 履歴の表示先は検索欄直下の suggest-dropdown に一本化。旧表示領域だけを隠し、履歴データは保持する。 */
#history-block, #history-recent-section { display: none; }
.history-block { margin-top: 10px; }
.history-list { display: flex; flex-direction: column; gap: 2px; }
.history-item {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 6px;
    cursor: pointer; transition: background 0.1s;
    font-size: var(--s-ts-xs); color: var(--text-sub);
}
.history-item:hover { background: var(--bg-panel); color: var(--text-main); }
.history-badges { display: none; }
.h-badge {
    font-size: 0.52rem; font-weight: 700; padding: 1px 4px;
    border-radius: 3px; letter-spacing: 0.04em; text-transform: uppercase;
}
.h-badge.lemma  { background: var(--lemma-bg);  color: var(--lemma); }
.h-badge.phrase { background: var(--phrase-bg); color: var(--phrase); }
.h-badge.prox   { background: var(--prox-bg);   color: var(--prox); }
.h-badge.morph  { background: var(--morph-bg);  color: var(--morph); }
.h-query {
    font-family: var(--s-ff-greek); font-size: 0.88rem;
    color: var(--ink); flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}

/* result-panel: 旧サイドバー内のメインエリア（廃止 — .s-results に統合） */
.result-panel { display: contents; }

/* ── Empty / loading state ── */
.state-empty, .state-loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60vh; gap: 14px; text-align: center;
}
.state-loading { display: none; }
.logo-home-btn { cursor: pointer; user-select: none; transition: opacity var(--transition-fast); }
.logo-home-btn:hover { opacity: var(--opacity-secondary); }
.empty-glyph {
    font-family: var(--s-ff-greek);
    font-size: 3.5rem; opacity: 0.12; letter-spacing: -0.05em;
    line-height: 1; user-select: none;
}
.empty-title { font-size: 1rem; font-weight: 700; color: var(--text-sub); }
.empty-desc { font-size: 0.78rem; color: var(--text-sub); max-width: 320px; line-height: 1.65; }
.layer-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.layer-chip {
    padding: 4px 11px; border-radius: 12px; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.05em; cursor: pointer; transition: opacity 0.15s;
    border: 1px solid;
}
.layer-chip.lemma  { background: var(--lemma-bg);  color: var(--lemma);  border-color: var(--lemma-border); }
.layer-chip.phrase { background: var(--phrase-bg); color: var(--phrase); border-color: var(--phrase-border); }
.layer-chip.prox   { background: var(--prox-bg);   color: var(--prox);   border-color: var(--prox-border); }
.layer-chip.morph  { background: var(--morph-bg);  color: var(--morph);  border-color: var(--morph-border); }
.layer-chip:hover { opacity: 0.75; }
/* Pattern chips reuse class="layer-chip prox" in JS — override in context to phrase-green.
   Prox (orange) = word-distance condition; Pattern (green) = biblical expression preset. */
#pattern-chips .layer-chip.prox,
.ci-advanced .layer-chip.prox {
    background: var(--phrase-bg);
    color: var(--phrase);
    border-color: var(--phrase-border);
}

/* ── Pattern Explore cards（ことばの構造を見る）── */
#pattern-explore-chips {
    gap: var(--space-sm);
    justify-content: flex-start;
}
.pe-card {
    flex: 1 1 160px; max-width: 220px;
    padding: var(--space-sm) var(--space-md);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    background: var(--bg-paper);
    cursor: pointer; text-align: left;
    font-family: var(--s-ff-ui);
    transition: background var(--transition-fast);
}
.pe-card:hover { background: var(--bg-panel); }
.pe-label {
    font-size: var(--text-body); font-weight: 700;
    color: var(--text); margin-bottom: var(--space-xs);
}
.pe-pattern {
    font-size: var(--text-caption);
    color: var(--text-sub); margin-bottom: var(--space-xs);
}
.pe-desc { font-size: var(--text-caption); color: var(--text-hint); line-height: 1.5; }

/* ── Concept Insight（Phase 4-3）: 表示専用の知識カード。
      値はすべて既存 tokens.css のトークンのみ（新色・新余白値なし）。
      チップは既存 .layer-chip 体系を流用する ── */
#concept-insight {
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-m);
    padding: 0;
    margin-bottom: var(--space-md);
}
.ci-summary {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-md);
    cursor: pointer; list-style: none; user-select: none;
    border-radius: var(--radius-m);
    transition: background var(--transition-fast);
}
.ci-summary::-webkit-details-marker { display: none; }
.ci-summary:hover { background: var(--bg-paper); }
.ci-outer[open] .ci-summary {
    border-bottom: 1px solid var(--border-soft);
    border-radius: var(--radius-m) var(--radius-m) 0 0;
}
.ci-summary-label { font-size: var(--text-body); font-weight: 700; color: var(--text-main); letter-spacing: -0.01em; }
.ci-summary-hint {
    font-size: var(--text-caption); color: var(--text-sub);
    display: flex; align-items: center; gap: var(--space-xs);
}
.ci-summary-hint::after { content: '›'; font-size: var(--text-body-lg); line-height: 1; transition: transform var(--transition-base); }
.ci-outer[open] .ci-summary-hint::after { transform: rotate(90deg); }
.ci-outer-body { padding: 0 var(--space-md) var(--space-md); }

/* ── Search Query State (SQS) filter bar ──
   .layers-block 内末尾に配置。フィルタあり時のみ表示される。 */
#sqs-filter-bar {
    display: none; flex-wrap: wrap; align-items: center;
    gap: var(--space-xs);
    margin-top: var(--space-md);
    padding-top: var(--space-md);
    border-top: 1px solid var(--border-soft);
}
#sqs-filter-bar::before {
    content: '追加条件';
    display: block; width: 100%;
    font-size: var(--text-caption); font-weight: 600;
    letter-spacing: 0.1em; color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-bottom: var(--space-xs);
}
.sqs-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px var(--s-sp-2); border: 1px solid var(--s-accent-mid);
    border-radius: var(--s-radius-chip); font-size: var(--s-ts-xs);
    color: var(--s-accent); background: var(--s-accent-soft);
}
.sqs-pill-x {
    background: none; border: none; cursor: pointer; line-height: 1;
    color: var(--s-accent); font-size: var(--s-ts-xs); padding: 0 2px;
    font-family: inherit; transition: opacity var(--s-dur-fast);
}
.sqs-pill-x:hover { opacity: 0.6; }
.ci-header {
    font-size: var(--text-caption);
    font-weight: 600;
    letter-spacing: var(--tracking-label);
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-bottom: var(--space-sm);
}
.ci-section { margin-top: var(--space-sm); }
.ci-section:first-of-type { margin-top: 0; }
.ci-section-title {
    font-size: var(--text-caption);
    font-weight: 700;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--text-sub);
    opacity: var(--opacity-secondary);
    margin-bottom: var(--space-xs);
}
.ci-chips { justify-content: flex-start; }
.ci-related-more-btn {
    font-size: var(--text-caption);
    color: var(--text-sub);
    cursor: pointer;
    background: none;
    border: 1px dashed var(--border-soft);
    border-radius: var(--s-radius-panel);
    padding: var(--space-xs) var(--space-sm);
    font-family: inherit;
    line-height: 1;
    transition: border-color var(--transition-fast), color var(--transition-fast);
}
.ci-related-more-btn:hover { border-color: var(--highlight); color: var(--highlight); }

/* 関連するギリシャ語（Phase 6-2）: 語彙 → 語義 → 出現数 → 辞書の導線行。
   値はすべて既存トークンのみ */
.ci-lex { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
.ci-lex-row {
    display: inline-flex;
    align-items: baseline;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-s);
    background: var(--bg);
    cursor: pointer;
    transition: opacity var(--transition-fast);
}
.ci-lex-row:hover { opacity: var(--opacity-secondary); }
.ci-lex-greek {
    font-family: var(--font-greek);
    font-size: var(--text-body-lg);
    color: var(--text-main);
}
.ci-lex-gloss {
    font-size: var(--text-caption);
    color: var(--text-sub);
}
.ci-lex-count {
    font-size: var(--text-caption);
    color: var(--text-hint);
}

.spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--s-surface-2);
    border-top-color: var(--s-accent);
    animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-label { font-size: var(--s-ts-sm); color: var(--s-text-sub); }

/* ── Result header ── */
.result-header {
    display: none;
    align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: var(--s-sp-5); padding-bottom: var(--s-sp-3);
    border-bottom: 1px solid var(--s-divider-strong);
}
.result-header.visible { display: flex; }
.result-query {
    font-family: var(--s-ff-greek);
    font-size: var(--s-ts-lg); font-weight: 700; color: var(--s-text);
    letter-spacing: 0.02em;
    cursor: pointer; border-bottom: 2px dotted var(--s-divider);
    transition: border-color var(--s-dur-fast), color var(--s-dur-fast);
}
.result-query:hover { border-bottom-color: var(--s-accent); color: var(--s-accent); }
/* 番号・ギリシャ語レンマ検索の見出し：語名＋意味＋番号（#45）。意味と番号は補助表示（語名より控えめ） */
.result-query .rq-gloss { font-family: var(--s-ff-ui, inherit); font-size: 0.82em; font-weight: 400; color: var(--s-text-sub); margin-left: 0.25em; letter-spacing: 0; }
.result-query .rq-strong { font-family: var(--s-ff-ui, inherit); font-size: 0.68em; font-weight: 600; color: var(--s-text-hint, var(--s-text-sub)); margin-left: 0.25em; letter-spacing: 0.04em; }

/* ── Abbott-Smith Modal ── */
#as-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.38);
    z-index: 900; display: none; align-items: center; justify-content: center;
    padding: 20px;
}
#as-backdrop.open { display: flex; }
#as-modal {
    background: var(--s-surface); border-radius: var(--s-radius-modal);
    box-shadow: var(--s-shadow-modal);
    max-width: 640px; width: 100%; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
}
#as-modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px 12px; border-bottom: 1px solid var(--s-divider);
    flex-shrink: 0;
}
#as-modal-lemma {
    font-family: var(--s-ff-greek); font-size: var(--s-ts-lg);
    font-weight: 700; color: var(--s-text); flex: 1;
}
#as-modal-strong {
    font-size: var(--s-ts-xs); font-weight: 700; color: var(--s-text-sub);
    background: var(--s-surface-2); border-radius: var(--s-radius-chip); padding: 2px 7px;
}
#as-modal-close {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--s-surface-2); cursor: pointer;
    color: var(--s-text-sub); display: flex; align-items: center; justify-content: center;
    transition: background var(--s-dur-fast) var(--s-ease);
}
#as-modal-close svg { width: 16px; height: 16px; display: block; }
#as-modal-close:hover { background: var(--s-divider); }
#as-modal-body {
    padding: 16px 20px; overflow-y: auto; flex: 1;
    font-size: var(--s-ts-base); line-height: var(--s-lh-prose);
    color: var(--s-text); white-space: pre-wrap;
    font-family: var(--s-ff-prose);
}
#as-modal-body .as-empty { color: var(--s-text-sub); font-style: italic; }
.result-count {
    font-size: 0.78rem; font-weight: 700;
    color: var(--text-main);
    display: inline-flex; flex-direction: column; align-items: flex-end; gap: 1px;
}
.result-count-sub {
    font-size: var(--text-caption);
    font-weight: 400;
    opacity: 0.75;
}
/* 合計内訳行（新約 N件／LXX M件・K語形に分類）は一次情報なので本文色。注記類（.result-count-sub のみ）は従来のまま（#55） */
.result-count-sub.result-count-break { color: var(--text-main); opacity: 1; }
.r-badge {
    font-size: 0.6rem; font-weight: 700; padding: 3px 8px;
    border-radius: 10px; letter-spacing: 0.06em; text-transform: uppercase;
}
.r-badge.lemma  { background: var(--lemma-bg);  color: var(--lemma); }
.r-badge.phrase { background: var(--phrase-bg); color: var(--phrase); }
.r-badge.prox   { background: var(--prox-bg);   color: var(--prox); }
.r-badge.morph  { background: var(--morph-bg);  color: var(--morph); }

/* ── Co-occurrence + hits layout ── */
.results-grid {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 24px;
    align-items: start;
}
.results-grid.no-cooc {
    grid-template-columns: 1fr;
}
.cooc-col { display: none; }
.results-grid:not(.no-cooc) .cooc-col { display: block; }

.cooc-title {
    font-size: 0.6rem; font-weight: 700; color: var(--text-sub);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 8px; opacity: 0.6;
}
.rank-item {
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    margin-bottom: 3px;
}
.rank-item:hover { background: var(--bg-panel); }
.rank-item.highlighted { background: var(--prox-bg); }
.rank-top { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
.rank-word-wrap { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.rank-word { font-family: var(--s-ff-greek); font-size: var(--s-ts-base); color: var(--text-main); }
.rank-gloss { font-size: 0.65rem; color: var(--text-sub); }
.rank-score { font-size: 0.62rem; color: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
.rank-bar-track {
    height: 2px; background: var(--border-soft); border-radius: 1px; overflow: hidden;
}
.rank-bar-fill {
    height: 100%; background: var(--prox); border-radius: 1px;
    transition: width 0.4s;
}
.add-btn {
    background: none;
    border: 1px solid var(--prox-border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.60rem; font-weight: 700;
    font-family: inherit;
    color: var(--prox);
    padding: 2px 7px;
    line-height: 1.4;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
}
.add-btn:hover { background: var(--prox); color: #fff; }

/* ── Book distribution ── */
.dist-panel { margin-bottom: 18px; }
.dist-title {
    font-size: 0.6rem; font-weight: 700; color: var(--text-sub);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 8px; opacity: 0.6;
}
.dist-section-title {
    font-size: var(--text-caption); font-weight: 700;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--text-sub); opacity: 0.6;
    margin-top: var(--space-sm); margin-bottom: var(--space-xs);
}
.dist-title + .dist-section-title { margin-top: 0; }
.dist-section-divider {
    border: none; border-top: 1px solid var(--border-soft);
    margin: var(--space-sm) 0;
}
.dist-overflow-note {
    font-size: var(--text-caption); color: var(--text-sub);
    opacity: 0.5; padding: 2px 5px;
}
.dist-bar-list { display: flex; flex-direction: column; gap: 4px; }
.dist-bar-row {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; padding: 3px 5px; border-radius: 6px;
    transition: background 0.1s;
}
.dist-bar-row:hover { background: var(--bg-panel); }
.dist-bar-row.active { background: var(--border-soft); }
.dist-bar-name { font-size: 0.68rem; color: var(--text-sub); width: 70px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dist-bar-track { flex: 1; height: 5px; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
.dist-bar-fill { height: 100%; background: var(--highlight); opacity: 0.55; border-radius: 3px; transition: width 0.4s; }
.dist-bar-count { font-size: 0.62rem; color: var(--text-sub); width: 24px; text-align: right; flex-shrink: 0; }

/* ── Hits count ── */
.hits-count {
    font-size: var(--text-body); color: var(--text);
    margin-bottom: var(--space-md); line-height: 1.5;
}
.hits-count:empty { display: none; }
/* 結果画面の「よく一緒に出る語」（グループ外の独立セクション） */
.lemma-cooc { margin: var(--space-md) 0; }
.lemma-cooc .lg-cooc-title { margin-bottom: 6px; }
.lg-cooc-lemma { text-transform: none; letter-spacing: 0; }
/* 結果画面の出現分布（既定で閉じる） */
.dist-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; padding: 0; margin: 0 0 8px;
    cursor: pointer; font-family: inherit; text-align: left; color: var(--text-sub);
}
.dist-toggle .dist-title { margin-bottom: 0; }
.dist-toggle-sum { font-size: var(--text-caption); opacity: 0.75; flex: 1; }
.dist-toggle-chev { display: inline-flex; width: 14px; height: 14px; transition: transform .15s; opacity: 0.6; }
.dist-toggle-chev svg { width: 14px; height: 14px; }
.dist-toggle[aria-expanded="true"] .dist-toggle-chev { transform: rotate(90deg); }
.dist-toggle:hover .dist-title, .dist-toggle:hover .dist-toggle-sum { opacity: 1; }
.dist-body[hidden] { display: none; }

/* ── Lemma groups (Japanese query) ── */
.lemma-groups { margin-bottom: 16px; }
.lg-row { margin-bottom: 6px; }
.lg-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--bg-paper); border-radius: 6px;
    border: 1px solid var(--border-soft); cursor: pointer;
    transition: background 0.12s;
}
.lg-bar:hover { background: var(--bg-panel); }
.lg-bar.open  { background: var(--bg-panel); border-radius: 6px 6px 0 0; }
.lg-toggle { font-size: 0.55rem; color: var(--text-sub); transition: transform 0.18s; display: inline-flex; align-items: center; }
.lg-bar.open .lg-toggle { transform: rotate(90deg); }
.lg-form { font-size: var(--s-ts-sm); font-weight: 700; color: var(--text-main); }
/* 展開中の印（#50 / R2。共起の追随先のバーに付く .follow）: 左端にアクセント帯（inset なのでレイアウト寸法は不変）＋語名をアクセント色に。閉じれば元に戻る */
.lg-bar.follow { box-shadow: inset 3px 0 0 var(--s-accent); }
.lg-bar.follow .lg-form { color: var(--s-accent); }
.lg-greek { font-family: var(--s-ff-greek); font-size: 0.88rem; color: var(--text-sub); }
.lg-matched-gloss { font-size: 0.74rem; color: var(--text-sub); opacity: 0.85; white-space: nowrap; }
.lg-count { font-size: var(--text-caption); color: var(--text-sub); margin-left: auto; }
.lg-panel {
    display: none; padding: 10px 12px;
    background: var(--bg-panel); border: 1px solid var(--border-soft); border-top: none;
    border-radius: 0 0 6px 6px;
}
.lg-panel.open { display: block; }
.lg-cooc-title,.lg-hits-title {
    font-size: 0.58rem; font-weight: 700; color: var(--text-sub);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 5px; opacity: 0.55;
}
.lg-cooc-list { display: flex; flex-wrap: wrap; gap: 4px; }
.lg-cooc-sec { margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: 1px solid var(--border-soft); }
.lg-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: var(--radius-pill);
    background: var(--prox-bg); border: 1px solid var(--prox-border);
    font-size: 0.68rem; cursor: pointer; transition: opacity 0.1s;
}
.lg-chip:hover { opacity: 0.7; }
.lg-chip-jp { color: var(--text-sub); }
.lg-chip-gr { font-family: var(--s-ff-greek); color: var(--prox); }
.lg-chip-ct { font-size: 0.58rem; color: var(--text-sub); }
.lg-more-btn {
    width: 100%; margin-top: 6px; padding: 5px;
    font-size: 0.68rem; color: var(--text-sub); cursor: pointer;
    background: none; border: 1px dashed var(--border-soft);
    border-radius: var(--s-radius-panel); font-family: inherit; transition: border-color 0.12s;
}
.lg-more-btn:hover { border-color: var(--highlight); color: var(--highlight); }

/* ── IGSD 語のページ ── */
.igsd-badge {
    font-size: 0.6rem; padding: 1px 7px; border-radius: var(--radius-pill);
    color: var(--text-sub); border: 1px solid var(--border-soft);
    background: var(--bg-paper); white-space: nowrap;
}
.lg-form.igsd-link, .lg-greek.igsd-link { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; }
.lg-form.igsd-link:hover, .lg-greek.igsd-link:hover { color: var(--highlight); }
/* ギリシャ語クエリ結果の語のページ入口（QA-05） */
.igsd-badge-btn { cursor: pointer; font-family: inherit; }
.igsd-badge-btn:hover { color: var(--highlight); border-color: var(--highlight); }
.as-igsd-link { display: inline-block; margin-top: 14px; font-size: 0.85rem; color: var(--s-accent); background: none; border: none;
    padding: 0; cursor: pointer; font-family: inherit; }
.as-igsd-link:hover { text-decoration: underline; }
.igsd-entry { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
.igsd-page { margin-bottom: 16px; }
.igsd-back {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: var(--text-caption); color: var(--text-sub); padding: 4px 0; margin-bottom: 8px;
}
.igsd-back:hover { color: var(--highlight); }
.igsd-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.igsd-lemma { font-family: var(--s-ff-greek); font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
.igsd-meta { font-size: var(--text-caption); color: var(--text-sub); }
.igsd-dist-toggle {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: var(--text-caption); color: var(--text-sub); padding: 4px 0; margin-top: 4px;
}
.igsd-dist-toggle:hover { color: var(--highlight); }
.igsd-dict { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
.igsd-dict[hidden] { display: none; }
.igsd-dict-h { cursor: pointer; font-size: var(--s-ts-sm); font-weight: 700; color: var(--text-main); }
.igsd-dict-body { margin-top: 8px; font-size: var(--s-ts-base); line-height: var(--s-lh-prose); color: var(--s-text); white-space: pre-wrap; font-family: var(--s-ff-prose); }
.igsd-sense { margin-top: 16px; padding: 12px; background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--s-radius-panel); } /* グループパネルと同じ素材（#55） */
.igsd-sense-h { font-size: var(--s-ts-sm); font-weight: 700; color: var(--text-main); }
.igsd-sense-count { font-weight: 400; color: var(--text-sub); font-size: var(--text-caption); margin-left: 6px; }
.igsd-sense-def { font-size: var(--text-caption); color: var(--text-sub); margin: 4px 0 8px; line-height: 1.6; }
.igsd-empty { font-size: 0.72rem; color: var(--text-sub); opacity: 0.6; }
.igsd-idiom { font-size: var(--text-caption); color: var(--text-main); padding: 4px 0; line-height: 1.6; }
.igsd-idiom-form { font-family: var(--s-ff-greek); font-weight: 700; margin-right: 8px; }
.igsd-idiom-refs { color: var(--text-sub); margin-left: 8px; }

/* ============================================================
   Hit card — リスト型（区切り線のみ、カードシャドウなし）
   ============================================================ */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}
.hit-card {
    padding: var(--s-sp-5) 0;
    border-top: 1px solid var(--s-divider);
    animation: fadeUp var(--s-dur-result) var(--s-ease) both;
}
.hit-card:hover { background: none; }

/* Hit card top row */
.hit-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
}
.hit-top-right {
    display: flex; align-items: center; gap: 6px;
    margin-left: auto; flex-shrink: 0;
}
.hit-ref-link {
    font-size: var(--s-ts-xs); font-weight: 700;
    color: var(--highlight); text-decoration: none;
    letter-spacing: 0.04em; flex-shrink: 0;
}
.hit-ref-link:hover { text-decoration: underline; }
.hit-ref-plain {
    font-size: var(--s-ts-xs); font-weight: 700;
    color: var(--highlight); letter-spacing: 0.04em;
}
.hit-open-btn {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto;
    padding: 3px 9px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    background: var(--bg-panel);
    font-size: var(--s-ts-xs); font-weight: 700;
    font-family: inherit;
    color: var(--text-sub);
    cursor: pointer; white-space: nowrap;
    text-decoration: none;
    transition: border-color 0.12s, color 0.12s, background 0.12s;
    flex-shrink: 0;
}
.hit-open-btn:hover {
    border-color: var(--highlight);
    color: var(--highlight);
    background: var(--highlight-light);
}

/* Hit-type badges — the core of the unified UI */
.hit-type-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.ht-badge {
    font-size: var(--s-ts-xs); font-weight: 700; padding: 2px 6px;
    border-radius: 8px; letter-spacing: 0.06em; text-transform: uppercase;
}
.ht-badge.lemma  { background: var(--lemma-bg);  color: var(--lemma); }
.ht-badge.phrase { background: var(--phrase-bg); color: var(--phrase); }
.ht-badge.prox   { background: var(--prox-bg);   color: var(--prox); }
.ht-badge.morph  { background: var(--morph-bg);  color: var(--morph); }

/* Snippet highlight colors (スニペット強調 — 既存レイヤー色を継承) */
.hit-snippet .hl-lemma  { color: var(--lemma);  font-weight: 700; text-decoration: underline; text-decoration-color: var(--s-accent-mid); text-underline-offset: 3px; }
.hit-snippet .hl-phrase { color: var(--phrase); font-weight: 700; background: var(--phrase-bg); border-radius: 2px; padding: 0 1px; }
.hit-snippet .hl-prox-w1{ color: var(--prox);   font-weight: 700; }
.hit-snippet .hl-prox-w2{ color: var(--prox);   font-weight: 700; opacity: 0.75; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 3px; }
.hit-snippet .hl-multi  { background: linear-gradient(120deg, var(--lemma-bg), var(--phrase-bg)); border-radius: 2px; padding: 0 1px; font-weight: 700; }

/* Proximity distance line */
.prox-legend { margin-top: 10px; font-size: 0.68rem; color: var(--ink-soft); line-height: 1.9; }
.prox-legend .ht-badge { margin-right: 4px; }
.prox-dist-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; font-size: 0.7rem;
}
.prox-anchor { font-family: var(--s-ff-greek); font-weight: 700; color: var(--prox); }
.prox-dist-line {
    flex: 1; height: 1px; background: var(--prox-border);
    display: flex; align-items: center; justify-content: center; position: relative;
}
.prox-dist-label {
    background: var(--bg-paper); padding: 0 6px;
    font-size: 0.6rem; color: var(--prox); font-weight: 700;
    font-family: monospace;
    position: relative; z-index: 1;
}
.prox-target { font-family: var(--s-ff-greek); font-weight: 700; color: var(--prox); opacity: 0.7; }

/* hit-trans-row / hit-trans-text / hit-snippet: 新定義は下部 qtype セクション参照 */
.hit-trans-row { margin-bottom: var(--s-sp-2); }
.hit-greek-row { display: flex; flex-direction: column; gap: 6px; }


/* Refinement banner */
#refinement-banner {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--prox); color: #fff;
    padding: 10px 20px; border-radius: 24px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    z-index: 500; display: none;
    align-items: center; gap: 12px; white-space: nowrap;
    transition: opacity 0.3s;
}

/* Zero hits */
.zero-hits {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 48px 0; text-align: center;
}
.zero-hits-icon { font-size: 0.7rem; opacity: 0.18; } /* 装飾は検索語・案内文（0.8rem）より小さく（#55） */
.zero-hits-msg { font-size: 0.8rem; color: var(--text-sub); }
/* 0件時のレンマ候補（#46） */
.did-you-mean { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); }
.did-you-mean[hidden] { display: none; }
.did-you-mean .dym-chip { cursor: pointer; padding: 4px 12px; border: 1px solid var(--border-soft); border-radius: 14px; background: var(--bg-paper); color: var(--text-main); font-family: var(--s-ff-greek); }
.did-you-mean .dym-chip:hover { border-color: var(--s-accent); color: var(--s-accent); }
.did-you-mean .dym-gloss { font-family: var(--s-ff-ui, inherit); font-size: 0.85em; color: var(--text-sub); margin-left: 0.3em; }
.zero-recovery {
    margin-top: var(--space-xl);
    padding-top: var(--space-lg);
    border-top: 1px solid var(--border-soft);
    width: 100%;
    max-width: 420px;
}
.zero-hint {
    margin-top: var(--space-md);
    font-size: var(--text-caption);
    color: var(--text-sub);
    opacity: 0.65;
    line-height: 1.7;
}

/* ── Example query pills (empty state) ── */
.empty-examples {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 16px;
}
.ex-chip {
    padding: 6px 14px;
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-pill);
    font-family: var(--s-ff-greek);
    font-size: 0.9rem;
    color: var(--text-sub);
    cursor: pointer;
    background: var(--bg-paper);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    user-select: none;
}
.ex-chip:hover {
    border-color: var(--highlight);
    color: var(--highlight);
    background: var(--highlight-light);
}
.empty-section-label {
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--text-sub); margin-bottom: 8px;
    opacity: 0.6;
}

/* ── Discovery Lobby（タイトル＋検索窓だけ）── */
/* 既定（ロビー表示）は検索窓の直下に寄せる。エラー等の空状態だけ .is-centered で従来どおり中央（:has() に依存しない） */
.state-empty { justify-content: flex-start; min-height: 0; }
.state-empty.is-centered { justify-content: center; min-height: 60vh; }

/* ── ロビー専用（Google 検索風の寸法）──
   body.is-lobby は #state-empty が表示中（かつエラー等の .is-centered でない）ときだけ付く（MutationObserver、:has() 非依存）。
   検索後の結果画面・エラー空状態には一切影響しない。 */
/* ロビーでは検索窓下の区切り線を出さない（結果画面では従来どおり） */
body.is-lobby .s-search-divider { display: none; }
/* 見出しの中心を画面高の約28%へ（block上端56px＋見出し高の半分≒40px を差し引く） */
body.is-lobby .s-search-block { padding-top: max(var(--s-sp-7), calc(28vh - 96px)); }
body.is-lobby .s-search-title {
    font-family: Arial, Helvetica, 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 72px;
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.1;
    text-align: center;
    margin-bottom: var(--s-sp-5);
}
body.is-lobby .search-input-wrap {
    max-width: 584px;
    margin-left: auto;
    margin-right: auto;
}
body.is-lobby .unified-input {
    height: 48px;
    padding: 0 48px 0 22px;
    font-size: 16px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
}
body.is-lobby .unified-input::placeholder { font-size: 16px; }
body.is-lobby .unified-input:hover,
body.is-lobby .unified-input:focus {
    border-color: transparent;
    box-shadow: 0 1px 6px rgba(32,33,36,0.28);
}
body.is-lobby .search-icon-btn { top: 24px; right: 16px; }
@media (max-width: 700px) {
    body.is-lobby .s-search-title { font-size: 44px; text-align: center; }
    body.is-lobby .s-search-block { padding-top: max(16px, calc(28vh - 72px)); }
}

/* ── PC（701px 以上）の結果画面：Google 型ヘッダー（#44）──
   左に小さい Greekn、その右隣に検索窓を同じ行で置く。ロビー（body.is-lobby）とモバイル（≤700px）は対象外。
   .s-search-block を grid にし、見出しと検索窓だけを 1 行目に置く。それ以外の子（警告・モードバー・履歴など）は
   従来どおり 720px 級の中央カラムのまま 2 行目以降に置く（結果コンテンツ列は動かさない）。
   検索窓の内側（検索アイコン・文法フィルタのボタンとカード）は .search-input-wrap 基準のため、窓に追随する。 */
@media (min-width: 701px) {
    body:not(.is-lobby) .s-search-block {
        max-width: none;
        display: grid;
        grid-template-columns: auto minmax(0, 670px) 1fr;
        column-gap: 24px;
        align-items: start;
        padding: 20px 24px var(--s-sp-4);
    }
    body:not(.is-lobby) .s-search-block > * {
        grid-column: 1 / -1;
        justify-self: center;
        width: 100%;
        max-width: calc(var(--s-content-max) - 2 * var(--s-sp-5));
        box-sizing: border-box;
    }
    body:not(.is-lobby) .s-search-block > .s-search-title {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        width: auto;
        max-width: none;
        height: 54px;
        display: flex;
        align-items: center;
        margin: 0;
        font-family: Arial, Helvetica, 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
        text-align: left;
        white-space: nowrap;
    }
    body:not(.is-lobby) .s-search-block > .search-input-wrap {
        grid-column: 2;
        grid-row: 1;
        justify-self: stretch;
        max-width: none;
    }
}

/* ── PC（701px 以上）：文法フィルタの入口を検索窓の中へ（モバイルは FAB＋シートのまま） ──
   .search-filters は display:contents にして #morph-sub を .search-input-wrap 基準の浮きカードにする。
   ロビー（クエリ無し）では「絞り込みの提案」と近接スライダを出さない（:not(.has-query) で非表示）。 */
.morph-box-btn { display: none; }
@media (min-width: 701px) {
    .unified-input { padding-right: 84px; }
    body.is-lobby .unified-input { padding-right: 88px; }
    .morph-box-btn {
        position: absolute;
        right: 44px; top: 30px; transform: translateY(-50%);
        z-index: 2;
        display: flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; padding: 0;
        border: 0; border-radius: 50%;
        background: transparent; color: var(--text-sub);
        cursor: pointer; line-height: 1;
        transition: color var(--transition-fast), background var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
    }
    body.is-lobby .morph-box-btn { top: 24px; right: 48px; }
    .morph-box-btn svg { width: 18px; height: 18px; display: block; }
    .morph-box-btn:hover { background: rgba(60,64,67,0.08); color: var(--text-main); }
    .morph-box-btn[aria-expanded="true"],
    .morph-box-btn.has-selection { color: var(--s-accent); }
    .morph-box-btn[aria-expanded="true"] { background: var(--s-accent-soft); }
    .morph-box-btn .morph-box-count {
        position: absolute; top: -2px; right: -2px;
        min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box;
        display: none; align-items: center; justify-content: center;
        border-radius: 10px; background: var(--s-accent); color: #fff;
        font: 700 10px/1 var(--s-ff-ui);
    }
    .morph-box-btn.has-selection .morph-box-count { display: flex; }

    .search-filters, .search-filters.has-query { display: contents; }
    .search-filters:not(.has-query) > :not(.morph-sub) { display: none; }
    .search-filters.has-query > .filter-suggestion-title,
    .search-filters.has-query > .prox-sub { margin-top: 12px; }
    .search-filters .morph-panel-toggle,
    .search-filters.single-word .morph-panel-toggle { display: none; }
    .search-filters .morph-sub,
    .search-filters.multi-word .morph-sub { display: none; }
    .search-filters #morph-sub.is-open,
    .search-filters.multi-word #morph-sub.is-open {
        display: block;
        position: absolute; left: 0; right: 0; top: 62px; z-index: 60;
        box-sizing: border-box; margin: 0; padding: 6px 16px 14px;
        max-height: min(70vh, 560px); overflow-y: auto; overscroll-behavior: contain;
        background: #fff; border: 1px solid var(--s-border); border-radius: 16px;
        box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    }
    body.is-lobby .search-filters #morph-sub.is-open { top: 54px; }
    .search-filters #morph-sub .morph-sheet-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        position: sticky; top: -6px; z-index: 1; padding: 8px 0 10px; margin-bottom: 4px;
        background: #fff; border-bottom: 1px solid var(--s-divider);
    }
    .search-filters #morph-sub .morph-sheet-title { font-size: 0.86rem; font-weight: 700; color: var(--s-text-sub); }
    .search-filters #morph-sub .morph-sheet-close {
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; flex: 0 0 auto; padding: 0;
        border: 1px solid var(--s-border); border-radius: 50%;
        background: transparent; color: var(--s-text-sub); font-size: 1.05rem; cursor: pointer;
    }
}

/* ============================================================
   書物マスター: books.json が唯一の出典（book-master.js 経由）。
   ALL_BOOKS / FLAT_BOOKS / NT_BOOK_KEYS のローカル定義は撤廃。
   init() の冒頭で applyBookMaster() が下記変数を実値で埋めるまで、
   これらは空のまま（書物リストに依存する処理は init() 完了後のみ実行される）。
   ============================================================ */
var FLAT_BOOKS    = [];   // [{key, name, ch}] — NT(27書)+OT(39書) 全件
var NT_BOOK_KEYS   = new Set();
/* BookMaster.load() は検索画面の初期化と並行して完了するため、
   applyBookMaster() が参照する構文検索用バインディングも先に初期化する。 */
var SYN_NT_BOOKS = new Set();
var SYN_BOOK_JP = {};
var SYN_BOOK_GROUPS = [];
var _SYN_NT_CHAPTERS = [];
var _SYN_BOOK_ORDER = {};
var _synEnabledGroups = new Set();

let _bookMasterPromise = null;
/* books.json の読み込み+反映を1回だけ行う（複数箇所から呼ばれても安全）。
   全文索引の構築（重い）とは独立に、書物リスト/グループ名だけ先に必要な
   UI（構文検索の書物チップ等）はこれだけを待てばよい。 */
function ensureBookMasterApplied() {
    if (!_bookMasterPromise) {
        _bookMasterPromise = BookMaster.load().then(master => { applyBookMaster(master); return master; });
    }
    return _bookMasterPromise;
}

function applyBookMaster(master) {
    FLAT_BOOKS = master.ALL.map(b => ({ key: b.key, name: b.name, ch: b.chapters }));
    NT_BOOK_KEYS = new Set(master.ntKeys);

    /* SYNTAX PATTERN SEARCH（オンデマンド解析）側も同じ books.json を参照する。
       以前はここだけ別の ALL_BOOKS 系コピーを持っていたため統一する。 */
    SYN_NT_BOOKS = new Set(master.ntKeys);
    SYN_BOOK_JP  = Object.fromEntries(master.ALL.map(b => [b.key, b.name]));
    SYN_BOOK_GROUPS = master.groups;
    _SYN_NT_CHAPTERS = master.NT.map(b => ({ key: b.key, ch: b.chapters }));
    _SYN_BOOK_ORDER  = Object.fromEntries(_SYN_NT_CHAPTERS.map((b,i) => [b.key, i+1]));
    _synEnabledGroups = new Set(SYN_BOOK_GROUPS.map(g => g.key));
}

async function bibleDataPath(bookKey, ch) {
    return BookMaster.pathFor(bookKey, ch);
}

/* ============================================================
   ストップワード（original — unchanged）
   ============================================================ */
const STOP_WORDS = new Set([
    'ὁ','ἡ','τό','τοῦ','τῆς','τῷ','τήν','τόν','τά','τοῖς','ταῖς','τάς','τούς',
