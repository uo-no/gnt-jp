/* ============================================================
   SYNTAX PATTERN SEARCH — similar-syntax-search.html から統合
   ============================================================ */

/* SYN_NT_BOOKS / SYN_BOOK_JP / SYN_BOOK_GROUPS は books.json（book-master.js）由来。
   applyBookMaster() が BookMaster.load() 完了後に実値で埋める。 */
const SYN_PAGE_SIZE = 50;

function cleanText(e) {
    return (e.word||e.normalized||e.text||'').replace(/[.,:;·⸀⸁⸂⸃⌈⌉]/g,'').trim();
}

/* NT書物・章数（オンデマンド解析で使用）。books.json 由来、applyBookMaster() が埋める。 */
let _synAnalyzerInstance = null, _synAnalyzerLoading = null;

class SyntaxIndexCache {
    #cache = new Map(); #loading = new Map();
    async get(syntaxId) {
        if (this.#cache.has(syntaxId)) return this.#cache.get(syntaxId);
        if (this.#loading.has(syntaxId)) return this.#loading.get(syntaxId);
        /* syntax-index/{id}.json は事前生成キャッシュであり、未生成は想定された
           フォールバック経路（_synAnalyzeOnDemand で原資料から再計算する）。
           genuine なデータ取得失敗ではないため __failedFetches には積まないが、
           「サイレント化」にはしない — console.info で必ず追跡可能にする。 */
        const pr = fetch(`../syntax-index/${syntaxId}.json`)
            .then(r => {
                if (r.ok) return r.json();
                console.info('[syntax-index] cache miss (HTTP '+r.status+'), falling back to on-demand:', syntaxId);
                return null;
            })
            .catch(err => { console.info('[syntax-index] cache fetch error, falling back to on-demand:', syntaxId, err); return null; })
            .then(async data => data != null ? data : _synAnalyzeOnDemand(syntaxId))
            .then(hits => {
                const arr = Array.isArray(hits) ? hits : [];
                this.#cache.set(syntaxId, arr); this.#loading.delete(syntaxId);
                return arr;
            });
        this.#loading.set(syntaxId, pr);
        return pr;
    }
}
const _synCache = new SyntaxIndexCache();

/* ── SyntaxAnalyzer オンデマンドロード ── */
async function _synEnsureAnalyzer() {
    if (_synAnalyzerInstance) return _synAnalyzerInstance;
    if (_synAnalyzerLoading) return _synAnalyzerLoading;
    _synAnalyzerLoading = (async () => {
        const [registry] = await Promise.all([
            _synRegistryData
                ? Promise.resolve(_synRegistryData)
                : BookMaster.fetchJSON('../assets/data/syntax-registry.json')
                    .then(d => { _synRegistryData = d; return d; }),
            typeof SyntaxAnalyzer !== 'undefined'
                ? Promise.resolve()
                : new Promise((res, rej) => {
                    const s = document.createElement('script');
                    s.src = '../core/syntax-analyzer.js';
                    s.onload = res;
                    s.onerror = () => rej(new Error('core/syntax-analyzer.js 読み込み失敗'));
                    document.head.appendChild(s);
                }),
        ]);
        _synAnalyzerInstance = new SyntaxAnalyzer(registry || _synRegistryData);
        _synAnalyzerLoading = null;
        return _synAnalyzerInstance;
    })();
    return _synAnalyzerLoading;
}

/* ── ブラウザ内オンデマンド解析（syntax-index/*.json 未生成時のフォールバック） ── */
async function _synAnalyzeOnDemand(syntaxId) {
    const statusEl = document.getElementById('syn-status');
    let analyzer;
    try {
        analyzer = await _synEnsureAnalyzer();
    } catch (e) {
        if (statusEl) statusEl.textContent = _tf('search.syn.loadFailed','SyntaxAnalyzer の読み込みに失敗しました');
        return [];
    }

    const hits = [];
    const tasks = [];
    for (const b of _SYN_NT_CHAPTERS)
        for (let c = 1; c <= b.ch; c++) tasks.push({ key: b.key, ch: c });

    const BATCH = 8;
    let done = 0;
    for (let i = 0; i < tasks.length; i += BATCH) {
        const slice = tasks.slice(i, i + BATCH);
        const results = await Promise.allSettled(
            slice.map(async t => ({ ...t, tokens: (await BookMaster.fetchJSON(await BookMaster.pathFor(t.key, t.ch))) || [] }))
        );
        for (const r of results) {
            if (r.status !== 'fulfilled') { done++; continue; }
            const { key, ch, tokens } = r.value;
            if (!Array.isArray(tokens) || !tokens.length) { done++; continue; }

            const bookOrder = _SYN_BOOK_ORDER[key] || 99;
            const verseMap = new Map();
            for (const t of tokens) {
                const vk = String(t.verse);
                if (!verseMap.has(vk)) verseMap.set(vk, []);
                verseMap.get(vk).push(t);
            }
            for (const [vStr, vTokens] of verseMap) {
                for (let ti = 0; ti < vTokens.length; ti++) {
                    const token = vTokens[ti];
                    try {
                        const out = analyzer.analyze({ target: token, tokens: vTokens, targetIdx: ti });
                        if (!out?.candidates?.length) continue;
                        const c0 = out.candidates[0];
                        if (c0.id !== syntaxId || c0.confidence < 0.3 || c0.status !== 'active') continue;
                        const chN = parseInt(ch), vN = parseInt(vStr);
                        hits.push({
                            bookKey: key, chapter: chN, verse: vN,
                            globalIdx: token.globalIdx,
                            word: _synCleanText(token),
                            lemma: (token.lemma || '').trim(),
                            confidence: parseFloat(c0.confidence.toFixed(4)),
                            status: c0.status,
                            sortKey: bookOrder * 1_000_000 + chN * 1000 + vN,
                        });
                    } catch { /* skip */ }
                }
            }
            done++;
        }
        if (statusEl) statusEl.textContent = _tf('search.syn.progress','解析中… {done}/{total} 章 ({pct}%)',{done:done,total:tasks.length,pct:Math.round(done/tasks.length*100)});
    }
    if (statusEl) statusEl.textContent = '';
    return hits;
}

let _synAllHits = [], _synFiltered = [], _synDisplayed = 0;
let _synSortOrder = 'canonical', _synConfMin = 0.30, _synIncludeStub = false;
let _synVerseCache = new Map(), _synRegistryData = null;

function _synBuildRefLabel(bookKey, ch, verse) { return _refLabel(_bookNm(bookKey, SYN_BOOK_JP[bookKey]||bookKey), ch, verse, ' '); }
function _synConfClass(c) { return c>=0.75?'high':c>=0.55?'medium':'low'; }
function _synCleanText(e) { return (e.word||e.normalized||e.text||'').replace(/[.,:;·⸀⸁⸂⸃⌈⌉]/g,'').trim(); }
function _synResolveBooks() {
    const b = new Set();
    SYN_BOOK_GROUPS.forEach(g => { if (_synEnabledGroups.has(g.key)) g.books.forEach(k => b.add(k)); });
    return b;
}

function _synApplyFilters() {
    const books = _synResolveBooks();
    _synIncludeStub = document.getElementById('syn-stub-toggle').checked;
    _synConfMin = parseFloat(document.getElementById('syn-conf-slider').value) / 100;
    _synFiltered = _synAllHits.filter(h =>
        h.confidence >= _synConfMin && (_synIncludeStub || h.status === 'active') && books.has(h.bookKey)
    );
    _synFiltered = _synSortHits(_synFiltered, _synSortOrder);
    _synDisplayed = 0;
    _synRenderResults(true);
}
function _synSortHits(hits, order) {
    if (order === 'confidence_desc') return [...hits].sort((a,b) => b.confidence - a.confidence);
    if (order === 'book_frequency') {
        const freq = {};
        hits.forEach(h => { freq[h.bookKey] = (freq[h.bookKey]||0) + 1; });
        return [...hits].sort((a,b) => (freq[b.bookKey]-freq[a.bookKey]) || (a.sortKey-b.sortKey));
    }
    return [...hits].sort((a,b) => a.sortKey - b.sortKey);
}
function _synSetSort(order, btn) {
    _synSortOrder = order;
    document.querySelectorAll('#syntax-panel .sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    _synApplyFilters();
}
function _synOnConfSlider(el) {
    document.getElementById('syn-conf-value-label').textContent = `${el.value}%`;
    _synApplyFilters();
}
function _synToggleGroup(key) {
    if (_synEnabledGroups.has(key)) { if (_synEnabledGroups.size <= 1) return; _synEnabledGroups.delete(key); }
    else _synEnabledGroups.add(key);
    document.querySelectorAll('#syn-book-chips .filter-chip-toggle').forEach(c => {
        const on = _synEnabledGroups.has(c.dataset.group);
        c.classList.toggle('on', on);
        c.classList.toggle('off', !on);
        const dot = c.querySelector('.filter-chip-dot');
        if (dot) renderIcon(dot, on ? 'check' : null);
    });
    _synApplyFilters();
}

function _synRenderResults(reset) {
    const list = document.getElementById('syn-results-list');
    const status = document.getElementById('syn-status');
    const more = document.getElementById('syn-load-more');
    if (reset) { list.innerHTML = ''; _synDisplayed = 0; }
    if (_synFiltered.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">ζητεῖτε</div>${_tf('search.syn.noResults','結果が見つかりません')}<br>${_tf('search.syn.noResultsHint','フィルタ条件を変更してください')}</div>`;
        more.style.display = 'none';
        status.textContent = _tp('search.count.hits','{n} 件',0);
        _synSetCount(0);
        return;
    }
    const page = _synFiltered.slice(_synDisplayed, _synDisplayed + SYN_PAGE_SIZE);
    const hasMore = _synDisplayed + SYN_PAGE_SIZE < _synFiltered.length;
    if (reset && _synSortOrder === 'canonical') _synRenderByBook(list, page);
    else page.forEach(h => list.appendChild(_synBuildCard(h)));
    _synDisplayed += page.length;
    status.textContent = _tf('search.syn.shownOf','{total} 件中 {n} 件表示',{total:_synFiltered.length,n:_synDisplayed});
    more.style.display = hasMore ? 'flex' : 'none';
    _synSetCount(_synFiltered.length);
}
function _synRenderByBook(container, page) {
    let curBook = null;
    for (const hit of page) {
        if (curBook !== hit.bookKey) {
            curBook = hit.bookKey;
            const cnt = page.filter(x => x.bookKey === curBook).length;
            const h = document.createElement('div');
            h.className = 'book-heading';
            h.innerHTML = `<span class="book-heading-name">${_escH(_bookNm(curBook, SYN_BOOK_JP[curBook]||curBook))}</span><span class="book-heading-count">${cnt}</span>`;
            container.appendChild(h);
        }
        container.appendChild(_synBuildCard(hit));
    }
}
function _synLoadMore() {
    const page = _synFiltered.slice(_synDisplayed, _synDisplayed + SYN_PAGE_SIZE);
    const list = document.getElementById('syn-results-list');
    page.forEach(h => list.appendChild(_synBuildCard(h)));
    _synDisplayed += page.length;
    document.getElementById('syn-load-more').style.display = _synDisplayed < _synFiltered.length ? 'flex' : 'none';
    document.getElementById('syn-status').textContent = _tf('search.syn.shownOf','{total} 件中 {n} 件表示',{total:_synFiltered.length,n:_synDisplayed});
}
function _synSetCount(n) {
    const el = document.getElementById('syn-count');
    el.textContent = _tp('search.count.hits','{n} 件',n); el.style.display = n > 0 ? 'inline-block' : 'none';
}

function _synBuildCard(hit) {
    const card = document.createElement('div');
    card.className = 'app-card';
    // ビルドスクリプトは tokenIdx ではなく globalIdx を出力する
    Object.assign(card.dataset, { bookKey:hit.bookKey, chapter:hit.chapter, verse:hit.verse, globalIdx:hit.globalIdx, word:hit.word });
    const ref = _synBuildRefLabel(hit.bookKey, hit.chapter, hit.verse);
    const pct = Math.round(hit.confidence * 100);
    const cls = _synConfClass(hit.confidence);
    const ctxId = `syn-ctx-${hit.bookKey}-${hit.chapter}-${hit.verse}-${hit.globalIdx}`;
    card.innerHTML = `
        <div class="app-card-head" onclick="_synToggleCard(this.parentElement)">
            <span class="app-card-ref">${_escH(ref)}</span>
            <span class="app-card-word">${_escH(hit.word)}</span>
            <span class="app-card-meta"><span class="result-conf ${cls}">${pct}%</span></span>

            <div class="ctx-loading" id="${_escH(ctxId)}">${_tf('search.syn.expanding','展開中…')}</div>
        </div>`;

}
function _synToggleCard(card) {
    const wasOpen = card.classList.contains('open');

async function _synLoadContext(card) {
    const { bookKey, chapter, verse, globalIdx, word } = card.dataset;
    const ctxId = `syn-ctx-${bookKey}-${chapter}-${verse}-${globalIdx}`;
    const ctxEl = document.getElementById(ctxId);
    if (!ctxEl) return;
    const cacheKey = `${bookKey}-${chapter}`;
    let tokens = _synVerseCache.get(cacheKey);
    if (!tokens) {
        const data = await BookMaster.fetchJSON(await BookMaster.pathFor(bookKey, parseInt(chapter)));
        tokens = Array.isArray(data) ? data : [];
        _synVerseCache.set(cacheKey, tokens);
    }
    // ref 形式: "MAT 1:1!1" — chapter/verse フィールドで絞り込む
    const vt = tokens.filter(t => String(t.chapter) === String(chapter) && String(t.verse) === String(verse));
    let html = '';
    if (vt.length > 0) {
        html = `<div class="context-snippet">${vt.map(t => {
            const w = _synCleanText(t);
            const isHit = String(t.globalIdx) === String(globalIdx);
            return `<span class="snippet-token${isHit?' hit':''}">${_escH(w)}</span>`;
        }).join('')}</div>`;
    } else {
        html = `<div class="result-ja result-ja-empty">${_tf('search.syn.noVerse','（節データ未取得）')}</div>`;
    }
    ctxEl.outerHTML = html;
}

/* URL パラメータから検索語を引き継ぐ */
(function initFromUrl() {
    const p = new URLSearchParams(location.search);
    const _w1 = p.get('word1') || '';
    const _w2 = p.get('word2') || '';
    const query = p.get('lemma') || p.get('word')
        || (_w1 && _w2 ? `${_w1} ${_w2}` : _w1)
        || '';
    const syntaxId = p.get('syntax_id') || '';
    if (!query && !syntaxId) return;

    // 英語フルワード → 単文字コードへの逆引きマップ
    // index.html は tense="present" 等のフルワードで渡す
    const WORD_TO_CODE = {
        tense: { present:'P', imperfect:'I', future:'F', aorist:'A', perfect:'X', pluperfect:'Y' },
        voice: { active:'A', middle:'M', passive:'P', 'middle deponent':'M', 'middle or passive':'P' },
        mood:  { indicative:'I', subjunctive:'S', optative:'O', imperative:'M', infinitive:'N', participle:'P' },
        case:  { nominative:'N', genitive:'G', dative:'D', accusative:'A', vocative:'V' },
        num:   { singular:'S', plural:'P' },
        gen:   { masculine:'M', feminine:'F', neuter:'N' },
    };
    const toCode = (slot, val) => {
        if (!val) return '';
        const map = WORD_TO_CODE[slot];
        return map ? (map[val.toLowerCase()] || val.replace(/-+$/, '')) : val.replace(/-+$/, '');
    };
    // カンマ区切り（複数選択）・単一値のどちらも受け付ける。
    // index.html からのリンクは単一フルワードのみを渡すため、その場合は従来通り1件になる。
    const splitVals = (raw) => (raw || '').split(',').map(s => s.trim()).filter(Boolean);

    const morphFromUrl = {
        pos:   splitVals(p.get('pos')).map(v => v.replace(/-+$/, '')),
        tense: splitVals(p.get('tense')).map(v => toCode('tense', v)),
        mood:  splitVals(p.get('mood')).map(v => toCode('mood', v)),
        voice: splitVals(p.get('voice')).map(v => toCode('voice', v)),
        case:  splitVals(p.get('case')).map(v => toCode('case', v)),
        num:   splitVals(p.get('number')).map(v => toCode('num', v)),
        gen:   splitVals(p.get('gender')).map(v => toCode('gen', v)),
    };
    /* [DIAG] 受信 URL パラメータ */
    console.info('[initFromUrl] 受信パラメータ:', {
        lemma:  p.get('lemma'), word:   p.get('word'), layers: p.get('layers'),
        pos:    p.get('pos'),   tense:  p.get('tense'),  voice:  p.get('voice'),
        mood:   p.get('mood'),  number: p.get('number'), case:   p.get('case'),
        gender: p.get('gender'), person: '(URLには付与されない)',
    });
    let hasMorph = false;
    for (const [slot, vals] of Object.entries(morphFromUrl)) {
        vals.forEach(v => { if (v) { _morphSel[slot].add(v); hasMorph = true; } });
    }
    /* [DIAG] _morphSel への変換結果 */
    console.info('[initFromUrl] _morphSel (コード変換後):', {
        pos:   [..._morphSel.pos],   tense: [..._morphSel.tense],
        voice: [..._morphSel.voice], mood:  [..._morphSel.mood],
        num:   [..._morphSel.num],   case:  [..._morphSel.case],  gen: [..._morphSel.gen],
    });
    if (hasMorph) {
        _initMorphChips();          // チップを選択状態で再描画
        _updateMorphSubSections();
        _updateMorphClearBtn();
        // morphレイヤーの有効化は layers= パラメータの明示指定にのみ従う。
        // morph パラメータ（pos/tense/mood等）が URL にあってもレイヤーを
        // 自動ONにしない。チップは選択状態で表示されるが、検索には適用されない。
        // （layersParam に 'morph' が含まれる場合は後段の処理で ONになる）
        _syncLayerUI('morph');
    }

    if (syntaxId) _synInit(syntaxId);

    if (!query) return;
    const inp = document.getElementById('unified-search-input');
    if (inp) inp.value = query;
    _updateSearchControls();

    // layers: URL指定時のみ _layers をURL値で上書き（未指定時は既存挙動を維持）
    const layersParam = p.get('layers');
    if (layersParam) {
        const activeFromUrl = new Set(layersParam.split(',').filter(Boolean));
        ['lemma','phrase','prox','morph'].forEach(k => {
            _layers[k] = activeFromUrl.has(k);
            _syncLayerUI(k);
        });
    }

    // dist: URL指定時のみ既存スライダー更新処理(setProxPreset)を再利用して反映
    const distParam = p.get('dist');
    if (distParam) {
        const d = parseInt(distParam, 10);
        if (!isNaN(d)) setProxPreset(d);
    }

    unifiedSearch({awaitLxx:true});
})();

/* ============================================================
   Abbott-Smith 辞書モーダル
   ============================================================ */
let _abbottDict = null;
let _abbottLoading = false;

async function _loadAbbott() {
    if (_abbottDict) return;
    if (_abbottLoading) return;
    _abbottLoading = true;
    try {
        const res = await fetch('../assets/data/abbott-smith.tsv');
        const text = await res.text();
        _abbottDict = {};
        text.split('\n').forEach((line, i) => {
            if (i === 0) return; // header
            const cols = line.split('\t');
            if (cols.length < 5) return;
            const strong = cols[0].trim();
            // 列: 0=strong 1=lemma 2=description_en 3=description_literal_ja 4=description_ja。JA は従来どおり cols[4]、EN は英語原文 cols[2]
            _abbottDict[strong] = { lemma: cols[1]?.trim() || '', description: cols[4]?.trim() || '', descriptionEn: cols[2]?.trim() || '' };
        });
    } catch(e) {
        console.warn('Abbott-Smith load error', e);
    }
}

// result-query-label クリックでモーダル表示
document.addEventListener('DOMContentLoaded', () => {
    /* 見出しは、IGSD final のギリシャ語単語クエリでは語のページを開く（開かない点線要素を作らない）。それ以外は従来どおり辞書モーダル。 */
    document.getElementById('result-query-label').addEventListener('click', () => {

        else _asOpen();

function _asOpen() {
    const query = _lastQuery.trim();
    if (!query) return;

    // Strong番号で検索中の場合
    let strongKey = null;
    if (/^[Gg]?\d+$/.test(query)) {
        strongKey = String(parseInt(query.replace(/\D/g, ''), 10));
    } else {
        // lemmaから対応するstrongを探す
        const found = ALL_TOKENS.find(t =>
            t.lemma === query ||
            normalizeGreek(t.lemma) === normalizeGreek(query)
        );
        if (found && found.strong) {
            strongKey = String(parseInt(String(found.strong).replace(/\D/g, ''), 10));
        }
    }

    _loadAbbott().then(() => {
        const entry = _abbottDict && strongKey ? _abbottDict[strongKey] : null;
        const lemmaEl = document.getElementById('as-modal-lemma');
        const strongEl = document.getElementById('as-modal-strong');
        const bodyEl = document.getElementById('as-modal-body');

        lemmaEl.textContent = (entry && entry.lemma) ? entry.lemma : query;
        strongEl.textContent = strongKey ? `G${strongKey}` : '';
        const _body = entry ? (_enMode() ? (entry.descriptionEn || '') : entry.description) : '';
        if (_body) {
            bodyEl.innerHTML = _escH(_body).replace(/\n/g, '<br>');
        } else {
            bodyEl.innerHTML = '<span class="as-empty">' + _escH(_tf('search.dict.notFound','この語のAbbott-Smith辞書データが見つかりませんでした。')) + '</span>';
        }
        const old = document.getElementById('as-igsd-link');
        if (old) old.remove();
        document.getElementById('as-backdrop').classList.add('open');
        if (strongKey) _asAddIgsdLink(bodyEl, 'G' + strongKey, entry && entry.lemma ? entry.lemma : query);
    });
}
/* Abbott-Smith ポップアップ末尾に、IGSD final の語だけ「語のページを見る ›」を置く。対象外の語では何も出さない。 */
function _asAddIgsdLink(bodyEl, strong, lemma) {
    _igsdLoadIndex().then(idx => {
        if (!idx) return;
        const e = idx.get(strong);
        if (!e || !_igsdNorm(lemma) || _igsdNorm(e.lemma) !== _igsdNorm(lemma)) return;
        if (!document.getElementById('as-backdrop').classList.contains('open') || document.getElementById('as-igsd-link')) return;
        const idxs = searchByLemma(e.lemma);
        if (!idxs || idxs.length === 0) return;
        const group = { lemma: e.lemma, strong: e.strong, hits: idxs.map(gi => ({ anchorIdx: gi })) };
        const btn = document.createElement('button');
        btn.type = 'button'; btn.id = 'as-igsd-link'; btn.className = 'as-igsd-link';
        btn.textContent = _tf('search.dict.openWord','語のページを見る ›');
        btn.addEventListener('click', () => {
            _asClose();
            if (_igsdCurrentClose) _igsdCurrentClose();
            const q = _lastQuery;
            const ja = document.getElementById('lemma-groups').style.display === 'block';
            const words = q.trim().split(/\s+/);
            _igsdOpenPage(e, group, [group], q, null, words, !ja);
        });
        bodyEl.parentNode.insertBefore(btn, bodyEl.nextSibling);
    });
}

function _asClose() {
    document.getElementById('as-backdrop').classList.remove('open');
}


/* ============================================================
   Discovery Theme Resolver (UX-10-1B)
   純粋関数・副作用なし・DOM操作なし・console出力なし
   同じ date を渡すと常に同じ 4件を返す（決定的アルゴリズム）
   ============================================================ */

// discovery-themes.json のミラー（ランタイム用インライン定義）
// JSONファイルを変更した場合はこの定数も同期させること
const _DISCOVERY_THEMES = {
    core: ['愛','祈り','信仰','希望','救い','平安','恵み','喜び'],
    discovery: ['知恵','契約','義','慰め','証し','栄光','弟子','教会','永遠の命','悔い改め'],
    seasonal: {
        advent:    ['希望','光','約束','待ち望む'],
        lent:      ['十字架','悔い改め','従う','赦し'],
        easter:    ['復活','いのち','喜び','勝利'],
        pentecost: ['聖霊','教会','証し','賜物'],
        ordinary:  ['感謝','導き','忍耐','賛美'],
    },
};

// UTC Easter Sunday — Meeus/Jones/Butcher algorithm（外部ライブラリ不使用）
function _easterUTC(year) {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31) - 1; // 0-indexed
    const day   = ((h + l - 7 * m + 114) % 31) + 1;
    return Date.UTC(year, month, day);
}

// Advent 開始: クリスマス(12/25)から4週前の日曜
function _adventStartUTC(year) {
    const dow = new Date(Date.UTC(year, 11, 25)).getUTCDay(); // 0=日曜
    return Date.UTC(year, 11, 25) - (dow + 21) * 86400000;
}

// 教会暦シーズン判定（UTC 統一。_dayOfYear と同じ基準）
function getCurrentSeason(date = new Date()) {
    const y      = date.getUTCFullYear();
    const ts     = Date.UTC(y, date.getUTCMonth(), date.getUTCDate());
    const D      = 86400000; // ms/day
    const easter = _easterUTC(y);
    // Lent: 灰の水曜（復活-46日）〜 聖土曜日（復活-1日）
    if (ts >= easter - 46 * D && ts < easter)           return 'lent';
    // Easter: 復活日曜〜 ペンテコステ前日（復活+48日）
    if (ts >= easter           && ts < easter + 49 * D) return 'easter';
    // Pentecost: ペンテコステ日曜〜 三位一体後1週（復活+62日）計14日
    if (ts >= easter + 49 * D && ts < easter + 63 * D)  return 'pentecost';
    // Advent: 第1主日〜 12/24
    if (ts >= _adventStartUTC(y) && ts <= Date.UTC(y, 11, 24)) return 'advent';
    return 'ordinary';
}

// UTC 日付から year-day（0始まり）を返す決定的ヘルパー
function _dayOfYear(date) {
    const y   = date.getUTCFullYear();
    const jan1 = Date.UTC(y, 0, 1);
    const today = Date.UTC(y, date.getUTCMonth(), date.getUTCDate());
    return Math.floor((today - jan1) / 86400000); // 0–364/365
}

/**
 * getDiscoveryThemes(date?)
 * 「今日の 4 テーマ」を返す純粋関数。
 * 返却順: [seasonal 1件, core 2件, discovery 1件]
 * 同じ date → 同じ配列（決定的）。Math.random() 不使用。
 * @param {Date} date - 基準日（省略時: 今日）
 * @returns {string[]} length === 4 の文字列配列
 */
function getDiscoveryThemes(date = new Date()) {
    const data   = _DISCOVERY_THEMES;
    const season = getCurrentSeason(date);
    const day    = _dayOfYear(date);
    const picked = [];

    // ① seasonal: 1件（シーズンプールを day で決定的に選択）
    const sPool = data.seasonal[season] || data.seasonal.ordinary;
    picked.push(sPool[day % sPool.length]);

    // ② core: 2件（day+offset でスキャン。重複は次候補へ）
    const cPool = data.core;
    for (let i = 0; picked.length < 3; i++) {
        const c = cPool[(day + i) % cPool.length];
        if (!picked.includes(c)) picked.push(c);
        if (i >= cPool.length) break; // 安全ガード（完全重複時）
    }

    // ③ discovery: 1件（day+offset でスキャン。重複は次候補へ）
    const dPool = data.discovery;
    for (let i = 0; picked.length < 4; i++) {
        const c = dPool[(day + i) % dPool.length];
        if (!picked.includes(c)) picked.push(c);
        if (i >= dPool.length) break; // 安全ガード
    }

    return picked;
}

/* 辞書（assets/i18n/<lang>.json）は非同期に届く。init() が先に描いた動的 UI を、届いた時点で作り直す。
   JA・辞書の無い言語（ES）では T() が日本語を返すので、再描画しても見た目は変わらない。 */
if (window.I18N && I18N.ready) {
    I18N.ready.then(() => {
        try {
            if (!_sLoc()) return;                         // 検索画面の辞書が無い言語は再描画不要（日本語のまま）
            _initMorphChips();                            // 文法フィルタの選択肢・補足（選択状態 _morphSel は保たれる）
            _renderHistory();
            _renderEmptyStateHistory();
            const _pec = document.getElementById('pattern-explore-chips');
            if (_pec && _pec.children.length) _renderPatternExplore();   // 既に描かれているときだけ作り直す（新たに出さない）
            if (typeof _updateSearchControls === 'function') _updateSearchControls();
            onProxSlider(currentDist);
        } catch (e) { console.warn('[search-i18n] re-render failed', e); }
    });
}

/* MN: 聖書リーダーへ戻る
   同一 origin から遷移してきた場合は history.back()、
   直接アクセス等の場合は '/' へフォールバックする。 */
function _searchGoBack() {
    const sameOrigin = document.referrer &&
        (new URL(document.referrer, window.location.href)).origin === window.location.origin;
    if (sameOrigin && history.length > 1) {
        history.back();
    } else {
        window.location.href = '/';
    }
}
