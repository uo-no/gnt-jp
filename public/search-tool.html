/* ============================================================
   ★ UNIFIED SEARCH ENGINE ★
   Parallel execution → globalIdx-based merge → unified render
   ============================================================ */

/* Global result store (keyed by globalIdx) */
let _allMergedResults = new Map();   // globalIdx → {tok, hitTypes: Set, hit?: {}}
let _proxCoocMap      = new Map();
let _lastQuery        = '';
let _activeLayerSet   = {};

async function unifiedSearch(opts){
    /* opts.awaitLxx: ディープリンク初期化用。LXX の読み込み・索引化の完了まで待ってから検索を確定させる（QA-03）。
       UI 操作による検索（引数なし／イベント）は従来どおり。 */
    const _awaitLxx=!!(opts&&opts.awaitLxx===true);
    // 単語数に応じて検索条件を自動表示・適用する。
    const query=document.getElementById('unified-search-input').value.trim();
    _updateSearchControls();
    if(!query){document.getElementById('unified-search-input').focus();return;}

    // Check at least one non-morph layer is active
    if(!_layers.lemma&&!_layers.prox&&query.split(/\s+/).filter(Boolean).length<2&&detectQueryType(query)!=='japanese'){
        _showEmpty(_tf('search.empty.layerTitle','レイヤーを選択してください'),_tf('search.empty.layerDesc','検索条件を選択してください'));
        return;
    }

    _activeLayerSet={..._layers};
    isSearching=true;
    // Close mobile panel when search fires
    if(window.innerWidth<=680) _closeMobilePanel();

    /* 検索実行ゲート:
       IDX.ready（NT索引化完了）になるまで検索を実行しない。
       NT完了後は LXX バックグラウンド構築中でも NT 範囲で検索できる。
       IDX.l3Ready（全書物+日本語索引完了）後は NT+LXX を全文検索できる。 */
    if(!IDX.ready){
        _showLoading(_tf('search.status.loadingNt','新約聖書の検索データを読み込み中です…'));
    } else {
        _showLoading();
    }
    await _ensureFullIndex();
    if(_awaitLxx&&!IDX.l3Ready){
        /* 暫定の NT のみ件数を完成形として見せない：読み込み中表示のまま LXX を待つ */
        _showLoading(_tf('search.status.loadingNtLxx','新約聖書と七十人訳の検索データを読み込み中です…'));
        await Promise.race([_lxxDonePromise,new Promise(r=>setTimeout(r,120000))]);
        if(!IDX.l3Ready)console.warn('[search-index] LXX wait timed out; showing available results');
    }
    if(!window.lemmaIndex){
        _buildAndExposeLemmaIndex();
        _buildAndExposeMorphIndex();
    }

    // Read morph filter value from checkbox state
    const morphFilter=_layers.morph?_getMorphFilterPattern():null;

    // Parse words for phrase / proximity
    const words=query.trim().split(/\s+/).filter(Boolean);
    const word1=words[0];
    const word2=words[1]||null;

    /* Concept 展開（Phase 4-1）: 検索開始前に1回だけ判定する。
       登録語なら Term[]、未登録語なら null（＝以降は完全に従来どおり） */
    const _conceptEnOk = words.length===1;   /* 英語の別名は単語1語の検索でのみ発火（複数語は従来どおりフレーズ／近接） */
    const conceptTerms = resolveConcept(word1,_conceptEnOk);
    /* Concept Insight（Phase 4-3・表示のみ）: 発火時だけカード用の概念を保持 */
    const _conceptMatch = conceptTerms ? _matchConcept(word1,_conceptEnOk) : null;
    _activeInsightConcept = _conceptMatch ? _conceptMatch.concept : null;
    _conceptViaEn = !!(_conceptMatch && _conceptMatch.via!=='ja');

    // --- Merged result map: globalIdx → {tok, hitTypes, proxHit?} ---
    const merged=new Map();
    let proxCoocMap=new Map();

    // --- Execute layers in parallel ---
    performance.mark('search-start');
    const tasks=[];

    // 単語検索は従来どおり。日本語は検索レイヤー未選択でも通常検索できるようにする。
    const singleJapaneseQuery = words.length===1 && detectQueryType(word1)==='japanese';
    if((_layers.lemma&&words.length===1)||(singleJapaneseQuery&&!_layers.prox)){
        tasks.push((async()=>{
            const qtype=detectQueryType(word1);
            let idxs;
            if(_conceptViaEn){
                /* 英語の別名で概念が発火: 基底は概念の日本語 label を日本語経路で引く（UI 言語によらず日本語 UI の label 検索と同じ展開結果にする。#33） */
                await _ensureFullIndex();
                idxs=[..._searchJapaneseCore(ALL_TOKENS,_conceptMatch.concept.label)];
            }else if(qtype==='japanese'){
                await _ensureFullIndex();
                const s=(!_enMode()&&_isLatinWord(word1))?_enGlossSet(word1):searchJapanese(ALL_TOKENS,word1); // 英字単語は UI 言語によらず英語グロスで引く（#31）
                idxs=[...s];
            }else if(qtype==='strong'){
                await _ensureFullIndex();
                idxs=[...searchStrong(ALL_TOKENS,word1)]; // Strong 番号は strong 索引で引く（searchByLemma はレンマ専用で常に空だった）
            }else{
                idxs=searchByLemma(word1);
            }
            for(const gi of idxs){
                const tok=ALL_TOKENS[gi];if(!tok)continue;
                if(!merged.has(gi))merged.set(gi,{tok,hitTypes:new Set(),proxHit:null});
                merged.get(gi).hitTypes.add('lemma');
            }
            /* Concept 展開（Phase 4-1）: 概念に一致した場合のみ、Term 群を
               既存 resolveTerm で解決し従来結果へ和集合で追加する。
               （コピー実装禁止 — 解決は必ず resolveTerm を通す。
                 未登録語は conceptTerms=null でこのブロック自体が走らない） */
            if(conceptTerms){
                await _ensureFullIndex();
                for(const term of conceptTerms){
                    for(const gi of resolveTerm(ALL_TOKENS,term)){
                        const tok=ALL_TOKENS[gi];if(!tok)continue;
                        if(!merged.has(gi))merged.set(gi,{tok,hitTypes:new Set(),proxHit:null});
                        merged.get(gi).hitTypes.add('lemma');
                    }
                }
            }
        })());
    }

    // 複数語入力のみ連続フレーズ検索を自動実行。単語検索にフレーズ種別を誤付与しない。
    if(words.length>=2){
        tasks.push((async()=>{
            const isJp=detectQueryType(word1)==='japanese'&&(_enMode()||!_isLatinWord(word1)); // 英語フレーズ検索は EN UI のみ（現行どおり）
            const idxs=isJp?searchPhraseJapanese(words):searchPhrase(words);
            for(const gi of idxs){
                const tok=ALL_TOKENS[gi];if(!tok)continue;
                if(!merged.has(gi))merged.set(gi,{tok,hitTypes:new Set(),proxHit:null});
                merged.get(gi).hitTypes.add('phrase');
                // mark span tokens
                for(let k=0;k<words.length;k++){
                    const gk=gi+k;
                    if(gk!==gi){
                        if(!merged.has(gk)){const t2=ALL_TOKENS[gk];if(t2)merged.set(gk,{tok:t2,hitTypes:new Set(),proxHit:null});}
                        if(merged.has(gk))merged.get(gk).hitTypes.add('phrase');
                    }
                }
            }
        })());
    }

    if(_layers.prox){
        tasks.push((async()=>{
            const{coocMap,hits}=await runProximitySearch({
                word1,word2,distance:currentDist,scope:currentScope,ref:'',
            });
            proxCoocMap=coocMap;
            for(const h of hits){
                const gi=h.anchorIdx;
                const tok=ALL_TOKENS[gi];if(!tok)continue;
                if(!merged.has(gi))merged.set(gi,{tok,hitTypes:new Set(),proxHit:null});
                const entry=merged.get(gi);
                entry.hitTypes.add('prox');
                entry.proxHit=h;   // keep full hit for rendering
            }
        })());
    }

    await Promise.all(tasks);
    _logPerfMeasure('search', `layers=${Object.keys(_activeLayerSet).filter(k=>_activeLayerSet[k]).join(',')}, ${merged.size.toLocaleString()} hits`);

    // --- Morph post-filter ---
    if(morphFilter&&merged.size>0){
        const _beforeMorph=merged.size;
        /* [DIAG] フィルター適用前: 最初のヒットの morph を表示 */
        const _firstEntry = merged.values().next().value;
        const _firstMorph = _firstEntry?.tok?.morph ?? '(morph なし)';
        console.info('[morphFilter] 適用前: hits='+_beforeMorph+', 最初のヒット morph='+_firstMorph, {
            filterPattern: {
                pos:   morphFilter.pos   ? [...morphFilter.pos]   : null,
                tense: morphFilter.tense ? [...morphFilter.tense] : null,
                voice: morphFilter.voice ? [...morphFilter.voice] : null,
                mood:  morphFilter.mood  ? [...morphFilter.mood]  : null,
                num:   morphFilter.num   ? [...morphFilter.num]   : null,
                case:  morphFilter.case  ? [...morphFilter.case]  : null,
                gen:   morphFilter.gen   ? [...morphFilter.gen]   : null,
            }
        });
        /* [DIAG] 最初の1件を詳細トレース + V-AAI-* トークンを優先して探す */
        {
            // まず V-AAI-* に一致するトークンを探す（なければ先頭のトークン）
            let _traceEntry = _firstEntry;
            for (const [,e] of merged) {
                if (e.tok && /^V-[0-9]?AA/.test(e.tok.morph || '')) { _traceEntry = e; break; }
            }
            const _traceMorph = _traceEntry?.tok?.morph;
            if (_traceMorph) {
                const _tv = _morphMatchesPatternVerbose(_traceMorph, morphFilter);
                console.info(
                    '[morphFilter][詳細トレース] morphTag=' + _traceMorph + '\n' + _tv.log
                );
            }
        }
        /* [DIAG] 最初の除外トークンで不一致フィールドを特定 */
        let _firstReject = null;
        let _firstRejectCount = 0;
        for(const[gi,entry]of merged){
            const tok=entry.tok;
            const _match = tok && tok.morph && _morphMatchesPattern(tok.morph, morphFilter, tok.corpusId);
            if(!_match){
                _firstRejectCount++;
                if(!_firstReject && tok && tok.morph && tok.corpusId!=='LXX') {
                    _firstReject = _morphRejectReason(tok.morph, morphFilter);
                }
                merged.delete(gi);
            } else {
                entry.hitTypes.add('morph');
            }
        }
        if(_firstReject){
            console.warn('[morphFilter] 最初の不一致: フィールド='+_firstReject.field,
                '| トークン値='+_firstReject.tokenVal,
                '| フィルター値='+JSON.stringify(_firstReject.filterVals),
                '| morphTag='+_firstReject.morphTag);
        }
        if(merged.size===0&&_beforeMorph>0){
            console.warn('[morphFilter] 全件削除: before='+_beforeMorph+' after=0 (除外件数='+_firstRejectCount+')',
                {morphFilter, activePattern: JSON.stringify({
                    pos:  morphFilter.pos  ? [...morphFilter.pos]  : null,
                    tense:morphFilter.tense? [...morphFilter.tense]: null,
                    mood: morphFilter.mood ? [...morphFilter.mood] : null,
                    voice:morphFilter.voice? [...morphFilter.voice]: null,
                    case: morphFilter.case ? [...morphFilter.case] : null,
                    num:  morphFilter.num  ? [...morphFilter.num]  : null,
                    gen:  morphFilter.gen  ? [...morphFilter.gen]  : null,
                })});
        }
    }

    _allMergedResults=merged;
    _proxCoocMap=proxCoocMap;

    /* ── SQS: クエリが変わったらフィルタをクリア ── */
    if (query !== _lastQuery) _sqState.filters = [];

    /* ── SQS: パターンフィルタを verse-level AND で適用 ── */
    if (_sqState.filters.length > 0) {
        for (const f of _sqState.filters) {
            if (f.type !== 'pattern' || !f.query) continue;
            const fRes = await runTermProximitySearch(
                f.query.termA, f.query.termB, { scope: f.query.scope || 'verse' });
            const fKeys = new Set(fRes.hits.map(h => {
                const t = ALL_TOKENS[h.anchorIdx]; return t ? _verseKeyOf(t) : null;
            }).filter(Boolean));
            for (const [gi, e] of [...merged.entries()]) {
                if (!fKeys.has(_verseKeyOf(e.tok))) merged.delete(gi);
            }
        }
        _allMergedResults = merged;
    }
    _renderFilterBar();

    isSearching=false;
    _addHistory(query,_activeLayerSet);
    _lastQuery=query;
    performance.mark('render-start');
    /* SQS: フィルタラベルを × で連結してタイトルに反映 */
    const _sqsLabels = _sqState.filters.map(f => f.label);
    const _sqsQuery = _sqsLabels.length > 0 ? `${query} × ${_sqsLabels.join(' × ')}` : query;
    _renderUnifiedResults(_sqsQuery,words,word2);
    _logPerfMeasure('render', `${_allMergedResults.size.toLocaleString()} hits merged`);
    /* この時点で IDX.ready は必ず true（上のゲートで保証済み）。
       「索引未完成のまま検索→後から件数が増える」事象は構造的に発生しない。 */
    syncURL();
}

/* allow-list（このページの実際の検索条件のみ）からゼロ構築する。
   location.searchをベースにしない＝他ページのパラメータ混入を防ぐ。 */
function syncURL() {
    const p = new URLSearchParams();
    p.set('tool', 'search');

    const query = (_lastQuery || '').trim();
    if (query) p.set('lemma', query);

    const slotToParam = { pos:'pos', tense:'tense', mood:'mood', voice:'voice', case:'case', num:'number', gen:'gender' };
    Object.entries(slotToParam).forEach(([slot, paramName]) => {
        const set = _morphSel[slot];
        if (set && set.size > 0) p.set(paramName, Array.from(set).join(','));
    });

    const activeLayers = ['lemma','phrase','prox','morph'].filter(k => _layers[k]);
    if (activeLayers.length) p.set('layers', activeLayers.join(','));
    p.set('dist', String(currentDist));

    history.replaceState(null, '', '?' + p.toString());
}

/* 現在表示中のURLをそのままクリップボードへコピーする（URL生成ロジックは呼ばない）。 */
async function copyShareUrl() {
    const url = location.href;
    try {
        await navigator.clipboard.writeText(url);
        _showShareToast();
    } catch (e) {
        try {
            const ta = document.createElement('textarea');
            ta.value = url;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            _showShareToast();
        } catch (e2) {
            console.warn('copyShareUrl: コピーに失敗しました', e2);
        }
    }
}
function _showShareToast() {
    const t = document.getElementById('share-toast');
    if (!t) return;
    t.textContent = _tf('search.toast.copied','URLをコピーしました');
    t.classList.add('visible');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(() => t.classList.remove('visible'), 2000);
}

/* ============================================================
   Unified result rendering
   ============================================================ */
let _filterWord=null;

function _renderUnifiedResults(query,words,word2){
    _filterWord=null;
    const merged=_allMergedResults;
    const total=merged.size;

    // Pattern explore: 各検索の先頭でリセット（0件 or 次検索で残留しない）
    const _patEx=document.getElementById('pattern-explore-section');
    if(_patEx) _patEx.style.display='none';

    // Corpus breakdown count (corpusId が唯一の判定ソース。book名推測禁止)
    let ntCount=0,lxxCount=0;
    for(const[,{tok}] of merged){ if(tok.corpusId==='LXX') lxxCount++; else ntCount++; }

    /* Concept Insight（Phase 4-3・表示のみ）: 概念発火時のみカードを描く。
       検索件数・順位には一切関与しない */
    _renderConceptInsight(_activeInsightConcept);

    // Header
    document.getElementById('state-empty').style.display='none';
    document.getElementById('state-loading').style.display='none';
    document.getElementById('result-header').classList.add('visible');
    document.getElementById('result-query-label').textContent=query;
    // 件数表示: LXX>0 の場合のみ内訳を追加。NT のみなら従来表示を維持。
    const _countEl=document.getElementById('result-count');
    if(lxxCount>0){
        const _parts=[];
        if(ntCount>0) _parts.push(_tf('search.count.nt','新約聖書 {n}件',{n:ntCount.toLocaleString()}));
        _parts.push(_tf('search.count.lxx','旧約ギリシア語訳（LXX） {n}件',{n:lxxCount.toLocaleString()}));
        _countEl.innerHTML=
            `<span>${_tp('search.count.hits','{n} 件',total,{n:total.toLocaleString()})}</span>`+
            `<span class="result-count-sub result-count-break">${_parts.join(_nonJa()?' / ':' ／ ')}</span>`;
    } else {
        _countEl.textContent=_tp('search.count.hits','{n} 件',total,{n:total.toLocaleString()});
    }
    { const _old=document.getElementById('lxx-note');if(_old)_old.remove();
      const _glossQ=_isLatinWord(query)&&words.length===1&&!_conceptViaEn; /* 英語グロス検索は新約のみ（LXX にグロスなし）— 全 UI 言語で1行注記（#31） */
      if(_glossQ||(_enMode()&&lxxCount>0)){ /* D2: LXX は英語グロス・訳文が無い旨を1箇所だけ注記 */
        const _n=document.createElement('div');_n.id='lxx-note';_n.className='result-count-sub';
        _n.style.cssText='flex-basis:100%;width:100%;margin-top:4px;';
        _n.textContent=_glossQ?(_glossLangFor(query.trim())==='es'?_tf('search.glossNtOnlyEs','スペイン語グロスでの検索は新約聖書のみが対象です（旧約ギリシア語訳（LXX）にはスペイン語グロスがありません）。'):_tf('search.glossNtOnly','英語グロスでの検索は新約聖書のみが対象です（旧約ギリシア語訳（LXX）には英語グロスがありません）。')):_tf('search.lxxNote','');
        document.getElementById('result-header').appendChild(_n);
      } }
    /* Strong 番号検索の件数注記（#53）: Strong 検索のときだけ。件数そのものは変えない */
    { const _oldSn=document.getElementById('strong-note');if(_oldSn)_oldSn.remove();
      if(words.length===1&&detectQueryType(query)==='strong'){
        const _sn=document.createElement('div');_sn.id='strong-note';_sn.className='result-count-sub';
        _sn.style.cssText='flex-basis:100%;width:100%;margin-top:4px;';
        _sn.textContent=_tf('search.strongNote','Strong 番号で数えた件数です。語そのもの（レンマ）の検索とは数え方が違うため、件数が異なることがあります。');
        document.getElementById('result-header').appendChild(_sn);
      } }
    if(!IDX.l3Ready)_noteProvisionalCount(_countEl,query); // LXX 合流前の件数を完成形として見せない（#792 の方針に揃える）

    // Result body
    if(_igsdCurrentClose)_igsdCurrentClose(); // 前の検索で開いた語のページを閉じる（QA-05）
    _igsdGreekOpener=null;
    const _igsdOldEntry=document.getElementById('igsd-entry');if(_igsdOldEntry)_igsdOldEntry.remove();
    document.getElementById('result-body').style.display='';

    // Co-occurrence panel: only when proximity was active
    const grid=document.getElementById('results-grid');
    const hasProx=_activeLayerSet.prox&&_proxCoocMap.size>0;
    grid.classList.toggle('no-cooc',!hasProx);
    if(hasProx)_renderCooccurrence(_proxCoocMap,'rank-list',10);
    /* 近接検索の説明（#52）: 近接パネルの見出し・凡例・件/節の1行。通常検索には出さない */
    { const _ct=document.querySelector('.cooc-title');
      if(_ct)_ct.textContent=hasProx?_tf('search.cooc.titleProx','ヒットした節に出る他の語'):_tf('search.cooc.title','よく一緒に出る語');
      const _oldSum=document.getElementById('prox-summary');if(_oldSum)_oldSum.remove();
      const _lg=document.getElementById('prox-legend');
      if(_lg){
        if(hasProx){
          _lg.innerHTML='<div><span class="ht-badge phrase">'+_escH(_tf('search.badge.phrase','フレーズ'))+'</span> '+_escH(_tf('search.prox.legendPhrase','2語が隣り合っている'))+'</div>'+
            '<div><span class="ht-badge prox">'+_escH(_tf('search.badge.prox','近接'))+'</span> '+_escH(_tf('search.prox.legendProx','2語が設定距離（±{n}語）以内にある',{n:currentDist}))+'</div>';
          _lg.style.display='';
        } else { _lg.innerHTML='';_lg.style.display='none'; }
      }
      if(hasProx&&total>0){
        const _vs=new Set();
        for(const[,{tok}] of merged)_vs.add((tok.bookKey||'?')+':'+(tok.ch??'?')+':'+(tok.verse??'?'));
        const _sm=document.createElement('div');_sm.id='prox-summary';_sm.className='result-count-sub';
        _sm.style.cssText='flex-basis:100%;width:100%;margin-top:4px;';
        _sm.textContent=_tp('search.prox.summary','{n} 件の一致が {m} 節にあります',total,{n:total.toLocaleString(),m:_vs.size.toLocaleString()});
        document.getElementById('result-header').appendChild(_sm);
      }
    }

    // Hits
    if(total===0){
        document.getElementById('hits-list').innerHTML=`
            <div class="zero-hits">
                <div class="zero-hits-icon">∅</div>
                <div class="zero-hits-msg">${_tf('search.empty.noMatch','「{q}」に該当する箇所がありませんでした',{q:_escH(query)})}</div>
                <div class="did-you-mean" id="did-you-mean" hidden></div>
                <div class="zero-recovery">
                    <div class="empty-section-label">${_tf('search.empty.try','試してみる')}</div>
                    <div style="font-size:0.78rem;color:var(--text-sub);margin-top:4px;">${_tf('search.empty.tryDesc','次のテーマから検索できます。')}</div>
                    <div class="empty-examples">
                        ${[['love','愛'],['prayer','祈り'],['salvation','救い'],['christ','キリスト']].map(([k,ja])=>{const l=_tf('search.empty.chip.'+k,ja);return `<span class="ex-chip" onclick="_exampleSearch(${_escH(JSON.stringify(l))})">${_escH(l)}</span>`;}).join('\n                        ')}
                    </div>
                    <div class="zero-hint">${_tf('search.empty.hintExample','例：「神」「恵み」「希望」などの言葉で検索できます')}<br>${_tf('search.empty.hintGreek','ギリシャ語や Strong 番号でも検索できます')}</div>
                </div>
            </div>`;
        document.getElementById('hits-count').textContent='';
        document.getElementById('lemma-groups').style.display='none';
        { const _lc=document.getElementById('lemma-cooc');if(_lc){_lc.innerHTML='';_lc.style.display='none';} }
        document.getElementById('dist-panel').style.display='none';
        _renderDidYouMean(query,words);
        return;
    }

    // Build pseudo-hits array sorted by globalIdx for display
    const entries=[...merged.entries()].sort((a,b)=>a[0]-b[0]);

    const qtype=detectQueryType(query);
    if(qtype==='japanese'||_conceptViaEn){ /* アクセント付きスペイン語（oración）は 'text' 判定だが、概念発火時は無アクセント語（oracion）と同じ語グループ表示にそろえる */
        // Group by lemma
        const proxHits=[...merged.values()].filter(e=>e.proxHit).map(e=>e.proxHit);
        const groups=groupHitsByLemma(proxHits.length>0?proxHits:_buildPseudoHitsFromMerged(merged,words));
        _renderLemmaGroups(groups,query,word2,words);
        document.getElementById('lemma-groups').style.display='block';
    }else{
        document.getElementById('lemma-groups').style.display='none';
        { const _lc=document.getElementById('lemma-cooc');if(_lc){_lc.innerHTML='';_lc.style.display='none';} }
        _renderHitCards(entries,words,word2);
        _decorateFlatHeading(query,words,qtype);
        _igsdDecorateGreekQuery(query,word2,words);
    }

    // Book distribution
    _renderBookDist(entries);

    // Grammar explore: ギリシャ語・Strong番号検索時のみ表示
    // 日本語検索（語義・概念）では文法パターンは文脈と無関係のため非表示
    if (qtype === 'greek' || qtype === 'strong') {
        _renderPatternExplore();
    }
}

function _buildPseudoHitsFromMerged(merged,words){
    // ★ ref はロジックに使用しない（表示専用）。
    //   anchorIdx = gi（globalIdx）。tokens = ALL_TOKENS で UI が tok.ref を自力で読む。
    const hits=[];
    const allToks=ALL_TOKENS;
    for(const[gi]of merged){
        const CONTEXT=5;
        const winStart=Math.max(0,gi-CONTEXT);
        const winEnd=Math.min(allToks.length-1,gi+CONTEXT);
        hits.push({anchorIdx:gi,start:winStart,end:winEnd,tokens:allToks});
    }
    return hits;
}

function _renderHitCards(entries,words,word2){
    const list=document.getElementById('hits-list');
    const countEl=document.getElementById('hits-count');
    list.innerHTML='';

    const SHOW=80;
    // ★ De-dup by verse（bookKey + ch + verse）を globalIdx 経由で構成。
    //   entry.tok.ref をキーにしない（ref はロジック禁止・表示専用）。
    //   同一 verse 内で最多 hitTypes を持つ gi を代表として残す。
    const byVerse=new Map();
    for(const[gi,entry]of entries){
        const t=entry.tok;
        // verseKey = 位置情報フィールドから生成（refを使わない）
        const verseKey=`${t.bookKey||'?'}:${t.ch??'?'}:${t.verse??'?'}`;
        if(!byVerse.has(verseKey)||entry.hitTypes.size>byVerse.get(verseKey).entry.hitTypes.size){
            byVerse.set(verseKey,{gi,entry});
        }
    }
    const byRef=byVerse; // 変数名を後続で統一して使用

    countEl.textContent=_filterWord
        ?_tf('search.count.coocFilter','「{w}」との共起：?件 / 全{n}件',{w:_filterWord,n:byRef.size})
        :_tp('search.count.verses','{n} 節',byRef.size,{n:byRef.size.toLocaleString()});

    const FOLD = 8; // 最初に表示する件数
    const total = byRef.size;
    const everyEntry = [...byRef.values()];
    const allEntries = everyEntry.slice(0, SHOW);
    const tailEntries = everyEntry.slice(SHOW); // SHOW 超の残り節は段階表示（行き止まりを作らない）
    const visible = allEntries.slice(0, FOLD);
    const folded  = allEntries.slice(FOLD);
    let tailShown = 0;
    let isOpenState = false;
    /* 全件表示が済むまで、表示中の節数を明示する（途中状態を完了と見せない） */
    const status = document.createElement('div');
    status.className = 'hits-status';
    status.style.cssText = 'text-align:center;padding:8px;font-size:0.75rem;color:var(--ink-soft);';
    const updateStatus = () => {
        const n = isOpenState ? FOLD + folded.length + tailShown : Math.min(FOLD, total);
        status.textContent = n >= total ? _tp('search.status.allShown','{n} 節すべて表示中',total,{n:total.toLocaleString()}) : _tp('search.status.shownOf','{n} / {total} 節を表示中',total,{n:n.toLocaleString(),total:total.toLocaleString()});
    };

    let rendered = 0;
    for (const { gi, entry } of visible) {
        const card = _buildUnifiedCard(gi, entry, words, word2);
        card.style.animationDelay = `${rendered * 0.02}s`;
        list.appendChild(card);
        rendered++;
    }

    if (folded.length > 0) {
        // 折りたたみボタン
        const btn = document.createElement('button');
        btn.className = 'hits-toggle-btn';
        const btnIcon = document.createElement('span');
        btnIcon.className = 'material-symbols-outlined mat-icon';
        btnIcon.textContent = 'expand_more';
        const btnLabel = document.createElement('span');
        /* 続きがある（SHOW 超）ときは、このクリックで実際に増える節数を「さらに N 節」と出す。全部出るなら従来の「残り N 節」 */
        const foldLabel = () => tailEntries.length > 0
            ? _tp('search.btn.showNext','さらに {n} 節を表示',folded.length,{n:folded.length.toLocaleString()})
            : _tp('search.btn.showRemaining','残り {n} 節を表示',folded.length);
        btnLabel.textContent = foldLabel();
        btn.appendChild(btnIcon); btn.appendChild(btnLabel);

        // 折りたたみコンテナ
        const overflow = document.createElement('div');
        overflow.className = 'hits-overflow closed';
        for (const { gi, entry } of folded) {
            const card = _buildUnifiedCard(gi, entry, words, word2);
            card.style.animationDelay = `${rendered * 0.02}s`;
            overflow.appendChild(card);
            rendered++;
        }

        btn.onclick = () => {
            const isOpen = btn.classList.contains('open');
            btn.classList.toggle('open', !isOpen);
            overflow.classList.toggle('closed', isOpen);
            btnIcon.textContent = isOpen ? 'expand_more' : 'expand_less';
            btnLabel.textContent = isOpen ? foldLabel() : _tf('search.btn.collapse','折りたたむ');
            isOpenState = !isOpen;
            updateStatus();
        };

        /* SHOW を超える残り節：オーバーフロー内に「さらに N 節を表示」（N＝そのクリックで実際に増える数）を置き、押すたびに SHOW 節ずつ追加する */
        if (tailEntries.length > 0) {
            const tailWrap = document.createElement('div');
            const tailBtn = document.createElement('button');
            tailBtn.className = 'hits-toggle-btn';
            const tailLabel = () => { const _c = Math.min(SHOW, tailEntries.length - tailShown); tailBtn.textContent = _tp('search.btn.showNext','さらに {n} 節を表示',_c,{n:_c.toLocaleString()}); };
            tailLabel();
            tailBtn.onclick = () => {
                const chunk = tailEntries.slice(tailShown, tailShown + SHOW);
                for (const { gi, entry } of chunk) tailWrap.appendChild(_buildUnifiedCard(gi, entry, words, word2));
                tailShown += chunk.length;
                if (tailShown >= tailEntries.length) tailBtn.remove(); else tailLabel();
                updateStatus();
            };
            overflow.appendChild(tailWrap);
            overflow.appendChild(tailBtn);
        }

        list.appendChild(btn);
        list.appendChild(overflow);
    }

    if (total > FOLD) { updateStatus(); list.appendChild(status); }
}

/* ── The unified card builder ── */
function _buildUnifiedCard(anchorGi,entry,words,word2){
    const card=document.createElement('div');
    card.className='hit-card';
    card.dataset.qtype = detectQueryType(words[0]);

    const tok=entry.tok;
    // ★ rawRef は表示専用（リンクラベルの文字列にのみ使う）
    const rawRef=tok.ref||'';
    // ★ リンクの href 生成はロジック → bookKey / ch / verse を直接使う（ref を解析しない）
    const bookKey=tok.bookKey||'';
    const ch=tok.ch||'';
    const verse=tok.verse!=null?tok.verse:'';
    const corpusId=tok.corpusId||'NT';
    card.dataset.corpus=corpusId;

    // 節参照ラベル — StudyPanelと同じ「ローマ5章5節」形式
    const BOOK_SHORT_SEARCH = {
        MAT:'マタイ', MRK:'マルコ', LUK:'ルカ', JHN:'ヨハネ', ACT:'使徒',
        ROM:'ローマ', '1CO':'Ⅰコリント', '2CO':'Ⅱコリント',
        GAL:'ガラテヤ', EPH:'エペソ', PHP:'ピリピ', COL:'コロサイ',
        '1TH':'Ⅰテサロニケ', '2TH':'Ⅱテサロニケ',
        '1TI':'Ⅰテモテ', '2TI':'Ⅱテモテ',
        TIT:'テトス', PHM:'ピレモン', HEB:'ヘブル',
        JAS:'ヤコブ', '1PE':'Ⅰペテロ', '2PE':'Ⅱペテロ',
        '1JN':'Ⅰヨハネ', '2JN':'Ⅱヨハネ', '3JN':'Ⅲヨハネ',
        JUD:'ユダ', REV:'黙示録',
        GEN:'創世記', EXO:'出エジプト', LEV:'レビ', NUM:'民数',
        DEU:'申命', JOS:'ヨシュア', JDG:'士師', RUT:'ルツ',
        '1SA':'Ⅰサムエル', '2SA':'Ⅱサムエル',
        '1KI':'Ⅰ列王', '2KI':'Ⅱ列王',
        '1CH':'Ⅰ歴代', '2CH':'Ⅱ歴代',
        EZR:'エズラ', NEH:'ネヘミヤ', EST:'エステル',
        JOB:'ヨブ', PSA:'詩篇', PRO:'箴言', ECC:'伝道', SNG:'雅歌',
        ISA:'イザヤ', JER:'エレミヤ', LAM:'哀歌', EZK:'エゼキエル',
        DAN:'ダニエル', HOS:'ホセア', JOL:'ヨエル', AMO:'アモス',
        OBA:'オバデヤ', JON:'ヨナ', MIC:'ミカ', NAH:'ナホム',
        HAB:'ハバクク', ZEP:'ゼパニヤ', HAG:'ハガイ', ZEC:'ゼカリヤ', MAL:'マラキ',
    };
    const _bookNameMap=new Map(FLAT_BOOKS.map(b=>[b.key,b.name]));
    const _jpRef=(()=>{
        const m=rawRef.match(/^([A-Z1-9]{2,6})\s+(\d+):(\d+)/);
        if(!m) return rawRef;
        const short=_bookNm(m[1],BOOK_SHORT_SEARCH[m[1]]||_bookNameMap.get(m[1])||m[1]);
        return _refLabel(short,m[2],m[3]);
    })();
    // 「本文で見る」ボタン（verse付きURL）
    const openHref=bookKey&&ch
        ?(verse!==''
            ?`index.html?book=${encodeURIComponent(bookKey)}&ch=${Number(ch)}&verse=${Number(verse)}`
            :`index.html?book=${encodeURIComponent(bookKey)}&ch=${Number(ch)}`)
        :'';

    // Hit-type badges — Japanese short labels matching menu names
    const BADGE_JP={lemma:'語根',phrase:'フレーズ',prox:'近接',morph:'品詞'};
    const badgesHtml=[...entry.hitTypes].map(t=>`<span class="ht-badge ${t}">${_tf('search.badge.'+t,BADGE_JP[t]||t)}</span>`).join('');

    // Build context window
    const CONTEXT_LEMMA=4,CONTEXT_PROX=entry.proxHit?Math.abs(entry.proxHit.end-entry.proxHit.start):5;
    const ctxSize=Math.max(CONTEXT_LEMMA,Math.min(CONTEXT_PROX,8));
    const windowStart=Math.max(0,anchorGi-ctxSize);
    const windowEnd=Math.min(ALL_TOKENS.length-1,anchorGi+ctxSize);

    // Build phrase span set
    const phraseSet=new Set();
    if(entry.hitTypes.has('phrase')&&words.length>=2){
        for(let k=0;k<words.length;k++)phraseSet.add(anchorGi+k);
    }

    // w2 index for proximity
    let w2Gi=-1;
    if(entry.proxHit&&word2){
        for(let j=entry.proxHit.start;j<=entry.proxHit.end;j++){
            if(j!==anchorGi&&matchToken(ALL_TOKENS[j],word2)){w2Gi=j;break;}
        }
    }

    // Snippet: multi-layer highlighting
    const snippetHtml=ALL_TOKENS.slice(windowStart,windowEnd+1).map((t,li)=>{
        const gi=windowStart+li;
        const isAnchor=gi===anchorGi;
        const isPhrase=phraseSet.has(gi)&&!isAnchor;
        const isW2=gi===w2Gi;
        const hitTypes=_allMergedResults.has(gi)?_allMergedResults.get(gi).hitTypes:new Set();

        const txt=_escH(t.text||'');
        if(isAnchor){
            // Multi-layer: show all applicable classes
            const isLemma=hitTypes.has('lemma');
            const isPh=hitTypes.has('phrase');
            const isPrx=hitTypes.has('prox');
            if(isLemma&&isPh)return`<span class="hl-multi">${txt}</span>`;
            if(isLemma)return`<span class="hl-lemma">${txt}</span>`;
            if(isPrx)return`<span class="hl-prox-w1">${txt}</span>`;
            if(isPh)return`<span class="hl-phrase">${txt}</span>`;
            return`<span class="hl-lemma">${txt}</span>`;
        }
        if(isW2)return`<span class="hl-prox-w2">${txt}</span>`;
        if(isPhrase)return`<span class="hl-phrase">${txt}</span>`;
        return txt;
    }).join(' ');

    // Proximity distance visualizer
    let proxVizHtml='';
    if(entry.hitTypes.has('prox')&&w2Gi>=0){
        const dist=Math.abs(w2Gi-anchorGi);
        const anchorText=_escH(tok.text||words[0]||'');
        const targetText=_escH(ALL_TOKENS[w2Gi]?.text||word2||'');
        /* 節内の出現順に並べる（クエリ順ではない。表示する活用形は変えない）。クラス（色の濃淡）は語に付けたまま位置だけ入れ替える */
        const _anchorHtml=`<span class="prox-anchor">${anchorText}</span>`;
        const _targetHtml=`<span class="prox-target">${targetText}</span>`;
        const _first=w2Gi<anchorGi?_targetHtml:_anchorHtml;
        const _second=w2Gi<anchorGi?_anchorHtml:_targetHtml;
        proxVizHtml=`<div class="prox-dist-row">
            ${_first}
            <div class="prox-dist-line"><span class="prox-dist-label">${_tf('search.card.distance','距離 {n}',{n:dist})}</span></div>
            ${_second}
        </div>`;
    }


    const openBtnLgHtml = openHref
        ? `<a class="hit-open-btn-lg" href="${openHref}">${_tf('search.card.read','本文で読む')}</a>`
        : '';
    const lxxBadgeHtml=corpusId==='LXX'?'<span class="corpus-badge">LXX</span>':'';
    card.innerHTML=`
        <div class="hit-header">
            <span class="hit-ref">${_escH(_jpRef)}</span>${lxxBadgeHtml}
            <div class="hit-badges-subtle">${badgesHtml}</div>
        </div>
        ${proxVizHtml}
        <div class="hit-body">
            <div class="hit-snippet" aria-label="${_escH(_tf('search.card.greekAria','ギリシャ語原文'))}">${snippetHtml}</div>
            <button class="hit-greek-toggle" aria-expanded="false">▸ ${_tf('search.card.greekShow','ギリシャ語原文を見る')}</button>
            <div class="hit-trans-row">
                <span class="hit-trans-text hit-trans-main"></span>
                <span class="hit-trans-loading" style="font-size:var(--s-ts-xs);color:var(--s-text-hint);">${_tf('search.status.loading','読み込み中…')}</span>
            </div>
        </div>
        <div class="hit-footer">
            ${openBtnLgHtml}
        </div>`;
    // ★ data-ref 属性を使わない。翻訳フェッチは bookKey / ch / verse（globalIdx 由来）で行う。

    // Translation: auto-load on render
    const transText=card.querySelector('.hit-trans-main');
    const transLoading=card.querySelector('.hit-trans-loading');

    // Auto-load translation
    (async()=>{
        if(corpusId==='LXX'&&(_enMode()||_esMode())){
            // EN（D2）・ES（#61a）: LXX は訳文なし（EN は英語グロスも）。ギリシャ語本文のみ表示する
            card.classList.add('no-trans');
            return;
        }
        if(corpusId==='LXX'){
            // LXX に日本語訳ファイルなし — 404 を出さずにプレースホルダーを表示
            transText.textContent=_tf('search.card.noTrans','（翻訳テキストなし）');
            transLoading.style.display='none';
            transText.classList.add('visible');
            return;
        }
        if(tok.bookKey && tok.ch != null && tok.verse != null){
            const _chKey=`${tok.bookKey}/${tok.ch}`;
            const _vKey=String(tok.verse);
            console.debug('[trans] fetch req',{ref:tok.ref,globalIdx:tok.globalIdx,greek:tok.text,cacheKey:_chKey,verseKey:_vKey});
            const text=await _fetchTransVerse(tok.bookKey, String(tok.ch), _vKey);
            console.debug('[trans] fetch res',{ref:tok.ref,verseKey:_vKey,found:!!text,preview:text?.slice(0,30)});
            if(!text&&(_enMode()||_esMode())){card.classList.add('no-trans');return;} // EN: WEB／ES: RVR1909 に無い節はギリシャ語のみ
            transText.textContent=text||_tf('search.card.transMissing','（訳が見つかりません）');
        }else{
            console.warn('[trans] 位置情報不足',{ref:tok.ref,bookKey:tok.bookKey,ch:tok.ch,verse:tok.verse});
            if(_enMode()||_esMode()){card.classList.add('no-trans');return;}
            transText.textContent=_tf('search.card.noPosition','（位置情報が不足しています）');
        }
        transLoading.style.display='none';
        transText.classList.add('visible');
    })();

    // ギリシャ語スニペット展開トグル（日本語クエリ時のみ表示）
    const greekToggle = card.querySelector('.hit-greek-toggle');
    const greekSnippet = card.querySelector('.hit-snippet');

        });

    return card;
}

/* ── Co-occurrence panel (original logic, rewired) ── */
function _renderCooccurrence(coocMap,containerId,limit=10){

/* 共起語の見出し語グロス。JA は従来（TEXT_TO_JP）、EN は同じ語形の NT トークンの英語グロス。 */
const _enTextGloss=new Map();
function _glossForText(word){
    if(!_enMode()&&!_esMode())return TEXT_TO_JP.get(word)||_lookupJpFromCache(word);
    const _tk=(_esMode()?'es:':'en:')+word;
    if(_enTextGloss.has(_tk))return _enTextGloss.get(_tk);
    let g=null;
    for(const toks of Object.values(tokenCache)){
        for(const t of toks){if(t.text===word&&_dispGloss(t)){g=_dispGloss(t);break;}}
        if(g)break;
    }
    if(g)_enTextGloss.set(_tk,g);
    return g;
}
function _lookupJpFromCache(text){
    for(const toks of Object.values(tokenCache)){
        for(const t of toks){
            if(t.text===text&&t.japanese){
                const v=Array.isArray(t.japanese)?t.japanese[0]:t.japanese;
                if(v){TEXT_TO_JP.set(text,v);return v;}
            }
        }
    }
    return null;
}

/* ============================================================
   IGSD 語のページ（v1）
   - index.json を初回のみ遅延取得。失敗時は再試行せず従来表示のまま（静寂）
   - 語義の自動選択はしない。割り当て済み（assignments）の事実だけで並べる
   ============================================================ */
const _IGSD_BASE='../assets/data/igsd/';
let _igsdIndexPromise=null;
const _igsdLemmaCache=new Map();
/* sense-map-gi.json: globalIdx → "<Strong>:<senseId>"。事前生成インデックス経由のトークンは
   verseId を持たないため、globalIdx で語義を引く。初回のみ遅延 fetch、失敗時は再試行せず null。 */
let _igsdGiPromise=null;
function _igsdLoadGi(){
    if(!_igsdGiPromise){
        _igsdGiPromise=(async()=>{
            try{
                const res=await fetch(_IGSD_BASE+'sense-map-gi.json');
                if(!res.ok)return null;
                const m=await res.json();
                return m&&typeof m==='object'?m:null;
            }catch(_){return null;}
        })();
    }
    return _igsdGiPromise;
}
function _igsdNorm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function _igsdLoadIndex(){
    if(!_igsdIndexPromise){
        _igsdIndexPromise=(async()=>{
            try{
                const res=await fetch(_IGSD_BASE+'index.json');
                if(!res.ok)return null;
                const arr=await res.json();
                if(!Array.isArray(arr))return null;
                const m=new Map();
                for(const e of arr){
                    if(!e||e.status!=='final')continue;
                    for(const st of new Set([e.strong,...(e.strongs||[])]))m.set(st,e);
                }
                return m;
            }catch(_){return null;}
        })();
    }
    return _igsdIndexPromise;
}
function _igsdLoadLemma(strong){
    if(!_igsdLemmaCache.has(strong)){
        _igsdLemmaCache.set(strong,(async()=>{
            try{
                const res=await fetch(`${_IGSD_BASE}lemmas/${encodeURIComponent(strong)}.json`);
                if(!res.ok)return null;
                return await res.json();
            }catch(_){return null;}
        })());
    }
    return _igsdLemmaCache.get(strong);
}
/* 0件のギリシャ語クエリに「もしかして：レンマ」を出す（#46）。読み込み済みの索引（SEARCH_INDEX.text／lemmaIndex）だけで引く。
   1) 活用形の完全一致（アクセント無視）→ その形が属するレンマ（最大3） 2) 無ければレンマ・出現形への前方一致（アクセント無視、最大5・出現数の多い順）。
   候補が無い・クエリ自体がレンマ・日本語/番号/複数語の検索では何も出さない（現行の空状態のまま）。 */
function _didYouMeanCandidates(q){
    const norm=normalizeGreek(q);
    const lidx=window.lemmaIndex;
    if(!norm||!lidx||lidx.has(norm))return [];
    const lemmaOf=new Map(); // norm lemma -> {lemma, strong, n}
    const addTok=gi=>{
        const t=ALL_TOKENS[gi];if(!t||!t.lemma)return;
        const k=normalizeGreek(t.lemma);
        let e=lemmaOf.get(k);
        if(!e){e={lemma:t.lemma,strong:null,n:0,nt:false};lemmaOf.set(k,e);}
        if(t.corpusId!=='LXX'&&!e.nt){e.lemma=t.lemma;e.nt=true;}
        if(t.corpusId!=='LXX'&&t.strong&&!e.strong)e.strong=t.strong;
    };
    const txt=SEARCH_INDEX.text;
    const exact=new Set([...(txt.get(q)||[]),...(txt.get(norm)||[])]);
    if(exact.size>0){
        for(const gi of exact)addTok(gi);
        for(const e of lemmaOf.values()){const a=lidx.get(normalizeGreek(e.lemma));e.n=a?a.length:0;}
        return [...lemmaOf.values()].sort((a,b)=>b.n-a.n).slice(0,3);
    }
    for(const[k,arr]of lidx){ if(k.startsWith(norm)&&arr.length)addTok(arr[0]); }
    for(const[k,arr]of txt){
        if(!arr||!arr.length||!normalizeGreek(k).startsWith(norm))continue;
        for(let i=0;i<arr.length&&i<20;i++)addTok(arr[i]);
    }
    for(const[k,e]of lemmaOf){const a=lidx.get(k);e.n=a?a.length:0;}
    return [...lemmaOf.values()].filter(e=>e.n>0).sort((a,b)=>b.n-a.n).slice(0,5);
}
async function _renderDidYouMean(query,words){
    const box=document.getElementById('did-you-mean');
    if(!box||words.length!==1)return;
    const q=query.trim();
    if(/^[Gg]?\d+$/.test(q)||!/[\u0370-\u03FF\u1F00-\u1FFF]/.test(q))return;
    let cands;
    try{cands=_didYouMeanCandidates(q);}catch(_){return;}
    if(!cands||cands.length===0)return;
    const meanings=await Promise.all(cands.map(c=>_lemmaMeaning(c.strong,c.lemma)));
    if(_lastQuery!==query||document.getElementById('did-you-mean')!==box)return; // 検索が入れ替わっていたら出さない
    box.textContent='';
    const lab=document.createElement('span');lab.textContent=_tf('search.empty.didYouMean','もしかして：');box.appendChild(lab);
    cands.forEach((c,i)=>{
        const chip=document.createElement('span');chip.className='dym-chip';chip.setAttribute('role','button');chip.tabIndex=0;
        chip.appendChild(document.createTextNode(c.lemma));
        if(meanings[i]){const g=document.createElement('span');g.className='dym-gloss';g.textContent='（'+meanings[i]+'）';chip.appendChild(g);}
        const go=()=>_exampleSearch(c.lemma);
        chip.addEventListener('click',go);
        chip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
        box.appendChild(chip);
    });
    box.hidden=false;
}
/* 番号・ギリシャ語レンマ検索の見出し（#45）: 「語名 意味 番号」（例: ἀγαπάω 愛する G25）。
   意味は辞書データの表記をそのまま出す（語義の選択・要約はしない）。JA/ES＝Abbott-Smith【語義】の第1区切り、EN＝gloss-en-senses の第1語義。
   語が一意に決まらない・意味が引けない場合は、引けた部分だけ出す（何も引けなければ従来どおりクエリ文字列のまま＝静寂）。 */
function _asJaMeaning(desc){
    const m=/【語義】([^【]*)/.exec(desc||'');
    if(!m)return '';
    return m[1].replace(/（[^）]*）/g,'').split(/[；。：]/)[0].trim();
}
let _enSensesP=null;
function _loadEnSenses(){
    if(!_enSensesP)_enSensesP=fetch('../assets/data/lexicon/gloss-en-senses.json').then(r=>r.ok?r.json():null).catch(()=>null);
    return _enSensesP;
}
/* 辞書データの意味（語義の選択・要約はしない）。JA/ES＝Abbott-Smith【語義】の第1区切り（lemma 一致時のみ）、EN＝gloss-en-senses の第1語義。引けなければ ''。 */
async function _lemmaMeaning(strong,lemma){
    try{
        const num=String(parseInt(String(strong||'').replace(/\D/g,''),10));
        if(!strong||num==='NaN')return '';
        if(_enMode()){
            const d=await _loadEnSenses();
            const a=d&&d[num];
            return (Array.isArray(a)&&a.length)?String(a[0]||'').trim():'';
        }
        await _loadAbbott();
        const e=_abbottDict&&_abbottDict[num];
        return (e&&_igsdNorm(e.lemma)===_igsdNorm(lemma))?_asJaMeaning(e.description):'';
    }catch(_){return '';}
}
async function _decorateFlatHeading(query,words,qtype){
    if(words.length!==1)return;
    const q=query.trim();
    const isStrongQ=qtype==='strong';
    /* detectQueryType は基本ギリシャ文字だけの語（προελπίζω 等）を 'text' と判定するため、ギリシャ文字の有無で見る（_igsdDecorateGreekQuery と同じ） */
    if(!isStrongQ&&!/[\u0370-\u03FF\u1F00-\u1FFF]/.test(q))return;
    const idxs=isStrongQ?[...searchStrong(ALL_TOKENS,q)]:searchByLemma(q);
    if(!idxs||idxs.length===0)return;
    const nt=idxs.map(gi=>ALL_TOKENS[gi]).filter(t=>t&&t.corpusId!=='LXX'&&t.strong);
    if(nt.length===0)return;
    const nl=_igsdNorm(nt[0].lemma);
    if(nt.some(t=>_igsdNorm(t.lemma)!==nl||t.strong!==nt[0].strong))return; // 一意に決まらない（番号の衝突・複数レンマ）場合は出さない
    const strong=nt[0].strong;
    const meaning=await _lemmaMeaning(strong,nt[0].lemma);
    if(_lastQuery!==query)return; // 検索が入れ替わっていたら付けない
    const el=document.getElementById('result-query-label');
    if(!el||el.textContent!==query)return;
    el.textContent='';
    const lm=document.createElement('span');lm.className='rq-lemma';lm.textContent=nt[0].lemma;el.appendChild(lm);
    if(meaning){el.appendChild(document.createTextNode(' '));const g=document.createElement('span');g.className='rq-gloss';g.textContent=meaning;el.appendChild(g);}
    el.appendChild(document.createTextNode(' '));
    const sn=document.createElement('span');sn.className='rq-strong';sn.textContent=strong;el.appendChild(sn);
}
/* ギリシャ語の単語クエリ（QA-05）: 日本語クエリ用の語グループ行が無いため、結果の上に入口を置く。
   IGSD で final かつ lemma 一致の語だけ。条件を満たさなければ何も出さない（静寂）。
   用例は検索条件（形態フィルタ等）に左右されないよう、lemma の全ヒット（searchByLemma）を使う。 */
const _igsdBadgeText=()=>_tf('search.word.badge','語義で整理済み — 語のページを見る ›');
let _igsdGreekOpener=null;
function _igsdDecorateGreekQuery(query,word2,words){
    const old=document.getElementById('igsd-entry');
    if(old)old.remove();
    _igsdGreekOpener=null;
    /* detectQueryType は ό 等（U+03CC 系）だけの語を 'text' と判定するため使わず、ギリシャ文字の有無で見る。
       Strong 番号クエリ（#45）も同じ入口を出す（番号→語の解決結果から語のページへ）。 */
    const isStrongQ=/^[Gg]?\d+$/.test(query.trim());
    if(!_layers.lemma||words.length!==1||(!isStrongQ&&!/[\u0370-\u03FF\u1F00-\u1FFF]/.test(query)))return;
    const idxs=isStrongQ?[...searchStrong(ALL_TOKENS,query.trim())]:searchByLemma(query);
    if(!idxs||idxs.length===0)return;
    /* IGSD は新約の語義整理。Strong は NT トークンの値（'G1680'）を使う（LXX 側は '1680'・null 等で表記が揺れる）。 */
    const first=idxs.map(gi=>ALL_TOKENS[gi]).find(t=>t&&t.corpusId!=='LXX'&&t.strong);
    if(!first)return;
    const nl=_igsdNorm(first.lemma);
    for(const gi of idxs){
        const t=ALL_TOKENS[gi];
        if(!t||_igsdNorm(t.lemma)!==nl)return; // 複数の語にまたがる場合は出さない
        if(t.corpusId!=='LXX'&&t.strong!==first.strong)return;
    }
    _igsdLoadIndex().then(idx=>{
        if(!idx)return;
        const e=idx.get(first.strong);
        if(!e||_igsdNorm(e.lemma)!==nl)return;
        if(_lastQuery!==query||document.getElementById('igsd-entry'))return; // 検索が入れ替わっていたら付けない
        const group={lemma:first.lemma,strong:first.strong,hits:idxs.map(gi=>({anchorIdx:gi}))};
        const bar=document.createElement('div');bar.id='igsd-entry';bar.className='igsd-entry';
        const open=()=>_igsdOpenPage(e,group,[group],query,word2,words,true);
        const badge=document.createElement('button');badge.type='button';
        badge.className='igsd-badge igsd-badge-btn';badge.textContent=_igsdBadgeText();
        badge.addEventListener('click',open);
        bar.appendChild(badge);
        if(!isStrongQ)_igsdGreekOpener={query,open}; // 見出し（result-query-label）クリックでも同じ語のページを開く（番号検索の見出しは従来どおり辞書モーダル）
        const countEl=document.getElementById('hits-count');
        countEl.parentNode.insertBefore(bar,countEl);
    });
}
/* 語グループ行に「語義で整理済み」バッジを付け、語名クリックで語のページを開く */
function _igsdDecorateBar(bar,group,groups,query,word2,words){
    if(!group.strong)return;
    _igsdLoadIndex().then(idx=>{
        if(!idx)return;
        const e=idx.get(group.strong);
        if(!e||_igsdNorm(e.lemma)!==_igsdNorm(group.lemma))return;
        const form=bar.querySelector('.lg-form');
        const lemmaEl=bar.querySelector('.lg-greek')||form;
        const badge=document.createElement('button');badge.type='button';
        badge.className='igsd-badge igsd-badge-btn';badge.textContent=_igsdBadgeText();
        badge.addEventListener('click',ev=>{
            ev.stopPropagation(); // グループの折りたたみは行クリックのまま（バッジは語のページへ）
            _igsdOpenPage(e,group,groups,query,word2,words);
        });
        bar.insertBefore(badge,bar.querySelector('.lg-count'));
        lemmaEl.classList.add('igsd-link');
        lemmaEl.title=_tf('search.word.openTitle','語のページを開く');
        lemmaEl.addEventListener('click',ev=>{
            ev.stopPropagation(); // 既存の展開トグルは保つ（語名以外のクリック）
            _igsdOpenPage(e,group,groups,query,word2,words);
        });
    });
}
/* 開いている語のページを閉じる関数。新しい検索結果の描画前に呼び、前の語のページが残らないようにする。 */
let _igsdCurrentClose=null;
async function _igsdOpenPage(entry,group,groups,query,word2,words,fromGreekQuery){
    /* 日本語クエリ: 語グループ行から開く（隠す対象は語グループと分布）。
       ギリシャ語クエリ（QA-05）: 入口バーから開く（隠す対象は件数・ヒット一覧・分布・構造探索・入口）。 */
    const ids=fromGreekQuery
        ?['result-header','igsd-entry','hits-count','hits-list','dist-panel','pattern-explore-section']
        :['result-header','lemma-groups','lemma-cooc','dist-panel'];
    const targets=ids.map(id=>document.getElementById(id)).filter(Boolean);
    const anchor=fromGreekQuery?document.getElementById('hits-count'):document.getElementById('lemma-groups');
    let page=document.getElementById('igsd-page');
    if(!page){
        page=document.createElement('div');page.id='igsd-page';page.className='igsd-page';
    }
    anchor.parentNode.insertBefore(page,anchor);
    const was=targets.map(el=>el.style.display);
    targets.forEach(el=>{el.style.display='none';});
    page.style.display='block';
    page.innerHTML='<div class="igsd-empty">'+_escH(_tf('search.status.loading','読み込み中…'))+'</div>';
    const close=()=>{
        page.style.display='none';page.innerHTML='';
        targets.forEach((el,i)=>{el.style.display=was[i];});
        if(_igsdCurrentClose===close)_igsdCurrentClose=null;
    };
    _igsdCurrentClose=close;
    const [data,giMap]=await Promise.all([_igsdLoadLemma(entry.strong),_igsdLoadGi()]);
    if(!data||!giMap){close();return;} // 取得失敗は静かに従来表示へ戻す
    _igsdRenderPage(page,entry,data,giMap,group,query,word2,words,close);
}
function _igsdRenderPage(page,entry,data,giMap,group,query,word2,words,close){
    // 割り当て（globalIdx→"Strong:senseId"）で、検索ツールが既に保持している用例を語義別に振り分ける。
    // 値の Strong が開いている語と一致する場合だけ採用する。
    const bySense=new Map(entry.senses.map(s=>[String(s.id),[]]));
    let unassigned=0;
    const hits=[...group.hits].sort((a,b)=>a.anchorIdx-b.anchorIdx);
    for(const h of hits){
        const v=giMap[String(h.anchorIdx)];
        const sep=typeof v==='string'?v.indexOf(':'):-1;
        const sid=sep>0&&v.slice(0,sep)===entry.strong?v.slice(sep+1):undefined;
        if(sid!==undefined&&bySense.has(sid))bySense.get(sid).push(h);
        else unassigned++;
    }
    let filterBook=null;
    const bookNameMap=new Map(FLAT_BOOKS.map(b=>[b.key,b.name]));

    page.innerHTML='';
    const back=document.createElement('button');back.className='igsd-back';
    back.textContent=_tf('search.word.back','← 検索結果に戻る');back.addEventListener('click',close);
    page.appendChild(back);

    const head=document.createElement('div');head.className='igsd-head';
    head.innerHTML=`<span class="igsd-lemma">${_escH(entry.lemma)}</span>
        <span class="igsd-meta">${_escH(entry.strong)}</span>
        <span class="igsd-meta">${_tp('search.word.total','全{n}回（新約）',Number(entry.total),{n:Number(entry.total).toLocaleString()})}</span>`;
    page.appendChild(head);

    /* 語ページは語義層に専念: 見出し → 語義グループ群 → 出現分布（新約のみ）の順 */
    const sensesWrap=document.createElement('div');
    page.appendChild(sensesWrap);
    /* 辞書情報（Abbott-Smith）：語義と分布の間の折りたたみ節。本文はモーダルと同じ entry をそのまま表示（編集・要約しない）。エントリが無ければ節を出さない */
    const dictWrap=document.createElement('details');dictWrap.className='igsd-dict';dictWrap.hidden=true;
    page.appendChild(dictWrap);
    const distWrap=document.createElement('div');distWrap.className='dist-panel';
    page.appendChild(distWrap);
    (async()=>{
        try{
            await _loadAbbott();
            const num=String(parseInt(String(entry.strong||'').replace(/\D/g,''),10));
            const e=_abbottDict&&_abbottDict[num];
            const body=e?(_enMode()?(e.descriptionEn||''):e.description):'';
            if(!body||!dictWrap.isConnected)return;
            const sum=document.createElement('summary');sum.className='igsd-dict-h';
            sum.textContent=_tf('search.word.dict','辞書情報（Abbott-Smith）');
            const b=document.createElement('div');b.className='igsd-dict-body';
            b.innerHTML=_escH(body).replace(/\n/g,'<br>');
            dictWrap.appendChild(sum);dictWrap.appendChild(b);
            dictWrap.hidden=false;
        }catch(_){}
    })();

    let distExpanded=false; // 9書目以降の開閉状態（再描画しても保持するためクロージャ変数）
    const DIST_FOLD=8;
    const renderDist=()=>{
        const counts=new Map();
        for(const h of hits){
            const tk=ALL_TOKENS[h.anchorIdx]||{};
            if(tk.corpusId==='LXX') continue; // 見出し総数・語義と同じ新約のみ（corpusId が唯一の判定ソース）
            const k=tk.bookKey||'?';
            counts.set(k,(counts.get(k)||0)+1);
        }
        distWrap.innerHTML='<div class="dist-title">'+_escH(_tf('search.dist.title','出現分布（書物別）'))+'</div>';
        if(counts.size<2){return;}
        const sorted=[...counts.entries()].sort((a,b)=>b[1]-a[1]);
        const max=sorted[0][1];
        const list=document.createElement('div');list.className='dist-bar-list';
        (distExpanded?sorted:sorted.slice(0,DIST_FOLD)).forEach(([bk,n])=>{
            const nm=_bookNm(bk,bookNameMap.get(bk)||bk);
            const row=document.createElement('div');row.className='dist-bar-row'+(filterBook===bk?' active':'');
            row.title=_tp('search.dist.rowTitle','{name}：{n}件',n,{name:nm});
            row.innerHTML=`<span class="dist-bar-name">${_escH(nm.length>_distNameMax()?nm.slice(0,_distNameMax())+'…':nm)}</span>
                <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(n/max*100)}%"></div></div>
                <span class="dist-bar-count">${n}</span>`;
            row.addEventListener('click',()=>{filterBook=filterBook===bk?null:bk;renderDist();renderSenses();});
            list.appendChild(row);
        });
        distWrap.appendChild(list);
        if(sorted.length>DIST_FOLD){
            const tgl=document.createElement('button');tgl.className='igsd-dist-toggle';
            tgl.setAttribute('aria-expanded',distExpanded?'true':'false');
            tgl.textContent=distExpanded?_tf('search.close','閉じる'):_tp('search.dist.showMore','他 {n} 書物を表示',sorted.length-DIST_FOLD);
            tgl.addEventListener('click',()=>{distExpanded=!distExpanded;renderDist();});
            distWrap.appendChild(tgl);
        }
    };

    const renderSenses=()=>{
        sensesWrap.innerHTML='';
        const defs=new Map((data.senses||[]).map(s=>[String(s.id),s]));
        entry.senses.forEach(s=>{
            const all=bySense.get(String(s.id))||[];
            const list=filterBook?all.filter(h=>(ALL_TOKENS[h.anchorIdx]||{}).bookKey===filterBook):all;
            const sec=document.createElement('div');sec.className='igsd-sense';
            const def=(defs.get(String(s.id))||{}).def||'';
            sec.innerHTML=`<div class="igsd-sense-h">${_escH((_enMode()&&s.label_en)||(_esMode()&&s.label_es)||s.label)}<span class="igsd-sense-count">${_tp('search.count.hits','{n}件',Number(s.count),{n:Number(s.count).toLocaleString()})}</span></div>
                ${def?`<div class="igsd-sense-def">${_escH(def)}</div>`:''}`;
            const wrap=document.createElement('div');sec.appendChild(wrap);
            if(list.length===0){
                wrap.innerHTML='<div class="igsd-empty">'+_escH(_tf('search.word.noExamples','この条件で表示できる用例はありません'))+'</div>';
            }else{
                _renderLgHitSlice(wrap,list,query,word2,0,3,words);
                if(list.length>3){
                    let shown=3;
                    const btn=document.createElement('button');btn.className='lg-more-btn';
                    btn.textContent=_tp('search.btn.showMoreRemaining','さらに表示（残り{n}件）',list.length-shown);
                    btn.addEventListener('click',()=>{
                        _renderLgHitSlice(wrap,list,query,word2,shown,shown+3,words);
                        shown=Math.min(shown+3,list.length);
                        const rem=list.length-shown;
                        if(rem<=0)btn.remove();else btn.textContent=_tp('search.btn.showMoreRemaining','さらに表示（残り{n}件）',rem);
                    });
                    sec.appendChild(btn);
                }
            }
            sensesWrap.appendChild(sec);
        });
        if(unassigned>0){
            const n=document.createElement('div');n.className='igsd-empty';n.style.marginTop='12px';
            n.textContent=_tp('search.word.unassigned','語義の割り当てがない用例 {n} 件は表示していません。',unassigned);
            sensesWrap.appendChild(n);
        }
        const idioms=Array.isArray(data.idioms)?data.idioms:[];
        if(idioms.length>0){
            const sec=document.createElement('div');sec.className='igsd-sense';
            sec.innerHTML='<div class="igsd-sense-h">'+_escH(_tf('search.word.idioms','成句・慣用表現'))+'</div>';
            idioms.forEach(i=>{
                const d=document.createElement('div');d.className='igsd-idiom';
                d.innerHTML=`<span class="igsd-idiom-form">${_escH(i.form||'')}</span>${_escH(i.gloss||'')}`
                    +((i.refs&&i.refs.length)?`<span class="igsd-idiom-refs">${_escH(i.refs.join(_tf('search.morph.sep','、')))}</span>`:'');
                sec.appendChild(d);
            });
            sensesWrap.appendChild(sec);
        }
    };
    renderDist();renderSenses();
}

/* ── Book distribution (NT / LXX 2-section) ── */
function _renderBookDist(entries){
    const panel=document.getElementById('dist-panel');
    if(!entries||entries.length===0){panel.style.display='none';return;}

    // ★ corpusId を唯一の corpus 判定ソースとする。bookKey・book名からの推測禁止。
    const ntMap=new Map(),lxxMap=new Map();
    for(const[,{tok}]of entries){
        const key=tok.bookKey||'?';
        if(tok.corpusId==='LXX') lxxMap.set(key,(lxxMap.get(key)||0)+1);
        else                      ntMap.set(key,(ntMap.get(key)||0)+1);
    }
    if(ntMap.size+lxxMap.size<2){panel.style.display='none';return;}

    const bookNameMap=new Map(FLAT_BOOKS.map(b=>[b.key,b.name]));
    const MAX_BARS=8;
    panel.innerHTML='';panel.style.display='block';

    /* 結果画面の分布は既定で閉じ、見出し＋新約/LXX 合計の1行サマリ＋開閉だけ見せる。開くと従来のバー一覧。 */
    const _ntTotal=[...ntMap.values()].reduce((a,b)=>a+b,0),_lxxTotal=[...lxxMap.values()].reduce((a,b)=>a+b,0);
    const _sumParts=[];
    if(_ntTotal>0)_sumParts.push(_tf('search.count.nt','新約聖書 {n}件',{n:_ntTotal.toLocaleString()}));
    if(_lxxTotal>0)_sumParts.push(_tf('search.count.lxx','旧約ギリシア語訳（LXX） {n}件',{n:_lxxTotal.toLocaleString()}));
    const toggle=document.createElement('button');toggle.type='button';toggle.className='dist-toggle';
    toggle.setAttribute('aria-expanded','false');
    const panelTitle=document.createElement('span');panelTitle.className='dist-title';
    panelTitle.textContent=_tf('search.dist.title','出現分布（書物別）');
    const sumEl=document.createElement('span');sumEl.className='dist-toggle-sum';
    sumEl.textContent=_sumParts.join(_nonJa()?' / ':' ／ ');
    const chev=document.createElement('span');chev.className='dist-toggle-chev';chev.setAttribute('aria-hidden','true');chev.innerHTML=icon('chevronRight');
    toggle.appendChild(panelTitle);toggle.appendChild(sumEl);toggle.appendChild(chev);
    panel.appendChild(toggle);
    const body=document.createElement('div');body.className='dist-body';body.hidden=true;
    panel.appendChild(body);
    toggle.addEventListener('click',()=>{
        const open=body.hidden;body.hidden=!open;toggle.setAttribute('aria-expanded',open?'true':'false');
    });

    // activeRow はセクションをまたいで共有（NT行選択中にLXX行を選ぶと自動解除）
    let activeRow=null;

    // セクション描画ヘルパー
    const _buildSection=(countMap,sectionLabel)=>{
        if(countMap.size===0) return;
        const sectionTotal=[...countMap.values()].reduce((a,b)=>a+b,0);
        const sorted=[...countMap.entries()].sort((a,b)=>b[1]-a[1]);
        const shown=sorted.slice(0,MAX_BARS);
        const rest=sorted.length-MAX_BARS;
        const maxCount=shown[0]?shown[0][1]:1; // セクション内相対スケール

        const sh=document.createElement('div');sh.className='dist-section-title';
        sh.textContent=_tp('search.dist.section','{label}（{n}件）',sectionTotal,{label:sectionLabel,n:sectionTotal.toLocaleString()});
        body.appendChild(sh);

        const list=document.createElement('div');list.className='dist-bar-list';
        shown.forEach(([bookKey,count])=>{
            const pct=Math.round((count/maxCount)*100);
            const bookName=_bookNm(bookKey,bookNameMap.get(bookKey)||bookKey);
            const shortName=bookName.length>_distNameMax()?bookName.slice(0,_distNameMax())+'…':bookName;
            const row=document.createElement('div');row.className='dist-bar-row';
            row.title=_tp('search.dist.rowTitle','{name}：{n}件',count,{name:bookName});
            row.innerHTML=`
                <span class="dist-bar-name">${_escH(shortName)}</span>
                <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${pct}%"></div></div>
                <span class="dist-bar-count">${count}</span>`;
            row.addEventListener('click',()=>{
                if(activeRow===row){
                    row.classList.remove('active');activeRow=null;
                    _renderHitCards([..._allMergedResults.entries()],
                        _lastQuery.split(/\s+/),_lastQuery.split(/\s+/)[1]||null);
                }else{
                    if(activeRow)activeRow.classList.remove('active');
                    row.classList.add('active');activeRow=row;
                    const filtered=[..._allMergedResults.entries()].filter(([,e])=>(e.tok.bookKey||'')===bookKey);
                    _renderHitCards(filtered,_lastQuery.split(/\s+/),_lastQuery.split(/\s+/)[1]||null);
                }
            });
            list.appendChild(row);
        });
        if(rest>0){
            const more=document.createElement('div');more.className='dist-overflow-note';
            more.textContent=_tp('search.dist.moreNote','他 {n} 書物',rest);list.appendChild(more);
        }
        body.appendChild(list);
    };

    _buildSection(ntMap,_tf('search.dist.nt','新約聖書'));
    if(ntMap.size>0&&lxxMap.size>0){
        const hr=document.createElement('hr');hr.className='dist-section-divider';
        body.appendChild(hr);
    }
    _buildSection(lxxMap,_tf('search.dist.lxx','旧約ギリシア語訳（LXX）'));
}

/* 分布バーの書名の切り詰め長。JA は従来どおり10字。EN の書名（例 1 Thessalonians）は長いので緩める。 */

/* ロビー状態の検出：#state-empty が表示中で、エラー等の中央寄せ（.is-centered）でないときだけ body.is-lobby。 */
(function(){
    const es = document.getElementById('state-empty');
    if (!es) return;
    const sync = () => document.body.classList.toggle('is-lobby',
        es.style.display !== 'none' && !es.classList.contains('is-centered'));
    sync();
    new MutationObserver(sync).observe(es, { attributes: true, attributeFilter: ['style', 'class'] });
})();

/* State: selected values per slot */

/* Build pattern string from selections — returns null if nothing selected */
function _getMorphFilterPattern(){
    if(_morphSel.pos.size===0&&_morphSel.case.size===0&&_morphSel.num.size===0&&
       _morphSel.gen.size===0&&_morphSel.tense.size===0&&_morphSel.voice.size===0&&
       _morphSel.mood.size===0) return null;
    // Return structured selection object for matching
    return {

        mood: _morphSel.mood.size>0 ? new Set(_morphSel.mood) : null,
    };
}

/*
 * Morph tag format (NT/LXX Robinson-Pierpont style):
 *   N-NSM  = Noun, Nominative, Singular, Masculine
 *   V-PAI-3S = Verb, Present, Active, Indicative, 3rd, Singular
 *   A-NSM  = Adjective...
 *   T-NSM  = Article...
 * Parts: [POS]-[case][num][gen] for nominals
 *        [POS]-[tense][voice][mood][-person][num] for verbals
 */
/* [DIAG] morphTag の全フィールドをフィルターと比較し、1行ずつログ用文字列を返す */
function _morphMatchesPatternVerbose(morphTag, pattern) {
    const parts    = morphTag.split('-');
    const posCode  = parts[0];
    const isVerbal = posCode === 'V';
    const lines    = [];
    let passed     = true;

    const row = (field, tokenVal, filterSet) => {
        const fStr = filterSet ? '{' + [...filterSet].join('|') + '}' : '(指定なし)';
        if (!filterSet) {
            lines.push('  ' + field.padEnd(8) + '  "' + tokenVal + '"  filter=' + fStr + '  → skip（チェックなし）');
            return true;
        }
        const ok = filterSet.has(tokenVal);
        const verdict = ok ? 'true  ✓' : 'FALSE ✗  ← ここで除外';
        lines.push('  ' + field.padEnd(8) + '  "' + tokenVal + '" ∈ ' + fStr + '  → ' + verdict);
        if (!ok) passed = false;
        return ok;
    };

    row('pos', posCode, pattern.pos);

    if (isVerbal) {
        // NOTE: _morphMatchesPattern は parts[1][0..2] をそのまま使う（先頭数字オフセットなし）
        const tvm       = parts[1] || '';
        const t = tvm[0]||'', v = tvm[1]||'', m = tvm[2]||'';
        const pn        = parts[2] || '';
        const personRaw = pn.length >= 2 ? pn[0] : '(なし)';
        const numRaw    = pn.length >  0 ? pn[pn.length - 1] : '(なし)';

        row('tense',  t,        pattern.tense);
        row('voice',  v,        pattern.voice);
        row('mood',   m,        pattern.mood);
        lines.push('  ' + 'person'.padEnd(8) + '  "' + personRaw
            + '"  filter=(スロットなし・_morphSel に person 未定義)  → skip（チェックなし）');
        row('num',    numRaw,   pattern.num);
    } else {
        const cng = parts[1] || '';
        const c = cng[0]||'', n = cng[1]||'', g = cng[2]||'';
        row('case', c, pattern.case);
        row('num',  n, pattern.num);
        row('gen',  g, pattern.gen);
    }

    lines.push('  ' + '→ 判定'.padEnd(8) + '  ' +
        (passed ? 'true  — 一致（保持）' : 'false — 不一致（除外）'));
    return { passed, log: lines.join('\n') };
}

/* [DIAG] morph フィルター除外理由を返す。一致する場合は null を返す */
function _morphRejectReason(morphTag, pattern) {
    if (!morphTag || !pattern) return null;
    const parts = morphTag.split('-');
    const posCode = parts[0];
    if (pattern.pos && !pattern.pos.has(posCode))
        return { field: 'pos', tokenVal: posCode, filterVals: [...pattern.pos], morphTag };
    const isVerbal = posCode === 'V';
    if (!isVerbal) {
        const cng = parts[1] || '';
        const c = cng[0]||'', n = cng[1]||'', g = cng[2]||'';
        if (pattern.case && !pattern.case.has(c))
            return { field: 'case', tokenVal: c, filterVals: [...pattern.case], morphTag };
        if (pattern.num  && !pattern.num.has(n))
            return { field: 'num',  tokenVal: n, filterVals: [...pattern.num],  morphTag };
        if (pattern.gen  && !pattern.gen.has(g))
            return { field: 'gen',  tokenVal: g, filterVals: [...pattern.gen],  morphTag };
    } else {
        const tvm = parts[1] || '';
        const t = tvm[0]||'', v = tvm[1]||'', m = tvm[2]||'';
        if (pattern.tense && !pattern.tense.has(t))
            return { field: 'tense', tokenVal: t, filterVals: [...pattern.tense], morphTag };
        if (pattern.voice && !pattern.voice.has(v))
            return { field: 'voice', tokenVal: v, filterVals: [...pattern.voice], morphTag };
        if (pattern.mood  && !pattern.mood.has(m))
            return { field: 'mood',  tokenVal: m, filterVals: [...pattern.mood],  morphTag };
        if (pattern.num) {
            const pn = parts[2]||'';
            const numCode = pn.length > 0 ? pn[pn.length-1] : '';
            if (!pattern.num.has(numCode))
                return { field: 'num', tokenVal: numCode, filterVals: [...pattern.num], morphTag };
        }
    }
    return null;
}

/* QA-04: LXX の morph は 10桁の位置タグ（例 VBI-AAI3S- / N2--NSM--- / RA--NSM---）で、
   NT の短縮タグ（V-PAI-3S）とは別体系。NT 用の split('-') で読むと法・時制・態が読めず
   素通し（fail-open）していた。位置の意味（bible_data 全 LXX トークンで確認済み）:
     0 品詞 / 1-3 活用・語幹などの分類（フィルタ対象外）
     動詞(V): 4 時制・5 態・6 法・7 人称（分詞は格）・8 数・9 （分詞は性）
     それ以外: 4 格・5 数・6 性
   フィルタのチップが使う NT 側コード（時制 P/I/F/A/X/Y、態 A/M/P、法 I/S/O/M/N/P、格 N/G/D/A/V …）へ
   読み替えて同じ判定にかける。読み替えは決定的な対応のみ（LXX の法 D＝命令法 → M）。
   対応が無いもの（数詞 M・間投詞 I・疑問代名詞 RI）は品詞フィルタに一致しない（NT の I- と同様）。 */
const _LXX_POS_TO_CHIP = {N:'N',V:'V',A:'A',RA:'T',RR:'R',RP:'P',RD:'D',RX:'X',C:'CONJ',P:'PREP',D:'ADV',X:'PRT'};
function _lxxMorphMatchesPattern(tag, pattern){
    const t = String(tag||'');
    if(t.length!==10) return false;             /* 解読不能は一致扱いにしない（素通ししない） */
    const lead = t[0];
    const posCode = _LXX_POS_TO_CHIP[lead==='R' ? t.slice(0,2) : lead] || '';
    if(pattern.pos && !pattern.pos.has(posCode)) return false;
    if(lead==='V'){
        const mood = t[6]==='D' ? 'M' : t[6];   /* LXX の D＝命令法 → NT コード M */
        if(pattern.tense && !pattern.tense.has(t[4])) return false;
        if(pattern.voice && !pattern.voice.has(t[5])) return false;
        if(pattern.mood  && !pattern.mood.has(mood))  return false;
        if(pattern.num   && !pattern.num.has(t[8]))   return false;
    } else {
        if(pattern.case && !pattern.case.has(t[4])) return false;
        if(pattern.num  && !pattern.num.has(t[5]))  return false;
        if(pattern.gen  && !pattern.gen.has(t[6]))  return false;
    }
    return true;
}
function _morphMatchesPattern(morphTag, pattern, corpusId){
    if(!morphTag||!pattern) return true;
    if(corpusId==='LXX') return _lxxMorphMatchesPattern(morphTag, pattern);
    const parts = morphTag.split('-');
    const posCode = parts[0]; // e.g. "N","V","A","T","R","P","D"

    // POS check
    if(pattern.pos && !pattern.pos.has(posCode)) return false;

    const isVerbal = posCode === 'V';
    if(!isVerbal){
        // Nominal: parts[1] = CaseNumGen (e.g. "NSM")
        const cng = parts[1] || '';
        const c = cng[0]||'', n = cng[1]||'', g = cng[2]||'';
        if(pattern.case && !pattern.case.has(c)) return false;
        if(pattern.num  && !pattern.num.has(n))  return false;
        if(pattern.gen  && !pattern.gen.has(g))  return false;
    } else {
        // Verbal: parts[1] = TenseVoiceMood (e.g. "PAI"), parts[2] = PersonNum or Num
        const tvm = parts[1] || '';
        const t = tvm[0]||'', v = tvm[1]||'', m = tvm[2]||'';
        if(pattern.tense && !pattern.tense.has(t)) return false;
        if(pattern.voice && !pattern.voice.has(v)) return false;
        if(pattern.mood  && !pattern.mood.has(m))  return false;
        // For verbal, num is last char of parts[2] or parts[1+extra]
        if(pattern.num){
            const pn = parts[2]||'';
            const numCode = pn.length>0 ? pn[pn.length-1] : '';
            if(!pattern.num.has(numCode)) return false;
        }
    }
    return true;
}

/* Render a chip group */
function _renderMorphChips(containerId, items, slot){
    const el = document.getElementById(containerId);
    el.innerHTML='';
    el.classList.add('morph-chip-group', 'morph-chip-group-' + slot);
    items.forEach((item)=>{
        const code=item.code, jp=_escH(_morphJp(slot,item)), help=_escH(_morphHelp(slot,item));
        const chip = document.createElement('button');
        chip.type='button';
        chip.className='morph-chip'+(_morphSel[slot].has(code)?' selected':'');
        chip.innerHTML=`<span class="morph-chip-label">${jp}</span><span class="morph-chip-help">${help || ''}</span>`;
        chip.setAttribute('aria-pressed',_morphSel[slot].has(code)?'true':'false');
        chip.addEventListener('click',()=>{
            if(_morphSel[slot].has(code)) _morphSel[slot].delete(code);
            else _morphSel[slot].add(code);
            chip.classList.toggle('selected',_morphSel[slot].has(code));
            chip.setAttribute('aria-pressed',_morphSel[slot].has(code)?'true':'false');

            // 条件チップを選んだら文法レイヤーも有効化し、検索に反映される状態にする。
            // 最後の条件を解除してもレイヤー自体は維持し、ユーザーが明示的に切り替えられるようにする。
            if (!_layers.morph) {
                _layers.morph = true;
                _syncLayerUI('morph');
            }
            _updateMorphSubSections();
            _updateMorphClearBtn();
            _morphPcReflect();
        });
        el.appendChild(chip);
    });
}

function _syncMorphFilterFab(){
    const fab=document.getElementById('morph-filter-fab');
    if(!fab) return;
    const filters=document.getElementById('search-filters');

    fab.style.display=window.matchMedia('(max-width: 700px)').matches && !!filters && filters.classList.contains('has-query') ? 'flex' : 'none';

        const bc=document.getElementById('morph-box-count');
        if(bc) bc.textContent=total>9?'9+':String(total);

function _updateMorphAccordionUI(){
    const labels={pos:MORPH_POS,mood:MORPH_MOOD,tense:MORPH_TENSE,voice:MORPH_VOICE,case:MORPH_CASE,num:MORPH_NUM,gen:MORPH_GEN};
    Object.keys(labels).forEach(slot=>{
        const section=document.querySelector('.morph-section[data-slot="'+slot+'"]');
        if(!section) return;
        const open=_morphOpenSection===slot && section.style.display!=='none';
        section.classList.toggle('is-open',open);
        const btn=section.querySelector('.morph-section-toggle');
        if(btn) btn.setAttribute('aria-expanded',open?'true':'false');
        const summary=document.getElementById('morph-summary-'+slot);
        if(summary) summary.textContent=[..._morphSel[slot]].map(code=>(function(){const it=labels[slot].find(item=>item.code===code);return it?_morphJp(slot,it):undefined;})()).filter(Boolean).join(_tf('search.morph.sep','、'));
    });
    const total=[...Object.values(_morphSel)].reduce((s,set)=>s+set.size,0);
    const count=document.getElementById('morph-panel-count');
    if(count) count.textContent=total?_tf('search.morph.selected','{n}条件選択中',{n:total}):'';
    _syncMorphFilterFab();
    const hint=document.getElementById('morph-hint-text');
    if(hint) hint.textContent=total?_tf('search.morph.hintSome','選択した条件を組み合わせて検索できます'):_tf('search.morph.hintNone','カテゴリを開いて条件を選択');
}
/* Show/hide sub-sections based on selected POS */
function _updateMorphSubSections(){
    const sel=_morphSel.pos;
    const hasNominal=sel.size===0||[...sel].some(p=>['N','A','T','R','P','D'].includes(p));
    const hasVerbal=sel.size===0||[...sel].some(p=>p==='V');
    const show=(id,val)=>{const el=document.getElementById(id);if(el)el.style.display=val?'':'none';};
    show('morph-sec-pos',true); show('morph-sec-case',hasNominal); show('morph-sec-num',true);
    show('morph-sec-gen',hasNominal); show('morph-sec-tense',hasVerbal); show('morph-sec-voice',hasVerbal); show('morph-sec-mood',hasVerbal);
    const active=document.querySelector('.morph-section[data-slot="'+_morphOpenSection+'"]');
    if(active&&active.style.display==='none') _morphOpenSection=null;
    _updateMorphAccordionUI();
}

function _updateMorphClearBtn(){
    const total=[...Object.values(_morphSel)].reduce((s,set)=>s+set.size,0);
    document.getElementById('morph-clear-btn').classList.toggle('visible',total>0);
    _updateMorphAccordionUI();
}

function _morphClearAll(){
    Object.values(_morphSel).forEach(s=>s.clear());
    ['pos','case','num','gen','tense','voice','mood'].forEach(slot=>{
        document.querySelectorAll(`#morph-chips-${slot} .morph-chip`).forEach(c=>{
            c.classList.remove('selected');
            c.setAttribute('aria-pressed','false');
        });
    });
    _morphOpenSection=null;
    _updateMorphSubSections();
    _updateMorphClearBtn();
    _morphPcReflect();
}

                mini.textContent = val ? _tf('search.header.miniSearching','「{q}」を検索中',{q:val}) : _tf('search.header.miniIdle','検索する');

})();
