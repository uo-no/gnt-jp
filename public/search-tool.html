    'ἐκεῖνος','ἐκείνη','ἐκεῖνο','ἐκείνου','ἐκείνης','ἐκείνῳ','ἐκείνην','ἐκεῖνον',
    'ἐκείνων','ἐκείνοις','ἐκείνους','ἐκείναις','ἐκείνας',
    'πᾶς','πᾶν','πάντα','πάντες','πάντων','πᾶσιν','πάσης','πάσῃ',
    'πᾶσα','πάσας','πάντας',
    'ἐστιν','ἐστί','εἰσίν','εἰσί','ἦν','ἦσαν','ἔσται','ἔσονται',
    'εἶναι','ὤν','οὖσα','ὄν','ὄντος','οὔσης','ὄντι','οὔσῃ',
    'ὄντα','οὖσαν','ὄντας','οὔσας','ὄντων','οὔσαις',
    'ἐσόμενος','ἐσομένη','ἐσόμενον',
    'οὕτως','οὕτω','νῦν','τότε','ἤδη','μᾶλλον','οὐκέτι','μηκέτι',
    'πάλιν','ὧδε','ἐκεῖ','ἐκεῖθεν','ἄρα','ἆρα','ποτε','ὅτε','ὁπότε',
    'ἔτι','οὐδέ','μηδέ','μήτε','οὔτε','ναί','οὐαί','ἰδού',
    'μέν','τε','ἄν','γε','δή','οὖν',
    'τίς','τί','πῶς','πότε','ποῦ','πόθεν','πόσος',
    'εἷς','μία','ἕν','ἑνός','μιᾶς','δύο','τρεῖς','τρία',
    'πρῶτος','πρώτη','πρῶτον',
]);

/* ============================================================
   State
   ============================================================ */
/* Scope is always 'all' */
const currentScope = 'all';
let currentDist  = 5;
let isSearching  = false;

/* ============================================================
   Data layer（original — unchanged）
   ============================================================ */
const tokenCache = {};
let   ALL_TOKENS = [];

/* ──────────────────────────────────────────────────────────────
   DATA INGESTION LAYER — search.html role boundary
   ──────────────────────────────────────────────────────────────
   This file is responsible for:
     1. Building ALL_TOKENS (token ingestion)
     2. Building window.lemmaIndex / window.morphIndex (index construction)
     3. Exposing built data via window.* for consumption by index.html

   SSOT (Single Source of Truth) for data ACCESS lives in index.html.
   getTokens() and getLemmaIndex() are defined ONLY in index.html.
   This file does NOT define or call those getters.
   All internal reads of ALL_TOKENS within this file use ALL_TOKENS directly,
   because this is the authoritative write site for that array.
   ────────────────────────────────────────────────────────────── */

const SEARCH_INDEX = {
    lemma:    new Map(),
    text:     new Map(),
    japanese: new Map(),
    strong:   new Map(),
};
const TEXT_TO_JP       = new Map();
const JP_PARTIAL_INDEX = new Map();
const JP_PARTIAL_PREBUILT_CORPORA = new Set();
/* IDX.ready: NT27書のfetch・索引化が完了したことを示すフラグ。
   LXXはバックグラウンド構築（IDX.ready=true後に開始）。
   IDX.l3Ready: NT+LXX全書物のfetch・索引化および日本語インデックス構築が完了したフラグ。
   検索ゲート（unifiedSearch）は IDX.ready で開くが、LXX 未完了中は NT 結果のみ返る。 */
const IDX = { ready: false, l3Ready: false };
const POS_JP = {
    'V':'動詞','N':'名詞','A':'形容詞','R':'関係代名詞',
    'P':'代名詞','T':'冠詞','D':'指示代名詞',
    'ADV':'副詞','PREP':'前置詞','CONJ':'接続詞','PRT':'添語',
};
let _indexPromise = null;

/* 検索画面の i18n ヘルパー（#28）。
   _tf: T() を通して文字列を引く。JA・辞書に無い言語（ES）は第2引数（日本語の現行文字列）をそのまま返す。
        {name} 形式のプレースホルダを vars で置換する。
   _tp: 単数形（n===1 で key+'.one' が辞書にあるとき）を選ぶ版。
   _sLoc: 検索画面用の辞書（search.*）がある言語か。書名など main 側の辞書キー（book.*）を ES で
          誤って使わないための門（ES は検索画面では日本語のまま）。 */
function _tf(key,ja,vars){
    let s=(window.T?T(key,ja):ja);
    if(s==null)s=ja;
    if(vars)for(const k in vars)s=s.split('{'+k+'}').join(String(vars[k]));
    return s;
}
function _tp(key,ja,n,vars){
    const v=Object.assign({n:n},vars||{});
    if(n===1&&window.T){const one=T(key+'.one',null);if(one!=null)return _tf(key+'.one',one,v);}
    return _tf(key,ja,v);
}
function _sLoc(){return !!(window.T&&T('search.meta.title',null)!=null);}
function _bookNm(key,ja){return(_sLoc()&&key)?T('book.'+key,ja):ja;}
/* 節参照: JA は「書名N章M節」、EN は「Book N:M」。書名は呼び出し側が _bookNm で解決済みのものを渡す。 */
function _refLabel(name,ch,v,jaSep){return _tf('search.ref.verse',name+(jaSep||'')+ch+'章'+v+'節',{book:name,ch:ch,v:v});}
/* EN 時（#29）: 英語グロスでの検索・表示。JA・ES では常に false で、従来の挙動は一切変わらない。
   英語の単語は 'japanese' 型クエリ（語義＝グロス照合）として既存の語グループ経路に載せる。 */
function _enMode(){return !!(window.I18N&&I18N.lang==='en');}
/* #58: 区切り記号など表示だけの分岐用。JA 以外（EN・ES）は半角、JA は従来の全角。語義・グロスの選択（_enMode）には使わない。 */
function _nonJa(){return !!(window.I18N&&I18N.lang&&I18N.lang!=='ja');}
/* #31: 英字（ラテン文字）だけの単語は UI 言語にかかわらず英語グロス照合へ回す。日本語・ギリシャ語・Strong は対象外。 */
function _isLatinWord(w){return /^[\p{Script=Latin}][\p{Script=Latin}'’]*$/u.test(String(w==null?'':w));} /* #61b: スペイン語のアクセント付きの語（oración 等）も英字語として扱う */
function _enGlossWords(tok){const g=tok&&tok.gloss;return g?(String(g).toLowerCase().match(/[a-z]+(?:['’][a-z]+)?/g)||[]):[];}
/* #61b: スペイン語グロス（NT トークンの glossEs。検索インデックス生成時に結合）。[artículo] [absorbido] 等の角括弧の印は語義ではないので語としても表示用としても扱わない。 */
function _esGlossText(tok){const g=tok&&tok.glossEs;return(g&&String(g).charAt(0)!=='[')?String(g):null;}
function _esGlossWords(tok){const g=_esGlossText(tok);return g?(_noAccent(g).match(/[a-z]+/g)||[]):[];}
/* 表示用グロス（EN は gloss、ES は glossEs。JA は対象外で null） */
function _dispGloss(tok){return _enMode()?((tok&&tok.gloss)||null):(_esMode()?_esGlossText(tok):null);}
/* 語（クエリ）ごとに引くグロスの言語を決める。ES UI はスペイン語を先に、それ以外は英語を先に引き、先に当たらなければもう一方へ（UI 言語によらず両言語で発火）。 */
const _glossIdxs={en:null,es:null},_glossIdxN={en:-1,es:-1};
function _glossIndexFor(lang){
    if(!_glossIdxs[lang]||_glossIdxN[lang]!==ALL_TOKENS.length){
        const m=new Map(),fn=lang==='es'?_esGlossWords:_enGlossWords;
        for(let i=0;i<ALL_TOKENS.length;i++){
            const tk=ALL_TOKENS[i];if(!tk)continue;
            const ws=fn(tk);if(!ws.length)continue;
            const gi=tk.globalIdx!=null?tk.globalIdx:i;
            for(const w of new Set(ws)){let a=m.get(w);if(!a){a=[];m.set(w,a);}a.push(gi);}
        }
        _glossIdxs[lang]=m;_glossIdxN[lang]=ALL_TOKENS.length;
    }
    return _glossIdxs[lang];
}
function _enGlossIndex(){return _glossIndexFor('en');}
function _glossKey(word,lang){return lang==='es'?_noAccent(word):String(word).toLowerCase();}
let _glossLangMemo=new Map(),_glossLangMemoN=-1;
function _glossLangFor(word){
    if(_glossLangMemoN!==ALL_TOKENS.length){_glossLangMemo=new Map();_glossLangMemoN=ALL_TOKENS.length;}
    const mk=(_esMode()?'s|':'o|')+word;
    let lang=_glossLangMemo.get(mk);
    if(lang)return lang;
    const hasEn=_glossIndexFor('en').has(_glossKey(word,'en')),hasEs=_glossIndexFor('es').has(_glossKey(word,'es'));
    lang=_esMode()?(hasEs?'es':'en'):(hasEn?'en':(hasEs?'es':'en'));
    _glossLangMemo.set(mk,lang);
    return lang;
}
function _enGlossHas(tok,word){const lang=_glossLangFor(word);return(lang==='es'?_esGlossWords(tok):_enGlossWords(tok)).includes(_glossKey(word,lang));}
function _enGlossSet(word){const lang=_glossLangFor(word);return new Set(_glossIndexFor(lang).get(_glossKey(word,lang))||[]);}
function _posLabel(p){return _tf('search.morph.opt.pos.'+p,POS_JP[p]||p);}

function normalizeGreek(str) {
    return (str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/[⸀⸁⸂⸃⌈⌉.,;:·]/g,'').replace(/ς/g,'σ').toLowerCase().trim();
}
/**
 * Strong番号を正規化して "G\d+" 形式に統一する。
 *   "3972"  → "G3972"
 *   "g3972" → "G3972"
 *   "G3972" → "G3972"
 * 数字部分が取れない場合は空文字を返す。
 */
function normalizeStrong(value) {
    const digits = String(value || '').replace(/[^0-9]/g, '');
    return digits ? 'G' + digits : '';
}
function addToIndex(map,key,idx){
    if(!key)return; let arr=map.get(key);
    if(!arr){arr=[];map.set(key,arr);}arr.push(idx);
}
function _addJpPartial(str,idx){
    if(!str||typeof str!=='string')return;
    const maxLen=Math.min(str.length,8);
    for(let s=0;s<str.length;s++){
        for(let l=1;l<=maxLen-s;l++){
            const sub=str.slice(s,s+l);
            if(!JP_PARTIAL_INDEX.has(sub))JP_PARTIAL_INDEX.set(sub,new Set());
            JP_PARTIAL_INDEX.get(sub).add(idx);
        }
    }
}
/* #61b: 事前生成インデックスが無い環境（ブラウザ構築のフォールバック）では、ES UI のときだけ NT 章のスペイン語グロスを取得して glossEs を結合する。 */
async function _joinEsGloss(bookKey,ch,toks){
    if(!_esMode()||!NT_BOOK_KEYS.has(bookKey))return;
    try{
        const res=await fetch(`../assets/data/gloss-token/RVR1909/${bookKey}/${ch}.json`);
        if(!res.ok)return;
        const gm=(await res.json()).glosses;
        if(gm)for(const k of toks){const g=gm[k.ref];if(typeof g==='string'&&g)k.glossEs=g;}
    }catch(_){}
}
async function fetchChapter(bookKey, ch) {
    const cacheKey = `${bookKey}/${ch}`;
    if (tokenCache[cacheKey]) return tokenCache[cacheKey];
    const path = await bibleDataPath(bookKey, ch);
    const data = await BookMaster.fetchJSON(path);
    if (!Array.isArray(data)) return []; // 失敗は BookMaster.fetchJSON が console.error + __failedFetches に記録済み
    // ── corpusId: テキスト区分（'NT' | 'LXX'）、language: 原語識別子（'grc' 固定）──
    const corpusId = NT_BOOK_KEYS.has(bookKey) ? 'NT' : 'LXX';
    const tokens = data.map(w => ({
        // ── 表示専用（ロジック依存禁止・refをキーや条件に使用しないこと）──
        ref: w.ref || `${bookKey} ${ch}:${w.verse ?? '?'}`,

        // ── SSOT 位置情報（翻訳フェッチ・verseKey生成・ナビゲーションに使用する）──
        bookKey,
        ch:    Number(ch),
        verse: w.verse != null ? Number(w.verse) : null,

        // ── 語彙情報 ──
        text:     w.text    || '',
        lemma:    w.lemma   || w.text || '',
        morph:    w.morph   ?? null,
        japanese: w.japanese || w.gloss_ja || w.gloss || null,
        gloss:    w.gloss   || w.gloss_ja || null,
        strong:   w.strong  || w.strongs  || null,

        // ── 言語・lemma識別子 ──
        language: 'grc',
        corpusId,
        lemmaId:  w.lemmaId ?? w.lemma_id ?? null,

        // globalIdx は _indexChapter で付与される（ここでは未定義）
    }));
    await _joinEsGloss(bookKey, ch, tokens);
    tokenCache[cacheKey] = tokens;
    return tokens;
}
function _indexChapter(toks){
    for(const tok of toks){
        tok.globalIdx=ALL_TOKENS.length;   // ★ SSOT: globalIdx = 付与時点の配列長
        ALL_TOKENS.push(tok);
        const gIdx=tok.globalIdx;
        addToIndex(SEARCH_INDEX.text,tok.text,gIdx);
        addToIndex(SEARCH_INDEX.lemma,tok.lemma,gIdx);
        const nl=normalizeGreek(tok.lemma),nt=normalizeGreek(tok.text);
        if(nl&&nl!==tok.lemma)addToIndex(SEARCH_INDEX.lemma,nl,gIdx);
        if(nt&&nt!==tok.text)addToIndex(SEARCH_INDEX.text,nt,gIdx);
        addToIndex(SEARCH_INDEX.strong,tok.strong!=null?normalizeStrong(tok.strong):null,gIdx);
        const jpVals=tok.japanese?(Array.isArray(tok.japanese)?tok.japanese:[tok.japanese]):(tok.gloss?[tok.gloss]:[]);
        if(tok.text&&jpVals.length>0&&!TEXT_TO_JP.has(tok.text))TEXT_TO_JP.set(tok.text,jpVals[0]);
    }
}
/* NT27書+OT39書を対象に索引を構築する。
   corpora: 対象コーパスを ['NT'] / ['LXX'] / [] (全体) で指定する。
   IDX.ready の設定と _buildL3Background の呼び出しは _ensureFullIndex 側で管理する。
   ─────────────────────────────────────────────────────────────────
   【Phase 2 監査】fetch / JSON.parse / tokenMap / indexChapter を個別計測する。
   fetchChapter は BookMaster.fetchJSON → res.json() で fetch+parse が一体のため、
   このループ内では res.text() + JSON.parse() を分離して計測し、
   結果を tokenCache に格納する（fetchChapter との動作は同一）。
   ───────────────────────────────────────────────────────────────── */
async function _buildFullIndex(corpora){
    const corpusSet=corpora&&corpora.length?new Set(corpora):null;
    performance.mark('data-load-start');
    const allTasks=await BookMaster.buildChapterTasks();
    const tasks=corpusSet
        ?allTasks.filter(t=>corpusSet.has(NT_BOOK_KEYS.has(t.key)?'NT':'LXX'))
        :allTasks;
    const BATCH=20;

    /* 章ごとのフェーズ別タイミング収集 */
    const _phTimings=[];

    for(let i=0;i<tasks.length;i+=BATCH){
        const slice=tasks.slice(i,i+BATCH);

        /* ── フェーズ 1+2+2b: 並列 fetch → JSON.parse → token map ── */
        const batchResults=await Promise.all(slice.map(async t=>{
            const cacheKey=`${t.key}/${t.ch}`;
            /* キャッシュ済みの章はスキップ（2回目以降の _buildFullIndex 呼び出し時など） */
            if(tokenCache[cacheKey]) return {t,toks:tokenCache[cacheKey],fetchMs:0,parseMs:0,mapMs:0,cached:true};

            const path=await BookMaster.pathFor(t.key,t.ch);

            /* フェーズ1: fetch（ネットワーク＋ダウンロード、res.text()完了まで） */
            const tFetch=performance.now();
            let text=null;
            try{
                const res=await fetch(path);
                if(res.ok){ text=await res.text(); }
                else{ console.info(`[buildFullIndex:fetch] ${t.key}/${t.ch} HTTP ${res.status}`); }
            }catch(e){ console.info(`[buildFullIndex:fetch] ${t.key}/${t.ch} error`,e); }
            const fetchMs=performance.now()-tFetch;

            if(!text) return {t,toks:[],fetchMs,parseMs:0,mapMs:0,cached:false};

            /* フェーズ2: JSON.parse（CPU、文字列→オブジェクトツリー） */
            const tParse=performance.now();
            let rawArr=null;
            try{ rawArr=JSON.parse(text); }catch(e){ console.info(`[buildFullIndex:parse] ${t.key}/${t.ch} parse error`,e); }
            const parseMs=performance.now()-tParse;

            if(!Array.isArray(rawArr)) return {t,toks:[],fetchMs,parseMs,mapMs:0,cached:false};

            /* フェーズ2b: token mapping（CPU、生オブジェクト→正規化 token 構造） */
            const tMap=performance.now();
            const corpusId=NT_BOOK_KEYS.has(t.key)?'NT':'LXX';
            const toks=rawArr.map(w=>({
                ref:      w.ref||`${t.key} ${t.ch}:${w.verse??'?'}`,
                bookKey:  t.key,
                ch:       Number(t.ch),
                verse:    w.verse!=null?Number(w.verse):null,
                text:     w.text    ||'',
                lemma:    w.lemma   ||w.text||'',
                morph:    w.morph   ??null,
                japanese: w.japanese||w.gloss_ja||w.gloss||null,
                gloss:    w.gloss   ||w.gloss_ja||null,
                strong:   w.strong  ||w.strongs ||null,
                language: 'grc',
                corpusId,
                lemmaId:  w.lemmaId??w.lemma_id??null,
            }));
            const mapMs=performance.now()-tMap;
            await _joinEsGloss(t.key,t.ch,toks);

            tokenCache[cacheKey]=toks;
            return {t,toks,fetchMs,parseMs,mapMs,cached:false};
        }));

        /* ── フェーズ3: _indexChapter（シリアル、SEARCH_INDEX 更新） ── */
        for(const {t,toks,fetchMs,parseMs,mapMs,cached} of batchResults){
            const tIdx=performance.now();
            _indexChapter(toks);
            const indexMs=performance.now()-tIdx;
            if(!cached){
                const corpus=NT_BOOK_KEYS.has(t.key)?'NT':'LXX';
                _phTimings.push({key:t.key,ch:t.ch,corpus,
                    fetchMs,parseMs,mapMs,indexMs,tokCount:toks.length});
            }
        }

        await new Promise(r=>setTimeout(r,0));
    }

    _logPerfMeasure('data-load',`${tasks.length} chapters (${corpora?.join(',')||'all'}), ${ALL_TOKENS.length.toLocaleString()} tokens`);
    _logBuildPhaseTimings(_phTimings);

    /* NT の診断: NT 構築時のみ ἀφορίζω チェック */
    if(!corpusSet||corpusSet.has('NT')){
        const _diag2=ALL_TOKENS.filter(t=>t&&normalizeGreek(t.lemma||'')===normalizeGreek('ἀφορίζω'));
        console.info('[_buildFullIndex] ἀφορίζω tokens in ALL_TOKENS:',_diag2.length,
            _diag2.map(t=>({ref:t.ref,lemma:t.lemma,gi:t.globalIdx})));
    }
    /* IDX.ready 設定と _buildL3Background 呼び出しは _ensureFullIndex で管理する */
}

/* ──────────────────────────────────────────────────────────────────
   _logBuildPhaseTimings — フェーズ別タイミングの集計・ログ出力
   呼び出し元: _buildFullIndex（監査用、ロジックに影響しない）
   ────────────────────────────────────────────────────────────────── */
function _logBuildPhaseTimings(timings){
    if(!timings.length){console.warn('[buildPhaseTimings] タイミングデータなし');return;}

    const sumKey=(arr,k)=>arr.reduce((s,v)=>s+(v[k]||0),0);
    const maxKey=(arr,k)=>arr.reduce((m,v)=>Math.max(m,v[k]||0),0);
    const pct=(part,total)=>total>0?(part/total*100).toFixed(1)+'%':'—';
    const f=ms=>ms.toFixed(1)+'ms';

    const nt =timings.filter(t=>t.corpus==='NT');
    const lxx=timings.filter(t=>t.corpus==='LXX');

    function corpusSummary(label,arr){
        if(!arr.length) return;
        const sf=sumKey(arr,'fetchMs'), sp=sumKey(arr,'parseMs'),
              sm=sumKey(arr,'mapMs'),   si=sumKey(arr,'indexMs');
        const total=sf+sp+sm+si;
        const tok=arr.reduce((s,v)=>s+v.tokCount,0);
        const avgTok=(tok/arr.length).toFixed(0);
        console.log(
            `[phase][${label}]`,
            `ch:${arr.length} tok:${tok.toLocaleString()}(avg${avgTok}/ch)`,
            `| fetch:${f(sf)}(${pct(sf,total)})`,
            `  parse:${f(sp)}(${pct(sp,total)})`,
            `  map:${f(sm)}(${pct(sm,total)})`,
            `  index:${f(si)}(${pct(si,total)})`,
            `| 合計:${f(total)}`
        );
        console.log(
            `[phase][${label}] 最大章:`,
            `fetch_max=${f(maxKey(arr,'fetchMs'))}`,
            `parse_max=${f(maxKey(arr,'parseMs'))}`,
            `map_max=${f(maxKey(arr,'mapMs'))}`,
            `index_max=${f(maxKey(arr,'indexMs'))}`
        );
    }

    console.group('[_buildFullIndex] フェーズ別タイミング監査');
    corpusSummary('NT', nt);
    corpusSummary('LXX', lxx);
    corpusSummary('全体', timings);

    /* TOP20: 合計時間（fetch+parse+map+index）の遅い章 */
    const top20=[...timings]
        .sort((a,b)=>(b.fetchMs+b.parseMs+b.mapMs+b.indexMs)
                    -(a.fetchMs+a.parseMs+a.mapMs+a.indexMs))
        .slice(0,20);
    console.group('低速章 TOP20（fetch+parse+map+index 合計）');
    console.table(top20.map(t=>({
        章:       `${t.key} ${t.ch}`,
        corpus:   t.corpus,
        tokens:   t.tokCount,
        'fetch(ms)': t.fetchMs.toFixed(1),
        'parse(ms)': t.parseMs.toFixed(1),
        'map(ms)':   t.mapMs.toFixed(1),
        'index(ms)': t.indexMs.toFixed(1),
        'total(ms)': (t.fetchMs+t.parseMs+t.mapMs+t.indexMs).toFixed(1),
    })));
    console.groupEnd();

    /* 律速フェーズの自動判定 */
    const sf=sumKey(timings,'fetchMs'), sp=sumKey(timings,'parseMs'),
          sm=sumKey(timings,'mapMs'),   si=sumKey(timings,'indexMs');
    const total=sf+sp+sm+si;
    const bottleneck=[
        {name:'fetch', ms:sf},{name:'parse', ms:sp},
        {name:'tokenMap', ms:sm},{name:'indexChapter', ms:si},
    ].sort((a,b)=>b.ms-a.ms)[0];
    console.log(
        `[phase][律速判定] ボトルネック候補: ${bottleneck.name}`,
        `(${f(bottleneck.ms)}, ${pct(bottleneck.ms,total)} of total)`
    );
    console.log(
        '[phase][注意] fetch は BATCH=20 の並列実行のため実壁時間≠sum(fetchMs)。',
        `並列効果は最大${Math.min(20,timings.length)}倍。実効 fetch 時間 ≈ sum/BATCH = ${f(sf/20)}`
    );

    console.groupEnd();
}
/* QA-03: LXX（＋日本語索引）の構築完了を待つための Promise。
   ディープリンク初期化（initFromUrl）は NT 完了直後に検索を走らせるため、LXX 未完了のまま
   NT のみの件数を完成形として確定させてしまっていた。unifiedSearch({awaitLxx:true}) がこれを待つ。
   失敗・タイムアウト時も解決する（無期限に待たない）。 */
let _lxxDoneResolve=null;
const _lxxDonePromise=new Promise(r=>{_lxxDoneResolve=r;});
function _markLxxDone(){if(_lxxDoneResolve){_lxxDoneResolve();_lxxDoneResolve=null;}}
/* LXX 合流前（IDX.l3Ready 前）に実行された UI 検索の件数は暫定。暫定と明示し、合流完了後に同じ検索を1回だけ再実行して確定させる。 */
let _lxxRerunQuery=null;
function _noteProvisionalCount(countEl,query){
    const sub=document.createElement('span');
    sub.className='result-count-sub';sub.id='result-count-provisional';
    sub.textContent=_tf('search.status.provisional','七十人訳を読み込み中のため件数は暫定です');
    countEl.appendChild(sub);
    if(_lxxRerunQuery===query)return;
    _lxxRerunQuery=query;
    _lxxDonePromise.then(()=>{
        if(_lxxRerunQuery!==query)return;
        _lxxRerunQuery=null;
        const inp=document.getElementById('unified-search-input');
        if(IDX.l3Ready&&inp&&inp.value.trim()===query)unifiedSearch();
    });
}
async function _buildL3Background(){
    if(JP_PARTIAL_PREBUILT_CORPORA.has('NT')&&JP_PARTIAL_PREBUILT_CORPORA.has('LXX')){
        IDX.l3Ready=true;
        _markLxxDone();
        console.info('[search-index] Japanese partial index prebuilt ready');
        if(_prebuiltLoadMetrics.startedAt&&!_prebuiltLoadMetrics.readyRecorded){
            _prebuiltLoadMetrics.readyRecorded=true;
            _recordPrebuiltMetric('prebuilt-all-indexes-ready',_prebuiltLoadMetrics.startedAt,{
                ntReady:IDX.ready,lxxReady:JP_PARTIAL_PREBUILT_CORPORA.has('LXX'),japanesePartialReady:IDX.l3Ready,
                totalTokens:ALL_TOKENS.length
            });
        }
        return;
    }
    const BATCH=500;
    let offset=0;
    const tokens=ALL_TOKENS;
    while(offset<tokens.length){
        const slice=tokens.slice(offset,offset+BATCH);
        for(const tok of slice){
            const gIdx=tok.globalIdx;          // ★ SSOT: 配列位置ではなくglobalIdxを使用
            const jpVals=tok.japanese?(Array.isArray(tok.japanese)?tok.japanese:[tok.japanese]):(tok.gloss?[tok.gloss]:[]);
            for(const v of jpVals){if(v){addToIndex(SEARCH_INDEX.japanese,v,gIdx);_addJpPartial(v,gIdx);}}
        }
        offset+=BATCH;
        await new Promise(r=>setTimeout(r,0));
    }
    IDX.l3Ready=true;
    _markLxxDone();
}
let _fullIndexPromise=null;

/* Prebuilt index loader.
   Missing/stale/invalid generated assets are a normal fallback condition: the legacy
   browser builder remains the source of truth until the generated path is verified. */
let _prebuiltMetaPromise = null;
/* Runtime diagnostics separate network/JSON validation from merging so slow stages
   can be identified on real devices without changing index semantics. */
const _prebuiltLoadMetrics = { startedAt:0, stages:[], readyRecorded:false };
function _recordPrebuiltMetric(stage, startedAt, detail={}){
    const metric={stage,ms:Math.round((performance.now()-startedAt)*10)/10,...detail};
    _prebuiltLoadMetrics.stages.push(metric);
    console.info('[search-index][timing]',metric);
}
async function _loadPrebuiltMeta(){
    if(!_prebuiltMetaPromise){
        _prebuiltMetaPromise=(async()=>{
            const startedAt=performance.now();
            const res=await fetch('../search-index/meta.json');
            if(!res.ok)throw new Error('prebuilt search index meta unavailable');
            const meta=await res.json();
            if(meta.schemaVersion!==3||!meta.sourceVersion||!meta.corpora?.NT?.books||!meta.corpora?.LXX?.books){
                throw new Error('unsupported prebuilt index metadata');
            }
            _recordPrebuiltMetric('meta-fetch-parse-validate',startedAt,{status:res.status});
            return meta;
        })().catch(err=>{_prebuiltMetaPromise=null;throw err;});
    }
    return _prebuiltMetaPromise;
}
async function _fetchPrebuiltCorpus(corpus){
    const corpusStartedAt=performance.now();
    const meta=await _loadPrebuiltMeta();
    const descriptor=meta.corpora?.[corpus];
    if(!descriptor||!Array.isArray(descriptor.books)||!descriptor.books.length){
        throw new Error(`prebuilt ${corpus} book manifest unavailable`);
    }
    /* Fetch book shards concurrently; Promise.all preserves manifest order. */
    const shardMetrics={fetchMs:0,parseMs:0,validateMs:0};
    const shards=await Promise.all(descriptor.books.map(async book=>{
        const shardStartedAt=performance.now();
        if(!book||typeof book.bookKey!=='string'||typeof book.path!=='string'||!/^[-A-Z0-9]+\.json$/.test(book.path.split('/').pop())){
            throw new Error(`prebuilt ${corpus} invalid book manifest entry`);
        }
        const fetchStartedAt=performance.now();
        const res=await fetch(`../search-index/${book.path}`);
        shardMetrics.fetchMs+=performance.now()-fetchStartedAt;
        if(!res.ok)throw new Error(`prebuilt ${corpus} shard unavailable: ${book.bookKey}`);
        const parseStartedAt=performance.now();
        const data=await res.json();
        shardMetrics.parseMs+=performance.now()-parseStartedAt;
        const validateStartedAt=performance.now();
        if(data.schemaVersion!==meta.schemaVersion||data.sourceVersion!==meta.sourceVersion||
           data.corpus!==corpus||data.bookKey!==book.bookKey||!Array.isArray(data.tokens)||!data.index){
            throw new Error(`prebuilt ${corpus} shard metadata mismatch: ${book.bookKey}`);
        }
        if(data.tokenCount!==data.tokens.length||data.tokens.length===0||
           data.tokenCount!==book.tokenCount||data.globalIdxStart!==book.globalIdxStart||data.globalIdxEnd!==book.globalIdxEnd){
            throw new Error(`prebuilt ${corpus} shard count/range mismatch: ${book.bookKey}`);
        }
        if(!Number.isInteger(data.globalIdxStart)||!Number.isInteger(data.globalIdxEnd)||
           data.globalIdxEnd!==data.globalIdxStart+data.tokens.length-1){
            throw new Error(`prebuilt ${corpus} shard globalIdx metadata invalid: ${book.bookKey}`);
        }
        for(const key of ['lemma','text','strong','morph','textToJp','japanesePartial']){
            if(!data.index[key]||typeof data.index[key]!=='object')throw new Error(`prebuilt ${corpus} shard missing ${key}`);
        }
        /* Generated shards are versioned build artifacts. Exhaustively scanning every
           posting here delays first search on mobile; validate structure and boundary
           values at runtime, while the build-time generator remains responsible for
           producing complete, ordered postings. */
        for(const key of ['lemma','text','strong','morph','japanesePartial']){
            for(const [term,arr] of Object.entries(data.index[key])){
                if(!Array.isArray(arr)){
                    throw new Error(`prebuilt ${corpus} invalid postings for ${key}:${term}`);
                }
                if(arr.length){
                    const first=arr[0],last=arr[arr.length-1];
                    if(!Number.isInteger(first)||!Number.isInteger(last)||
                       first<data.globalIdxStart||first>data.globalIdxEnd||
                       last<data.globalIdxStart||last>data.globalIdxEnd){
                        throw new Error(`prebuilt ${corpus} invalid posting boundaries for ${key}:${term}`);
                    }
                }
            }
        }
        shardMetrics.validateMs+=performance.now()-validateStartedAt;
        return data;
    }));
    _recordPrebuiltMetric('corpus-fetch-parse-validate',corpusStartedAt,{
        corpus,shards:shards.length,tokens:descriptor.tokenCount,
        summedFetchMs:Math.round(shardMetrics.fetchMs),
        summedParseMs:Math.round(shardMetrics.parseMs),
        summedValidateMs:Math.round(shardMetrics.validateMs)
    });
    let expectedStart=corpus==='NT'?0:meta.corpora.NT.tokenCount;
    let totalTokens=0;
    for(const shard of shards){
        if(shard.globalIdxStart!==expectedStart)throw new Error(`prebuilt ${corpus} shard sequence has a gap at ${shard.bookKey}`);
        expectedStart=shard.globalIdxEnd+1;
        totalTokens+=shard.tokenCount;
    }
    if(totalTokens!==descriptor.tokenCount)throw new Error(`prebuilt ${corpus} aggregate token count mismatch`);
    return shards;
}
function _mergePrebuiltCorpus(data){
    const mergeStartedAt=performance.now();
    const expectedStart=ALL_TOKENS.length;
    if(data.globalIdxStart!==expectedStart||data.globalIdxEnd!==expectedStart+data.tokens.length-1)throw new Error('prebuilt globalIdx range mismatch');
    for(let i=0;i<data.tokens.length;i++){
        const tok=data.tokens[i];
        if(!tok||tok.globalIdx!==expectedStart+i)throw new Error('prebuilt token order/globalIdx mismatch');
    }
    for(const tok of data.tokens)ALL_TOKENS.push(tok);
    for(const name of ['lemma','text','strong']){
        const target=SEARCH_INDEX[name];
        for(const [key,arr] of Object.entries(data.index[name])){
            let current=target.get(key);
            if(!current){current=[];target.set(key,current);}
            for(const idx of arr)current.push(idx);
        }
    }
    for(const [key,value] of Object.entries(data.index.textToJp)){
        if(!TEXT_TO_JP.has(key))TEXT_TO_JP.set(key,value);
    }
    for(const [term,arr] of Object.entries(data.index.japanesePartial)){
        let current=JP_PARTIAL_INDEX.get(term);
        if(!current){current=new Set();JP_PARTIAL_INDEX.set(term,current);}
        for(const idx of arr)current.add(idx);
    }
    JP_PARTIAL_PREBUILT_CORPORA.add(data.corpus);
    /* lemmaIndex and morphIndex are materialized directly from generated postings. */
    if(!window.lemmaIndex)window.lemmaIndex=new Map();
    for(const [key,arr] of Object.entries(data.index.lemma)){
        let current=window.lemmaIndex.get(key);
        if(!current){current=[];window.lemmaIndex.set(key,current);}
        for(const idx of arr)current.push(idx);
    }
    if(!window.morphIndex)window.morphIndex=new Map();
    for(const [key,arr] of Object.entries(data.index.morph)){
        let current=window.morphIndex.get(key);
        if(!current){current=[];window.morphIndex.set(key,current);}
        for(const idx of arr)current.push(idx);
    }
    /* Arrays are already ordered within each corpus; NT precedes LXX globally. */
    _recordPrebuiltMetric('shard-merge',mergeStartedAt,{
        corpus:data.corpus,bookKey:data.bookKey,tokens:data.tokens.length,
        indexKeys:Object.fromEntries(['lemma','text','strong','morph','textToJp','japanesePartial'].map(k=>[k,Object.keys(data.index[k]||{}).length]))
    });
}

function detectQueryType(query){
    if(/[ἀ-῾Α-Ω]/u.test(query))return'greek';
    if(/[ぁ-んァ-ヶ一-龠]/.test(query))return'japanese';
    if(/^[Gg]?\d+$/.test(query))return'strong';
    if(_isLatinWord(query))return'japanese'; // 英単語は UI 言語によらず語義（英語グロス）照合へ（#31）
    return'text';
}
function searchGreek(tokens,word){
    const normWord=normalizeGreek(word);
    if(IDX.ready){
        const s=new Set();
        for(const arr of[
            SEARCH_INDEX.text.get(word),SEARCH_INDEX.lemma.get(word),
            normWord!==word?SEARCH_INDEX.text.get(normWord):null,
            normWord!==word?SEARCH_INDEX.lemma.get(normWord):null,
        ]){if(arr)for(const i of arr)s.add(i);}
        return s;
    }
    const s=new Set();
    tokens.forEach(t=>{
        if(t.text===word||t.lemma===word){s.add(t.globalIdx);return;}
        if(normalizeGreek(t.text)===normWord||normalizeGreek(t.lemma)===normWord)s.add(t.globalIdx);
    });
    return s;
}
function searchJapanese(tokens,word){
    if(_enMode())return _enGlossSet(word);
    if(_isLatinWord(word))return new Set(); /* 非 EN UI の英字語は単語検索（unifiedSearch）だけが英語グロスで引く。近接・フレーズ等は従来どおり（#31） */
    return _searchJapaneseCore(tokens,word);
}
/* 日本語の語義照合の本体（UI 言語に依存しない）。searchJapanese の挙動は不変。
   英語の別名で概念が発火したときも、日本語 UI と同じ展開結果にするためにここを直接呼ぶ（#33） */
function _searchJapaneseCore(tokens,word){
    if(IDX.l3Ready){const s=JP_PARTIAL_INDEX.get(word);return s||new Set();}
    const s=new Set();
    tokens.forEach(t=>{
        const vals=t.japanese?(Array.isArray(t.japanese)?t.japanese:[t.japanese]):[];
        if(vals.some(v=>v&&v.includes(word))){s.add(t.globalIdx);return;}
        if(t.gloss&&t.gloss.includes(word))s.add(t.globalIdx);
    });
    return s;
}
function searchStrong(tokens,word){
    const normWord=normalizeStrong(word);
    if(IDX.ready){const arr=SEARCH_INDEX.strong.get(normWord);return arr?new Set(arr):new Set();}
    const s=new Set();
    tokens.forEach(t=>{if(normalizeStrong(t.strong)===normWord)s.add(t.globalIdx);});
    return s;
}
/* ============================================================
   Term 抽象（Pattern Search Phase 1）
   検索条件を「軸 + 値」の Term オブジェクトで表す共通モデル。
   resolveTerm() が唯一の解決器（Term → Set<globalIdx>）で、
   既存の resolveIndices() はクエリ文字列を termFromQuery() で
   Term へ変換してここに委譲する（挙動は完全に不変 — 委譲先は
   従来と同じ searchGreek / searchJapanese / searchStrong）。

   Term 形式:
     { axis: 'lemma'|'japanese'|'strong'|'morph', value: string }
     morph は2形式:
       { axis:'morph', value:'V-PAM-2P' }                 … morphタグ完全一致
       { axis:'morph', field:'mood', value:'imperative' } … 分解フィールド一致
         field: pos | tense | voice | mood | case | number | gender | person
         value: トークンの英語小文字値（例 imperative / subjunctive / aorist）

   将来の共起検索（Phase 2）は、resolveTerm が返す Set<globalIdx>
   同士の距離/節スコープの集合演算としてこの上に載せる。
   解決ロジックを resolveTerm の外に増やさないこと。
   ============================================================ */
const _MORPH_TERM_FIELDS = ['tense','voice','mood','case','number','gender','person'];

/* 英語値 → morphタグ1文字（Robinson-Pierpont。_morphMatchesPatternVerbose と同じ体系） */
const _MORPH_TAG_CODE = {
    tense:  { present:'P', imperfect:'I', future:'F', aorist:'A', perfect:'X', pluperfect:'Z' },
    voice:  { active:'A', middle:'M', passive:'P' },
    mood:   { indicative:'I', subjunctive:'S', optative:'O', imperative:'M', infinitive:'N', participle:'P' },
    case:   { nominative:'N', genitive:'G', dative:'D', accusative:'A', vocative:'V' },
    number: { singular:'S', plural:'P' },
    gender: { masculine:'M', feminine:'F', neuter:'N' },
    person: { '1':'1', '2':'2', '3':'3' },
};

/* morphタグから分解フィールドの1文字コードを取り出す。
   動詞: V-[tense][voice][mood](-[person][num] | 分詞は -[case][num][gen])
   名詞類: POS-([person])[case][num][gen] */
function _morphFieldFromTag(morph, field) {
    const parts = String(morph || '').split('-');
    if ((parts[0] || '') === 'V') {
        const tvm = parts[1] || '', tail = parts[2] || '';
        if (field === 'tense') return tvm[0] || '';
        if (field === 'voice') return tvm[1] || '';
        if (field === 'mood')  return tvm[2] || '';
        if (tvm[2] === 'P') {   /* 分詞: tail = case/num/gen */
            if (field === 'case')   return tail[0] || '';
            if (field === 'number') return tail[1] || '';
            if (field === 'gender') return tail[2] || '';
            return '';
        }
        if (field === 'person') return tail.length >= 2 ? tail[0] : '';
        if (field === 'number') return tail ? tail[tail.length - 1] : '';
        return '';
    }
    const seg = parts[1] || '';
    const hasPerson = ['1', '2', '3'].includes(seg[0]);
    const b = hasPerson ? seg.slice(1) : seg;
    if (field === 'case')   return b[0] || '';
    if (field === 'number') return b[1] || '';
    if (field === 'gender') return b[2] || '';
    if (field === 'person') return hasPerson ? seg[0] : '';
    return '';
}

function _resolveMorphTerm(tokens, term) {
    const s = new Set();
    /* 形式1: morphタグ完全一致。全トークン対象なら既存 morphIndex を利用 */
    if (!term.field) {
        if (tokens === ALL_TOKENS && window.morphIndex) {
            for (const gi of (window.morphIndex.get(term.value) || [])) s.add(gi);
            return s;
        }
        for (const t of tokens) { if (t.morph === term.value) s.add(t.globalIdx); }
        return s;
    }
    /* 形式2: 分解フィールド一致。
       トークンに平坦フィールド（mood 等）があればそれを照合し、
       無ければ morphタグから解読する（search-tool の軽量トークンはタグのみ）。
       value は英語小文字（imperative 等）またはタグ1文字（M 等）を受ける */
    const field = String(term.field).toLowerCase();
    const val   = String(term.value).toLowerCase();
    if (field === 'pos') {
        for (const t of tokens) {
            const posTag = String(t.morph || '').split('-')[0].toLowerCase();
            if (posTag === val || String(t.class || '').toLowerCase() === val) s.add(t.globalIdx);
        }
        return s;
    }
    if (!_MORPH_TERM_FIELDS.includes(field)) return s;
    const code = (_MORPH_TAG_CODE[field] || {})[val]
        || (String(term.value).length === 1 ? String(term.value).toUpperCase() : null);
    for (const t of tokens) {
        const flat = t[field];
        if (flat) {
            /* 英語値の直接一致に加え、タグ1文字指定（M 等）でも
               平坦フィールドを英語→コード変換して一致させる */
            const flatLower = String(flat).toLowerCase();
            if (flatLower === val ||
                (code && (_MORPH_TAG_CODE[field] || {})[flatLower] === code)) {
                s.add(t.globalIdx);
            }
            continue;
        }
        if (code && _morphFieldFromTag(t.morph, field) === code) s.add(t.globalIdx);
    }
    return s;
}

function resolveTerm(tokens, term) {
    if (!term || !term.axis || term.value == null || term.value === '') return new Set();
    switch (term.axis) {
        /* lemma 軸は既存 searchGreek と同一挙動（表層形/lemma の正規化一致）。
           resolveIndices の後方互換を最優先し Phase 1 では分離しない */
        case 'lemma':    return searchGreek(tokens, term.value);
        case 'japanese': return searchJapanese(tokens, term.value);
        case 'strong':   return searchStrong(tokens, term.value);
        case 'morph':    return _resolveMorphTerm(tokens, term);
        default:         return new Set();
    }
}

/* クエリ文字列 → Term（既存 detectQueryType の分類をそのまま写像） */
function termFromQuery(word) {
    const qtype = detectQueryType(word);
    if (qtype === 'japanese') return { axis: 'japanese', value: word };
    if (qtype === 'strong')   return { axis: 'strong',   value: word };
    return { axis: 'lemma', value: word };
}

function resolveIndices(tokens,word){
    return resolveTerm(tokens, termFromQuery(word));
}
function matchToken(tok,word){
    if(!word)return false;
    const qtype=detectQueryType(word);
    if(qtype==='japanese'){
        if(_enMode())return _enGlossHas(tok,word);
        if(_isLatinWord(word))return false; /* 従来（'text' 扱い＝ギリシャ語比較のみ）と同じ */
        const vals=tok.japanese?(Array.isArray(tok.japanese)?tok.japanese:[tok.japanese]):[];
        if(vals.some(v=>v&&v.includes(word)))return true;
        return!!(tok.gloss&&tok.gloss.includes(word));
    }
    if(qtype==='strong')return normalizeStrong(tok.strong)===normalizeStrong(word);
    return tok.text===word||tok.lemma===word
        ||normalizeGreek(tok.text)===normalizeGreek(word)
        ||normalizeGreek(tok.lemma)===normalizeGreek(word);
}

/* lemmaIndex */
function buildLemmaIndex(tokens){
    const idx=new Map();
    for(const tok of tokens){
        const gIdx=tok.globalIdx;          // ★ SSOT
        const key=tok.lemma||tok.text||'';
        if(!key)continue;
        let arr=idx.get(key);if(!arr){arr=[];idx.set(key,arr);}arr.push(gIdx);
        const norm=normalizeGreek(key);
        if(norm&&norm!==key){let narr=idx.get(norm);if(!narr){narr=[];idx.set(norm,narr);}narr.push(gIdx);}
    }
    for(const arr of idx.values())arr.sort((a,b)=>a-b);
    return idx;
}
function searchByLemma(lemma){
    const idx = window.lemmaIndex;
    if (!idx) {
        console.warn('[searchByLemma] window.lemmaIndex is not built yet');
        return [];
    }

    const norm = normalizeGreek(String(lemma || ""));
    const result = idx.get(norm);

    if (!result || result.length === 0) {
        // Sample up to 5 keys that are close (by norm prefix) to help diagnose
        const prefix = norm.slice(0, 4);
        const nearKeys = [];
        for (const k of idx.keys()) { if (k.startsWith(prefix)) nearKeys.push(k); if (nearKeys.length >= 5) break; }
        console.warn('[searchByLemma] 0 hits', {
            inputLemma: lemma,
            norm,
            inputBytes: [...lemma].map(c=>'U+'+c.codePointAt(0).toString(16).toUpperCase()),
            normBytes:  [...norm].map(c=>'U+'+c.codePointAt(0).toString(16).toUpperCase()),
            idxSize: idx.size,
            nearKeys,
        });
    } else {
        console.info('[searchByLemma]', {lemma, norm, hits: result.length});
    }

    return result || [];
}
/* 性能計測ヘルパー（監査用。ロジックには影響しない） */
function _logPerfMeasure(name, note) {

    const dur = performance.getEntriesByName(name).pop().duration;
    console.log(`[perf] ${name}${note ? ' (' + note + ')' : ''}: ${dur.toFixed(1)} ms`);
    performance.clearMarks(name + '-start');
    performance.clearMarks(name + '-end');
    performance.clearMeasures(name);
}

function _rebuildMorphIndexIfNeeded(){

    if(window.morphIndex){
        console.log('[perf] morphIndex: _rebuildMorphIndexIfNeeded — 構築済みのためスキップ');
        return;
    }

/* phraseSearch — globalIdx SSOT版
   lemmaIndex の値はすべて globalIdx の配列。
   連続判定は「anchorGlobalIdx + k+1」という配列オフセット加算ではなく
   「後続語の globalIdx === anchorGlobalIdx + k+1」という globalIdx差分で行う。
   ALL_TOKENS[gi] によるトークン復元も globalIdx 経由で行う。          */
function searchPhrase(lemmas){
    const idx=window.lemmaIndex;
    if(!idx)return[];
    if(!lemmas||lemmas.length===0)return[];
    // lists[k] = globalIdx の配列（lemmaIndex の値はすべて globalIdx）
    const lists=lemmas.map(l=>{
        const norm = normalizeGreek(String(l || ""));
        return idx.get(norm) || [];
    });
    if(lists.some(arr=>arr.length===0))return[];
    // sets[k] = lists[k+1] を Set 化（globalIdx の集合）
    const first=lists[0],results=[],sets=lists.slice(1).map(arr=>new Set(arr));
    for(let i=0;i<first.length;i++){
        const anchorGi=first[i];  // anchorGi は globalIdx
        let match=true;
        for(let k=0;k<sets.length;k++){
            // ★ 連続判定: 次語の globalIdx = anchorGi + (k+1)
            if(!sets[k].has(anchorGi+k+1)){match=false;break;}
        }
        if(match)results.push(anchorGi);  // 戻り値は globalIdx
    }
    return results;
}

/* searchPhraseJapanese — 日本語グロスによる連続フレーズ検索
   words: 空白で分割した日本語グロスの配列
   JP_PARTIAL_INDEX をアンカー候補に使い、連続するトークンのグロスと照合する */
function searchPhraseJapanese(words){
    if(!words||words.length===0)return[];
    const first=words[0];
    // アンカー候補: 最初の語にマッチするglobalIdx一覧
    let candidates;
    if(_enMode()){
        candidates=[..._enGlossSet(first)];
    }else if(IDX.l3Ready){
        candidates=[...(JP_PARTIAL_INDEX.get(first)||new Set())];
    }else{
        candidates=[];
        ALL_TOKENS.forEach(t=>{
            const vals=t.japanese?(Array.isArray(t.japanese)?t.japanese:[t.japanese]):(t.gloss?[t.gloss]:[]);
            if(vals.some(v=>v&&v.includes(first)))candidates.push(t.globalIdx);
        });
    }
    if(candidates.length===0)return[];
    if(words.length===1)return candidates;

    const results=[];
    for(const anchorGi of candidates){
        let match=true;
        for(let k=1;k<words.length;k++){
            const nextTok=ALL_TOKENS[anchorGi+k];
            if(!nextTok){match=false;break;}
            const vals=nextTok.japanese
                ?(Array.isArray(nextTok.japanese)?nextTok.japanese:[nextTok.japanese])
                :(nextTok.gloss?[nextTok.gloss]:[]);
            if(_enMode()?!_enGlossHas(nextTok,words[k]):!vals.some(v=>v&&v.includes(words[k]))){match=false;break;}
        }
        if(match)results.push(anchorGi);
    }
    return results;
}

/* proximitySearch */
async function runProximitySearch({word1,word2=null,distance=5,scope='all',ref:_ref=''}){
    const tokens=await loadTokensForScope(scope,_ref);
    // resolveIndices は globalIdx の Set を返す
    const w1Set=resolveIndices(tokens,word1);
    const w1GiList=[...w1Set].sort((a,b)=>a-b);  // globalIdx のリスト
    const w2Set=word2?resolveIndices(tokens,word2):new Set();
    const coocMap=new Map(),hits=[];
    // _giToTok: globalIdx → token の高速ルックアップ（ALL_TOKENS は gIdx連番）
    const _allToks=ALL_TOKENS;
    const _giToTok=gi=>_allToks[gi];
    for(const anchorGi of w1GiList){
        // ★ ウィンドウ境界も globalIdx で計算
        const winStart=Math.max(0,anchorGi-distance);
        const winEnd=Math.min(_allToks.length-1,anchorGi+distance);
        if(word2){
            let found=false;
            for(let gi=winStart;gi<=winEnd;gi++){
                // ★ w2 との距離判定 = globalIdx差分
                if(gi!==anchorGi&&w2Set.has(gi)){found=true;break;}
            }
            if(!found)continue;
        }
        // ★ anchorIdx = anchorGi（globalIdx）。ref は持たない（表示専用）
        hits.push({anchorIdx:anchorGi,start:winStart,end:winEnd,tokens:_allToks});
        for(let gi=winStart;gi<=winEnd;gi++){
            if(gi===anchorGi)continue;
            const t=_giToTok(gi);
            if(!t||!t.text||t.text.length<2)continue;
            if(STOP_WORDS.has(t.text))continue;
            if(w1Set.has(gi))continue;
            // ★ 距離重み = 1 / (globalIdx差 + 1)
            const dist=Math.abs(gi-anchorGi);
            const w=1/(dist+1),key=t.text;
            const e=coocMap.get(key)||{weightedScore:0,rawCount:0};
            e.weightedScore+=w;e.rawCount+=1;
            coocMap.set(key,e);
        }
    }
    return{coocMap,hits,totalW1:w1GiList.length};
}

/* ============================================================
   Term 共起検索（Pattern Search Phase 2）
   Phase 1 の resolveTerm を使い、Term × Term の共起を検索する。
   runProximitySearch（語×語）は変更しない並行実装で、戻り値は
   同じ形式 {coocMap, hits, totalW1}（hits[].anchorIdx/start/end/tokens）。
   既存の描画・グルーピング（groupHitsByLemma 等）がそのまま使える。

   options:
     scope:    'verse'（既定）… 同一節内（token.ref の節キー）に
                termB のトークンが（anchor 自身とは別に）存在する
               'window'        … 既存と同一の globalIdx 距離窓
     distance: 窓の半径（scope='window' のみ・既定 5）

   例（互いに＋命令形）:
     runTermProximitySearch(
         { axis:'lemma', value:'ἀλλήλων' },
         { axis:'morph', field:'mood', value:'imperative' },
         { scope:'verse' })

   制約: 新インデックス禁止（実行時の集合演算のみ）。
         Wallace registry / ClauseAnalyzer には触れない。
   ============================================================ */
function _verseKeyOf(tok) {
    /* ref 'MAT 2:13!22' → 'MAT 2:13'。ref が無い場合は構造フィールドから組み立てる */
    if (tok.ref) return String(tok.ref).split('!')[0];
    return `${tok.bookKey || tok.book || ''} ${tok.ch ?? tok.chapter ?? ''}:${tok.verse ?? ''}`;
}

async function runTermProximitySearch(termA, termB, options = {}) {
    const scope    = options.scope || 'verse';
    const distance = options.distance ?? 5;
    await _ensureFullIndex();
    const _allToks = ALL_TOKENS;
    const _giToTok = gi => _allToks[gi];

    const aSet = resolveTerm(_allToks, termA);
    const bSet = termB ? resolveTerm(_allToks, termB) : new Set();
    const aGiList = [...aSet].sort((x, y) => x - y);
    const coocMap = new Map(), hits = [];

    /* verse スコープ用: 節キー → termB トークンの globalIdx 一覧 */
    let bByVerse = null;
    if (scope === 'verse' && termB) {
        bByVerse = new Map();
        for (const gi of bSet) {
            const t = _giToTok(gi);
            if (!t) continue;
            const key = _verseKeyOf(t);
            let arr = bByVerse.get(key);
            if (!arr) { arr = []; bByVerse.set(key, arr); }
            arr.push(gi);
        }
    }

    /* anchor の節境界を globalIdx 連番上で前後に歩いて求める（節は連続配置） */
    function _verseBounds(anchorGi) {
        const key = _verseKeyOf(_giToTok(anchorGi));
        let s = anchorGi, e = anchorGi;
        while (s > 0 && _giToTok(s - 1) && _verseKeyOf(_giToTok(s - 1)) === key) s--;
        while (e < _allToks.length - 1 && _giToTok(e + 1) && _verseKeyOf(_giToTok(e + 1)) === key) e++;
        return [s, e];
    }

    for (const anchorGi of aGiList) {
        let winStart, winEnd;
        if (scope === 'verse') {
            /* 共起判定: 同じ節に anchor 自身以外の termB トークンがあるか */
            if (termB) {
                const arr = bByVerse.get(_verseKeyOf(_giToTok(anchorGi)));
                if (!arr || !arr.some(gi => gi !== anchorGi)) continue;
            }
            [winStart, winEnd] = _verseBounds(anchorGi);
        } else {
            winStart = Math.max(0, anchorGi - distance);
            winEnd   = Math.min(_allToks.length - 1, anchorGi + distance);
            if (termB) {
                let found = false;
                for (let gi = winStart; gi <= winEnd; gi++) {
                    if (gi !== anchorGi && bSet.has(gi)) { found = true; break; }
                }
                if (!found) continue;
            }
        }
        hits.push({ anchorIdx: anchorGi, start: winStart, end: winEnd, tokens: _allToks });
        /* coocMap は既存 runProximitySearch と同じ重み付け・除外規則 */
        for (let gi = winStart; gi <= winEnd; gi++) {
            if (gi === anchorGi) continue;
            const t = _giToTok(gi);
            if (!t || !t.text || t.text.length < 2) continue;
            if (STOP_WORDS.has(t.text)) continue;
            if (aSet.has(gi)) continue;
            const dist = Math.abs(gi - anchorGi);
            const w = 1 / (dist + 1), key = t.text;
            const e = coocMap.get(key) || { weightedScore: 0, rawCount: 0 };
            e.weightedScore += w; e.rawCount += 1;
            coocMap.set(key, e);
        }
    }
    return { coocMap, hits, totalW1: aGiList.length };
}

/* ============================================================
   パターン検索プリセット（Pattern Search Phase 3）
   search-patterns.json（保存された Term クエリ）を読み込み、
   空状態画面にチップとして表示する。実行は
   runTermProximitySearch（Phase 2）のみ — 新しい検索エンジン・
   インデックス・Wallace registry / ClauseAnalyzer には触れない。
   結果表示は既存の統合検索レンダラ（_renderUnifiedResults）を
   そのまま再利用する（prox レイヤーと同じグローバル形状に詰める）。
   読み込み失敗時は入口が出ないだけで、既存UI・既存検索は不変。
   ============================================================ */
let SEARCH_PATTERNS = [];

/* ============================================================
   概念検索（Concept Search Phase 4-1）
   Concept は「日本語の検索語 → Term[]」への展開だけを担う層。
   検索は実行しない（実行は既存 resolveTerm / 既存レイヤーのみ）。
   一方向: query → resolveConcept() → Term[] → resolveTerm() → 検索。
   label / aliases への完全一致でのみ発火し、未登録語は null を返す
   （＝既存検索を100%維持する後方互換が絶対条件）。
   ============================================================ */
let SEARCH_CONCEPTS = [];

async function _loadSearchConcepts() {
    try {
        const r = await fetch('../assets/data/search-concepts.json');
        if (!r.ok) return;
        const data = await r.json();
        if (!data || !Array.isArray(data.concepts)) return;
        /* Phase 4-2 schema: terms 以外（patterns/domains/syntaxTypes/related/children）
           は Knowledge Graph の土台としてデータのみ保持し、検索には使わない。
           型検証: 必須（id/label/terms）を満たすものだけ採用し、
           拡張フィールドは常に配列へ正規化する（欠落・型違いは空配列）。 */
        const arr = v => (Array.isArray(v) ? v : []);
        SEARCH_CONCEPTS = data.concepts
            .filter(c => c && c.id && c.label && Array.isArray(c.terms) && c.terms.length > 0)
            .map(c => ({
                id:          c.id,
                label:       c.label,
                label_en:    typeof c.label_en === 'string' ? c.label_en : '',
                aliases:     arr(c.aliases),
                aliases_en:  arr(c.aliases_en).filter(a => typeof a === 'string').map(a => a.toLowerCase()),
                label_es:    typeof c.label_es === 'string' ? c.label_es : '',
                aliases_es:  arr(c.aliases_es).filter(a => typeof a === 'string').map(a => a.toLowerCase()),
                terms:       c.terms,
                patterns:    arr(c.patterns),
                domains:     arr(c.domains),
                syntaxTypes: arr(c.syntaxTypes),
                related:     arr(c.related),
                children:    arr(c.children),
            }));
        _renderConceptDiscoveryChips();
    } catch (_) { /* 失敗 = Concept 層が無いだけ（既存検索は不変） */ }
}

/* 空き状態「テーマから探す」チップ — Top 8 Concept を発見入口として提示 */
const CONCEPT_DISCOVERY_IDS = ['love','prayer','faith','salvation','sin','christ','cross','resurrection'];

function _renderConceptDiscoveryChips() {
    const sec  = document.getElementById('concept-discovery-section');
    const wrap = document.getElementById('concept-discovery-chips');
    if (!sec || !wrap || SEARCH_CONCEPTS.length === 0) return;
    const top = CONCEPT_DISCOVERY_IDS
        .map(id => SEARCH_CONCEPTS.find(c => c.id === id))
        .filter(Boolean);
    if (top.length === 0) return;

    top.forEach(concept => {
        const chip = document.createElement('span');
        chip.className = 'ex-chip';
        chip.textContent = concept.label;
        chip.addEventListener('click', () => _exampleSearch(concept.label));
        wrap.appendChild(chip);
    });
    sec.style.display = '';
}

/* 発火判定の唯一の入口（resolveConcept / _findConceptByQuery 共通）。
   日本語の label／aliases は従来どおり完全一致。allowEn のときだけ、英語の
   label_en／aliases_en にも小文字化して完全一致で発火する（UI 言語によらない。
   単語1語の検索のみ allowEn=true で呼ばれる）。戻り値: {concept, via:'ja'|'en'} または null */
/* #59: スペイン語の語（アクセント付き）も Latin 文字として扱う。照合はアクセントと大文字小文字を無視（oración＝oracion）。 */
function _isLatinLetters(w){return /^[\p{Script=Latin}][\p{Script=Latin}'’]*$/u.test(String(w==null?'':w));}
function _noAccent(w){return String(w==null?'':w).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function _matchConcept(query, allowEn) {
    const q = String(query || '').trim();
    if (!q || SEARCH_CONCEPTS.length === 0) return null;
    for (const c of SEARCH_CONCEPTS) {
        if (c.label === q || (Array.isArray(c.aliases) && c.aliases.includes(q))) return { concept: c, via: 'ja' };
    }
    if (allowEn && _isLatinWord(q)) {
        const ql = q.toLowerCase();
        for (const c of SEARCH_CONCEPTS) {
            if ((c.label_en && c.label_en.toLowerCase() === ql) || c.aliases_en.includes(ql)) return { concept: c, via: 'en' };
        }
    }
    /* スペイン語（#59）: UI 言語によらず、label_es／aliases_es にも単語1語の完全一致（アクセント無視）で発火する。英語の照合が先（概念間の衝突は無いことを確認済み） */
    if (allowEn && _isLatinLetters(q)) {
        const qa = _noAccent(q);
        for (const c of SEARCH_CONCEPTS) {
            if ((c.label_es && _noAccent(c.label_es) === qa) || c.aliases_es.some(a => _noAccent(a) === qa)) return { concept: c, via: 'es' };
        }
    }
    return null;
}

/* 検索語 → Term[]（Concept 未登録なら null）。検索は実行しない */
function resolveConcept(query, allowEn) {
    const m = _matchConcept(query, allowEn);
    return m ? m.concept.terms.slice() : null;
}

/* ============================================================
   Concept Insight（Phase 4-3・表示のみ）
   Concept 発火時に検索結果の上部へ知識カードを描くだけの層。
   検索件数・順位・ロジックには一切関与しない（データ源は
   search-concepts.json のみ。Wallace Registry は参照しない —
   syntaxTypes の表示ラベルは JSON 側に写しを持つ）。
   クリックは既存機能の呼び出しのみ:
     関連する概念 → 検索ボックスへ label を入れて unifiedSearch()
     関連する検索 → runPatternSearch()
     関連する文法 → _synInit()（既存の Wallace 型検索）
   ============================================================ */
let _activeInsightConcept = null;
let _conceptViaEn = false;   /* 直近の検索が英語・スペイン語の別名（label_en／aliases_en／label_es／aliases_es）で概念発火したか。英語グロス検索の注記・併記の抑止に使う */

function _findConceptByQuery(q, allowEn) {
    const m = _matchConcept(q, allowEn);
    return m ? m.concept : null;
}
/* UI 言語に応じた概念名: EN は label_en、ES は label_es（無ければ従来の label）。JA は常に label */
function _esMode(){return !!(window.I18N&&I18N.lang==='es');}
function _cLabel(c) { return (_enMode() && c.label_en) || (_esMode() && c.label_es) || c.label; }
/* 概念チップのクリックで検索ボックスへ入れる語。EN は発火できる1語（label_en が1語ならそれ、複数語なら aliases_en の先頭）。JA は label のまま。ES は label_es が1語ならそれ、複数語なら aliases_es の先頭 */
function _cSearchWord(c) {
    if (_esMode()) {
        if (c.label_es && !/\s/.test(c.label_es)) return c.label_es;
        return (c.aliases_es && c.aliases_es[0]) || c.label;
    }
    if (!_enMode()) return c.label;
    if (c.label_en && !/\s/.test(c.label_en)) return c.label_en;
    return (c.aliases_en && c.aliases_en[0]) || c.label;
}
function _conceptById(id) {
    return SEARCH_CONCEPTS.find(c => c.id === id) || null;
}

function _renderConceptInsight(concept) {
    const el = document.getElementById('concept-insight');
    if (!el) return;
    if (!concept) { el.style.display = 'none'; el.innerHTML = ''; return; }

    const rel = (concept.related || []).map(id => _conceptById(id)).filter(Boolean);
    const pats = (concept.patterns || []).map(pid => {
        const i = SEARCH_PATTERNS.findIndex(p => p.id === pid);
        return i >= 0 ? { i, label: _patLabel(SEARCH_PATTERNS[i]) } : null;
    }).filter(Boolean);
    const syns = (concept.syntaxTypes || []).map(s =>
        typeof s === 'string' ? { id: s, label: s }
        : (s && s.id ? { id: s.id, label: (_enMode() && s.label_en) || (_esMode() && s.label_es) || s.label || s.id } : null)).filter(Boolean);

    /* 空のセクションは見出しごと出さない（「関連する文法」空配列時の非表示を含む） */
    const sec = (title, chips) => chips
        ? `<div class="ci-section"><div class="ci-section-title">${title}</div>
           <div class="layer-chips ci-chips">${chips}</div></div>` : '';
    const _REL_FOLD = 8;
    const _mkRelChip = c =>
        `<span class="layer-chip lemma" data-concept-label="${_escH(_cSearchWord(c))}">${_escH(_cLabel(c))}</span>`;
    const relHtml = rel.length <= _REL_FOLD
        ? rel.map(_mkRelChip).join('')
        : rel.slice(0, _REL_FOLD).map(_mkRelChip).join('')
            + `<button class="ci-related-more-btn" onclick="this.style.display='none';this.nextElementSibling.style.display='contents'">${_tf('search.ci.more','さらに表示 ({n})',{n:rel.length - _REL_FOLD})}</button>`
            + `<span style="display:none">${rel.slice(_REL_FOLD).map(_mkRelChip).join('')}</span>`;
    const patHtml = pats.map(p =>
        `<span class="layer-chip prox" onclick="runPatternSearch(${p.i})">${_escH(p.label)}</span>`).join('');
    const synHtml = syns.map(s =>
        `<span class="layer-chip morph" data-syntax-id="${_escH(s.id)}">${_escH(s.label)}</span>`).join('');

    /* 関連するギリシャ語（Phase 6-2）: 「日本語概念 → ギリシャ語語彙 → 語義 →
       文法/用例」の読書導線。件数は既存 resolveTerm を呼ぶだけ（表示専用 —
       検索結果・件数には一切関与しない）。グロス未取得・出現0の行は非表示。
       行クリックは既存の Abbott-Smith 辞書モーダル（_asOpen）を再利用する */
    let lexHtml = '';
    try {
        if (typeof ALL_TOKENS !== 'undefined' && ALL_TOKENS.length > 0) {
            const rows = [];
            for (const t of (concept.terms || [])) {
                if (!t || t.axis !== 'lemma') continue;
                const set = resolveTerm(ALL_TOKENS, t);
                if (set.size === 0) continue;                     /* 未出現は非表示 */
                /* 語義: グロスを持つ出現を探す（LXX トークンは japanese が無い
                   ことがあるため、先頭1件でなく上限つきで走査する） */
                let gloss = '';
                let probes = 0;
                if (_enMode() || _esMode()) {
                    /* EN/ES: グループバーと同じ「最頻グロス」に揃える（先頭トークンの活用形グロスにしない） */
                    const gc = new Map();
                    for (const gi of set) { const tk = ALL_TOKENS[gi]; const dg = tk && _dispGloss(tk); if (dg) gc.set(dg, (gc.get(dg) || 0) + 1); }
                    let bn = 0; for (const [k, v] of gc) if (v > bn) { gloss = k; bn = v; }
                }
                if (!gloss) for (const gi of set) {
                    const tok = ALL_TOKENS[gi];
                    gloss = (tok && ((_enMode() || _esMode()) ? _dispGloss(tok) : (tok.japanese || tok.gloss))) || '';
                    if (gloss || ++probes >= 200) break;
                }
                if (!gloss) continue;                             /* 語義未取得は非表示 */
                rows.push({ lemma: t.value, gloss, n: set.size });
            }
            rows.sort((a, b) => b.n - a.n);
            if (rows.length) {
                lexHtml = `<div class="ci-section"><div class="ci-section-title">${_tf('search.ci.relatedGreek','関連するギリシャ語')}</div>
                    <div class="ci-lex">${rows.map(r =>

                        </span>`).join('')}</div></div>`;
            }

    } catch (_) { lexHtml = ''; }   /* 失敗はセクション非表示のみ（静寂） */

    /* Advanced sections (patterns / syntax) go into a collapsible details block */
    const advancedSections = [
        patHtml  ? `<div class="ci-section"><div class="ci-section-title">${_tf('search.ci.patterns','パターンで探す')}</div><div class="layer-chips ci-chips">${patHtml}</div></div>` : '',

    ].join('');

        ? `<details class="ci-advanced">
               <summary class="ci-advanced-toggle">${_tf('search.ci.advanced','さらに詳しく')}</summary>
               <div class="ci-advanced-body">${advancedSections}</div>
           </details>` : '';

    const body = lexHtml + sec(_tf('search.ci.relatedConcepts','関連する概念'), relHtml) + advancedHtml;
    if (!body) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.innerHTML = `<details class="ci-outer">
        <summary class="ci-summary">
            <span class="ci-summary-label">${_tf('search.ci.about','「{label}」について',{label:_escH(_cLabel(concept))})}</span>
            <span class="ci-summary-hint">${_tf('search.ci.hint','ことばを深める')}</span>
        </summary>
        <div class="ci-outer-body">${body}</div>
    </details>`;
    el.style.display = '';
    if (!el._ciListenerAdded) {
        el.addEventListener('click', e => {

            if (c) { _ciConceptClick(c.dataset.conceptLabel); return; }
            const s = e.target.closest('[data-syntax-id]');

            const l = e.target.closest('[data-lemma]');
            if (l) { _ciLexiconClick(l.dataset.lemma); }

/* runPatternSearch: パターンカードクリック → SQS にフィルタを追加して unifiedSearch で再実行。
   専用の検索実行ルートは廃止し、unifiedSearch に一元化（Search Query State 統合）。 */
function runPatternSearch(i) {
    const p = SEARCH_PATTERNS[i];
    if (!p || !p.query || p.query.type !== 'cooccurrence') return;
    _sqsAddFilter({ type: 'pattern', id: p.id, label: _patLabel(p), pattern: _patPattern(p), query: p.query });

function groupHitsByLemma(hits){
    const map=new Map();
    for(const h of hits){
        const tok=h.tokens[h.anchorIdx],lemma=tok.lemma||tok.text||'?';
        if(!map.has(lemma)){
            map.set(lemma,{lemma,japanese:(_enMode()||_esMode())?_dispGloss(tok):(tok.japanese||tok.gloss||null),
                gloss:_esMode()?_esGlossText(tok):(tok.gloss||null),strong:tok.strong||null,hits:[],coocMap:new Map()});
        }
        const group=map.get(lemma);
        group.hits.push(h);
        if((_enMode()||_esMode())&&_dispGloss(tok)){ // EN/ES: 見出しのグロスはグループ内で最頻のもの（先頭トークンの活用形グロスにしない）
            const _dg=_dispGloss(tok);
            const gc=group._gc||(group._gc=new Map());gc.set(_dg,(gc.get(_dg)||0)+1);
            let best=null,bn=0;for(const[k,v]of gc)if(v>bn){best=k;bn=v;}
            group.japanese=best;
        }
        const{anchorIdx,start,end,tokens:tks}=h;
        for(let j=start;j<=end;j++){
            if(j===anchorIdx)continue;
            const t=tks[j];
            if(!t.text||t.text.length<2)continue;
            if(STOP_WORDS.has(t.text))continue;
            if(t.lemma===lemma||t.text===lemma)continue;
            const w=1/(Math.abs(j-anchorIdx)+1),key=t.text;
            const e=group.coocMap.get(key)||{weightedScore:0,rawCount:0};
            e.weightedScore+=w;e.rawCount+=1;
            group.coocMap.set(key,e);
        }
    }
    return[...map.values()].sort((a,b)=>b.hits.length-a.hits.length);
}

/* ============================================================
   Translation fetcher（original — unchanged）
   ============================================================ */
/* _transCache: cacheKey(bookKey/ch) → Promise<object|null>
   Promise を直接格納することで、同一章への並行呼び出し全員が同一 Promise を await し
   「set(null)→他のコールがnullを取得」という競合状態を防ぐ。 */
const _transCache=new Map();
async function _fetchTransVerse(bookKey,ch,verseNum){
    const _en=_enMode();   // EN は WEB のみ（無い節は翻訳文を出さない＝ギリシャ語のみ）
    const _es=_esMode();   // ES は RVR1909 のみ（#61a。同じく無い節はギリシャ語のみ）
    const cacheKey=`${_en?'en:':_es?'es:':''}${bookKey}/${ch}`;
    if(!_transCache.has(cacheKey)){
        const fetchPromise=(async()=>{
            for(const transId of(_en?['WEB']:_es?['RVR1909']:['JA1955','KAI17'])){
                /* 複数訳を順に試す意図的なフォールバック（KAI17等が未収録の書物を持つのは
                   仕様であり障害ではない）。__failedFetches には積まないが、追跡可能にする。 */
                try{
                    const res=await fetch(`../translations/${transId}/${bookKey}/${ch}.json`);
                    if(res.ok)return await res.json();
                    console.info(`[translation] ${transId}/${bookKey}/${ch} not available (HTTP ${res.status})`);
                }catch(err){console.info(`[translation] ${transId}/${bookKey}/${ch} fetch error`,err);}
            }
            console.warn(`[translation] ${bookKey}/${ch} — 全訳文ソースで取得失敗`);
            return null;
        })();
        _transCache.set(cacheKey,fetchPromise);
    }
    const data=await _transCache.get(cacheKey);
    if(!data||!data.verses){
        if(!_en&&!_es)console.warn(`[translation] ${bookKey}/${ch}:${verseNum} — verses オブジェクト不在`,{data});
        return null;
    }
    const text=data.verses[verseNum]||null;
    if(!text) console.warn(`[translation] ${bookKey}/${ch}:${verseNum} — 節キー不在`,{keys:Object.keys(data.verses).slice(0,5)});
    return text;
}

/* EN: 英語グロスからの候補（前方一致。語は先頭の語形ごとにレンマへまとめる） */
function _getSuggestionsEn(query){
    const q=query.toLowerCase();
    if(q.length<2)return[];
    const lemmaMap=new Map();
    let words=0;
    for(const [w,arr] of _enGlossIndex()){
        if(!w.startsWith(q))continue;
        if(++words>30)break;
        for(const gi of arr){
            const tok=ALL_TOKENS[gi];if(!tok)continue;
            const lemma=tok.lemma||tok.text;
            if(!lemmaMap.has(lemma))lemmaMap.set(lemma,{count:0,tok,posSet:new Set()});
            const e=lemmaMap.get(lemma);e.count++;
            if(tok.morph)e.posSet.add(tok.morph.split('-')[0]);
        }
    }
    return[...lemmaMap.entries()].sort((a,b)=>b[1].count-a[1].count).slice(0,8)
        .map(([lemma,{count,tok,posSet}])=>({lemma,jp:tok.gloss||'',
            pos:[...posSet].map(p=>_posLabel(p)).join(_tf('search.sep','・')),count}));
}
function _getSuggestions(query){
    if(!query)return[];
    if(_enMode())return _getSuggestionsEn(query);
    if(IDX.l3Ready){
        const idxSet=JP_PARTIAL_INDEX.get(query);
        if(!idxSet||idxSet.size===0)return[];
        const lemmaMap=new Map();
        for(const i of idxSet){
            const tok=ALL_TOKENS[i];if(!tok)continue;
            const lemma=tok.lemma||tok.text;
            if(!lemmaMap.has(lemma))lemmaMap.set(lemma,{count:0,tok,posSet:new Set()});
            const entry=lemmaMap.get(lemma);
            entry.count++;
            if(tok.morph)entry.posSet.add(tok.morph.split('-')[0]);
        }
        return[...lemmaMap.entries()].sort((a,b)=>b[1].count-a[1].count).slice(0,8)
            .map(([lemma,{count,tok,posSet}])=>{
                const jpVals=tok.japanese?(Array.isArray(tok.japanese)?tok.japanese:[tok.japanese]):(tok.gloss?[tok.gloss]:[]);
                return{lemma,jp:jpVals.slice(0,2).join('・')||'',
                    pos:[...posSet].map(p=>_posLabel(p)).join(_tf('search.sep','・'))||'',count};
            });
    }
    const lemmaMap=new Map();
    for(const toks of Object.values(tokenCache)){
        for(const tok of toks){
            const vals=tok.japanese?(Array.isArray(tok.japanese)?tok.japanese:[tok.japanese]):(tok.gloss?[tok.gloss]:[]);
            if(!vals.some(v=>v&&v.includes(query)))continue;
            const lemma=tok.lemma||tok.text;
            if(!lemmaMap.has(lemma))lemmaMap.set(lemma,{count:0,tok,posSet:new Set()});
            const entry=lemmaMap.get(lemma);
            entry.count++;
            if(tok.morph)entry.posSet.add(tok.morph.split('-')[0]);
        }
    }
    if(lemmaMap.size===0)return[];
    return[...lemmaMap.entries()].sort((a,b)=>b[1].count-a[1].count).slice(0,8)
        .map(([lemma,{count,tok,posSet}])=>{
            const jpVals=tok.japanese?(Array.isArray(tok.japanese)?tok.japanese:[tok.japanese]):(tok.gloss?[tok.gloss]:[]);
            return{lemma,jp:jpVals.slice(0,2).join('・')||'',
                pos:[...posSet].map(p=>_posLabel(p)).join(_tf('search.sep','・'))||'',count};
        });
}

function _renderHistoryInDropdown(){
    const dd=document.getElementById('suggest-dropdown');
    if(!dd)return;
    dd.innerHTML='';
    if(_history.length===0){dd.classList.remove('open');return;}
    _history.slice(0,6).forEach(({query,layers})=>{

            const h=_history.find(h=>h.query===query);

            dd.classList.remove('open');

function _initSuggest(){
    const inp=document.getElementById('unified-search-input');
    inp.addEventListener('input',(e)=>{
        _updateSearchControls();
        if(e.isComposing)return;  /* IME 確定前はスキップ */
        const val=inp.value.trim();
        if(!val){_renderHistoryInDropdown();return;}
        const qtype=detectQueryType(val);
        if(qtype!=='japanese'||(!_enMode()&&_isLatinWord(val))){document.getElementById('suggest-dropdown').classList.remove('open');return;} /* 英語サジェストは EN UI のみ（#31: 英字クエリの検索自体は全 UI 言語で可） */
        _showSuggest(_getSuggestions(val));
    });
    inp.addEventListener('focus',()=>{
        const val=inp.value.trim();
        if(!val){_renderHistoryInDropdown();}
        else if(detectQueryType(val)==='japanese'&&(_enMode()||!_isLatinWord(val))){_showSuggest(_getSuggestions(val));}
    });
    inp.addEventListener('blur',()=>{
        setTimeout(()=>document.getElementById('suggest-dropdown').classList.remove('open'),150);
        setTimeout(()=>{const s=document.getElementById('history-recent-section');if(s)s.style.display='none';},150);
    });
    inp.addEventListener('keydown',e=>{
        if(e.key==='Escape'){document.getElementById('suggest-dropdown').classList.remove('open');return;}
        if(e.key==='Enter'){document.getElementById('suggest-dropdown').classList.remove('open');unifiedSearch();}
    });
}

/* ============================================================
   Index progress watcher（original — updated IDs）
   ============================================================ */
function _watchIndexProgress(){
    const dot=document.getElementById('idx-dot');
    const label=document.getElementById('idx-label');
    const status=document.getElementById('idx-pill');
    if(!dot||!label)return;
    const timer=setInterval(()=>{
        if(IDX.l3Ready){
            dot.textContent='✓';
            label.textContent=_tf('search.status.ready','準備完了');
            /* lemmaIndex / morphIndex は IDX.ready 後に _buildAndExpose* で構築済みのはず。
               冪等化済みの関数を呼ぶことで、万一まだ未構築の場合は補完し、
               構築済みの場合は即スキップする（二重構築を防ぐ）。 */
            _buildAndExposeLemmaIndex();
            _buildAndExposeMorphIndex();
            /* 1秒だけ「準備完了」を見せてからフェードアウト → DOM 非表示 */
            setTimeout(()=>{
                if(status) status.classList.add('done');
                setTimeout(()=>{ if(status) status.style.display='none'; },1300);
            },1000);
            clearInterval(timer);
        }else if(IDX.ready){
            dot.textContent='✓';
            label.innerHTML=_escH(_tf('search.status.ntReady','NT検索できます'))+'<br><span style="opacity:0.75">'+_escH(_tf('search.status.lxxPreparing','LXX・日本語を準備中…'))+'</span>';
        }else{
            dot.textContent='○';
            const total=FLAT_BOOKS.reduce((s,b)=>s+b.ch,0);
            const loaded=Object.keys(tokenCache).length;
            const pct=total?Math.min(Math.round((loaded/total)*100),99):0;
            label.textContent=pct?_tf('search.status.loadingPct','読み込み中… {pct}%',{pct:pct}):_tf('search.status.preparing','準備中…');
        }
    },800);
}

/* ============================================================
   検索ゲート:
   IDX.ready（NT索引化完了）になるまで unifiedSearch は実行されない。
   NT完了後に LXX をバックグラウンド構築するため、LXX 構築中に検索が
   実行された場合は NT 範囲のみ結果を返す（再現性は NT 完了時点で保証）。
   ============================================================ */
/* ============================================================
   UI state — Layer toggles
   ============================================================ */
/* ── Search Query State (SQS) ──
   layers: 探し方レイヤー（従来の _layers と同一オブジェクト）
   filters: 追加絞り込み条件（文法パターン等）の配列
   ─────────────────────────────────────────────────────────── */
const _sqState = {
    layers:  { lemma: true, phrase: false, prox: false, morph: false },
    filters: []   /* [{ type:'pattern', id, label, query:{termA,termB,scope} }] */
};
/* 既存コード（toggleLayer / _syncLayerUI 等）との互換エイリアス。
   同一オブジェクトを参照するため代入は双方向に反映される。 */
const _layers = _sqState.layers;

function toggleLayer(name){
    if (name === 'prox' || name === 'morph') return;
    _layers[name]=!_layers[name];
    _syncLayerUI(name);
}
function activateLayer(name){
    if (name === 'prox') _layers.prox = true;
    else if (name === 'morph') _layers.morph = true;
    else _layers[name]=true;
    _syncLayerUI(name);
    document.getElementById('unified-search-input').focus();
}
function _exampleSearch(term) {
    const input = document.getElementById('unified-search-input');
    if (input) { input.value = term; input.dispatchEvent(new Event('input')); }
    unifiedSearch();
    /* チップ・履歴からの検索ではサジェストを閉じる（input イベントで開いたまま残るのを防ぐ） */
    const sd = document.getElementById('suggest-dropdown');
    if (sd) sd.classList.remove('open');
}
function _syncLayerUI(name){
    const active=_layers[name];
    const row=document.getElementById(`layer-${name}`);
    const chk=document.getElementById(`chk-${name}`);
    if(row){
        row.classList.toggle(`active-${name}`,active);
        row.setAttribute('aria-checked', active ? 'true' : 'false');
    }
    if(chk) renderIcon(chk, active ? 'check' : null);
    if(name==='prox'){
        const sub=document.getElementById('prox-sub');
        if(sub) sub.classList.toggle('visible',active);
    }
    if(name==='morph'){
        const sub=document.getElementById('morph-sub');
        if(sub) sub.classList.toggle('visible',active);
    }
    if(name==='phrase'){
        const sub=document.getElementById('phrase-sub');
        if(sub) sub.classList.toggle('visible',active);
    }
}

function _updateSearchControls(){
    const input=document.getElementById('unified-search-input');
    const words=input ? input.value.trim().split(/\s+/).filter(Boolean) : [];
    const hasQuery=words.length > 0;
    const hasMultipleWords=words.length > 1;
    const filters=document.getElementById('search-filters');
    if(filters){
        filters.classList.toggle('has-query',hasQuery);
        filters.classList.toggle('single-word',hasQuery && !hasMultipleWords);
        filters.classList.toggle('multi-word',hasMultipleWords);
    }
    _layers.lemma=true; _layers.morph=true; _layers.prox=hasMultipleWords;
    const prox=document.getElementById('prox-sub');
    if(prox){
        prox.classList.toggle('visible',hasMultipleWords);
        prox.setAttribute('aria-hidden',hasMultipleWords?'false':'true');
    }
    const title=document.getElementById('filter-suggestion-title');
    if(title) title.textContent=_tf('search.filter.multiTitle','複数の語を検索する条件');
    if(!hasQuery && window.matchMedia('(max-width: 700px)').matches) _closeMorphFilters();
    _syncMorphFilterFab();
}

/* ── SQS: フィルタバー描画 ── */
function _renderFilterBar() {
    const bar = document.getElementById('sqs-filter-bar');
    if (!bar) return;
    if (_sqState.filters.length === 0) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
    bar.innerHTML = _sqState.filters.map(f =>
        `<span class="sqs-pill">${_escH(f.pattern || f.label)}<button class="sqs-pill-x" data-filter-id="${_escH(f.id)}" aria-label="${_escH(_tf('search.filter.removeAria','条件を外す'))}" title="${_escH(_tf('search.filter.removeTitle','この条件を外す'))}">×</button></span>`
    ).join('');
    if (!bar._sqsListenerAdded) {
        bar.addEventListener('click', e => {
            const btn = e.target.closest('.sqs-pill-x[data-filter-id]');
            if (btn) _sqsRemoveFilter(btn.dataset.filterId);
        });
        bar._sqsListenerAdded = true;
    }
    bar.style.display = 'flex';
}

/* ── SQS: フィルタ追加（重複スキップ → unifiedSearch 再実行） ── */
function _sqsAddFilter(filter) {
    if (_sqState.filters.some(f => f.id === filter.id)) {
        if (_lastQuery) unifiedSearch();
        return;
    }
    _sqState.filters.push(filter);
    _renderFilterBar();
    if (_lastQuery) unifiedSearch();
}

/* ── SQS: フィルタ除去 ── */
function _sqsRemoveFilter(id) {
    _sqState.filters = _sqState.filters.filter(f => f.id !== id);
    _renderFilterBar();
    if (_lastQuery) unifiedSearch();
}

/* ── SQS: 全フィルタクリア ── */
function _sqsClearFilters() {
    _sqState.filters = [];
    _renderFilterBar();
}

/* ============================================================
   Unified Search History（localStorage 永続化）
   ============================================================ */
const _HISTORY_KEY = 'gnt-search-history';
const _HISTORY_MAX = 10;
const _history = [];

/* localStorage への書き込み（失敗は静寂 — 検索本体に影響させない） */
function _saveHistory() {
    try {
        localStorage.setItem(_HISTORY_KEY,
            JSON.stringify(_history.map(({query,layers,ts}) => ({query,layers,ts}))));
    } catch(_) {}
}

/* localStorage から読み込み → _history を復元 */
function _loadHistory() {
    try {
        const raw = localStorage.getItem(_HISTORY_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved)) return;
        for (const item of saved.slice(0, _HISTORY_MAX)) {
            if (item && item.query) {
                _history.push({
                    key:    item.query,
                    query:  item.query,
                    layers: item.layers || {lemma:true,phrase:false,prox:false,morph:false},
                    ts:     item.ts || 0,
                });
            }
        }
    } catch(_) {}
    _renderHistory();
}

function _addHistory(query,layers){
    if(!query) return;
    // query ベースで重複排除（レイヤーが違っても同語を移動）
    const idx = _history.findIndex(h => h.query === query);
    if(idx >= 0) _history.splice(idx, 1);
    _history.unshift({key:query, query, layers:{...layers}, ts:Date.now()});
    if(_history.length > _HISTORY_MAX) _history.pop();
    _saveHistory();
    _renderHistory();
}

const _badgeHist = l => _tf('search.badge.'+l, {lemma:'語根', phrase:'フレーズ', prox:'近接', morph:'品詞'}[l]||l);

function _renderHistory(){
    const block = document.getElementById('history-block');
    const list  = document.getElementById('history-list');
    if(_history.length === 0){ block.style.display='none'; return; }
    block.style.display = '';
    list.innerHTML = '';
    _history.slice(0, 6).forEach(({query,layers}) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const badges = ['lemma','phrase','prox','morph']
            .filter(l => layers[l])
            .map(l => `<span class="h-badge ${l}">${_badgeHist(l)}</span>`).join('');
        item.innerHTML = `
            <div class="history-badges">${badges}</div>
            <span class="h-query">${_escH(query)}</span>`;
        item.addEventListener('click', () => {
            document.getElementById('unified-search-input').value = query;
            Object.keys(_layers).forEach(k => { _layers[k] = !!layers[k]; _syncLayerUI(k); });
            unifiedSearch();
        });
        list.appendChild(item);
    });
    /* [T6] 履歴表示中は Discovery Lobby を非表示にする */
    const lobby = document.getElementById('discovery-lobby');
    if (lobby) lobby.hidden = true;
}

/* 空き状態の「最近の検索」チップ（最大5件） */
function _renderEmptyStateHistory() {
