<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外部サイトから開く</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<style>
/* このページ専用のスタイル。app本体（index.html）には依存しない独立ページ。 */
.bm-intro { color: var(--text-sub); margin: 0 0 var(--space-lg); }
.bm-section { margin-bottom: 40px; }
.bm-section h2 {
    font-size: var(--text-body);
    font-weight: 600;
    color: var(--text-main);
    margin: 0 0 var(--space-sm);
    padding-bottom: var(--space-xs);
    border-bottom: 1px solid var(--border-soft);
    letter-spacing: 0.02em;
}
.bm-section p { color: var(--text-sub); margin: var(--space-sm) 0; }
.bm-link-wrap { text-align: center; margin: var(--space-lg) 0; }
.bm-link {
    display: inline-block;
    background: var(--highlight);
    color: white;
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-s);
    font-weight: bold;
    font-size: var(--text-body);
    text-decoration: none;
    cursor: grab;
}
.bm-sites { color: var(--text-sub); }
</style>
</head>
<body>
<div class="page">

    <!-- Nav -->
    <div class="nav">
        <a class="btn-back" href="index.html">← 戻る</a>
        <div class="breadcrumb">
            <span class="crumb">外部サイトから開く</span>
        </div>
    </div>

    <p class="bm-intro">外部の聖書サイトで読んでいる箇所を、そのままこのアプリで開けます。</p>

    <div class="bm-section">
        <h2>使い方</h2>
        <p>下のリンクをブラウザのブックマークバーへドラッグしてください（クリックではありません）。</p>
        <div class="bm-link-wrap">
            <a id="bm-bookmarklet-link" class="bm-link" href="#" role="button"
               title="ブックマークバーへドラッグしてください" onclick="return false;">この箇所をここで開く</a>
        </div>
        <p>対応サイトで箇所を表示中にこのブックマークをクリックすると、同じ箇所がこのアプリで開きます。</p>
    </div>

    <div class="bm-section">
        <h2>現在の対応サイト</h2>
        <p class="bm-sites">BibleGateway</p>
    </div>

    <div class="bm-section">
        <h2>対応していないサイトの場合</h2>
        <p>「この聖書サービスには現在対応していません。」と表示されます。対応サイトは順次追加予定です。</p>
    </div>

</div>

<script>
/* ブックマークレットの責務は「現在URLを取得しこのアプリへ渡すだけ」に限定する。
   解析は一切行わない（解析は core/url-import-engine.js に集約し、index.html側の
   ?import= 受け口が担う）。ここで行うのはリンク先URLの組み立てのみ。
   index.htmlの場所は new URL('index.html', location.href) で解決するため、
   このファイルの配置場所やドメインをハードコードしない。 */
(function () {
    const target = new URL('index.html', location.href).href;
    const code = "(function(){location.href='" + target + "'+'?import='+encodeURIComponent(location.href);})();";
    const link = document.getElementById('bm-bookmarklet-link');
    if (link) link.setAttribute('href', 'javascript:' + code);
})();
</script>
</body>
</html>
