<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>Lowfat 文構造エディタ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafaf7;--panel:#fff;--fg:#1c1c1a;--mut:#6b6b66;--ln:#d8d8d0;--line:#333;--grid:#e9e9e2;--bx:#9a9a8e;--hl:#fde68a;--nom:#2563eb;--gen:#059669;--dat:#d97706;--acc:#dc2626;--vb:#7c3aed;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#202024;--fg:#ececea;--mut:#9a9a94;--ln:#3a3a40;--line:#c8c8c2;--grid:#26262b;--bx:#6d6d78;--hl:#5b4b12;--nom:#7aa7ff;--gen:#4ade9a;--dat:#fbbf5a;--acc:#ff8080;--vb:#b69cff;--ok:#4ade9a;--bad:#ff8080}}
:root[data-theme="dark"]{--bg:#17171a;--panel:#202024;--fg:#ececea;--mut:#9a9a94;--ln:#3a3a40;--line:#c8c8c2;--grid:#26262b;--bx:#6d6d78;--hl:#5b4b12;--nom:#7aa7ff;--gen:#4ade9a;--dat:#fbbf5a;--acc:#ff8080;--vb:#b69cff;--ok:#4ade9a;--bad:#ff8080}
html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
#app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto auto 1fr auto;height:100%}
#top,#nav{grid-column:1/3}#nav{border-bottom:1px solid var(--ln)}#left{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--ln)}
#mid{position:relative;overflow:hidden;min-width:0}#bot{grid-column:1/3}
.bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);flex-wrap:wrap}#top{border-bottom:1px solid var(--ln)}#bot{border-top:1px solid var(--ln)}
button{font:inherit;padding:3px 10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);border-radius:5px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.on{background:var(--fg);color:var(--bg)}
.sp{flex:1}#dirty{color:var(--dat);font-weight:600}
#tree{flex:1;overflow:auto;padding:4px 0;min-height:0}#chg{height:34%;overflow:auto;border-top:1px solid var(--ln);padding:6px 8px;font-size:12px;white-space:pre-wrap;color:var(--mut)}
.row{display:flex;align-items:center;gap:6px;padding:1px 6px;cursor:pointer;white-space:nowrap;border-left:2px solid transparent}.row:hover{background:var(--bg)}
.row.sel{background:var(--hl)}.row.over{outline:2px solid var(--nom);outline-offset:-2px}.row.wg{color:var(--mut);font-size:12px}.row .gl{color:var(--mut);font-size:11px}
.row.chg{border-left-color:var(--dat)}.row.bef{box-shadow:inset 0 2px 0 var(--nom)}.st:not(.ok):not(.fix){opacity:.4}
#dt{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:4px 10px;border-radius:6px;font-size:12px;display:none;z-index:5;pointer-events:none;max-width:90%}
.it{cursor:pointer;padding:3px 0;color:var(--fg)}.it small{display:block;color:var(--mut)}.sec{margin-top:8px;font-weight:600;color:var(--mut)}pre.cmp{margin:4px 0;padding:6px;background:var(--bg);border:1px solid var(--ln);font:11px/1.4 ui-monospace,monospace;color:var(--fg);overflow:auto}
.kids{margin-left:12px;border-left:1px solid var(--ln)}.st{margin-left:auto;width:16px;text-align:center;color:var(--mut)}.st.ok{color:var(--ok)}.st.fix{color:var(--bad);font-weight:700}
#svg{width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.word{cursor:move}.word text{font:22px "GFS Didot","Palatino Linotype",Georgia,serif;fill:var(--fg);user-select:none}.word .bg{fill:var(--hl);opacity:0}.word.sel .bg{opacity:1}
.ul{stroke:var(--line);stroke-width:1.6}.e{fill:none;stroke:var(--line);stroke-width:1.6}.e.dash{stroke-dasharray:4 4;stroke-width:1.2}
.nominative text{fill:var(--nom)}.genitive text{fill:var(--gen)}.dative text{fill:var(--dat)}.accusative text{fill:var(--acc)}.verb text{fill:var(--vb)}
.bx{fill:none;stroke:var(--bx);stroke-width:1;stroke-dasharray:3 3;opacity:.8}.bx.ok{stroke:var(--ok)}.bx.fix{stroke:var(--bad);stroke-dasharray:none}.bx.sel{stroke:var(--fg);stroke-width:2;stroke-dasharray:none;opacity:1}.bx.par{stroke:var(--fg);stroke-width:1.6;stroke-dasharray:10 4;opacity:1}.bx.chd{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:2 3;opacity:.9}
.bl.em{font:600 12px system-ui;fill:var(--fg);stroke:var(--panel);stroke-width:3px;paint-order:stroke}
.hlm{fill:var(--nom);fill-opacity:.2;stroke:none;pointer-events:none}.hlw{fill:none;stroke:var(--dat);stroke-width:2;stroke-dasharray:4 3;pointer-events:none}
.bl{font:10px system-ui;fill:var(--mut);pointer-events:none}.hl{fill:var(--nom);fill-opacity:.12;stroke:var(--nom);stroke-width:2;pointer-events:none}
.mk{font:bold 11px system-ui;pointer-events:none}
#drawer{position:absolute;right:0;top:0;bottom:0;width:340px;display:none;flex-direction:column;background:var(--panel);border-left:1px solid var(--ln)}#drawer.open{display:flex}
textarea{flex:1;border:0;resize:none;padding:8px;font:11px/1.4 ui-monospace,monospace;background:var(--panel);color:var(--fg);outline:0;white-space:pre}
#zoom{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:4}#lg{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--mut);display:flex;gap:8px}
#sl{position:absolute;left:0;top:0;bottom:0;width:230px;background:var(--panel);border-right:1px solid var(--ln);overflow:auto;display:none;z-index:4;font-size:12px}#sl .h{position:sticky;top:0;background:var(--panel);padding:6px 8px;font-weight:600;border-bottom:1px solid var(--ln)}#sl .c{padding:6px 8px 2px;color:var(--mut);font-weight:600}#sl .i{display:flex;padding:2px 8px;cursor:pointer;gap:6px}#sl .i:hover{background:var(--bg)}#sl .i.cur{background:var(--hl)}#sl .i b{margin-left:auto}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20}#modal div{background:var(--panel);padding:16px;border-radius:8px;max-width:360px;display:flex;flex-direction:column;gap:12px}#modal span{display:flex;gap:8px;justify-content:flex-end}#ref{font-weight:600}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 34% 1fr auto}#top,#nav,#bot{grid-column:1}#drawer{width:100%}}
</style></head><body>
<div id="app">
<div id="top" class="bar"><button id="mS" class="on">構造編集</button><button id="mL">レイアウト編集</button><label><input type="checkbox" id="gr" checked> グリッド/スナップ</label><span class="sp"></span><span id="hint" style="color:var(--mut)"></span></div>
<div id="nav" class="bar"><button id="np">← 前の文</button><span id="ref"></span><span id="cnt" style="color:var(--mut)"></span><button id="nn">次の文 →</button><button id="nr">次の要確認</button><button id="ma" title="この文の語・句のうち「!」以外をすべて✓にします（Undo可）">この文を✓</button><button id="sb">文一覧</button><button id="ob">XMLを開く</button><input type="file" id="fi" accept=".xml,.txt" style="display:none"></div>
<div id="left"><div id="tree"></div><div id="chg"></div></div>
<div id="mid"><div id="dt"></div><div id="sl"></div><svg id="svg"><defs><pattern id="gp" width="40" height="36" patternUnits="userSpaceOnUse"><path d="M40 0V36M0 36H40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs>

<div id="zoom"><button id="zi">＋</button><button id="zo">－</button><button id="zf">全体</button></div>
<div id="lg"><span style="color:var(--nom)">■主格</span><span style="color:var(--gen)">■属格</span><span style="color:var(--dat)">■与格</span><span style="color:var(--acc)">■対格</span><span style="color:var(--vb)">■動詞</span></div>
<div id="drawer"><div class="bar"><button id="dx" class="on">XML</button><button id="dj">JSON</button><button id="dc">閉じる</button></div><textarea id="ta" spellcheck="false"></textarea></div></div>
<div id="bot" class="bar"><button id="un">Undo</button><button id="re">Redo</button><button id="al">Auto Layout</button><button id="rs" title="手動で動かした位置（rk-x/rk-y）だけを消します。構造変更はそのまま。構造まで戻すにはUndo">手動配置リセット</button><button id="sv">Save XML</button><button id="js">JSON</button><span id="dirty"></span><span class="sp"></span><span id="st" style="color:var(--mut)"></span></div>
</div>
<div id="modal"><div><p></p><span><button class="n">キャンセル</button><button class="y on">移動する</button></span></div></div>

<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';

let words=[],edges=[],EW=new Map(),doc=null,mode='struct',view={x:40,y:40,k:1},dmode='xml',selId=null;

const parse=t=>{const d=new DOMParser().parseFromString(t,'application/xml');return d.querySelector('parsererror')?null:d};

/* ===== 構造モデル → レイアウトモデル。手動(rk-x/rk-y)語は保存位置、他は自動配置 ===== */
const ROW=38,IND=30,GAPV=8,GAPH=60,PADX=3; // PADX: 下線・修飾枝終点・語枠の左右余白（共通）
function put(el,x,y){const t=A(el,'unicode')||el.textContent;
  const w={el,id:A(el,'xml:id')||'w'+words.length,text:t,w:ctx.measureText(t).width,x,y,ay:y};
  const rx=A(el,'rk-x'),ry=A(el,'rk-y');if(rx!==null&&ry!==null){w.x=+rx;w.y=+ry;w.manual=true}
  words.push(w);EW.set(el,w);return{head:w,tail:w,lead:w,w:w.w+10,h:ROW}}
function place(n,x,y,pre){
  if(n.tagName==='w')return put(n,x,y);
  const ks=kids(n);if(!ks.length)return{head:null,w:0,h:0};
  if(ks.some(k=>SLOT[A(k,'role')]))return clause(ks,x,y);
  const isCl=k=>k.tagName==='w'?A(k,'class')==='conj':(A(k,'class')==='cl'||A(k,'type')==='group'||/Conj/.test(A(k,'rule')||''));
  if(n.tagName==='sentence'||(ks.some(k=>k.tagName==='wg')&&ks.every(isCl)))return stack(ks,x,y);
  return phrase(ks,x,y,pre)}
function stack(ks,x,y){let cy=y,W=0,first=null,fl=null,tail=null,conj=null;
  for(const k of ks){if(k.tagName==='w'){conj=put(k,x,cy);continue}
    const cx=conj?x+conj.w+40:x,n0=words.length,r=place(k,cx,cy);if(!r.head)continue;
    if(!first){first=r.head;fl=conj?conj.head:(r.lead||r.head);
      /* 1行目に実際に置かれた語（自動配置の行 ay===cy）のうち、現在の実座標で x+語幅 が最大の語を末尾語にする */
      const row=words.slice(n0).filter(w=>w.ay===cy);if(conj)row.push(conj.head);
      tail=row.length?row.reduce((m,w)=>w.x+w.w>m.x+m.w?w:m,row[0]):(r.tail||r.head)}if(conj){edges.push({a:conj.head,b:r.head,kind:'dash'});conj=null}

  return{head:first,tail:tail||first,lead:fl||first,w:W,h:Math.max(cy-y-34,ROW)}}
/* 修飾語: 頭語の下に縦に積む。高さ・幅は子の実測値を使う（重なり防止） */
function mods(head,list,x,y0){let cy=y0,W=0;
  for(const k of list){const r=place(k,x+IND,cy);if(!r.head)continue;
    edges.push({a:head,b:r.lead||r.head,kind:'mod'});W=Math.max(W,IND+r.w);cy+=Math.max(r.h,ROW)+GAPV}
  return{w:W,h:cy-y0}}
function clause(ks,x,y){
  const slots=ks.filter(k=>SLOT[A(k,'role')]).sort((a,b)=>SLOT[A(a,'role')]-SLOT[A(b,'role')]);
  const extra=ks.filter(k=>!slots.includes(k));
  let cx=x,H=ROW,prev=null,pt=null,first=null,fl=null,last=null,vseen=false;
  for(const k of slots){const role=A(k,'role'),r=place(k,cx,y);if(!r.head)continue;
    if(!first){first=r.head;fl=r.lead||r.head}
    if(prev)edges.push({a:pt,b:r.lead||r.head,kind:role==='p'?'vp':SLOT[role]===2?'sv':'vo'});
    if(SLOT[role]===2&&extra.length&&!vseen){vseen=true;const m=mods(r.head,extra,cx,y+r.h);r.w=Math.max(r.w,m.w);r.h+=m.h}
    last={r,x:cx};prev=r.head;pt=r.tail||r.head;cx+=r.w+GAPH;H=Math.max(H,r.h)}
  if(extra.length&&!vseen&&last){const m=mods(prev,extra,last.x,y+last.r.h);cx=last.x+Math.max(last.r.w,m.w)+GAPH;H=Math.max(H,last.r.h+m.h)}
  return{head:first,tail:pt,lead:fl||first,w:Math.max(cx-x-GAPH,0),h:H}}
/* ---- 系譜チェーン限定: 短い直接修飾語を頭語の直下に置く ----
   NPofNP = [ 冠詞(τοῦ 等), Np-Appos ]、Np-Appos = [ 人名, NPofNP ] が深く連なる構造でだけ、
   頭語が入れ子の句のとき、短い修飾語(1語)を「子句全体の高さの下」ではなく頭語の直下に置く。
   適用は、現行方式での子句の高さ(hgt)が GEN_TH 以上のときに限る。座標だけの変更で、XML・親子関係は変えない。 */
const GEN_TH=1000;const HM=new Map();
function hgt(n){if(HM.has(n))return HM.get(n);const v=hgt_(n);HM.set(n,v);return v}
function hMods(list){let cy=0;for(const k of list){const h=hgt(k);if(!h)continue;cy+=Math.max(h,ROW)+GAPV}return cy}
function hgt_(n){if(n.tagName==='w')return ROW;const ks=kids(n);if(!ks.length)return 0;
  if(ks.some(k=>SLOT[A(k,'role')])){const slots=ks.filter(k=>SLOT[A(k,'role')]).sort((a,b)=>SLOT[A(a,'role')]-SLOT[A(b,'role')]),extra=ks.filter(k=>!slots.includes(k));let H=ROW,vseen=false,lastH=null;
    for(const k of slots){let h=hgt(k);if(!h)continue;if(SLOT[A(k,'role')]===2&&extra.length&&!vseen){vseen=true;h+=hMods(extra)}lastH=h;H=Math.max(H,h)}
    if(extra.length&&!vseen&&lastH!==null)H=Math.max(H,lastH+hMods(extra));return H}
  const isCl=k=>k.tagName==='w'?A(k,'class')==='conj':(A(k,'class')==='cl'||A(k,'type')==='group'||/Conj/.test(A(k,'rule')||''));
  if(n.tagName==='sentence'||(ks.some(k=>k.tagName==='wg')&&ks.every(isCl))){let cy=0;for(const k of ks){if(k.tagName==='w')continue;const h=hgt(k);if(!h)continue;cy+=Math.max(h,ROW)+34}return Math.max(cy-34,ROW)}
  return hPhrase(ks)}
function hPhrase(ks){const pi=ks.findIndex(k=>k.tagName==='w'&&A(k,'class')==='prep');
  if(pi>=0&&ks.length>1)return Math.max(hPhrase(ks.filter((_,i)=>i!==pi)),ROW);
  let hi=ks.findIndex(k=>k.tagName==='w'&&!NONHEAD.has(A(k,'class')));if(hi<0)hi=ks.findIndex(k=>k.tagName==='wg');if(hi<0)hi=0;

function phrase(ks,x,y,pre){pre=pre||[];
  const pi=ks.findIndex(k=>k.tagName==='w'&&A(k,'class')==='prep');
  if(pi>=0&&ks.length>1){const p=put(ks[pi],x,y),r=phrase(ks.filter((_,i)=>i!==pi),x+p.w+14,y);
    if(r.head)edges.push({a:p.head,b:r.lead||r.head,kind:'cont'});return{head:p.head,lead:p.head,tail:r.tail||r.head||p.head,w:p.w+14+r.w,h:Math.max(r.h,ROW)}}
  let hi=ks.findIndex(k=>k.tagName==='w'&&!NONHEAD.has(A(k,'class')));
  if(hi<0)hi=ks.findIndex(k=>k.tagName==='wg');if(hi<0)hi=0;
  const rest=ks.filter((_,i)=>i!==hi),short=rest.filter(k=>k.tagName==='w'),long=rest.filter(k=>k.tagName==='wg');
  const isWg=ks[hi].tagName==='wg';
  const hoist=isWg&&short.length>0&&A(ks[0].parentNode,'rule')==='NPofNP'&&A(ks[hi],'rule')==='Np-Appos'&&hgt(ks[hi])>=GEN_TH;
  if(!hoist&&pre.length===0){const hr=place(ks[hi],x,y),m=mods(hr.head,rest,x,y+hr.h);
    return{head:hr.head,lead:hr.lead||hr.head,tail:hr.tail||hr.head,w:Math.max(hr.w,m.w),h:hr.h+m.h,usedPre:true}}
  let hr,m;
  if(isWg){hr=place(ks[hi],x,y,pre.concat(hoist?short:[]));
    if(hr.usedPre){m=mods(hr.head,hoist?long:rest,x,y+hr.h)}else{m=mods(hr.head,pre.concat(hoist?short.concat(long):rest),x,y+hr.h)}}
  else{hr=place(ks[hi],x,y);m=mods(hr.head,pre.concat(rest),x,y+hr.h)}
  return{head:hr.head,lead:hr.lead||hr.head,tail:hr.tail||hr.head,w:Math.max(hr.w,m.w),h:hr.h+m.h,usedPre:true}}
/* 最終安全網: 自動配置語が他の語（特に手動配置語）と重なる場合、自動語側を右へずらす */
function resolve(){const R=w=>({l:w.x-6,r:w.x+w.w+6,t:w.y-26,b:w.y+10});
  const au=words.filter(w=>!w.manual).sort((a,b)=>a.y-b.y||a.x-b.x),idx=new Map(au.map((w,i)=>[w,i]));
  for(let pass=0;pass<8;pass++){let ch=false;
    for(const a of au)for(const o of words){if(o===a||(!o.manual&&idx.get(o)>idx.get(a)))continue;
      const p=R(a),q=R(o);if(p.l<q.r&&q.l<p.r&&p.t<q.b&&q.t<p.b){a.x=o.x+o.w+14;ch=true}}
    if(!ch)break}}
function layout(){words=[];edges=[];EW=new Map();HM.clear();const root=doc.documentElement;
  const ss=root.tagName==='sentence'?[root]:[...root.getElementsByTagName('sentence')];
  let cy=24;for(const s of(ss.length?ss:[root])){const r=place(s,0,cy);cy+=r.h+70}resolve()}

/* ===== 包含レーン ===== */
const LBL={cl:'節',np:'名詞句',pp:'前置詞句',vp:'動詞句',adjp:'形容詞句',advp:'副詞句',group:'グループ',sentence:'文'};
const label=n=>n.tagName==='sentence'?'文':(LBL[A(n,'class')]||LBL[A(n,'type')]||'wg')+(A(n,'role')?' ['+A(n,'role')+']':'');
const ht=n=>1+Math.max(0,...[...n.children].filter(c=>c.tagName==='wg').map(ht));
function boxes(excl){const out=[];
  doc.querySelectorAll('wg').forEach(n=>{const ks=kids(n);if(ks.length===1&&ks[0].tagName==='wg')return;
    const ws=[...n.getElementsByTagName('w')].map(e=>EW.get(e)).filter(w=>w&&w!==excl);if(ws.length<2)return;
    const p=5+4*(ht(n)-1);
    out.push({el:n,x1:Math.min(...ws.map(w=>w.x))-p,x2:Math.max(...ws.map(w=>w.x+w.w))+p,y1:Math.min(...ws.map(w=>w.y))-26-p/2,y2:Math.max(...ws.map(w=>w.y))+10+p/2})});
  return out}
/* 枠の描画。選択がある場合だけ、選択に関係する枠を強調し、選択した語・句のそばに「所属バッジ」を出す（配置・判定には影響しない）
   語を選択 → その語の所属枠(太い実線)・1段上の親枠(長い破線)、バッジに「所属 / ▲親」の句名と先頭の語
   句を選択 → その枠(太い実線)・親枠・直下の子枠(点線)、バッジに「● / ▲親 / ▼子」
   深い入れ子では枠の縁やラベルが画面外に出るため、所属は語のそばのバッジで示す */
function drawBoxes(){gB.textContent='';gL.textContent='';const bx=boxes(),fs=new Set(bx.map(b=>b.el)),sel0=selId&&E.get(selId),emph=new Map();
  const fAnc=n=>{for(let x=n.parentNode;x&&x.tagName==='wg';x=x.parentNode)if(fs.has(x))return x;return null};

  const anc=[];for(let x=nw.el.parentNode;x&&x.tagName==='wg';x=x.parentNode)anc.push(x);
  const had=new Set(boxes().map(b=>b.el));   // ドラッグ語を含めた通常描画で枠のある句
  const inChain=anc.filter(el=>bx.some(b=>b.el===el)||had.has(el)).map(el=>boxOf(el,bx,w)).filter(b=>b&&px>=b.x1&&px<=b.x2&&py>=b.y1&&py<=b.y2);   // 祖先チェーン内側→外側
  if(inChain.length){const i=Math.min(level||0,inChain.length-1);return{kind:'chain',c:inChain[i],nw,nd,n:inChain.length,i}}
  if(!bx.some(b=>px>=b.x1&&px<=b.x2&&py>=b.y1&&py<=b.y2))return{kind:'outside',nw,nd};
  const par=nw.el.parentNode;if(par&&par.tagName==='wg'){const c=boxOf(par,bx,w);if(c)return{kind:'fallback',c,nw,nd,n:1,i:0}}
  return{kind:'none',nw,nd}}
function startDrag(ev,w){ev.stopPropagation();ev.preventDefault();const g=ev.currentTarget;g.setPointerCapture(ev.pointerId);select(w.el);
  const sx=ev.clientX,sy=ev.clientY,x0=w.x,y0=w.y,s0=snapNow(),snap=$('#gr').checked;let tgt=null,mvd=false,last=null;
  const preview=e=>{gH.textContent='';tgt=null;if(mode!=='struct')return;
    const[px,py]=world(e),r=m3Target(px,py,w,e.shiftKey?(e.altKey?2:1):0);
    if(r.nw){const q=wrect(r.nw);rect(gH,{x1:q.l-2,y1:q.t-2,x2:q.r+2,y2:q.b+2},'hlw')}
    if(!r.c){dt(r.kind==='outside'?'枠の外：位置のみ変更':'移動先なし：位置のみ変更');return}
    const same=r.c.el===w.el.parentNode,near=' ／ 最近傍語：'+r.nw.text+'（'+Math.round(r.nd)+'px）';
    if(same){dt('所属は変更なし（位置のみ）'+near);return}
    tgt=r.c;rect(gH,r.c,'hl');
    for(const e2 of r.c.el.getElementsByTagName('w')){const x=EW.get(e2);if(x&&x!==w){const q=wrect(x);rect(gH,{x1:q.l,y1:q.t,x2:q.r,y2:q.b},'hlm')}}
    dt('移動先：'+(()=>{const g=gpath(r.c.el).split(' > ');return g.length>5?'… > '+g.slice(-4).join(' > ')+'（深さ'+g.length+'）':g.join(' > ')})()+'「'+prev(r.c.el)+'」'+near+(r.kind==='fallback'?'（祖先の枠外のため親句）':r.n>1?'　外側 '+r.i+'/'+(r.n-1)+'（Shift／Shift+Alt）':''))};
  const mv=e=>{let x=x0+(e.clientX-sx)/view.k,y=y0+(e.clientY-sy)/view.k;if(snap){x=Math.round(x/20)*20;y=Math.round(y/18)*18}
    last=e;if(x!==w.x||y!==w.y){mvd=true;w.x=x;w.y=y;moved(w)}if(mvd)preview(e)};
  const kk=k=>{if(!last||!mvd||(k.key!=='Shift'&&k.key!=='Alt'))return;last={clientX:last.clientX,clientY:last.clientY,shiftKey:k.shiftKey,altKey:k.altKey};preview(last)};
  addEventListener('keydown',kk);addEventListener('keyup',kk);
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);removeEventListener('keydown',kk);removeEventListener('keyup',kk);gH.textContent='';dt('');
    if(!mvd)return;NOTE='';
    if(tgt){const old=w.el.parentNode;let bf=null;
      for(const c of kids(tgt.el)){const f=c.tagName==='w'?c:c.getElementsByTagName('w')[0],fw=EW.get(f);if(fw&&fw!==w&&fw.x>w.x){bf=c;break}}
      tgt.el.insertBefore(w.el,bf);prune(old);undoS.push(s0);redoS=[];refresh();select(w.el);note('構造のみ変更。位置は自動配置（手動位置は変更なし）')}
    else{w.manual=true;undoS.push(s0);redoS=[];sync()}};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)}
function prune(n){while(n&&n.tagName==='wg'&&!kids(n).length){const p=n.parentNode;p.removeChild(n);n=p}}

/* ===== パン・ズーム ===== */
const applyView=()=>vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
svg.addEventListener('pointerdown',ev=>{svg.setPointerCapture(ev.pointerId);const sx=ev.clientX,sy=ev.clientY,x0=view.x,y0=view.y;
  const mv=e=>{view.x=x0+e.clientX-sx;view.y=y0+e.clientY-sy;applyView()};
  const up=()=>{svg.removeEventListener('pointermove',mv);svg.removeEventListener('pointerup',up)};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerup',up)});
function zoom(f,mx,my){const r=svg.getBoundingClientRect();mx??=r.width/2;my??=r.height/2;
  const k=Math.min(6,Math.max(minZoom(),view.k*f));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;applyView()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('#zi').onclick=()=>zoom(1.25);$('#zo').onclick=()=>zoom(.8);
/* 表示倍率の役割分担
   fitInfo()  : 文全体が収まる倍率(fit-all)の計算。
   fit()      : 「全体」ボタン＝利用者が明示的に全体を見る操作（従来と同じ）。
   initView() : 文を開いたとき／Auto Layout 後の初期表示。読める大きさ(READABLE)を優先し、文の先頭（左上）から表示する。
   minZoom()  : ズームアウトの下限。通常は0.15。ただしfit-allがそれより小さい文では、fit-allまで縮小できるようにする。 */
const READABLE=0.5;   // 初期表示の最小倍率：文字 22px×0.5=11px（UIの文字サイズ12〜13pxに近い大きさ）
function fitInfo(){const r=svg.getBoundingClientRect();
  const x1=Math.min(...words.map(w=>w.x))-20,x2=Math.max(...words.map(w=>w.x+w.w))+20,y1=Math.min(...words.map(w=>w.y-40)),y2=Math.max(...words.map(w=>w.y+24));
  return{x1,y1,k:Math.min(1.4,(r.width-40)/(x2-x1||1),(r.height-40)/(y2-y1||1))}}
function fit(){if(!words.length)return;const f=fitInfo();view.k=f.k;view.x=20-f.x1*f.k;view.y=20-f.y1*f.k;applyView()}
function initView(){if(!words.length)return;const f=fitInfo();view.k=Math.max(f.k,READABLE);view.x=20-f.x1*view.k;view.y=20-f.y1*view.k;applyView()}
const minZoom=()=>words.length?Math.min(.15,fitInfo().k):.15;
$('#zf').onclick=fit;

/* ===== ボタン類 ===== */
$('#un').onclick=undo;$('#re').onclick=redo;
$('#al').onclick=()=>{refresh();initView();note('自動配置語を再計算（手動配置は維持）')};
$('#rs').onclick=()=>{const n=doc.querySelectorAll('[rk-x]').length;act(()=>doc.querySelectorAll('[rk-x]').forEach(e=>{e.removeAttribute('rk-x');e.removeAttribute('rk-y')}));note(`手動配置 ${n} 件をリセット（構造は維持）`)};
$('#mS').onclick=()=>setM('struct');$('#mL').onclick=()=>setM('layout');
function setM(m){mode=m;$('#mS').classList.toggle('on',m==='struct');$('#mL').classList.toggle('on',m==='layout');updateUI()}
$('#gr').onchange=e=>$('#grid').style.display=e.target.checked?'':'none';
function dm(m){dmode=m;$('#dx').classList.toggle('on',m==='xml');$('#dj').classList.toggle('on',m==='json');$('#drawer').classList.add('open');sync()}
$('#dx').onclick=()=>dm('xml');$('#dj').onclick=()=>dm('json');$('#dc').onclick=()=>$('#drawer').classList.remove('open');
$('#js').onclick=()=>dm('json');
let tm;ta.addEventListener('input',()=>{if(dmode!=='xml')return;clearTimeout(tm);tm=setTimeout(()=>{const d=parse(ta.value);if(!d){$('#st').textContent='⚠ XMLパースエラー';return}
  const s=snapNow();if(allEls(d).length===s.ids.length){undoS.push(s);redoS=[];doc=d;tag(s.ids);refresh()}else{fresh(ta.value);note('XMLの要素数が変わったため、履歴と変更比較の基準をリセットしました')}},600)});
addEventListener('keydown',e=>{if(document.activeElement===ta)return;const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}});
function bookXml(){BOOK.sents.forEach((e,i)=>{if(i!==cur&&!e.st)return;const n=BOOK.doc.importNode(parse(xmlNow(i)).documentElement,true);e.el.replaceWith(n);e.el=n});
  return new XMLSerializer().serializeToString(BOOK.doc)}
async function save(){const blob=new Blob([bookXml()],{type:'text/plain'});let d=null;
  try{d=await window.claude?.use('downloads')}catch(e){}
  const ok=()=>{BOOK.sents.forEach((e,i)=>{if(i===cur)savedStr=ser();else if(e.st)e.st.savedStr=e.st.xml});updateUI();note('全体を保存しました')};
  const name=BOOK.name.replace(/\s+/g,'_')+'-rk.txt';
  if(d){try{await d.save({filename:name,data:blob});ok()}catch(e){if(e.code!=='declined')note('保存失敗: '+(e.code||e.message))}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace('.txt','.xml');a.click();ok()}
$('#sv').onclick=save;
loadBook($('#sample').textContent.trim());
