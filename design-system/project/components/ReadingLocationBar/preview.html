<!-- @dsCard group="Navigation" height=120 subtitle="Bible Location breadcrumb, separated from Translation / View Mode" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-canvas); padding: var(--space-6); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding-bottom: var(--space-4); border-bottom: var(--border-width-hairline) solid var(--border-hairline); flex-wrap: wrap; }
  .location { display: flex; align-items: center; gap: var(--space-2); color: var(--ink-secondary); }
  .location .sep { color: var(--ink-tertiary); }
  .location .current { color: var(--ink-primary); font-weight: 600; }
  .reading-mode { display: flex; align-items: center; gap: var(--space-2); }
  .chip { display: inline-flex; align-items: center; padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--ink-secondary); }
  .chip.active { background: var(--accent-greek-100); color: var(--ink-on-accent-tint); }
  .caption { color: var(--ink-tertiary); margin-right: var(--space-1); }
</style>
</head>
<body>
  <div class="bar">
    <div class="location ui-label">
      <span>新約聖書</span><span class="sep">›</span>
      <span>ローマ</span><span class="sep">›</span>
      <span class="current">1章</span>
    </div>
    <div class="reading-mode ui-body">
      <span class="chip">口語訳</span>
      <span class="chip active">構造で読む</span>
    </div>
  </div>
</body>
</html>
