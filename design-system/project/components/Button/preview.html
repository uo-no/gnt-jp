<!-- @dsCard group="Controls" height=100 subtitle="Primary / Secondary / Ghost" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-canvas); padding: var(--space-6); display: flex; gap: var(--space-3); align-items: center; height: 44px; }
  button { font: inherit; border-radius: var(--radius-md); padding: var(--space-2) var(--space-5); cursor: default; }
  .primary { background: var(--accent-greek-700); color: var(--ink-on-accent); border: none; }
  .secondary { background: transparent; color: var(--ink-primary); border: var(--border-width-strong) solid var(--border-strong); }
  .ghost { background: transparent; color: var(--ink-secondary); border: none; }
</style>
</head>
<body>
  <button class="primary ui-body">決定</button>
  <button class="secondary ui-body">キャンセル</button>
  <button class="ghost ui-body">さらに調べる</button>
</body>
</html>
