<!-- @dsCard group="Structural Reading" height=360 subtitle="FUNCTION / CONSTRUCTION / MORPHOLOGY, nested and indented" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-sunken); padding: var(--space-6); }
  .tag { display: inline-block; padding: 2px var(--space-2); border-radius: var(--radius-sm); margin-bottom: var(--space-1); }
  .tag.function { background: var(--structural-function-fill); color: var(--structural-function-ink); }
  .tag.construction { background: var(--structural-construction-fill); color: var(--structural-construction-ink); }
  .tag.morphology { background: var(--structural-morphology-fill); color: var(--structural-morphology-ink); }

  .node { border: var(--border-width-hairline) solid var(--border-hairline); border-radius: var(--radius-sm); background: var(--surface-raised); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); }
  .node.function { border-color: var(--structural-function-fill); }
  .node.construction { border-left: 3px solid var(--structural-construction-ink); margin-left: var(--space-5); padding-left: var(--space-3); }
  .word { color: var(--ink-primary); }

  .children { margin-left: var(--space-5); border-left: var(--border-width-hairline) solid var(--structural-connector); padding-left: var(--space-3); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px var(--space-2); border-radius: var(--radius-sm); background: var(--structural-morphology-fill); color: var(--structural-morphology-ink); margin-right: var(--space-1); }
</style>
</head>
<body>
  <div class="node function">
    <span class="tag function structural-tag">主語</span><br>
    <span class="word structural-node-text">パウロ</span>
    <div class="children">
      <div class="node construction">
        <span class="tag construction structural-tag">同格</span><br>
        <span class="word structural-node-text">しもべ</span>
        <div class="children">
          <span class="chip ui-caption">呼格</span>
          <span class="word structural-node-text">キリスト・イエス</span>
        </div>
      </div>
      <div class="node construction">
        <span class="tag construction structural-tag">同格</span><br>
        <span class="word structural-node-text">使徒</span>
        <div class="children">
          <span class="chip ui-caption">分詞・受動</span>
          <span class="word structural-node-text">召された</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
