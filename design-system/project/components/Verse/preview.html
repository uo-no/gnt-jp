<!-- @dsCard group="Reading" height=280 subtitle="Verse number + reading text, Japanese and Greek" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-canvas); padding: var(--space-6); }
  .verse { display: flex; gap: var(--space-2); margin-bottom: var(--space-5); align-items: baseline; }
  .verse:last-child { margin-bottom: 0; }
  .num { color: var(--ink-tertiary); min-width: 1.4em; text-align: right; }
  .text { color: var(--ink-primary); }
  .source .text { direction: ltr; }
</style>
</head>
<body>
  <div class="verse">
    <span class="num ui-caption">1</span>
    <span class="text verse-ja">キリスト・イエスの僕、神の福音のために選び別たれ、召されて使徒となったパウロから――</span>
  </div>
  <div class="verse">
    <span class="num ui-caption">2</span>
    <span class="text verse-ja">この福音は、神が、預言者たちにより、聖書の中で、あらかじめ約束されたものであって、</span>
  </div>
  <div class="verse source">
    <span class="num ui-caption">1</span>
    <span class="text verse-source">Παῦλος δοῦλος Χριστοῦ Ἰησοῦ, κλητὸς ἀπόστολος ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ</span>
  </div>
</body>
</html>
