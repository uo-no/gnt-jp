<!-- @dsCard group="Mobile" height=100 width=375 subtitle="App-level destinations only — no Reading / Comparison / Research tabs" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-canvas); }
  .bar { display: flex; border-top: var(--border-width-hairline) solid var(--border-hairline); background: var(--surface-raised); }
  .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--space-2) 0 var(--space-3); color: var(--ink-tertiary); }
  .item.active { color: var(--accent-greek-700); }
  .dot { width: 20px; height: 20px; border-radius: var(--radius-sm); border: 1.5px solid currentColor; }
</style>
</head>
<body>
  <div class="bar">
    <div class="item active"><span class="dot"></span><span class="ui-caption">聖書</span></div>
    <div class="item"><span class="dot"></span><span class="ui-caption">検索</span></div>
    <div class="item"><span class="dot"></span><span class="ui-caption">ノート</span></div>
    <div class="item"><span class="dot"></span><span class="ui-caption">その他</span></div>
  </div>
</body>
</html>
