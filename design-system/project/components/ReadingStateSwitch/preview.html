<!-- @dsCard group="Controls" height=100 subtitle="Single / Comparison — the only pill-radius control in the system" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-canvas); padding: var(--space-6); display: flex; align-items: center; height: 68px; }
  .track { display: inline-flex; padding: 3px; background: var(--surface-sunken); border: var(--border-width-hairline) solid var(--border-hairline); border-radius: var(--radius-pill); }
  .thumb { padding: var(--space-2) var(--space-5); border-radius: var(--radius-pill); color: var(--ink-secondary); cursor: default; }
  .thumb.active { background: var(--accent-greek-700); color: var(--ink-on-accent); }
</style>
</head>
<body>
  <div class="track ui-body">
    <span class="thumb active">単一表示</span>
    <span class="thumb">比較表示</span>
  </div>
</body>
</html>
