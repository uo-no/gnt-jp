<!-- @dsCard group="Foundations" height=220 subtitle="Green = Greek (live) · Red = Hebrew (reserved, not used yet)" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--surface-canvas); padding: var(--space-6); }
  .row { display: flex; gap: var(--space-4); margin-bottom: var(--space-4); align-items: center; }
  .label { width: 220px; color: var(--ink-secondary); }
  .swatches { display: flex; gap: var(--space-2); }
  .sw { width: 44px; height: 44px; border-radius: var(--radius-md); border: var(--border-width-hairline) solid var(--border-hairline); }
  .note { color: var(--ink-tertiary); margin-top: var(--space-2); }
</style>
</head>
<body>
  <div class="row">
    <span class="label ui-label">聖書［緑版］ — Greek (live)</span>
    <div class="swatches">
      <div class="sw" style="background:var(--accent-greek-050)"></div>
      <div class="sw" style="background:var(--accent-greek-100)"></div>
      <div class="sw" style="background:var(--accent-greek-300)"></div>
      <div class="sw" style="background:var(--accent-greek-600)"></div>
      <div class="sw" style="background:var(--accent-greek-700)"></div>
    </div>
  </div>
  <div class="row">
    <span class="label ui-label">聖書［赤版］ — Hebrew (reserved)</span>
    <div class="swatches">
      <div class="sw" style="background:var(--accent-hebrew-050)"></div>
      <div class="sw" style="background:var(--accent-hebrew-100)"></div>
      <div class="sw" style="background:var(--accent-hebrew-300)"></div>
      <div class="sw" style="background:var(--accent-hebrew-600)"></div>
      <div class="sw" style="background:var(--accent-hebrew-700)"></div>
    </div>
  </div>
  <div class="note ui-caption">Same 5-step structure (050 / 100 / 300 / 600 / 700), same semantic roles. A future 赤版 swaps the active Product Accent family — the rest of the system is unchanged.</div>
</body>
</html>
