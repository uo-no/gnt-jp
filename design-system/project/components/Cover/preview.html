<!-- @dsCard height=320 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--surface-canvas); width: 960px; height: 320px; }
  .brand { fill: var(--accent-greek-700); }
  .ink { fill: var(--ink-primary); }
  .tint { fill: var(--accent-greek-100); }
  .relief { fill: var(--structural-function-fill); }
  .line { stroke: var(--structural-connector); fill: none; stroke-width: 1.5; }
  .name { fill: var(--ink-primary); font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .tagline { fill: var(--ink-tertiary); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
</style>
</head>
<body>
<!--
  blocks: accent-greek-700 slab (radius-lg) + ink-primary slab (radius-md) + accent-greek-100 slab (radius-md), staggered right of x=480
  arrangement: one tall green slab top-right, two smaller slabs (ink, tint) beneath it, flush left edge at x=520 — mirrors a structural node with two children
  pattern: three concentric rounded rects (structural-connector stroke, no fill) nested top-right, echoing the StructuralNode component's own nesting motif — the product's most distinctive shape, not a generic device
  scales: radius-lg / radius-md from tokens.json; gaps at space-4/space-6; steps of accent-greek 700→100 plus ink-primary for the third slab
-->
<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="320" fill="var(--surface-canvas)"/>

  <rect class="brand" x="520" y="36" width="300" height="148" rx="16"/>
  <rect class="ink" x="520" y="200" width="142" height="84" rx="8"/>
  <rect class="tint" x="678" y="200" width="142" height="84" rx="8"/>

  <rect class="line" x="742" y="16" width="180" height="108" rx="14"/>
  <rect class="line" x="766" y="36" width="132" height="72" rx="10"/>
  <rect class="line" x="790" y="54" width="84" height="40" rx="6"/>

  <text class="name" x="40" y="248" font-size="64" font-weight="500" letter-spacing="1">聖書［緑版］</text>
  <text class="tagline" x="40" y="278" font-size="14">The Bible remains the visual foreground.</text>
</svg>
</body>
</html>
