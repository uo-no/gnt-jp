name: VR-5 Regression Gate

# 責務分離:
#   path-check.yml        = repository structure（旧パス参照の検出）
#   vr5-regression-gate   = runtime contract regression（Flow DOM 契約・Reading Japanese 出力・構文・apparatus）
# 回帰スクリプト（test:re-apparatus, test:re-apparatus-ja）は Node.js built-in のみを使用するため
# npm install 不要で直接実行できる。
# 再現性確認（test:re-apparatus-reproduce）は @xmldom/xmldom を必要とするため npm ci を先行実行する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vr5-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PR base for old-vs-new scorer comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          sparse-checkout: public/core/syntax-analyzer.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax CheckEvaluator three-valued regression
        run: npm run test:syntax-tristate

      - name: Whole-NT syntax scorer old-vs-new score and rank comparison
        if: github.event_name == 'pull_request'
        env:
          SYNTAX_BASELINE_DIR: baseline
        run: npm run test:syntax-score-compare

      - name: Upload whole-NT syntax score comparison report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: syntax-score-compare-report
          path: syntax-score-compare-report.json
          if-no-files-found: ignore

      - name: Flow DOM transition regression（VR-5-H-7 保護ゲート）
        run: npm run test:flow-dom

      - name: Reading Japanese Stage B regression（NT 全巻バイト等価）
        run: npm run test:re-stageB

      - name: Path audit（旧パス参照の検出）
        run: npm run audit

      - name: Apparatus data static regression（entryCount・構造・書巻別件数）
        run: npm run test:re-apparatus

      - name: Apparatus Japanese annotations regression（件数・タグ・保留分類）
        run: npm run test:re-apparatus-ja

      - name: Install devDependencies（apparatus build reproducibility）
        run: npm ci

      - name: Apparatus build reproducibility（XML→JSON 再現性、_meta.generatedAt を除く全フィールド一致）
        run: npm run test:re-apparatus-reproduce
