name: VR-5 Regression Gate

# 責務分離:
#   path-check.yml        = repository structure（旧パス参照の検出）
#   vr5-regression-gate   = runtime contract regression（Flow DOM 契約・Reading Japanese 出力・構文・apparatus）
# 回帰スクリプト（test:re-apparatus, test:re-apparatus-ja）は Node.js built-in のみを使用するため
# npm install 不要で直接実行できる。
# 再現性確認（test:re-apparatus-reproduce）は @xmldom/xmldom を必要とするため npm ci を先行実行する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vr5-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PR base analyzer and syntax registry for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          sparse-checkout: |
            public/core/syntax-analyzer.js
            public/assets/data/syntax-registry.json
          sparse-checkout-cone-mode: false

      - name: Checkout pre-evidence-gate analyzer for genitive delta audit
        uses: actions/checkout@v4
        with:
          ref: 43d34c6161e20e87814041c9d122528b00293693
          path: baseline-pre-gate
          sparse-checkout: |
            public/core/syntax-analyzer.js
            public/assets/data/syntax-registry.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Perfect dramatic context weighting regression
        run: npm run test:syntax-perfect-dramatic

      - name: Syntax registry condition-to-signal link regression
        run: npm run test:syntax-registry-condition-links

      - name: Syntax evidence-gating regression
        run: npm run test:syntax-evidence-gating

      - name: required_signal_groups runtime contract regression
        run: node scripts/required-signal-groups-regression.cjs

      - name: MRK 6:23 half-quantity partitive runtime regression
        run: node scripts/half-quantity-partitive-regression.cjs

      # Historical inventory only: this legacy suite has unresolved expectations tracked in Issue #410.
      # Keep it non-blocking while capturing the exact-SHA failure list; do not confuse it with VR-5 pass/fail.
      - name: Issue #410 legacy genitive regression inventory（非ブロッキング・失敗一覧を保存）
        id: issue410-legacy-inventory
        continue-on-error: true
        run: |
          set +e
          node scripts/genitive-regression-test.cjs > issue-410-genitive-regression-report.txt 2>&1
          rc=$?
          echo "\\nEXIT_CODE=$rc" >> issue-410-genitive-regression-report.txt
          cat issue-410-genitive-regression-report.txt
          exit 0

      - name: Upload Issue #410 legacy regression inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-410-genitive-regression-inventory
          path: issue-410-genitive-regression-report.txt
          if-no-files-found: warn

      - name: StudyPanel evidence-note regression
        run: npm run test:studypanel-evidence-notes

      - name: StudyPanel evidence-first audit（新約全体の候補・根拠シグナル）
        run: npm run audit:studypanel-evidence-first -- --verbose --strict-evidence

      - name: Whole-NT token-level genitive source/separation delta audit
        run: node scripts/studypanel-genitive-delta-audit.cjs --baseline-dir=baseline-pre-gate

      - name: Upload whole-NT genitive delta report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypanel-genitive-delta-report
          path: studypanel-genitive-delta-report.json
          if-no-files-found: ignore

      - name: Audit published bare-source-genitive examples against Context API
        run: node scripts/studypanel-bare-source-genitive-context-audit.cjs

      - name: Upload bare-source-genitive context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypanel-bare-source-genitive-context-report
          path: studypanel-bare-source-genitive-context-report.json
          if-no-files-found: ignore

      - name: Audit published bare-source-genitive examples against Lowfat frame/tree annotations
        run: node scripts/studypanel-bare-source-genitive-flowtree-audit.cjs

      - name: Upload bare-source-genitive flow-tree report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypanel-bare-source-genitive-flowtree-report
          path: studypanel-bare-source-genitive-flowtree-report.json
          if-no-files-found: ignore

      - name: Audit NT-wide genitive coverage in Lowfat flow trees
        run: node scripts/studypanel-nt-genitive-flowtree-coverage.cjs

      - name: Upload NT-wide genitive flow-tree coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypanel-nt-genitive-flowtree-coverage-report
          path: studypanel-nt-genitive-flowtree-coverage-report.json
          if-no-files-found: ignore

      - name: Detect changes specific to dramatic-perfect context regression
        if: github.event_name == 'pull_request'
        id: dramatic-perfect-paths
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            dramatic_perfect:
              - 'scripts/syntax-perfect-dramatic-context-regression.cjs'
              - 'scripts/syntax-perfect-dramatic-context-compare.cjs'

      - name: Whole-NT comparison for weighted dramatic-perfect context
        if: github.event_name == 'pull_request' && steps.dramatic-perfect-paths.outputs.dramatic_perfect == 'true'
        run: npm run test:syntax-perfect-dramatic-compare
        env:
          SYNTAX_BASELINE_DIR: baseline

      - name: Upload weighted dramatic-perfect context report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: syntax-perfect-dramatic-context-report
          path: syntax-perfect-dramatic-context-report.json
          if-no-files-found: ignore

      - name: Flow DOM transition regression（VR-5-H-7 保護ゲート）
        run: npm run test:flow-dom

      - name: Reading Japanese Stage B regression（NT 全巻バイト等価）
        run: npm run test:re-stageB

      - name: Path audit（旧パス参照の検出）
        run: npm run audit

      - name: Apparatus data static regression（entryCount・構造・書巻別件数）
        run: npm run test:re-apparatus

      - name: Apparatus Japanese annotations regression（件数・タグ・保留分類）
        run: npm run test:re-apparatus-ja

      - name: Install devDependencies（apparatus build reproducibility）
        run: npm ci

      - name: Apparatus build reproducibility（XML→JSON 再現性、_meta.generatedAt を除く全フィールド一致）
        run: npm run test:re-apparatus-reproduce

      - name: Install Playwright for StudyPanel browser verification
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start static Bible app server
        run: |
          nohup python3 -m http.server 8765 --directory public >/tmp/gnt-jp-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8765/?book=EPH&ch=1' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gnt-jp-server.log
          exit 1

      - name: StudyPanel evidence-note browser regression（PC / mobile）
        run: npm run test:browser-evidence-notes

      - name: StudyPanel Layer 3 inventory browser audit（PC / mobile）
        run: npm run test:browser-layer3

      - name: Upload StudyPanel Layer 3 audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypanel-layer3-audit-screenshots
          path: /tmp/gnt-jp-layer3/*.png
          if-no-files-found: ignore

      - name: Upload StudyPanel evidence-note screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypanel-evidence-note-screenshots
          path: /tmp/gnt-jp-evidence-note/*.png
          if-no-files-found: ignore
