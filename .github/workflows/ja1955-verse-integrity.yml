name: JA1955 verse integrity audit

on:
  pull_request:
    paths:
      - 'public/translations/JA1955/**'
      - 'public/bible_data/nt/**'
      - 'public/books.json'
      - 'scripts/audit-ja1955-verse-integrity.cjs'
      - '.github/workflows/ja1955-verse-integrity.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare JA1955 verse coverage with Greek NT
        run: node scripts/audit-ja1955-verse-integrity.cjs
